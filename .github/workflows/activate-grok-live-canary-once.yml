name: Activate Grok LIVE Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-grok-live-canary-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-grok-known-assets-testing-bot
  cancel-in-progress: false

jobs:
  activate:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Sync Grok LIVE and Telegram runtime
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"
          ROOT=/home/ayman01323/BOOT/testingbots/grok_known_assets_bot
          BASE="https://raw.githubusercontent.com/ayman01323/boot-trading-bot/${SHA}/testingbots/grok_known_assets_bot"
          sudo systemctl stop grok-known-assets-canary.service 2>/dev/null || true
          sudo systemctl stop grok-known-assets-telegram.service 2>/dev/null || true
          files=(
            pyproject.toml
            src/grok_known_assets_bot/control.py
            src/grok_known_assets_bot/live_canary.py
            src/grok_known_assets_bot/live_canary_runner.py
            src/grok_known_assets_bot/live_execution.py
            src/grok_known_assets_bot/live_readiness.py
            src/grok_known_assets_bot/telegram_control.py
            src/grok_known_assets_bot/telegram_control_runtime.py
            systemd/grok-known-assets-canary.service.example
            systemd/grok-known-assets-telegram.service.example
            tests/test_live_canary.py
            tests/test_live_canary_exit_balance.py
            tests/test_live_canary_post715_hardening.py
          )
          for rel in "${files[@]}"; do
            mkdir -p "$ROOT/$(dirname "$rel")"
            curl -fsSL --retry 3 --connect-timeout 10 "$BASE/$rel" -o "$ROOT/$rel.sync"
            test -s "$ROOT/$rel.sync"
            mv "$ROOT/$rel.sync" "$ROOT/$rel"
          done
          grep -q 'Ticket ID:' "$ROOT/src/grok_known_assets_bot/telegram_control_runtime.py"
          grep -q 'APPROVE EXACTLY:' "$ROOT/src/grok_known_assets_bot/telegram_control_runtime.py"
          grep -q 'from_user_id: str | None = None' "$ROOT/src/grok_known_assets_bot/telegram_control_runtime.py"
          grep -q 'LIVE_READY_MISSING_INVARIANTS' "$ROOT/src/grok_known_assets_bot/live_canary_runner.py"

      - name: Install and test LIVE runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/ayman01323/BOOT/testingbots/grok_known_assets_bot
          cd "$ROOT"
          .venv/bin/pip install -q \
            'requests>=2.32,<3' 'python-dotenv>=1.0,<2' 'web3>=7.0,<8' \
            'cryptography>=42,<46' 'solders>=0.28,<0.29' 'PyYAML>=6.0,<7' \
            'websockets>=15,<16' 'base58>=2.1' -e '.[live]'
          .venv/bin/python -m pytest -q \
            tests/test_live_canary.py \
            tests/test_live_canary_exit_balance.py \
            tests/test_live_canary_post715_hardening.py
          .venv/bin/python - <<'PY'
          from grok_known_assets_bot import telegram_control_runtime as rt
          good={
              'approval_id':'ticket-test-123',
              'target_lamports':9000000,
              'input_micro_usdc':931079,
              'min_out_lamports':8955543,
          }
          msg=rt._event_alert_text('CANARY_PENDING','solana:SOL:NATIVE',good) or ''
          assert 'Ticket ID: ticket-test-123' in msg
          assert '/grokapprove ticket-test-123 CONFIRM' in msg
          bad=rt._event_alert_text('CANARY_PENDING','solana:SOL:NATIVE',{'approval_id':'bad','target_lamports':9000000}) or ''
          assert 'MALFORMED APPROVAL BLOCKED' in bad
          print('telegram_approval_message=PASS')
          PY

      - name: Clear stale approvals and arm guarded LIVE state
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/ayman01323/BOOT/testingbots/grok_known_assets_bot
          cd "$ROOT"
          .venv/bin/python - <<'PY'
          import sqlite3
          from grok_known_assets_bot import live_canary as lc
          from grok_known_assets_bot.control import save_state
          db=sqlite3.connect('state.sqlite3',timeout=8)
          lc.ensure_schema(db)
          if lc.needs_reconciliation(db):
              raise SystemExit('BLOCKED: reconciliation required')
          print('cancelled_stale_approvals='+str(lc.cancel_unclaimed(db, reason='telegram-ticket-id-fix')))
          db.close()
          state=save_state(armed=True,live_readiness_enabled=True,live_canary_enabled=True,updated_by='github-ticket-id-fix')
          if not state.get('live_money_enabled'):
              raise SystemExit('BLOCKED: LIVE state did not arm')
          print('live_money_state=ARMED_APPROVAL_GATED')
          PY

      - name: Install and restart services
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/ayman01323/BOOT/testingbots/grok_known_assets_bot
          sudo install -m 0644 "$ROOT/systemd/grok-known-assets-canary.service.example" /etc/systemd/system/grok-known-assets-canary.service
          sudo install -m 0644 "$ROOT/systemd/grok-known-assets-telegram.service.example" /etc/systemd/system/grok-known-assets-telegram.service
          sudo mkdir -p /etc/systemd/system/grok-known-assets-canary.service.d
          printf '%s\n' '[Service]' \
            'Environment=GROK_BOOT_REPO_ROOT=/home/ayman01323/BOOT/testingbots/learn' \
            'Environment=GROK_LEARNERBOT_CSV_DIR=/home/ayman01323/BOOT/testingbots/learn/CSVbot' \
            'Environment=GROK_LEARNERBOT_DATA_DIR=/home/ayman01323/BOOT/testingbots/learn/data' \
            | sudo tee /etc/systemd/system/grok-known-assets-canary.service.d/10-isolated-signer.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable grok-known-assets-canary.service grok-known-assets-telegram.service
          sudo systemctl restart grok-known-assets-canary.service
          sudo systemctl restart grok-known-assets-telegram.service
          sleep 7
          for svc in grok-known-assets-canary.service grok-known-assets-telegram.service; do
            if ! sudo systemctl is-active --quiet "$svc"; then
              sudo systemctl status "$svc" --no-pager -l || true
              sudo journalctl -u "$svc" -n 80 --no-pager || true
              exit 1
            fi
          done
          echo 'GROK_LIVE_CANARY=ACTIVE'
          echo 'TELEGRAM_APPROVAL_REQUEST=FULL_TICKET_ID_AND_COMMAND'
          echo 'SIGNING=ENABLED_APPROVAL_GATED'
          echo 'BROADCAST=ENABLED_APPROVAL_GATED'
          echo 'ZERO_VALUE_APPROVAL=BLOCKED'
