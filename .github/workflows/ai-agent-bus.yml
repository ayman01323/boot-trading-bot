name: Event-Driven AI Agent Bus

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ai-agent-bus.yml'
      - 'scripts/ai_agent_bus.py'
      - 'scripts/ai_agent_bus_pending.py'
      - 'tests/test_ai_agent_bus_delivery_fallback.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-agent-bus.yml'
      - 'scripts/ai_agent_bus.py'
      - 'scripts/ai_agent_bus_pending.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialise all bus work so instant, PR-smoke, push and polling fallbacks cannot
# process the same message at the same time. Every run re-checks issue #333 by
# message_id before calling/publishing, so duplicate triggers become no-ops.
concurrency:
  group: ai-agent-bus
  cancel-in-progress: false

jobs:
  route:
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.issue.number == 333 &&
        (github.event.comment.user.login == github.repository_owner ||
         github.event.comment.user.login == 'github-actions[bot]'))) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    env:
      BUS_VENV: /tmp/ai-agent-bus-${{ github.run_id }}

    steps:
      - name: Check out trusted bus code without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Find latest unanswered AI bus message
        id: pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ai_agent_bus_pending.py select-live \
            --repo "$GITHUB_REPOSITORY" \
            --owner "$REPO_OWNER" \
            --message-output /tmp/ai-bus-message.md \
            > /tmp/ai-bus-pending.env
          cat /tmp/ai-bus-pending.env >> "$GITHUB_OUTPUT"

      - name: Build isolated Python environment
        if: steps.pending.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUS_VENV"
          python3 -m venv "$BUS_VENV"
          "$BUS_VENV/bin/python" -m pip install --disable-pip-version-check -q python-dotenv

      - name: Validate bounded bus message
        if: steps.pending.outputs.pending == 'true'
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          "$BUS_VENV/bin/python" scripts/ai_agent_bus.py \
            --input /tmp/ai-bus-message.md \
            --output /tmp/unused.md \
            --preflight > /tmp/ai-bus-preflight.env
          cat /tmp/ai-bus-preflight.env >> "$GITHUB_OUTPUT"

      - name: Set up Node only when Copilot may be addressed
        if: steps.pending.outputs.pending == 'true' && steps.preflight.outputs.needs_copilot == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bounded Copilot CLI only when needed
        if: steps.pending.outputs.pending == 'true' && steps.preflight.outputs.needs_copilot == 'true'
        shell: bash
        run: npm install -g @github/copilot@latest

      - name: Route message to addressed provider(s)
        if: steps.pending.outputs.pending == 'true'
        id: route
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_COUNCIL_MODEL: ${{ vars.OPENAI_COUNCIL_MODEL || 'gpt-5.6-terra' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_COUNCIL_MODEL: ${{ vars.ANTHROPIC_COUNCIL_MODEL || vars.CLAUDE_MASTER_MODEL || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_COUNCIL_MODEL: ${{ vars.GEMINI_COUNCIL_MODEL || 'gemini-3.7-flash' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_COUNCIL_MODEL: ${{ vars.DEEPSEEK_VPS_MODEL || 'deepseek-chat' }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          AI_COUNCIL_RUNTIME_ENV: /tmp/ai-bus-no-runtime.env
        shell: bash
        run: |
          set +e
          "$BUS_VENV/bin/python" scripts/ai_agent_bus.py \
            --input /tmp/ai-bus-message.md \
            --output /tmp/ai-bus-reply.md \
            2>/tmp/ai-bus-error.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ $rc -ne 0 || ! -s /tmp/ai-bus-reply.md ]]; then
            cat > /tmp/ai-bus-reply.md <<EOF
          AI_BUS_REPLY
          message_id: ${{ steps.pending.outputs.message_id }}
          from: BUS
          to: USER
          status: BLOCKED
          provider_calls: 0

          The trusted AI bus could not complete this message. No provider action, deployment, trading action, wallet action, or runtime change was authorised by this failure. Inspect the GitHub Actions run for the bounded router error.
          EOF
          fi
          exit 0

      - name: Post auditable reply to the AI bus issue
        if: steps.pending.outputs.pending == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          # Re-check immediately before publishing so delayed duplicate triggers
          # cannot post a second reply for the same message id.
          if python3 scripts/ai_agent_bus_pending.py has-reply-live \
              --repo "$GITHUB_REPOSITORY" \
              --owner "$REPO_OWNER" \
              --message-id "${{ steps.pending.outputs.message_id }}"; then
            echo "Reply already exists for ${{ steps.pending.outputs.message_id }}; skipping duplicate publish."
            exit 0
          fi
          python3 scripts/ai_agent_bus_pending.py post-reply \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/ai-bus-reply.md

      - name: Remove isolated Python environment
        if: always()
        shell: bash
        run: rm -rf "$BUS_VENV"

      - name: Publish compact run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AI Agent Bus'
            echo
            echo "Event: **${GITHUB_EVENT_NAME}**"
            echo "Pending message: **${{ steps.pending.outputs.pending || 'false' }}**"
            echo "Message ID: \`${{ steps.pending.outputs.message_id || 'none' }}\`"
            echo "Target: **${{ steps.preflight.outputs.target || 'none' }}**"
            echo "Mode: **${{ steps.preflight.outputs.mode || 'none' }}**"
            echo "Copilot setup needed: **${{ steps.preflight.outputs.needs_copilot || 'false' }}**"
            echo "Router return code: **${{ steps.route.outputs.rc || 'not-run' }}**"
          } >> "$GITHUB_STEP_SUMMARY"
