name: Deploy Local AI Agent WebSocket Bus

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ai_agent_ws_bus.py'
      - 'scripts/ai_agent_ws_worker.py'
      - 'scripts/ai_agent_ws_send.py'
      - 'scripts/install_ai_agent_ws_bus.sh'
      - 'learnerbot/ai_council.py'
      - 'learnerbot/ai_council_http_patch.py'
      - 'AI_AGENT_MESSAGING.md'
      - '.github/workflows/ai-agent-ws-bus-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-local-ai-agent-ws-bus
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 8
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install and restart local bus
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then
            bash scripts/install_ai_agent_ws_bus.sh "$GITHUB_WORKSPACE"
          elif sudo -n true 2>/dev/null; then
            sudo -n bash scripts/install_ai_agent_ws_bus.sh "$GITHUB_WORKSPACE"
          else
            echo 'Self-hosted runner needs root or passwordless sudo to install systemd services.' >&2
            exit 1
          fi

      - name: Verify services without provider calls
        shell: bash
        run: |
          set -euo pipefail
          run_root() {
            if [[ "$(id -u)" -eq 0 ]]; then "$@"; else sudo -n "$@"; fi
          }
          run_root systemctl is-active --quiet boot-ai-agent-bus.service
          for agent in gpt claude gemini deepseek copilot; do
            run_root systemctl is-active --quiet "boot-ai-agent-worker@${agent}.service"
          done
          echo 'Local AI agent WebSocket bus and all recipient workers are active.'

      - name: Record deployment result on ai-mailbox
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          path = '.github/ai-mailbox/ws-bus-deploy-status.json'
          branch = 'ai-mailbox'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'boot-ai-agent-ws-deploy',
          }
          existing_sha = ''
          try:
              req = urllib.request.Request(api + '?ref=' + urllib.parse.quote(branch), headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  existing_sha = str(json.load(resp).get('sha') or '')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          status = {
              'schema_version': 1,
              'status': os.environ['JOB_STATUS'].upper(),
              'source_sha': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
              'verified_services': [
                  'boot-ai-agent-bus.service',
                  'boot-ai-agent-worker@gpt.service',
                  'boot-ai-agent-worker@claude.service',
                  'boot-ai-agent-worker@gemini.service',
                  'boot-ai-agent-worker@deepseek.service',
                  'boot-ai-agent-worker@copilot.service',
              ] if os.environ['JOB_STATUS'] == 'success' else [],
              'checked_epoch': int(time.time()),
          }
          content = json.dumps(status, indent=2, sort_keys=True) + '\n'
          payload = {
              'message': f"AI WebSocket bus deploy {status['status'].lower()} {status['source_sha'][:12]}",
              'content': base64.b64encode(content.encode()).decode(),
              'branch': branch,
          }
          if existing_sha:
              payload['sha'] = existing_sha
          req = urllib.request.Request(
              api,
              data=json.dumps(payload).encode(),
              headers={**headers, 'Content-Type': 'application/json'},
              method='PUT',
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              json.load(resp)
          PY
