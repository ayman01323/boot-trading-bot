name: Verify Local AI Agent WebSocket Bus

on:
  workflow_run:
    workflows: [Deploy BOOT to VPS]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-local-ai-agent-ws-bus
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 3
    steps:
      - name: Verify loopback broker without model calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, socket, time
          deadline = time.monotonic() + 90
          last = ''
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(('127.0.0.1', 8765), timeout=1.0):
                      pass
                  status = {}
                  try:
                      with open('/var/tmp/boot/ai_agent_ws_status.json', encoding='utf-8') as fh:
                          status = json.load(fh)
                  except Exception as exc:
                      status = {'state': 'PORT_OPEN', 'detail': f'status file unavailable: {type(exc).__name__}'}
                  state = str(status.get('state') or '')
                  if state in {'ACTIVE', 'EXTERNAL', 'PORT_OPEN'}:
                      print(json.dumps(status, sort_keys=True))
                      raise SystemExit(0)
                  last = json.dumps(status, sort_keys=True)
              except OSError as exc:
                  last = f'{type(exc).__name__}: {exc}'
              time.sleep(3)
          raise SystemExit('WebSocket broker unavailable on 127.0.0.1:8765; last=' + last)
          PY

      - name: Record verified result on ai-mailbox
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request
          repo = os.environ['REPO']; token = os.environ['GH_TOKEN']
          path = '.github/ai-mailbox/ws-bus-deploy-status.json'; branch = 'ai-mailbox'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'boot-ai-agent-ws-verify',
          }
          existing_sha = ''
          try:
              req = urllib.request.Request(api + '?ref=' + urllib.parse.quote(branch), headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  existing_sha = str(json.load(resp).get('sha') or '')
          except urllib.error.HTTPError as exc:
              if exc.code != 404: raise
          status = {
              'schema_version': 2,
              'status': os.environ['JOB_STATUS'].upper(),
              'source_sha': os.environ.get('DEPLOYED_SHA') or '',
              'run_id': os.environ['RUN_ID'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
              'transport': 'loopback-websocket',
              'endpoint': 'ws://127.0.0.1:8765',
              'routing_model_calls': 0,
              'checked_epoch': int(time.time()),
          }
          content = json.dumps(status, indent=2, sort_keys=True) + '\n'
          payload = {
              'message': f"AI WebSocket bus verify {status['status'].lower()} {status['source_sha'][:12]}",
              'content': base64.b64encode(content.encode()).decode(),
              'branch': branch,
          }
          if existing_sha: payload['sha'] = existing_sha
          req = urllib.request.Request(api, data=json.dumps(payload).encode(), headers={**headers, 'Content-Type':'application/json'}, method='PUT')
          with urllib.request.urlopen(req, timeout=20) as resp: json.load(resp)
          PY
