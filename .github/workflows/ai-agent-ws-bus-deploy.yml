name: Verify Local AI Agent WebSocket Bus

on:
  workflow_run:
    workflows: [Deploy BOOT to VPS]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-local-ai-agent-ws-bus
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 3
    steps:
      - name: Verify loopback broker without model calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, socket, time
          deadline = time.monotonic() + 90
          last = ''
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(('127.0.0.1', 8765), timeout=1.0):
                      pass
                  status = {}
                  try:
                      with open('/var/tmp/boot/ai_agent_ws_status.json', encoding='utf-8') as fh:
                          status = json.load(fh)
                  except Exception as exc:
                      status = {'state': 'PORT_OPEN', 'detail': f'status file unavailable: {type(exc).__name__}'}
                  state = str(status.get('state') or '')
                  if state in {'ACTIVE', 'EXTERNAL', 'PORT_OPEN'}:
                      print(json.dumps(status, sort_keys=True))
                      raise SystemExit(0)
                  last = json.dumps(status, sort_keys=True)
              except OSError as exc:
                  last = f'{type(exc).__name__}: {exc}'
              time.sleep(3)
          raise SystemExit('WebSocket broker unavailable on 127.0.0.1:8765; last=' + last)
          PY

  sirisky_auto_live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install and arm SiRisky automatic LIVE
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          test -f scripts/install_sirisky_governed_live_ops.sh
          sudo -n true
          sudo -n env ARM_NOW=1 bash "$GITHUB_WORKSPACE/scripts/install_sirisky_governed_live_ops.sh"

      - name: Verify manual approval is removed
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n bash -lc '
            set -Eeuo pipefail
            R=/root/SiRisky/CSV/runtime.csv
            value() { awk -F, -v key="$1" '\''$1==key {gsub(/\r/,"",$2); print $2}'\'' "$R"; }
            test "$(value trading_mode)" = LIVE
            test "$(value live_enabled)" = 1
            test "$(value broadcast_enabled)" = 1
            test "$(value manual_approval_enabled)" = 0
            test "$(value armed_manual_approval)" = 0
            test "$(value manual_approval_require_external_signature)" = 0
            test "$(value telegram_manual_run_enabled)" = 0
            systemctl is-active --quiet sirisky.service
            echo "=== VERIFIED SIRISKY AUTO LIVE ==="
            echo "service=$(systemctl is-active sirisky.service)"
            echo "trading_mode=$(value trading_mode)"
            echo "live_enabled=$(value live_enabled)"
            echo "broadcast_enabled=$(value broadcast_enabled)"
            echo "manual_approval_enabled=$(value manual_approval_enabled)"
            echo "armed_manual_approval=$(value armed_manual_approval)"
            echo "manual_approval_require_external_signature=$(value manual_approval_require_external_signature)"
            echo "telegram_manual_run_enabled=$(value telegram_manual_run_enabled)"
          '
