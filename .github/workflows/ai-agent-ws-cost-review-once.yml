name: One-Time WebSocket Agent Cost Review
# Deliberately fires only when this workflow file itself changes.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-agent-ws-cost-review-once.yml'

permissions:
  contents: write

concurrency:
  group: one-time-ai-agent-ws-cost-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 8
    steps:
      - name: Ask other agents through live loopback WebSocket bus
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/ai-ws-cost-review-$GITHUB_RUN_ID"
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          "$VENV/bin/python" - <<'PY'
          import asyncio, base64, json, os, time, urllib.error, urllib.parse, urllib.request
          from websockets.asyncio.client import connect

          TARGETS = ('claude', 'gemini', 'deepseek', 'copilot')
          QUESTION = (
              'We are choosing the cheapest practical production design for routine inter-agent messaging. '
              'The transport is now a local loopback WebSocket broker with SQLite durability and zero-model deterministic routing; '
              'only the addressed provider is invoked. Recommend: (1) your cheapest suitable routine model, '
              '(2) when to escalate to a stronger model, and (3) any cost/reliability improvement. Be concise.'
          )

          async def ask(target: str):
              message_id = f'gpt-cost-review-{target}-{int(time.time())}'
              result = {'target': target, 'message_id': message_id, 'acknowledged': False, 'reply': '', 'error': ''}
              try:
                  async with connect('ws://127.0.0.1:8765', ping_interval=20, ping_timeout=20, max_size=32768) as ws:
                      await ws.send(json.dumps({'type':'register','agent':'gpt'}, separators=(',', ':')))
                      reg = json.loads(await asyncio.wait_for(ws.recv(), timeout=10))
                      if reg.get('type') != 'registered':
                          raise RuntimeError(f'registration failed: {reg}')
                      await ws.send(json.dumps({
                          'type':'send','message_id':message_id,'from':'gpt','to':target,'body':QUESTION
                      }, separators=(',', ':')))
                      deadline = asyncio.get_running_loop().time() + 120
                      while asyncio.get_running_loop().time() < deadline:
                          data = json.loads(await asyncio.wait_for(ws.recv(), timeout=max(1, deadline-asyncio.get_running_loop().time())))
                          if data.get('message_id') != message_id:
                              continue
                          if data.get('type') == 'status' and data.get('status') == 'ACKNOWLEDGED':
                              result['acknowledged'] = True
                          if data.get('type') == 'reply':
                              result['reply'] = str(data.get('body') or '')[:6000]
                              result['error'] = str(data.get('error') or '')[:1000]
                              return result
                      result['error'] = 'timeout waiting for reply'
              except Exception as exc:
                  result['error'] = f'{type(exc).__name__}: {exc}'[:1000]
              return result

          async def main():
              rows = []
              for target in TARGETS:
                  rows.append(await ask(target))
              return rows

          rows = asyncio.run(main())
          report = {
              'schema_version': 1,
              'transport': 'ws://127.0.0.1:8765',
              'routing_model_calls': 0,
              'question': QUESTION,
              'results': rows,
              'all_acknowledged': all(r['acknowledged'] for r in rows),
              'reply_count': sum(bool(r['reply']) for r in rows),
              'generated_epoch': int(time.time()),
              'run_id': os.environ['RUN_ID'],
          }
          print(json.dumps(report, indent=2, ensure_ascii=False))

          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          path='.github/ai-mailbox/ws-bus-live-cost-review.json'; branch='ai-mailbox'
          api=f'https://api.github.com/repos/{repo}/contents/{path}'
          headers={
              'Authorization':f'Bearer {token}', 'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28', 'User-Agent':'boot-ai-agent-ws-cost-review',
          }
          existing=''
          try:
              req=urllib.request.Request(api+'?ref='+urllib.parse.quote(branch),headers=headers)
              with urllib.request.urlopen(req,timeout=20) as resp: existing=str(json.load(resp).get('sha') or '')
          except urllib.error.HTTPError as exc:
              if exc.code != 404: raise
          content=json.dumps(report,indent=2,ensure_ascii=False,sort_keys=True)+'\n'
          payload={
              'message':'Record one-time WebSocket agent cost review',
              'content':base64.b64encode(content.encode()).decode(), 'branch':branch,
          }
          if existing: payload['sha']=existing
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=20) as resp: json.load(resp)
          PY
          rm -rf "$VENV"
