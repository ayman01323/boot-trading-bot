name: One-Time WebSocket Agent Greeting
# Communication-only smoke test. Fires only on the installation commit below.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-agent-ws-greeting-once.yml'

permissions:
  contents: write

concurrency:
  group: one-time-ai-agent-ws-greeting
  cancel-in-progress: true

jobs:
  greet:
    if: github.event.head_commit.message == 'Send GPT greetings over live WebSocket bus'
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 6
    steps:
      - name: Send direct greetings and record correlated receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/ai-ws-greeting-$GITHUB_RUN_ID"
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          "$VENV/bin/python" - <<'PY'
          import asyncio, base64, json, os, time, urllib.error, urllib.parse, urllib.request
          from websockets.asyncio.client import connect

          TARGETS = {
              'gemini': 'Hi Gemini.',
              'deepseek': 'Hi DeepSeek.',
          }

          async def ask(target: str, body: str):
              message_id = f'gpt-hi-{target}-{int(time.time())}'
              result = {
                  'target': target,
                  'message_id': message_id,
                  'accepted': False,
                  'delivered': False,
                  'acknowledged': False,
                  'replied': False,
                  'reply': '',
                  'error': '',
              }
              try:
                  async with connect('ws://127.0.0.1:8765', ping_interval=20, ping_timeout=20, max_size=32768) as ws:
                      await ws.send(json.dumps({'type':'register','agent':'gpt'}, separators=(',', ':')))
                      reg = json.loads(await asyncio.wait_for(ws.recv(), timeout=10))
                      if reg.get('type') != 'registered':
                          raise RuntimeError(f'registration failed: {reg}')
                      await ws.send(json.dumps({
                          'type':'send','message_id':message_id,'from':'gpt','to':target,'body':body
                      }, separators=(',', ':'), ensure_ascii=False))
                      deadline = asyncio.get_running_loop().time() + 120
                      while asyncio.get_running_loop().time() < deadline:
                          remaining = max(1, deadline - asyncio.get_running_loop().time())
                          data = json.loads(await asyncio.wait_for(ws.recv(), timeout=remaining))
                          if data.get('message_id') != message_id:
                              continue
                          kind = str(data.get('type') or '')
                          status = str(data.get('status') or '').upper()
                          if kind == 'accepted':
                              result['accepted'] = True
                          if status in {'DELIVERED','ACKNOWLEDGED','REPLIED'}:
                              result['delivered'] = True
                          if status in {'ACKNOWLEDGED','REPLIED'}:
                              result['acknowledged'] = True
                          if kind == 'reply':
                              result['replied'] = True
                              result['acknowledged'] = True
                              result['delivered'] = True
                              result['reply'] = str(data.get('body') or '')[:3000]
                              result['error'] = str(data.get('error') or '')[:1000]
                              return result
                          if kind == 'error':
                              result['error'] = str(data.get('error') or data)[:1000]
                              return result
                      result['error'] = 'timeout waiting for reply'
              except Exception as exc:
                  result['error'] = f'{type(exc).__name__}: {exc}'[:1000]
              return result

          async def main():
              rows = []
              for target, body in TARGETS.items():
                  rows.append(await ask(target, body))
              return rows

          rows = asyncio.run(main())
          report = {
              'schema_version': 1,
              'transport': 'ws://127.0.0.1:8765',
              'from': 'gpt',
              'communication_only': True,
              'results': rows,
              'all_acknowledged': all(r['acknowledged'] for r in rows),
              'all_replied': all(r['replied'] for r in rows),
              'generated_epoch': int(time.time()),
              'run_id': os.environ['RUN_ID'],
          }
          print(json.dumps(report, indent=2, ensure_ascii=False))

          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          path='.github/ai-mailbox/ws-gpt-greeting-receipt.json'; branch='ai-mailbox'
          api=f'https://api.github.com/repos/{repo}/contents/{path}'
          headers={
              'Authorization':f'Bearer {token}', 'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28', 'User-Agent':'boot-ai-agent-ws-greeting',
          }
          existing=''
          try:
              req=urllib.request.Request(api+'?ref='+urllib.parse.quote(branch),headers=headers)
              with urllib.request.urlopen(req,timeout=20) as resp:
                  existing=str(json.load(resp).get('sha') or '')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          content=json.dumps(report,indent=2,ensure_ascii=False,sort_keys=True)+'\n'
          payload={
              'message':'Record GPT WebSocket greeting receipt',
              'content':base64.b64encode(content.encode()).decode(),
              'branch':branch,
          }
          if existing:
              payload['sha']=existing
          req=urllib.request.Request(
              api,
              data=json.dumps(payload).encode(),
              headers={**headers,'Content-Type':'application/json'},
              method='PUT',
          )
          with urllib.request.urlopen(req,timeout=20) as resp:
              json.load(resp)
          PY
          rm -rf "$VENV"
