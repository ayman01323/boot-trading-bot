name: Sync AI Council Runtime Credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/ai-council-runtime-secrets.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-council-runtime-secrets
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
    steps:
      - name: Select a working Copilot credential without logging values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          selected=/tmp/copilot-runtime-selected-token
          status=/tmp/copilot-runtime-selection.env
          : > "$selected"
          : > "$status"
          bin=/var/tmp/boot-copilot-cli/bin/copilot

          try_token() {
            local label="$1" token="$2"
            [[ -n "$token" ]] || return 1
            [[ -x "$bin" ]] || return 1
            local work
            work="$(mktemp -d /tmp/copilot-runtime-auth.XXXXXX)"
            set +e
            (
              cd "$work"
              env -u GH_TOKEN -u GITHUB_TOKEN \
                COPILOT_GITHUB_TOKEN="$token" \
                timeout 90 "$bin" \
                  --no-auto-update \
                  --no-ask-user \
                  --no-custom-instructions \
                  --no-remote \
                  --no-remote-export \
                  -s -p 'Reply with exactly COPILOT_OK. Do not inspect files and do not use tools.' \
                  > /tmp/copilot-runtime-auth.out 2> /tmp/copilot-runtime-auth.err
            )
            local rc=$?
            set -e
            rm -rf "$work"
            if [[ $rc -eq 0 ]] && grep -Fxq 'COPILOT_OK' /tmp/copilot-runtime-auth.out; then
              printf '%s' "$token" > "$selected"
              chmod 600 "$selected"
              printf 'copilot_source=%s\ncopilot_auth_ok=true\n' "$label" > "$status"
              return 0
            fi
            return 1
          }

          if try_token copilot_github_token "${COPILOT_GITHUB_TOKEN:-}"; then
            :
          elif try_token copilot_assign_token "${COPILOT_ASSIGN_TOKEN:-}"; then
            :
          else
            printf 'copilot_source=none\ncopilot_auth_ok=false\n' > "$status"
          fi

          cat "$status" >> "$GITHUB_OUTPUT"
          echo "Copilot credential selection completed; auth_ok=$(grep '^copilot_auth_ok=' "$status" | cut -d= -f2-)"

      - name: Write root-readable runtime credential bridge without logging values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          target=/var/tmp/ai_council_runtime.env
          compat=/var/tmp/boot/ai_council_runtime.env
          tmp="$(mktemp /var/tmp/.ai-council-runtime.XXXXXX)"
          TARGET="$target" TMP="$tmp" python3 - <<'PY'
          import json, os, pathlib
          keys = (
              'OPENAI_API_KEY',
              'GEMINI_API_KEY',
              'ANTHROPIC_API_KEY',
              'DEEPSEEK_API_KEY',
              'XAI_API_KEY',
              'KIMI_API_KEY',
              'MOONSHOT_API_KEY',
          )
          path = pathlib.Path(os.environ['TMP'])
          lines = []
          for key in keys:
              value = str(os.environ.get(key) or '').strip()
              if value:
                  lines.append(f'{key}={json.dumps(value)}')
          selected = pathlib.Path('/tmp/copilot-runtime-selected-token')
          if selected.exists():
              value = selected.read_text(encoding='utf-8', errors='strict').strip()
              if value:
                  lines.append(f'COPILOT_GITHUB_TOKEN={json.dumps(value)}')
          path.write_text('\n'.join(lines) + ('\n' if lines else ''), encoding='utf-8')
          PY
          chmod 600 "$tmp"
          mv -f "$tmp" "$target"
          mkdir -p "$(dirname "$compat")"
          install -m 600 "$target" "$compat"
          rm -f /tmp/copilot-runtime-selected-token
          test -r "$target"
          test -r "$compat"

      - name: Publish redacted credential availability only
        shell: bash
        run: |
          set -euo pipefail
          target=/var/tmp/ai_council_runtime.env
          compat=/var/tmp/boot/ai_council_runtime.env
          TARGET="$target" COMPAT="$compat" python3 - <<'PY' > /tmp/ai-council-runtime-health.json
          import json, os, pathlib, time
          path = pathlib.Path(os.environ['TARGET'])
          compat = pathlib.Path(os.environ['COMPAT'])
          present = set()
          if path.exists():
              for line in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  if '=' in line:
                      present.add(line.split('=', 1)[0].strip())
          print(json.dumps({
              'checked_epoch': int(time.time()),
              'runtime_file_present': path.exists(),
              'runtime_file_mode': oct(path.stat().st_mode & 0o777) if path.exists() else '',
              'strategy_factory_runtime_file_present': compat.exists(),
              'strategy_factory_runtime_file_mode': oct(compat.stat().st_mode & 0o777) if compat.exists() else '',
              'providers': {
                  'gpt': 'OPENAI_API_KEY' in present,
                  'gemini': 'GEMINI_API_KEY' in present,
                  'claude': 'ANTHROPIC_API_KEY' in present,
                  'deepseek': 'DEEPSEEK_API_KEY' in present,
                  'grok': 'XAI_API_KEY' in present,
                  'kimi': ('KIMI_API_KEY' in present or 'MOONSHOT_API_KEY' in present),
                  'copilot': 'COPILOT_GITHUB_TOKEN' in present,
              },
          }, indent=2, sort_keys=True))
          PY

          path='health/ai_council_runtime.json'
          api="repos/${GITHUB_REPOSITORY}/contents/${path}"
          current="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=ai-reviews" 2>/dev/null || true)"
          sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/ai-council-runtime-health.json)"
          python3 - "$encoded" "$sha" <<'PY' > /tmp/ai-council-runtime-put.json
          import json, sys
          payload = {'message':'Update redacted AI Council runtime health','content':sys.argv[1],'branch':'ai-reviews'}
          if sys.argv[2]:
              payload['sha'] = sys.argv[2]
          print(json.dumps(payload))
          PY
          gh api --method PUT -H 'Accept: application/vnd.github+json' "$api" --input /tmp/ai-council-runtime-put.json >/dev/null
          cat /tmp/ai-council-runtime-health.json
