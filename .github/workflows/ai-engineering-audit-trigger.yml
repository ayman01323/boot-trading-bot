name: Trigger Three-Agent Engineering Audit

on:
  push:
    branches:
      - ops/ai-cycle
    paths:
      - '.ai/trigger/engineering-audit.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trigger-three-agent-engineering-audit
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch production engineering audit against main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run weekly-three-agent-bug-audit.yml --ref main
          echo "Dispatched Weekly Three-Agent Full-Bot Bug Audit on ref main."
