name: AI Health Preflight Overlay CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'learnerbot/ai_health_preflight_overlay_patch.py'
      - 'learnerbot/telegram_auto_updates_category_toggle_patch.py'
      - 'tests/test_ai_health_preflight_overlay.py'
      - '.github/workflows/ai-health-preflight-overlay-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile overlay modules
        run: |
          python -m py_compile \
            learnerbot/ai_health_preflight_overlay_patch.py \
            learnerbot/telegram_auto_updates_category_toggle_patch.py
      - name: Run focused regression tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          pytest -q tests/test_ai_health_preflight_overlay.py
