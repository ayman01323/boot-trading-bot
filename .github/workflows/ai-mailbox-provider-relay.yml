name: Strategy Factory Provider Relay
# Communication-only event bridge. Provider calls occur only for a new REQUEST message; no schedule or polling.

on:
  workflow_run:
    workflows: [Strategy Factory Provider Signal]
    types: [completed]
    branches: [ai-mailbox]
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-mailbox-provider-relay.yml'
      - '.github/workflows/ai-mailbox-provider-signal.yml'
      - 'scripts/ai_mailbox_provider_relay.py'
      - 'scripts/provider_git_mailbox_bridge.py'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Provider to relay, or all'
        required: false
        default: all
        type: choice
        options: [all, deepseek, gemini, grok, kimi, copilot]

permissions:
  contents: write

concurrency:
  group: strategy-factory-provider-relay-v3
  cancel-in-progress: false

jobs:
  relay:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # This is a GitHub/provider API relay only; keeping it off boot-vps prevents
    # communication work from starving production deploy/status operations.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        provider: [deepseek, gemini, grok, kimi, copilot]
    env:
      RELAY_VENV: /tmp/strategy-factory-provider-${{ matrix.provider }}-${{ github.run_id }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Respect manual provider selection
        id: selected
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.agent }}
          PROVIDER: ${{ matrix.provider }}
        shell: bash
        run: |
          set -euo pipefail
          requested="${REQUESTED:-all}"
          if [[ "$EVENT_NAME" == workflow_dispatch && "$requested" != all && "$requested" != "$PROVIDER" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out trusted current main without persisted credentials
        if: steps.selected.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Detect new fixed Strategy Factory fallback request
        if: steps.selected.outputs.run == 'true'
        id: mailbox
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/provider_git_mailbox_bridge.py select-live \
            --repo "$GITHUB_REPOSITORY" \
            --provider "$PROVIDER" \
            --message-output /tmp/strategy-factory-in.md \
            > /tmp/strategy-factory-meta.env
          cat /tmp/strategy-factory-meta.env >> "$GITHUB_OUTPUT"

      - name: Build isolated Python environment
        if: steps.mailbox.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RELAY_VENV"
          python3 -m venv "$RELAY_VENV"
          "$RELAY_VENV/bin/python" -m pip install --disable-pip-version-check -q python-dotenv

      - name: Install standalone Copilot CLI only when needed
        if: steps.mailbox.outputs.pending == 'true' && matrix.provider == 'copilot'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/copilot-cli"
          rm -rf "$prefix"
          curl -fsSL https://gh.io/copilot-install | PREFIX="$prefix" bash
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/copilot" --version

      - name: Ask provider once using fallback request content only
        if: steps.mailbox.outputs.pending == 'true'
        id: route
        env:
          PROVIDER: ${{ matrix.provider }}
          MESSAGE_ID: ${{ steps.mailbox.outputs.message_id }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # The compatibility layer maps the retired `deepseek-chat` alias to the
          # reasoning-oriented v4-flash model. Mailbox replies need ordinary
          # publishable message.content, so use the current v4-pro model here.
          # A larger bounded token budget lets reasoning finish before the final
          # answer without ever publishing reasoning_content.
          DEEPSEEK_COUNCIL_MODEL: deepseek-v4-pro
          DEEPSEEK_COUNCIL_MAX_TOKENS: '12000'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_COUNCIL_MODEL: ${{ vars.GEMINI_COUNCIL_MODEL || 'gemini-3.5-flash-lite' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_COUNCIL_MODEL: ${{ vars.XAI_COUNCIL_MODEL || 'grok-4.20-non-reasoning' }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_COUNCIL_MODEL: ${{ vars.KIMI_COUNCIL_MODEL || 'kimi-k2.6' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          AI_COUNCIL_RUNTIME_ENV: /tmp/strategy-factory-no-runtime.env
        shell: bash
        run: |
          set +e
          "$RELAY_VENV/bin/python" scripts/ai_mailbox_provider_relay.py \
            --provider "$PROVIDER" \
            --message-id "$MESSAGE_ID" \
            --source-sha "$SOURCE_SHA" \
            --input /tmp/strategy-factory-in.md \
            --output /tmp/strategy-factory-reply.md \
            2>/tmp/strategy-factory-error.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ $rc -ne 0 || ! -s /tmp/strategy-factory-reply.md ]]; then
            {
              echo "${PROVIDER^^}_TO_GPT"
              echo "in_reply_to: ${{ steps.mailbox.outputs.message_id }}"
              echo 'status: BLOCKED'
              echo "provider_return_code: $rc"
              echo
              echo 'Provider relay could not produce a sanitised reply.'
            } > /tmp/strategy-factory-reply.md
          fi
          exit 0

      - name: Publish provider reply to fixed fallback file
        if: steps.mailbox.outputs.pending == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENDER: ${{ matrix.provider }}
          MESSAGE_ID: ${{ steps.mailbox.outputs.message_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/provider_git_mailbox_bridge.py publish-live \
            --repo "$GITHUB_REPOSITORY" \
            --provider "$SENDER" \
            --request-id "$MESSAGE_ID" \
            --reply-file /tmp/strategy-factory-reply.md

      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf "$RELAY_VENV"

      - name: Relay summary
        if: always() && steps.selected.outputs.run == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
          PENDING: ${{ steps.mailbox.outputs.pending }}
          MESSAGE_ID: ${{ steps.mailbox.outputs.message_id }}
          ROUTER_RC: ${{ steps.route.outputs.rc }}
        shell: bash
        run: |
          {
            echo "## ${PROVIDER} Strategy Factory fallback relay"
            echo
            echo "Pending message: **${PENDING:-false}**"
            echo "Message ID: \`${MESSAGE_ID:-none}\`"
            echo "Provider return code: **${ROUTER_RC:-not-run}**"
            echo 'No scheduled polling is used.'
          } >> "$GITHUB_STEP_SUMMARY"
