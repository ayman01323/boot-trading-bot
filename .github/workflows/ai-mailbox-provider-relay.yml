name: AI Mailbox Provider Relay
# Coordination-only wake-up marker; no trading/runtime authority change.

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-mailbox-provider-relay.yml'
      - 'scripts/ai_mailbox_provider_relay.py'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Provider to relay, or all'
        required: false
        default: all
        type: choice
        options: [all, deepseek, gemini, copilot]

permissions:
  contents: write

concurrency:
  group: ai-mailbox-provider-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        provider: [deepseek, gemini, copilot]
    steps:
      - name: Respect manual provider selection
        id: selected
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.agent }}
          PROVIDER: ${{ matrix.provider }}
        shell: bash
        run: |
          set -euo pipefail
          requested="${REQUESTED:-all}"
          if [[ "$EVENT_NAME" == workflow_dispatch && "$requested" != all && "$requested" != "$PROVIDER" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out trusted current main
        if: steps.selected.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Read fixed mailbox files and detect pending message
        if: steps.selected.outputs.run == 'true'
        id: mailbox
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
        shell: bash
        run: |
          set -euo pipefail
          in_path=".github/ai-mailbox/gpt-to-${PROVIDER}.md"
          out_path=".github/ai-mailbox/${PROVIDER}-to-gpt.md"

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${in_path}?ref=ai-mailbox" --jq '.content' \
            | tr -d '\n' | base64 -d > /tmp/ai-mailbox-in.md

          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${out_path}?ref=ai-mailbox" --jq '.content' 2>/dev/null \
            | tr -d '\n' | base64 -d > /tmp/ai-mailbox-out.md
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then : > /tmp/ai-mailbox-out.md; fi

          python - "$PROVIDER" /tmp/ai-mailbox-in.md /tmp/ai-mailbox-out.md <<'PY' > /tmp/ai-mailbox-meta.env
          import re,sys
          provider=sys.argv[1].strip().lower()
          incoming=open(sys.argv[2],encoding='utf-8',errors='replace').read()
          outgoing=open(sys.argv[3],encoding='utf-8',errors='replace').read()

          def parse(text):
              lines=text.splitlines()
              first=(lines[0].strip() if lines else '')
              headers={}
              for line in lines[1:]:
                  if not line.strip(): break
                  if ':' in line:
                      k,v=line.split(':',1); headers[k.strip().lower()]=v.strip()
              return first,headers

          first,h=parse(incoming)
          _,old=parse(outgoing)
          expected='GPT_TO_'+provider.upper()
          msg=h.get('message_id','')
          status=h.get('status','').upper()
          safe=bool(re.fullmatch(r'[A-Za-z0-9._:-]{1,120}',msg))
          pending=(first==expected and status=='REQUEST' and safe and old.get('in_reply_to')!=msg)
          print('PENDING='+('true' if pending else 'false'))
          print('MESSAGE_ID='+msg)
          print('SOURCE_SHA='+h.get('source_sha','')[:40])
          PY
          source /tmp/ai-mailbox-meta.env
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "message_id=$MESSAGE_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Python for pending relay
        if: steps.mailbox.outputs.pending == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal Python dependency
        if: steps.mailbox.outputs.pending == 'true'
        shell: bash
        run: python -m pip install --disable-pip-version-check -q python-dotenv

      - name: Set up Node for Copilot
        if: steps.mailbox.outputs.pending == 'true' && matrix.provider == 'copilot'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bounded Copilot CLI only when needed
        if: steps.mailbox.outputs.pending == 'true' && matrix.provider == 'copilot'
        shell: bash
        run: npm install -g @github/copilot@latest

      - name: Ask provider using mailbox content only
        if: steps.mailbox.outputs.pending == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
          MESSAGE_ID: ${{ steps.mailbox.outputs.message_id }}
          SOURCE_SHA: ${{ steps.mailbox.outputs.source_sha }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_COUNCIL_MODEL: ${{ vars.DEEPSEEK_VPS_MODEL || 'deepseek-chat' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_COUNCIL_MODEL: ${{ vars.GEMINI_COUNCIL_MODEL || 'gemini-3.7-flash' }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          AI_COUNCIL_RUNTIME_ENV: /tmp/ai-mailbox-no-runtime.env
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ai_mailbox_provider_relay.py \
            --provider "$PROVIDER" \
            --message-id "$MESSAGE_ID" \
            --source-sha "$SOURCE_SHA" \
            --input /tmp/ai-mailbox-in.md \
            --output /tmp/ai-mailbox-reply.md

      - name: Publish provider reply to fixed mailbox file
        if: steps.mailbox.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          MESSAGE_ID: ${{ steps.mailbox.outputs.message_id }}
        shell: bash
        run: |
          set -euo pipefail
          path=".github/ai-mailbox/${PROVIDER}-to-gpt.md"
          api="repos/${GITHUB_REPOSITORY}/contents/${path}"
          gh api -H 'Accept: application/vnd.github+json' "$api?ref=ai-mailbox" > /tmp/ai-mailbox-existing.json
          existing_sha="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/ai-mailbox-existing.json')).get('sha') or '')
          PY
          )"
          python - "$existing_sha" "$MESSAGE_ID" "$PROVIDER" <<'PY' > /tmp/ai-mailbox-put.json
          import base64,json,sys
          sha,msg,provider=sys.argv[1:4]
          raw=open('/tmp/ai-mailbox-reply.md','rb').read()
          body={
              'message':f'{provider.title()} to GPT mailbox {msg}',
              'content':base64.b64encode(raw).decode(),
              'branch':'ai-mailbox',
              'sha':sha,
          }
          print(json.dumps(body))
          PY
          gh api -X PUT "$api" --input /tmp/ai-mailbox-put.json >/dev/null

      - name: Relay summary
        if: always() && steps.selected.outputs.run == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
          PENDING: ${{ steps.mailbox.outputs.pending }}
          MESSAGE_ID: ${{ steps.mailbox.outputs.message_id }}
        shell: bash
        run: |
          {
            echo "## ${PROVIDER} mailbox relay"
            echo
            echo "Pending message: **${PENDING:-false}**"
            echo "Message ID: \`${MESSAGE_ID:-none}\`"
            if [[ -s /tmp/ai-mailbox-reply.md ]]; then
              echo
              sed -n '1,80p' /tmp/ai-mailbox-reply.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
