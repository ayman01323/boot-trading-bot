name: Strategy Factory Provider Signal

on:
  push:
    branches: [ai-mailbox]
    paths:
      - '.github/ai-mailbox/gpt-to-deepseek.md'
      - '.github/ai-mailbox/gpt-to-gemini.md'
      - '.github/ai-mailbox/gpt-to-grok.md'
      - '.github/ai-mailbox/gpt-to-kimi.md'
      - '.github/ai-mailbox/gpt-to-copilot.md'

permissions:
  contents: read

jobs:
  signal:
    # This job only emits the workflow_run event. No provider call, secret read,
    # server access, deploy or trading action happens here. Keeping it on a
    # GitHub-hosted runner prevents self-hosted availability from blocking the
    # event; the actual provider relay remains pinned to boot-google.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Signal trusted Strategy Factory provider fallback relay
        shell: bash
        run: |
          echo 'Strategy Factory provider fallback update detected.'
          echo 'Actual provider traffic is handled only by the boot-google relay workflow.'
          echo 'No checkout, provider call, secret read, deploy, trade, wallet action, or sudo action occurs in this signal job.'
