name: Strategy Factory Provider Signal

on:
  push:
    branches: [ai-mailbox]
    paths:
      - '.github/ai-mailbox/gpt-to-deepseek.md'
      - '.github/ai-mailbox/gpt-to-gemini.md'
      - '.github/ai-mailbox/gpt-to-grok.md'
      - '.github/ai-mailbox/gpt-to-kimi.md'
      - '.github/ai-mailbox/gpt-to-copilot.md'

permissions:
  contents: read

jobs:
  signal:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 2
    steps:
      - name: Verify Google signal runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"
      - name: Signal trusted Strategy Factory provider fallback relay
        shell: bash
        run: |
          echo 'Strategy Factory provider fallback update detected on boot-google.'
          echo 'No checkout, provider call, secret read, deploy, trade, wallet action, or sudo action occurs in this signal job.'
