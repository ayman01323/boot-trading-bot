name: AI Mailbox Telegram Alert CI

on:
  pull_request:
    paths:
      - '.github/workflows/ai-mailbox-telegram-alert.yml'
      - '.github/workflows/ai-mailbox-telegram-alert-ci.yml'
      - 'scripts/ai_mailbox_telegram_notify.py'
      - 'scripts/ai_mailbox_telegram_event.py'
      - 'tests/test_ai_mailbox_telegram_notify.py'
      - 'tests/test_ai_mailbox_telegram_event.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - name: Check out tested ref without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run focused tests in isolated Python 3.11 venv
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.11 >/dev/null 2>&1
          venv="/tmp/ai-mailbox-telegram-ci-${GITHUB_RUN_ID}"
          rm -rf "$venv"
          python3.11 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q pytest pyyaml
          "$venv/bin/python" -m py_compile \
            scripts/ai_mailbox_telegram_notify.py \
            scripts/ai_mailbox_telegram_event.py \
            tests/test_ai_mailbox_telegram_notify.py \
            tests/test_ai_mailbox_telegram_event.py
          "$venv/bin/python" -m pytest -q \
            tests/test_ai_mailbox_telegram_notify.py \
            tests/test_ai_mailbox_telegram_event.py
          rm -rf "$venv"
