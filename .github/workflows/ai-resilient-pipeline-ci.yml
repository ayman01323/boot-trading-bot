name: Resilient AI Pipeline Tests

on:
  pull_request:
    paths:
      - '.github/workflows/engineering-copilot-assignment-reconciler.yml'
      - '.github/workflows/engineering-agent-retry.yml'
      - '.github/workflows/weekly-resilient-master.yml'
      - '.github/workflows/strategy-approved-change-promoter.yml'
      - '.github/workflows/ai-resilient-pipeline-ci.yml'
      - 'learnerbot/ai_agent_health_warning_patch.py'
      - 'learnerbot/strategy_canary_source_guard_patch.py'
      - 'learnerbot/telegram_hi_keefek_patch.py'
      - 'tests/test_ai_agent_health_warning.py'
      - 'tests/test_strategy_canary_source_guard_patch.py'
      - 'tests/test_ai_resilient_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime, test and YAML tooling
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest pyyaml
      - name: Compile new runtime modules and tests
        run: |
          python -m py_compile \
            learnerbot/ai_agent_health_warning_patch.py \
            learnerbot/strategy_canary_source_guard_patch.py \
            tests/test_ai_agent_health_warning.py \
            tests/test_strategy_canary_source_guard_patch.py \
            tests/test_ai_resilient_workflows.py
      - name: Parse new workflows and bash-syntax-check every run block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,subprocess,tempfile,yaml
          paths=[
            '.github/workflows/engineering-copilot-assignment-reconciler.yml',
            '.github/workflows/engineering-agent-retry.yml',
            '.github/workflows/weekly-resilient-master.yml',
            '.github/workflows/strategy-approved-change-promoter.yml',
          ]
          for path in paths:
              data=yaml.safe_load(pathlib.Path(path).read_text(encoding='utf-8'))
              jobs=data.get('jobs') or {}
              assert jobs, f'{path}: no jobs parsed'
              for job_name,job in jobs.items():
                  for index,step in enumerate((job or {}).get('steps') or []):
                      script=(step or {}).get('run')
                      shell=str((step or {}).get('shell') or 'bash')
                      if not script or 'bash' not in shell:
                          continue
                      with tempfile.NamedTemporaryFile('w',suffix='.sh',delete=False) as f:
                          f.write(str(script)); temp=f.name
                      p=subprocess.run(['bash','-n',temp],text=True,capture_output=True)
                      if p.returncode:
                          raise SystemExit(f'{path} job={job_name} step={index} bash syntax failed:\n{p.stderr}')
              print('WORKFLOW_OK',path)
          PY
      - name: Run resilient pipeline unit and contract tests
        run: |
          pytest -x -vv \
            tests/test_ai_agent_health_warning.py \
            tests/test_strategy_canary_source_guard_patch.py \
            tests/test_ai_resilient_workflows.py \
            tests/test_strategy_canary.py \
            tests/test_three_agent_strategy_contract.py \
            tests/test_weekly_bug_audit_contract.py
      - name: Verify production import composition still starts
        run: pytest -x -vv tests/test_imports.py tests/test_main_import_order.py
