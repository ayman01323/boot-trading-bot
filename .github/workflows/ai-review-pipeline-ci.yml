name: AI Review Pipeline Tests

on:
  pull_request:
    paths:
      - '.github/workflows/hourly-three-agent-strategy-cycle.yml'
      - '.github/workflows/gpt-master-strategy-action.yml'
      - '.github/workflows/strategy-copilot-assignment-reconciler.yml'
      - '.github/workflows/strategy-resilient-master.yml'
      - '.github/workflows/hourly-gemini-strategy-review.yml'
      - '.github/workflows/ai-review-pipeline-ci.yml'
      - 'tests/test_hourly_three_agent_workflow_contract.py'
      - 'tests/test_hourly_three_agent_strategy_workflow.py'
      - 'tests/test_gpt_master_strategy_reconciler.py'
      - 'tests/test_strategy_resilient_agent_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: |
          python -m pip install pytest
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep

      - name: Workflow contract tests
        run: |
          pytest -q tests/test_hourly_three_agent_workflow_contract.py \
            tests/test_hourly_three_agent_strategy_workflow.py \
            tests/test_gpt_master_strategy_reconciler.py \
            tests/test_strategy_resilient_agent_workflows.py

      - name: Verify repository Python import path used by Gemini extraction
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/extract_strategy_report.py --help >/dev/null
          PYTHONPATH="$GITHUB_WORKSPACE" python -m learnerbot.three_agent_strategy_contract --help >/dev/null

      - name: Install current provider CLIs
        run: |
          npm install -g @openai/codex@latest @google/gemini-cli@latest
          codex --version
          gemini --version

      - name: Verify GPT credential and no-bwrap non-interactive invocation
        id: gpt
        continue-on-error: true
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_STRATEGY_AUDIT_MODEL: ${{ vars.OPENAI_STRATEGY_AUDIT_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CODEX_API_KEY:-}"
          model_args=()
          if [[ -n "${OPENAI_STRATEGY_AUDIT_MODEL:-}" ]]; then model_args=(-m "$OPENAI_STRATEGY_AUDIT_MODEL"); fi
          printf 'Inspect nothing. Reply with exactly AI_PIPELINE_GPT_OK and do not run tools.\n' |
            codex --ask-for-approval never exec --sandbox danger-full-access --ephemeral "${model_args[@]}" - > /tmp/codex-smoke.txt
          grep -q 'AI_PIPELINE_GPT_OK' /tmp/codex-smoke.txt

      - name: Verify Gemini credential and read-only invocation
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_STRATEGY_MODEL: ${{ vars.GEMINI_STRATEGY_MODEL || 'gemini-3.1-pro-preview' }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          gemini --approval-mode=plan --skip-trust --model "$GEMINI_STRATEGY_MODEL" --output-format text \
            -p 'Inspect nothing. Reply with exactly AI_PIPELINE_GEMINI_OK and do not run tools.' > /tmp/gemini-smoke.txt
          grep -q 'AI_PIPELINE_GEMINI_OK' /tmp/gemini-smoke.txt

      - name: Require both model providers to work
        env:
          GPT_OUTCOME: ${{ steps.gpt.outcome }}
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "GPT smoke outcome: ${GPT_OUTCOME}"
          echo "Gemini smoke outcome: ${GEMINI_OUTCOME}"
          [[ "$GPT_OUTCOME" == 'success' ]]
          [[ "$GEMINI_OUTCOME" == 'success' ]]
