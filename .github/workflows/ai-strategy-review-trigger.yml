name: Trigger Canonical Strategy Cycle

on:
  push:
    branches:
      - ops/ai-cycle
    paths:
      - '.ai/trigger/strategy-review.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trigger-canonical-strategy-cycle
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical strategy cycle against main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run hourly-three-agent-strategy-cycle.yml --ref main
          echo "Dispatched Hourly Three-Agent Strategy Cycle on ref main."
          echo "This producer publishes the canonical <source12>-<YYYYMMDDHH>-<evidence8> cycle id."
