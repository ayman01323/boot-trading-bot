name: APEX RPC Bot Compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apex-rpc-bot-compat.yml'
      - 'tests/test_apex_rpc_gateway_bot_compat.py'
      - 'learnerbot/config.py'
      - 'scripts/rpc_health_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apex-rpc-bot-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests websockets python-dotenv

      - name: Run APEX RPC compatibility test
        run: |
          pytest -q tests/test_apex_rpc_gateway_bot_compat.py
