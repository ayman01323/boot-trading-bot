name: SiLearn targeted deploy diagnosis

on:
  push:
    branches:
      - 'ops/SiLearn-2026-08-29T122354BST-deploy-v2'

jobs:
  diagnose-google-learner:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Read targeted failed deployment and rollback journal
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          SERVICE='learnerbot-learn.service'
          echo "service_state=$(systemctl is-active "$SERVICE" 2>/dev/null || true)"
          echo "service_pid=$(systemctl show "$SERVICE" -p MainPID --value 2>/dev/null || true)"
          echo "service_restarts=$(systemctl show "$SERVICE" -p NRestarts --value 2>/dev/null || true)"
          echo '=== TARGETED FAILED DEPLOY WINDOW ==='
          sudo -n journalctl -u "$SERVICE" --since '2026-08-29 11:44:35 UTC' --until '2026-08-29 11:45:25 UTC' --no-pager || true
          echo '=== CURRENT SERVICE TAIL ==='
          sudo -n journalctl -u "$SERVICE" -n 80 --no-pager || true
