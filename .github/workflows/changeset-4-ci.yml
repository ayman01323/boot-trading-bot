name: Change Set 4 Learner Policy CI

on:
  pull_request:
    paths:
      - 'learnerbot/solana_owner_changeset_4_patch.py'
      - 'learnerbot/solana_owner_changeset_4_exit_safety_patch.py'
      - 'learnerbot/solana_owner_changeset_4_integrity_patch.py'
      - 'learnerbot/solana_leader_quality_restore_patch.py'
      - 'learnerbot/solana_reject_once_reporting_patch.py'
      - 'learnerbot/__main__.py'
      - 'tests/test_solana_owner_changeset_4.py'
      - 'tests/test_silearn_reject_once_lp_revalidation.py'
      - 'docs/change-control/2026-08-29T103858Z-change-set-4.md'
      - 'docs/change-control/SiLearn-2026-08-29T122354BST-one-time-rejections-lp-revalidation.md'
      - '.github/workflows/changeset-4-ci.yml'

jobs:
  changeset4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile stamped Change Set 4 and SiLearn reporting files
        run: |
          python -m py_compile \
            learnerbot/solana_owner_changeset_4_patch.py \
            learnerbot/solana_owner_changeset_4_exit_safety_patch.py \
            learnerbot/solana_owner_changeset_4_integrity_patch.py \
            learnerbot/solana_leader_quality_restore_patch.py \
            learnerbot/solana_reject_once_reporting_patch.py \
            learnerbot/__main__.py
      - name: Run Change Set 4 and SiLearn reporting behavioural tests
        run: |
          pytest -q \
            tests/test_solana_owner_changeset_4.py \
            tests/test_silearn_reject_once_lp_revalidation.py
