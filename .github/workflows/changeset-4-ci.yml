name: SiLearn corrected deploy diagnosis

on:
  push:
    branches:
      - 'ops/SiLearn-2026-08-29T122354BST-deploy-v2'

jobs:
  diagnose-google-learner:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Read second failed deployment and rollback journal
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          SERVICE='learnerbot-learn.service'
          echo "service_state=$(systemctl is-active "$SERVICE" 2>/dev/null || true)"
          echo "service_pid=$(systemctl show "$SERVICE" -p MainPID --value 2>/dev/null || true)"
          echo "service_restarts=$(systemctl show "$SERVICE" -p NRestarts --value 2>/dev/null || true)"
          echo '=== SECOND FAILED DEPLOY WINDOW ==='
          sudo -n journalctl -u "$SERVICE" --since '2026-08-29 11:41:35 UTC' --until '2026-08-29 11:42:20 UTC' --no-pager || true
          echo '=== SAVED DEPLOY JOURNAL IF PRESENT ==='
          F='/home/ayman01323/BOOT/testingbots/learn/private/change-control/20260829T122354BST-one-time-rejections-lp-revalidation-v2/pre-deploy/journal-after.txt'
          if sudo -n test -f "$F"; then sudo -n cat "$F"; fi
          echo '=== CURRENT SERVICE TAIL ==='
          sudo -n journalctl -u "$SERVICE" -n 100 --no-pager || true
