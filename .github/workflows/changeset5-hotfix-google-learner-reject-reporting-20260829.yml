name: 2026-08-29 11:05:51Z Change Set 5 Hotfix Google Learner Reject Reporting

on:
  push:
    branches:
      - 'ops/2026-08-29T110551Z-hotfix-learner-reject-reporting'
    paths:
      - '.github/workflows/changeset5-hotfix-google-learner-reject-reporting-20260829.yml'

permissions:
  contents: read

concurrency:
  group: changeset5-hotfix-google-learner-reject-reporting-20260829
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Apply stamped reporting-only hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323

          sudo -n env LROOT=/home/ayman01323/BOOT/testingbots/learn bash <<'ROOT'
          set -Eeuo pipefail

          CHANGESET_ID='CHANGE_SET_5'
          APPROVED_UTC='2026-08-29T11:05:51Z'
          APPROVED_BST='2026-08-29T12:05:51+01:00'
          SUBJECT='Learner Telegram reject dedupe + full clickable Solana IDs'
          MERGED_SHA='98f570a47d9521d527f00ba543c09c235f120ab5'
          SERVICE='learnerbot-learn.service'
          TARGET="$LROOT/learnerbot/solana_leader_cursor_reliability_patch.py"
          STAMP='20260829T110551Z'
          BACKUP="$LROOT/private/change-control/$STAMP-change-set-5/pre-hotfix"

          test -f "$TARGET"
          mkdir -p "$BACKUP"
          cp -a "$TARGET" "$BACKUP/solana_leader_cursor_reliability_patch.py"
          systemctl status "$SERVICE" --no-pager -l > "$BACKUP/service-status-before.txt" 2>&1 || true
          journalctl -u "$SERVICE" -n 120 --no-pager > "$BACKUP/journal-before.txt" 2>&1 || true
          sha256sum "$TARGET" > "$BACKUP/target-before.sha256"

          echo "changeset_id=$CHANGESET_ID"
          echo "approval_utc=$APPROVED_UTC"
          echo "approval_bst=$APPROVED_BST"
          echo "subject=$SUBJECT"
          echo "merged_source_sha=$MERGED_SHA"
          echo "server_backup=$BACKUP"

          changed=0
          rollback() {
            rc=$?
            if [[ "$rc" -ne 0 && "$changed" -eq 1 ]]; then
              echo 'CHANGESET5_REPORTING_ROLLBACK=START'
              cp -a "$BACKUP/solana_leader_cursor_reliability_patch.py" "$TARGET"
              chown ayman01323:$(id -gn ayman01323) "$TARGET" || true
              systemctl restart "$SERVICE" || true
              sleep 4
              echo "rollback_service_state=$(systemctl is-active "$SERVICE" 2>/dev/null || true)"
              echo 'CHANGESET5_REPORTING_ROLLBACK=COMPLETE'
            fi
            exit "$rc"
          }
          trap rollback EXIT

          TARGET="$TARGET" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['TARGET'])
          text = path.read_text(encoding='utf-8')
          stamp = 'approved=2026-08-29T11:05:51Z'

          # If the permanent Change Set 5 source is already present, this hotfix is
          # intentionally a no-op. No trading code is rewritten.
          if (
              '_REJECT_REPORT_SUPPRESS_SECONDS = 15 * 60' in text
              and 'def _telegram_reject_dedup_key' in text
              and 'https://solscan.io/account/' in text
              and 'https://solscan.io/tx/' in text
              and stamp in text
          ):
              print('changeset5_runtime_patch=already_native')
              raise SystemExit(0)

          decl = '_REJECT_REPORT_DEDUP: dict[tuple[str, str, str], float] = {}'
          start = text.find(decl)
          if start < 0:
              raise SystemExit('REFUSE_CHANGESET5: expected legacy reject dedup declaration not found')
          end = text.find('\ndef _leader_signatures', start)
          if end < 0:
              raise SystemExit('REFUSE_CHANGESET5: reporting section end anchor not found')

          prefix = text[:start]
          suffix = text[end:]
          reporting = r'''_REJECT_REPORT_SUPPRESS_SECONDS = 15 * 60
          _REJECT_REPORT_DEDUP: dict[tuple[str, str, str, str], float] = {}


          def _reject_class(action: dict) -> str:
              explicit = str(action.get("pool_risk_code") or action.get("rejection_class") or "").strip()
              if explicit:
                  return explicit[:80]
              reason = str(action.get("reason") or "").strip()
              head = reason.split(":", 1)[0].strip().upper().replace(" ", "_").replace("-", "_")
              return (head or "LEARNER_REJECT")[:80]


          def _reject_targets(app, event: dict, action: dict) -> list[str]:
              tid = str(action.get("telegram_id") or "").strip()
              if tid:
                  return [tid]
              wallet = str(event.get("leader_wallet") or "")
              out: list[str] = []
              try:
                  for user in all_users(app.csv_dir, enabled_only=True):
                      candidate = str(user.get("telegram_id") or "").strip()
                      if not candidate or not live_enabled(app, candidate):
                          continue
                      if not _sol._sibot._bool(_sol._sibot.user_settings(app, candidate, 0).get("enabled"), False):
                          continue
                      if wallet and _sol._leader_rank(app, candidate, wallet) is None:
                          continue
                      out.append(candidate)
              except Exception as exc:
                  print("[learner-reject-report] target_error=%s:%s" % (type(exc).__name__, str(exc)[:160]))
              return list(dict.fromkeys(out))


          def _telegram_error_text(exc: Exception) -> str:
              response = getattr(exc, "response", None)
              status = getattr(response, "status_code", None)
              description = ""
              if response is not None:
                  try:
                      data = response.json()
                      description = str(data.get("description") or "")[:180]
                  except Exception:
                      description = ""
              if description:
                  return f"status={status or 'unknown'} description={description}"
              return f"status={status or 'unknown'} type={type(exc).__name__}"


          def _telegram_link(url: str, label: str) -> str:
              return '<a href="%s">%s</a>' % (
                  html.escape(str(url or ""), quote=True),
                  html.escape(str(label or "")),
              )


          def _reject_message(event: dict, action: dict, *, test_only: bool = False) -> str:
              reason = str(action.get("reason") or "unspecified rejection")
              mint = str(event.get("mint") or action.get("mint") or "unknown")
              wallet = str(event.get("leader_wallet") or action.get("leader_wallet") or "")
              signature = str(event.get("signature") or event.get("event_id") or action.get("signature") or "")
              lines = [
                  "⛔ <b>LEARNER REJECTED OPPORTUNITY</b>" if not test_only else "🧪 <b>LEARNER REJECT REPORT TEST — PASS PATH</b>",
                  "Asset: " + _telegram_link(f"https://solscan.io/token/{mint}", f"solana:{mint}"),
                  f"Reason: <code>{html.escape(reason[:700])}</code>",
                  "Dexview: " + _telegram_link(f"https://www.dexview.com/solana/{mint}", "Open Dexview"),
              ]
              if wallet:
                  lines.append("Leader: " + _telegram_link(f"https://solscan.io/account/{wallet}", wallet))
              if signature:
                  lines.append("Signal: " + _telegram_link(f"https://solscan.io/tx/{signature}", signature))
              lines.append("Decision: <b>NO BUY / NO BROADCAST</b>")
              if test_only:
                  lines.append("Synthetic reporting test only — no market opportunity was evaluated and no trade was placed.")
              return "\n".join(lines)


          def _send_reject_report(app, tid: str, event: dict, action: dict, *, test_only: bool = False) -> bool:
              if not getattr(app, "telegram_bot_token", ""):
                  return False
              try:
                  sent_count = send_message(
                      app.telegram_bot_token,
                      str(tid),
                      _reject_message(event, action, test_only=test_only),
                      parse_mode="HTML",
                      protect_content=True,
                  )
              except Exception as exc:
                  raise RuntimeError("telegram_send_failed " + _telegram_error_text(exc)) from None
              return int(sent_count or 0) > 0


          def _telegram_reject_dedup_key(tid: str, event: dict, action: dict) -> tuple[str, str, str, str]:
              mint = str(event.get("mint") or action.get("mint") or "").strip()
              wallet = str(event.get("leader_wallet") or action.get("leader_wallet") or "").strip()
              reason = str(action.get("reason") or "unspecified rejection").strip()
              return str(tid), mint, wallet, reason


          def _report_reject_actions(app, event: dict, actions: list[dict]) -> None:
              now = time.time()
              for key, ts in list(_REJECT_REPORT_DEDUP.items()):
                  if now - ts > _REJECT_REPORT_SUPPRESS_SECONDS:
                      _REJECT_REPORT_DEDUP.pop(key, None)
              published: set[tuple[str, str]] = set()
              for raw in actions or []:
                  action = dict(raw or {})
                  if str(action.get("action") or "").upper() != "REJECT":
                      continue
                  reason = str(action.get("reason") or "unspecified rejection")
                  mint = str(event.get("mint") or action.get("mint") or "")
                  event_id = str(event.get("event_id") or event.get("signature") or action.get("signature") or "")
                  klass = _reject_class(action)
                  pub_key = (klass, reason)
                  if pub_key not in published:
                      publish_rejection(
                          chain="solana",
                          token_address=mint,
                          source="learnerbot",
                          source_strategy_id=str(event.get("strategy_id") or "leader-copy"),
                          source_event_id=event_id,
                          rejection_class=klass,
                          rejection_reason=reason,
                          priority=75 if action.get("pool_risk_code") else 60,
                          payload={
                              "risk_class": klass,
                              "leader_wallet": str(event.get("leader_wallet") or action.get("leader_wallet") or ""),
                              "source_runtime": "isolated_learner_solana",
                          },
                          require_market_reason=True,
                      )
                      published.add(pub_key)
                  targets = _reject_targets(app, event, action)
                  sent = 0
                  suppressed = 0
                  for tid in targets:
                      dedup_key = _telegram_reject_dedup_key(tid, event, action)
                      last = _REJECT_REPORT_DEDUP.get(dedup_key)
                      if last is not None and now - last < _REJECT_REPORT_SUPPRESS_SECONDS:
                          suppressed += 1
                          continue
                      try:
                          if _send_reject_report(app, tid, event, action):
                              sent += 1
                              _REJECT_REPORT_DEDUP[dedup_key] = now
                      except Exception as exc:
                          print("[learner-reject-report] telegram_error=%s" % str(exc)[:220])
                  print(
                      "[learner-reject-report] decision=REJECT targets=%d sent=%d suppressed=%d dedup_seconds=%d class=%s reason=%s" %
                      (len(targets), sent, suppressed, _REJECT_REPORT_SUPPRESS_SECONDS, klass, reason[:180])
                  )


          print(
              "[learner-reject-changeset5] approved=2026-08-29T11:05:51Z "
              "dedup_seconds=900 full_clickable_ids=true reporting_only=true"
          )

          '''
          # The raw string above is indented for readability in this deployment
          # script. Remove exactly ten leading spaces from each non-empty line.
          cleaned = []
          for line in reporting.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              cleaned.append(line)
          reporting = '\n'.join(cleaned).rstrip() + '\n'

          new = prefix + reporting + suffix
          # Prove this hotfix touched only the existing reporting section.
          if not new.startswith(prefix) or not new.endswith(suffix):
              raise SystemExit('REFUSE_CHANGESET5: non-reporting source region changed')
          path.write_text(new, encoding='utf-8')
          print('changeset5_runtime_patch=changed')
          print('changeset5_reporting_only_region=true')
          PY
          changed=1

          py="$LROOT/.venv/bin/python"
          [[ -x "$py" ]] || py=python3
          PYTHONPATH="$LROOT" "$py" -m py_compile "$TARGET"
          grep -q '_REJECT_REPORT_SUPPRESS_SECONDS = 15 \* 60' "$TARGET"
          grep -q 'def _telegram_reject_dedup_key' "$TARGET"
          grep -q 'https://solscan.io/account/' "$TARGET"
          grep -q 'https://solscan.io/tx/' "$TARGET"
          grep -q 'https://solscan.io/token/' "$TARGET"
          if grep -q '_short(wallet)' "$TARGET" || grep -q '_short(signature)' "$TARGET"; then
            echo 'REFUSE_CHANGESET5: legacy truncated Leader/Signal formatter remains' >&2
            exit 71
          fi
          sha256sum "$TARGET" > "$BACKUP/target-after.sha256"
          chown ayman01323:$(id -gn ayman01323) "$TARGET"

          systemctl restart "$SERVICE"
          sleep 8
          state1=$(systemctl is-active "$SERVICE" 2>/dev/null || true)
          pid1=$(systemctl show "$SERVICE" -p MainPID --value 2>/dev/null || echo 0)
          restarts1=$(systemctl show "$SERVICE" -p NRestarts --value 2>/dev/null || echo unknown)
          [[ "$state1" = active && "$pid1" != 0 ]] || exit 72
          sleep 6
          state2=$(systemctl is-active "$SERVICE" 2>/dev/null || true)
          pid2=$(systemctl show "$SERVICE" -p MainPID --value 2>/dev/null || echo 0)
          restarts2=$(systemctl show "$SERVICE" -p NRestarts --value 2>/dev/null || echo unknown)
          [[ "$state2" = active && "$pid2" != 0 && "$restarts1" = "$restarts2" ]] || exit 73

          journalctl -u "$SERVICE" --since '25 seconds ago' --no-pager > /tmp/changeset5-learner-journal.txt
          if grep -q 'Traceback (most recent call last)' /tmp/changeset5-learner-journal.txt; then
            tail -n 160 /tmp/changeset5-learner-journal.txt >&2
            exit 74
          fi
          grep -q '\[learner-reject-changeset5\] approved=2026-08-29T11:05:51Z' /tmp/changeset5-learner-journal.txt || exit 75

          cat > "$LROOT/private/change-control/$STAMP-change-set-5/deployment-attestation.txt" <<EOF
          changeset_id=$CHANGESET_ID
          approval_utc=$APPROVED_UTC
          approval_bst=$APPROVED_BST
          subject=$SUBJECT
          merged_source_sha=$MERGED_SHA
          server_backup=$BACKUP
          deployed_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          target=$TARGET
          service=$SERVICE
          service_state=$state2
          service_pid=$pid2
          service_restarts=$restarts2
          telegram_dedup_seconds=900
          telegram_dedup_key=account+mint+leader+reason
          full_clickable_asset=true
          full_clickable_leader=true
          full_clickable_signal=true
          trading_logic_changed=NO
          test_trade_broadcast=NO
          synthetic_telegram_test_sent=NO
          EOF
          chown -R ayman01323:$(id -gn ayman01323) "$LROOT/private/change-control/$STAMP-change-set-5"

          echo 'CHANGESET5_GOOGLE_LEARNER_REPORTING_HOTFIX=PASS'
          echo "learner_service_state=$state2"
          echo "learner_service_pid=$pid2"
          echo "learner_service_restarts=$restarts2"
          echo 'telegram_reject_dedup_seconds=900'
          echo 'telegram_reject_dedup_key=account+mint+leader+reason'
          echo 'telegram_full_clickable_ids=true'
          echo 'trading_logic_changed=NO'
          echo 'test_trade_broadcast=NO'
          echo "rollback_backup=$BACKUP"
          grep -E '\[learner-reject-changeset5\]' /tmp/changeset5-learner-journal.txt | tail -n 5

          trap - EXIT
          ROOT
