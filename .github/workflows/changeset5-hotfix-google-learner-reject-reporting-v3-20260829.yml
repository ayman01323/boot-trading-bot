name: 2026-08-29 11:05:51Z Change Set 5 Hotfix Google Learner Reject Reporting v3

on:
  push:
    branches:
      - 'ops/2026-08-29T110551Z-hotfix-learner-reject-reporting'
    paths:
      - '.github/workflows/changeset5-hotfix-google-learner-reject-reporting-v3-20260829.yml'

permissions:
  contents: read

concurrency:
  group: changeset5-hotfix-google-learner-reject-reporting-v3-20260829
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Apply tested reporting block with in-memory compile
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323

          TESTED_SHA='98f570a47d9521d527f00ba543c09c235f120ab5'
          APPLIER_SHA='068e0c0c0feb401562bc6b116e4935a6888cfebc'
          SRC="$RUNNER_TEMP/changeset5-tested-source.py"
          APPLIER="$RUNNER_TEMP/changeset5-apply.py"
          curl -fsSL "https://raw.githubusercontent.com/ayman01323/boot-trading-bot/${TESTED_SHA}/learnerbot/solana_leader_cursor_reliability_patch.py" -o "$SRC"
          curl -fsSL "https://raw.githubusercontent.com/ayman01323/boot-trading-bot/${APPLIER_SHA}/scripts/ops_changeset5_apply_reporting_hotfix.py" -o "$APPLIER"
          test -s "$SRC"
          test -s "$APPLIER"
          python3 - "$SRC" "$APPLIER" <<'PY'
          import pathlib, sys
          for raw in sys.argv[1:]:
              path = pathlib.Path(raw)
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('downloaded_sources_in_memory_compile=PASS')
          PY

          sudo -n env LROOT=/home/ayman01323/BOOT/testingbots/learn SRC="$SRC" APPLIER="$APPLIER" TESTED_SHA="$TESTED_SHA" bash <<'ROOT'
          set -Eeuo pipefail
          SERVICE='learnerbot-learn.service'
          TARGET="$LROOT/learnerbot/solana_leader_cursor_reliability_patch.py"
          STAMP='20260829T110551Z'
          BACKUP="$LROOT/private/change-control/$STAMP-change-set-5/pre-hotfix-v3"
          APPROVED_UTC='2026-08-29T11:05:51Z'
          APPROVED_BST='2026-08-29T12:05:51+01:00'
          SUBJECT='Learner Telegram reject dedupe + full clickable Solana IDs'

          test -f "$TARGET"
          mkdir -p "$BACKUP"
          cp -a "$TARGET" "$BACKUP/solana_leader_cursor_reliability_patch.py"
          sha256sum "$TARGET" > "$BACKUP/target-before.sha256"
          systemctl status "$SERVICE" --no-pager -l > "$BACKUP/service-status-before.txt" 2>&1 || true
          journalctl -u "$SERVICE" -n 120 --no-pager > "$BACKUP/journal-before.txt" 2>&1 || true

          changed=0
          rollback() {
            rc=$?
            if [[ "$rc" -ne 0 && "$changed" -eq 1 ]]; then
              echo 'CHANGESET5_V3_ROLLBACK=START'
              cp -a "$BACKUP/solana_leader_cursor_reliability_patch.py" "$TARGET"
              chown ayman01323:$(id -gn ayman01323) "$TARGET" || true
              systemctl restart "$SERVICE" || true
              sleep 4
              echo "rollback_service_state=$(systemctl is-active "$SERVICE" 2>/dev/null || true)"
              echo 'CHANGESET5_V3_ROLLBACK=COMPLETE'
            fi
            exit "$rc"
          }
          trap rollback EXIT

          python3 "$APPLIER" --target "$TARGET" --tested-source "$SRC"
          changed=1
          sha256sum "$TARGET" > "$BACKUP/target-after.sha256"
          chown ayman01323:$(id -gn ayman01323) "$TARGET"

          # Compile the complete target in memory; do not write bytecode.
          TARGET="$TARGET" python3 - <<'PY'
          import os, pathlib
          p=pathlib.Path(os.environ['TARGET'])
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          print('runtime_target_in_memory_compile=PASS')
          PY

          systemctl restart "$SERVICE"
          sleep 8
          state1=$(systemctl is-active "$SERVICE" 2>/dev/null || true)
          pid1=$(systemctl show "$SERVICE" -p MainPID --value 2>/dev/null || echo 0)
          restarts1=$(systemctl show "$SERVICE" -p NRestarts --value 2>/dev/null || echo unknown)
          [[ "$state1" = active && "$pid1" != 0 ]] || exit 92
          sleep 6
          state2=$(systemctl is-active "$SERVICE" 2>/dev/null || true)
          pid2=$(systemctl show "$SERVICE" -p MainPID --value 2>/dev/null || echo 0)
          restarts2=$(systemctl show "$SERVICE" -p NRestarts --value 2>/dev/null || echo unknown)
          [[ "$state2" = active && "$pid2" != 0 && "$restarts1" = "$restarts2" ]] || exit 93

          journalctl -u "$SERVICE" --since '25 seconds ago' --no-pager > /tmp/changeset5-v3-journal.txt
          if grep -q 'Traceback (most recent call last)' /tmp/changeset5-v3-journal.txt; then
            tail -n 160 /tmp/changeset5-v3-journal.txt >&2
            exit 94
          fi
          grep -q '\[learner-reject-changeset5\] approved=2026-08-29T11:05:51Z' /tmp/changeset5-v3-journal.txt || exit 95

          cat > "$LROOT/private/change-control/$STAMP-change-set-5/deployment-attestation-v3.txt" <<EOF
          changeset_id=CHANGE_SET_5
          approval_utc=$APPROVED_UTC
          approval_bst=$APPROVED_BST
          subject=$SUBJECT
          tested_source_sha=$TESTED_SHA
          server_backup=$BACKUP
          deployed_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          target=$TARGET
          service=$SERVICE
          service_state=$state2
          service_pid=$pid2
          service_restarts=$restarts2
          telegram_dedup_seconds=900
          telegram_dedup_key=account+mint+leader+reason
          full_clickable_asset=true
          full_clickable_leader=true
          full_clickable_signal=true
          non_reporting_code_unchanged=true
          trading_logic_changed=NO
          test_trade_broadcast=NO
          synthetic_telegram_test_sent=NO
          EOF
          chown -R ayman01323:$(id -gn ayman01323) "$LROOT/private/change-control/$STAMP-change-set-5"

          echo 'CHANGESET5_GOOGLE_LEARNER_REPORTING_HOTFIX_V3=PASS'
          echo "learner_service_state=$state2"
          echo "learner_service_pid=$pid2"
          echo "learner_service_restarts=$restarts2"
          echo 'telegram_reject_dedup_seconds=900'
          echo 'telegram_reject_dedup_key=account+mint+leader+reason'
          echo 'telegram_full_clickable_ids=true'
          echo 'non_reporting_code_unchanged=true'
          echo 'trading_logic_changed=NO'
          echo 'test_trade_broadcast=NO'
          echo "rollback_backup=$BACKUP"
          grep -E '\[learner-reject-changeset5\]' /tmp/changeset5-v3-journal.txt | tail -n 5

          trap - EXIT
          ROOT
