name: Check Existing Solana Provider Credentials

on:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/check-existing-solana-provider-credentials-20260828.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Check existing provider credential presence without exposing values
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n python3 - <<'PY'
          import os, subprocess
          services=['learnerbot-learn.service','learnerbot.service','sirisky.service']
          keys=['HELIUS_API_KEY','HELIUS_RPC_URL','SOLANA_RPC_URL','SOLANA_RPC_URLS','SOLANA_RPC_FALLBACK_URLS','ALCHEMY_API_KEY']
          for svc in services:
              try:
                  pid=int(subprocess.check_output(['systemctl','show',svc,'-p','MainPID','--value'],text=True).strip() or '0')
              except Exception:
                  pid=0
              print(f'{svc}.pid_present='+('YES' if pid>1 else 'NO'))
              env={}
              if pid>1:
                  try:
                      raw=open(f'/proc/{pid}/environ','rb').read().split(b'\0')
                      for item in raw:
                          if b'=' in item:
                              k,v=item.split(b'=',1); env[k.decode(errors='ignore')]=v.decode(errors='ignore')
                  except Exception:
                      pass
              for k in keys:
                  print(f'{svc}.{k}_present='+('YES' if str(env.get(k) or '').strip() else 'NO'))
          paths=[
            '/root/multichain-learning-bot-v2.2-fast-direct-market/.env',
            '/root/multichain-learning-bot-v2.2-fast-direct-market/CSVbot/solana_settings.csv',
            '/home/ayman01323/BOOT/testingbots/learn/.env',
            '/home/ayman01323/BOOT/testingbots/learn/CSVbot/solana_settings.csv',
            '/home/ayman01323/.config/google-learner-telegram-relay.env',
            '/var/tmp/ai_council_runtime.env',
          ]
          for p in paths:
              print('file_present:'+p+'='+('YES' if os.path.exists(p) else 'NO'))
              if not os.path.exists(p): continue
              try: text=open(p,encoding='utf-8',errors='ignore').read()
              except Exception: continue
              for k in keys:
                  present=False
                  if p.endswith('.csv'):
                      # CSV setting names, do not print values.
                      present=(k.lower() in text.lower() or ('rpc_url' in text.lower() if k=='SOLANA_RPC_URL' else False))
                  else:
                      present=any(line.strip().startswith(k+'=') and line.split('=',1)[1].strip().strip('"').strip("'") for line in text.splitlines() if '=' in line)
                  if present: print(f'file_key_present:{p}:{k}=YES')
          PY
