name: Check Learner Position Message Source

on:
  push:
    branches: [fix/solana-aug17-canary-restore]
    paths:
      - '.github/workflows/check-learner-position-message-source.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 3
    steps:
      - name: Trace active learner position Telegram sources
        shell: bash
        run: |
          set -euo pipefail
          target=/home/ayman01323/BOOT/testingbots/learn
          echo '=== MATCHED FILES ==='
          grep -RIl --exclude='*.pyc' --exclude-dir='__pycache__' 'LEARNER POSITION UPDATE' "$target/learnerbot" || true
          echo '=== MATCHED LINES ==='
          grep -RIn --exclude='*.pyc' --exclude-dir='__pycache__' -C 8 'LEARNER POSITION UPDATE' "$target/learnerbot" || true
          echo '=== NEWPOLL IMPORTS ==='
          grep -RIn --exclude='*.pyc' --exclude-dir='__pycache__' -E 'telegram_learner_position_update|telegram_learner_pool_context|telegram_learner_complete_market_context|google_learner_launcher' "$target/learnerbot/final_runtime_integrity_patch.py" "$target/learnerbot/__main__.py" || true
          echo 'runtime_service='$(systemctl is-active learnerbot-learn.service)
          echo 'runtime_pid='$(systemctl show -p MainPID --value learnerbot-learn.service)
