name: Diagnose Google SSH Key Access

on:
  push:
    branches:
      - 'agent/current-trade-status'
    paths:
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  diagnose-google-ssh:
    name: Read-only SSH key diagnostics on Google
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Inspect SSH account safely
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          echo "hostname=$(hostname)"
          echo "user=$(id -un)"
          echo "home=$HOME"
          stat -c 'ssh_dir_mode=%a owner=%U:%G' "$HOME/.ssh"
          if [[ -f "$HOME/.ssh/authorized_keys" ]]; then
            stat -c 'authorized_keys_mode=%a owner=%U:%G size=%s' "$HOME/.ssh/authorized_keys"
            echo "authorized_key_lines=$(grep -cve '^[[:space:]]*$' "$HOME/.ssh/authorized_keys" || true)"
            echo "migration_key_lines=$(grep -c 'namecheap-google-final-cutover' "$HOME/.ssh/authorized_keys" || true)"
            echo 'AUTHORIZED_KEY_FINGERPRINTS_BEGIN'
            ssh-keygen -lf "$HOME/.ssh/authorized_keys" || true
            echo 'AUTHORIZED_KEY_FINGERPRINTS_END'
          else
            echo 'AUTHORIZED_KEYS_MISSING=true'
          fi
