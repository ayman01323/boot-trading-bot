name: Start Only Migrated Google Learnerbot

on:
  push:
    branches:
      - 'agent/current-trade-status'
    paths:
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: start-only-google-production-learnerbot
  cancel-in-progress: false

jobs:
  start-google-learnerbot:
    name: Ensure only migrated Google learnerbot is running
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Verify Google boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          sudo -n -l /usr/local/sbin/status-google-production-cutover >/dev/null 2>&1
          sudo -n -l /usr/local/sbin/activate-google-production-bot >/dev/null 2>&1

      - name: Start migrated learnerbot only if needed
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(sudo -n /usr/local/sbin/status-google-production-cutover)"
          printf '%s\n' "$BEFORE"
          if grep -q '^google_service_active=active$' <<<"$BEFORE"; then
            echo 'GOOGLE_PRODUCTION_ALREADY_RUNNING=true'
          else
            sudo -n /usr/local/sbin/activate-google-production-bot
          fi
          sleep 5
          AFTER="$(sudo -n /usr/local/sbin/status-google-production-cutover)"
          printf '%s\n' "$AFTER"
          grep -q '^google_service_active=active$' <<<"$AFTER"
          grep -q '^google_service_enabled=enabled$' <<<"$AFTER"
          grep -q '^google_process_cwd=/root/multichain-learning-bot-v2.2-fast-direct-market$' <<<"$AFTER"
          echo 'GOOGLE_PRODUCTION_RUN_VERIFIED=true'
