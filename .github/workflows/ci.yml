name: Install Google Production Deployer and Run Bot

on:
  push:
    branches:
      - 'agent/current-trade-status'
    paths:
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: google-production-deployer-and-run
  cancel-in-progress: false

jobs:
  install-and-run:
    name: Install restricted deploy bridge and restart Google learnerbot
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Verify Google runner and sudo
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          sudo -n true
          echo 'GOOGLE_RUNNER_SUDO_READY=true'

      - name: Install restricted Google production deploy bridge
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/migration/google-production-cutover/scripts/install_google_production_deployer.sh \
            -o "$tmp"
          sudo -n bash "$tmp"

      - name: Restart only Google production learnerbot
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/status-google-production-bot
          sudo -n /usr/local/sbin/restart-google-production-bot
          sleep 10
          OUT="$(sudo -n /usr/local/sbin/status-google-production-bot)"
          printf '%s\n' "$OUT"
          grep -q '^google_service_active=active$' <<<"$OUT"
          grep -q '^google_service_enabled=enabled$' <<<"$OUT"
          grep -q '^google_process_cwd=/root/multichain-learning-bot-v2.2-fast-direct-market$' <<<"$OUT"
          echo 'GOOGLE_PRODUCTION_RUN_VERIFIED=true'
