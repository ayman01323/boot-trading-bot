name: Restore Google WinSCP SSH Access

on:
  push:
    branches:
      - 'agent/current-trade-status'
    paths:
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  restore-winscp-key:
    name: Restore WinSCP key for ayman01323 on Google
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Add WinSCP public key idempotently
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'

          KEY_TYPE='ssh-ed25519'
          KEY_BODY='AAAAC3NzaC1lZDI1NTE5AAAAIHpZkKAbpMnmuf83u+SbzomxHo6aNjBPbJipZW2aGhok'
          KEY_LINE="$KEY_TYPE $KEY_BODY winscp-ayman"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          if grep -Fq "$KEY_BODY" "$HOME/.ssh/authorized_keys"; then
            echo 'WINSCP_KEY_ALREADY_PRESENT=true'
          else
            printf '%s\n' "$KEY_LINE" >> "$HOME/.ssh/authorized_keys"
            echo 'WINSCP_KEY_ADDED=true'
          fi

          chmod 600 "$HOME/.ssh/authorized_keys"
          test "$(stat -c '%U' "$HOME/.ssh/authorized_keys")" = 'ayman01323'
          grep -Fq "$KEY_BODY" "$HOME/.ssh/authorized_keys"

          EXPECTED_FP="$(printf '%s\n' "$KEY_LINE" | ssh-keygen -lf /dev/stdin | awk '{print $2}')"
          INSTALLED_FP="$(grep -F "$KEY_BODY" "$HOME/.ssh/authorized_keys" | head -1 | ssh-keygen -lf /dev/stdin | awk '{print $2}')"
          test "$EXPECTED_FP" = "$INSTALLED_FP"
          echo "winscp_key_fingerprint=$INSTALLED_FP"
          echo 'WINSCP_SSH_ACCESS_KEY_VERIFIED=true'
