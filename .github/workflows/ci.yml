name: BOOT Python Tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q learnerbot scripts tests
      - name: Module import and production-order startup sweep
        run: pytest -x -vv tests/test_imports.py tests/test_main_import_order.py
      - name: Solana LIVE safety regression tests
        run: |
          pytest -x -vv \
            tests/test_solana_live_canary.py \
            tests/test_solana_execution_safety.py \
            tests/test_solana_execution_validation.py \
            tests/test_solana_position_wallet_binding.py \
            tests/test_solana_low_capital_limits.py \
            tests/test_solana_overhead_gate_correction.py \
            tests/test_solana_entry_capacity_reconcile.py \
            tests/test_solana_quote_execution_consistency.py \
            tests/test_solana_preflight_cache.py \
            tests/test_solana_profit_accounting_epoch.py \
            tests/test_solana_worker_reliability.py \
            tests/test_solana_leader_cursor_reliability.py \
            tests/test_solana_token_account_reclaim.py \
            tests/test_solana_refundable_rent_accounting.py \
            tests/test_solana_simulated_reserve_guard.py \
            tests/test_solana_execution_efficiency.py \
            tests/test_solana_atomic_close_fallback.py \
            tests/test_solana_liquidity_fail_closed.py \
            tests/test_solana_profit_first_live_correction.py \
            tests/test_solana_partial_sell_profit_guard.py \
            tests/test_solana_positive_edge_entry_gate.py \
            tests/test_solana_exit_circuit_breaker.py \
            tests/test_transaction_audit.py \
            tests/test_loss_forensics_github_export.py \
            tests/test_profit_control_loop.py \
            tests/test_profit_control_master_summary.py \
            tests/test_solana_runtime_composition.py
      - name: SiBot and Telegram UI tests
        run: |
          pytest -x -vv \
            tests/test_sibot.py \
            tests/test_sibot_pending_commands.py \
            tests/test_telegram_visual_ui.py \
            tests/test_sibot_reasonable_top20.py \
            tests/test_telegram_wallet_links.py \
            tests/test_sibot_intelligence_solana.py \
            tests/test_profit_research_hourly_capital.py \
            tests/test_telegram_solana_visibility.py \
            tests/test_sibot_readiness_alerts.py \
            tests/test_telegram_mobile_divider.py \
            tests/test_solana_wallet_telegram.py \
            tests/test_telegram_multi_wallet_manager.py \
            tests/test_telegram_solana_chains.py \
            tests/test_telegram_solana_everywhere.py \
            tests/test_live_reporting_all_chains.py \
            tests/test_telegram_solana_send.py \
            tests/test_telegram_usd_everywhere.py \
            tests/test_telegram_order_usd.py \
            tests/test_sibot_profit_guard.py \
            tests/test_solana_profit_guard.py \
            tests/test_sibot_evm_worker_reliability.py \
            tests/test_polygon_focus.py \
            tests/test_telegram_capital_readiness.py \
            tests/test_solana_balanced_frequency.py \
            tests/test_telegram_roles_and_command_scope.py \
            tests/test_telegram_user_menu_compact.py \
            tests/test_user_report_loss_alerts.py
      - name: Legacy full suite when runtime CSV fixtures are present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f CSVbot/chains.csv && -f CSVbot/auto_trading_settings.csv && -f CSVbot/live_trading_settings.csv && -f CSVbot/dex_registry.csv ]]; then
            pytest -x -vv
          else
            echo 'Skipping legacy config-bound tests: runtime CSVbot fixtures are not stored in this GitHub checkout.'
          fi

  gemini_connectivity:
    name: Gemini connectivity test
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'test/gemini-connectivity' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Gemini API key and model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-pro-preview' }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api_key = os.environ.get('GEMINI_API_KEY', '').strip()
          model = os.environ.get('GEMINI_MODEL', 'gemini-3.1-pro-preview').strip()
          if not api_key:
              print('GEMINI_API_KEY is not available; skipping optional Gemini connectivity check.')
              sys.exit(0)

          url = f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent'
          body = {
              'contents': [
                  {'parts': [{'text': 'This is a connectivity test. Reply with exactly GEMINI_GITHUB_OK and nothing else.'}]}
              ]
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'x-goog-api-key': api_key,
              },
              method='POST',
          )

          print(f'Testing Gemini model: {model}')
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  payload = json.loads(resp.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode('utf-8', errors='replace')
              print(f'Gemini HTTP error {exc.code}: {detail}')
              sys.exit(4)

          try:
              text = payload['candidates'][0]['content']['parts'][0]['text'].strip()
          except Exception:
              print('ERROR: unexpected Gemini response:', json.dumps(payload)[:4000])
              sys.exit(5)

          print('Gemini response:', text)
          if text != 'GEMINI_GITHUB_OK':
              print('ERROR: Gemini responded, but not with the required exact test value.')
              sys.exit(3)

          print('GEMINI_CONNECTIVITY_TEST_PASSED')
          PY

  deploy_current_main:
    name: Deploy current main to VPS
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/deploy-current-main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    steps:
      - name: Deploy tested current main
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/deploy-boot-trading-bot "$TARGET_SHA"
      - name: Server status
        if: always()
        shell: bash
        run: sudo /usr/local/sbin/status-boot-trading-bot
      - name: Captured learnerbot startup exception
        if: always()
        shell: bash
        run: |
          if [[ -r /tmp/learnerbot-startup-error.txt ]]; then
            cat /tmp/learnerbot-startup-error.txt
          else
            echo 'no readable /tmp/learnerbot-startup-error.txt'
          fi
      - name: Recent learnerbot journal after deploy attempt
        if: always()
        shell: bash
        run: |
          journalctl -u learnerbot.service --since '10 minutes ago' -n 350 --no-pager || true
      - name: Deployment wrapper log tail
        if: always()
        shell: bash
        run: |
          if [[ -r /var/log/boot-github-deploy.log ]]; then
            tail -n 120 /var/log/boot-github-deploy.log
          else
            echo 'deploy log is not readable by github-runner'
          fi

  server_diagnostics:
    name: Read VPS learnerbot diagnostics
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/server-diagnostics' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Current status
        shell: bash
        run: sudo /usr/local/sbin/status-boot-trading-bot
      - name: Captured learnerbot startup exception
        shell: bash
        run: |
          if [[ -r /tmp/learnerbot-startup-error.txt ]]; then
            cat /tmp/learnerbot-startup-error.txt
          else
            echo 'no readable /tmp/learnerbot-startup-error.txt'
          fi
      - name: Service unit metadata
        shell: bash
        run: |
          systemctl show learnerbot.service -p FragmentPath -p WorkingDirectory -p ExecStart --no-pager || true
      - name: Recent learnerbot journal
        shell: bash
        run: |
          journalctl -u learnerbot.service --since '20 minutes ago' -n 400 --no-pager || true
      - name: Deployment wrapper log tail
        shell: bash
        run: |
          if [[ -r /var/log/boot-github-deploy.log ]]; then
            tail -n 160 /var/log/boot-github-deploy.log
          else
            echo 'deploy log is not readable by github-runner'
          fi
