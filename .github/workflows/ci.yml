name: Continue Namecheap to Google Production Cutover

on:
  push:
    branches:
      - 'agent/current-trade-status'
    paths:
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: final-google-cutover-continuation
  cancel-in-progress: false

jobs:
  final-sync:
    name: Final stopped-state sync from Namecheap
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 180
    steps:
      - name: Verify only production learnerbot is quiesced
        shell: bash
        run: |
          set -euo pipefail
          case "$(hostname)" in mint|mint.yesgoodwill.com) ;; *) echo "Wrong host: $(hostname)" >&2; exit 10;; esac
          sudo -n /usr/local/sbin/verify-namecheap-cutover-stopped
          SHA="$(git -C /root/multichain-learning-bot-v2.2-fast-direct-market rev-parse HEAD)"
          test "$SHA" = 'dd3f00bbc4744235b98b866a62992633866f0db8'
          echo "namecheap_source_sha=$SHA"
          echo 'other_namecheap_services_touched=false'
      - name: Set fixed Google endpoint and run final stopped-state sync
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '35.234.74.46' > /var/tmp/namecheap-google-cutover-handoff/google-ip.txt
          chmod 600 /var/tmp/namecheap-google-cutover-handoff/google-ip.txt
          sudo -n /usr/local/sbin/final-sync-namecheap-to-google
          sudo -n /usr/local/sbin/verify-namecheap-cutover-stopped

  refresh-google:
    name: Refresh and verify Google production path
    needs: final-sync
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 45
    steps:
      - name: Confirm Google production is still stopped
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          sudo -n /usr/local/sbin/status-google-production-cutover
          ! sudo -n /usr/local/sbin/status-google-production-cutover | grep -q '^google_service_active=active$'
      - name: Refresh exact production path from final staging snapshot
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/refresh-google-production-bot
          sudo -n /usr/local/sbin/verify-google-production-bot

  activate-google:
    name: Activate Google production learnerbot only
    needs: refresh-google
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Start and verify learnerbot.service
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/activate-google-production-bot
          sudo -n /usr/local/sbin/status-google-production-cutover

  verify-old-stopped:
    name: Confirm old production learnerbot remains stopped
    needs: activate-google
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Verify Namecheap learnerbot only
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/verify-namecheap-cutover-stopped
          echo 'other_namecheap_services_touched=false'

  cleanup-key:
    name: Remove one-time cutover SSH key
    if: always()
    needs: [final-sync, refresh-google, activate-google, verify-old-stopped]
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Remove only the migration key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$HOME/.ssh/authorized_keys" ]]; then
            grep -v 'namecheap-google-final-cutover' "$HOME/.ssh/authorized_keys" > "$HOME/.ssh/authorized_keys.tmp" || true
            mv "$HOME/.ssh/authorized_keys.tmp" "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"
          fi
          echo 'FINAL_CUTOVER_SSH_KEY_REMOVED=true'
