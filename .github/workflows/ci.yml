name: Persist WinSCP Key in Google Instance Metadata

on:
  push:
    branches:
      - 'agent/current-trade-status'
    paths:
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  persist-winscp-key:
    name: Permanently register WinSCP key on botgoogle
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Add permanent instance metadata SSH key
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'

          KEY_BODY='AAAAC3NzaC1lZDI1NTE5AAAAIHpZkKAbpMnmuf83u+SbzomxHo6aNjBPbJipZW2aGhok'
          KEY_VALUE="ssh-ed25519 ${KEY_BODY} winscp-ayman"
          METADATA_LINE="ayman01323:${KEY_VALUE}"

          meta() {
            curl -fsS -H 'Metadata-Flavor: Google' --max-time 5 \
              "http://metadata.google.internal/computeMetadata/v1/$1"
          }

          PROJECT_ID="$(meta project/project-id)"
          ZONE_PATH="$(meta instance/zone)"
          ZONE="${ZONE_PATH##*/}"
          test -n "$PROJECT_ID"
          test -n "$ZONE"
          echo "project_id=$PROJECT_ID"
          echo "zone=$ZONE"

          command -v gcloud >/dev/null
          command -v python3 >/dev/null

          DESC="$(mktemp)"
          KEYFILE="$(mktemp)"
          ERRFILE="$(mktemp)"
          trap 'rm -f "$DESC" "$KEYFILE" "$ERRFILE"' EXIT

          gcloud compute instances describe botgoogle \
            --project "$PROJECT_ID" \
            --zone "$ZONE" \
            --format=json > "$DESC"

          python3 - "$DESC" "$KEYFILE" "$KEY_BODY" "$METADATA_LINE" <<'PY'
          import json, sys
          desc_path, out_path, key_body, metadata_line = sys.argv[1:]
          with open(desc_path, encoding='utf-8') as f:
              obj = json.load(f)
          items = (obj.get('metadata') or {}).get('items') or []
          current = ''
          for item in items:
              if item.get('key') == 'ssh-keys':
                  current = item.get('value') or ''
                  break
          lines = [line for line in current.splitlines() if line.strip()]
          already = any(key_body in line for line in lines)
          if not already:
              lines.append(metadata_line)
          with open(out_path, 'w', encoding='utf-8', newline='\n') as f:
              if lines:
                  f.write('\n'.join(lines) + '\n')
          print(f'instance_metadata_ssh_key_lines_before={len([x for x in current.splitlines() if x.strip()])}')
          print(f'winscp_key_already_in_instance_metadata={str(already).lower()}')
          print(f'instance_metadata_ssh_key_lines_after={len(lines)}')
          PY

          if ! gcloud compute instances add-metadata botgoogle \
              --project "$PROJECT_ID" \
              --zone "$ZONE" \
              --metadata-from-file="ssh-keys=$KEYFILE" \
              --quiet >/dev/null 2>"$ERRFILE"; then
            echo 'INSTANCE_METADATA_WRITE_FAILED=true'
            tail -20 "$ERRFILE" >&2 || true
            exit 41
          fi
          echo 'INSTANCE_METADATA_WRITE_SUCCESS=true'

          FOUND=false
          for _ in 1 2 3 4 5 6 7 8 9; do
            if [[ -f "$HOME/.ssh/authorized_keys" ]] && grep -Fq "$KEY_BODY" "$HOME/.ssh/authorized_keys"; then
              FOUND=true
              break
            fi
            sleep 10
          done

          if [[ "$FOUND" != true ]]; then
            echo 'GUEST_AGENT_DID_NOT_MATERIALIZE_KEY=true'
            exit 42
          fi

          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"
          INSTALLED_FP="$(grep -F "$KEY_BODY" "$HOME/.ssh/authorized_keys" | head -1 | ssh-keygen -lf /dev/stdin | awk '{print $2}')"
          echo "winscp_key_fingerprint=$INSTALLED_FP"
          echo 'WINSCP_KEY_PERSISTENT_METADATA_VERIFIED=true'
