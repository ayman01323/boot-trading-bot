name: Claude Agent Smoke Test

on:
  workflow_dispatch:
    inputs:
      run_paid_check:
        description: 'Make one real Anthropic API call'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.run_paid_check == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install official Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Verify Anthropic credential and read-only Claude invocation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: '1'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANTHROPIC_API_KEY:-}"
          claude --version
          out="$(claude -p --permission-mode plan --model sonnet --max-turns 1 --output-format text \
            'Credential smoke test only. Do not use tools. Reply exactly CLAUDE_AGENT_OK')"
          printf '%s\n' "$out"
          grep -Fq 'CLAUDE_AGENT_OK' <<< "$out"
