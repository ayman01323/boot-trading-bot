name: Claude Fourth Engineering Agent

on:
  workflow_run:
    workflows: ["Weekly Three-Agent Full-Bot Bug Audit"]
    types: [completed]
  schedule:
    - cron: '35 4 * * 1'
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Optional immutable engineering source commit; defaults to latest weekly source'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: claude-fourth-engineering-agent
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main for orchestration
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install official Claude Code CLI
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Resolve immutable engineering source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${INPUT_SOURCE:-}"
          if [[ -z "$source_sha" ]]; then
            source_sha="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/weekly/latest_source_commit.txt?ref=ai-reviews" \
              --jq '.content' | tr -d '\n' | base64 -d | tr -d '\r\n')"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid engineering source commit.' >&2; exit 2; }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact engineering source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "$SOURCE_SHA" || true
          git checkout --detach "$SOURCE_SHA"
          git clean -fdx

      - name: Fetch optional published baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .claude_engineering
          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/weekly/runs/${SOURCE_SHA}/baseline.json?ref=ai-reviews" \
            --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > .claude_engineering/baseline.json
          rc=$?
          set -e
          if [[ $rc -ne 0 || ! -s .claude_engineering/baseline.json ]]; then echo '{}' > .claude_engineering/baseline.json; fi

      - name: Claude independent full-repository engineering audit
        id: claude
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_ENGINEERING_MODEL: ${{ vars.CLAUDE_ENGINEERING_MODEL || 'sonnet' }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DISABLE_AUTOUPDATER: '1'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANTHROPIC_API_KEY:-}"
          cat > /tmp/claude-engineering-prompt.txt <<EOF
          You are CLAUDE, one of four INDEPENDENT engineering reviewers of an automated multi-chain trading bot.
          Exact source commit: ${SOURCE_SHA}
          Inspect the checked-out repository deeply. You may read .claude_engineering/baseline.json.

          REPORT ONLY. Do not edit files, run trades, deploy, touch wallets/secrets/signing, change LIVE/capital settings,
          or weaken safety/executability controls. Look for concrete bugs, race conditions, stale-state errors, accounting
          defects, execution/simulation mismatches, security problems, and test gaps. Prefer evidence over speculation.

          Return exactly one JSON object between CLAUDE_ENGINEERING_JSON_BEGIN and CLAUDE_ENGINEERING_JSON_END:
          {
            "schema_version":1,
            "provider":"claude",
            "source_commit":"${SOURCE_SHA}",
            "scope":"FULL_REPOSITORY_BUG_AUDIT",
            "status":"CLEAN|ISSUES_FOUND|INCOMPLETE",
            "summary":"...",
            "findings":[{
              "id":"stable-short-id",
              "severity":"P0|P1|P2|P3",
              "title":"...",
              "evidence":[{"file":"exact/path.py","detail":"specific evidence"}],
              "impact":"...",
              "recommended_fix":"...",
              "tests_required":["specific test"],
              "confidence":0.0,
              "deterministic_evidence":false
            }],
            "refusals_or_limits":[],
            "report_only":true,
            "no_live_changes":true
          }
          EOF
          claude -p --permission-mode plan --max-turns 1 --output-format text \
            --model "$CLAUDE_ENGINEERING_MODEL" "$(cat /tmp/claude-engineering-prompt.txt)" \
            > /tmp/claude-engineering.out
          python - "$SOURCE_SHA" <<'PY'
          import json,re,sys,pathlib
          source=sys.argv[1]
          raw=pathlib.Path('/tmp/claude-engineering.out').read_text(encoding='utf-8',errors='replace')
          m=re.search(r'CLAUDE_ENGINEERING_JSON_BEGIN\s*(\{.*?\})\s*CLAUDE_ENGINEERING_JSON_END',raw,re.S)
          if not m: raise SystemExit('Claude engineering JSON markers missing')
          p=json.loads(m.group(1))
          if p.get('provider')!='claude' or p.get('source_commit')!=source: raise SystemExit('Claude identity mismatch')
          if p.get('scope')!='FULL_REPOSITORY_BUG_AUDIT': raise SystemExit('Claude scope mismatch')
          if p.get('status') not in {'CLEAN','ISSUES_FOUND','INCOMPLETE'}: raise SystemExit('Claude status invalid')
          if p.get('report_only') is not True or p.get('no_live_changes') is not True: raise SystemExit('Claude safety flags invalid')
          if not isinstance(p.get('findings'),list): raise SystemExit('Claude findings invalid')
          for row in p['findings']:
              if row.get('severity') not in {'P0','P1','P2','P3'}: raise SystemExit('severity invalid')
              c=float(row.get('confidence',-1))
              if c<0 or c>1: raise SystemExit('confidence invalid')
              if not isinstance(row.get('evidence'),list) or not row['evidence']: raise SystemExit('evidence required')
              if not isinstance(row.get('tests_required'),list): raise SystemExit('tests_required required')
          pathlib.Path('.claude_engineering/claude.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          md=['# Claude engineering audit','',p.get('summary') or '', '', f"Status: {p.get('status')}"]
          for row in p.get('findings') or []:
              md += ['', f"## {row.get('severity')} — {row.get('title')}", str(row.get('impact') or '')]
          pathlib.Path('.claude_engineering/claude.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          PY

      - name: Recover an explicit incomplete Claude report
        if: steps.claude.outcome != 'success'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          mkdir -p .claude_engineering
          python - <<'PY'
          import json,os
          p={
            'schema_version':1,'provider':'claude','source_commit':os.environ['SOURCE_SHA'],
            'scope':'FULL_REPOSITORY_BUG_AUDIT','status':'INCOMPLETE',
            'summary':'Claude engineering review did not complete.','findings':[],
            'refusals_or_limits':['Inspect Claude engineering workflow logs.'],
            'report_only':True,'no_live_changes':True,
          }
          open('.claude_engineering/claude.json','w').write(json.dumps(p,indent=2,sort_keys=True)+'\n')
          open('.claude_engineering/claude.md','w').write('# Claude engineering audit\n\nINCOMPLETE\n')
          PY

      - name: Publish Claude report to immutable ai-reviews cycle
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/claude-eng-reviews
          git worktree add --detach /tmp/claude-eng-reviews origin/ai-reviews
          dest="/tmp/claude-eng-reviews/weekly/runs/${SOURCE_SHA}"
          mkdir -p "$dest"
          cp .claude_engineering/claude.json "$dest/claude.json"
          cp .claude_engineering/claude.md "$dest/claude.md"
          cd /tmp/claude-eng-reviews
          git config user.name 'claude-engineering-reviewer'
          git config user.email 'claude-engineering-reviewer@users.noreply.github.com'
          git add "weekly/runs/${SOURCE_SHA}/claude.json" "weekly/runs/${SOURCE_SHA}/claude.md"
          if ! git diff --cached --quiet; then
            git commit -m "Add Claude engineering audit ${SOURCE_SHA:0:12}"
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            git push origin HEAD:ai-reviews
          fi
