name: Claude Fourth Strategy Agent

# Runs concurrently with "Hourly Three-Agent Strategy Cycle" (same schedule)
# rather than waiting for it to finish. Independently resolves its own exact
# source commit / evidence hash / cycle id using the identical deterministic
# algorithm the other workflow uses, so the two naturally agree on the same
# cycle id for the same commit+hour without either one depending on files the
# other publishes. Uses its own cost-gate state key
# (strategy/claude_cost_gate_state.json) rather than sharing
# strategy/cost_gate_state.json, so the two workflows never race on the same
# file when they publish around the same time.

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'Optional immutable strategy cycle; defaults to resolving the current commit'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: claude-fourth-strategy-agent
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact current main without persisted GitHub credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude reviewer tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Resolve source and freshest available evidence
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CYCLE: ${{ inputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .strategy_claude
          SOURCE_SHA="$(git rev-parse HEAD)"
          EVIDENCE_SOURCE="architecture-only"
          EVIDENCE_FRESH="false"

          if gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/latest_loss_forensics.json?ref=audit-status" \
              > /tmp/claude-audit-status-file.json 2>/tmp/claude-audit-status-error.txt; then
            jq -r '.content' /tmp/claude-audit-status-file.json | tr -d '\n' | base64 -d > .strategy_claude/evidence.json
            EVIDENCE_SOURCE="audit-status:latest_loss_forensics.json"
            age="$(python - <<'PY'
          import json,time
          p=json.load(open('.strategy_claude/evidence.json'))
          t=int(p.get('generated_epoch') or 0)
          print(max(0,int(time.time())-t) if t else 10**9)
          PY
          )"
            if [[ "$age" -le 7200 ]]; then EVIDENCE_FRESH="true"; fi
          fi

          if [[ ! -s .strategy_claude/evidence.json ]]; then
            python - "$SOURCE_SHA" <<'PY' > .strategy_claude/evidence.json
          import json,sys
          print(json.dumps({
            'schema_version':1,
            'generated_epoch':0,
            'generated_utc':'',
            'evidence_status':'MISSING_RUNTIME_FORENSICS',
            'source_commit':sys.argv[1],
            'note':'No current sanitised runtime forensics branch was available. Review code/architecture, identify evidence gaps, and do not claim live profitability or canary readiness.'
          },indent=2,sort_keys=True))
          PY
          fi

          # Same deterministic formula as hourly-three-agent-strategy-cycle.yml, so
          # the two workflows agree on the same cycle id for the same commit+hour
          # without either depending on a file the other publishes.
          EVIDENCE_SHA="$(sha256sum .strategy_claude/evidence.json | awk '{print $1}')"
          HOUR_KEY="$(date -u +'%Y%m%d%H')"
          CYCLE_ID="${INPUT_CYCLE:-${SOURCE_SHA:0:12}-${HOUR_KEY}-${EVIDENCE_SHA:0:8}}"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "evidence_sha=$EVIDENCE_SHA" >> "$GITHUB_OUTPUT"
          echo "cycle_id=$CYCLE_ID" >> "$GITHUB_OUTPUT"
          echo "evidence_source=$EVIDENCE_SOURCE" >> "$GITHUB_OUTPUT"
          echo "evidence_fresh=$EVIDENCE_FRESH" >> "$GITHUB_OUTPUT"

      - name: Evaluate paid-AI cost gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/strategy/claude_cost_gate_state.json?ref=ai-reviews" --jq '.content' 2>/dev/null \
            | tr -d '\n' | base64 -d > /tmp/claude-cost-gate-state.json 2>/dev/null
          rc=$?
          set -e
          if [[ $rc -ne 0 || ! -s /tmp/claude-cost-gate-state.json ]]; then echo '{}' > /tmp/claude-cost-gate-state.json; fi

          PYTHONPATH="$GITHUB_WORKSPACE" python - "$SOURCE_SHA" "$MANUAL" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          from learnerbot.strategy_ai_cost_gate import evaluate_cost_gate
          source_sha,manual=sys.argv[1],sys.argv[2].lower()=='true'
          evidence=json.load(open('.strategy_claude/evidence.json'))
          try:
              previous=json.load(open('/tmp/claude-cost-gate-state.json'))
          except Exception:
              previous={}
          result=evaluate_cost_gate(source_commit=source_sha,evidence=evidence,previous_state=previous,manual=manual)
          print(f"run_ai={str(result['run_ai']).lower()}")
          print(f"reason={result['reason']}")
          print(f"material_sha256={result['material_sha256']}")
          PY

      - name: Skip paid AI review -- no material change
        if: steps.gate.outputs.run_ai != 'true'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        shell: bash
        run: |
          echo "Skipping paid Claude review this cycle: ${REASON}"

      - name: Prepare Claude strategy prompt
        if: steps.gate.outputs.run_ai == 'true'
        env:
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          EVIDENCE_SOURCE: ${{ steps.meta.outputs.evidence_source }}
          EVIDENCE_FRESH: ${{ steps.meta.outputs.evidence_fresh }}
        shell: bash
        run: |
          cat > .strategy_claude/prompt.txt <<EOF
          You are CLAUDE, the fourth INDEPENDENT strategy reviewer for a multi-chain automated trading bot.
          Inspect the checked-out repository and .strategy_claude/evidence.json.

          Exact cycle: ${CYCLE_ID}
          Exact source commit: ${SOURCE_SHA}
          Exact evidence SHA-256: ${EVIDENCE_SHA}
          Evidence source: ${EVIDENCE_SOURCE}; fresh-within-2h=${EVIDENCE_FRESH}

          Objective: durable money-weighted NET P&L after fees, slippage, price impact, EVM gas, Solana priority fees,
          latency, failed executions and exit costs. Do not optimise win count. Separate STRATEGY/MARKET loss from
          EXECUTION/INFRASTRUCTURE failure and compare Solana and EVM using chain-specific economics.

          Missing/stale runtime evidence alone does not make a repository architecture review incomplete. If fresh runtime
          evidence is unavailable, you MAY suggest code/SHADOW hypotheses but MUST NOT claim measured profitability, canary
          readiness or LIVE readiness.
          REPORT ONLY. Do not edit code, trade, deploy, change LIVE/risk/capital settings, touch secrets/wallets/signing,
          add assets, weaken simulation/liquidity/sellability controls, or use external web research.

          Return exactly one JSON report between these markers:
          STRATEGY_REVIEW_JSON_BEGIN
          {
            "schema_version":1,
            "provider":"claude",
            "cycle_id":"${CYCLE_ID}",
            "source_commit":"${SOURCE_SHA}",
            "evidence_sha256":"${EVIDENCE_SHA}",
            "scope":"MULTI_AGENT_STRATEGY_REVIEW",
            "status":"HEALTHY|CHANGES_PROPOSED|INCOMPLETE",
            "summary":"...",
            "proposals":[{
              "id":"stable-id",
              "action":"KEEP|IMPROVE|REWORK|SHADOW_MORE|REPLACE|DORMANT|NEW_SHADOW|ASSET_REQUEST|RESEARCH_MORE",
              "strategy":"...",
              "chain_scope":["SOLANA","EVM"],
              "evidence":[{"path":"repository or JSON path","detail":"specific support"}],
              "rationale":"...",
              "expected_effect":"...",
              "downside_risk":"...",
              "shadow_test":"falsifiable test including costs and stop/failure condition",
              "minimum_observation":"...",
              "confidence":0.0,
              "suggested_files":["Strategy Lab/SHADOW files only"]
            }],
            "rejected_ideas":[{"idea":"...","reason":"..."}],
            "evidence_gaps":["..."],
            "review_only":true,
            "no_live_changes":true
          }
          STRATEGY_REVIEW_JSON_END
          Prefer no change over unsupported confidence.
          EOF

      - name: Claude independent strategy report
        id: claude
        if: steps.gate.outputs.run_ai == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_STRATEGY_MODEL: ${{ vars.CLAUDE_STRATEGY_MODEL || 'sonnet' }}
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          DISABLE_AUTOUPDATER: '1'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANTHROPIC_API_KEY:-}"
          set +e
          claude -p --permission-mode plan --model "$CLAUDE_STRATEGY_MODEL" --max-turns 8 --output-format text \
            "$(cat .strategy_claude/prompt.txt)" \
            > .strategy_claude/claude_stdout.txt 2> .strategy_claude/claude_error.txt
          rc=$?
          set -e
          [[ $rc -eq 0 ]] || exit "$rc"

          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/extract_strategy_report.py \
            --input .strategy_claude/claude_stdout.txt --output .strategy_claude/claude.json \
            --provider claude --cycle-id "$CYCLE_ID" --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m learnerbot.three_agent_strategy_contract validate-agent \
            --input .strategy_claude/claude.json --provider claude --cycle-id "$CYCLE_ID" \
            --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA"

          python - <<'PY'
          import json
          p=json.load(open('.strategy_claude/claude.json'))
          lines=['# Claude strategy review','',p.get('summary','')]
          for x in p.get('proposals') or []:
              lines += ['',f"## {x.get('action')} — {x.get('strategy')}",x.get('rationale','')]
          open('.strategy_claude/claude.md','w').write('\n'.join(lines)+'\n')
          PY

          python - <<'PY'
          import subprocess,sys
          bad=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              if line[:2]=='??' and line[3:].replace('\\','/').startswith('.strategy_claude/'):
                  continue
              bad.append(line)
          if bad:
              print('Claude reviewer changed tracked/out-of-scope files:',*bad,sep='\n',file=sys.stderr)
              raise SystemExit(3)
          PY

      - name: Recover Claude incomplete report
        if: steps.gate.outputs.run_ai == 'true' && steps.claude.outcome != 'success'
        env:
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          ANTHROPIC_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        shell: bash
        run: |
          mkdir -p .strategy_claude
          python - <<'PY'
          import json,os,re,pathlib
          parts=[]
          for name in ('claude_error.txt','claude_stdout.txt'):
              p=pathlib.Path('.strategy_claude')/name
              if p.exists() and p.stat().st_size:
                  parts.append(p.read_text(errors='replace')[-1200:])
          raw='\n'.join(parts)
          raw=re.sub(r'sk-ant-[A-Za-z0-9_-]+','<redacted>',raw)
          reason='ANTHROPIC_API_KEY is missing.' if os.environ.get('ANTHROPIC_PRESENT')!='true' else (raw.strip() or 'Claude execution/report extraction failed without diagnostic output.')
          p={
            'schema_version':1,'provider':'claude','cycle_id':os.environ['CYCLE_ID'],
            'source_commit':os.environ['SOURCE_SHA'],'evidence_sha256':os.environ['EVIDENCE_SHA'],
            'scope':'MULTI_AGENT_STRATEGY_REVIEW','status':'INCOMPLETE','summary':'Claude report failed.',
            'proposals':[],'rejected_ideas':[],'evidence_gaps':[reason[:1800]],
            'review_only':True,'no_live_changes':True
          }
          pathlib.Path('.strategy_claude/claude.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          pathlib.Path('.strategy_claude/claude.md').write_text('# Claude strategy review\n\nINCOMPLETE\n\n'+reason[:1800]+'\n')
          PY

      - name: Publish Claude into the shared strategy cycle
        if: steps.gate.outputs.run_ai == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          EVIDENCE_SOURCE: ${{ steps.meta.outputs.evidence_source }}
          EVIDENCE_FRESH: ${{ steps.meta.outputs.evidence_fresh }}
          MATERIAL_SHA: ${{ steps.gate.outputs.material_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/claude-ai-reviews
          git worktree add --detach /tmp/claude-ai-reviews origin/ai-reviews
          dest="/tmp/claude-ai-reviews/strategy/runs/${CYCLE_ID}"
          mkdir -p "$dest" /tmp/claude-ai-reviews/strategy
          cp .strategy_claude/claude.json "$dest/claude.json"
          cp .strategy_claude/claude.md "$dest/claude.md"

          # Claude may run before, after or alongside the GPT+Gemini workflow, so
          # context.json and latest_status.json might not exist for this cycle yet
          # -- create them if missing instead of assuming the other workflow got
          # there first.
          python - <<PY
          import json
          p='${dest}/context.json'
          try:
              d=json.load(open(p))
          except Exception:
              d={
                'cycle_id':'${CYCLE_ID}','source_commit':'${SOURCE_SHA}','evidence_sha256':'${EVIDENCE_SHA}',
                'evidence_source':'${EVIDENCE_SOURCE}','evidence_fresh':'${EVIDENCE_FRESH}','base_kind':'HOURLY_CURRENT_MAIN',
              }
          d['anthropic_credential_present']=True
          d['claude_report_available']=True
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY

          python - <<PY
          import json
          p='/tmp/claude-ai-reviews/strategy/latest_status.json'
          try:
              s=json.load(open(p))
          except Exception:
              s={
                'available':True,'cycle_id':'${CYCLE_ID}','source_commit':'${SOURCE_SHA}',
                'evidence_sha256':'${EVIDENCE_SHA}','evidence_fresh':'${EVIDENCE_FRESH}',
                'gpt':'PENDING','gemini':'PENDING','copilot':'PENDING',
                'three_agent_reports_complete':False,'master_decision_available':False,
                'change_pr_url':'','live_auto_deploy':False,
              }
          claude_report=json.load(open('.strategy_claude/claude.json'))
          s['claude']='INCOMPLETE' if claude_report.get('status')=='INCOMPLETE' else 'DONE'
          s['four_agent_reports_complete']=False
          s['four_agent_master_decision_available']=False
          if s.get('state') in {'MASTER_DECIDED_4_AGENT','FOUR_AGENT_COMPLETE'}:
              s['state']='WAITING_FOR_FOUR_AGENT_RECONCILIATION'
          open(p,'w').write(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY

          # Only create latest_cycle_id.txt if it doesn't already point at this (or
          # a newer) cycle -- never overwrite a newer pointer with an older one.
          existing_cycle="$(cat /tmp/claude-ai-reviews/strategy/latest_cycle_id.txt 2>/dev/null || true)"
          if [[ -z "$existing_cycle" || "$existing_cycle" < "$CYCLE_ID" ]]; then
            printf '%s\n' "$CYCLE_ID" > /tmp/claude-ai-reviews/strategy/latest_cycle_id.txt
          fi

          python - <<PY > /tmp/claude-ai-reviews/strategy/claude_cost_gate_state.json
          import json,time
          print(json.dumps({
            'last_ai_attempt_epoch':int(time.time()),
            'last_ai_attempt_source_commit':'${SOURCE_SHA}',
            'last_ai_attempt_material_sha256':'${MATERIAL_SHA}',
          },indent=2,sort_keys=True))
          PY

          cd /tmp/claude-ai-reviews
          git config user.name 'claude-fourth-strategy-agent'
          git config user.email 'claude-fourth-strategy-agent@users.noreply.github.com'
          git add "strategy/runs/${CYCLE_ID}/claude.json" "strategy/runs/${CYCLE_ID}/claude.md" \
                  "strategy/runs/${CYCLE_ID}/context.json" strategy/latest_status.json \
                  strategy/latest_cycle_id.txt strategy/claude_cost_gate_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Add Claude strategy review ${CYCLE_ID}"
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            git push origin HEAD:ai-reviews
          fi

      - name: Clean workspace
        if: always()
        run: rm -rf .strategy_claude /tmp/claude-ai-reviews /tmp/claude-meta.env
