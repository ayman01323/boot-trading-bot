name: Claude Google Bot Preflight

# Bounded, non-trading preflight for claude-trading-bot on botgoogle.
# It runs only `python run.py check`; it never invokes `run.py start` or the
# live trading loop. The check may perform its documented engineering side
# effects (for example Telegram delivery verification and isolated DB schema
# initialization), but it does not construct, sign, or broadcast a trade.
#
# Privacy rule: the published report is allowlisted. Raw preflight output is
# never printed or committed because it could contain provider exception text,
# wallet addresses/balances, paths, or other operational details. Only check
# names + PASS/FAIL/SKIP, safe booleans, missing VARIABLE NAMES, and the
# managed checkout SHA are published to server-diagnostics.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claude-google-bot-preflight.yml'
      - '.github/claude-google-bot-preflight.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-google-bot-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 20
    env:
      MANAGED_REPO: /home/ayman01323/ClaudeServer/boot-trading-bot
      RUNTIME_ENV: /home/ayman01323/ClaudeServer/runtime/claude-trading-bot.env
      REPORT: /tmp/claude-google-bot-preflight-safe.txt
      RAW: /tmp/claude-google-bot-preflight-raw.txt
      VENV: /tmp/claude-preflight-venv

    steps:
      - name: Verify Google runner boundary and initialize safe report
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          test -d "$MANAGED_REPO/.git"
          test -d "$MANAGED_REPO/claude-trading-bot"
          : > "$REPORT"
          echo "managed_repo_sha=$(git -C "$MANAGED_REPO" rev-parse HEAD)" >> "$REPORT"
          if [[ -f "$RUNTIME_ENV" ]]; then
            echo 'runtime_env_present=true' >> "$REPORT"
          else
            echo 'runtime_env_present=false' >> "$REPORT"
          fi

      - name: Set up throwaway venv and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          set +e
          "$VENV/bin/python" -m pip install --quiet --disable-pip-version-check -r "$MANAGED_REPO/requirements.txt"
          rc=$?
          set -e
          echo "dependency_install_exit_code=$rc" >> "$REPORT"
          exit "$rc"

      - name: Inspect runtime inputs by name only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$VENV/bin/python" ]]; then
            echo 'runtime_input_scan=NOT_RUN' >> "$REPORT"
            exit 0
          fi
          "$VENV/bin/python" - "$RUNTIME_ENV" "$MANAGED_REPO" >> "$REPORT" <<'PY'
          import sys
          from pathlib import Path
          from dotenv import dotenv_values

          env_path = Path(sys.argv[1])
          managed_repo = Path(sys.argv[2]).resolve()
          tracked = (
              'CSV_DIR',
              'DATA_DIR',
              'TELEGRAM_BOT_TOKEN',
              'TELEGRAM_CHAT_IDS',
              'MAX_CAPITAL_USD',
              'MAX_POSITION_USD',
              'MAX_TOTAL_EXPOSURE_USD',
              'MAX_DAILY_LOSS_USD',
              'MAX_DRAWDOWN_PCT',
              'MAX_OPEN_POSITIONS',
              'SOLANA_RPC_URL',
              'SOLANA_WS_URL',
              'JUPITER_API_KEY',
              'CLAUDE_BOT_WALLET_OWNER_ID',
              'AUTHORISED_CHAINS',
          )

          values = dotenv_values(env_path) if env_path.is_file() else {}
          missing = [name for name in tracked if not str(values.get(name) or '').strip()]
          print('runtime_input_scan=PASS')
          print('missing_runtime_vars=' + (','.join(missing) if missing else 'NONE'))

          def outside_checkout(name: str) -> bool:
              raw = str(values.get(name) or '').strip()
              if not raw:
                  return False
              try:
                  candidate = Path(raw).expanduser().resolve()
                  candidate.relative_to(managed_repo)
                  return False
              except ValueError:
                  return True
              except Exception:
                  return False

          print(f"csv_dir_outside_git_checkout={str(outside_checkout('CSV_DIR')).lower()}")
          print(f"data_dir_outside_git_checkout={str(outside_checkout('DATA_DIR')).lower()}")
          PY

      - name: Run bot-owned preflight with raw output quarantined
        id: run_check
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$MANAGED_REPO/claude-trading-bot"
          set +e
          "$VENV/bin/python" run.py check > "$RAW" 2>&1
          rc=$?
          set -e
          echo "run_py_check_exit_code=$rc" >> "$REPORT"
          exit 0

      - name: Convert raw preflight output to allowlisted status only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RAW" ]]; then
            echo 'preflight_status_parse=NOT_RUN' >> "$REPORT"
            exit 0
          fi
          python3 - "$RAW" >> "$REPORT" <<'PY'
          import re
          import sys

          raw_path = sys.argv[1]
          allowed = {
              'env isolation': 'env_isolation',
              'hard risk engine config': 'hard_risk_engine_config',
              'Solana RPC connectivity': 'solana_rpc_connectivity',
              'Solana WebSocket connectivity': 'solana_websocket_connectivity',
              'Solana buy-side quote (SOL->USDC)': 'solana_buy_quote',
              'Solana sell-side quote (USDC->SOL)': 'solana_sell_quote',
              'Telegram delivery': 'telegram_delivery',
              'database init': 'database_init',
              'kill-switch state (report only, no changes)': 'kill_switch_state',
              'signing readiness (SIGNER_READY)': 'signing_readiness',
              'wallet balance read (live on-chain getBalance, not just file presence)': 'wallet_balance_read',
          }
          found = {}
          signer_ready = 'unknown'
          pattern = re.compile(r'^\[(PASS|FAIL|SKIP)\]\s+(.+?)(?:\s+—\s+.*)?$')

          with open(raw_path, encoding='utf-8', errors='replace') as fh:
              for raw in fh:
                  line = raw.rstrip('\n')
                  if 'SIGNER_READY=true' in line:
                      signer_ready = 'true'
                  elif 'SIGNER_READY=false' in line:
                      signer_ready = 'false'
                  m = pattern.match(line)
                  if not m:
                      continue
                  status, name = m.groups()
                  slug = allowed.get(name)
                  if slug:
                      found[slug] = status

          print('preflight_status_parse=PASS')
          for name, slug in allowed.items():
              print(f'check.{slug}={found.get(slug, "NOT_RUN")}')
          print(f'signer_ready={signer_ready}')
          PY

      - name: Publish allowlisted preflight report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -s "$REPORT" ]] || printf 'preflight=NOT_RUN\n' > "$REPORT"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo 'hostname=botgoogle'
            echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            cat "$REPORT"
          } > /tmp/claude-google-bot-preflight-publish.txt

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/claude-google-bot-preflight.txt"
          encoded="$(base64 -w0 /tmp/claude-google-bot-preflight-publish.txt)"
          published=false
          for attempt in 1 2 3 4 5; do
            current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
            existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
            if [[ -n "$existing_sha" ]]; then
              payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({'message':'Update Claude Google bot preflight','content':sys.argv[1],'sha':sys.argv[2],'branch':'server-diagnostics'}))
          PY
          )"
            else
              payload="$(python3 - "$encoded" <<'PY'
          import json,sys
          print(json.dumps({'message':'Create Claude Google bot preflight','content':sys.argv[1],'branch':'server-diagnostics'}))
          PY
          )"
            fi
            code="$(curl -sS -o /tmp/preflight-publish-response.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" -d "$payload")"
            if [[ "$code" == '200' || "$code" == '201' ]]; then
              published=true
              break
            fi
            if [[ "$code" != '409' ]]; then
              echo "publish_http_status=$code" >&2
              exit 1
            fi
            sleep "$attempt"
          done
          test "$published" = true
          cat /tmp/claude-google-bot-preflight-publish.txt

      - name: Clean up temporary preflight files
        if: always()
        shell: bash
        run: |
          rm -rf "$VENV" "$RAW" "$REPORT" \
            /tmp/claude-google-bot-preflight-publish.txt \
            /tmp/preflight-publish-response.json
