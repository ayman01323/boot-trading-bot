name: Claude Google Controlled Operations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claude-google-controlled-ops.yml'
      - '.github/claude-google-sync.trigger'
  workflow_dispatch:
    inputs:
      action:
        description: 'Bounded Google-server action'
        required: true
        default: inspect
        type: choice
        options: [inspect, test, sync]

permissions:
  contents: read

concurrency:
  group: claude-google-controlled-ops
  cancel-in-progress: false

jobs:
  operate:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 20
    env:
      MANAGED_ROOT: /home/ayman01323/ClaudeServer
      MANAGED_REPO: /home/ayman01323/ClaudeServer/boot-trading-bot
      RUNTIME_ENV: /home/ayman01323/ClaudeServer/runtime/claude-trading-bot.env
      # Operator-owned risk profile. With a $500 capital ceiling, 3% per
      # position is $15. Ten simultaneous positions therefore imply a maximum
      # 30% / $150 aggregate exposure. The stronger Solana execution-size
      # controls remain unchanged: 0.0005 SOL default canary and 0.001 SOL
      # absolute hard maximum per entry.
      CLAUDE_MAX_CAPITAL_USD: '500'
      CLAUDE_MAX_POSITION_USD: '15'
      CLAUDE_MAX_TOTAL_EXPOSURE_USD: '150'
      CLAUDE_MAX_DAILY_LOSS_USD: '50'
      CLAUDE_MAX_DRAWDOWN_PCT: '20'
      CLAUDE_MAX_OPEN_POSITIONS: '10'
      CLAUDE_AUTHORISED_CHAINS: 'solana'
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve bounded action
        id: request
        shell: bash
        run: |
          set -euo pipefail
          action='${{ github.event_name == 'workflow_dispatch' && inputs.action || 'sync' }}'
          case "$action" in
            inspect|test|sync) ;;
            *) echo "Unsupported action: $action" >&2; exit 2 ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Verify Google runner identity and managed boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(whoami)" = 'ayman01323'
          case "$MANAGED_ROOT" in
            /home/ayman01323/ClaudeServer) ;;
            *) echo 'Managed root boundary mismatch' >&2; exit 3 ;;
          esac
          mkdir -p "$MANAGED_ROOT"
          chmod 700 "$MANAGED_ROOT"
          echo "hostname=$(hostname)"
          echo "user=$(whoami)"
          echo "managed_repo=$MANAGED_REPO"

      - name: Inspect managed server workspace
        if: steps.request.outputs.action == 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$MANAGED_REPO/.git" ]]; then
            echo 'managed_repo_present=false'
            exit 0
          fi
          echo 'managed_repo_present=true'
          git -C "$MANAGED_REPO" remote -v
          git -C "$MANAGED_REPO" status --short --branch
          git -C "$MANAGED_REPO" rev-parse HEAD

      - name: Test trusted repository checkout
        if: steps.request.outputs.action == 'test'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m compileall -q src 2>/dev/null || true
          echo 'trusted_checkout_compile_test=PASS'

      - name: Sync current main into Claude-managed Google-server workspace
        if: steps.request.outputs.action == 'sync'
        shell: bash
        run: |
          set -euo pipefail
          expected="https://github.com/${GITHUB_REPOSITORY}.git"
          if [[ ! -d "$MANAGED_REPO/.git" ]]; then
            rm -rf "$MANAGED_REPO"
            git clone --branch main --single-branch "$expected" "$MANAGED_REPO"
          else
            origin="$(git -C "$MANAGED_REPO" remote get-url origin)"
            case "$origin" in
              "$expected"|"https://github.com/${GITHUB_REPOSITORY}") ;;
              *) echo "Refusing sync: unexpected origin $origin" >&2; exit 4 ;;
            esac
            if [[ -n "$(git -C "$MANAGED_REPO" status --porcelain)" ]]; then
              echo 'Refusing sync: managed server workspace has local changes.' >&2
              git -C "$MANAGED_REPO" status --short
              exit 5
            fi
            git -C "$MANAGED_REPO" fetch --prune origin main
            git -C "$MANAGED_REPO" checkout main
            git -C "$MANAGED_REPO" merge --ff-only origin/main
          fi
          test "$(git -C "$MANAGED_REPO" rev-parse HEAD)" = "$(git rev-parse HEAD)"
          printf 'CLAUDE_GOOGLE_SERVER_SYNC_OK\n'
          printf 'server_sha=%s\n' "$(git -C "$MANAGED_REPO" rev-parse HEAD)"

      - name: Apply externally bounded Claude risk profile
        if: steps.request.outputs.action == 'sync'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "$RUNTIME_ENV")"
          RUNTIME_ENV="$RUNTIME_ENV" \
          MAX_CAPITAL_USD="$CLAUDE_MAX_CAPITAL_USD" \
          MAX_POSITION_USD="$CLAUDE_MAX_POSITION_USD" \
          MAX_TOTAL_EXPOSURE_USD="$CLAUDE_MAX_TOTAL_EXPOSURE_USD" \
          MAX_DAILY_LOSS_USD="$CLAUDE_MAX_DAILY_LOSS_USD" \
          MAX_DRAWDOWN_PCT="$CLAUDE_MAX_DRAWDOWN_PCT" \
          MAX_OPEN_POSITIONS="$CLAUDE_MAX_OPEN_POSITIONS" \
          AUTHORISED_CHAINS="$CLAUDE_AUTHORISED_CHAINS" \
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['RUNTIME_ENV'])
          desired = {
              'MAX_CAPITAL_USD': os.environ['MAX_CAPITAL_USD'],
              'MAX_POSITION_USD': os.environ['MAX_POSITION_USD'],
              'MAX_TOTAL_EXPOSURE_USD': os.environ['MAX_TOTAL_EXPOSURE_USD'],
              'MAX_DAILY_LOSS_USD': os.environ['MAX_DAILY_LOSS_USD'],
              'MAX_DRAWDOWN_PCT': os.environ['MAX_DRAWDOWN_PCT'],
              'MAX_OPEN_POSITIONS': os.environ['MAX_OPEN_POSITIONS'],
              'AUTHORISED_CHAINS': os.environ['AUTHORISED_CHAINS'],
          }
          lines = path.read_text(encoding='utf-8').splitlines() if path.exists() else []
          seen = set()
          out = []
          for line in lines:
              stripped = line.lstrip()
              if not stripped or stripped.startswith('#') or '=' not in line:
                  out.append(line)
                  continue
              key = line.split('=', 1)[0].strip()
              if key in desired:
                  if key not in seen:
                      out.append(f'{key}={desired[key]}')
                      seen.add(key)
                  continue
              out.append(line)
          for key, value in desired.items():
              if key not in seen:
                  out.append(f'{key}={value}')
          tmp = path.with_suffix(path.suffix + '.tmp')
          tmp.write_text('\n'.join(out).rstrip() + '\n', encoding='utf-8')
          tmp.chmod(0o600)
          tmp.replace(path)
          path.chmod(0o600)
          PY
          echo 'claude_risk_profile_applied=true'
          echo "max_capital_usd=$CLAUDE_MAX_CAPITAL_USD"
          echo "max_position_usd=$CLAUDE_MAX_POSITION_USD"
          echo 'max_position_pct=3'
          echo "max_total_exposure_usd=$CLAUDE_MAX_TOTAL_EXPOSURE_USD"
          echo 'max_total_exposure_pct=30'
          echo "max_daily_loss_usd=$CLAUDE_MAX_DAILY_LOSS_USD"
          echo "max_drawdown_pct=$CLAUDE_MAX_DRAWDOWN_PCT"
          echo "max_open_positions=$CLAUDE_MAX_OPEN_POSITIONS"
          echo "authorised_chains=$CLAUDE_AUTHORISED_CHAINS"
          echo 'canary_default_sol=0.0005'
          echo 'canary_hard_max_sol=0.001'

      - name: Security boundary summary
        if: always()
        shell: bash
        run: |
          echo 'Claude Google controlled operations boundary:'
          echo '- runner: botgoogle / boot-google'
          echo '- writable persistent area: /home/ayman01323/ClaudeServer only'
          echo '- no sudo used'
          echo '- no /root access authorised'
          echo '- no wallet/signing material authorised'
          echo '- no service restart authorised'
          echo '- sync accepts only clean fast-forward updates from repository main'
          echo '- risk profile updates only allowlisted non-secret risk/chain variables outside git'
          echo '- no LIVE/ARM/AUTO state is changed by this workflow'