name: Claude Google Reconcile Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claude-google-reconcile-deploy.yml'
      - '.github/claude-google-reconcile-deploy.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-google-reconcile-deploy
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 25
    env:
      MANAGED_ROOT: /home/ayman01323/ClaudeServer
      MANAGED_REPO: /home/ayman01323/ClaudeServer/boot-trading-bot
      RUNTIME_ENV_FILE: /home/ayman01323/ClaudeServer/runtime/claude-trading-bot.env
      STATE_FILE: /home/ayman01323/ClaudeServer/runtime/data/claude_bot_state.json
      SERVICE: claude-trading-bot.service
      TRUSTED_CHECKOUT: ${{ runner.temp }}/claude-google-trusted-${{ github.run_id }}
    steps:
      - name: 'Claude — 31 Aug 2026 09:23 BST — Subject: prepare disposable trusted checkout'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          rm -rf "$TRUSTED_CHECKOUT"
          mkdir -p "$TRUSTED_CHECKOUT"
          git -C "$TRUSTED_CHECKOUT" init -q
          git -C "$TRUSTED_CHECKOUT" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$TRUSTED_CHECKOUT" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$TRUSTED_CHECKOUT" checkout --detach -q FETCH_HEAD
          actual="$(git -C "$TRUSTED_CHECKOUT" rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "trusted_checkout_sha=$actual"
          echo 'actions_workspace_git_state_ignored=true'

      - name: Verify trusted fixes are present
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRUSTED_CHECKOUT"
          grep -q 'SOLANA_RPC_AUTH_COOLDOWN_SECONDS' learnerbot/solana_rpc_failover_patch.py
          grep -q 'endpoint_local_failover' learnerbot/solana_rpc_failover_patch.py
          grep -q 'HTTP 401' tests/test_solana_rpc_failover.py
          grep -q 'automatic Telegram warnings disabled by owner' learnerbot/ai_agent_health_4h_patch.py
          grep -q 'claude_runtime_health_patch.install()' claude-trading-bot/claude_bot_patches.py
          test -f claude-trading-bot/claude_runtime_health_patch.py
          test -f claude-trading-bot/verify_bootstrap_composition.py
          test -f learnerbot/rejected_opportunity_publisher.py
          grep -q 'startup-export-degraded' learnerbot/sibot1_runtime_diag_export_patch.py
          grep -q '_fallback_out' learnerbot/sibot1_runtime_diag_export_patch.py
          echo 'trusted_main_fix_set=PASS'
          echo "trusted_main_sha=$(git rev-parse HEAD)"

      - name: Verify Google runner, service unit, origin and OFF state
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          test -d "$MANAGED_REPO/.git"
          test -r "$RUNTIME_ENV_FILE"
          systemctl show "$SERVICE" -p LoadState -p ActiveState -p SubState -p MainPID
          load_state="$(systemctl show "$SERVICE" -p LoadState --value)"
          test "$load_state" = loaded
          echo "pre_reconcile_service_active=$(systemctl is-active "$SERVICE" 2>/dev/null || true)"
          echo "pre_reconcile_service_substate=$(systemctl show "$SERVICE" -p SubState --value 2>/dev/null || true)"
          origin="$(git -C "$MANAGED_REPO" remote get-url origin)"
          case "$origin" in
            "https://github.com/${GITHUB_REPOSITORY}"|"https://github.com/${GITHUB_REPOSITORY}.git") ;;
            *) echo "Unexpected managed origin" >&2; exit 2 ;;
          esac
          STATE_FILE="$STATE_FILE" python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['STATE_FILE'])
          raw = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          operating = str(raw.get('operating_state') or 'OFF')
          halted = bool(raw.get('halted_drawdown'))
          effective = 'HALTED_DRAWDOWN' if halted else operating
          print(f'pre_reconcile_effective_state={effective}')
          if effective != 'OFF':
              raise SystemExit('Refusing reconcile: Claude effective state is not OFF')
          PY

      - name: Verify dirty workspace is exactly bounded
        shell: bash
        run: |
          set -euo pipefail
          allowlist=(
            'claude-trading-bot/claude_bot_patches.py'
            'claude-trading-bot/solana_execution_risk_patch.py'
            'claude-trading-bot/telegram_control_patch.py'
            'learnerbot/ai_agent_health_4h_patch.py'
            'learnerbot/sibot1_runtime_diag_export_patch.py'
            'learnerbot/solana_pool_risk_gate.py'
            'learnerbot/solana_rpc_failover_patch.py'
            'claude-trading-bot/claude_runtime_health_patch.py'
            'learnerbot/rejected_opportunity_publisher.py'
          )
          mapfile -t dirty < <(git -C "$MANAGED_REPO" status --porcelain | sed -E 's/^.. //' | sort -u)
          for path in "${dirty[@]}"; do
            ok=false
            for allow in "${allowlist[@]}"; do
              [[ "$path" == "$allow" ]] && ok=true && break
            done
            if [[ "$ok" != true ]]; then
              echo "Refusing reconcile: unexpected dirty path: $path" >&2
              exit 3
            fi
          done
          printf 'bounded_dirty_paths=%s\n' "${dirty[*]:-(none)}"

      - name: Preserve exact Google hot-fixes privately
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          old_sha="$(git -C "$MANAGED_REPO" rev-parse HEAD)"
          trusted_sha="$(git -C "$TRUSTED_CHECKOUT" rev-parse HEAD)"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)-${old_sha:0:12}"
          backup="$MANAGED_ROOT/hotfix-backups/$stamp"
          mkdir -p "$backup/files"
          chmod 700 "$MANAGED_ROOT/hotfix-backups" "$backup" "$backup/files"
          git -C "$MANAGED_REPO" status --porcelain > "$backup/status.txt"
          git -C "$MANAGED_REPO" diff --binary --no-ext-diff > "$backup/tracked.patch"
          allowlist=(
            'claude-trading-bot/claude_bot_patches.py'
            'claude-trading-bot/solana_execution_risk_patch.py'
            'claude-trading-bot/telegram_control_patch.py'
            'learnerbot/ai_agent_health_4h_patch.py'
            'learnerbot/sibot1_runtime_diag_export_patch.py'
            'learnerbot/solana_pool_risk_gate.py'
            'learnerbot/solana_rpc_failover_patch.py'
            'claude-trading-bot/claude_runtime_health_patch.py'
            'learnerbot/rejected_opportunity_publisher.py'
          )
          for rel in "${allowlist[@]}"; do
            src="$MANAGED_REPO/$rel"
            if [[ -f "$src" ]]; then
              mkdir -p "$backup/files/$(dirname "$rel")"
              cp -p "$src" "$backup/files/$rel"
            fi
          done
          printf 'server_sha=%s\ntrusted_main_sha=%s\n' "$old_sha" "$trusted_sha" > "$backup/metadata.txt"
          find "$backup" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$backup/SHA256SUMS"
          echo "backup_path=$backup" >> "$GITHUB_OUTPUT"
          echo "private_backup_path=$backup"
          echo 'hotfix_backup=PASS'

      - name: Reconcile managed checkout to trusted current main
        shell: bash
        run: |
          set -euo pipefail
          trusted_sha="$(git -C "$TRUSTED_CHECKOUT" rev-parse HEAD)"
          git -C "$MANAGED_REPO" fetch --prune origin main
          git -C "$MANAGED_REPO" checkout main
          git -C "$MANAGED_REPO" reset --hard "$trusted_sha"
          git -C "$MANAGED_REPO" clean -f -- \
            claude-trading-bot/claude_runtime_health_patch.py \
            learnerbot/rejected_opportunity_publisher.py
          test -z "$(git -C "$MANAGED_REPO" status --porcelain)"
          test "$(git -C "$MANAGED_REPO" rev-parse HEAD)" = "$trusted_sha"
          echo "reconciled_server_sha=$trusted_sha"
          echo 'managed_checkout_clean=true'

      - name: Run architecture-correct non-broadcast validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$MANAGED_REPO"
          testdeps="$RUNNER_TEMP/claude-reconcile-testdeps"
          rm -rf "$testdeps"
          python3 -m pip install --disable-pip-version-check --no-input --target "$testdeps" 'pytest>=8,<9'
          test_pythonpath="$testdeps:$MANAGED_REPO"
          PYTHONPATH="$test_pythonpath" .venv/bin/python -m pytest -q tests/test_solana_rpc_failover.py
          PYTHONPATH="$test_pythonpath" .venv/bin/python -m pytest -q claude-trading-bot/tests/test_claude_risk_and_state.py
          PYTHONPATH="$test_pythonpath" .venv/bin/python -m pytest -q tests/test_sibot1_runtime_diag_export_nonfatal.py
          set -a
          . "$RUNTIME_ENV_FILE"
          set +a
          : "${CSV_DIR:=$MANAGED_ROOT/runtime/CSVbot}"
          : "${DATA_DIR:=$MANAGED_ROOT/runtime/data}"
          export CSV_DIR DATA_DIR
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_CHAT_IDS:-}"
          test -n "${AUTHORISED_CHAINS:-}"
          test -n "${CLAUDE_CAPITAL_BASIS_USD:-}"
          test -n "${CLAUDE_BOT_WALLET_OWNER_ID:-}"
          PYTHONPATH="$MANAGED_REPO" .venv/bin/python claude-trading-bot/verify_bootstrap_composition.py
          .venv/bin/python -m py_compile \
            learnerbot/sibot1_runtime_diag_export_patch.py \
            learnerbot/solana_rpc_failover_patch.py \
            learnerbot/ai_agent_health_4h_patch.py \
            claude-trading-bot/claude_runtime_health_patch.py
          echo 'rpc_unit_regression=PASS'
          echo 'claude_risk_state_regression=PASS'
          echo 'runtime_diag_restart_regression=PASS'
          echo 'claude_full_bootstrap_proof=PASS'
          echo 'runtime_venv_modified=false'
          echo 'validation_transaction_broadcast=false'

      - name: Restart only isolated Claude service
        id: restart
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(date +%s)"
          echo "restart_epoch=$epoch" >> "$GITHUB_OUTPUT"
          sudo -n systemctl restart "$SERVICE"
          sleep 20
          test "$(systemctl is-active "$SERVICE")" = active
          systemctl show "$SERVICE" -p MainPID -p NRestarts -p ExecMainStatus -p ActiveState -p SubState

      - name: Verify runtime, restart-loop stop and OFF safety state
        shell: bash
        env:
          RESTART_EPOCH: ${{ steps.restart.outputs.restart_epoch }}
        run: |
          set -euo pipefail
          log="$(sudo -n journalctl -u "$SERVICE" --since "@${RESTART_EPOCH}" --no-pager)"
          printf '%s\n' "$log" | grep '\[claude-runtime-health\] install_attestation=OK'
          printf '%s\n' "$log" | grep '\[trading-runtime-invariant\] OK'
          printf '%s\n' "$log" | grep '\[final-runtime-integrity\] OK'
          printf '%s\n' "$log" | grep '\[ai-agent-health\] automatic Telegram warnings disabled by owner'
          STATE_FILE="$STATE_FILE" python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['STATE_FILE'])
          raw = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          operating = str(raw.get('operating_state') or 'OFF')
          halted = bool(raw.get('halted_drawdown'))
          effective = 'HALTED_DRAWDOWN' if halted else operating
          print(f'post_restart_effective_state={effective}')
          if effective != 'OFF':
              raise SystemExit('Post-restart Claude state is not OFF')
          PY
          if printf '%s\n' "$log" | grep -Eq 'Traceback|Main process exited|Failed with result'; then
            echo 'Fatal runtime error detected after reconcile' >&2
            printf '%s\n' "$log" | tail -120
            exit 4
          fi
          n1="$(systemctl show "$SERVICE" -p NRestarts --value)"
          sleep 5
          n2="$(systemctl show "$SERVICE" -p NRestarts --value)"
          echo "post_restart_nrestarts_before=$n1"
          echo "post_restart_nrestarts_after_5s=$n2"
          test "$n1" = "$n2"
          echo 'restart_loop_stopped=true'
          echo 'runtime_integrity=PASS'
          echo 'automatic_ai_health_report=DISABLED'
          echo 'ARM_LIVE_NOT_PERFORMED=true'
          echo 'TRANSACTION_BROADCAST=false'

      - name: Measure post-restart RPC auth pressure
        shell: bash
        env:
          RESTART_EPOCH: ${{ steps.restart.outputs.restart_epoch }}
        run: |
          set -euo pipefail
          sleep 45
          log="$(sudo -n journalctl -u "$SERVICE" --since "@${RESTART_EPOCH}" --no-pager || true)"
          rpc401="$(printf '%s\n' "$log" | grep -Ec 'HTTP 401' || true)"
          auth_failover="$(printf '%s\n' "$log" | grep -Ec 'endpoint auth failed.*failing over|auth failed.*failing over' || true)"
          rpc429="$(printf '%s\n' "$log" | grep -Ec 'HTTP 429' || true)"
          jupiter="$(printf '%s\n' "$log" | grep -Eic 'Jupiter.*(quote|error|fail)' || true)"
          echo "post_restart_rpc_401_count=$rpc401"
          echo "post_restart_auth_failover_events=$auth_failover"
          echo "post_restart_rpc_429_count=$rpc429"
          echo "post_restart_jupiter_issue_count=$jupiter"
          if (( rpc401 > 6 )); then
            echo 'RPC 401 pressure remains unexpectedly high after failover fix' >&2
            exit 5
          fi

      - name: Boundary summary
        if: always()
        shell: bash
        run: |
          echo 'Claude Google reconcile boundary:'
          echo '- disposable trusted checkout ignores damaged Actions workspace metadata'
          echo '- Claude may begin active or safely stopped, but persisted state must be OFF'
          echo '- allowlisted server code is backed up before any replacement'
          echo '- managed repo reconciles only to the exact trusted workflow SHA'
          echo '- RPC/risk/runtime-diagnostic tests plus full non-broadcast bootstrap proof are required before restart'
          echo '- runtime venv is not modified'
          echo '- restarted only claude-trading-bot.service when validation passes'
          echo '- Claude remains OFF after restart by design'
          echo '- restart counter must remain stable over 5 seconds'
          echo '- no ARM command issued'
          echo '- no wallet/signing material modified'
          echo '- no transaction signed or broadcast'
