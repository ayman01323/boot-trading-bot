name: Claude Google RPC CSV Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claude-google-rpc-csv-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-google-rpc-csv-sync
  cancel-in-progress: false

jobs:
  prepare-key:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    env:
      KEY_DIR: /home/ayman01323/ClaudeServer/runtime/rpc-transfer-${{ github.run_id }}
    steps:
      - name: Verify Google runner and generate ephemeral transfer key
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$KEY_DIR/private.pem" >/dev/null 2>&1
          chmod 600 "$KEY_DIR/private.pem"
          openssl pkey -in "$KEY_DIR/private.pem" -pubout -out "$KEY_DIR/public.pem" >/dev/null 2>&1
          echo 'RPC_TRANSFER_PUBLIC_KEY_READY' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public key only
        uses: actions/upload-artifact@v4
        with:
          name: rpc-transfer-public-${{ github.run_id }}
          path: /home/ayman01323/ClaudeServer/runtime/rpc-transfer-${{ github.run_id }}/public.pem
          retention-days: 1
          if-no-files-found: error

  export-encrypted:
    needs: prepare-key
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    env:
      WORK: /tmp/claude-rpc-export-${{ github.run_id }}
    steps:
      - name: Download Google public key
        uses: actions/download-artifact@v4
        with:
          name: rpc-transfer-public-${{ github.run_id }}
          path: /tmp/claude-rpc-export-${{ github.run_id }}

      - name: Read only the production RPC CSV and encrypt it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          chmod 700 "$WORK"
          src=''
          for candidate in \
            /root/multichain-learning-bot-v2.2-fast-direct-market/CSVbot/rpc_endpoints.csv \
            /root/boot-trading-bot/CSVbot/rpc_endpoints.csv \
            /opt/boot-trading-bot/CSVbot/rpc_endpoints.csv
          do
            if [ -r "$candidate" ]; then
              src="$candidate"
              cat "$candidate" > "$WORK/rpc_endpoints.csv"
              break
            fi
            if sudo -n test -r "$candidate" 2>/dev/null; then
              src="$candidate"
              sudo -n cat "$candidate" > "$WORK/rpc_endpoints.csv"
              break
            fi
          done
          if [ -z "$src" ] || [ ! -s "$WORK/rpc_endpoints.csv" ]; then
            echo 'Production rpc_endpoints.csv was not readable at any approved fixed path.' >&2
            exit 1
          fi

          python3 - "$WORK/rpc_endpoints.csv" <<'PY'
          import csv, sys
          p=sys.argv[1]
          with open(p, newline='', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          if not rows:
              raise SystemExit('RPC CSV contains no data rows')
          headers=set(rows[0].keys())
          if 'chain_id' not in headers or 'url' not in headers:
              raise SystemExit('RPC CSV missing required chain_id/url columns')
          print(f'rpc_csv_rows={len(rows)}')
          PY

          openssl rand -base64 48 > "$WORK/aes.pass"
          chmod 600 "$WORK/aes.pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$WORK/rpc_endpoints.csv" \
            -out "$WORK/rpc_endpoints.csv.enc" \
            -pass file:"$WORK/aes.pass"
          openssl pkeyutl -encrypt -pubin -inkey "$WORK/public.pem" \
            -in "$WORK/aes.pass" -out "$WORK/aes.pass.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm -f "$WORK/rpc_endpoints.csv" "$WORK/aes.pass" "$WORK/public.pem"
          echo 'RPC_CSV_ENCRYPTED_ON_VPS' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted RPC bundle only
        uses: actions/upload-artifact@v4
        with:
          name: rpc-transfer-encrypted-${{ github.run_id }}
          path: |
            /tmp/claude-rpc-export-${{ github.run_id }}/rpc_endpoints.csv.enc
            /tmp/claude-rpc-export-${{ github.run_id }}/aes.pass.enc
          retention-days: 1
          if-no-files-found: error

      - name: Remove temporary encrypted files from VPS
        if: always()
        shell: bash
        run: rm -rf "$WORK"

  import-google:
    needs: export-encrypted
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    env:
      KEY_DIR: /home/ayman01323/ClaudeServer/runtime/rpc-transfer-${{ github.run_id }}
      DEST_DIR: /home/ayman01323/ClaudeServer/runtime
      DEST: /home/ayman01323/ClaudeServer/runtime/rpc_endpoints.csv
      WORK: /tmp/claude-rpc-import-${{ github.run_id }}
    steps:
      - name: Verify Google runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"
          test -s "$KEY_DIR/private.pem"

      - name: Download encrypted RPC bundle
        uses: actions/download-artifact@v4
        with:
          name: rpc-transfer-encrypted-${{ github.run_id }}
          path: /tmp/claude-rpc-import-${{ github.run_id }}

      - name: Decrypt locally and install protected runtime CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK" "$DEST_DIR"
          chmod 700 "$DEST_DIR"
          openssl pkeyutl -decrypt -inkey "$KEY_DIR/private.pem" \
            -in "$WORK/aes.pass.enc" -out "$WORK/aes.pass" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 "$WORK/aes.pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$WORK/rpc_endpoints.csv.enc" \
            -out "$WORK/rpc_endpoints.csv" \
            -pass file:"$WORK/aes.pass"

          umask 077
          install -m 600 "$WORK/rpc_endpoints.csv" "$DEST"

          python3 - "$DEST" <<'PY'
          import csv, sys
          p=sys.argv[1]
          with open(p, newline='', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          if not rows:
              raise SystemExit('Imported RPC CSV contains no rows')
          chain_ids=sorted({str(r.get('chain_id') or '').strip() for r in rows if str(r.get('chain_id') or '').strip()})
          enabled=sum(1 for r in rows if str(r.get('enabled','true')).strip().lower() in {'1','true','yes','on','y'})
          print(f'claude_rpc_csv_rows={len(rows)}')
          print(f'claude_rpc_csv_enabled_rows={enabled}')
          print('claude_rpc_csv_chain_ids=' + ','.join(chain_ids))
          PY

          {
            echo 'CLAUDE_GOOGLE_RPC_CSV_SYNC_OK'
            echo "runtime_csv=$DEST"
            echo 'mode=protected_local_copy'
            echo 'urls_not_logged=true'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean ephemeral transfer material
        if: always()
        shell: bash
        run: |
          rm -rf "$WORK" "$KEY_DIR"

      - name: Safety summary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo 'Production RPC URLs were never committed or printed.'
            echo 'Only an encrypted artifact crossed between runners.'
            echo 'Final RPC CSV is mode 600 under /home/ayman01323/ClaudeServer/runtime.'
            echo 'No wallet/private-key/trading/LIVE authority was transferred.'
          } >> "$GITHUB_STEP_SUMMARY"
