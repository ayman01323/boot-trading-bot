name: Claude Google RPC Health Check

on:
  push:
    branches:
      - main
      - fix/solana-rpc-429-cooldown
    paths:
      - '.github/workflows/claude-google-rpc-health-check.yml'
      - '.github/claude-google-rpc-health-check.trigger'
      - 'learnerbot/solana_rpc_failover_patch.py'
      - 'tests/test_solana_rpc_failover.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-google-rpc-health-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch_test:
    if: github.ref == 'refs/heads/fix/solana-rpc-429-cooldown'
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    env:
      CI_VENV: /tmp/solana-rpc-cooldown-ci-${{ github.run_id }}
    steps:
      - name: Verify isolated Google runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323

      - name: Checkout tested branch without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CI_VENV"
          python3 -m venv "$CI_VENV"
          "$CI_VENV/bin/python" -m pip install --disable-pip-version-check -q --upgrade pip
          "$CI_VENV/bin/python" -m pip install --disable-pip-version-check -q -r requirements.txt pytest

      - name: Compile changed RPC code and tests
        shell: bash
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" -m py_compile \
            learnerbot/solana_rpc_failover_patch.py \
            tests/test_solana_rpc_failover.py

      - name: Run focused RPC and composition regressions
        shell: bash
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" -m pytest -q \
            tests/test_solana_rpc_failover.py \
            tests/test_solana_worker_reliability.py \
            tests/test_solana_runtime_composition.py

      - name: Prove production was untouched
        if: always()
        shell: bash
        run: |
          echo 'production_service_changed=false'
          echo 'runtime_env_read=false'
          echo 'rpc_urls_logged=false'

      - name: Clean isolated environment
        if: always()
        shell: bash
        run: rm -rf "$CI_VENV"

  check:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Verify Google runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323

      - name: Check Claude service and recent RPC errors
        shell: bash
        run: |
          set -euo pipefail
          service=claude-trading-bot.service
          active="$(systemctl is-active "$service" || true)"
          echo "service_active=$active"
          systemctl show "$service" -p NRestarts -p ExecMainStatus -p ActiveState -p SubState
          log="$(sudo -n journalctl -u "$service" --since '10 minutes ago' --no-pager || true)"
          rpc429="$(printf '%s\n' "$log" | grep -Ec 'Solana RPC .*HTTP 429|HTTP 429' || true)"
          rpcerrs="$(printf '%s\n' "$log" | grep -Ec 'SolanaRpcEndpointError|Solana RPC .*HTTP [45][0-9][0-9]' || true)"
          leadercalls="$(printf '%s\n' "$log" | grep -Ec '\[sibot-solana-leader-signature\]' || true)"
          align="$(printf '%s\n' "$log" | grep '\[solana-leader-edge-alignment\]' | tail -1 || true)"
          echo "recent_10m_rpc_429_count=$rpc429"
          echo "recent_10m_rpc_error_count=$rpcerrs"
          echo "recent_10m_leader_signature_events=$leadercalls"
          if [[ -n "$align" ]]; then
            printf 'latest_alignment=%s\n' "$align" | sed -E 's/[A-Za-z0-9]{32,}/[redacted]/g'
          else
            echo 'latest_alignment=NONE'
          fi
          echo 'rpc_urls_logged=false'
          echo 'live_state_changed=false'
          test "$active" = active
