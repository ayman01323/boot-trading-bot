name: 'Claude — 31 Aug 2026 — Runtime Diagnostic Fix Test'

on:
  push:
    branches:
      - 'claude/20260831-runtime-diag-permission-fix'
    paths:
      - 'learnerbot/sibot1_runtime_diag_export_patch.py'
      - 'tests/test_sibot1_runtime_diag_export_nonfatal.py'
      - '.github/workflows/claude-runtime-diag-fix-test-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 'Claude — 31 Aug 2026 09:13 BST — Subject: run non-fatal diagnostics regression tests'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r requirements.txt 'pytest>=8,<9'
          python -m py_compile learnerbot/sibot1_runtime_diag_export_patch.py
          python -m pytest -q tests/test_sibot1_runtime_diag_export_nonfatal.py
          echo 'trading_state_changed=false'
          echo 'transaction_broadcast=false'
