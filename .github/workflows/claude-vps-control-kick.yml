name: Kick Claude VPS Control Processor

# Manual emergency/fallback wake only. Normal Telegram requests now dispatch the
# bounded processor only when the sanitised control actually changes, and successful
# deployments are already handled directly by claude-vps-controlled-ops.yml.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: kick-claude-vps-control-processor
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch bounded VPS processor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # This workflow never chooses a VPS operation. action=none tells the
          # bounded processor to read the sanitised control/nonce from ai-reviews.
          gh workflow run claude-vps-controlled-ops.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f action=none
