name: Consolidate Google Test Bots Under ClaudeServer

on:
  push:
    branches:
      - gpt/consolidate-google-test-bots
    paths:
      - '.github/workflows/consolidate-google-test-bots.yml'

permissions:
  contents: write

concurrency:
  group: consolidate-google-test-bots
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 60
    steps:
      - name: Verify restricted maintenance bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          test -x /usr/local/sbin/consolidate-google-test-bots
          test -x /usr/local/sbin/backup-google-test-bots
          sudo -n -l /usr/local/sbin/consolidate-google-test-bots >/dev/null
          sudo -n -l /usr/local/sbin/backup-google-test-bots >/dev/null
          echo 'restricted_bridge=PASS'

      - name: Consolidate exact test-bot folders
        id: consolidate
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/consolidate-google-test-bots 2>&1 | tee /tmp/google-folder-consolidation.txt

      - name: Create one ClaudeServer backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/backup-google-test-bots 2>&1 | tee /tmp/google-folder-backup.txt

      - name: Verify final layout and services
        shell: bash
        run: |
          set -euo pipefail
          PROD=/root/multichain-learning-bot-v2.2-fast-direct-market
          SIRISKY=/root/SiRisky
          WORK=/home/ayman01323/ClaudeServer/SiRisky
          BASE=/home/ayman01323/ClaudeServer/TestBots
          test -L "$PROD"
          test -L "$SIRISKY"
          test "$(readlink -f "$PROD")" = "$BASE/boot-trading-bot"
          test "$(readlink -f "$SIRISKY")" = "$BASE/SiRisky-runtime"
          if test -e "$BASE/SiRisky-workspace"; then
            test -L "$WORK"
            test "$(readlink -f "$WORK")" = "$BASE/SiRisky-workspace"
          fi
          sudo -n test -x "$PROD/.venv/bin/python"
          sudo -n test -x "$SIRISKY/.venv/bin/python"
          sudo -n git -C "$PROD" rev-parse --is-inside-work-tree >/dev/null
          echo "learnerbot=$(systemctl is-active learnerbot.service 2>/dev/null || true)"
          echo "sirisky=$(systemctl is-active sirisky.service 2>/dev/null || true)"
          echo "production_link=$(readlink "$PROD")"
          echo "sirisky_link=$(readlink "$SIRISKY")"
          echo "workspace_link=$(readlink "$WORK" 2>/dev/null || echo not-present)"
          sudo -n du -sh "$BASE/boot-trading-bot" "$BASE/SiRisky-runtime" "$BASE/SiRisky-workspace" 2>/dev/null || true

      - name: Publish consolidation attestation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "generated_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "hostname=$(hostname)"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo
            echo '=== CONSOLIDATION ==='
            cat /tmp/google-folder-consolidation.txt 2>/dev/null || true
            echo
            echo '=== BACKUP ==='
            cat /tmp/google-folder-backup.txt 2>/dev/null || true
            echo
            echo '=== FINAL ==='
            ls -ld /home/ayman01323/ClaudeServer/TestBots /root/multichain-learning-bot-v2.2-fast-direct-market /root/SiRisky /home/ayman01323/ClaudeServer/SiRisky 2>/dev/null || true
            echo "learnerbot=$(systemctl is-active learnerbot.service 2>/dev/null || true)"
            echo "sirisky=$(systemctl is-active sirisky.service 2>/dev/null || true)"
          } > /tmp/google-folder-consolidation-attestation.txt
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/google-folder-consolidation.txt"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/google-folder-consolidation-attestation.txt)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/google-folder-consolidation-put.json
          import json,sys
          out={'message':'Record Google test-bot folder consolidation','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: out['sha']=sys.argv[2]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/google-folder-consolidation-put.json >/dev/null
          cat /tmp/google-folder-consolidation-attestation.txt
