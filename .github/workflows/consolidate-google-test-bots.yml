name: Consolidate Google Test Bots Under ClaudeServer

on:
  push:
    branches: [gpt/consolidate-google-test-bots]
    paths: ['.github/workflows/consolidate-google-test-bots.yml']

permissions:
  contents: write

concurrency:
  group: consolidate-google-test-bots
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 30
    steps:
      - name: Verify restricted maintenance bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          test -x /usr/local/sbin/consolidate-google-test-bots
          test -x /usr/local/sbin/backup-google-test-bots
          sudo -n -l /usr/local/sbin/consolidate-google-test-bots >/dev/null
          sudo -n -l /usr/local/sbin/backup-google-test-bots >/dev/null
          echo restricted_bridge=PASS

      - name: Confirm consolidated physical targets
        shell: bash
        run: |
          set -euo pipefail
          BASE=/home/ayman01323/ClaudeServer/TestBots
          PROD=$BASE/boot-trading-bot
          SIRISKY=$BASE/SiRisky-runtime
          WORK=$BASE/SiRisky-workspace
          test -d "$PROD"
          test -d "$SIRISKY"
          test -d "$WORK"
          test -x "$PROD/.venv/bin/python"
          test -x "$SIRISKY/.venv/bin/python"
          git -C "$PROD" rev-parse --is-inside-work-tree >/dev/null
          {
            echo CONSOLIDATION_OK=true
            echo "base=$BASE"
            echo "production=$PROD"
            echo "sirisky_runtime=$SIRISKY"
            echo "sirisky_workspace=$WORK"
            echo 'compatibility_links=previously_verified_by_restricted_migration_wrapper'
          } | tee /tmp/google-folder-consolidation.txt

      - name: Recover or create combined backup
        shell: bash
        run: |
          set -euo pipefail
          DEST=/home/ayman01323/GoogleServerBuckup
          : > /tmp/google-folder-backup.txt
          latest="$(find "$DEST" -maxdepth 1 -type f -name 'claude-server-all-*.tar.gz' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)"
          if [[ -z "$latest" ]]; then
            set +e
            sudo -n /usr/local/sbin/backup-google-test-bots 2>&1 | tee -a /tmp/google-folder-backup.txt
            rc=${PIPESTATUS[0]}
            set -e
            latest="$(find "$DEST" -maxdepth 1 -type f -name 'claude-server-all-*.tar.gz' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)"
            if [[ $rc -ne 0 ]] && ! { [[ $rc -eq 1 ]] && grep -Eq 'file changed as we read it|File removed before we read it' /tmp/google-folder-backup.txt; }; then
              exit "$rc"
            fi
          else
            echo RECOVERED_EXISTING_ARCHIVE=true | tee -a /tmp/google-folder-backup.txt
          fi
          test -n "$latest"
          test -s "$latest"
          python3 - "$latest" <<'PY'
          import gzip, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          with p.open('rb') as f:
              assert f.read(2) == b'\x1f\x8b'
          with gzip.open(p,'rb') as g:
              header=g.read(512)
          name=header[:100].split(b'\0',1)[0].decode('utf-8','replace')
          assert name.startswith('ClaudeServer'), name
          print('tar_first_entry='+name)
          PY
          trailer="$(tail -c 8 "$latest" | od -An -tx1 | tr -d ' \n')"
          test "${#trailer}" -eq 16
          bytes="$(stat -c %s "$latest")"
          echo archive_structural_check=PASS | tee -a /tmp/google-folder-backup.txt
          echo "archive=$latest" | tee -a /tmp/google-folder-backup.txt
          echo "archive_bytes=$bytes" | tee -a /tmp/google-folder-backup.txt
          echo "gzip_trailer=$trailer" | tee -a /tmp/google-folder-backup.txt

      - name: Verify services reach active state
        shell: bash
        run: |
          set -euo pipefail
          wait_active() {
            local svc="$1"
            for _ in $(seq 1 30); do
              state="$(systemctl is-active "$svc" 2>/dev/null || true)"
              if [[ "$state" == active ]]; then
                echo "$svc=active"
                return 0
              fi
              if [[ "$state" == failed || "$state" == inactive ]]; then
                echo "$svc=$state" >&2
                systemctl status "$svc" --no-pager -l 2>&1 | tail -40 >&2 || true
                return 1
              fi
              sleep 2
            done
            echo "$svc=$(systemctl is-active "$svc" 2>/dev/null || true)" >&2
            systemctl status "$svc" --no-pager -l 2>&1 | tail -40 >&2 || true
            return 1
          }
          {
            wait_active learnerbot.service
            wait_active sirisky.service
            echo physical_layout=PASS
          } | tee /tmp/google-folder-final.txt

      - name: Publish consolidation attestation
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "generated_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "hostname=$(hostname)"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo '=== CONSOLIDATION ==='
            cat /tmp/google-folder-consolidation.txt 2>/dev/null || true
            echo '=== BACKUP ==='
            cat /tmp/google-folder-backup.txt 2>/dev/null || true
            echo '=== FINAL ==='
            cat /tmp/google-folder-final.txt 2>/dev/null || true
          } > /tmp/google-folder-consolidation-attestation.txt
          python3 - <<'PY'
          import base64,json,os,urllib.error,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']
          api=f'https://api.github.com/repos/{repo}/contents/diagnostics/google-folder-consolidation.txt'
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'botgoogle-consolidation'}
          sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=server-diagnostics',headers=h),timeout=30) as r: sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404: raise
          data=open('/tmp/google-folder-consolidation-attestation.txt','rb').read()
          body={'message':'Record Google test-bot folder consolidation','content':base64.b64encode(data).decode(),'branch':'server-diagnostics'}
          if sha: body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers={**h,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r: print('attestation_commit='+json.load(r)['commit']['sha'])
          PY
          cat /tmp/google-folder-consolidation-attestation.txt
