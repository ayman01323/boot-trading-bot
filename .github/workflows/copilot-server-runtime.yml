name: Install and Verify Copilot Server Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/copilot-server-runtime.yml'
      - '.github/agents/**'
      - '.github/copilot-server-runtime.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copilot-server-runtime
  cancel-in-progress: true

jobs:
  install-and-verify:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
    steps:
      - name: Install official Copilot CLI into isolated VPS runtime
        id: install
        shell: bash
        run: |
          set -euo pipefail
          target=/var/tmp/boot-copilot-cli
          stage=/var/tmp/boot-copilot-cli.next
          previous=/var/tmp/boot-copilot-cli.previous
          rm -rf "$stage" "$previous"
          mkdir -p "$stage"

          curl -fsSL https://gh.io/copilot-install -o /tmp/boot-copilot-install.sh
          PREFIX="$stage" bash /tmp/boot-copilot-install.sh
          test -x "$stage/bin/copilot"

          version="$($stage/bin/copilot --version 2>&1 | head -n 1 | tr -d '\r')"
          if [[ -d "$target" ]]; then
            mv "$target" "$previous"
          fi
          mv "$stage" "$target"
          rm -rf "$previous"
          chmod -R a+rX "$target"

          echo "installed=true" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "Copilot CLI installed at $target/bin/copilot"
          echo "Version: $version"

      - name: Verify a working Copilot credential without exposing values
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          bin=/var/tmp/boot-copilot-cli/bin/copilot
          ok=false
          token_source=none
          reason=''

          try_token() {
            local label="$1" token="$2"
            [[ -n "$token" ]] || return 1
            local work
            work="$(mktemp -d /tmp/boot-copilot-smoke.XXXXXX)"
            set +e
            (
              cd "$work"
              env -u GH_TOKEN -u GITHUB_TOKEN \
                COPILOT_GITHUB_TOKEN="$token" \
                timeout 120 "$bin" \
                  --no-auto-update \
                  --no-ask-user \
                  --no-custom-instructions \
                  --no-remote \
                  --no-remote-export \
                  -s -p 'Reply with exactly COPILOT_OK. Do not inspect files and do not use tools.' \
                  >/tmp/boot-copilot-smoke.out 2>/tmp/boot-copilot-smoke.err
            )
            local rc=$?
            set -e
            rm -rf "$work"
            if [[ $rc -eq 0 ]] && grep -Fxq 'COPILOT_OK' /tmp/boot-copilot-smoke.out; then
              ok=true
              token_source="$label"
              return 0
            fi
            return 1
          }

          if [[ ! -x "$bin" ]]; then
            reason='copilot binary missing after install'
          elif try_token copilot_github_token "${COPILOT_GITHUB_TOKEN:-}"; then
            :
          elif try_token copilot_assign_token_fallback "${COPILOT_ASSIGN_TOKEN:-}"; then
            :
          else
            reason='configured Copilot credentials did not pass the authenticated CLI smoke test'
          fi

          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "token_source=$token_source" >> "$GITHUB_OUTPUT"
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          if [[ "$ok" == true ]]; then
            echo "Copilot CLI authenticated request: OK ($token_source)"
          else
            echo "Copilot CLI authenticated request: NOT READY"
            echo "$reason"
          fi

      - name: Verify persistent Copilot worker through production WebSocket bus
        id: ws
        shell: bash
        run: |
          set +e
          repo=/root/multichain-learning-bot-v2.2-fast-direct-market
          py="$repo/.venv/bin/python"
          sender="$repo/scripts/ai_agent_ws_send.py"
          reason=''
          ok=false

          if [[ ! -x "$py" || ! -f "$sender" ]]; then
            reason='production Strategy Factory sender is unavailable'
          else
            output="$(cd "$repo" && "$py" scripts/ai_agent_ws_send.py \
              --from gpt \
              --to copilot \
              --message-id "copilot-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --timeout 120 \
              --message 'Production Copilot communication health check. Reply with exactly COPILOT_WS_OK. Do not inspect files, use tools, modify anything, deploy, trade, or access secrets.' 2>&1)"
            rc=$?
            printf '%s\n' "$output"
            if [[ $rc -eq 0 ]]; then
              final="$(printf '%s\n' "$output" | tail -n 1)"
              FINAL="$final" python3 - <<'PY'
          import json, os
          value=json.loads(os.environ['FINAL'])
          assert value.get('status') == 'REPLIED', value
          assert value.get('delivered') is True, value
          assert value.get('acknowledged') is True, value
          assert not str(value.get('error') or ''), value
          assert int(value.get('provider_rc') or 0) == 0, value
          body=str(value.get('body') or '').strip().strip('*_`').strip()
          assert body == 'COPILOT_WS_OK', value
          PY
              if [[ $? -eq 0 ]]; then
                ok=true
              else
                reason='WebSocket result did not satisfy REPLIED/delivered/acknowledged/provider_rc/body checks'
              fi
            else
              reason="Strategy Factory WebSocket sender failed (rc=$rc)"
            fi
          fi

          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish redacted Copilot server health
        shell: bash
        env:
          INSTALLED: ${{ steps.install.outputs.installed }}
          VERSION: ${{ steps.install.outputs.version }}
          AUTH_OK: ${{ steps.smoke.outputs.ok }}
          TOKEN_SOURCE: ${{ steps.smoke.outputs.token_source }}
          AUTH_REASON: ${{ steps.smoke.outputs.reason }}
          WS_OK: ${{ steps.ws.outputs.ok }}
          WS_REASON: ${{ steps.ws.outputs.reason }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/copilot-server-runtime-health.json
          import json, os, pathlib, time
          path = pathlib.Path('/var/tmp/boot-copilot-cli/bin/copilot')
          auth_ok = str(os.environ.get('AUTH_OK') or '').lower() == 'true'
          ws_ok = str(os.environ.get('WS_OK') or '').lower() == 'true'
          print(json.dumps({
              'checked_epoch': int(time.time()),
              'binary_path': str(path),
              'installed': path.is_file(),
              'executable': os.access(path, os.X_OK),
              'version': str(os.environ.get('VERSION') or '')[:120],
              'credential_present': str(os.environ.get('TOKEN_SOURCE') or 'none') != 'none',
              'credential_source': str(os.environ.get('TOKEN_SOURCE') or 'none'),
              'authenticated_smoke_test': auth_ok,
              'websocket_smoke_test': ws_ok,
              'websocket_delivery_required': True,
              'websocket_acknowledgement_required': True,
              'websocket_reply_required': True,
              'status': 'WORKING' if auth_ok and ws_ok else 'NOT_READY',
              'reason': (str(os.environ.get('AUTH_REASON') or '') or str(os.environ.get('WS_REASON') or ''))[:240],
              'secret_value_exposed': False,
              'worker_expected_path_match': str(path) == '/var/tmp/boot-copilot-cli/bin/copilot',
          }, indent=2, sort_keys=True))
          PY

          path='health/copilot_server_runtime.json'
          api="repos/${GITHUB_REPOSITORY}/contents/${path}"
          current="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=ai-reviews" 2>/dev/null || true)"
          sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/copilot-server-runtime-health.json)"
          python3 - "$encoded" "$sha" <<'PY' > /tmp/copilot-server-runtime-put.json
          import json, sys
          payload = {
              'message': 'Update redacted Copilot server runtime health',
              'content': sys.argv[1],
              'branch': 'ai-reviews',
          }
          if sys.argv[2]:
              payload['sha'] = sys.argv[2]
          print(json.dumps(payload))
          PY
          gh api --method PUT -H 'Accept: application/vnd.github+json' "$api" --input /tmp/copilot-server-runtime-put.json >/dev/null
          cat /tmp/copilot-server-runtime-health.json

      - name: Fail visibly unless Copilot works through the production bus
        if: steps.smoke.outputs.ok != 'true' || steps.ws.outputs.ok != 'true'
        shell: bash
        run: |
          echo 'Copilot is not fully ready: both direct authentication and the production WebSocket REPLIED proof are required.' >&2
          exit 1
