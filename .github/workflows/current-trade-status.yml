name: Current Trade Status

on:
  pull_request:

permissions:
  contents: read

jobs:
  status:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Current server status 1
        run: sudo /usr/local/sbin/status-boot-trading-bot
      - name: Wait briefly
        run: sleep 15
      - name: Current server status 2
        run: sudo /usr/local/sbin/status-boot-trading-bot
