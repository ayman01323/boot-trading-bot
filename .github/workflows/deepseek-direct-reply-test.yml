name: One-shot GPT to DeepSeek Live Reply Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deepseek-direct-reply-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build isolated transport environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/deepseek-direct-reply-test"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Send GPT to DeepSeek and require correlated reply
        shell: bash
        run: |
          set -euo pipefail
          mid="gpt-deepseek-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
            --from gpt \
            --to deepseek \
            --subject 'GPT DeepSeek live reply test' \
            --message-id "$mid" \
            --timeout 120 \
            --message 'Reply exactly: DEEPSEEK_REPLY_OK')"
          printf '%s\n' "$output"
          final="$(printf '%s\n' "$output" | tail -n 1)"
          FINAL="$final" MID="$mid" python3 - <<'PY'
          import json, os
          value=json.loads(os.environ['FINAL'])
          assert value.get('message_id') == os.environ['MID'], value
          assert value.get('delivered') is True, value
          assert value.get('acknowledged') is True, value
          assert value.get('status') == 'REPLIED', value
          assert int(value.get('provider_rc') or 0) == 0, value
          assert not str(value.get('error') or ''), value
          body=str(value.get('body') or '').strip().strip('*_`').strip()
          assert body == 'DEEPSEEK_REPLY_OK', value
          print('GPT_TO_DEEPSEEK=PASS')
          print('message_id='+os.environ['MID'])
          print('delivered=true')
          print('acknowledged=true')
          print('status=REPLIED')
          print('body='+body)
          PY

      - name: Clean up
        if: always()
        run: rm -rf "${VENV:-$RUNNER_TEMP/deepseek-direct-reply-test}"
