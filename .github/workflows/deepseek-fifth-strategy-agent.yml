name: DeepSeek Fifth Strategy Agent

on:
  workflow_run:
    workflows: ["Hourly Three-Agent Strategy Cycle"]
    types: [completed]
  schedule:
    - cron: '37 */4 * * *'
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'Optional immutable strategy cycle; defaults to latest published cycle'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: deepseek-fifth-strategy-agent
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out orchestration source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install read-only agent harness
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Resolve immutable strategy cycle and exact evidence
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CYCLE: ${{ inputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .strategy_deepseek
          cycle="${INPUT_CYCLE:-}"
          if [[ -z "$cycle" ]]; then
            cycle="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/strategy/latest_cycle_id.txt?ref=ai-reviews" \
              --jq '.content' | tr -d '\n' | base64 -d | tr -d '\r\n')"
          fi
          [[ "$cycle" =~ ^[0-9a-f]{12}-[0-9]{10}-[0-9a-f]{8}$ ]] || { echo 'Invalid strategy cycle id.' >&2; exit 2; }
          root="strategy/runs/${cycle}"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${root}/context.json?ref=ai-reviews" \
            --jq '.content' | tr -d '\n' | base64 -d > .strategy_deepseek/context.json

          python - <<'PY' > /tmp/deepseek-meta.env
          import json
          p=json.load(open('.strategy_deepseek/context.json'))
          print('SOURCE_SHA='+str(p.get('source_commit') or ''))
          print('EVIDENCE_SHA='+str(p.get('evidence_sha256') or ''))
          print('EVIDENCE_SOURCE='+str(p.get('evidence_source') or ''))
          PY
          source /tmp/deepseek-meta.env
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid source SHA.' >&2; exit 2; }
          [[ "$EVIDENCE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid evidence SHA.' >&2; exit 2; }

          exact=false
          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/latest_loss_forensics.json?ref=audit-status" --jq '.content' 2>/dev/null \
            | tr -d '\n' | base64 -d > .strategy_deepseek/evidence.json 2>/dev/null
          rc=$?
          set -e
          if [[ $rc -eq 0 && -s .strategy_deepseek/evidence.json ]]; then
            got="$(sha256sum .strategy_deepseek/evidence.json | awk '{print $1}')"
            [[ "$got" == "$EVIDENCE_SHA" ]] && exact=true
          fi
          if [[ "$exact" != true && "$EVIDENCE_SOURCE" == architecture-only ]]; then
            python - "$SOURCE_SHA" <<'PY' > .strategy_deepseek/evidence.json
          import json,sys
          print(json.dumps({
            'schema_version':1,'generated_epoch':0,'generated_utc':'',
            'evidence_status':'MISSING_RUNTIME_FORENSICS','source_commit':sys.argv[1],
            'note':'No current sanitised runtime forensics branch was available. Review code/architecture only; do not claim measured profitability or LIVE readiness.'
          },indent=2,sort_keys=True))
          PY
            got="$(sha256sum .strategy_deepseek/evidence.json | awk '{print $1}')"
            [[ "$got" == "$EVIDENCE_SHA" ]] && exact=true
          fi
          echo "cycle_id=$cycle" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "evidence_sha=$EVIDENCE_SHA" >> "$GITHUB_OUTPUT"
          echo "evidence_source=$EVIDENCE_SOURCE" >> "$GITHUB_OUTPUT"
          echo "evidence_exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Check out exact source reviewed by other agents
        env:
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          git clean -fdx -e .strategy_deepseek/

      - name: Evaluate DeepSeek paid-AI cost gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/strategy/deepseek_cost_gate_state.json?ref=ai-reviews" --jq '.content' 2>/dev/null \
            | tr -d '\n' | base64 -d > /tmp/deepseek-cost-state.json 2>/dev/null
          rc=$?
          set -e
          [[ $rc -eq 0 && -s /tmp/deepseek-cost-state.json ]] || echo '{}' > /tmp/deepseek-cost-state.json
          PYTHONPATH="$GITHUB_WORKSPACE" python - "$SOURCE_SHA" "$MANUAL" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          from learnerbot.strategy_ai_cost_gate import evaluate_cost_gate
          source,manual=sys.argv[1],sys.argv[2].lower()=='true'
          evidence=json.load(open('.strategy_deepseek/evidence.json'))
          try: previous=json.load(open('/tmp/deepseek-cost-state.json'))
          except Exception: previous={}
          r=evaluate_cost_gate(source_commit=source,evidence=evidence,previous_state=previous,manual=manual)
          print('run_ai='+str(r['run_ai']).lower())
          print('reason='+str(r['reason']))
          print('material_sha256='+str(r['material_sha256']))
          PY

      - name: Skip paid DeepSeek review when unchanged
        if: steps.gate.outputs.run_ai != 'true'
        run: echo "DeepSeek strategy review skipped by material-change cost gate — ${{ steps.gate.outputs.reason }}"

      - name: Prepare DeepSeek strategy prompt
        if: steps.gate.outputs.run_ai == 'true'
        env:
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          EVIDENCE_SOURCE: ${{ steps.meta.outputs.evidence_source }}
        shell: bash
        run: |
          cat > .strategy_deepseek/prompt.txt <<EOF
          You are DEEPSEEK, the fifth INDEPENDENT strategy reviewer for a multi-chain automated trading bot.
          Inspect the checked-out repository and .strategy_deepseek/evidence.json.
          Cycle: ${CYCLE_ID}
          Source commit: ${SOURCE_SHA}
          Evidence SHA-256: ${EVIDENCE_SHA}
          Evidence source: ${EVIDENCE_SOURCE}

          Optimise only for durable money-weighted NET P&L after all recorded costs. Distinguish strategy/market loss from execution/infrastructure failure. Compare Solana and EVM with chain-specific costs and executability.
          REPORT ONLY. Do not edit code, trade, deploy, change LIVE/risk/capital settings, touch secrets/wallets/signing, add assets, weaken simulation/liquidity/sellability controls, or use external web research.

          Return exactly one JSON report between these markers:
          STRATEGY_REVIEW_JSON_BEGIN
          {
            "schema_version":1,"provider":"deepseek","cycle_id":"${CYCLE_ID}",
            "source_commit":"${SOURCE_SHA}","evidence_sha256":"${EVIDENCE_SHA}",
            "scope":"MULTI_AGENT_STRATEGY_REVIEW","status":"HEALTHY|CHANGES_PROPOSED|INCOMPLETE",
            "summary":"...","proposals":[{
              "id":"stable-id","action":"KEEP|IMPROVE|REWORK|SHADOW_MORE|REPLACE|DORMANT|NEW_SHADOW|ASSET_REQUEST|RESEARCH_MORE",
              "strategy":"...","chain_scope":["SOLANA","EVM"],
              "evidence":[{"path":"repository or JSON path","detail":"specific support"}],
              "rationale":"...","expected_effect":"...","downside_risk":"...",
              "shadow_test":"falsifiable test including costs and stop/failure condition",
              "minimum_observation":"...","confidence":0.0,
              "suggested_files":["Strategy Lab/SHADOW files only"]
            }],"rejected_ideas":[],"evidence_gaps":[],"review_only":true,"no_live_changes":true
          }
          STRATEGY_REVIEW_JSON_END
          Prefer no change over unsupported confidence.
          EOF

      - name: DeepSeek independent strategy report
        id: deepseek
        if: steps.gate.outputs.run_ai == 'true' && steps.meta.outputs.evidence_exact == 'true'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # DeepSeek maps claude-sonnet-* to deepseek-v4-flash. Use a Claude Code
          # recognised alias to keep the low-cost V4 Flash backend without the
          # client-side unknown-model context-window failure.
          DEEPSEEK_CLAUDE_MODEL: 'claude-sonnet-4-5'
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_EFFORT_LEVEL: 'max'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          export ANTHROPIC_BASE_URL='https://api.deepseek.com/anthropic'
          export ANTHROPIC_AUTH_TOKEN="$DEEPSEEK_API_KEY"
          export ANTHROPIC_MODEL="$DEEPSEEK_CLAUDE_MODEL"
          export ANTHROPIC_DEFAULT_OPUS_MODEL="$DEEPSEEK_CLAUDE_MODEL"
          export ANTHROPIC_DEFAULT_SONNET_MODEL="$DEEPSEEK_CLAUDE_MODEL"
          export ANTHROPIC_DEFAULT_HAIKU_MODEL='claude-haiku-4-5'
          export CLAUDE_CODE_SUBAGENT_MODEL='claude-haiku-4-5'
          unset ANTHROPIC_API_KEY || true
          claude -p --permission-mode plan --max-turns 6 --output-format text \
            "$(cat .strategy_deepseek/prompt.txt)" > .strategy_deepseek/deepseek_stdout.txt 2> .strategy_deepseek/deepseek_error.txt
          python - "$CYCLE_ID" "$SOURCE_SHA" "$EVIDENCE_SHA" <<'PY'
          import json,re,sys,pathlib
          cycle,source,evidence=sys.argv[1:4]
          raw=pathlib.Path('.strategy_deepseek/deepseek_stdout.txt').read_text(errors='replace')
          m=re.search(r'STRATEGY_REVIEW_JSON_BEGIN\s*(\{.*?\})\s*STRATEGY_REVIEW_JSON_END',raw,re.S)
          if not m: raise SystemExit('DeepSeek strategy JSON markers missing')
          p=json.loads(m.group(1))
          if p.get('provider')!='deepseek' or p.get('cycle_id')!=cycle or p.get('source_commit')!=source or p.get('evidence_sha256')!=evidence: raise SystemExit('DeepSeek report identity mismatch')
          if p.get('scope')!='MULTI_AGENT_STRATEGY_REVIEW' or p.get('status') not in {'HEALTHY','CHANGES_PROPOSED','INCOMPLETE'}: raise SystemExit('DeepSeek report contract mismatch')
          if p.get('review_only') is not True or p.get('no_live_changes') is not True or not isinstance(p.get('proposals'),list): raise SystemExit('DeepSeek report safety contract mismatch')
          pathlib.Path('.strategy_deepseek/deepseek.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          lines=['# DeepSeek strategy review','',str(p.get('summary') or '')]
          for x in p.get('proposals') or []: lines += ['',f"## {x.get('action')} — {x.get('strategy')}",str(x.get('rationale') or '')]
          pathlib.Path('.strategy_deepseek/deepseek.md').write_text('\n'.join(lines)+'\n')
          PY
          python - <<'PY'
          import subprocess,sys
          bad=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              if line[:2]=='??' and line[3:].replace('\\','/').startswith('.strategy_deepseek/'): continue
              bad.append(line)
          if bad:
              print('DeepSeek reviewer changed tracked/out-of-scope files:',*bad,sep='\n',file=sys.stderr)
              raise SystemExit(3)
          PY

      - name: Recover explicit DeepSeek incomplete report
        if: steps.gate.outputs.run_ai == 'true' && (steps.meta.outputs.evidence_exact != 'true' || steps.deepseek.outcome != 'success')
        env:
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          EVIDENCE_EXACT: ${{ steps.meta.outputs.evidence_exact }}
          DEEPSEEK_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,re
          if os.environ.get('EVIDENCE_EXACT')!='true': reason='Exact immutable evidence bytes could not be recovered; DeepSeek was not allowed to review different evidence.'
          elif os.environ.get('DEEPSEEK_PRESENT')!='true': reason='DEEPSEEK_API_KEY is missing.'
          else:
              parts=[]
              for n in ('deepseek_error.txt','deepseek_stdout.txt'):
                  p=pathlib.Path('.strategy_deepseek')/n
                  if p.exists(): parts.append(p.read_text(errors='replace')[-1200:])
              reason=re.sub(r'(?i)(api[_ -]?key|authorization|bearer|token)[^\n]*','[REDACTED]', '\n'.join(parts)).strip() or 'DeepSeek execution/report extraction failed.'
          p={'schema_version':1,'provider':'deepseek','cycle_id':os.environ['CYCLE_ID'],'source_commit':os.environ['SOURCE_SHA'],'evidence_sha256':os.environ['EVIDENCE_SHA'],'scope':'MULTI_AGENT_STRATEGY_REVIEW','status':'INCOMPLETE','summary':'DeepSeek report did not complete.','proposals':[],'rejected_ideas':[],'evidence_gaps':[reason[:1800]],'review_only':True,'no_live_changes':True}
          pathlib.Path('.strategy_deepseek/deepseek.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          pathlib.Path('.strategy_deepseek/deepseek.md').write_text('# DeepSeek strategy review\n\nINCOMPLETE\n\n'+reason[:1800]+'\n')
          PY

      - name: Publish DeepSeek report only
        if: steps.gate.outputs.run_ai == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          MATERIAL_SHA: ${{ steps.gate.outputs.material_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/deepseek-strategy-reviews
          git worktree add --detach /tmp/deepseek-strategy-reviews origin/ai-reviews
          dest="/tmp/deepseek-strategy-reviews/strategy/runs/${CYCLE_ID}"
          mkdir -p "$dest" /tmp/deepseek-strategy-reviews/strategy
          cp .strategy_deepseek/deepseek.json "$dest/deepseek.json"
          cp .strategy_deepseek/deepseek.md "$dest/deepseek.md"
          python - <<PY > /tmp/deepseek-strategy-reviews/strategy/deepseek_cost_gate_state.json
          import json,time
          print(json.dumps({'last_ai_attempt_epoch':int(time.time()),'last_ai_attempt_source_commit':'${SOURCE_SHA}','last_ai_attempt_material_sha256':'${MATERIAL_SHA}'},indent=2,sort_keys=True))
          PY
          cd /tmp/deepseek-strategy-reviews
          git config user.name 'deepseek-fifth-strategy-agent'
          git config user.email 'deepseek-fifth-strategy-agent@users.noreply.github.com'
          git add "strategy/runs/${CYCLE_ID}/deepseek.json" "strategy/runs/${CYCLE_ID}/deepseek.md" strategy/deepseek_cost_gate_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Add DeepSeek strategy review ${CYCLE_ID}"
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            git push origin HEAD:ai-reviews
          fi

      - name: Clean workspace
        if: always()
        run: rm -rf .strategy_deepseek /tmp/deepseek-strategy-reviews /tmp/deepseek-meta.env /tmp/deepseek-cost-state.json