name: DeepSeek Telegram Bridge Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'learnerbot/ai_master_control.py'
      - 'learnerbot/telegram_deepseek_control_patch.py'
      - 'learnerbot/telegram_command_scope_patch.py'
      - 'scripts/ai_agent_bus.py'
      - 'scripts/ai_agent_bus_pending.py'
      - 'scripts/ai_agent_bus_provider_compat.py'
      - 'scripts/run_ai_agent_bus.py'
      - 'scripts/claude_git_mailbox_bridge.py'
      - 'scripts/gpt_git_mailbox_bridge.py'
      - '.github/workflows/ai-agent-bus.yml'
      - '.github/workflows/claude-git-mailbox-bridge.yml'
      - '.github/workflows/claude-mailbox-signal.yml'
      - '.github/workflows/gpt-git-mailbox-bridge.yml'
      - '.github/workflows/gpt-mailbox-signal.yml'
      - '.github/workflows/publish-ai-master-control.yml'
      - '.github/workflows/deepseek-github-controlled-ops.yml'
      - '.github/workflows/deepseek-github-readonly-selfhosted.yml'
      - '.github/workflows/deepseek-vps-controlled-ops.yml'
      - '.github/workflows/deepseek-telegram-bridge-ci.yml'
      - 'tests/test_ai_agent_bus_delivery_fallback.py'
      - 'tests/test_claude_git_mailbox_bridge.py'
      - 'tests/test_gpt_git_mailbox_bridge.py'
      - 'tests/test_deepseek_telegram_bridge.py'
      - 'tests/test_deepseek_controlled_access.py'
      - 'tests/test_deepseek_readonly_selfhosted_inspect.py'
      - 'tests/test_deepseek_fifth_agent.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-telegram-bridge-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 25
    steps:
      - name: Check out tested ref without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run bridge and safety regressions in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/deepseek-telegram-bridge-ci-${GITHUB_RUN_ID}"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q pytest pyyaml python-dotenv
          "$venv/bin/python" -m py_compile \
            learnerbot/ai_master_control.py \
            learnerbot/telegram_deepseek_control_patch.py \
            scripts/ai_agent_bus.py \
            scripts/ai_agent_bus_pending.py \
            scripts/ai_agent_bus_provider_compat.py \
            scripts/run_ai_agent_bus.py \
            scripts/claude_git_mailbox_bridge.py \
            scripts/gpt_git_mailbox_bridge.py \
            tests/test_ai_agent_bus_delivery_fallback.py \
            tests/test_claude_git_mailbox_bridge.py \
            tests/test_gpt_git_mailbox_bridge.py \
            tests/test_deepseek_telegram_bridge.py \
            tests/test_deepseek_controlled_access.py \
            tests/test_deepseek_readonly_selfhosted_inspect.py \
            tests/test_deepseek_fifth_agent.py
          "$venv/bin/python" - <<'PY'
          import pathlib,yaml
          for name in (
              '.github/workflows/ai-agent-bus.yml',
              '.github/workflows/claude-git-mailbox-bridge.yml',
              '.github/workflows/claude-mailbox-signal.yml',
              '.github/workflows/gpt-git-mailbox-bridge.yml',
              '.github/workflows/gpt-mailbox-signal.yml',
              '.github/workflows/publish-ai-master-control.yml',
              '.github/workflows/deepseek-github-controlled-ops.yml',
              '.github/workflows/deepseek-github-readonly-selfhosted.yml',
              '.github/workflows/deepseek-vps-controlled-ops.yml',
          ):
              value=yaml.safe_load(pathlib.Path(name).read_text(encoding='utf-8'))
              assert isinstance(value,dict) and 'jobs' in value, name
          PY
          "$venv/bin/python" -m pytest -q \
            tests/test_ai_agent_bus_delivery_fallback.py \
            tests/test_claude_git_mailbox_bridge.py \
            tests/test_gpt_git_mailbox_bridge.py \
            tests/test_deepseek_telegram_bridge.py \
            tests/test_deepseek_controlled_access.py \
            tests/test_deepseek_readonly_selfhosted_inspect.py \
            tests/test_deepseek_fifth_agent.py \
            tests/test_selected_ai_master_control.py
          rm -rf "$venv"
