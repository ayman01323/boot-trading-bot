name: DeepSeek Trade Lookup CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/deepseek_trade_lookup.py'
      - 'learnerbot/telegram_deepseek_trade_lookup_patch.py'
      - 'learnerbot/telegram_command_scope_patch.py'
      - '.github/workflows/deepseek-trade-lookup.yml'
      - '.github/workflows/deepseek-trade-lookup-ci.yml'
      - 'tests/test_deepseek_trade_lookup.py'
      - 'tests/test_deepseek_trade_lookup_controls.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-trade-lookup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 15
    steps:
      - name: Check out tested ref without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run focused bounded lookup tests with Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.11 >/dev/null 2>&1 || {
            echo 'python3.11 is required on boot-vps' >&2
            exit 127
          }
          venv="/tmp/deepseek-trade-lookup-ci-${GITHUB_RUN_ID}"
          rm -rf "$venv"
          python3.11 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q pytest pyyaml
          "$venv/bin/python" -m py_compile \
            scripts/deepseek_trade_lookup.py \
            learnerbot/telegram_deepseek_trade_lookup_patch.py \
            learnerbot/telegram_command_scope_patch.py
          "$venv/bin/python" - <<'PY'
          import pathlib,yaml
          for name in (
              '.github/workflows/deepseek-trade-lookup.yml',
              '.github/workflows/deepseek-trade-lookup-ci.yml',
          ):
              value=yaml.safe_load(pathlib.Path(name).read_text(encoding='utf-8'))
              assert isinstance(value,dict) and 'jobs' in value, name
          PY
          "$venv/bin/python" -m pytest -q \
            tests/test_deepseek_trade_lookup.py \
            tests/test_deepseek_trade_lookup_controls.py
          rm -rf "$venv"
