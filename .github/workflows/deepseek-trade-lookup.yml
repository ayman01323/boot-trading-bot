name: DeepSeek Bounded Trade Lookup

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      lookup_type:
        description: 'Bounded lookup type'
        required: false
        default: account
        type: choice
        options: [account, exact]
      identifier:
        description: 'Telegram ID for account lookup, or exact position/trade/event/tx identifier'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: deepseek-bounded-trade-lookup
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 12
    steps:
      - name: Check out exact current main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve bounded request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LOOKUP_TYPE: ${{ inputs.lookup_type }}
          INPUT_IDENTIFIER: ${{ inputs.identifier }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && -n "${INPUT_IDENTIFIER:-}" ]]; then
            python3 - <<'PY' > /tmp/deepseek-trade-request.json
          import json,os,time
          print(json.dumps({
              'schema_version':1,
              'lookup_type':str(os.environ.get('INPUT_LOOKUP_TYPE') or 'account').strip().lower(),
              'identifier':str(os.environ.get('INPUT_IDENTIFIER') or '').strip(),
              'request_nonce':int(os.environ.get('RUN_ID') or 0),
              'requested_epoch':int(time.time()),
              'requested_by':'workflow_dispatch',
          }))
          PY
          else
            src=/var/tmp/boot/deepseek_trade_lookup_request.json
            if [[ ! -s "$src" ]]; then
              echo 'available=false' >> "$GITHUB_OUTPUT"
              echo 'No Telegram trade lookup request is available.'
              exit 0
            fi
            cp "$src" /tmp/deepseek-trade-request.json
          fi

          python3 - <<'PY'
          import json,re
          p=json.load(open('/tmp/deepseek-trade-request.json',encoding='utf-8'))
          kind=str(p.get('lookup_type') or '').strip().lower()
          ident=str(p.get('identifier') or '').strip()
          nonce=max(0,int(p.get('request_nonce') or 0))
          if kind not in {'account','exact'}: raise SystemExit('invalid lookup_type')
          if kind=='account' and not re.fullmatch(r'[0-9]{1,20}',ident): raise SystemExit('invalid account identifier')
          if kind=='exact' and not re.fullmatch(r'[A-Za-z0-9_.:-]{1,128}',ident): raise SystemExit('invalid exact identifier')
          clean={
              'schema_version':1,'lookup_type':kind,'identifier':ident,'request_nonce':nonce,
              'requested_epoch':max(0,int(p.get('requested_epoch') or 0)),
              'requested_by':str(p.get('requested_by') or '')[:80],
          }
          json.dump(clean,open('/tmp/deepseek-trade-request-clean.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          PY

          current_nonce=0
          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/trades/deepseek/latest.json?ref=ai-reviews" \
            > /tmp/deepseek-trade-existing-api.json 2>/dev/null
          api_rc=$?
          set -e
          if [[ $api_rc -eq 0 && -s /tmp/deepseek-trade-existing-api.json ]]; then
            current_nonce="$(python3 - <<'PY'
          import base64,json
          d=json.load(open('/tmp/deepseek-trade-existing-api.json'))
          try:
              p=json.loads(base64.b64decode((d.get('content') or '').replace('\n','')).decode())
              print(int(p.get('request_nonce') or 0))
          except Exception:
              print(0)
          PY
            )"
          fi
          request_nonce="$(python3 -c "import json;print(int(json.load(open('/tmp/deepseek-trade-request-clean.json')).get('request_nonce') or 0))")"
          if [[ "$EVENT_NAME" != 'workflow_dispatch' && "$request_nonce" -le "$current_nonce" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "Request nonce $request_nonce already processed (latest $current_nonce)."
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('/tmp/deepseek-trade-request-clean.json'))
          print('lookup_type='+p['lookup_type'])
          print('identifier='+p['identifier'])
          print('request_nonce='+str(p['request_nonce']))
          PY

      - name: Require Python 3.11
        if: steps.request.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.11 >/dev/null 2>&1 || {
            echo 'python3.11 is required on boot-vps' >&2
            exit 127
          }
          python3.11 --version

      - name: Run read-only runtime lookup
        if: steps.request.outputs.available == 'true'
        id: lookup
        env:
          LOOKUP_TYPE: ${{ steps.request.outputs.lookup_type }}
          IDENTIFIER: ${{ steps.request.outputs.identifier }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set +e
          python3.11 scripts/deepseek_trade_lookup.py > /tmp/deepseek-trade-lookup.json 2>/tmp/deepseek-trade-lookup.err
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ ! -s /tmp/deepseek-trade-lookup.json ]]; then
            printf '{"error":"lookup produced no JSON","records":[],"count":0,"not_found":true}\n' > /tmp/deepseek-trade-lookup.json
          fi

      - name: Ask DeepSeek using lookup JSON only
        if: steps.request.outputs.available == 'true'
        id: deepseek
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_TRADE_MODEL: ${{ vars.DEEPSEEK_TRADE_MODEL || 'deepseek-v4-flash' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          python3.11 - <<'PY'
          import json,os,pathlib,urllib.error,urllib.request
          lookup=json.load(open('/tmp/deepseek-trade-lookup.json',encoding='utf-8'))
          payload={
              'model':os.environ.get('DEEPSEEK_TRADE_MODEL') or 'deepseek-v4-flash',
              'temperature':0,
              'messages':[
                  {'role':'system','content':(
                      'You are DEEPSEEK analysing one bounded read-only trading lookup. '
                      'Use only the supplied JSON. Do not request secrets, shell access, paths, wallet keys, '
                      'or changes to LIVE/ARMED/risk/capital controls. Distinguish simulations, execution attempts, '
                      'positions and actual outcomes. Never invent price/PnL fields that are absent. '
                      'Start exactly with: 🔴 AGENT: DEEPSEEK')},
                  {'role':'user','content':json.dumps(lookup,sort_keys=True,default=str)[:45000]},
              ],
          }
          req=urllib.request.Request(
              'https://api.deepseek.com/chat/completions',
              data=json.dumps(payload).encode(),
              headers={'Authorization':'Bearer '+os.environ['DEEPSEEK_API_KEY'],'Content-Type':'application/json'},
              method='POST',
          )
          http_status=0; text=''; error=''
          try:
              with urllib.request.urlopen(req,timeout=45) as r:
                  http_status=int(getattr(r,'status',200) or 200)
                  body=json.loads(r.read().decode('utf-8','replace'))
                  text=str((((body.get('choices') or [{}])[0].get('message') or {}).get('content') or '')).strip()
          except urllib.error.HTTPError as exc:
              http_status=int(exc.code or 0); error=exc.read().decode('utf-8','replace')[-800:]
          except Exception as exc:
              error=f'{type(exc).__name__}: {exc}'
          if text and not text.startswith('🔴 AGENT: DEEPSEEK'):
              text='🔴 AGENT: DEEPSEEK\n\n'+text
          out={'return_code':0 if 200 <= http_status < 300 and bool(text) else 1,'http_status':http_status,'analysis':text,'error':error}
          json.dump(out,open('/tmp/deepseek-trade-analysis.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          raise SystemExit(out['return_code'])
          PY

      - name: Publish sanitised lookup result to ai-reviews
        if: always() && steps.request.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REQUEST_NONCE: ${{ steps.request.outputs.request_nonce }}
          LOOKUP_RC: ${{ steps.lookup.outputs.rc }}
        shell: bash
        run: |
          set -euo pipefail
          python3.11 - <<'PY' > /tmp/deepseek-trade-result.json
          import json,os,pathlib,re,time
          lookup=json.load(open('/tmp/deepseek-trade-lookup.json',encoding='utf-8'))
          try: analysis=json.load(open('/tmp/deepseek-trade-analysis.json',encoding='utf-8'))
          except Exception: analysis={'return_code':1,'http_status':0,'analysis':'','error':'DeepSeek analysis unavailable'}
          text=str(analysis.get('analysis') or '').strip()
          err=str(analysis.get('error') or '')
          for value in (text,err):
              pass
          text=re.sub(r'(?i)(api[_ -]?key|private[_ -]?key|authorization|bearer|seed phrase|mnemonic)[^\n]*','[REDACTED]',text)
          err=re.sub(r'(?i)(api[_ -]?key|private[_ -]?key|authorization|bearer|seed phrase|mnemonic)[^\n]*','[REDACTED]',err)
          lookup_rc=int(os.environ.get('LOOKUP_RC') or 999)
          provider_rc=int(analysis.get('return_code') or 0) if analysis.get('return_code') is not None else 1
          status='SUCCESS' if lookup_rc==0 and provider_rc==0 else ('LOOKUP_ONLY' if lookup_rc==0 else 'FAILED')
          out={
              'schema_version':1,
              'provider':'deepseek',
              'generated_epoch':int(time.time()),
              'workflow_run_id':int(os.environ.get('RUN_ID') or 0),
              'request_nonce':int(os.environ.get('REQUEST_NONCE') or 0),
              'source_commit':os.environ.get('SOURCE_SHA','')[:40],
              'status':status,
              'lookup_return_code':lookup_rc,
              'provider_return_code':provider_rc,
              'provider_http_status':int(analysis.get('http_status') or 0),
              'lookup':lookup,
              'deepseek_analysis_available':provider_rc==0 and bool(text),
              'deepseek_analysis':text[:4000],
              'provider_error':err[:800],
              'security':{
                  'read_only_runtime_data':True,
                  'parameterised_sql':True,
                  'user_controlled_paths':False,
                  'arbitrary_shell':False,
                  'wallet_or_private_key_access':False,
                  'live_or_risk_bypass':False,
                  'deployment':False,
              },
          }
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY

          publish_file() {
            local path="$1" file="$2" message="$3" existing_sha=''
            local api="repos/${GITHUB_REPOSITORY}/contents/${path}"
            set +e
            gh api -H 'Accept: application/vnd.github+json' "$api?ref=ai-reviews" > /tmp/trade-existing.json 2>/dev/null
            rc=$?
            set -e
            if [[ $rc -eq 0 && -s /tmp/trade-existing.json ]]; then
              existing_sha="$(python3 -c "import json;print(json.load(open('/tmp/trade-existing.json')).get('sha') or '')")"
            fi
            python3 - "$file" "$message" "$existing_sha" <<'PY' > /tmp/trade-put.json
          import base64,json,sys
          raw=open(sys.argv[1],'rb').read()
          out={'message':sys.argv[2],'content':base64.b64encode(raw).decode(),'branch':'ai-reviews'}
          if sys.argv[3]: out['sha']=sys.argv[3]
          print(json.dumps(out))
          PY
            gh api -X PUT "$api" --input /tmp/trade-put.json >/dev/null
          }

          publish_file \
            'trades/deepseek/latest.json' \
            /tmp/deepseek-trade-result.json \
            'Record bounded DeepSeek trade lookup'

          stamp="$(python3 -c "import json;d=json.load(open('/tmp/deepseek-trade-result.json'));print(str(d['generated_epoch'])+'-'+str(d['workflow_run_id']))")"
          publish_file \
            "trades/deepseek/history/${stamp}.json" \
            /tmp/deepseek-trade-result.json \
            'Archive bounded DeepSeek trade lookup'

      - name: Human-visible summary
        if: always() && steps.request.outputs.available == 'true'
        shell: bash
        run: |
          {
            echo '## 🔴 AGENT: DEEPSEEK — Bounded Trade Lookup'
            echo
            python3.11 - <<'PY'
          import json
          d=json.load(open('/tmp/deepseek-trade-result.json'))
          lookup=d.get('lookup') or {}
          print(f"Status: **{d.get('status')}**")
          print(f"Lookup: **{lookup.get('lookup_type')}**")
          print(f"Identifier: `{lookup.get('identifier','')}`")
          print(f"Records: **{lookup.get('count',0)}**")
          print(f"Deployed SHA: `{lookup.get('deployed_sha','')}`")
          print(f"DeepSeek HTTP: **{d.get('provider_http_status',0)}**")
          text=str(d.get('deepseek_analysis') or '')
          if text:
              print('\n'+text[:1800])
          PY
          } >> "$GITHUB_STEP_SUMMARY"
