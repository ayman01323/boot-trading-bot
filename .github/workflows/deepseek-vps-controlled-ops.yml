name: DeepSeek VPS Controlled Operations

on:
  push:
    branches: [main]
    paths:
      - '.github/deepseek-vps-inspect.trigger'
  workflow_dispatch:
    inputs:
      action:
        description: 'Bounded VPS action'
        required: true
        default: inspect
        type: choice
        options: [inspect, test, deploy]
      task:
        description: 'Optional bounded VPS inspection task; never authorises shell/root/wallet/LIVE bypass'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: deepseek-vps-controlled-ops
  cancel-in-progress: false

jobs:
  operate:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 35
    env:
      DEEPSEEK_VPS_VENV: /tmp/deepseek-vps-${{ github.run_id }}

    steps:
      - name: Check out exact current main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate bounded action and source
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail
          action="${ACTION:-inspect}"
          task="${TASK:-}"
          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            # Push-triggered server access is inspection-only. A repository push
            # can never select test/deploy or broaden VPS authority.
            action='inspect'
            task='GitHub push-triggered bounded VPS inspection. Verify runner/service health and report concrete warnings.'
          fi
          case "$action" in inspect|test|deploy) ;; *) echo 'Unsupported VPS action' >&2; exit 2;; esac
          printf '%s' "$task" > /tmp/deepseek-vps-task.txt
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated Python 3.11 DeepSeek environment
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.11 >/dev/null 2>&1 || {
            echo 'python3.11 is required on the self-hosted boot-vps runner' >&2
            exit 127
          }
          python3.11 --version
          rm -rf "$DEEPSEEK_VPS_VENV"
          python3.11 -m venv "$DEEPSEEK_VPS_VENV"
          "$DEEPSEEK_VPS_VENV/bin/python" -m pip install \
            --disable-pip-version-check -q \
            -r requirements.txt pytest

      - name: Collect pre-action VPS status through restricted wrapper
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/status-boot-trading-bot > /tmp/deepseek-vps-before.txt 2>&1

      - name: Execute bounded VPS action
        id: execute
        env:
          ACTION: ${{ steps.meta.outputs.action }}
        shell: bash
        run: |
          set +e
          : > /tmp/deepseek-vps-action.txt
          rc=0
          target="$(git rev-parse HEAD)"
          case "$ACTION" in
            inspect)
              echo 'Inspection only; no VPS mutation requested.' | tee /tmp/deepseek-vps-action.txt
              ;;
            test)
              PYTHONDONTWRITEBYTECODE=1 \
                "$DEEPSEEK_VPS_VENV/bin/python" -m compileall -q learnerbot scripts tests \
                >> /tmp/deepseek-vps-action.txt 2>&1 || rc=$?
              if [[ $rc -eq 0 ]]; then
                PYTHONDONTWRITEBYTECODE=1 \
                  "$DEEPSEEK_VPS_VENV/bin/python" -m pytest -q \
                  >> /tmp/deepseek-vps-action.txt 2>&1 || rc=$?
              fi
              ;;
            deploy)
              git fetch --force origin main >> /tmp/deepseek-vps-action.txt 2>&1 || rc=$?
              target="$(git rev-parse origin/main 2>/dev/null || true)"
              current="$(git rev-parse HEAD 2>/dev/null || true)"
              if [[ $rc -eq 0 && "$target" =~ ^[0-9a-f]{40}$ && "$current" == "$target" ]]; then
                sudo /usr/local/sbin/deploy-boot-trading-bot "$target" >> /tmp/deepseek-vps-action.txt 2>&1 || rc=$?
              else
                echo 'Refusing deploy: checkout is not exact current origin/main.' >> /tmp/deepseek-vps-action.txt
                rc=42
              fi
              ;;
          esac
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect post-action VPS status through restricted wrapper
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/status-boot-trading-bot > /tmp/deepseek-vps-after.txt 2>&1
          exit 0

      - name: Build sanitised DeepSeek VPS context
        shell: bash
        run: |
          "$DEEPSEEK_VPS_VENV/bin/python" - <<'PY'
          import pathlib, re

          parts=[]
          for title,path in (
              ('BEFORE','/tmp/deepseek-vps-before.txt'),
              ('ACTION','/tmp/deepseek-vps-action.txt'),
              ('AFTER','/tmp/deepseek-vps-after.txt'),
          ):
              p=pathlib.Path(path)
              text=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
              kept=[]
              for line in text.splitlines():
                  if re.search(r'(?i)(api[_ -]?key|private[_ -]?key|mnemonic|seed phrase|password|authorization:|bearer |secret=|token=)',line):
                      kept.append('[REDACTED SENSITIVE LINE]')
                  else:
                      line=re.sub(r'sk-[A-Za-z0-9_-]{12,}','<redacted-key>',line)
                      line=re.sub(r'github_pat_[A-Za-z0-9_]+','<redacted-github-token>',line)
                      line=re.sub(r'gh[pousr]_[A-Za-z0-9]+','<redacted-github-token>',line)
                      kept.append(line)
              parts.append(f'=== {title} ===\n'+'\n'.join(kept)[-9000:])
          pathlib.Path('/tmp/deepseek-vps-context.txt').write_text('\n\n'.join(parts)+'\n',encoding='utf-8')
          PY

      - name: Ask DeepSeek through direct API using sanitised VPS context only
        id: deepseek
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_COUNCIL_MODEL: ${{ vars.DEEPSEEK_VPS_MODEL || 'deepseek-chat' }}
          AI_COUNCIL_RUNTIME_ENV: /tmp/deepseek-vps-no-runtime.env
          ACTION: ${{ steps.meta.outputs.action }}
          ACTION_RC: ${{ steps.execute.outputs.rc }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          PYTHONDONTWRITEBYTECODE=1 "$DEEPSEEK_VPS_VENV/bin/python" - <<'PY'
          import os, pathlib
          from learnerbot.ai_council_http_patch import call_provider

          context = pathlib.Path('/tmp/deepseek-vps-context.txt').read_text(encoding='utf-8', errors='replace')
          task = pathlib.Path('/tmp/deepseek-vps-task.txt').read_text(encoding='utf-8', errors='replace').strip()[:1200]
          prompt = '\n'.join([
              'You are DEEPSEEK acting only as a bounded VPS health analyst.',
              'GitHub source SHA: ' + os.environ.get('SOURCE_SHA', ''),
              'Requested VPS action: ' + os.environ.get('ACTION', 'inspect'),
              'Deterministic action return code: ' + os.environ.get('ACTION_RC', ''),
              'Optional user task: ' + (task or 'Summarise service health and concrete operational warnings.'),
              '',
              'Use ONLY the sanitised context below. Do not request or infer secrets.',
              'Do not inspect paths outside this supplied context. Do not propose root shells, arbitrary sudo,',
              'wallet/signing/private-key access, arbitrary deployment SHAs, or LIVE/ARMED/risk-gate bypass.',
              'Report whether the service appears healthy, whether the requested action succeeded, and concrete follow-up.',
              'Start exactly with: 🔴 AGENT: DEEPSEEK',
              '',
              'SANITISED VPS CONTEXT:',
              context,
          ])
          rc, out, err = call_provider('deepseek', prompt)
          out = str(out or '').strip()
          if out and not out.startswith('🔴 AGENT: DEEPSEEK'):
              out = '🔴 AGENT: DEEPSEEK\n\n' + out
          pathlib.Path('/tmp/deepseek-vps-analysis.txt').write_text(out, encoding='utf-8')
          pathlib.Path('/tmp/deepseek-vps-error.txt').write_text(str(err or ''), encoding='utf-8')
          pathlib.Path('/tmp/deepseek-vps-provider-rc.txt').write_text(str(int(rc)), encoding='utf-8')
          raise SystemExit(0 if int(rc) == 0 and out else 1)
          PY

      - name: Publish sanitised DeepSeek VPS result to ai-reviews
        if: always() && steps.meta.outputs.source_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.meta.outputs.action }}
          ACTION_RC: ${{ steps.execute.outputs.rc }}
          TARGET_SHA: ${{ steps.execute.outputs.target_sha }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          "$DEEPSEEK_VPS_VENV/bin/python" - <<'PY' > /tmp/deepseek-vps-result.json
          import json, os, pathlib, re, time

          def read(path, limit):
              p=pathlib.Path(path)
              return p.read_text(encoding='utf-8',errors='replace')[-limit:] if p.exists() else ''

          after=read('/tmp/deepseek-vps-after.txt',12000)
          action_tail=read('/tmp/deepseek-vps-action.txt',5000)
          analysis=read('/tmp/deepseek-vps-analysis.txt',1800).strip()
          error=read('/tmp/deepseek-vps-error.txt',900).strip()
          provider_rc_text=read('/tmp/deepseek-vps-provider-rc.txt',20).strip()
          try:
              provider_rc=int(provider_rc_text)
          except Exception:
              provider_rc=999
          if not analysis:
              analysis='🔴 AGENT: DEEPSEEK\n\nDeepSeek analysis unavailable: '+(error or 'provider call failed')
          analysis=re.sub(r'(?i)(api[_ -]?key|private[_ -]?key|authorization|bearer|token)[^\n]*','[REDACTED]',analysis)
          sha=''
          m=re.search(r'(?m)^sha:\s*([0-9a-f]{40})\s*$',after)
          if m:
              sha=m.group(1)
          action_rc=int(os.environ.get('ACTION_RC') or 999)
          status='SUCCESS' if action_rc==0 and provider_rc==0 else 'FAILED'
          out={
              'schema_version':2,
              'provider':'deepseek',
              'generated_epoch':int(time.time()),
              'source_commit':os.environ.get('SOURCE_SHA','')[:40],
              'workflow_run_id':int(os.environ.get('RUN_ID') or 0),
              'action':os.environ.get('ACTION','inspect'),
              'status':status,
              'action_return_code':action_rc,
              'provider_return_code':provider_rc,
              'target_sha':os.environ.get('TARGET_SHA','')[:40],
              'deployed_sha':sha,
              'service_active':bool(re.search(r'Active:\s+active \(running\)',after,re.I)),
              'deepseek_analysis_available':provider_rc==0 and bool(read('/tmp/deepseek-vps-analysis.txt',1800).strip()),
              'deepseek_analysis':analysis[:1800],
              'sanitised_action_tail':action_tail[-2500:],
              'github_to_vps_link':True,
              'self_hosted_runner':True,
              'security':{
                  'root_shell':False,
                  'arbitrary_sudo':False,
                  'wallet_or_private_key_access':False,
                  'arbitrary_deploy_sha':False,
                  'deploy_current_main_via_restricted_wrapper_only':True,
                  'live_or_risk_bypass':False,
              },
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

          api="repos/${GITHUB_REPOSITORY}/contents/vps/deepseek/latest.json"
          existing_sha=''
          set +e
          gh api -H 'Accept: application/vnd.github+json' "$api?ref=ai-reviews" > /tmp/deepseek-vps-existing.json 2>/dev/null
          rc=$?
          set -e
          if [[ $rc -eq 0 && -s /tmp/deepseek-vps-existing.json ]]; then
            existing_sha="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/deepseek-vps-existing.json')).get('sha') or '')
          PY
            )"
          fi
          python3 - "$existing_sha" <<'PY' > /tmp/deepseek-vps-put.json
          import base64, json, sys
          raw=open('/tmp/deepseek-vps-result.json','rb').read()
          out={
              'message':'Record bounded DeepSeek VPS result\n\nAI-Agent: DEEPSEEK',
              'content':base64.b64encode(raw).decode(),
              'branch':'ai-reviews',
          }
          if sys.argv[1]:
              out['sha']=sys.argv[1]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/deepseek-vps-put.json >/dev/null

      - name: Publish human-visible result summary
        if: always()
        shell: bash
        run: |
          {
            echo '## 🔴 AGENT: DEEPSEEK'
            echo
            echo "VPS action: **${{ steps.meta.outputs.action }}**"
            echo "Action return code: **${{ steps.execute.outputs.rc }}**"
            echo "Source SHA: \`${{ steps.meta.outputs.source_sha }}\`"
            if [[ -s /tmp/deepseek-vps-provider-rc.txt ]]; then
              echo "DeepSeek provider return code: **$(cat /tmp/deepseek-vps-provider-rc.txt)**"
            fi
            if [[ -s /tmp/deepseek-vps-analysis.txt ]]; then
              echo
              cat /tmp/deepseek-vps-analysis.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove isolated DeepSeek VPS environment
        if: always()
        shell: bash
        run: |
          rm -rf "$DEEPSEEK_VPS_VENV"
