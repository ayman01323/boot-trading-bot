name: DeepSeek VPS Controlled Operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Bounded VPS action'
        required: true
        default: inspect
        type: choice
        options: [inspect, test, deploy]

permissions:
  contents: write

concurrency:
  group: deepseek-vps-controlled-ops
  cancel-in-progress: false

jobs:
  operate:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 35
    steps:
      - name: Check out exact current main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate bounded action and source
        id: meta
        env:
          ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          action="${ACTION:-inspect}"
          case "$action" in inspect|test|deploy) ;; *) echo 'Unsupported VPS action' >&2; exit 2;; esac
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Collect pre-action VPS status through restricted wrapper
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/status-boot-trading-bot > /tmp/deepseek-vps-before.txt 2>&1

      - name: Execute bounded VPS action
        id: execute
        env:
          ACTION: ${{ steps.meta.outputs.action }}
        shell: bash
        run: |
          set +e
          : > /tmp/deepseek-vps-action.txt
          rc=0
          target="$(git rev-parse HEAD)"
          case "$ACTION" in
            inspect)
              echo 'Inspection only; no VPS mutation requested.' | tee /tmp/deepseek-vps-action.txt
              ;;
            test)
              tmpvenv="/tmp/deepseek-vps-test-${GITHUB_RUN_ID}"
              rm -rf "$tmpvenv"
              python3 -m venv "$tmpvenv" >> /tmp/deepseek-vps-action.txt 2>&1 || rc=$?
              if [[ $rc -eq 0 ]]; then
                "$tmpvenv/bin/python" -m pip install --disable-pip-version-check -q -r requirements.txt pytest >> /tmp/deepseek-vps-action.txt 2>&1 || rc=$?
              fi
              if [[ $rc -eq 0 ]]; then
                "$tmpvenv/bin/python" -m compileall -q learnerbot scripts tests >> /tmp/deepseek-vps-action.txt 2>&1 || rc=$?
              fi
              if [[ $rc -eq 0 ]]; then
                "$tmpvenv/bin/python" -m pytest -q >> /tmp/deepseek-vps-action.txt 2>&1 || rc=$?
              fi
              rm -rf "$tmpvenv"
              ;;
            deploy)
              git fetch --force origin main >> /tmp/deepseek-vps-action.txt 2>&1 || rc=$?
              target="$(git rev-parse origin/main 2>/dev/null || true)"
              current="$(git rev-parse HEAD 2>/dev/null || true)"
              if [[ $rc -eq 0 && "$target" =~ ^[0-9a-f]{40}$ && "$current" == "$target" ]]; then
                sudo /usr/local/sbin/deploy-boot-trading-bot "$target" >> /tmp/deepseek-vps-action.txt 2>&1 || rc=$?
              else
                echo 'Refusing deploy: checkout is not exact current origin/main.' >> /tmp/deepseek-vps-action.txt
                rc=42
              fi
              ;;
          esac
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect post-action VPS status through restricted wrapper
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/status-boot-trading-bot > /tmp/deepseek-vps-after.txt 2>&1
          exit 0

      - name: Build sanitised DeepSeek VPS context
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          parts=[]
          secret_terms = ('mne'+'monic', 'seed'+' phrase')
          sensitive = r'(?i)(api[_ -]?key|private[_ -]?key|' + '|'.join(re.escape(x) for x in secret_terms) + r'|password|authorization:|bearer |secret=|token=)'
          for title,path in (
              ('BEFORE','/tmp/deepseek-vps-before.txt'),
              ('ACTION','/tmp/deepseek-vps-action.txt'),
              ('AFTER','/tmp/deepseek-vps-after.txt'),
          ):
              p=pathlib.Path(path)
              text=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
              kept=[]
              for line in text.splitlines():
                  if re.search(sensitive,line):
                      kept.append('[REDACTED SENSITIVE LINE]')
                  else:
                      line=re.sub(r'sk-[A-Za-z0-9_-]{12,}','<redacted-key>',line)
                      line=re.sub(r'github_pat_[A-Za-z0-9_]+','<redacted-github-token>',line)
                      line=re.sub(r'gh[pousr]_[A-Za-z0-9]+','<redacted-github-token>',line)
                      kept.append(line)
              parts.append(f'=== {title} ===\n'+'\n'.join(kept)[-9000:])
          pathlib.Path('/tmp/deepseek-vps-context.txt').write_text('\n\n'.join(parts)+'\n',encoding='utf-8')
          PY

      - name: DeepSeek analyse only sanitised VPS context
        id: deepseek
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_VPS_MODEL: ${{ vars.DEEPSEEK_VPS_MODEL || 'deepseek-v4-flash' }}
          ACTION: ${{ steps.meta.outputs.action }}
          ACTION_RC: ${{ steps.execute.outputs.rc }}
          DISABLE_AUTOUPDATER: '1'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          if ! command -v claude >/dev/null 2>&1; then
            npm install -g @anthropic-ai/claude-code@latest >/tmp/deepseek-vps-install.log 2>&1
          fi
          sandbox="/tmp/deepseek-vps-analysis-${GITHUB_RUN_ID}"
          rm -rf "$sandbox" && mkdir -p "$sandbox"
          cp /tmp/deepseek-vps-context.txt "$sandbox/context.txt"
          cd "$sandbox"
          export ANTHROPIC_BASE_URL='https://api.deepseek.com/anthropic'
          export ANTHROPIC_AUTH_TOKEN="$DEEPSEEK_API_KEY"
          export ANTHROPIC_MODEL="$DEEPSEEK_VPS_MODEL"
          export ANTHROPIC_DEFAULT_OPUS_MODEL="$DEEPSEEK_VPS_MODEL"
          export ANTHROPIC_DEFAULT_SONNET_MODEL="$DEEPSEEK_VPS_MODEL"
          export ANTHROPIC_DEFAULT_HAIKU_MODEL="$DEEPSEEK_VPS_MODEL"
          unset ANTHROPIC_API_KEY || true
          cat > prompt.txt <<EOF
          You are DEEPSEEK acting only as a bounded VPS health summariser.
          Requested action: ${ACTION}; deterministic return code: ${ACTION_RC}.
          Read ONLY context.txt in this temporary sandbox. Summarise whether the service appears healthy, whether the requested
          action succeeded, and any concrete follow-up needed. Do not request or infer secrets. Do not inspect paths outside
          this sandbox and do not suggest bypassing tests, wallet/signing controls, LIVE risk gates or sudo restrictions.
          Keep the answer under 700 characters and plain text.
          EOF
          claude -p --permission-mode plan --max-turns 2 --output-format text \
            "$(cat prompt.txt)\n\n$(cat context.txt)" > analysis.txt 2> error.txt
          cp analysis.txt /tmp/deepseek-vps-analysis.txt
          cp error.txt /tmp/deepseek-vps-error.txt
          cd /
          rm -rf "$sandbox"

      - name: Publish sanitised DeepSeek VPS result to ai-reviews
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.meta.outputs.action }}
          ACTION_RC: ${{ steps.execute.outputs.rc }}
          TARGET_SHA: ${{ steps.execute.outputs.target_sha }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          DEEPSEEK_OUTCOME: ${{ steps.deepseek.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/deepseek-vps-result.json
          import json,os,pathlib,re,time
          def read(path,limit):
              p=pathlib.Path(path)
              return p.read_text(encoding='utf-8',errors='replace')[-limit:] if p.exists() else ''
          after=read('/tmp/deepseek-vps-after.txt',12000)
          action_tail=read('/tmp/deepseek-vps-action.txt',5000)
          analysis=read('/tmp/deepseek-vps-analysis.txt',1200).strip()
          if not analysis:
              analysis=read('/tmp/deepseek-vps-error.txt',800).strip() or 'DeepSeek analysis unavailable; deterministic VPS result is still recorded.'
          analysis=re.sub(r'(?i)(api[_ -]?key|authorization|bearer|token)[^\n]*','[REDACTED]',analysis)
          sha=''
          m=re.search(r'(?m)^sha:\s*([0-9a-f]{40})\s*$',after)
          if m: sha=m.group(1)
          rc=int(os.environ.get('ACTION_RC') or 999)
          out={
              'schema_version':1,
              'provider':'deepseek',
              'generated_epoch':int(time.time()),
              'source_commit':os.environ.get('SOURCE_SHA','')[:40],
              'action':os.environ.get('ACTION','inspect'),
              'status':'SUCCESS' if rc==0 else 'FAILED',
              'action_return_code':rc,
              'target_sha':os.environ.get('TARGET_SHA','')[:40],
              'deployed_sha':sha,
              'service_active':bool(re.search(r'Active:\s+active \(running\)',after,re.I)),
              'deepseek_analysis_available':os.environ.get('DEEPSEEK_OUTCOME')=='success',
              'deepseek_analysis':analysis[:1200],
              'sanitised_action_tail':action_tail[-2500:],
              'security':{
                  'root_shell':False,
                  'arbitrary_sudo':False,
                  'wallet_or_private_key_access':False,
                  'arbitrary_deploy_sha':False,
                  'deploy_current_main_via_restricted_wrapper_only':True,
              },
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/deepseek-vps-ai-reviews
          git worktree add --detach /tmp/deepseek-vps-ai-reviews origin/ai-reviews
          mkdir -p /tmp/deepseek-vps-ai-reviews/vps/deepseek
          cp /tmp/deepseek-vps-result.json /tmp/deepseek-vps-ai-reviews/vps/deepseek/latest.json
          cd /tmp/deepseek-vps-ai-reviews
          git config user.name 'DeepSeek'
          git config user.email 'deepseek-agent@users.noreply.github.com'
          git add vps/deepseek/latest.json
          if ! git diff --cached --quiet; then
            git commit -m $'Record bounded DeepSeek VPS result\n\nAI-Agent: DEEPSEEK'
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            git push origin HEAD:ai-reviews
          fi

      - name: Publish human-visible result summary
        if: always()
        shell: bash
        run: |
          {
            echo '## 🔴 AGENT: DEEPSEEK'
            echo
            echo "VPS action: **${{ steps.meta.outputs.action }}**"
            echo "Return code: **${{ steps.execute.outputs.rc }}**"
            echo "Source SHA: \`${{ steps.meta.outputs.source_sha }}\`"
            if [[ -s /tmp/deepseek-vps-analysis.txt ]]; then
              echo
              cat /tmp/deepseek-vps-analysis.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
