name: Deployment Attestation Tests

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-vps.yml'
      - '.github/workflows/deploy-attestation-ci.yml'
      - 'tests/test_deploy_attestation_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate deployment attestation contract
        run: pytest -q tests/test_deploy_attestation_workflow.py
