name: Deploy SiRisky One USD Safety V2 Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Deploy test cleanup and arm USD1 SiRisky on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/608fd69d1558e457d73dcbc5be3fbd4cd3081b02/scripts/sirisky_google_one_usd_deploy_arm.sh \
            -o "$tmp"
          grep -q 'SIRISKY ONE USD SAFETY DEPLOY' "$tmp"
          bash "$tmp"
