name: Finalize SiRisky Fixed Entry Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  finalize:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Freeze entry and validate SiRisky on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/8638130c49432f235886799b25e7a935269ddb04/scripts/sirisky_google_fixed_entry_009172629_finalize.sh \
            -o "$tmp"
          grep -q 'SIRISKY FIXED ENTRY 0.009172629 SOL FINALIZE' "$tmp"
          bash "$tmp"
