name: Restore SiRisky Candidate Coverage Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Apply candidate coverage 5 at fixed 0.009 SOL
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/5e16977ff909f7d003a343cd434cdfaf43ba3913/scripts/sirisky_google_candidate_coverage_5_009.sh \
            -o "$tmp"
          grep -q 'SIRISKY 0.009 SOL CANDIDATE COVERAGE 5' "$tmp"
          bash "$tmp"
