name: Deploy SiRisky Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'
      - '.github/sirisky-google-only.trigger'
      - 'scripts/sirisky_google_jupiter_governor_apply.sh'

permissions:
  contents: read

concurrency:
  group: sirisky-google-only-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Apply SiRisky Jupiter governor on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/ops/google-master-menu-cutover-20260827/scripts/sirisky_google_jupiter_governor_apply.sh \
            -o "$tmp"
          bash "$tmp"

      - name: Observe post-restart execution status
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sleep 20
          sudo -n bash -lc '
            echo "=== latest executions ==="
            tail -n 12 /root/SiRisky/CSV/executions.csv 2>/dev/null || true
            echo "=== latest risk checks ==="
            tail -n 8 /root/SiRisky/CSV/risk_checks.csv 2>/dev/null || true
            echo "service=$(systemctl is-active sirisky.service)"
          '
