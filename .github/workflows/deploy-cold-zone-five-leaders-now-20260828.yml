name: Deploy SiRisky Telegram Reporting Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Deploy BUY SELL and NewPoll45 Telegram reporting on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/1033eebfcd33d75abee2a3db8d22faa6c92d2589/scripts/sirisky_google_jupiter_governor_apply.sh \
            -o "$tmp"
          grep -q 'DEPLOY SIRISKY TELEGRAM POSITION REPORTER' "$tmp"
          bash "$tmp"
