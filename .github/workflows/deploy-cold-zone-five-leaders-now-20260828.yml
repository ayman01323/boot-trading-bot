name: Apply SiRisky Automatic LIVE Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'
      - '.github/sirisky-google-only.trigger'

permissions:
  contents: read

concurrency:
  group: sirisky-google-only-auto-live
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Install and arm SiRisky automatic LIVE on botgoogle only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/main/scripts/install_sirisky_governed_live_ops.sh \
            -o "$tmp"
          grep -q 'manual_approval_enabled,0' "$tmp"
          grep -q 'manual_approval_require_external_signature,0' "$tmp"
          sudo -n true
          sudo -n env ARM_NOW=1 bash "$tmp"

      - name: Verify automatic LIVE root runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n bash -lc '
            set -Eeuo pipefail
            R=/root/SiRisky/CSV/runtime.csv
            value() { awk -F, -v key="$1" '\''$1==key {gsub(/\r/,"",$2); print $2}'\'' "$R"; }
            test "$(value trading_mode)" = LIVE
            test "$(value live_enabled)" = 1
            test "$(value broadcast_enabled)" = 1
            test "$(value manual_approval_enabled)" = 0
            test "$(value armed_manual_approval)" = 0
            test "$(value manual_approval_require_external_signature)" = 0
            test "$(value telegram_manual_run_enabled)" = 0
            systemctl is-active --quiet sirisky.service
            echo "=== VERIFIED SIRISKY GOOGLE-ONLY AUTO LIVE ==="
            echo "host=$(hostname)"
            echo "service=$(systemctl is-active sirisky.service)"
            echo "trading_mode=$(value trading_mode)"
            echo "live_enabled=$(value live_enabled)"
            echo "broadcast_enabled=$(value broadcast_enabled)"
            echo "manual_approval_enabled=$(value manual_approval_enabled)"
            echo "armed_manual_approval=$(value armed_manual_approval)"
            echo "manual_approval_require_external_signature=$(value manual_approval_require_external_signature)"
            echo "telegram_manual_run_enabled=$(value telegram_manual_run_enabled)"
          '
