name: Inspect SiRisky Activity Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Read current SiRisky activity on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          sudo -n bash -lc '
            set -Eeuo pipefail
            cd /root/SiRisky
            echo "=== CURRENT ==="
            date -u
            hostname
            systemctl is-active sirisky.service
            echo "=== RUNTIME ==="
            grep -E "^(trading_mode|live_enabled|broadcast_enabled|manual_approval_enabled|auto_probe_sol|auto_entry_min_sol|auto_entry_max_sol|auto_evaluate_candidate_limit|jupiter_min_interval_seconds)," CSV/runtime.csv || true
            echo "=== OPEN LIVE ==="
            head -n 1 CSV/open_positions.csv 2>/dev/null || true
            grep -i ",OPEN," CSV/open_positions.csv 2>/dev/null | tail -n 10 || true
            echo "=== ACTIVITY 20 MIN ==="
            journalctl -u sirisky.service --since "20 minutes ago" --no-pager -o cat 2>/dev/null | grep -Ei "candidate|NO_TRIGGER|QUOTE_REJECT|HTTPError|stage|OPENED|CLOSED|BUY|SELL|JUPITER|fee|risk|reject|discover|opportun|LIVE" | tail -n 500 || true
            echo "=== LAST 120 ==="
            journalctl -u sirisky.service -n 120 --no-pager -o cat 2>/dev/null || true
          '
