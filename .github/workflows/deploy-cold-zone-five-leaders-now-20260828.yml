name: Deploy SiRisky Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'
      - '.github/sirisky-google-only.trigger'

permissions:
  contents: read

concurrency:
  group: sirisky-google-only-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 20
    steps:
      - name: Create clean trusted main checkout on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          SRC=/home/ayman01323/gh-runner/botgoogle/boot-trading-bot/boot-trading-bot
          PARENT="$(dirname "$SRC")"
          STALE="$PARENT/boot-trading-bot.stale-${GITHUB_RUN_ID}"
          cd /home/ayman01323
          if [[ -e "$SRC" ]]; then
            mv "$SRC" "$STALE"
          fi
          mkdir -p "$PARENT"
          git clone --depth 1 --branch main \
            https://github.com/ayman01323/boot-trading-bot.git "$SRC"
          test -d "$SRC/.git"
          test -f "$SRC/SiRisky/overrides/run.py"
          TARGET_SHA="$(git -C "$SRC" rev-parse HEAD)"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "checkout_sha=$TARGET_SHA"
          echo "stale_checkout=$STALE"

      - name: Deploy current main SiRisky files safely in SHADOW
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n -l /usr/local/sbin/sirisky-shadow-deploy >/dev/null
          OUT="$(sudo -n /usr/local/sbin/sirisky-shadow-deploy "$TARGET_SHA")"
          printf '%s\n' "$OUT"
          grep -q '=== SIRISKY SHADOW DEPLOY OK ===' <<<"$OUT"
          grep -q "sha=$TARGET_SHA" <<<"$OUT"
          grep -q 'trading_mode=SHADOW' <<<"$OUT"
          grep -q 'broadcast_enabled=0' <<<"$OUT"

      - name: Re-arm governed automatic LIVE
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n -l /root/SiRisky/ops/sirisky-governed-live-arm >/dev/null
          OUT="$(sudo -n /root/SiRisky/ops/sirisky-governed-live-arm "$TARGET_SHA")"
          printf '%s\n' "$OUT"
          grep -q '=== SIRISKY GOVERNED LIVE AUTO EXECUTION ARMED ===' <<<"$OUT"
          grep -q "sha=$TARGET_SHA" <<<"$OUT"
          grep -q 'service=active' <<<"$OUT"
          grep -q 'trading_mode=LIVE' <<<"$OUT"
          grep -q 'live_enabled=1' <<<"$OUT"
          grep -q 'broadcast_enabled=1' <<<"$OUT"
          grep -q 'manual_approval_enabled=0' <<<"$OUT"
          grep -q 'manual_approval_require_external_signature=0' <<<"$OUT"
          grep -q 'telegram_manual_run_enabled=0' <<<"$OUT"
          test "$(systemctl is-active sirisky.service)" = active
          echo 'google_only_deploy=SUCCESS'
          echo "deployed_sha=$TARGET_SHA"
          echo 'host=botgoogle'
