name: Arm SiRisky 0.009 SOL Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  arm:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Arm fixed 0.009 SOL on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/9aca4dafe7c3fbc4ce44e998807d3cb110392d77/scripts/sirisky_google_fixed_entry_009_finalize.sh \
            -o "$tmp"
          grep -q 'SIRISKY FIXED ENTRY 0.009 SOL FINALIZE' "$tmp"
          if grep -q 'FIXED_SOL="0.0005"' "$tmp"; then
            echo 'Refusing old 0.0005 SOL arming script' >&2
            exit 1
          fi
          bash "$tmp"
