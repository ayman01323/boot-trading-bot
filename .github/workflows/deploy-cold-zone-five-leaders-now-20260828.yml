name: Diagnose SiRisky Live Trading Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Diagnose current SiRisky trading blockers on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/2b11c92213048019c1bcfe5345ce0eff7319c69b/scripts/sirisky_google_live_trade_diagnostic_20260828.sh \
            -o "$tmp"
          bash "$tmp"
