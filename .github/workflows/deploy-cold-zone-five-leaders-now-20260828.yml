name: Validate SiRisky One USD Safety V2 Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Final validate USD1 SiRisky and re-arm only on pass
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/a5ea39a9c218f012b3b79925255a4ac7cfe7eaea/scripts/sirisky_google_one_usd_final_validate.sh \
            -o "$tmp"
          grep -q 'SIRISKY USD1 FINAL VALIDATION' "$tmp"
          bash "$tmp"
