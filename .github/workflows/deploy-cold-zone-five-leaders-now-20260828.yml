name: Deploy SiRisky Telegram Reporting Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Deploy SiRisky Telegram reporting on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/cbff8181c3108b5848abfc6190e99b4d80be5bb7/scripts/sirisky_google_telegram_identity_deploy.sh \
            -o "$tmp"
          grep -q 'foreign_bot_name_present=false' "$tmp" || true
          bash "$tmp"
