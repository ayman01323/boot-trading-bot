name: SiRisky Telegram Inspect Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Inspect live Telegram reporting on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/266c8d67d9d90d534997044a79cdcfdb8edc0d0b/scripts/sirisky_google_jupiter_governor_apply.sh \
            -o "$tmp"
          grep -q 'SIRISKY TELEGRAM LIVE INSPECT' "$tmp"
          bash "$tmp"
