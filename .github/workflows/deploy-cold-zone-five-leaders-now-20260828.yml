name: SiRisky Why Nothing Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Diagnose current SiRisky live activity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/e0a2a57e9c25cd1447e509747f8a7111fd9fea93/scripts/sirisky_google_why_nothing_diagnostic.sh \
            -o "$tmp"
          grep -q 'JUPITER 0.009 SOL FEE GATE NOW' "$tmp"
          bash "$tmp"
