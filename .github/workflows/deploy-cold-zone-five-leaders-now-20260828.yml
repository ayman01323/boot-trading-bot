name: Inspect SiRisky Strategy Size Google Only

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-cold-zone-five-leaders-now-20260828.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Inspect SiRisky strategy sizing on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          sudo -n bash -lc '
            cd /root/SiRisky
            echo "=== STRATEGY FILES ==="
            find CSV -maxdepth 1 -type f -print | sort
            echo "=== POSITION SIZE ROWS ==="
            grep -RniE "position_sol|HR_NEW_01" CSV 2>/dev/null || true
            echo "=== CURRENT OPEN ==="
            cat CSV/open_positions.csv 2>/dev/null || true
            echo "=== SERVICE ==="
            systemctl is-active sirisky.service
          '
