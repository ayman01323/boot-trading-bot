name: Deploy Cold Zone Live Impact Crosscheck + RPC Fallback Now

on:
  push:
    branches:
      - ops/google-master-menu-cutover-20260827
    paths:
      - .github/workflows/deploy-cold-zone-live-impact-rpc-fallback-now-20260828.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Deploy isolated impact cross-check and second RPC
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle

          LEARN=/home/ayman01323/BOOT/testingbots/learn
          PROD=/root/multichain-learning-bot-v2.2-fast-direct-market
          TARGET="$LEARN/learnerbot/solana_cold_zone_live_execution_guard_patch.py"
          MAIN="$LEARN/learnerbot/__main__.py"
          DROPIN=/etc/systemd/system/learnerbot-learn.service.d/90-cold-zone-rpc-fallback.conf
          SRC_COMMIT=618e4f7c5210bf5095e78bbbdc72b66f763af1a8
          BACKUP="$HOME/.cache/cold-zone-impact-rpc-${GITHUB_RUN_ID}"
          mkdir -p "$BACKUP"

          cp -a "$MAIN" "$BACKUP/main.py"
          if test -f "$TARGET"; then cp -a "$TARGET" "$BACKUP/guard.py"; fi
          if sudo -n test -f "$DROPIN"; then sudo -n cp -a "$DROPIN" "$BACKUP/dropin.conf"; fi

          PROD_MAIN_BEFORE="$(sudo -n sha256sum "$PROD/learnerbot/__main__.py" | awk '{print $1}')"
          PROD_LIVE_BEFORE="$(sudo -n sha256sum "$PROD/learnerbot/solana_live_patch.py" | awk '{print $1}')"

          rollback() {
            rc=$?
            echo "rollback=YES rc=$rc"
            cp -a "$BACKUP/main.py" "$MAIN" || true
            if test -f "$BACKUP/guard.py"; then
              cp -a "$BACKUP/guard.py" "$TARGET" || true
            else
              rm -f "$TARGET" || true
            fi
            if test -f "$BACKUP/dropin.conf"; then
              sudo -n cp -a "$BACKUP/dropin.conf" "$DROPIN" || true
            else
              sudo -n rm -f "$DROPIN" || true
            fi
            sudo -n systemctl daemon-reload || true
            sudo -n systemctl restart learnerbot-learn.service || true
            exit "$rc"
          }
          trap rollback ERR

          # Confirm the new public fallback is healthy before changing runtime.
          python3 - <<'PY'
          import requests
          url='https://solana-rpc.publicnode.com'
          r=requests.post(url,json={'jsonrpc':'2.0','id':1,'method':'getSlot','params':[]},timeout=15)
          r.raise_for_status()
          data=r.json()
          slot=data.get('result') if isinstance(data,dict) else None
          assert isinstance(slot,int) and slot > 0, data
          print('publicnode_rpc_preflight=PASS')
          PY

          curl -fsSL --retry 3 --connect-timeout 10 \
            "https://raw.githubusercontent.com/ayman01323/boot-trading-bot/$SRC_COMMIT/ops/isolated/solana_cold_zone_live_execution_guard_patch.py" \
            -o "$TARGET"
          chmod 0644 "$TARGET"
          chown ayman01323:ayman01323 "$TARGET"

          python3 - "$TARGET" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(encoding='utf-8'); compile(s,str(p),'exec')
          assert 'COLD_ZONE_LIVE_IMPACT_CROSSCHECK_V1' in s
          assert 'MAX_LIVE_ORDER_DERIORATION_BPS = Decimal("100")' in s
          assert '_eff._validate_order = _validate_order_with_cold_zone_crosscheck' in s
          assert 'SELL paths are never relaxed' in s
          print('impact_crosscheck_source=OK')
          PY

          python3 - "$MAIN" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          line='from . import solana_cold_zone_live_execution_guard_patch\n'
          if line not in s:
              rows=s.splitlines(True)
              idx=None
              for i,row in enumerate(rows):
                  if 'solana_cold_zone_entry_relaxation_patch' in row and row.lstrip().startswith(('from ', 'import ')):
                      idx=i+1
              if idx is None:
                  raise SystemExit('cold zone entry relaxation import not found in isolated __main__.py')
              rows.insert(idx,line)
              s=''.join(rows)
              p.write_text(s,encoding='utf-8')
          compile(p.read_text(encoding='utf-8'),str(p),'exec')
          assert 'solana_cold_zone_live_execution_guard_patch' in p.read_text(encoding='utf-8')
          print('isolated_import=BASE_ENTRY_THEN_LIVE_CROSSCHECK')
          PY

          # Add a second independent RPC endpoint. Existing primary/provider
          # configuration is left untouched; PublicNode is added as failover.
          sudo -n mkdir -p /etc/systemd/system/learnerbot-learn.service.d
          printf '%s\n' \
            '[Service]' \
            'Environment="SOLANA_RPC_FALLBACK_URLS=https://solana-rpc.publicnode.com"' \
            | sudo -n tee "$DROPIN" >/dev/null
          sudo -n chmod 0644 "$DROPIN"
          sudo -n systemctl daemon-reload

          START_EPOCH="$(date +%s)"
          sudo -n systemctl restart learnerbot-learn.service
          sleep 30
          test "$(sudo -n systemctl is-active learnerbot-learn.service)" = active
          test "$(sudo -n systemctl is-active google-learner-cold-zone-relay.service)" = active

          LOG="$(sudo -n journalctl -u learnerbot-learn.service --since "@$START_EPOCH" --no-pager -n 1800)"
          printf '%s\n' "$LOG" | grep -F '[solana-cold-zone-live-guard] installed=true' \
            | grep -F 'reported_price_impact=crosscheck_only' \
            | grep -F 'live_order_deterioration<=100bps' \
            | grep -F 'fee_rent_simulation_reserve=UNCHANGED'
          printf '%s\n' "$LOG" | grep -F '[solana-cold-zone-entry] installed=true' | tail -1
          printf '%s\n' "$LOG" | grep -F '[solana-cold-zone-leaders] installed=true' | grep -F 'leaders_per_user=5'

          # Verify the fallback remains reachable after service restart without
          # printing any potentially secret primary RPC configuration.
          python3 - <<'PY'
          import requests
          url='https://solana-rpc.publicnode.com'
          r=requests.post(url,json={'jsonrpc':'2.0','id':1,'method':'getBalance','params':['6Q58hQsF1SjW6JQ9vFYQp4US9RHyceJbfbQkYzmTX2B1']},timeout=15)
          r.raise_for_status(); data=r.json(); value=((data.get('result') or {}).get('value')) if isinstance(data,dict) else None
          assert isinstance(value,int) and value >= 0, data
          print('second_rpc_getBalance=PASS')
          PY

          PROD_MAIN_AFTER="$(sudo -n sha256sum "$PROD/learnerbot/__main__.py" | awk '{print $1}')"
          PROD_LIVE_AFTER="$(sudo -n sha256sum "$PROD/learnerbot/solana_live_patch.py" | awk '{print $1}')"
          test "$PROD_MAIN_BEFORE" = "$PROD_MAIN_AFTER"
          test "$PROD_LIVE_BEFORE" = "$PROD_LIVE_AFTER"

          trap - ERR
          echo 'cold_zone_live_impact_crosscheck_deploy=SUCCESS'
          echo 'reported_jupiter_price_impact=ADVISORY_ONLY_WHEN_FRESH_EXECUTABLE_PREFLIGHT_PASSED'
          echo 'live_order_vs_preflight_deterioration_hard_cap_bps=100'
          echo 'actual_roundtrip_hard=UNCHANGED'
          echo 'sell_depth_5x_hard=UNCHANGED'
          echo 'fee_rent_signed_simulation_reserve_guards=UNCHANGED'
          echo 'second_rpc=PUBLICNODE_ADDED'
          echo 'rpc_failover_endpoint_count=AT_LEAST_2'
          echo 'cold_zone_relay=active'
          echo 'production_files_changed=NO'
