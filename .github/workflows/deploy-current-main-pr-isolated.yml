name: Deploy Current Main PR Isolated

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/deploy-current-main.trigger'

permissions:
  actions: write
  contents: write

concurrency:
  group: boot-vps-current-main-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Clear stale BOOT VPS work
    if: >-
      github.head_ref == 'agent/deploy-current-main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Best-effort stale queue cleanup
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # AI report recovery must never monopolise the trading VPS while a
          # protected deployment is requested. Cleanup is best-effort only;
          # the restricted VPS wrapper and test suite remain the safety gate.
          for state in in_progress queued; do
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/selfhosted-five-agent-recovery.yml/runs?status=${state}&per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null | while read -r run_id; do
                [[ -n "$run_id" && "$run_id" != "$GITHUB_RUN_ID" ]] || continue
                echo "Cancelling AI recovery run ${run_id} (${state})"
                gh api --method POST -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
              done
          done

          # Cancel only QUEUED stale deploy requests. Never interrupt a deploy
          # already inside the restricted wrapper.
          for workflow in deploy-current-main-direct.yml deploy-current-main-pr-isolated.yml server-ops.yml; do
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=queued&per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null | while read -r run_id; do
                [[ -n "$run_id" && "$run_id" != "$GITHUB_RUN_ID" ]] || continue
                echo "Cancelling queued stale ${workflow} run ${run_id}"
                gh api --method POST -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
              done
          done
          exit 0

  deploy:
    name: Test and deploy exact PR base on VPS
    needs: prepare
    if: >-
      always() &&
      github.head_ref == 'agent/deploy-current-main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Sync AI Council runtime credentials without logging values
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          target=/var/tmp/ai_council_runtime.env
          tmp="$(mktemp /var/tmp/.ai-council-runtime.XXXXXX)"
          TMP="$tmp" python3 - <<'PY'
          import json, os, pathlib
          keys = (
              'OPENAI_API_KEY', 'GEMINI_API_KEY', 'ANTHROPIC_API_KEY',
              'DEEPSEEK_API_KEY', 'XAI_API_KEY', 'KIMI_API_KEY', 'MOONSHOT_API_KEY',
              'COPILOT_GITHUB_TOKEN', 'COPILOT_ASSIGN_TOKEN',
          )
          lines=[]
          for key in keys:
              value=str(os.environ.get(key) or '').strip()
              if value:
                  lines.append(f'{key}={json.dumps(value)}')
          pathlib.Path(os.environ['TMP']).write_text('\n'.join(lines)+('\n' if lines else ''),encoding='utf-8')
          PY
          chmod 600 "$tmp"
          mv -f "$tmp" "$target"
          python3 - "$target" <<'PY'
          from pathlib import Path
          import stat,sys
          p=Path(sys.argv[1])
          names={line.split('=',1)[0] for line in p.read_text(encoding='utf-8',errors='replace').splitlines() if '=' in line}
          print('AI Council runtime credentials: ' + ', '.join([
              'GPT=' + ('present' if 'OPENAI_API_KEY' in names else 'missing'),
              'Gemini=' + ('present' if 'GEMINI_API_KEY' in names else 'missing'),
              'Claude=' + ('present' if 'ANTHROPIC_API_KEY' in names else 'missing'),
              'DeepSeek=' + ('present' if 'DEEPSEEK_API_KEY' in names else 'missing'),
              'Grok=' + ('present' if 'XAI_API_KEY' in names else 'missing'),
              'Kimi=' + ('present' if {'KIMI_API_KEY','MOONSHOT_API_KEY'} & names else 'missing'),
              'Copilot=' + ('present' if {'COPILOT_GITHUB_TOKEN','COPILOT_ASSIGN_TOKEN'} & names else 'missing'),
          ]))
          print('runtime_file_mode=' + oct(stat.S_IMODE(p.stat().st_mode)))
          PY

      - name: Route repository GitHub SSH through port 443 when writable
        shell: bash
        run: |
          set -euo pipefail
          repo=/root/multichain-learning-bot-v2.2-fast-direct-market
          if [[ -w "$repo/.git/config" ]]; then
            git -C "$repo" remote set-url origin ssh://git@ssh.github.com:443/ayman01323/boot-trading-bot.git
            echo 'VPS repository origin routed through ssh.github.com:443.'
          else
            echo 'Runner cannot directly rewrite root-owned git config; restricted deploy wrapper will use the existing origin.'
          fi

      - name: Deploy through restricted root wrapper
        id: deploy
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/deploy-boot-trading-bot "${TARGET_SHA}" 2>&1 | tee /tmp/boot-isolated-deploy-output.txt
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish server status and isolated diagnostic
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
        run: |
          set +e
          sudo /usr/local/sbin/status-boot-trading-bot > /tmp/boot-isolated-status.txt 2>&1 || true
          {
            echo "requested_sha=${TARGET_SHA}"
            echo "deploy_outcome=${DEPLOY_OUTCOME:-unknown}"
            echo "deploy_exit=${DEPLOY_EXIT:-unknown}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '=== SERVER STATUS ==='
            cat /tmp/boot-isolated-status.txt
            echo
            echo '=== DEPLOY OUTPUT (tail) ==='
            tail -n 160 /tmp/boot-isolated-deploy-output.txt 2>/dev/null || true
          } > /tmp/boot-isolated-deploy.txt

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-isolated-deploy.txt"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.read().strip() if False else sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/boot-isolated-deploy.txt)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/boot-isolated-put.json
          import json,sys
          p={'message':'Update isolated VPS deployment diagnostic','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: p['sha']=sys.argv[2]
          print(json.dumps(p))
          PY
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" --data-binary @/tmp/boot-isolated-put.json >/dev/null

          if [[ "${DEPLOY_OUTCOME:-}" != success || "${DEPLOY_EXIT:-}" != 0 ]]; then
            exit 1
          fi
