name: Deploy Learner NewPoll45 Hotfix

on:
  push:
    branches: [fix/solana-aug17-canary-restore]
    paths:
      - '.github/workflows/deploy-learner-newpoll45-hotfix.yml'
      - 'learnerbot/telegram_learner_position_update_patch.py'
      - 'learnerbot/telegram_order_usd_patch.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-learner-newpoll45-hotfix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Install scoped learner presentation files
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"

          target=/home/ayman01323/BOOT/testingbots/learn
          test -d "$target"
          test -f "$target/KNOWN_GOOD_SNAPSHOT.txt"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --quiet --depth 1 --branch fix/solana-aug17-canary-restore \
            https://github.com/ayman01323/boot-trading-bot.git "$tmp/repo"

          # Copy only presentation files. Never rsync/delete this LIVE runtime.
          install -m 0644 \
            "$tmp/repo/learnerbot/telegram_learner_position_update_patch.py" \
            "$target/learnerbot/telegram_learner_position_update_patch.py"
          install -m 0644 \
            "$tmp/repo/learnerbot/telegram_order_usd_patch.py" \
            "$target/learnerbot/telegram_order_usd_patch.py"

          TARGET="$target" python3 - <<'PY'
          import os
          from pathlib import Path
          target=Path(os.environ['TARGET'])

          # Re-assert the isolated-only presentation imports after the audited
          # runtime integrity gate. They do not replace trading hooks.
          p=target/'learnerbot'/'final_runtime_integrity_patch.py'
          text=p.read_text(encoding='utf-8').rstrip()
          markers=[
              'from . import telegram_learner_only_menu_patch  # noqa: E402,F401',
              'from . import telegram_learner_identity_patch  # noqa: E402,F401',
              'from . import telegram_learner_position_update_patch  # noqa: E402,F401',
          ]
          for marker in markers:
              if marker not in text:
                  text += '\n' + marker
          p.write_text(text + '\n', encoding='utf-8')

          # A prior unsafe broad copy can restore this production-only migration.
          # The isolated learner has no Polygon chain; leave Solana execution and
          # position monitoring untouched while disabling only that startup import.
          main=target/'learnerbot'/'__main__.py'
          source=main.read_text(encoding='utf-8')
          active='from . import polygon_live_enable_migration  # noqa: F401'
          disabled='# ISOLATED GOOGLE LEARNER: production-only Polygon LIVE migration disabled; Solana positions/exits remain active.'
          if active in source:
              source=source.replace(active,disabled,1)
              main.write_text(source,encoding='utf-8')
              print('polygon_live_enable_migration_disabled=YES')
          elif disabled in source:
              print('polygon_live_enable_migration_disabled=ALREADY')
          else:
              raise SystemExit('Expected isolated Polygon migration state not found')

          # Compile in memory only. The server has legacy root-owned __pycache__;
          # deployment must never need to write or chown generated bytecode.
          for path in [
              target/'learnerbot'/'telegram_learner_position_update_patch.py',
              target/'learnerbot'/'telegram_order_usd_patch.py',
              target/'learnerbot'/'final_runtime_integrity_patch.py',
              target/'learnerbot'/'__main__.py',
          ]:
              compile(path.read_text(encoding='utf-8'),str(path),'exec')
          print('source_compile_in_memory=PASS')
          PY

          grep -Fq 'LEARNER POSITION UPDATE — NewPoll45' \
            "$target/learnerbot/telegram_learner_position_update_patch.py"
          grep -Fq 'DEX Viewer' \
            "$target/learnerbot/telegram_learner_position_update_patch.py"
          grep -Fq 'cli_mod = sys.modules.get("learnerbot.cli")' \
            "$target/learnerbot/telegram_learner_position_update_patch.py"
          grep -Fq 'from . import telegram_learner_position_update_patch' \
            "$target/learnerbot/final_runtime_integrity_patch.py"

          echo "newpoll45_source_installed=YES"
          echo "wallet_runtime_data_touched=NO"
          echo "csv_settings_touched=NO"
          echo "position_database_touched=NO"
          echo "production_service_touched=NO"

      - name: Guarded restart and runtime proof
        shell: bash
        run: |
          set -euo pipefail
          target=/home/ayman01323/BOOT/testingbots/learn
          service=learnerbot-learn.service

          if ! systemctl is-active --quiet "$service"; then
            echo "learner_service_active=NO"
            echo "restart=SKIPPED_NOT_STARTING_STOPPED_LEARNER"
            exit 1
          fi

          safe=0
          for _ in $(seq 1 12); do
            inflight="$(TARGET="$target" python3 - <<'PY'
          import os,sqlite3,time
          from pathlib import Path
          db=Path(os.environ['TARGET'])/'data'/'solana_sibot.sqlite3'
          if not db.exists(): print(0); raise SystemExit
          try:
              con=sqlite3.connect(db,timeout=2)
              exists=con.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='live_execution_attempts'").fetchone()
              n=0 if not exists else con.execute(
                  "SELECT COUNT(*) FROM live_execution_attempts WHERE status='CLAIMED' AND updated_at>=?",
                  (int(time.time())-120,),
              ).fetchone()[0]
              con.close(); print(int(n or 0))
          except Exception:
              print(1)
          PY
          )"
            if [[ "$inflight" = "0" ]]; then safe=1; break; fi
            echo "fresh_execution_attempt_inflight=$inflight"
            sleep 5
          done
          [[ "$safe" = "1" ]]

          restart_epoch="$(date +%s)"
          sudo -n systemctl restart "$service"
          sleep 12
          test "$(systemctl is-active "$service")" = active
          pid1="$(systemctl show "$service" -p MainPID --value)"
          test -n "$pid1"; test "$pid1" != 0
          sleep 12
          test "$(systemctl is-active "$service")" = active
          pid2="$(systemctl show "$service" -p MainPID --value)"
          test "$pid2" = "$pid1"

          log="$(sudo -n journalctl -u "$service" --since "@${restart_epoch}" --no-pager)"
          printf '%s\n' "$log" | grep -F '[final-runtime-integrity] OK'
          printf '%s\n' "$log" | grep -F '[learner-newpoll45] reporting=45s safety_monitor=unchanged pool=dexscreener usd=enabled'
          if printf '%s\n' "$log" | grep -Eq 'Traceback \(most recent call last\)|Main process exited|Failed with result'; then
            echo 'fatal_restart_marker=YES' >&2
            exit 7
          fi

          TARGET="$target" python3 - <<'PY'
          import os,sqlite3
          from pathlib import Path
          db=Path(os.environ['TARGET'])/'data'/'solana_sibot.sqlite3'
          con=sqlite3.connect(db,timeout=2)
          rows=con.execute(
              "SELECT position_id,mint FROM positions WHERE status='OPEN' AND mode='LIVE' ORDER BY entry_ts,position_id"
          ).fetchall()
          con.close()
          print('open_live_positions='+str(len(rows)))
          for i,row in enumerate(rows,1):
              print(f'open_position_{i}_of_{len(rows)}='+str(row[0])+' mint='+str(row[1]))
          PY

          echo "stable_main_pid=$pid2"
          echo "newpoll45_report_seconds=45"
          echo "safety_exit_monitor_changed=NO"
          echo "learner_runtime=HEALTHY"
          echo "production_service_touched=NO"
