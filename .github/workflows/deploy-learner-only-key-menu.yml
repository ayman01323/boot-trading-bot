name: Deploy Learner-Only Key Menu

on:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-learner-only-key-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 8
    steps:
      - name: Install learner-only wallet and LIVE controls on Google
        shell: bash
        env:
          SOURCE_SHA: e32cee435385bb37f3d34cef983d71b4201edc00
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = 'botgoogle'
          ROOT=/home/ayman01323/BOOT/testingbots/learn
          test -d "$ROOT/learnerbot"

          WORK="$HOME/.cache/learner-only-key-menu-${GITHUB_RUN_ID}"
          mkdir -p "$WORK"
          SRC="$WORK/telegram_google_learner_launcher_patch.py"
          curl -fsSL "https://raw.githubusercontent.com/ayman01323/boot-trading-bot/${SOURCE_SHA}/learnerbot/telegram_google_learner_launcher_patch.py" -o "$SRC"
          grep -q 'START LEARNER TRADING' "$SRC"
          grep -q 'learner_new_entries_enabled' "$SRC"
          grep -q 'learnerbot-learn.service' "$SRC"
          python3 -m py_compile "$SRC"

          SCRIPT="$WORK/install.sh"
          RESULT="$WORK/result.txt"
          UNIT="$WORK/learner-only-key-menu-${GITHUB_RUN_ID}.service"

          cat > "$SCRIPT" <<'ROOTSCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT=/home/ayman01323/BOOT/testingbots/learn
          PROD=/root/multichain-learning-bot-v2.2-fast-direct-market
          SRC=__SRC__
          RESULT=__RESULT__
          exec > >(tee "$RESULT") 2>&1
          test -d "$ROOT/learnerbot"
          test -x "$PROD/.venv/bin/python"

          # Stop any previous failed isolated test before changing it.
          systemctl stop learnerbot-learn.service 2>/dev/null || true

          for target in \
            /root/multichain-learning-bot-v2.2-fast-direct-market/learnerbot/telegram_google_learner_launcher_patch.py \
            /home/ayman01323/ClaudeServer/TestBots/boot-trading-bot/learnerbot/telegram_google_learner_launcher_patch.py; do
            if [[ -d "$(dirname "$target")" ]]; then
              install -m 0644 "$SRC" "$target"
              grep -q 'START LEARNER TRADING' "$target"
            fi
          done
          "$PROD/.venv/bin/python" -m py_compile "$PROD/learnerbot/telegram_google_learner_launcher_patch.py"

          python3 - "$ROOT/learnerbot/solana_live_patch.py" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          marker = 'learner_new_entries_enabled'
          if marker not in s:
              pat = re.compile(r'(?m)^(\s*)if event\[(?:"action"|\'action\')\] == (?:"BUY"|\'BUY\'):\s*$')
              m = pat.search(s)
              if not m:
                  raise SystemExit('REFUSED: expected Solana LIVE BUY branch not found')
              indent = m.group(1)
              insertion = (
                  m.group(0) + '\n'
                  + indent + '    if not user_bool(app.csv_dir, tid, _sol.SOLANA_CHAIN_ID, "learner_new_entries_enabled", False):\n'
                  + indent + '        actions.append({"telegram_id": tid, "action": "SKIP", "reason": "LEARNER new entries OFF; exit monitoring remains active"})\n'
                  + indent + '        continue'
              )
              s = s[:m.start()] + insertion + s[m.end():]
              if not re.search(r'from \.user_registry import[^\n]*\buser_bool\b', s):
                  simple = 'from .user_registry import all_users, set_user_setting, user_setting'
                  if simple in s:
                      s = s.replace(simple, 'from .user_registry import all_users, set_user_setting, user_bool, user_setting', 1)
                  else:
                      raise SystemExit('REFUSED: user_bool import form not recognised')
              p.write_text(s, encoding='utf-8')
              print('learner_entry_gate=APPLIED')
          else:
              print('learner_entry_gate=ALREADY_APPLIED')
          PY
          grep -q 'learner_new_entries_enabled' "$ROOT/learnerbot/solana_live_patch.py"
          "$PROD/.venv/bin/python" -m py_compile "$ROOT/learnerbot/solana_live_patch.py"

          cat > /etc/systemd/system/learnerbot-learn.service <<SERVICE
          [Unit]
          Description=Isolated Google Solana Learner Runtime
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=$ROOT
          Environment=PYTHONUNBUFFERED=1
          Environment=PYTHONPATH=$ROOT
          Environment=CSV_DIR=$ROOT/CSVbot
          Environment=DATA_DIR=$ROOT/data
          Environment=TELEGRAM_BOT_TOKEN=
          Environment=TELEGRAM_CHAT_IDS=
          ExecStart=$PROD/.venv/bin/python -m learnerbot run --sleep 30
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=30

          [Install]
          WantedBy=multi-user.target
          SERVICE
          chmod 0644 /etc/systemd/system/learnerbot-learn.service
          systemctl daemon-reload
          systemctl enable learnerbot-learn.service >/dev/null
          systemctl restart learnerbot-learn.service
          sleep 10
          IR1=$(systemctl show learnerbot-learn.service -p NRestarts --value)
          STATE1=$(systemctl is-active learnerbot-learn.service || true)
          sleep 8
          IR2=$(systemctl show learnerbot-learn.service -p NRestarts --value)
          STATE2=$(systemctl is-active learnerbot-learn.service || true)
          echo "isolated_runtime_1=$STATE1"
          echo "isolated_runtime_2=$STATE2"
          echo "isolated_restarts_1=$IR1"
          echo "isolated_restarts_2=$IR2"
          echo '=== isolated learner diagnostic ==='
          journalctl -u learnerbot-learn.service -n 120 --no-pager -o cat \
            | sed -E 's#https?://[^ ]+#URL_REDACTED#g' \
            | sed -E 's#(TELEGRAM_BOT_TOKEN|PRIVATE_KEY|SECRET|API_KEY)=([^[:space:]]+)#\1=REDACTED#g' \
            | grep -E 'Traceback|Error|Exception|ModuleNotFound|ImportError|NameError|Permission|Main process exited|Failed with result|No module|cannot import|not found|REFUSED' || true
          if [[ "$STATE2" != active || "$IR1" != "$IR2" || ! -f "$ROOT/data/solana_sibot.sqlite3" ]]; then
            echo 'isolated_runtime_stable=NO'
            systemctl stop learnerbot-learn.service || true
            exit 42
          fi
          echo 'isolated_runtime_stable=YES'

          systemctl restart learnerbot.service
          sleep 12
          MR1=$(systemctl show learnerbot.service -p NRestarts --value)
          MSTATE1=$(systemctl is-active learnerbot.service || true)
          sleep 8
          MR2=$(systemctl show learnerbot.service -p NRestarts --value)
          MSTATE2=$(systemctl is-active learnerbot.service || true)
          echo "master_menu_runtime_1=$MSTATE1"
          echo "master_menu_runtime_2=$MSTATE2"
          echo "master_menu_restarts_1=$MR1"
          echo "master_menu_restarts_2=$MR2"
          if [[ "$MSTATE2" != active || "$MR1" != "$MR2" ]]; then
            echo 'master_menu_stable=NO'
            exit 43
          fi
          echo 'master_menu_stable=YES'
          ROOTSCRIPT

          sed -i "s#__SRC__#$SRC#g; s#__RESULT__#$RESULT#g" "$SCRIPT"
          chmod 755 "$SCRIPT"
          cat > "$UNIT" <<EOF
          [Unit]
          Description=Install learner-only key menu on Google MASTER Telegram
          After=network.target
          [Service]
          Type=oneshot
          ExecStart=/bin/bash $SCRIPT
          EOF
          chmod 644 "$UNIT"
          NAME="$(basename "$UNIT")"

          echo "elevation_unit=$NAME"
          sudo -n /usr/bin/systemctl link "$UNIT" 2>&1
          sudo -n /usr/bin/systemctl daemon-reload 2>&1
          START_RC=0
          sudo -n /usr/bin/systemctl start "$NAME" 2>&1 || START_RC=$?
          echo "elevated_start_rc=$START_RC"
          cat "$RESULT" 2>/dev/null || true
          if [[ "$START_RC" -ne 0 ]]; then
            exit "$START_RC"
          fi
          grep -q '^isolated_runtime_stable=YES$' "$RESULT"
          grep -q '^master_menu_stable=YES$' "$RESULT"

          sudo -n /usr/bin/systemctl disable "$NAME" >/dev/null 2>&1 || true
          rm -f "$UNIT" "$SCRIPT" "$RESULT"
          sudo -n /usr/bin/systemctl daemon-reload
          echo 'learner_live_telegram_controls=LIVE'
