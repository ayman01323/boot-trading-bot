name: Deploy Learner-Only Key Menu

on:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/deploy-learner-only-key-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Deploy learner-only Telegram key import
        shell: bash
        env:
          PATCH_SHA: 5b810e681fcbd6efb5524b8fe09d9c312776c1d5
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          ROOT=/home/ayman01323/BOOT/testingbots/learn
          PROD=/root/multichain-learning-bot-v2.2-fast-direct-market
          test -d "$ROOT"

          WORK="$HOME/.cache/learner-key-import-${GITHUB_RUN_ID}"
          mkdir -p "$WORK"
          SRC="$WORK/telegram_google_learner_launcher_patch.py"
          curl -fsSL "https://raw.githubusercontent.com/ayman01323/boot-trading-bot/${PATCH_SHA}/learnerbot/telegram_google_learner_launcher_patch.py" -o "$SRC"
          grep -q 'GOOGLE LEARNER ONLY' "$SRC"
          grep -q 'save_private_key' "$SRC"
          python3 -m py_compile "$SRC"

          SCRIPT="$WORK/install.sh"
          RESULT="$WORK/result.txt"
          UNIT="$WORK/learner-key-import-${GITHUB_RUN_ID}.service"
          cat > "$SCRIPT" <<'ROOTSCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT=/home/ayman01323/BOOT/testingbots/learn
          PROD=/root/multichain-learning-bot-v2.2-fast-direct-market
          SRC=__SRC__
          RESULT=__RESULT__
          exec > >(tee "$RESULT") 2>&1

          test -x "$PROD/.venv/bin/python"
          test -d "$ROOT/CSVbot"
          test -d "$ROOT/data"

          # Do not run a second Telegram poller.
          systemctl disable --now learnerbot-learn.service >/dev/null 2>&1 || true

          install -m 0644 "$SRC" "$PROD/learnerbot/telegram_google_learner_launcher_patch.py"
          "$PROD/.venv/bin/python" -m py_compile "$PROD/learnerbot/telegram_google_learner_launcher_patch.py"

          MAIN="$PROD/learnerbot/__main__.py"
          cp -a "$MAIN" "$MAIN.before_google_learner_import"
          if ! grep -q '^from \. import telegram_google_learner_launcher_patch' "$MAIN"; then
            python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          needle='from .cli import main\n'
          if needle not in s:
              raise SystemExit('REFUSED: cli import anchor not found')
          line='# Final single-poller bridge: multi-user private keys go only to the isolated Google learner store.\nfrom . import telegram_google_learner_launcher_patch  # noqa: F401\n'
          p.write_text(s.replace(needle, line+needle, 1), encoding='utf-8')
          PY
          fi
          "$PROD/.venv/bin/python" -m py_compile "$MAIN"
          grep -q '^from \. import telegram_google_learner_launcher_patch' "$MAIN"

          systemctl restart learnerbot.service
          sleep 12
          S1=$(systemctl is-active learnerbot.service || true)
          R1=$(systemctl show learnerbot.service -p NRestarts --value)
          sleep 8
          S2=$(systemctl is-active learnerbot.service || true)
          R2=$(systemctl show learnerbot.service -p NRestarts --value)
          echo "telegram_runtime_1=$S1"
          echo "telegram_runtime_2=$S2"
          echo "telegram_restarts_1=$R1"
          echo "telegram_restarts_2=$R2"
          echo '=== recent safety check ==='
          journalctl -u learnerbot.service --since '-30 seconds' --no-pager -o cat \
            | grep -E 'Traceback|HTTP 409|ImportError|ModuleNotFoundError|Main process exited|PermissionError' || true

          test "$S2" = active
          test "$R1" = "$R2"
          ! journalctl -u learnerbot.service --since '-30 seconds' --no-pager -o cat | grep -q 'HTTP 409'
          ! journalctl -u learnerbot.service --since '-30 seconds' --no-pager -o cat | grep -q 'Main process exited'
          echo 'learner_multiuser_key_import=LIVE'
          echo 'second_telegram_poller=OFF'
          echo 'learner_trading_auto_enabled=NO'
          ROOTSCRIPT

          sed -i "s#__SRC__#$SRC#g; s#__RESULT__#$RESULT#g" "$SCRIPT"
          chmod 755 "$SCRIPT"
          cat > "$UNIT" <<EOF
          [Unit]
          Description=Deploy learner-only Telegram key import
          After=network.target
          [Service]
          Type=oneshot
          ExecStart=/bin/bash $SCRIPT
          EOF
          chmod 644 "$UNIT"
          NAME="$(basename "$UNIT")"
          sudo -n /usr/bin/systemctl link "$UNIT" >/dev/null
          sudo -n /usr/bin/systemctl daemon-reload
          RC=0
          sudo -n /usr/bin/systemctl start "$NAME" || RC=$?
          cat "$RESULT" 2>/dev/null || true
          exit "$RC"
