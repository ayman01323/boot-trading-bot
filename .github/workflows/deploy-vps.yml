name: Deploy BOOT to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boot-vps-deploy
  cancel-in-progress: true

jobs:
  probe:
    name: Record deployment request
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'agent/deploy-current-main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Publish waiting-for-runner marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/boot-deploy-probe.txt <<EOF
          requested_sha=${TARGET_SHA}
          state=waiting_for_self_hosted_runner
          run_id=${GITHUB_RUN_ID}
          utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-probe.txt"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/boot-deploy-probe.txt)"
          if [[ -n "$existing_sha" ]]; then
            payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({"message":"Update VPS deployment probe","content":sys.argv[1],"sha":sys.argv[2],"branch":"server-diagnostics"}))
          PY
          )"
          else
            payload="$(python3 - "$encoded" <<'PY'
          import json,sys
          print(json.dumps({"message":"Create VPS deployment probe","content":sys.argv[1],"branch":"server-diagnostics"}))
          PY
          )"
          fi
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$payload" >/dev/null

  deploy:
    name: Deploy exact main commit
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'agent/deploy-current-main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: probe
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Deploy through restricted root wrapper
        id: deploy
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/deploy-boot-trading-bot "${TARGET_SHA}" 2>&1 | tee /tmp/boot-deploy-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Server status
        id: status
        if: always()
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/status-boot-trading-bot 2>&1 | tee /tmp/boot-server-status.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build and publish machine-readable deployment attestation
        id: attestation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
          STATUS_EXIT: ${{ steps.status.outputs.exit_code }}
        run: |
          set +e
          # Poll the status wrapper until Telegram command verification appears. The
          # AI-ops watcher starts earlier during service startup and may scroll out of
          # this bounded status snapshot, so startup evidence is also retained from
          # the deploy wrapper output below.
          cp /tmp/boot-server-status.txt /tmp/boot-attest-status.txt 2>/dev/null || true
          for _ in 1 2 3 4 5 6; do
            sudo /usr/local/sbin/status-boot-trading-bot > /tmp/boot-attest-status.txt 2>&1 || true
            if grep -q '\[telegram-ai-ops-commands\] verified=' /tmp/boot-attest-status.txt; then
              break
            fi
            sleep 3
          done

          python3 - "$TARGET_SHA" "${DEPLOY_OUTCOME:-unknown}" "${DEPLOY_EXIT:-}" "${STATUS_EXIT:-}" <<'PY' > /tmp/boot-deploy-attestation.json
          import json,re,sys,time
          expected, deploy_outcome, deploy_exit, status_exit = sys.argv[1:5]
          def read(path):
              try:
                  return open(path,encoding='utf-8',errors='replace').read()
              except Exception:
                  return ''
          status_text=read('/tmp/boot-attest-status.txt')
          deploy_text=read('/tmp/boot-deploy-output.txt')
          evidence_text=deploy_text+'\n'+status_text
          sha_match_obj=re.search(r'(?m)^sha:\s*([0-9a-fA-F]{40})\s*$',status_text)
          deployed=(sha_match_obj.group(1).lower() if sha_match_obj else '')
          service_ok=bool(re.search(r'Active:\s+active \(running\)',status_text,re.I))
          watcher_in_status='[ai-ops-watcher] started' in status_text
          watcher_in_deploy='[ai-ops-watcher] started' in deploy_text
          watcher_ok=watcher_in_status or watcher_in_deploy
          markers=re.findall(r'\[telegram-ai-ops-commands\]\s+verified=(true|false)\s+masters=(\d+)\s+expected=([^\s]+)\s+missing=([^\s]+)',evidence_text,re.I)
          telegram_verified=False
          master_count=0
          expected_commands=[]
          missing='marker-not-found'
          if markers:
              verified, count, commands, missing=markers[-1]
              telegram_verified=verified.lower()=='true'
              master_count=int(count)
              expected_commands=[x for x in commands.split(',') if x]
          required={'aiaudit','aidecision','aistrategy','aiupdates'}
          command_code_ok=required.issubset(set(expected_commands))
          sha_ok=(deployed==expected.lower())
          deployment_ok=(deploy_outcome=='success' and str(deploy_exit)=='0' and sha_ok and service_ok and watcher_ok)
          full_ok=(deployment_ok and command_code_ok and telegram_verified and master_count>0)
          watcher_source=('status+deploy' if watcher_in_status and watcher_in_deploy else ('status' if watcher_in_status else ('deploy-output' if watcher_in_deploy else 'not-found')))
          print(json.dumps({
              'schema_version':3,
              'generated_at':int(time.time()),
              'expected_sha':expected,
              'deployed_sha':deployed,
              'sha_match':sha_ok,
              'deploy_outcome':deploy_outcome,
              'deploy_exit':deploy_exit,
              'status_exit':status_exit,
              'service_status_ok':service_ok,
              'ai_ops_watcher_started':watcher_ok,
              'ai_ops_watcher_evidence_source':watcher_source,
              'ai_master_commands_code_ok':command_code_ok,
              'telegram_command_verification':{
                  'attempted':bool(markers),
                  'verified':telegram_verified,
                  'master_count':master_count,
                  'expected_commands':expected_commands,
                  'missing':missing,
                  'detail':'verified via running service getMyCommands startup self-check' if telegram_verified else 'startup verification marker missing or reported failure',
              },
              'deployment_attested':deployment_ok,
              'full_telegram_attestation':full_ok,
              'workflow_run_id':__import__('os').environ.get('GITHUB_RUN_ID',''),
              'workflow_event':__import__('os').environ.get('GITHUB_EVENT_NAME',''),
          },indent=2,sort_keys=True))
          PY
          attest_rc="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/boot-deploy-attestation.json',encoding='utf-8'))
          print(0 if d.get('full_telegram_attestation') else (1 if d.get('deployment_attested') else 2))
          PY
          )"
          python3 - "$attest_rc" <<'PY'
          import json,sys
          p='/tmp/boot-deploy-attestation.json'
          d=json.load(open(p,encoding='utf-8'))
          d['attestation_exit']=int(sys.argv[1])
          open(p,'w',encoding='utf-8').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-deploy-attestation.json"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/boot-deploy-attestation.json)"
          if [[ -n "$existing_sha" ]]; then
            payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({"message":"Update VPS deployment attestation","content":sys.argv[1],"sha":sys.argv[2],"branch":"server-diagnostics"}))
          PY
          )"
          else
            payload="$(python3 - "$encoded" <<'PY'
          import json,sys
          print(json.dumps({"message":"Create VPS deployment attestation","content":sys.argv[1],"branch":"server-diagnostics"}))
          PY
          )"
          fi
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$payload" >/dev/null
          echo "attestation_exit=${attest_rc}" >> "$GITHUB_OUTPUT"
          cat /tmp/boot-deploy-attestation.json
          exit 0

      - name: Publish private deployment diagnostic
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "requested_sha=${TARGET_SHA}"
            echo "deploy_outcome=${DEPLOY_OUTCOME:-unknown}"
            echo "deploy_exit=${DEPLOY_EXIT:-unknown}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "=== DEPLOY OUTPUT (tail) ==="
            tail -n 120 /tmp/boot-deploy-output.txt 2>/dev/null || true
            echo
            echo "=== SERVER STATUS ==="
            cat /tmp/boot-attest-status.txt 2>/dev/null || cat /tmp/boot-server-status.txt 2>/dev/null || true
          } > /tmp/boot-deploy-diagnostic.txt

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-deploy.txt"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/boot-deploy-diagnostic.txt)"
          if [[ -n "$existing_sha" ]]; then
            payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({"message":"Update VPS deployment diagnostic","content":sys.argv[1],"sha":sys.argv[2],"branch":"server-diagnostics"}))
          PY
          )"
          else
            payload="$(python3 - "$encoded" <<'PY'
          import json,sys
          print(json.dumps({"message":"Create VPS deployment diagnostic","content":sys.argv[1],"branch":"server-diagnostics"}))
          PY
          )"
          fi
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$payload" >/dev/null

      - name: Mark probe finished
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
        run: |
          set -euo pipefail
          cat > /tmp/boot-deploy-probe.txt <<EOF
          requested_sha=${TARGET_SHA}
          state=self_hosted_runner_finished
          deploy_outcome=${DEPLOY_OUTCOME:-unknown}
          deploy_exit=${DEPLOY_EXIT:-unknown}
          run_id=${GITHUB_RUN_ID}
          utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-probe.txt"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics")"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          encoded="$(base64 -w0 /tmp/boot-deploy-probe.txt)"
          payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({"message":"Finish VPS deployment probe","content":sys.argv[1],"sha":sys.argv[2],"branch":"server-diagnostics"}))
          PY
          )"
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$payload" >/dev/null
