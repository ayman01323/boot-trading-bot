name: Deploy BOOT to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'testingbots/grok_known_assets_bot/**'
      - '.github/workflows/deploy-grok-known-assets-testing-bot.yml'
      - '.github/workflows/test-grok-known-assets-research.yml'
      - '.github/workflows/deploy-vps.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boot-vps-deploy
  cancel-in-progress: false

jobs:
  probe:
    name: Record deployment request
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'agent/deploy-current-main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Publish waiting-for-runner marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/boot-deploy-probe.txt <<EOF
          requested_sha=${TARGET_SHA}
          state=waiting_for_self_hosted_runner
          run_id=${GITHUB_RUN_ID}
          utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-probe.txt"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/boot-deploy-probe.txt)"
          if [[ -n "$existing_sha" ]]; then
            payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({"message":"Update VPS deployment probe","content":sys.argv[1],"sha":sys.argv[2],"branch":"server-diagnostics"}))
          PY
          )"
          else
            payload="$(python3 - "$encoded" <<'PY'
          import json,sys
          print(json.dumps({"message":"Create VPS deployment probe","content":sys.argv[1],"branch":"server-diagnostics"}))
          PY
          )"
          fi
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$payload" >/dev/null

  deploy:
    name: Deploy exact main commit
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'agent/deploy-current-main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: probe
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Deploy through restricted root wrapper
        id: deploy
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/deploy-boot-trading-bot "${TARGET_SHA}" 2>&1 | tee /tmp/boot-deploy-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Server status
        id: status
        if: always()
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/status-boot-trading-bot 2>&1 | tee /tmp/boot-server-status.txt
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build and publish machine-readable deployment attestation
        id: attestation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
          STATUS_EXIT: ${{ steps.status.outputs.exit_code }}
        run: |
          set +e
          # The runner has passwordless access to the restricted status wrapper. Poll it
          # briefly so the restarted Telegram menu has time to register and verify the
          # MASTER command scopes against Telegram's own getMyCommands endpoint.
          cp /tmp/boot-server-status.txt /tmp/boot-attest-status.txt 2>/dev/null || true
          for _ in 1 2 3 4 5 6; do
            sudo /usr/local/sbin/status-boot-trading-bot > /tmp/boot-attest-status.txt 2>&1 || true
            if grep -q '\[telegram-ai-ops-commands\] verified=' /tmp/boot-attest-status.txt; then
              break
            fi
            sleep 3
          done

          python3 - "$TARGET_SHA" "${DEPLOY_OUTCOME:-unknown}" "${DEPLOY_EXIT:-}" "${STATUS_EXIT:-}" <<'PY' > /tmp/boot-deploy-attestation.json
          import json,re,sys,time
          expected, deploy_outcome, deploy_exit, status_exit = sys.argv[1:5]
          try:
              text=open('/tmp/boot-attest-status.txt',encoding='utf-8',errors='replace').read()
          except Exception:
              text=''
          sha_match_obj=re.search(r'(?m)^sha:\s*([0-9a-fA-F]{40})\s*$',text)
          deployed=(sha_match_obj.group(1).lower() if sha_match_obj else '')
          service_ok=bool(re.search(r'Active:\s+active \(running\)',text,re.I))
          watcher_ok='[ai-ops-watcher] started' in text
          markers=re.findall(r'\[telegram-ai-ops-commands\]\s+verified=(true|false)\s+masters=(\d+)\s+expected=([^\s]+)\s+missing=([^\s]+)',text,re.I)
          telegram_verified=False
          master_count=0
          expected_commands=[]
          missing='marker-not-found'
          if markers:
              verified, count, commands, missing=markers[-1]
              telegram_verified=verified.lower()=='true'
              master_count=int(count)
              expected_commands=[x for x in commands.split(',') if x]
          required={'aiaudit','aidecision','aistrategy','aiupdates'}
          command_code_ok=required.issubset(set(expected_commands))
          sha_ok=(deployed==expected.lower())
          # The watcher marker is an observability hint, not a safe deployment gate:
          # status only contains a short journal tail, so a healthy early-start marker
          # can legitimately scroll out before attestation. Exact SHA + successful
          # deploy + an explicitly running service are the deployment contract.
          deployment_ok=(deploy_outcome=='success' and str(deploy_exit)=='0' and sha_ok and service_ok)
          full_ok=(deployment_ok and command_code_ok and telegram_verified and master_count>0)
          print(json.dumps({
              'schema_version':2,
              'generated_at':int(time.time()),
              'expected_sha':expected,
              'deployed_sha':deployed,
              'sha_match':sha_ok,
              'deploy_outcome':deploy_outcome,
              'deploy_exit':deploy_exit,
              'status_exit':status_exit,
              'service_status_ok':service_ok,
              'ai_ops_watcher_started':watcher_ok,
              'ai_master_commands_code_ok':command_code_ok,
              'telegram_command_verification':{
                  'attempted':bool(markers),
                  'verified':telegram_verified,
                  'master_count':master_count,
                  'expected_commands':expected_commands,
                  'missing':missing,
                  'detail':'verified via running service getMyCommands startup self-check' if telegram_verified else 'startup verification marker missing or reported failure',
              },
              'deployment_attested':deployment_ok,
              'full_telegram_attestation':full_ok,
              'workflow_run_id':__import__('os').environ.get('GITHUB_RUN_ID',''),
              'workflow_event':__import__('os').environ.get('GITHUB_EVENT_NAME',''),
          },indent=2,sort_keys=True))
          PY
          attest_rc="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/boot-deploy-attestation.json',encoding='utf-8'))
          print(0 if d.get('full_telegram_attestation') else (1 if d.get('deployment_attested') else 2))
          PY
          )"
          python3 - "$attest_rc" <<'PY'
          import json,sys
          p='/tmp/boot-deploy-attestation.json'
          d=json.load(open(p,encoding='utf-8'))
          d['attestation_exit']=int(sys.argv[1])
          open(p,'w',encoding='utf-8').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-deploy-attestation.json"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/boot-deploy-attestation.json)"
          if [[ -n "$existing_sha" ]]; then
            payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({"message":"Update VPS deployment attestation","content":sys.argv[1],"sha":sys.argv[2],"branch":"server-diagnostics"}))
          PY
          )"
          else
            payload="$(python3 - "$encoded" <<'PY'
          import json,sys
          print(json.dumps({"message":"Create VPS deployment attestation","content":sys.argv[1],"branch":"server-diagnostics"}))
          PY
          )"
          fi
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$payload" >/dev/null
          echo "attestation_exit=${attest_rc}" >> "$GITHUB_OUTPUT"
          cat /tmp/boot-deploy-attestation.json
          exit 0

      - name: Publish private deployment diagnostic
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "requested_sha=${TARGET_SHA}"
            echo "deploy_outcome=${DEPLOY_OUTCOME:-unknown}"
            echo "deploy_exit=${DEPLOY_EXIT:-unknown}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "=== DEPLOY OUTPUT (tail) ==="
            tail -n 120 /tmp/boot-deploy-output.txt 2>/dev/null || true
            echo
            echo "=== SERVER STATUS ==="
            cat /tmp/boot-attest-status.txt 2>/dev/null || cat /tmp/boot-server-status.txt 2>/dev/null || true
          } > /tmp/boot-deploy-diagnostic.txt

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-deploy.txt"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/boot-deploy-diagnostic.txt)"
          if [[ -n "$existing_sha" ]]; then
            payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({"message":"Update VPS deployment diagnostic","content":sys.argv[1],"sha":sys.argv[2],"branch":"server-diagnostics"}))
          PY
          )"
          else
            payload="$(python3 - "$encoded" <<'PY'
          import json,sys
          print(json.dumps({"message":"Create VPS deployment diagnostic","content":sys.argv[1],"branch":"server-diagnostics"}))
          PY
          )"
          fi
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$payload" >/dev/null

      - name: Mark probe finished
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
        run: |
          set -euo pipefail
          cat > /tmp/boot-deploy-probe.txt <<EOF
          requested_sha=${TARGET_SHA}
          state=self_hosted_runner_finished
          deploy_outcome=${DEPLOY_OUTCOME:-unknown}
          deploy_exit=${DEPLOY_EXIT:-unknown}
          run_id=${GITHUB_RUN_ID}
          utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-probe.txt"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics")"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          encoded="$(base64 -w0 /tmp/boot-deploy-probe.txt)"
          payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({"message":"Finish VPS deployment probe","content":sys.argv[1],"sha":sys.argv[2],"branch":"server-diagnostics"}))
          PY
          )"
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$payload" >/dev/null

  claude_inspect:
    name: Publish queued Claude VPS inspect proof
    needs: deploy
    if: >-
      always() && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - name: Resolve fresh inspect-only request
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_review_file() {
            local path="$1" out="$2"
            local api body
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
            body="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=ai-reviews" || true)"
            [[ -n "$body" ]] || return 1
            BODY="$body" OUT="$out" python3 - <<'PY'
          import base64,json,os
          d=json.loads(os.environ['BODY'])
          raw=base64.b64decode((d.get('content') or '').replace('\n',''))
          open(os.environ['OUT'],'wb').write(raw)
          PY
            [[ -s "$out" ]]
          }

          if ! fetch_review_file control/latest.json /tmp/claude-post-deploy-control.json; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'nonce=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fetch_review_file control/claude_vps_dispatch_state.json /tmp/claude-post-deploy-state.json || echo '{}' > /tmp/claude-post-deploy-state.json

          python3 - /tmp/claude-post-deploy-control.json /tmp/claude-post-deploy-state.json <<'PY' > /tmp/claude-post-deploy-request.env
          import json,sys
          try: control=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: control={}
          try: state=json.load(open(sys.argv[2],encoding='utf-8'))
          except Exception: state={}
          action=str(control.get('claude_vps_action') or 'none').lower()
          nonce=max(0,int(control.get('claude_vps_action_nonce') or 0))
          seen=max(0,int(state.get('claude_vps_action_nonce') or 0))
          selected=(str(control.get('strategy_master') or '').lower()=='claude' or str(control.get('engineering_master') or '').lower()=='claude')
          run=(action=='inspect' and nonce>seen and selected)
          print('RUN='+('true' if run else 'false'))
          print('NONCE='+str(nonce))
          PY
          source /tmp/claude-post-deploy-request.env
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "nonce=$NONCE" >> "$GITHUB_OUTPUT"
          echo "Queued Claude VPS proof: inspect_only=true run=$RUN nonce=$NONCE"

      - name: Collect read-only VPS status
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/status-boot-trading-bot > /tmp/claude-post-deploy-status.txt 2>&1
          echo "status_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Analyse redacted status with Claude plan mode
        if: steps.request.outputs.run == 'true'
        id: claude
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('/tmp/claude-post-deploy-status.txt')
          text=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          kept=[]
          for line in text.splitlines():
              if re.search(r'(?i)(api[_ -]?key|private[_ -]?key|mnemonic|seed phrase|password|authorization:|bearer |secret=|token=)',line):
                  kept.append('[REDACTED SENSITIVE LINE]')
              else:
                  line=re.sub(r'sk-ant-[A-Za-z0-9_-]+','<redacted-anthropic-key>',line)
                  line=re.sub(r'github_pat_[A-Za-z0-9_]+','<redacted-github-token>',line)
                  line=re.sub(r'gh[pousr]_[A-Za-z0-9]+','<redacted-github-token>',line)
                  kept.append(line)
          pathlib.Path('/tmp/claude-post-deploy-context.txt').write_text('\n'.join(kept)[-12000:]+'\n',encoding='utf-8')
          PY

          cat > /tmp/claude-post-deploy-prompt.txt <<EOF
          You are Claude acting as a bounded read-only VPS observer.
          This is an INSPECT operation only. Summarise service health, deployed SHA, and any concrete operational concern visible in the redacted status below.
          Do not request or infer secrets. Do not suggest changing wallet/signing controls, LIVE risk gates, capital limits, sudo restrictions, or deployment state.
          Keep the answer under 700 characters and plain text.

          $(cat /tmp/claude-post-deploy-context.txt)
          EOF

          tmpnpm="/tmp/claude-vps-npm-${GITHUB_RUN_ID}"
          rm -rf "$tmpnpm"
          npm install --prefix "$tmpnpm" --silent @anthropic-ai/claude-code@latest >/tmp/claude-post-deploy-install.log 2>&1
          "$tmpnpm/node_modules/.bin/claude" -p --permission-mode plan --max-turns 1 --output-format text --model "${CLAUDE_VPS_MODEL:-sonnet}" \
            "$(cat /tmp/claude-post-deploy-prompt.txt)" > /tmp/claude-post-deploy-analysis.txt 2>/tmp/claude-post-deploy-error.txt
          rm -rf "$tmpnpm"

      - name: Publish inspect proof to ai-reviews
        if: steps.request.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NONCE: ${{ steps.request.outputs.nonce }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/claude-post-deploy-result.json
          import json,os,pathlib,re,time
          def read(path,limit=12000):
              p=pathlib.Path(path)
              return p.read_text(encoding='utf-8',errors='replace')[-limit:] if p.exists() else ''
          status_text=read('/tmp/claude-post-deploy-status.txt')
          analysis=read('/tmp/claude-post-deploy-analysis.txt',1200).strip()
          if not analysis:
              analysis=read('/tmp/claude-post-deploy-error.txt',800).strip() or 'Claude analysis unavailable; deterministic read-only VPS status was still collected.'
          analysis=re.sub(r'sk-ant-[A-Za-z0-9_-]+','<redacted>',analysis)
          m=re.search(r'(?m)^sha:\s*([0-9a-f]{40})\s*$',status_text)
          deployed=m.group(1) if m else ''
          service_active=bool(re.search(r'Active:\s+active \(running\)',status_text,re.I))
          try:
              control=json.load(open('/tmp/claude-post-deploy-control.json',encoding='utf-8'))
          except Exception:
              control={}
          out={
              'schema_version':1,
              'generated_epoch':int(time.time()),
              'action':'inspect',
              'action_nonce':int(os.environ.get('NONCE') or 0),
              'requested_by':str(control.get('updated_by') or '')[:80],
              'status':'SUCCESS' if deployed and service_active else 'FAILED',
              'action_return_code':0 if status_text else 1,
              'target_sha':os.environ.get('EXPECTED_SHA','')[:40],
              'deployed_sha':deployed,
              'service_active':service_active,
              'claude_analysis_available':os.environ.get('CLAUDE_OUTCOME')=='success',
              'claude_analysis':analysis[:1200],
              'sanitised_action_tail':'Inspection only; no VPS mutation requested.',
              'security':{
                  'root_shell':False,
                  'arbitrary_sudo':False,
                  'wallet_or_private_key_access':False,
                  'arbitrary_deploy_sha':False,
                  'deploy_current_main_via_restricted_wrapper_only':True,
                  'automatic_trigger_inspect_only':True,
              },
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

          python3 - <<'PY' > /tmp/claude-post-deploy-state.json
          import json,os,time
          print(json.dumps({'claude_vps_action_nonce':int(os.environ.get('NONCE') or 0),'completed_epoch':int(time.time())},indent=2,sort_keys=True))
          PY

          put_review_file() {
            local path="$1" file="$2" message="$3"
            local api current existing_sha encoded payload
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
            current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=ai-reviews" || true)"
            existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
            encoded="$(base64 -w0 "$file")"
            if [[ -n "$existing_sha" ]]; then
              payload="$(python3 - "$encoded" "$existing_sha" "$message" <<'PY'
          import json,sys
          print(json.dumps({'message':sys.argv[3],'content':sys.argv[1],'sha':sys.argv[2],'branch':'ai-reviews'}))
          PY
              )"
            else
              payload="$(python3 - "$encoded" "$message" <<'PY'
          import json,sys
          print(json.dumps({'message':sys.argv[2],'content':sys.argv[1],'branch':'ai-reviews'}))
          PY
              )"
            fi
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" -d "$payload" >/dev/null
          }

          put_review_file vps/claude/latest.json /tmp/claude-post-deploy-result.json 'Record bounded Claude VPS inspect proof'
          put_review_file control/claude_vps_dispatch_state.json /tmp/claude-post-deploy-state.json 'Record Claude VPS inspect nonce'
          cat /tmp/claude-post-deploy-result.json
