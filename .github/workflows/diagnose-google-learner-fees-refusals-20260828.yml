name: Diagnose Google Learner Fees and Refusals 20260828

on:
  push:
    branches: [fix/solana-aug17-canary-restore]
    paths:
      - '.github/workflows/diagnose-google-learner-fees-refusals-20260828.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 3
    steps:
      - name: Emergency stop learner trading and verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          service=learnerbot-learn.service
          echo "before_active=$(systemctl is-active "$service" || true)"
          echo "before_pid=$(systemctl show -p MainPID --value "$service")"
          sudo -n systemctl stop "$service"
          sleep 2
          after="$(systemctl is-active "$service" || true)"
          pid="$(systemctl show -p MainPID --value "$service")"
          echo "after_active=$after"
          echo "after_pid=$pid"
          test "$after" != active
          test "$pid" = 0
          echo "trading_status=STOPPED"
          echo "trade_submitted=NO"
          echo "service_restart=NO"
