name: Diagnose Google Learner Fees and Refusals 20260828

on:
  push:
    branches: [fix/solana-aug17-canary-restore]
    paths:
      - '.github/workflows/diagnose-google-learner-fees-refusals-20260828.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 4
    steps:
      - name: Read-only fee and refusal analysis
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          target=/home/ayman01323/BOOT/testingbots/learn
          db="$target/data/solana_sibot.sqlite3"
          service=learnerbot-learn.service
          echo '=== SERVICE ==='
          echo "active=$(systemctl is-active "$service" || true)"
          echo "pid=$(systemctl show -p MainPID --value "$service")"
          echo '=== FEES ==='
          DB="$db" python3 - <<'PY'
          import os, sqlite3, statistics, json
          from decimal import Decimal, InvalidOperation
          db=os.environ['DB']
          c=sqlite3.connect(db); c.row_factory=sqlite3.Row
          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          if 'live_execution_receipts' not in tables:
              print('receipt_table=MISSING')
          else:
              rows=[dict(r) for r in c.execute("""select signature,created_at,telegram_id,action,source,trade_value_lamports,
                     network_fee_lamports,base_fee_lamports,priority_fee_lamports,jito_tip_lamports,
                     rent_paid_lamports,rent_reclaimed_lamports
                     from live_execution_receipts order by created_at,signature""").fetchall()]
              print('receipt_rows_total='+str(len(rows)))
              def dec(v):
                  try:return Decimal(str(v or 0))
                  except:return Decimal(0)
              def summarize(label, xs):
                  good=[]
                  for r in xs:
                      tv=dec(r.get('trade_value_lamports')); fee=dec(r.get('network_fee_lamports'))
                      if tv>0 and fee>=0:
                          pct=(fee/tv)*Decimal(100)
                          good.append((r,tv,fee,pct))
                  print(label+'_covered='+str(len(good)))
                  if not good:return
                  simple=sum(x[3] for x in good)/Decimal(len(good))
                  weighted=sum(x[2] for x in good)/sum(x[1] for x in good)*Decimal(100)
                  vals=sorted(x[3] for x in good)
                  med=vals[len(vals)//2] if len(vals)%2 else (vals[len(vals)//2-1]+vals[len(vals)//2])/2
                  print(label+'_simple_avg_pct='+format(simple,'.6f'))
                  print(label+'_weighted_avg_pct='+format(weighted,'.6f'))
                  print(label+'_median_pct='+format(med,'.6f'))
                  print(label+'_total_fee_sol='+format(sum(x[2] for x in good)/Decimal(1_000_000_000),'.9f'))
                  print(label+'_total_trade_value_sol='+format(sum(x[1] for x in good)/Decimal(1_000_000_000),'.9f'))
                  for r,tv,fee,pct in good:
                      print('trade|tid=%s|action=%s|sig=%s|value_sol=%s|fee_lamports=%s|fee_pct=%s|base=%s|priority=%s|source=%s' % (
                          str(r.get('telegram_id') or '-'), str(r.get('action') or '-'), str(r.get('signature') or '')[:12],
                          format(tv/Decimal(1_000_000_000),'.9f'), str(int(fee)), format(pct,'.6f'),
                          str(r.get('base_fee_lamports') or '0'),str(r.get('priority_fee_lamports') or '0'),str(r.get('source') or '-')))
              summarize('all',rows)
              mine=[r for r in rows if str(r.get('telegram_id') or '')=='5923828381']
              summarize('tid5923828381',mine)
              summarize('tid5923828381_buy',[r for r in mine if str(r.get('action') or '').upper()=='BUY'])
              summarize('tid5923828381_sell',[r for r in mine if str(r.get('action') or '').upper()=='SELL'])
          # Compare with bot position/execution counts so we can state coverage.
          if 'positions' in tables:
              for tid in ('5923828381',):
                  n=c.execute("select count(*) from positions where telegram_id=? and mode='LIVE'",(tid,)).fetchone()[0]
                  print('positions_live_tid_'+tid+'='+str(n))
                  rows2=c.execute("select position_id,status,entry_tx,exit_signature,entry_cost_sol,realised_net_sol from positions where telegram_id=? and mode='LIVE' order by entry_ts",(tid,)).fetchall()
                  for r in rows2:
                      print('position|id=%s|status=%s|entry_tx=%s|exit_tx=%s|entry_cost_sol=%s|realised_net_sol=%s' % (
                          str(r['position_id'])[:12],r['status'],str(r['entry_tx'] or '')[:12],str(r['exit_signature'] or '')[:12],r['entry_cost_sol'],r['realised_net_sol']))
          print('=== REFUSALS_24H ===')
          if 'live_decisions' in tables:
              since=int(__import__('time').time())-86400
              rows=[dict(r) for r in c.execute("""select id,ts,event_action,decision,reason,mint,signature
                       from live_decisions where telegram_id=? and ts>=? order by ts desc""",('5923828381',since)).fetchall()]
              from collections import Counter
              cnt=Counter(str(r.get('decision') or 'UNKNOWN').upper() for r in rows)
              print('decisions_24h='+str(len(rows)))
              for k in sorted(cnt): print('decision_'+k+'='+str(cnt[k]))
              refused=[r for r in rows if str(r.get('decision') or '').upper() in {'SKIP','REJECT','HARD_BLOCK','BLOCK','REFUSE','REFUSED'}]
              print('refused_24h='+str(len(refused)))
              for r in refused[:30]:
                  reason=str(r.get('reason') or '').replace('\n',' ')[:220]
                  print('refusal|id=%s|decision=%s|event=%s|mint=%s|reason=%s' % (r['id'],r['decision'],r['event_action'],str(r['mint'])[:12],reason))
          c.close()
          PY
          echo '=== TELEGRAM REPORTING CODE/LOG STATUS ==='
          grep -n -E '_record\(|send_message|_notify|Recent decisions|live_decisions' "$target/learnerbot/solana_trade_diagnostics_patch.py" | head -100 || true
          sudo -n journalctl -u "$service" --since '90 minutes ago' --no-pager -o cat | grep -E 'solana-live-decision|meaningful alerts|HARD_BLOCK|REJECT|SKIP' | tail -180 || true
          echo 'trading_action=NONE'
          echo 'service_restart=NO'
          echo 'telegram_message_sent=NO'
