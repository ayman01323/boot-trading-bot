name: Diagnose Google Learner Trading Now

on:
  push:
    branches: [fix/solana-aug17-canary-restore]
    paths:
      - '.github/workflows/diagnose-google-learner-trading-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Inspect learner trading state without changing it
        shell: bash
        run: |
          set -euo pipefail
          target=/home/ayman01323/BOOT/testingbots/learn
          service=learnerbot-learn.service
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          echo '=== SERVICE ==='
          echo "active=$(systemctl is-active "$service")"
          echo "pid=$(systemctl show -p MainPID --value "$service")"
          echo "started=$(systemctl show -p ActiveEnterTimestamp --value "$service")"

          echo '=== DATABASE DISCOVERY ==='
          find "$target" -maxdepth 3 -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -printf '%p\n' | head -20

          echo '=== DATABASE STATE ==='
          TARGET="$target" python3 - <<'PY'
          import os, sqlite3, json
          from pathlib import Path
          root=Path(os.environ['TARGET'])
          dbs=list(root.rglob('*.db'))+list(root.rglob('*.sqlite'))+list(root.rglob('*.sqlite3'))
          seen=set()
          for db in dbs:
              if db in seen: continue
              seen.add(db)
              try:
                  conn=sqlite3.connect(str(db)); conn.row_factory=sqlite3.Row
                  tables=[r[0] for r in conn.execute("select name from sqlite_master where type='table' order by name")]
                  if 'positions' not in tables and 'live_execution_attempts' not in tables:
                      conn.close(); continue
                  print('db=', db)
                  print('tables=', ','.join(tables))
                  if 'positions' in tables:
                      cols=[r[1] for r in conn.execute('pragma table_info(positions)')]
                      wanted=[c for c in ['position_id','mint','status','mode','token_amount_raw','entry_cost_sol','realised_net_sol','unrealised_pct','leader_exit_pending','exit_reason','exit_signature','closed_at','updated_at','telegram_id'] if c in cols]
                      q='select '+','.join(wanted)+" from positions order by updated_at desc limit 20"
                      for r in conn.execute(q): print('POSITION', json.dumps(dict(r), default=str, sort_keys=True))
                      try:
                          print('OPEN_LIVE_COUNT', conn.execute("select count(*) from positions where status='OPEN' and mode='LIVE'").fetchone()[0])
                      except Exception as e: print('OPEN_LIVE_COUNT_ERR', type(e).__name__, str(e)[:200])
                  if 'live_execution_attempts' in tables:
                      cols=[r[1] for r in conn.execute('pragma table_info(live_execution_attempts)')]
                      wanted=[c for c in ['id','attempt_id','chain','action','status','reason','decision','position_id','mint','created_at','updated_at','error'] if c in cols]
                      order='updated_at' if 'updated_at' in cols else ('created_at' if 'created_at' in cols else 'rowid')
                      q='select '+','.join(wanted)+f' from live_execution_attempts order by {order} desc limit 50'
                      for r in conn.execute(q): print('ATTEMPT', json.dumps(dict(r), default=str, sort_keys=True))
                      if 'status' in cols:
                          for r in conn.execute('select status,count(*) n from live_execution_attempts group by status order by n desc'): print('ATTEMPT_STATUS', dict(r))
                  # Generic refusal/candidate/opportunity tables if present.
                  for t in tables:
                      low=t.lower()
                      if any(k in low for k in ('refus','reject','opportun','candidate','signal','decision')):
                          try:
                              cols=[r[1] for r in conn.execute(f'pragma table_info("{t}")')]
                              order=next((c for c in ('updated_at','created_at','timestamp','ts','id') if c in cols), 'rowid')
                              rows=conn.execute(f'select * from "{t}" order by {order} desc limit 12').fetchall()
                              print('TABLE_SAMPLE', t, 'count=',len(rows))
                              for r in rows:
                                  d=dict(r)
                                  # redact any obvious secret-like columns
                                  for k in list(d):
                                      if any(x in k.lower() for x in ('key','secret','token','private','password','rpc_url')): d[k]='<redacted>'
                                  print(t.upper(), json.dumps(d, default=str, sort_keys=True)[:2500])
                          except Exception as e: print('TABLE_ERR', t, type(e).__name__, str(e)[:160])
                  conn.close()
              except Exception as e:
                  print('DB_ERR', db, type(e).__name__, str(e)[:200])
          PY

          echo '=== SAFE RUNTIME GATES ==='
          pid="$(systemctl show -p MainPID --value "$service")"
          if [ -r "/proc/$pid/environ" ]; then
            tr '\0' '\n' < "/proc/$pid/environ" | grep -E '^(SOLANA_(LIVE|AUTO|ARMED|MAX|CANARY|RESERVE|SIGNAL|MIRROR|EASY|STOP|TAKE|TRAIL|BREAK)|LEARNER_|TRADING_|AUTO_)' | grep -Ev '(KEY|SECRET|TOKEN|PASSWORD|URL)=' | sort || true
            echo -n 'SOLANA_RPC_URLS_count='; tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^SOLANA_RPC_URLS=//p' | awk -F, '{if(length($0)==0) print 0; else print NF}' | tail -1
            echo -n 'SOLANA_RPC_FALLBACK_URLS_count='; tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^SOLANA_RPC_FALLBACK_URLS=//p' | awk -F, '{if(length($0)==0) print 0; else print NF}' | tail -1
          else
            echo 'process_environment=unreadable'
          fi

          echo '=== RECENT TRADING / REFUSAL / RPC LOGS ==='
          sudo -n journalctl -u "$service" --since '20 minutes ago' --no-pager -o cat \
            | grep -Ei 'solana|opportun|refus|reject|skip|block|candidate|signal|entry|buy|sell|exit|position|rpc|quote|poolcheck|leader' \
            | tail -350 || true

          echo '=== LAST 120 RAW SERVICE LINES ==='
          sudo -n journalctl -u "$service" -n 120 --no-pager -o cat || true

          echo '=== NO CHANGES MADE ==='
          echo 'trading_action=NONE'
          echo 'service_restart=NO'
          echo 'wallet_env_csv_data_touched=NO'
