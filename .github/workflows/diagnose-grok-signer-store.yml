name: Diagnose Grok signer store

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-grok-signer-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Inspect known Solana wallet stores read-only
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ayman01323/BOOT
          python3 - <<'PY'
          import csv
          from pathlib import Path

          stores = [
              ('shared', Path('/home/ayman01323/BOOT/CSVbot'), Path('/home/ayman01323/BOOT/data')),
              ('learner-isolated', Path('/home/ayman01323/BOOT/testingbots/learn/CSVbot'), Path('/home/ayman01323/BOOT/testingbots/learn/data')),
          ]
          for label, csv_dir, data_dir in stores:
              path = csv_dir / 'auto' / 'solana_user_wallets.csv'
              key = data_dir / '.solana_wallet_store.key'
              rows = []
              if path.exists():
                  with path.open('r', encoding='utf-8-sig', newline='') as f:
                      rows = list(csv.DictReader(f))
              enabled = [r for r in rows if str(r.get('enabled','true')).lower() in {'1','true','yes','on'}]
              active = [r for r in enabled if str(r.get('active','')).lower() == 'true']
              signing = [r for r in active if str(r.get('signing','')).lower() == 'true']
              encrypted = []
              for r in signing:
                  tid = str(r.get('telegram_id') or '').strip()
                  wid = str(r.get('wallet_id') or '').strip()
                  if tid and wid and (data_dir / 'user_solana_wallets' / tid / f'{wid}.enc.json').exists():
                      encrypted.append(r)
              print(f'store={label}')
              print(f'csv_exists={str(path.exists()).lower()}')
              print(f'encryption_key_exists={str(key.exists()).lower()}')
              print(f'wallet_rows={len(rows)}')
              print(f'active_rows={len(active)}')
              print(f'active_signing_rows={len(signing)}')
              print(f'active_encrypted_signers={len(encrypted)}')
              print('---')
          PY
