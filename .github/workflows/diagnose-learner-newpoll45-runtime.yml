name: Diagnose Learner NewPoll45 Runtime

on:
  push:
    branches: [fix/solana-aug17-canary-restore]
    paths:
      - '.github/workflows/diagnose-learner-newpoll45-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Read-only learner runtime diagnosis
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          service=learnerbot-learn.service
          target=/home/ayman01323/BOOT/testingbots/learn
          echo "service_active=$(systemctl is-active "$service" || true)"
          echo '--- unit ExecStart only ---'
          systemctl show "$service" -p ExecStart -p MainPID -p ActiveState -p SubState
          echo '--- safe learner startup markers ---'
          sudo -n journalctl -u "$service" --since '2026-08-28 11:45:00 UTC' --no-pager \
            | grep -E '\[learner-newpoll45\]|\[final-runtime-integrity\]|Starting multi-chain learning loop|Traceback|Main process exited|Failed with result' \
            | tail -80 || true
          echo '--- import presence ---'
          grep -F 'telegram_learner_position_update_patch' "$target/learnerbot/final_runtime_integrity_patch.py" || true
          echo '--- source timestamp ---'
          stat -c 'source_mtime=%y source_size=%s' "$target/learnerbot/telegram_learner_position_update_patch.py"
          echo 'diagnostic_mutation=NO'
