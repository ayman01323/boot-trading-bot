name: Diagnose Telegram Poller Conflict 20260828 1721

on:
  push:
    branches: [fix/solana-aug17-canary-restore]
    paths:
      - '.github/workflows/diagnose-telegram-poller-conflict-20260828-1721.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Stage Solana wrapper order fix only
        shell: bash
        run: |
          set -euo pipefail
          LEARN=/home/ayman01323/BOOT/testingbots/learn
          ROOTBOT=/root/multichain-learning-bot-v2.2-fast-direct-market
          COMMIT=2222014c9dbf757ac3fd5a8276999835ef557d0d
          BEFORE=$(systemctl show -p MainPID --value sirisky.service 2>/dev/null || true)

          sudo -n systemctl stop learnerbot-learn.service
          test "$(systemctl show -p MainPID --value learnerbot-learn.service 2>/dev/null || true)" = 0

          curl -fsSL "https://raw.githubusercontent.com/ayman01323/boot-trading-bot/$COMMIT/learnerbot/solana_stuck_liquidity_safe_slice_patch.py" -o /tmp/solana_stuck_liquidity_safe_slice_patch.py
          curl -fsSL "https://raw.githubusercontent.com/ayman01323/boot-trading-bot/$COMMIT/learnerbot/trading_runtime_invariant_patch.py" -o /tmp/trading_runtime_invariant_patch.py

          ! grep -q '^from \. import solana_loss_containment_patch' /tmp/solana_stuck_liquidity_safe_slice_patch.py
          grep -q '^from \. import solana_live_patch as _live$' /tmp/trading_runtime_invariant_patch.py
          grep -q '^from \. import solana_loss_containment_patch as _loss_containment$' /tmp/trading_runtime_invariant_patch.py

          sudo -n "$ROOTBOT/.venv/bin/python" -m py_compile /tmp/solana_stuck_liquidity_safe_slice_patch.py /tmp/trading_runtime_invariant_patch.py
          sudo -n install -m 0644 /tmp/solana_stuck_liquidity_safe_slice_patch.py "$LEARN/learnerbot/solana_stuck_liquidity_safe_slice_patch.py"
          sudo -n install -m 0644 /tmp/trading_runtime_invariant_patch.py "$LEARN/learnerbot/trading_runtime_invariant_patch.py"
          sudo -n "$ROOTBOT/.venv/bin/python" -m py_compile "$LEARN/learnerbot/solana_stuck_liquidity_safe_slice_patch.py" "$LEARN/learnerbot/trading_runtime_invariant_patch.py"

          echo '=== STATIC ORDER CHECK ==='
          grep -RniE 'from \. import solana_loss_containment_patch' "$LEARN/learnerbot" --include='*.py' | sort || true
          echo '=== STATE ==='
          echo "learner_active=$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)"
          echo "learner_pid=$(systemctl show -p MainPID --value learnerbot-learn.service 2>/dev/null || true)"
          AFTER=$(systemctl show -p MainPID --value sirisky.service 2>/dev/null || true)
          echo "sirisky_active=$(systemctl is-active sirisky.service 2>/dev/null || true)"
          echo "sirisky_pid=$AFTER"
          test "$BEFORE" = "$AFTER"
          test "$(systemctl show -p MainPID --value learnerbot-learn.service 2>/dev/null || true)" = 0
          echo 'wrapper_order_fix_staged=YES'
          echo 'learner_stopped=YES'
          echo 'sirisky_untouched=YES'
          echo 'telegram_send=NO'
          echo 'trading_action=NONE'
