name: Diagnose Telegram Poller Conflict 20260828 1721

on:
  push:
    branches: [fix/solana-aug17-canary-restore]
    paths:
      - '.github/workflows/diagnose-telegram-poller-conflict-20260828-1721.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Stop crash-looping learner only
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(systemctl show -p MainPID --value sirisky.service 2>/dev/null || true)
          echo "sirisky_before=$(systemctl is-active sirisky.service 2>/dev/null || true) pid=$BEFORE"
          sudo -n systemctl stop learnerbot-learn.service
          sleep 1
          echo "learner_active=$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)"
          echo "learner_pid=$(systemctl show -p MainPID --value learnerbot-learn.service 2>/dev/null || true)"
          test "$(systemctl show -p MainPID --value learnerbot-learn.service 2>/dev/null || true)" = 0
          AFTER=$(systemctl show -p MainPID --value sirisky.service 2>/dev/null || true)
          echo "sirisky_after=$(systemctl is-active sirisky.service 2>/dev/null || true) pid=$AFTER"
          test "$BEFORE" = "$AFTER"
          echo 'learner_stopped=YES'
          echo 'sirisky_untouched=YES'
          echo 'telegram_send=NO'
          echo 'trading_action=NONE'
