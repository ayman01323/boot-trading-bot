name: Dispatch DeepSeek Full-Link Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-deepseek-readonly-once.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch DeepSeek GitHub read-only verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deepseek-github-readonly-selfhosted.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f task='FULL LINK TEST. Report current GitHub main SHA, dependency installation, repository test result/pass count, and operational warnings. Read/report only. Do not modify code, merge, deploy, change trading settings, or access wallet/signing material.'

      - name: Dispatch DeepSeek GitHub-to-VPS controlled inspection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deepseek-vps-controlled-ops.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f action=inspect \
            -f task='FULL LINK TEST. Verify GitHub can reach the self-hosted boot-vps runner, collect the restricted service status, send only sanitised context to DeepSeek, and return a bounded health summary. Do not deploy, restart, trade, access wallet/signing material, or bypass LIVE/risk controls.'
