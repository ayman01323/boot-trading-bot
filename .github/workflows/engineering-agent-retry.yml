name: Engineering Agent Retry (Manual Compatibility)

on:
  # Historical GPT/Gemini engineering retries were polling every 30 minutes.
  # Non-urgent paid retries are now explicit only.
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Optional engineering source; must equal current main for a full re-audit'
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: engineering-agent-retry-manual
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch full current-main engineering re-audit only when explicitly requested
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          requested="${INPUT_SOURCE:-$current}"
          if [[ "$requested" != "$current" ]]; then
            echo "Historical exact-source paid retry is intentionally not automatic: requested=${requested} current=${current}" >&2
            echo 'Run the provider-specific workflow manually if an immutable historical review is truly required.' >&2
            exit 2
          fi
          gh workflow run weekly-three-agent-bug-audit.yml --ref main
          echo "Dispatched explicit current-main GPT/Gemini/Copilot engineering re-audit for ${current:0:12}."
