name: Sync Etherscan Runtime Credential

on:
  push:
    branches: [main]
    paths:
      - '.github/etherscan-runtime-secret-sync.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etherscan-runtime-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    env:
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    steps:
      - name: Require configured secret without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ETHERSCAN_API_KEY:-}" ]]; then
            echo 'ETHERSCAN_API_KEY is not configured in repository secrets.' >&2
            exit 1
          fi
          echo 'ETHERSCAN_API_KEY: present'

      - name: Write protected external runtime bridge
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          target=/var/tmp/etherscan_runtime.env
          tmp="$(mktemp /var/tmp/.etherscan-runtime.XXXXXX)"
          TMP="$tmp" python3 - <<'PY'
          import json, os, pathlib
          value = str(os.environ.get('ETHERSCAN_API_KEY') or '').strip()
          if not value:
              raise SystemExit('missing ETHERSCAN_API_KEY')
          pathlib.Path(os.environ['TMP']).write_text(
              'ETHERSCAN_API_KEY=' + json.dumps(value) + '\n', encoding='utf-8'
          )
          PY
          chmod 600 "$tmp"
          mv -f "$tmp" "$target"
          test "$(stat -c '%a' "$target")" = 600
          echo 'Protected Etherscan runtime bridge updated; value not logged.'

      - name: Restart learnerbot through restricted wrapper
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/restart-boot-trading-bot
          sudo -n /usr/local/sbin/status-boot-trading-bot | sed -n '1,24p'

      - name: Verify bridge presence only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import stat
          p=Path('/var/tmp/etherscan_runtime.env')
          print('runtime_file_present=' + str(p.is_file()).lower())
          print('runtime_file_mode=' + (oct(stat.S_IMODE(p.stat().st_mode)) if p.is_file() else 'missing'))
          PY
