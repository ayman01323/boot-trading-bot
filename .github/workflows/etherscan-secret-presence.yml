name: Etherscan Secret Presence Check

on:
  pull_request:
    paths:
      - '.github/workflows/etherscan-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 3
    steps:
      - name: Report presence only
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ETHERSCAN_API_KEY:-}" ]]; then
            echo 'ETHERSCAN_API_KEY_PRESENT=true'
            echo '## Etherscan runtime credential' >> "$GITHUB_STEP_SUMMARY"
            echo '**ETHERSCAN_API_KEY: present**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ETHERSCAN_API_KEY_PRESENT=false'
            echo '## Etherscan runtime credential' >> "$GITHUB_STEP_SUMMARY"
            echo '**ETHERSCAN_API_KEY: missing**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
