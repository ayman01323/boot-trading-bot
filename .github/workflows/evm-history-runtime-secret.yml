name: Sync EVM History Runtime Secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evm-history-runtime-secret.yml'
      - '.github/evm-history-runtime-secret.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evm-history-runtime-secret
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    steps:
      - name: Write mode-600 runtime bridge without logging value
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          target=/var/tmp/boot_evm_history_runtime.env
          tmp="$(mktemp /var/tmp/.boot-evm-history.XXXXXX)"
          TMP="$tmp" python3 - <<'PY'
          import json, os, pathlib
          value = str(os.environ.get('ETHERSCAN_API_KEY') or '').strip()
          path = pathlib.Path(os.environ['TMP'])
          path.write_text(
              ('ETHERSCAN_API_KEY=' + json.dumps(value) + '\n') if value else '',
              encoding='utf-8',
          )
          PY
          chmod 600 "$tmp"
          mv -f "$tmp" "$target"
          test -r "$target"

      - name: Publish redacted EVM history credential health
        shell: bash
        run: |
          set -euo pipefail
          target=/var/tmp/boot_evm_history_runtime.env
          python3 - "$target" <<'PY' > /tmp/evm-history-runtime-health.json
          import json, pathlib, sys, time
          path = pathlib.Path(sys.argv[1])
          configured = False
          if path.exists():
              for line in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  if line.startswith('ETHERSCAN_API_KEY=') and line.split('=', 1)[1].strip() not in {'', '""', "''"}:
                      configured = True
                      break
          print(json.dumps({
              'checked_epoch': int(time.time()),
              'runtime_file_present': path.exists(),
              'runtime_file_mode': oct(path.stat().st_mode & 0o777) if path.exists() else '',
              'etherscan_configured': configured,
              'secret_value_exposed': False,
          }, indent=2, sort_keys=True))
          PY

          path='health/evm_history_runtime.json'
          api="repos/${GITHUB_REPOSITORY}/contents/${path}"
          current="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=ai-reviews" 2>/dev/null || true)"
          sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/evm-history-runtime-health.json)"
          python3 - "$encoded" "$sha" <<'PY' > /tmp/evm-history-runtime-put.json
          import json, sys
          payload = {'message':'Update redacted EVM history runtime health','content':sys.argv[1],'branch':'ai-reviews'}
          if sys.argv[2]:
              payload['sha'] = sys.argv[2]
          print(json.dumps(payload))
          PY
          gh api --method PUT -H 'Accept: application/vnd.github+json' "$api" --input /tmp/evm-history-runtime-put.json >/dev/null
          cat /tmp/evm-history-runtime-health.json
