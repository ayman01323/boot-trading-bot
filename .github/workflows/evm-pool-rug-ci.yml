name: EVM / PoolCheck Rug Safety CI

on:
  pull_request:
    paths:
      - 'learnerbot/evm_pool_rug_gate.py'
      - 'learnerbot/evm_transfer_native_hotfix_patch.py'
      - 'learnerbot/poolcheck_rug_hardening_patch.py'
      - 'learnerbot/final_runtime_integrity_patch.py'
      - 'tests/test_evm_pool_rug_gate.py'
      - 'tests/test_poolcheck_rug_hardening_patch.py'
      - '.github/workflows/evm-pool-rug-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'learnerbot/evm_pool_rug_gate.py'
      - 'learnerbot/evm_transfer_native_hotfix_patch.py'
      - 'learnerbot/poolcheck_rug_hardening_patch.py'
      - 'learnerbot/final_runtime_integrity_patch.py'
      - 'tests/test_evm_pool_rug_gate.py'
      - 'tests/test_poolcheck_rug_hardening_patch.py'

permissions:
  contents: read

concurrency:
  group: evm-pool-rug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 15
    env:
      BOT_PYTHON: /root/multichain-learning-bot-v2.2-fast-direct-market/.venv/bin/python
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify existing bot Python environment
        shell: bash
        run: |
          set -euo pipefail
          test -x "$BOT_PYTHON"
          "$BOT_PYTHON" --version
          "$BOT_PYTHON" -c 'import pytest, requests, solders; print("poolcheck-ci-deps=OK")'

      - name: Compile PoolCheck safety code
        run: |
          "$BOT_PYTHON" -m py_compile \
            learnerbot/evm_pool_rug_gate.py \
            learnerbot/poolcheck_rug_hardening_patch.py \
            learnerbot/final_runtime_integrity_patch.py \
            tests/test_evm_pool_rug_gate.py \
            tests/test_poolcheck_rug_hardening_patch.py

      - name: Run PoolCheck rug regression tests
        run: |
          "$BOT_PYTHON" -m pytest -x -vv \
            tests/test_evm_pool_rug_gate.py \
            tests/test_poolcheck_rug_hardening_patch.py
