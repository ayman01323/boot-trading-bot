name: EVM / PoolCheck Rug Safety CI

on:
  pull_request:
    paths:
      - 'learnerbot/evm_pool_rug_gate.py'
      - 'learnerbot/evm_transfer_native_hotfix_patch.py'
      - 'learnerbot/poolcheck_rug_hardening_patch.py'
      - 'learnerbot/solana_entry_exit_liquidity_preflight_patch.py'
      - 'learnerbot/solana_preflight_cache_patch.py'
      - 'learnerbot/final_runtime_integrity_patch.py'
      - 'tests/test_evm_pool_rug_gate.py'
      - 'tests/test_poolcheck_rug_hardening_patch.py'
      - 'tests/test_solana_entry_exit_liquidity_preflight.py'
      - 'tests/test_solana_entry_buy_impact_preflight.py'
      - '.github/workflows/evm-pool-rug-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'learnerbot/evm_pool_rug_gate.py'
      - 'learnerbot/evm_transfer_native_hotfix_patch.py'
      - 'learnerbot/poolcheck_rug_hardening_patch.py'
      - 'learnerbot/solana_entry_exit_liquidity_preflight_patch.py'
      - 'learnerbot/solana_preflight_cache_patch.py'
      - 'learnerbot/final_runtime_integrity_patch.py'
      - 'tests/test_evm_pool_rug_gate.py'
      - 'tests/test_poolcheck_rug_hardening_patch.py'
      - 'tests/test_solana_entry_exit_liquidity_preflight.py'
      - 'tests/test_solana_entry_buy_impact_preflight.py'
      - '.github/workflows/evm-pool-rug-ci.yml'

permissions:
  contents: read

concurrency:
  group: evm-pool-rug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q --upgrade pip
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
          python -c 'import pytest, requests, solders; print("poolcheck-ci-deps=OK")'

      - name: Compile PoolCheck safety code
        run: |
          python -m py_compile \
            learnerbot/evm_pool_rug_gate.py \
            learnerbot/poolcheck_rug_hardening_patch.py \
            learnerbot/solana_entry_exit_liquidity_preflight_patch.py \
            learnerbot/solana_preflight_cache_patch.py \
            learnerbot/final_runtime_integrity_patch.py \
            tests/test_evm_pool_rug_gate.py \
            tests/test_poolcheck_rug_hardening_patch.py \
            tests/test_solana_entry_exit_liquidity_preflight.py \
            tests/test_solana_entry_buy_impact_preflight.py

      - name: Run PoolCheck rug regression tests
        run: |
          python -m pytest -x -vv \
            tests/test_evm_pool_rug_gate.py \
            tests/test_poolcheck_rug_hardening_patch.py \
            tests/test_solana_entry_exit_liquidity_preflight.py \
            tests/test_solana_entry_buy_impact_preflight.py