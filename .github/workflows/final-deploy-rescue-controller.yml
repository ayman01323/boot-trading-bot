name: Final Deploy Rescue Controller

on:
  push:
    branches:
      - ops/final-deploy-rescue-20260824
    paths:
      - '.github/final-deploy-rescue.trigger'

permissions:
  actions: write
  contents: write

jobs:
  rescue_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve frozen main target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "Frozen main target: $target"

      - name: Clear proved-stale VPS runner work
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          # This run was already proved to have its deploy job cancelled, with only
          # a stale queued post-deploy Claude proof job remaining.
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/32673081630/cancel" >/dev/null 2>&1 || true

          # AI recovery is non-trading background work. Clear queued/in-progress
          # recovery so the single boot-vps runner can service the owner-requested deploy.
          for state in queued in_progress; do
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/selfhosted-five-agent-recovery.yml/runs?status=${state}&per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null | while read -r id; do
                [[ -n "$id" ]] || continue
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
              done
          done

          # Remove only queued stale operational jobs. Never cancel an already-running
          # deployment because doing so mid-test/restart could leave the service stopped.
          for workflow in \
            deploy-current-main-direct.yml \
            deploy-current-main-pr-isolated.yml \
            deploy-current-main-trigger.yml \
            server-ops.yml \
            deepseek-vps-controlled-ops.yml \
            claude-vps-controlled-ops.yml \
            learnerbot-recovery-restart.yml; do
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=queued&per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null | while read -r id; do
                [[ -n "$id" ]] || continue
                echo "Cancelling queued stale ${workflow} run ${id}"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
              done
          done
          sleep 5

      - name: Dispatch attested server-ops deploy_main
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$current" != "$TARGET_SHA" ]]; then
            echo "Refusing deploy: main moved from ${TARGET_SHA} to ${current}" >&2
            exit 42
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/server-ops.yml/dispatches" \
            --input - <<EOF
          {"ref":"main","inputs":{"operation":"deploy_main"}}
          EOF
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      - name: Resolve and wait for server-ops run
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 45); do
            run_id="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/server-ops.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"${TARGET_SHA}\") | .id" 2>/dev/null | head -n1 || true)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo 'run_id=' >> "$GITHUB_OUTPUT"
            echo 'conclusion=missing' >> "$GITHUB_OUTPUT"
            exit 3
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          status='queued'
          conclusion=''
          for _ in $(seq 1 120); do
            data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(printf '%s' "$data" | jq -r '.status')"
            conclusion="$(printf '%s' "$data" | jq -r '.conclusion // ""')"
            echo "server-ops ${run_id}: ${status} ${conclusion:-pending}"
            [[ "$status" == 'completed' ]] && break
            sleep 5
          done
          echo "conclusion=${conclusion:-timeout}" >> "$GITHUB_OUTPUT"
          [[ "$status" == 'completed' && "$conclusion" == 'success' ]]

      - name: Publish controller attestation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
          CONCLUSION: ${{ steps.wait.outputs.conclusion }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/final-controller.json
          import json, os, time
          print(json.dumps({
              'schema_version': 1,
              'generated_epoch': int(time.time()),
              'target_sha': os.environ.get('TARGET_SHA',''),
              'server_ops_run_id': int(os.environ.get('RUN_ID') or 0),
              'conclusion': os.environ.get('CONCLUSION') or 'unknown',
              'main_was_not_modified_by_controller': True,
              'full_test_gate': True,
              'restricted_wrapper_only': True,
          }, indent=2, sort_keys=True))
          PY
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-final-deploy-controller.json"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/final-controller.json)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/final-controller-put.json
          import json, sys
          out={'message':'Update final deploy controller attestation','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: out['sha']=sys.argv[2]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/final-controller-put.json >/dev/null
