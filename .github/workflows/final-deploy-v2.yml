name: Final BOOT Deploy V2

on:
  push:
    branches: [main]
    paths:
      - '.github/final-deploy-v2.trigger'

permissions:
  contents: write

concurrency:
  group: boot-vps-final-deploy-v2
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Publish final-deploy-v2 request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/final-v2-probe.txt <<EOF
          requested_sha=${TARGET_SHA}
          state=waiting_for_self_hosted_runner
          run_id=${GITHUB_RUN_ID}
          utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          workflow=final-deploy-v2
          EOF
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-final-deploy-v2-probe.txt"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/final-v2-probe.txt)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/final-v2-probe-put.json
          import json,sys
          out={'message':'Update final deploy v2 probe','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: out['sha']=sys.argv[2]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/final-v2-probe-put.json >/dev/null

  deploy:
    needs: probe
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Deploy exact triggering main SHA through restricted wrapper
        id: deploy
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/deploy-boot-trading-bot "${TARGET_SHA}" 2>&1 | tee /tmp/final-v2-deploy-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Restore prior learnerbot after rejected deploy
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/restart-boot-trading-bot
          sudo /usr/local/sbin/status-boot-trading-bot

      - name: Capture server status
        id: status
        if: always()
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/status-boot-trading-bot 2>&1 | tee /tmp/final-v2-status.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish final-deploy-v2 attestation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
          STATUS_EXIT: ${{ steps.status.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "requested_sha=${TARGET_SHA}"
            echo "deploy_outcome=${DEPLOY_OUTCOME:-unknown}"
            echo "deploy_exit=${DEPLOY_EXIT:-unknown}"
            echo "status_exit=${STATUS_EXIT:-unknown}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "deployment_scope=ALL_CURRENT_MAIN"
            echo "restricted_wrapper=true"
            echo "full_test_gate=true"
            echo
            echo "=== SERVER STATUS ==="
            cat /tmp/final-v2-status.txt 2>/dev/null || true
            echo
            echo "=== DEPLOY OUTPUT (tail) ==="
            tail -n 160 /tmp/final-v2-deploy-output.txt 2>/dev/null || true
          } > /tmp/final-v2-attestation.txt
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-final-deploy-v2.txt"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/final-v2-attestation.txt)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/final-v2-put.json
          import json,sys
          out={'message':'Update final deploy v2 attestation','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: out['sha']=sys.argv[2]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/final-v2-put.json >/dev/null
