name: Fix Learner Absolute Max Hold 30m 20260829

on:
  push:
    branches:
      - diagnostics/telegram-routing-20260829
    paths:
      - '.github/workflows/fix-learner-absolute-max-hold-30m-20260829.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 8
    steps:
      - name: Keep 30 minute hold limit absolute
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n bash <<'ROOT'
          set -Eeuo pipefail
          LROOT=/home/ayman01323/BOOT/testingbots/learn
          grep -q 'reason = "SOLANA_MAX_HOLD_100PCT"' "$LROOT/learnerbot/solana_live_patch.py"
          grep -q '^max_hold_hours,0.5,' "$LROOT/CSVbot/solana_settings.csv"
          ROOT

      - name: Restore immediate rejected opportunity Telegram alerts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n bash <<'ROOT'
          set -Eeuo pipefail
          LROOT=/home/ayman01323/BOOT/testingbots/learn
          SERVICE=learnerbot-learn.service
          FILE="$LROOT/learnerbot/solana_sibot.py"

          LROOT="$LROOT" python3 - <<'PY'
          import os,sqlite3
          from pathlib import Path
          p=Path(os.environ['LROOT'])/'data'/'solana_sibot.sqlite3'; n=0
          if p.exists():
              c=sqlite3.connect(f'file:{p}?mode=ro',uri=True)
              try:n=c.execute("select count(*) from positions where status='OPEN' and mode='LIVE'").fetchone()[0]
              finally:c.close()
          print('learner_open_live_positions='+str(n))
          if n: raise SystemExit('REFUSE_RESTART_WITH_OPEN_POSITION')
          PY

          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup="$LROOT/private/pre-reject-telegram-$stamp"
          mkdir -p "$backup"
          cp -a "$FILE" "$backup/solana_sibot.py"
          changed=0
          rollback(){ rc=$?; if [[ $rc -ne 0 && $changed -eq 1 ]]; then cp -a "$backup/solana_sibot.py" "$FILE"; systemctl restart "$SERVICE" || true; echo ROLLBACK_COMPLETE=true; fi; exit $rc; }
          trap rollback EXIT

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ayman01323/BOOT/testingbots/learn/learnerbot/solana_sibot.py')
          s=p.read_text()
          if 'from .telegram import send_message' not in s:
              anchor='from __future__ import annotations\n'
              if anchor not in s: raise SystemExit('future import anchor not found')
              s=s.replace(anchor, anchor+'\nfrom html import escape\nfrom .telegram import send_message\n',1)
          elif 'from html import escape' not in s:
              s=s.replace('from .telegram import send_message\n','from html import escape\nfrom .telegram import send_message\n',1)

          helper='''

def _push_rejected_actions(app, event: dict, actions) -> None:
    token = str(getattr(app, "telegram_bot_token", "") or "").strip()
    if not token:
        return
    now = int(time.time())
    try:
        signal_ts = int((event or {}).get("event_ts") or now)
    except Exception:
        signal_ts = now
    age = max(0, now - signal_ts)
    mint = str((event or {}).get("mint") or "unknown")
    leader = str((event or {}).get("leader_wallet") or "unknown")
    signature = str((event or {}).get("signature") or "")
    for row in (actions or []):
        if str((row or {}).get("action") or "").upper() != "REJECT":
            continue
        tid = str((row or {}).get("telegram_id") or "").strip()
        targets = [tid] if tid else []
        if not targets:
            try:
                for u in all_users(app.csv_dir, enabled_only=True):
                    uid = str(u.get("telegram_id") or "").strip()
                    if uid and _leader_rank(app, uid, leader) is not None:
                        targets.append(uid)
            except Exception:
                pass
        reason = str((row or {}).get("reason") or "unspecified rejection")[:900]
        text = chr(10).join([
            "⛔ <b>REJECTED OPPORTUNITY</b>",
            f"Asset: <code>{escape(mint)}</code>",
            f"Leader: <code>{escape(leader)}</code>",
            f"Reason: <code>{escape(reason)}</code>",
            f"Signal age: <b>{age}s</b>",
            f"Signature: <code>{escape(signature[:120])}</code>",
            "Decision: <b>NO TRADE</b>",
        ])
        for target in dict.fromkeys(x for x in targets if x):
            send_message(token, target, text, parse_mode="HTML", protect_content=True)

'''
          if 'def _push_rejected_actions(app, event: dict, actions)' not in s:
              marker='\ndef monitor_leaders(app):\n'
              if marker not in s: raise SystemExit('monitor_leaders marker not found')
              s=s.replace(marker,helper+marker,1)

          old='''                    if saved:
                        events.append(saved)
                        process_leader_event(app, saved)'''
          new='''                    if saved:
                        events.append(saved)
                        actions = process_leader_event(app, saved)
                        _push_rejected_actions(app, saved, actions)'''
          if new not in s:
              if old not in s: raise SystemExit('leader action-discard block not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          changed=1

          py="$LROOT/.venv/bin/python"; [[ -x "$py" ]] || py=python3
          PYTHONPATH="$LROOT" "$py" -m py_compile "$FILE"
          systemctl restart "$SERVICE"
          sleep 15
          test "$(systemctl is-active "$SERVICE")" = active
          r1=$(systemctl show "$SERVICE" -p NRestarts --value)
          sleep 5
          test "$(systemctl is-active "$SERVICE")" = active
          r2=$(systemctl show "$SERVICE" -p NRestarts --value)
          test "$r1" = "$r2"

          LROOT="$LROOT" "$py" - <<'PY'
          import os,time,csv,sys
          from pathlib import Path
          from dotenv import load_dotenv
          root=Path(os.environ['LROOT'])
          load_dotenv(root/'.env', override=False)
          sys.path.insert(0,str(root))
          from learnerbot import solana_sibot as sol
          class App:
              csv_dir=root/'CSVbot'
              telegram_bot_token=os.getenv('TELEGRAM_BOT_TOKEN','').strip()
          app=App()
          targets=[]
          with (root/'CSVbot'/'user_trading_settings.csv').open(encoding='utf-8-sig',newline='') as f:
              for r in csv.DictReader(f):
                  if r.get('setting')=='solana_live_enabled' and str(r.get('value') or '').lower()=='true':
                      tid=str(r.get('telegram_id') or '').strip()
                      if tid and tid!='900001': targets.append(tid)
          if not app.telegram_bot_token or not targets: raise SystemExit('Telegram route unavailable')
          sol._push_rejected_actions(app, {'mint':'TEST-NO-TRADE','leader_wallet':'TEST-REJECT-PATH','signature':'TEST-NO-CHAIN-SUBMISSION','event_ts':int(time.time())}, [{'telegram_id':targets[0],'action':'REJECT','reason':'Telegram rejected-opportunity delivery path restored — TEST ONLY'}])
          print('reject_telegram_test_sent=true')
          print('test_trade_placed=false')
          PY

          grep -q 'actions = process_leader_event(app, saved)' "$FILE"
          grep -q '_push_rejected_actions(app, saved, actions)' "$FILE"
          echo learner_service_active=true
          echo learner_restarts=$r2
          echo learner_reject_push=enabled
          echo TRADE_PLACED_BY_FIX=NO
          trap - EXIT
          ROOT
