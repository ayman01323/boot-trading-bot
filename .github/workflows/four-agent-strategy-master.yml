name: Four-Agent Strategy Master

on:
  workflow_run:
    workflows: ["Claude Fourth Strategy Agent"]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'Optional immutable strategy cycle; defaults to latest'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: four-agent-strategy-master
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GPT Master tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          npm install -g @openai/codex@latest
          codex --version

      - name: Resolve cycle and collect all four valid reports
        id: reports
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CYCLE: ${{ inputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .four_agent_master
          cycle="${INPUT_CYCLE:-}"
          if [[ -z "$cycle" ]]; then
            set +e
            cycle="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/strategy/latest_cycle_id.txt?ref=ai-reviews" \
              --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null | tr -d '\r\n')"
            rc=$?
            set -e
            if [[ $rc -ne 0 || -z "$cycle" ]]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [[ "$cycle" =~ ^[0-9a-f]{12}-[0-9]{10}-[0-9a-f]{8}$ ]] || { echo 'Invalid cycle id.' >&2; exit 2; }
          root="strategy/runs/${cycle}"

          get_file() {
            local path="$1" out="$2"
            set +e
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=ai-reviews" --jq '.content' 2>/dev/null \
              | tr -d '\n' | base64 -d > "$out" 2>/dev/null
            rc=$?
            set -e
            [[ $rc -eq 0 && -s "$out" ]]
          }

          get_file "${root}/context.json" .four_agent_master/context.json || {
            echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0;
          }
          python - <<'PY' > /tmp/four-agent-meta.env
          import json
          p=json.load(open('.four_agent_master/context.json'))
          print('SOURCE_SHA='+str(p.get('source_commit') or ''))
          print('EVIDENCE_SHA='+str(p.get('evidence_sha256') or ''))
          PY
          source /tmp/four-agent-meta.env
          test -n "$SOURCE_SHA"; test -n "$EVIDENCE_SHA"

          ready=true
          for provider in gpt gemini copilot claude; do
            out=".four_agent_master/${provider}.json"
            if ! get_file "${root}/${provider}.json" "$out"; then
              echo "${provider}: report not available yet"
              ready=false
              continue
            fi
            set +e
            PYTHONPATH="$GITHUB_WORKSPACE" python -m learnerbot.three_agent_strategy_contract validate-agent \
              --input "$out" --provider "$provider" --cycle-id "$cycle" \
              --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA" \
              > "/tmp/${provider}-four-agent-validate.txt" 2>&1
            rc=$?
            set -e
            status="$(python - "$out" <<'PY'
          import json,sys
          try: print(str(json.load(open(sys.argv[1])).get('status') or ''))
          except Exception: print('')
          PY
            )"
            if [[ $rc -ne 0 || "$status" == 'INCOMPLETE' ]]; then
              echo "${provider}: report incomplete or invalid"
              cat "/tmp/${provider}-four-agent-validate.txt" || true
              ready=false
            fi
          done

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "cycle_id=$cycle" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "evidence_sha=$EVIDENCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Skip until all four agents are valid
        if: steps.reports.outputs.ready != 'true'
        run: echo 'Four-agent set is not complete yet; scheduled reconciliation will retry.'

      - name: Skip if this exact cycle already has a four-agent decision
        if: steps.reports.outputs.ready == 'true'
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.reports.outputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          needed=true
          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/strategy/runs/${CYCLE_ID}/master_decision.json?ref=ai-reviews" \
            --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > /tmp/existing-four-agent-master.json 2>/dev/null
          rc=$?
          set -e
          if [[ $rc -eq 0 && -s /tmp/existing-four-agent-master.json ]]; then
            needed="$(python - <<'PY'
          import json
          try:
              p=json.load(open('/tmp/existing-four-agent-master.json'))
              print('false' if p.get('four_agent_evidence') is True else 'true')
          except Exception:
              print('true')
          PY
            )"
          fi
          echo "value=$needed" >> "$GITHUB_OUTPUT"

      - name: GPT Master adjudicates all four independent reports
        if: steps.reports.outputs.ready == 'true' && steps.needed.outputs.value == 'true'
        id: master
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_STRATEGY_SYNTH_MODEL: ${{ vars.OPENAI_STRATEGY_SYNTH_MODEL }}
          CYCLE_ID: ${{ steps.reports.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.reports.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.reports.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CODEX_API_KEY:-}"
          cat > /tmp/four-agent-master-prompt.txt <<EOF
          You are GPT MASTER for a four-agent trading-strategy review cycle.
          Exact cycle: ${CYCLE_ID}
          Exact source: ${SOURCE_SHA}
          Exact evidence SHA-256: ${EVIDENCE_SHA}

          Read .four_agent_master/gpt.json, gemini.json, copilot.json, claude.json and context.json.
          These are four INDEPENDENT reports over the same immutable source/evidence identity. Do not invent consensus.
          Code truth and measured evidence outrank vote count. A SHADOW auto-code recommendation needs at least 3 of the 4
          reviewers supporting it, confidence >=0.85, LOW/MEDIUM risk, explicit tests and only allow-listed Strategy Lab files.
          No LIVE, capital, wallet, signing, deployment, safety weakening or asset auto-enable is authorised.

          Return exactly one JSON object between MASTER_DECISION_JSON_BEGIN and MASTER_DECISION_JSON_END:
          {
            "schema_version":1,
            "cycle_id":"${CYCLE_ID}",
            "source_commit":"${SOURCE_SHA}",
            "evidence_sha256":"${EVIDENCE_SHA}",
            "status":"NO_ACTION|DRAFT_SHADOW_CHANGE|HUMAN_REVIEW_REQUIRED",
            "summary":"...",
            "four_agent_evidence":true,
            "decisions":[{
              "finding_id":"stable id",
              "source_proposal_ids":["provider:id"],
              "action":"KEEP|IMPROVE|REWORK|SHADOW_MORE|REPLACE|DORMANT|NEW_SHADOW|ASSET_REQUEST|RESEARCH_MORE",
              "strategy":"...",
              "disposition":"ACCEPT|REJECT|DEFER",
              "reason":"...",
              "confidence":0.0,
              "supporting_agents":["gpt","gemini","copilot","claude"],
              "risk_class":"LOW|MEDIUM|HIGH|CRITICAL",
              "shadow_only":true,
              "allowed_files":["exact Strategy Lab/SHADOW path"],
              "required_tests":["specific test"]
            }],
            "implementation_allowed":false,
            "live_auto_deploy":false,
            "draft_pr_only":true
          }
          EOF
          model_args=()
          if [[ -n "${OPENAI_STRATEGY_SYNTH_MODEL:-}" ]]; then model_args=(-m "$OPENAI_STRATEGY_SYNTH_MODEL"); fi
          codex --ask-for-approval never exec --sandbox danger-full-access --ephemeral "${model_args[@]}" - \
            < /tmp/four-agent-master-prompt.txt > /tmp/four-agent-master.stdout 2> /tmp/four-agent-master.stderr

          python - <<'PY'
          import json,re,pathlib
          raw=pathlib.Path('/tmp/four-agent-master.stdout').read_text(errors='replace')
          m=re.search(r'MASTER_DECISION_JSON_BEGIN\s*(\{.*?\})\s*MASTER_DECISION_JSON_END',raw,re.S)
          if not m: raise SystemExit('GPT four-agent master JSON markers missing')
          p=json.loads(m.group(1))
          if p.get('four_agent_evidence') is not True:
              raise SystemExit('GPT Master omitted four_agent_evidence=true')
          pathlib.Path('.four_agent_master/master_raw.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY

          PYTHONPATH="$GITHUB_WORKSPACE" python -m learnerbot.three_agent_strategy_contract gate-master \
            --input .four_agent_master/master_raw.json --output .four_agent_master/master_decision.json \
            --cycle-id "$CYCLE_ID" --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA"

      - name: Publish authoritative four-agent decision
        if: steps.reports.outputs.ready == 'true' && steps.needed.outputs.value == 'true' && steps.master.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.reports.outputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/four-agent-ai-reviews
          git worktree add --detach /tmp/four-agent-ai-reviews origin/ai-reviews
          dest="/tmp/four-agent-ai-reviews/strategy/runs/${CYCLE_ID}"
          mkdir -p "$dest"
          cp .four_agent_master/master_decision.json "$dest/master_decision.json"
          cp .four_agent_master/master_decision.json /tmp/four-agent-ai-reviews/strategy/latest_master_decision.json

          python - "$dest/master_decision.json" <<'PY' > "$dest/completion.json"
          import json,sys,time
          p=json.load(open(sys.argv[1]))
          print(json.dumps({
            'cycle_id':p['cycle_id'],
            'source_commit':p['source_commit'],
            'evidence_sha256':p['evidence_sha256'],
            'three_agent_reports_complete':True,
            'four_agent_reports_complete':True,
            'master_decision_available':True,
            'four_agent_master_decision_available':True,
            'four_agent_evidence':True,
            'valid_agent_count':4,
            'agents_used':['gpt','gemini','copilot'],
            'agents_adjudicated':['gpt','gemini','copilot','claude'],
            'compatibility_note':'agents_used retains the legacy three-agent set so the older reconciler does not overwrite this authoritative four-agent decision',
            'completed_epoch':int(time.time())
          },indent=2,sort_keys=True))
          PY

          python - /tmp/four-agent-ai-reviews/strategy/latest_status.json "$dest/master_decision.json" <<'PY'
          import json,sys
          status_path,master_path=sys.argv[1:3]
          s=json.load(open(status_path)); m=json.load(open(master_path))
          for name in ('gpt','gemini','copilot','claude'):
              s[name]='DONE'
          s['three_agent_reports_complete']=True
          s['four_agent_reports_complete']=True
          s['master_decision_available']=True
          s['four_agent_master_decision_available']=True
          s['master_status']=m.get('status','')
          s['four_agent_evidence']=True
          s['state']='MASTER_DECIDED_4_AGENT'
          s['live_auto_deploy']=False
          open(status_path,'w').write(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY

          cd /tmp/four-agent-ai-reviews
          git config user.name 'four-agent-strategy-master'
          git config user.email 'four-agent-strategy-master@users.noreply.github.com'
          git add "strategy/runs/${CYCLE_ID}/master_decision.json" "strategy/runs/${CYCLE_ID}/completion.json" \
                  strategy/latest_master_decision.json strategy/latest_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Adjudicate four-agent strategy cycle ${CYCLE_ID}"
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            git push origin HEAD:ai-reviews
          fi

      - name: Clean workspace
        if: always()
        run: rm -rf .four_agent_master /tmp/four-agent-ai-reviews /tmp/four-agent-master-prompt.txt /tmp/four-agent-master.stdout /tmp/four-agent-master.stderr
