name: Four-Agent Strategy Master

on:
  workflow_run:
    workflows: ["Claude Fourth Strategy Agent"]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delegate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delegate to Telegram-selected resilient MASTER
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run selected-ai-master.yml --ref main -f lane=strategy
          echo 'Four-agent completion is no longer required to keep the review cycle moving.'
