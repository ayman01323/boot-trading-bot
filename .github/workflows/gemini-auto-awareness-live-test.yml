name: Gemini Automatic Awareness Live Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awareness:
    name: Prove Gemini receives without polling
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 8
    env:
      BUS_URL: ws://127.0.0.1:8765
    steps:
      - name: Build isolated WebSocket test environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/gemini-awareness"
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "PY=$VENV/bin/python" >> "$GITHUB_ENV"

      - name: Prove automatic Gemini receipt and memory
        shell: bash
        run: |
          set -euo pipefail
          CODE="GEMINI-AWARE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export CODE
          "$PY" - <<'PY'
          import asyncio
          import json
          import os
          import re
          import time
          from websockets.asyncio.client import connect

          code = os.environ["CODE"]
          url = os.environ.get("BUS_URL", "ws://127.0.0.1:8765")
          token = os.environ.get("AI_AGENT_BUS_TOKEN", "")
          first_id = "gpt-to-gemini-awareness-" + re.sub(r"[^A-Za-z0-9._:-]", "-", code.lower())
          second_id = first_id + "-recall"
          first_body = (
              "AUTOMATIC AWARENESS TEST. You received this through Strategy Factory without being told to check GitHub, "
              f"a mailbox, or SQLite. Remember this exact code: {code}. Reply exactly: SEEN {code}"
          )

          async def register():
              ws = await connect(url, ping_interval=20, ping_timeout=20, max_size=32768)
              await ws.send(json.dumps({"type":"register","agent":"gpt","token":token}, separators=(",",":")))
              reg = json.loads(await asyncio.wait_for(ws.recv(), timeout=10))
              assert reg.get("type") == "registered", reg
              return ws

          async def first_send_disconnect_after_ack():
              ws = await register()
              try:
                  await ws.send(json.dumps({
                      "type":"send","message_id":first_id,"from":"gpt","to":"gemini","body":first_body
                  }, separators=(",",":"), ensure_ascii=False))
                  deadline = asyncio.get_running_loop().time() + 30
                  while True:
                      remaining = deadline - asyncio.get_running_loop().time()
                      assert remaining > 0, "Gemini did not ACK first automatic message"
                      data = json.loads(await asyncio.wait_for(ws.recv(), timeout=remaining))
                      if data.get("message_id") != first_id:
                          continue
                      print("FIRST_EVENT=" + json.dumps(data, ensure_ascii=False), flush=True)
                      status = str(data.get("status") or "").upper()
                      if status == "ACKNOWLEDGED":
                          break
              finally:
                  await ws.close()
              print("FIRST_SENDER_DISCONNECTED_AFTER_ACK=true", flush=True)

          async def wait_until_first_replied():
              deadline = time.time() + 90
              while time.time() < deadline:
                  ws = await register()
                  try:
                      await ws.send(json.dumps({"type":"status","message_id":first_id}, separators=(",",":")))
                      per_try = asyncio.get_running_loop().time() + 5
                      while True:
                          remaining = per_try - asyncio.get_running_loop().time()
                          if remaining <= 0:
                              break
                          data = json.loads(await asyncio.wait_for(ws.recv(), timeout=remaining))
                          if data.get("message_id") != first_id:
                              continue
                          print("FIRST_POST_DISCONNECT_EVENT=" + json.dumps(data, ensure_ascii=False), flush=True)
                          if data.get("type") == "status" and str(data.get("status") or "").upper() == "REPLIED":
                              return
                  finally:
                      await ws.close()
                  await asyncio.sleep(1)
              raise AssertionError("Gemini did not finish the first message after sender disconnected")

          async def recall_exchange():
              ws = await register()
              try:
                  body = (
                      "Do not inspect GitHub, a mailbox, or SQLite. From your own recent Strategy Factory conversation memory, "
                      f"give the exact code from the immediately previous automatic-awareness test message. Reply exactly: REMEMBERED {code}"
                  )
                  await ws.send(json.dumps({
                      "type":"send","message_id":second_id,"from":"gpt","to":"gemini","body":body
                  }, separators=(",",":"), ensure_ascii=False))
                  acknowledged = False
                  deadline = asyncio.get_running_loop().time() + 120
                  while True:
                      remaining = deadline - asyncio.get_running_loop().time()
                      assert remaining > 0, "timeout waiting for Gemini recall reply"
                      data = json.loads(await asyncio.wait_for(ws.recv(), timeout=remaining))
                      if data.get("message_id") != second_id:
                          continue
                      print("RECALL_EVENT=" + json.dumps(data, ensure_ascii=False), flush=True)
                      status = str(data.get("status") or "").upper()
                      if status == "ACKNOWLEDGED":
                          acknowledged = True
                      if data.get("type") == "reply":
                          assert acknowledged, "reply arrived without correlated ACK"
                          reply = str(data.get("body") or "")
                          assert f"REMEMBERED {code}" in reply, reply
                          print(f"AUTOMATIC_AWARENESS_PROVED={code}", flush=True)
                          return
              finally:
                  await ws.close()

          async def main():
              await first_send_disconnect_after_ack()
              await wait_until_first_replied()
              await recall_exchange()

          asyncio.run(main())
          PY

      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/gemini-awareness"
