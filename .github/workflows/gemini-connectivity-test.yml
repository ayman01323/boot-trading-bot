name: Gemini Connectivity Test
# Self-reporting push-context connectivity test; writes only a sanitised result.

on:
  push:
    branches:
      - test/gemini-connectivity
    paths:
      - '.github/workflows/gemini-connectivity-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/gemini-connectivity-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-gemini:
    name: Verify GitHub to Gemini API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google GenAI SDK
        run: python -m pip install --disable-pip-version-check --quiet google-genai

      - name: Test Gemini and write sanitised result
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-pro-preview' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from google import genai

          api_key = os.environ.get('GEMINI_API_KEY', '').strip()
          model = os.environ.get('GEMINI_MODEL', 'gemini-3.1-pro-preview').strip()
          status = 'KEY_MISSING'
          detail = 'GitHub Actions did not provide GEMINI_API_KEY.'

          if api_key:
              try:
                  client = genai.Client(api_key=api_key)
                  response = client.models.generate_content(
                      model=model,
                      contents='This is a connectivity test. Reply with exactly GEMINI_GITHUB_OK and nothing else.'
                  )
                  text = (response.text or '').strip()
                  if text == 'GEMINI_GITHUB_OK':
                      status = 'PASS'
                      detail = 'Gemini API returned the required exact response.'
                  else:
                      status = 'BAD_RESPONSE'
                      detail = 'Gemini API responded, but not with the required exact response.'
              except Exception as exc:
                  status = 'API_ERROR'
                  code = getattr(exc, 'code', None) or getattr(exc, 'status_code', None)
                  detail = f'{type(exc).__name__}' + (f' code={code}' if code is not None else '')

          Path('.github/gemini-connectivity-result.txt').write_text(
              f'STATUS={status}\nMODEL={model}\nDETAIL={detail}\n',
              encoding='utf-8'
          )
          print(f'Gemini connectivity status: {status}')
          PY

      - name: Publish sanitised push-context result
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/gemini-connectivity-result.txt
          if git diff --cached --quiet; then
            echo 'No result change to publish.'
            exit 0
          fi
          git commit -m 'Record Gemini connectivity test result'
          git push origin HEAD:test/gemini-connectivity

      - name: Show sanitised result
        if: always()
        run: cat .github/gemini-connectivity-result.txt || true
