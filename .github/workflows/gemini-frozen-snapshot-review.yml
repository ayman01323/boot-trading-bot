name: Gemini Frozen Snapshot Review

on:
  push:
    branches:
      - ai/gemini-work-20260819-1322
    paths:
      - '.github/workflows/gemini-frozen-snapshot-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/gemini-work-20260819-1322
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frozen snapshot context
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin audit-status:audit-status || true
          git show audit-status:latest_loss_forensics.json > /tmp/latest_loss_forensics.json 2>/dev/null || printf '{}\n' > /tmp/latest_loss_forensics.json
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          brief = Path('AI_WORK_BRIEF_20260819.md').read_text(encoding='utf-8', errors='replace')
          audit = Path('/tmp/latest_loss_forensics.json').read_text(encoding='utf-8', errors='replace')
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          rx = re.compile(r'(strategy|trade|trading|profit|loss|solana|execution|risk|position|route|arbitrage|intelligence|audit|market|pool|token|capital|exit|entry|main)', re.I)
          selected=[]
          for f in files:
              if f.endswith(('.zip','.png','.jpg','.jpeg','.pdf','.sqlite','.sqlite3','.db','.pyc')):
                  continue
              if not (f.startswith(('learnerbot/','scripts/','tests/')) or f in ('README.md','requirements.txt','pyproject.toml')):
                  continue
              if not rx.search(f):
                  continue
              p=Path(f)
              if not p.is_file() or p.stat().st_size > 80000:
                  continue
              selected.append(f)
          selected=selected[:120]
          chunks=[]; total=0
          for f in selected:
              text=Path(f).read_text(encoding='utf-8', errors='replace')[:30000]
              block=f'\n\n===== FILE: {f} =====\n{text}'
              if total+len(block) > 420000:
                  break
              chunks.append(block); total += len(block)
          context={'brief':brief,'latest_sanitised_trading_evidence':audit[:180000],'tracked_file_index':files[:1500],'selected_code':''.join(chunks)}
          Path('/tmp/ai_context.json').write_text(json.dumps(context),encoding='utf-8')
          print(f'selected_files={len(chunks)} context_chars={len(json.dumps(context))}')
          PY

      - name: Run independent Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-pro-preview' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          key=os.environ.get('GEMINI_API_KEY','').strip()
          if not key:
              raise SystemExit('GEMINI_API_KEY is not configured')
          model=os.environ.get('GEMINI_MODEL','gemini-3.1-pro-preview').strip()
          context=json.loads(Path('/tmp/ai_context.json').read_text(encoding='utf-8'))
          prompt='''You are the Gemini independent reviewer for a frozen cryptocurrency trading-bot code snapshot. Use only supplied code and sanitised evidence. Optimise durable realised NET P&L after measurable costs, not win count. Diagnose code/strategy weaknesses, loss magnitude, execution/exit failures, participation, costs, data quality and over-protection. Do not recommend named-asset trades. Do not authorise live changes. New or materially changed strategies must start SHADOW. Return exactly one JSON object with keys: provider, status, executive_summary, strategy_assessment, code_findings, new_hypotheses, must_not_change, recommended_next_action, no_live_changes. strategy_assessment must be an array with strategy/name, action (KEEP|IMPROVE|REWORK|SHADOW_MORE|DORMANT|REPLACE), evidence, rationale, shadow_test. code_findings must include severity, area, evidence, proposed_change, downside_risk, test_required. new_hypotheses max 2 and each must include market_regime, hypothesis, entry_logic, exit_logic, data_required, costs, failure_modes, shadow_experiment, minimum_observations, minimum_trades, falsification. Set no_live_changes=true.\n\nFROZEN SNAPSHOT CONTEXT:\n'''+json.dumps(context)
          body={'systemInstruction':{'parts':[{'text':'Return valid JSON only. Never authorise live trading changes.'}]},'contents':[{'role':'user','parts':[{'text':prompt}]}],'generationConfig':{'responseMimeType':'application/json','temperature':0.1}}
          req=urllib.request.Request(f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent',data=json.dumps(body).encode('utf-8'),headers={'Content-Type':'application/json','x-goog-api-key':key},method='POST')
          with urllib.request.urlopen(req,timeout=180) as resp:
              payload=json.loads(resp.read().decode('utf-8'))
          text=''.join(str(part.get('text') or '') for cand in payload.get('candidates') or [] for part in ((cand.get('content') or {}).get('parts') or []) if isinstance(part,dict)).strip()
          data=json.loads(text)
          if data.get('no_live_changes') is not True:
              raise SystemExit('Gemini review failed no_live_changes gate')
          data['provider']='gemini'; data['model']=model
          Path('AI_PROPOSALS_GEMINI.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          md=['# Gemini Frozen Snapshot Review','',f'**Model:** `{model}`','',f"## Status\n{data.get('status','')}",'',f"## Executive summary\n{data.get('executive_summary','')}",'','## Strategy assessment']
          for s in data.get('strategy_assessment') or []:
              md += [f"### {s.get('strategy') or s.get('name') or 'Strategy'} — {s.get('action','')}",str(s.get('rationale','')),f"Evidence: {s.get('evidence','')}",f"Shadow test: {s.get('shadow_test','')}",'']
          md += ['## Recommended next action',str(data.get('recommended_next_action','')),'','## Must not change']
          md += [f'- {x}' for x in (data.get('must_not_change') or [])]
          Path('AI_REVIEW_GEMINI.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print('Gemini frozen snapshot review completed safely.')
          PY

      - name: Commit Gemini review to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gemini-snapshot-review-bot'
          git config user.email 'gemini-snapshot-review-bot@users.noreply.github.com'
          git add AI_REVIEW_GEMINI.md AI_PROPOSALS_GEMINI.json
          git commit -m 'Gemini review frozen AI workspace snapshot'
          git push origin HEAD:ai/gemini-work-20260819-1322
