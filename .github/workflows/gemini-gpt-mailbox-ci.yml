name: Gemini GPT Mailbox CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gemini_git_mailbox_bridge.py'
      - '.github/workflows/gemini-mailbox-signal.yml'
      - '.github/workflows/gemini-git-mailbox-bridge.yml'
      - '.github/workflows/gemini-gpt-mailbox-ci.yml'
      - 'tests/test_gemini_git_mailbox_bridge.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 15
    steps:
      - name: Check out tested ref without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run focused mailbox tests in isolated Python 3.11 venv
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.11 >/dev/null 2>&1
          venv="/tmp/gemini-gpt-mailbox-ci-${GITHUB_RUN_ID}"
          rm -rf "$venv"
          python3.11 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q pytest pyyaml python-dotenv
          "$venv/bin/python" -m py_compile \
            scripts/gemini_git_mailbox_bridge.py \
            scripts/claude_git_mailbox_bridge.py \
            scripts/ai_agent_bus.py \
            scripts/run_ai_agent_bus.py \
            tests/test_gemini_git_mailbox_bridge.py
          "$venv/bin/python" -m pytest -q \
            tests/test_gemini_git_mailbox_bridge.py \
            tests/test_claude_git_mailbox_bridge.py \
            tests/test_ai_agent_bus.py
          rm -rf "$venv"
