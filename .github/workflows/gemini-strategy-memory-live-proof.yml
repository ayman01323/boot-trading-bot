name: Gemini Strategy Factory Memory Live Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gemini-strategy-memory-live-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Deploy exact current main through restricted wrapper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployed=''
          for attempt in 1 2 3 4 5; do
            target="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
            echo "deploy_attempt=${attempt} target=${target}"
            set +e
            sudo /usr/local/sbin/deploy-boot-trading-bot "$target" 2>&1 | tee /tmp/gemini-memory-deploy.txt
            rc=${PIPESTATUS[0]}
            set -e
            if [[ "$rc" -eq 0 ]]; then
              deployed="$target"
              break
            fi
            if [[ "$rc" -ne 6 ]]; then
              exit "$rc"
            fi
            sleep 1
          done
          test -n "$deployed"
          echo "DEPLOYED_SHA=$deployed" >> "$GITHUB_ENV"

      - name: Verify running production SHA and six-agent runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/status-boot-trading-bot 2>&1 | tee /tmp/gemini-memory-runtime-status.txt
          running="$(sed -n 's/^sha:[[:space:]]*//p' /tmp/gemini-memory-runtime-status.txt | head -n1 | tr -d '[:space:]')"
          echo "running_sha=$running"
          echo "expected_sha=$DEPLOYED_SHA"
          test "$running" = "$DEPLOYED_SHA"
          python3 - <<'PY'
          import json
          p='/var/tmp/boot/ai_agent_ws_status.json'
          d=json.load(open(p,encoding='utf-8'))
          print(json.dumps(d,sort_keys=True))
          assert d.get('state') == 'ACTIVE', d
          workers=set(d.get('workers') or [])
          expected={'gpt','claude','gemini','deepseek','grok','copilot'}
          assert expected.issubset(workers), (workers, expected)
          PY

      - name: Build isolated sender environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/gemini-strategy-memory-proof"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Seed unique GPT to Gemini production exchange
        shell: bash
        run: |
          set -euo pipefail
          seed="PRODUCTION_MEMORY_PROOF_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "MEMORY_SEED=$seed" >> "$GITHUB_ENV"
          "$VENV/bin/python" scripts/ai_agent_ws_send.py \
            --from gpt \
            --to gemini \
            --message "$seed. Reply only: ${seed}_ACK" \
            --timeout 180 | tee /tmp/gemini-memory-seed.txt
          grep -q '"status": "ACKNOWLEDGED"' /tmp/gemini-memory-seed.txt
          grep -q '"status": "REPLIED"' /tmp/gemini-memory-seed.txt
          grep -q "${seed}_ACK" /tmp/gemini-memory-seed.txt

      - name: Prove Gemini recalls immediately previous GPT message
        shell: bash
        run: |
          set -euo pipefail
          question='Using only your Strategy Factory conversation memory, quote the exact immediately previous message GPT sent you. Do not infer or invent it.'
          "$VENV/bin/python" scripts/ai_agent_ws_send.py \
            --from gpt \
            --to gemini \
            --message "$question" \
            --timeout 180 | tee /tmp/gemini-memory-recall.txt
          grep -q '"status": "ACKNOWLEDGED"' /tmp/gemini-memory-recall.txt
          grep -q '"status": "REPLIED"' /tmp/gemini-memory-recall.txt
          grep -q "$MEMORY_SEED" /tmp/gemini-memory-recall.txt

      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf "$VENV"
