name: Sync Gemini Telegram Runtime Secret

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/gemini-telegram-runtime.trigger'

permissions:
  contents: read

concurrency:
  group: gemini-telegram-runtime-secret
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    env:
      GEMINI_TELEGRAM_BOT_TOKEN: ${{ secrets.GEMINI_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Write Gemini Telegram runtime secret without logging value
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${GEMINI_TELEGRAM_BOT_TOKEN:-}"
          target=/var/tmp/gemini_telegram_runtime.env
          tmp="$(mktemp /var/tmp/.gemini-telegram-runtime.XXXXXX)"
          TOKEN="$GEMINI_TELEGRAM_BOT_TOKEN" TMP="$tmp" python3 - <<'PY'
          import json, os, pathlib
          value = str(os.environ.get('TOKEN') or '').strip()
          if not value:
              raise SystemExit('GEMINI_TELEGRAM_BOT_TOKEN is missing')
          pathlib.Path(os.environ['TMP']).write_text(
              'GEMINI_TELEGRAM_BOT_TOKEN=' + json.dumps(value) + '\n',
              encoding='utf-8',
          )
          PY
          chmod 600 "$tmp"
          mv -f "$tmp" "$target"
          test -s "$target"
          echo 'Gemini Telegram runtime secret synced: PRESENT (value redacted).'

      - name: Verify token with Telegram without printing it
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/gemini-telegram-getme.json -w '%{http_code}' \
            "https://api.telegram.org/bot${GEMINI_TELEGRAM_BOT_TOKEN}/getMe")"
          test "$code" = 200
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/gemini-telegram-getme.json', encoding='utf-8'))
          if body.get('ok') is not True:
              raise SystemExit('Telegram getMe did not return ok=true')
          result=body.get('result') or {}
          print('Gemini Telegram token validation: WORKING')
          print('Bot username: @' + str(result.get('username') or 'unknown'))
          PY
          rm -f /tmp/gemini-telegram-getme.json
