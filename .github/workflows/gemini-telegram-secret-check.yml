name: Gemini Telegram Secret Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-telegram-secret-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# Connectivity/authentication check only. Never changes trading state.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GEMINI_TELEGRAM_BOT_TOKEN: ${{ secrets.GEMINI_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Verify secret is present and Telegram token authenticates
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GEMINI_TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo 'gemini_telegram_secret_present=false'
            exit 1
          fi
          echo 'gemini_telegram_secret_present=true'
          response="$(curl -fsS --max-time 15 "https://api.telegram.org/bot${GEMINI_TELEGRAM_BOT_TOKEN}/getMe")"
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RESPONSE'])
          ok = bool(data.get('ok')) and bool((data.get('result') or {}).get('is_bot'))
          print(f'gemini_telegram_auth_ok={str(ok).lower()}')
          if not ok:
              raise SystemExit(1)
          PY
