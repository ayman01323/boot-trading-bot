name: Gemini WebSocket v2 Live Test

on:
  pull_request:
    paths:
      - '.github/workflows/gemini-ws-v2-live-test.yml'

permissions:
  contents: read

jobs:
  gemini-live-test:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build isolated probe environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/gemini-ws-v2-live-test"
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "VENV=$VENV" >> "$GITHUB_ENV"

      - name: Test GPT to Gemini alert and reply
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gemini-alert.jsonl"
          "$VENV/bin/python" scripts/ai_agent_ws_send.py \
            --from gpt \
            --to gemini \
            --message 'Reply exactly: GEMINI_WS_ALERT_OK' \
            --message-id "gpt-to-gemini-alert-${GITHUB_RUN_ID}" \
            --timeout 120 | tee "$out"
          grep -q 'ACKNOWLEDGED' "$out"
          grep -q 'GEMINI_WS_ALERT_OK' "$out"

      - name: Test Gemini bounded v2 execution
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gemini-task.jsonl"
          "$VENV/bin/python" scripts/ai_agent_ws_send.py \
            --from gpt \
            --to gemini \
            --task-action READ_FILE \
            --task-args-json '{"path":"AI_AGENT_MESSAGING.md"}' \
            --task-instruction 'Read this safe repository file and return execution evidence.' \
            --message-id "gpt-to-gemini-task-${GITHUB_RUN_ID}" \
            --timeout 120 | tee "$out"
          grep -q 'ACKNOWLEDGED' "$out"
          grep -q 'ACCEPTED' "$out"
          grep -q 'EXECUTING' "$out"
          grep -q 'COMPLETED' "$out"
          grep -q 'AI_AGENT_MESSAGING.md' "$out"

      - name: Clean probe environment
        if: always()
        shell: bash
        run: rm -rf "$VENV"
