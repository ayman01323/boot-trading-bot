name: Google Production Cutover Preflight

on:
  push:
    branches:
      - migration/google-production-cutover
    paths:
      - '.github/workflows/google-production-cutover-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    env:
      STAGING_DIR: /home/ayman01323/NamecheapMigration/multichain-learning-bot-v2.2-fast-direct-market
      FINAL_DIR: /root/multichain-learning-bot-v2.2-fast-direct-market
      CLAUDE_ROOT: /home/ayman01323/ClaudeServer
    steps:
      - name: Inspect Google migration prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "hostname=$(hostname)"
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          echo "python=$(python3 --version 2>&1)"
          echo "os=$( . /etc/os-release && printf '%s %s' "$ID" "$VERSION_ID" )"
          echo "sudo_noninteractive=$({ sudo -n true >/dev/null 2>&1 && echo true; } || echo false)"
          echo "root_traverse=$({ test -x /root && echo true; } || echo false)"
          echo "final_dir_visible=$({ test -d "$FINAL_DIR" && echo true; } || echo false)"
          test -d "$STAGING_DIR"
          test -d "$STAGING_DIR/.git"
          test -d "$STAGING_DIR/learnerbot"
          echo "staging_size=$(du -sh "$STAGING_DIR" | awk '{print $1}')"
          echo "staging_files=$(find "$STAGING_DIR" -xdev -type f 2>/dev/null | wc -l)"
          echo "staging_sha=$(git -C "$STAGING_DIR" rev-parse HEAD)"
          echo "requirements_present=$([[ -f "$STAGING_DIR/requirements.txt" ]] && echo true || echo false)"
          echo "service_file_present=$([[ -f "$STAGING_DIR/systemd/learnerbot.service" ]] && echo true || echo false)"
          echo "copied_venv_present=$([[ -d "$STAGING_DIR/.venv" ]] && echo true || echo false)"
          echo "claude_root_present=$([[ -d "$CLAUDE_ROOT" ]] && echo true || echo false)"
          echo "learnerbot_service=$(systemctl is-active learnerbot.service 2>/dev/null || true)"
          echo "production_service=$(systemctl is-active learnerbot-production.service 2>/dev/null || true)"
          echo "claude_service=$(systemctl is-active claude-trading-bot.service 2>/dev/null || true)"
          echo "processes_from_staging=$(pgrep -af "$STAGING_DIR" 2>/dev/null | wc -l)"
          df -h /
