name: Google Runner Connectivity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-runner-connectivity.yml'
      - '.github/google-gpt-credential-sync.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connectivity:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 7
    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "hostname=$(hostname)"
          echo "user=$(whoami)"
          echo "kernel=$(uname -srmo)"
          echo "python=$(python3 --version 2>&1 || true)"

      - name: Validate and sync OpenAI credential without logging it
        id: sync_openai
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"

          # First prove this exact GitHub secret is accepted from the Google VM.
          code="$(curl -sS -o /tmp/google-openai-auth.json -w '%{http_code}' \
            https://api.openai.com/v1/models \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H 'Accept: application/json')"
          echo "openai_auth_http=${code}"
          test "$code" = "200"

          key_file="$(mktemp /tmp/google-openai-key.XXXXXX)"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s' "$OPENAI_API_KEY" > "$key_file"
          chmod 600 "$key_file"

          target=/var/tmp/boot/ai_council_runtime.env
          if sudo -n true 2>/dev/null; then
            sudo install -d -m 0755 /var/tmp/boot
            sudo env KEY_FILE="$key_file" TARGET="$target" python3 - <<'PY'
          import json, os, pathlib
          key = pathlib.Path(os.environ['KEY_FILE']).read_text(encoding='utf-8').strip()
          if not key:
              raise SystemExit('OpenAI credential is empty')
          target = pathlib.Path(os.environ['TARGET'])
          existing = target.read_text(encoding='utf-8', errors='replace').splitlines() if target.exists() else []
          kept = [line for line in existing if not line.lstrip().startswith('OPENAI_API_KEY=')]
          kept.append('OPENAI_API_KEY=' + json.dumps(key))
          tmp = target.with_name('.' + target.name + '.tmp')
          tmp.write_text('\n'.join(kept) + '\n', encoding='utf-8')
          os.chmod(tmp, 0o600)
          os.replace(tmp, target)
          os.chown(target, 0, 0)
          PY
            sudo chmod 600 "$target"
            sudo systemctl restart boot-ai-agent-worker@gpt.service
          else
            test -w "$(dirname "$target")" || {
              echo 'Google runner has neither passwordless sudo nor write access to the AI runtime directory.' >&2
              exit 1
            }
            KEY_FILE="$key_file" TARGET="$target" python3 - <<'PY'
          import json, os, pathlib
          key = pathlib.Path(os.environ['KEY_FILE']).read_text(encoding='utf-8').strip()
          if not key:
              raise SystemExit('OpenAI credential is empty')
          target = pathlib.Path(os.environ['TARGET'])
          existing = target.read_text(encoding='utf-8', errors='replace').splitlines() if target.exists() else []
          kept = [line for line in existing if not line.lstrip().startswith('OPENAI_API_KEY=')]
          kept.append('OPENAI_API_KEY=' + json.dumps(key))
          tmp = target.with_name('.' + target.name + '.tmp')
          tmp.write_text('\n'.join(kept) + '\n', encoding='utf-8')
          os.chmod(tmp, 0o600)
          os.replace(tmp, target)
          PY
            chmod 600 "$target"
            systemctl restart boot-ai-agent-worker@gpt.service
          fi

          test -s "$target"
          test "$(stat -c '%a' "$target")" = "600"
          grep -q '^OPENAI_API_KEY=' "$target"
          echo 'google_openai_runtime=refreshed'

      - name: GPT and bus status
        shell: bash
        run: |
          set -euo pipefail
          echo "bus=$(systemctl is-active boot-ai-agent-bus.service || true)"
          echo "gpt=$(systemctl is-active boot-ai-agent-worker@gpt.service || true)"
          test "$(systemctl is-active boot-ai-agent-bus.service)" = "active"
          test "$(systemctl is-active boot-ai-agent-worker@gpt.service)" = "active"

      - name: Live GPT provider test
        id: live_gpt
        shell: bash
        run: |
          set -uo pipefail
          rm -f /tmp/google-gpt-live-result /tmp/google-gpt-live.out
          cd /opt/boot-ai-agent-bus
          RC=0
          OUT="$(PYTHONPATH=/opt/boot-ai-agent-bus ./.venv/bin/python scripts/ai_agent_ws_send.py --from gemini --to gpt --subject 'google-live-gpt-test' --message 'Reply exactly: GPT_GOOGLE_LIVE_OK' --timeout 120 2>&1)" || RC=$?
          printf '%s\n' "$OUT" > /tmp/google-gpt-live.out
          printf '%s\n' "$OUT"
          echo "sender_rc=$RC"
          if [[ "$RC" -eq 0 ]] && grep -q 'GPT_GOOGLE_LIVE_OK' <<<"$OUT"; then
            printf 'PASS\n' > /tmp/google-gpt-live-result
            exit 0
          fi
          printf 'FAIL\n' > /tmp/google-gpt-live-result
          exit 1

      - name: Publish redacted Google GPT verification
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=/var/tmp/boot/ai_council_runtime.env
          live_result="$(cat /tmp/google-gpt-live-result 2>/dev/null || echo NOT_RUN)"
          auth_http="$(grep -o '"status"[[:space:]]*:[[:space:]]*[0-9]*' /tmp/google-openai-auth.json 2>/dev/null | head -1 | grep -o '[0-9]*' || true)"
          {
            echo "hostname=$(hostname)"
            echo "user=$(whoami)"
            echo "verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "bus=$(systemctl is-active boot-ai-agent-bus.service || true)"
            echo "gpt_worker=$(systemctl is-active boot-ai-agent-worker@gpt.service || true)"
            echo "runtime_file_present=$([[ -f "$target" ]] && echo true || echo false)"
            echo "runtime_file_mode=$([[ -f "$target" ]] && stat -c '%a' "$target" || echo missing)"
            echo "runtime_file_owner=$([[ -f "$target" ]] && stat -c '%U:%G' "$target" || echo missing)"
            echo "openai_key_present=$([[ -f "$target" ]] && grep -q '^OPENAI_API_KEY=' "$target" && echo true || echo false)"
            echo "live_gpt_test=$live_result"
          } > /tmp/google-gpt-verification.txt

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/google-gpt-verification.txt"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/google-gpt-verification.txt)"
          if [[ -n "$existing_sha" ]]; then
            payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({'message':'Update Google GPT verification','content':sys.argv[1],'sha':sys.argv[2],'branch':'server-diagnostics'}))
          PY
          )"
          else
            payload="$(python3 - "$encoded" <<'PY'
          import json,sys
          print(json.dumps({'message':'Create Google GPT verification','content':sys.argv[1],'branch':'server-diagnostics'}))
          PY
          )"
          fi
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$payload" >/dev/null
          cat /tmp/google-gpt-verification.txt

      - name: Resource snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "cpus=$(nproc)"
          free -h
          df -h /
