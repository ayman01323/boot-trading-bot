name: Google Runner Connectivity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-runner-connectivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "hostname=$(hostname)"
          echo "user=$(whoami)"
          echo "kernel=$(uname -srmo)"
          echo "python=$(python3 --version 2>&1 || true)"

      - name: GPT and bus status
        shell: bash
        run: |
          set -euo pipefail
          echo "bus=$(systemctl is-active boot-ai-agent-bus.service || true)"
          echo "gpt=$(systemctl is-active boot-ai-agent-worker@gpt.service || true)"
          test "$(systemctl is-active boot-ai-agent-bus.service)" = "active"
          test "$(systemctl is-active boot-ai-agent-worker@gpt.service)" = "active"

      - name: Live GPT provider test
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/boot-ai-agent-bus
          OUT="$(PYTHONPATH=/opt/boot-ai-agent-bus ./.venv/bin/python scripts/ai_agent_ws_send.py --from gemini --to gpt --subject 'google-live-gpt-test' --message 'Reply exactly: GPT_GOOGLE_LIVE_OK' --timeout 120 2>&1)"
          printf '%s\n' "$OUT"
          grep -q 'GPT_GOOGLE_LIVE_OK' <<<"$OUT"

      - name: Resource snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo "cpus=$(nproc)"
          free -h
          df -h /
