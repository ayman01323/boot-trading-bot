name: Google Server Daily Backup

on:
  # 03:00 Europe/London, DST-safe: schedule both UTC equivalents and gate locally.
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/google-server-daily-backup.yml'

permissions:
  contents: read

concurrency:
  group: google-server-daily-backup
  cancel-in-progress: false

jobs:
  user-folders:
    name: Backup ClaudeServer and BOOT
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 180
    env:
      DEST_ROOT: /home/ayman01323/GoogleServerBuckup
      CLAUDE: /home/ayman01323/ClaudeServer
      BOOT: /home/ayman01323/BOOT
      RETENTION_DAYS: '30'
      TZ: Europe/London
    steps:
      - name: Check 03:00 London schedule gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$(date +%H)" != "03" ]; then
            echo "run_backup=false" >> "$GITHUB_OUTPUT"
            echo "No-op: London local hour is $(date +%H), not 03."
          else
            echo "run_backup=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding at $(date '+%Y-%m-%d %H:%M:%S %Z')."
          fi

      - name: Verify user-owned sources
        if: steps.gate.outputs.run_backup == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          test -d "$CLAUDE" && test -r "$CLAUDE" && test -x "$CLAUDE"
          test -d "$BOOT" && test -r "$BOOT" && test -x "$BOOT"
          mkdir -p "$DEST_ROOT"
          chmod 700 "$DEST_ROOT"
          df -h "$DEST_ROOT"

      - name: Create verified ClaudeServer and BOOT archives
        if: steps.gate.outputs.run_backup == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BACKUP_DATE="$(date +%Y-%m-%d)"
          DAY_DIR="$DEST_ROOT/$BACKUP_DATE"
          WORK="$(mktemp -d /tmp/google-user-backup.XXXXXX)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$DAY_DIR"
          chmod 700 "$DAY_DIR"

          make_archive() {
            label="$1"
            source="$2"
            parent="$(dirname "$source")"
            base="$(basename "$source")"
            tar -C "$parent" -czf "$WORK/${label}.tar.gz" "$base"
            chmod 600 "$WORK/${label}.tar.gz"
            tar -tzf "$WORK/${label}.tar.gz" >/dev/null
            (cd "$WORK" && sha256sum "${label}.tar.gz" > "${label}.tar.gz.sha256")
            chmod 600 "$WORK/${label}.tar.gz.sha256"
          }

          make_archive claude-server "$CLAUDE"
          make_archive boot "$BOOT"

          cat > "$WORK/google-user-folders-manifest.txt" <<EOF
          backup_date=$BACKUP_DATE
          created_london=$(date '+%Y-%m-%d %H:%M:%S %Z')
          created_utc=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          hostname=$(hostname)
          claude_source=$CLAUDE
          boot_source=$BOOT
          destination=$DAY_DIR
          EOF
          chmod 600 "$WORK/google-user-folders-manifest.txt"

          mv -f "$WORK"/* "$DAY_DIR"/
          chmod 600 "$DAY_DIR"/claude-server.tar.gz "$DAY_DIR"/claude-server.tar.gz.sha256 \
                    "$DAY_DIR"/boot.tar.gz "$DAY_DIR"/boot.tar.gz.sha256 \
                    "$DAY_DIR"/google-user-folders-manifest.txt
          cd "$DAY_DIR"
          sha256sum -c claude-server.tar.gz.sha256
          sha256sum -c boot.tar.gz.sha256
          echo "User-folder backup completed: $DAY_DIR"
          ls -lh "$DAY_DIR"

      - name: Apply retention policy
        if: steps.gate.outputs.run_backup == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find "$DEST_ROOT" -mindepth 1 -maxdepth 1 -type d \
            -regextype posix-extended -regex '.*/[0-9]{4}-[0-9]{2}-[0-9]{2}' \
            -mtime +"$RETENTION_DAYS" -print -exec rm -rf {} +

  root-folders:
    name: Backup production and SiRisky via restricted root helper
    needs: user-folders
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 180
    env:
      TZ: Europe/London
    steps:
      - name: Check 03:00 London schedule gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$(date +%H)" != "03" ]; then
            echo "run_backup=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_backup=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run fixed-purpose root backup helper
        if: steps.gate.outputs.run_backup == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          if [ ! -x /usr/local/sbin/google-root-backup ]; then
            echo 'ERROR: /usr/local/sbin/google-root-backup is not installed.' >&2
            echo 'A one-time root installation is required; broad passwordless sudo is intentionally not used.' >&2
            exit 1
          fi
          sudo -n /usr/local/sbin/google-root-backup
