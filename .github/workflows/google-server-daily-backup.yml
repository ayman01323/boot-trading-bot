name: Google Server Daily Backup

on:
  schedule:
    - cron: '0 3 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-server-daily-backup
  cancel-in-progress: false

jobs:
  boot:
    name: Backup BOOT project folder
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 180
    env:
      DEST_ROOT: /home/ayman01323/GoogleServerBuckup
      BOOT: /home/ayman01323/BOOT
      RETENTION_DAYS: '30'
      TZ: Europe/London
    steps:
      - name: Verify BOOT source
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          test -d "$BOOT" && test -r "$BOOT" && test -x "$BOOT"
          mkdir -p "$DEST_ROOT"
          chmod 700 "$DEST_ROOT"
          df -h "$DEST_ROOT"

      - name: Create verified BOOT archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BACKUP_DATE="$(date +%Y-%m-%d)"
          DAY_DIR="$DEST_ROOT/$BACKUP_DATE"
          WORK="$(mktemp -d /tmp/google-boot-backup.XXXXXX)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$DAY_DIR"
          chmod 700 "$DAY_DIR"

          tar -C "$(dirname "$BOOT")" -czf "$WORK/boot.tar.gz" "$(basename "$BOOT")"
          chmod 600 "$WORK/boot.tar.gz"
          tar -tzf "$WORK/boot.tar.gz" >/dev/null
          (cd "$WORK" && sha256sum boot.tar.gz > boot.tar.gz.sha256)
          chmod 600 "$WORK/boot.tar.gz.sha256"

          cat > "$WORK/google-boot-manifest.txt" <<EOF
          backup_date=$BACKUP_DATE
          created_london=$(date '+%Y-%m-%d %H:%M:%S %Z')
          created_utc=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          hostname=$(hostname)
          boot_source=$BOOT
          destination=$DAY_DIR
          EOF
          chmod 600 "$WORK/google-boot-manifest.txt"

          mv -f "$WORK/boot.tar.gz" "$DAY_DIR/boot.tar.gz"
          mv -f "$WORK/boot.tar.gz.sha256" "$DAY_DIR/boot.tar.gz.sha256"
          mv -f "$WORK/google-boot-manifest.txt" "$DAY_DIR/google-boot-manifest.txt"
          cd "$DAY_DIR"
          sha256sum -c boot.tar.gz.sha256
          echo "BOOT backup completed: $DAY_DIR"
          ls -lh "$DAY_DIR/boot.tar.gz" "$DAY_DIR/boot.tar.gz.sha256" "$DAY_DIR/google-boot-manifest.txt"

      - name: Apply retention policy
        shell: bash
        run: |
          set -euo pipefail
          find "$DEST_ROOT" -mindepth 1 -maxdepth 1 -type d \
            -regextype posix-extended -regex '.*/[0-9]{4}-[0-9]{2}-[0-9]{2}' \
            -mtime +"$RETENTION_DAYS" -print -exec rm -rf {} +

  protected:
    name: Backup ClaudeServer, production and SiRisky
    needs: boot
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 180
    steps:
      - name: Run fixed-purpose protected backup helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          if [ ! -x /usr/local/sbin/google-root-backup ]; then
            echo 'ERROR: /usr/local/sbin/google-root-backup is not installed.' >&2
            echo 'Project source/config remains under /home/ayman01323/BOOT; only the root-owned installed helper lives outside BOOT for security.' >&2
            exit 1
          fi
          sudo -n /usr/local/sbin/google-root-backup
