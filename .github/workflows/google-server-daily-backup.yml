name: Google Server Daily Backup

on:
  # Run at both UTC equivalents of 03:00 Europe/London.
  # The first step gates execution so exactly the 03:00 London run proceeds.
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-server-daily-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Daily protected Google-server folders backup
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 180
    env:
      DEST_ROOT: /home/ayman01323/GoogleServerBuckup
      PROD: /root/multichain-learning-bot-v2.2-fast-direct-market
      CLAUDE: /home/ayman01323/ClaudeServer
      SIRISKY: /root/SiRisky
      BOOT: /home/ayman01323/BOOT
      RETENTION_DAYS: '30'
      TZ: Europe/London
    steps:
      - name: Check 03:00 London schedule gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$(date +%H)" != "03" ]; then
            echo "run_backup=false" >> "$GITHUB_OUTPUT"
            echo "No-op: London local hour is $(date +%H), not 03."
          else
            echo "run_backup=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding at $(date '+%Y-%m-%d %H:%M:%S %Z')."
          fi

      - name: Verify Google runner and source folders
        if: steps.gate.outputs.run_backup == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          sudo -n true
          sudo -n test -d "$PROD"
          test -d "$CLAUDE"
          sudo -n test -d "$SIRISKY"
          test -d "$BOOT"
          mkdir -p "$DEST_ROOT"
          chmod 700 "$DEST_ROOT"
          echo "production=$PROD"
          echo "claude=$CLAUDE"
          echo "sirisky=$SIRISKY"
          echo "boot=$BOOT"
          echo "destination=$DEST_ROOT"
          df -h "$DEST_ROOT"

      - name: Create verified daily archives
        if: steps.gate.outputs.run_backup == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BACKUP_DATE="$(date +%Y-%m-%d)"
          STAMP="$(date -u +%Y-%m-%d_%H-%M-%SZ)"
          DAY_DIR="$DEST_ROOT/$BACKUP_DATE"
          WORK="$(mktemp -d /tmp/google-daily-backup.XXXXXX)"
          trap 'rm -rf "$WORK"' EXIT

          mkdir -p "$DAY_DIR"
          chmod 700 "$DAY_DIR"

          make_root_archive() {
            label="$1"
            source="$2"
            parent="$(dirname "$source")"
            base="$(basename "$source")"
            out="$WORK/${label}.tar.gz"
            sudo -n tar -C "$parent" -czf "$out" "$base"
            sudo -n chown "$(id -u):$(id -g)" "$out"
            chmod 600 "$out"
            tar -tzf "$out" >/dev/null
            sha256sum "$out" > "$out.sha256"
            chmod 600 "$out.sha256"
          }

          make_user_archive() {
            label="$1"
            source="$2"
            parent="$(dirname "$source")"
            base="$(basename "$source")"
            out="$WORK/${label}.tar.gz"
            tar -C "$parent" -czf "$out" "$base"
            chmod 600 "$out"
            tar -tzf "$out" >/dev/null
            sha256sum "$out" > "$out.sha256"
            chmod 600 "$out.sha256"
          }

          make_root_archive production-bot "$PROD"
          make_user_archive claude-server "$CLAUDE"
          make_root_archive sirisky "$SIRISKY"
          make_user_archive boot "$BOOT"

          cat > "$WORK/google-server-manifest.txt" <<EOF
          backup_date=$BACKUP_DATE
          created_london=$(date '+%Y-%m-%d %H:%M:%S %Z')
          created_utc=$STAMP
          hostname=$(hostname)
          production_source=$PROD
          claude_source=$CLAUDE
          sirisky_source=$SIRISKY
          boot_source=$BOOT
          destination=$DAY_DIR
          retention_days=$RETENTION_DAYS
          EOF
          chmod 600 "$WORK/google-server-manifest.txt"

          mv -f "$WORK"/* "$DAY_DIR"/
          chmod 600 "$DAY_DIR"/*

          cd "$DAY_DIR"
          sha256sum -c production-bot.tar.gz.sha256
          sha256sum -c claude-server.tar.gz.sha256
          sha256sum -c sirisky.tar.gz.sha256
          sha256sum -c boot.tar.gz.sha256

          echo 'Created:'
          ls -lh "$DAY_DIR"

      - name: Apply local retention policy
        if: steps.gate.outputs.run_backup == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find "$DEST_ROOT" -mindepth 1 -maxdepth 1 -type d \
            -regextype posix-extended -regex '.*/[0-9]{4}-[0-9]{2}-[0-9]{2}' \
            -mtime +"$RETENTION_DAYS" -print -exec rm -rf {} +
          echo "retention_days=$RETENTION_DAYS"
          df -h "$DEST_ROOT"

      - name: Backup summary
        if: always()
        shell: bash
        run: |
          echo 'Google server daily backup sources:'
          echo "- $PROD"
          echo "- $CLAUDE"
          echo "- $SIRISKY"
          echo "- $BOOT"
          echo "Destination pattern: $DEST_ROOT/YYYY-MM-DD/"
          echo 'Schedule: daily at 03:00 Europe/London (GMT/BST safe)'
