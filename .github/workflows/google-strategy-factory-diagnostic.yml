name: Google Strategy Factory DeepSeek Persistence Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-strategy-factory-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Prove worker survived previous GitHub job cleanup
        shell: bash
        run: |
          set -euo pipefail
          DEST="$HOME/.local/share/boot-ai-agent-bus"
          STATE="$HOME/.local/state/boot-ai-agent-bus"
          VENV="$DEST/.venv"
          test -x "$DEST/start-deepseek-worker.sh"
          test -x "$VENV/bin/python"
          echo "root_bus=$(systemctl is-active boot-ai-agent-bus.service)"
          test "$(systemctl is-active boot-ai-agent-bus.service)" = active
          pgrep -u "$(id -u)" -af "$DEST/scripts/ai_agent_ws_worker.py --agent deepseek"
          test "$(pgrep -u "$(id -u)" -fc "$DEST/scripts/ai_agent_ws_worker.py --agent deepseek")" -ge 1
          echo 'worker_survived_runner_cleanup=true'

      - name: Prove restart persistence is installed
        shell: bash
        run: |
          set -euo pipefail
          status="$(systemctl is-active cron 2>/dev/null || systemctl is-active crond 2>/dev/null || true)"
          echo "cron=$status"
          test "$status" = active
          count="$(crontab -l 2>/dev/null | grep -c 'BOOT_AI_DEEPSEEK_GOOGLE' || true)"
          echo "persistence_entries=$count"
          test "$count" -eq 2

      - name: Independent post-cleanup GPT to DeepSeek reply test
        shell: bash
        run: |
          set -euo pipefail
          DEST="$HOME/.local/share/boot-ai-agent-bus"
          VENV="$DEST/.venv"
          mid="google-persistence-gpt-deepseek-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="$(PYTHONPATH="$DEST" "$VENV/bin/python" "$DEST/scripts/ai_agent_ws_send.py" \
            --from gpt \
            --to deepseek \
            --subject 'Google Strategy Factory persistence verification' \
            --message-id "$mid" \
            --timeout 60 \
            --message 'Reply exactly: DEEPSEEK_REPLY_OK')"
          printf '%s\n' "$output"
          final="$(printf '%s\n' "$output" | tail -n 1)"
          FINAL="$final" MID="$mid" python3 - <<'PY'
          import json, os
          value = json.loads(os.environ['FINAL'])
          assert value.get('message_id') == os.environ['MID'], value
          assert value.get('delivered') is True, value
          assert value.get('acknowledged') is True, value
          assert str(value.get('status') or '').upper() == 'REPLIED', value
          assert not str(value.get('error') or ''), value
          body = str(value.get('body') or '').strip().strip('*_`').strip()
          assert body == 'DEEPSEEK_REPLY_OK', value
          print('GOOGLE_DEEPSEEK_PERSISTENCE=PASS')
          print('message_id=' + os.environ['MID'])
          print('delivered=true')
          print('acknowledged=true')
          print('status=REPLIED')
          print('body=' + body)
          PY
