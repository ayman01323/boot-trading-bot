name: Google Strategy Factory Privilege Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-strategy-factory-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect safe privilege and user-service options
        shell: bash
        run: |
          set +e
          echo "user=$(whoami)"
          echo "uid=$(id -u)"
          echo '=== SUDO POLICY ==='
          sudo -n -l 2>&1 || true
          echo '=== USER SYSTEMD ==='
          systemctl --user is-system-running 2>&1 || true
          systemctl --user show-environment 2>&1 | grep -E '^(HOME|PATH|XDG_RUNTIME_DIR)=' || true
          echo '=== LOGIN USER ==='
          loginctl show-user "$(id -u)" -p Linger -p State -p RuntimePath 2>&1 || true
          echo '=== WRITABILITY ==='
          for p in "$HOME" "$HOME/.config" "$HOME/.local" /opt/boot-ai-agent-bus /var/tmp/boot; do
            [[ -e "$p" ]] || continue
            [[ -w "$p" ]] && w=yes || w=no
            echo "$p writable=$w owner=$(stat -c '%U:%G' "$p" 2>/dev/null || echo unknown) mode=$(stat -c '%a' "$p" 2>/dev/null || echo unknown)"
          done
          echo '=== ROOT BROKER ==='
          systemctl is-active boot-ai-agent-bus.service 2>&1 || true
          ss -ltn 2>/dev/null | grep '127.0.0.1:8765' || true
