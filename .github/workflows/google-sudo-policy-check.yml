name: Google Runner Bounded Sudo Policy Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-sudo-policy-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 3
    steps:
      - name: Show non-interactive sudo policy
        shell: bash
        run: |
          set +e
          echo "user=$(whoami)"
          sudo -n -l 2>&1
          echo "sudo_list_rc=$?"
