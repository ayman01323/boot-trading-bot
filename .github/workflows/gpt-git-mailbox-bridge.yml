name: GPT Git Mailbox Bridge

on:
  workflow_run:
    workflows: [GPT Mailbox Signal]
    types: [completed]
    branches: [ai-mailbox]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpt-git-mailbox-bridge.yml'
      - '.github/workflows/gpt-mailbox-signal.yml'
      - '.github/workflows/claude-api-mailbox-signal.yml'
      - 'scripts/gpt_git_mailbox_bridge.py'
      - 'scripts/claude_git_mailbox_bridge.py'
      - 'scripts/ai_agent_bus.py'
      - 'scripts/ai_agent_bus_provider_compat.py'
      - 'scripts/run_ai_agent_bus.py'

concurrency:
  group: gpt-git-mailbox-bridge
  cancel-in-progress: false

jobs:
  bridge:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BUS_VENV: /tmp/gpt-git-mailbox-${{ github.run_id }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out trusted current main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Find unanswered GPT git-mailbox request
        id: mailbox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gpt_git_mailbox_bridge.py select-live --repo "$GITHUB_REPOSITORY" --message-output /tmp/gpt-git-mailbox-message.md > /tmp/gpt-git-mailbox.env
          cat /tmp/gpt-git-mailbox.env >> "$GITHUB_OUTPUT"
      - name: Build isolated Python environment
        if: steps.mailbox.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUS_VENV"
          python3 -m venv "$BUS_VENV"
          "$BUS_VENV/bin/python" -m pip install --disable-pip-version-check -q python-dotenv
      - name: Validate bounded Claude API envelope
        if: steps.mailbox.outputs.pending == 'true'
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          "$BUS_VENV/bin/python" scripts/run_ai_agent_bus.py --input /tmp/gpt-git-mailbox-message.md --output /tmp/unused.md --preflight > /tmp/gpt-git-mailbox-preflight.env
          cat /tmp/gpt-git-mailbox-preflight.env >> "$GITHUB_OUTPUT"
          test "$(grep '^target=' /tmp/gpt-git-mailbox-preflight.env | cut -d= -f2-)" = "claude"
      - name: Route GPT request to stateless Claude API responder
        if: steps.mailbox.outputs.pending == 'true'
        id: route
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_COUNCIL_MODEL: ${{ vars.ANTHROPIC_COUNCIL_MODEL || vars.CLAUDE_MASTER_MODEL || '' }}
          AI_COUNCIL_RUNTIME_ENV: /tmp/gpt-git-mailbox-no-runtime.env
        shell: bash
        run: |
          set +e
          "$BUS_VENV/bin/python" scripts/run_ai_agent_bus.py --input /tmp/gpt-git-mailbox-message.md --output /tmp/gpt-git-mailbox-reply.md 2>/tmp/gpt-git-mailbox-error.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ $rc -ne 0 || ! -s /tmp/gpt-git-mailbox-reply.md ]]; then
            cat > /tmp/gpt-git-mailbox-reply.md <<EOF
          AI_BUS_REPLY
          message_id: ${{ steps.mailbox.outputs.message_id }}
          from: BUS
          to: GPT
          status: BLOCKED
          mode: DIRECT
          provider_calls: 0
          max_hops: 1

          Claude API responder could not complete this request. No deployment, trading, wallet, LIVE/ARMED, risk/capital, sudo or secret authority was granted.
          EOF
          fi
          exit 0
      - name: Publish clearly-labelled Claude API response
        if: steps.mailbox.outputs.pending == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gpt_git_mailbox_bridge.py publish-live --repo "$GITHUB_REPOSITORY" --request-id "${{ steps.mailbox.outputs.message_id }}" --reply-file /tmp/gpt-git-mailbox-reply.md
      - name: Remove isolated Python environment
        if: always()
        shell: bash
        run: rm -rf "$BUS_VENV"
      - name: Publish compact bridge summary
        if: always()
        shell: bash
        run: |
          {
            echo '## GPT → Claude API Mailbox Bridge'
            echo "Pending request: **${{ steps.mailbox.outputs.pending || 'false' }}**"
            echo "Message ID: \`${{ steps.mailbox.outputs.message_id || 'none' }}\`"
            echo "Router return code: **${{ steps.route.outputs.rc || 'not-run' }}**"
            echo 'Request: `.github/ai-mailbox/gpt-to-claude.md`'
            echo 'API reply: `.github/ai-mailbox/claude-api-to-gpt.md`'
            echo 'The persistent Claude agent mailbox `.github/ai-mailbox/claude-to-gpt.md` is never overwritten by this workflow.'
            echo 'Only a new status=REQUEST invokes the stateless Claude API responder; no polling is used.'
          } >> "$GITHUB_STEP_SUMMARY"
