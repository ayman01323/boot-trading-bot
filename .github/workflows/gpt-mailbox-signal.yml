name: GPT Mailbox Signal

on:
  push:
    branches: [ai-mailbox]
    paths:
      - '.github/ai-mailbox/gpt-to-claude.md'

permissions:
  contents: read

jobs:
  signal:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 2
    steps:
      - name: Signal trusted GPT mailbox bridge
        shell: bash
        run: |
          echo 'GPT mailbox update detected.'
          echo 'No checkout, provider call, secret read, deploy, trade, wallet action, or sudo action occurs in this signal job.'
