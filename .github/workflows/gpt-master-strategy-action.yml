name: GPT Master Strategy Reconciler

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delegate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delegate to selected/fallback MASTER
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run selected-ai-master.yml --ref main -f lane=strategy
          echo 'GPT is now one selectable/fallback MASTER, not a hard-coded master.'
