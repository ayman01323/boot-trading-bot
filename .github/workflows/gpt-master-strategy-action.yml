name: GPT Master Strategy Reconciler

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      copilot_pr_number:
        description: 'Optional Copilot strategy report PR number'
        required: false
        type: string
      cycle_id:
        description: 'Optional immutable strategy cycle id; validated against the Copilot report files'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: gpt-master-strategy-reconciler
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve completed Copilot report PR by immutable cycle
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.copilot_pr_number }}
          INPUT_CYCLE: ${{ inputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          pr="${INPUT_PR:-}"
          cycle="${INPUT_CYCLE:-}"

          cycle_from_report_pair() {
            local candidate="$1" required_cycle="${2:-}"
            local json_path='' md_path='' resolved=''
            local -a files=()
            mapfile -t files < <(gh pr diff "$candidate" --name-only 2>/dev/null | sed '/^$/d' || true)
            [[ ${#files[@]} -eq 2 ]] || return 1
            for path in "${files[@]}"; do
              case "$path" in
                .ai/strategy/copilot/*.json) [[ -z "$json_path" ]] || return 1; json_path="$path" ;;
                .ai/strategy/copilot/*.md) [[ -z "$md_path" ]] || return 1; md_path="$path" ;;
                *) return 1 ;;
              esac
            done
            [[ -n "$json_path" && -n "$md_path" && "${json_path%.json}" == "${md_path%.md}" ]] || return 1
            resolved="${json_path##*/}"
            resolved="${resolved%.json}"
            [[ "$resolved" =~ ^[0-9a-f]{12}-[0-9]{10}-[0-9a-f]{8}$ ]] || return 1
            [[ -z "$required_cycle" || "$resolved" == "$required_cycle" ]] || return 1
            printf '%s\n' "$resolved"
          }

          if [[ -n "$pr" ]]; then
            cross="$(gh pr view "$pr" --json isCrossRepository --jq '.isCrossRepository')"
            [[ "$cross" != "true" ]] || { echo 'Refusing fork report PR.' >&2; exit 2; }
            cycle="$(cycle_from_report_pair "$pr" "$cycle")" || {
              echo "PR #${pr} does not contain exactly one matching Copilot JSON/Markdown report pair." >&2
              exit 2
            }
          else
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              cross="$(gh pr view "$candidate" --json isCrossRepository --jq '.isCrossRepository')"
              [[ "$cross" != "true" ]] || continue
              candidate_cycle="$(cycle_from_report_pair "$candidate" "$cycle")" || continue
              if gh api -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/contents/strategy/runs/${candidate_cycle}/master_decision.json?ref=ai-reviews" \
                  >/dev/null 2>&1; then
                continue
              fi
              pr="$candidate"
              cycle="$candidate_cycle"
              break
            done < <(gh pr list --state open --limit 100 --json number --jq '.[].number')
          fi

          if [[ -z "$pr" ]]; then
            echo "No unresolved PR with an exact Copilot report pair is ready; reconciler will retry."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/strategy/runs/${cycle}/master_decision.json?ref=ai-reviews" \
              >/dev/null 2>&1; then
            echo "Cycle ${cycle} already has a master decision."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha="$(gh pr view "$pr" --json headRefOid --jq '.headRefOid')"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "cycle_hint=$cycle" >> "$GITHUB_OUTPUT"

      - name: Check out Copilot report PR without persisted credentials
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.pr.outputs.found == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.found == 'true'
        with:
          node-version: '22'

      - name: Install synthesis tools
        if: steps.pr.outputs.found == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          npm install -g @openai/codex@latest
          codex --version

      - name: Refuse Copilot PR containing anything except its two report files
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --name-only > /tmp/copilot-files.txt
          python - <<'PY'
          import pathlib,sys
          files=[x.strip().replace('\\','/') for x in pathlib.Path('/tmp/copilot-files.txt').read_text().splitlines() if x.strip()]
          if len(files)!=2:
              print('Copilot report PR must contain exactly two files.',*files,sep='\n',file=sys.stderr); raise SystemExit(2)
          if any(not p.startswith('.ai/strategy/copilot/') or pathlib.PurePosixPath(p).suffix not in {'.json','.md'} for p in files):
              print('Non-report file in Copilot strategy PR.',*files,sep='\n',file=sys.stderr); raise SystemExit(3)
          stems={str(pathlib.PurePosixPath(p).with_suffix('')) for p in files}
          if len(stems)!=1: raise SystemExit('Copilot JSON/Markdown report names do not match')
          PY

      - name: Locate and validate Copilot report
        if: steps.pr.outputs.found == 'true'
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          report="$(gh pr diff "$PR_NUMBER" --name-only | grep -E '^\.ai/strategy/copilot/[^/]+\.json$' | head -1)"
          test -n "$report"
          python - "$report" <<'PY' > /tmp/copilot-meta.env
          import json,sys
          p=json.load(open(sys.argv[1]))
          print('CYCLE_ID='+str(p.get('cycle_id') or ''))
          print('SOURCE_SHA='+str(p.get('source_commit') or ''))
          print('EVIDENCE_SHA='+str(p.get('evidence_sha256') or ''))
          PY
          source /tmp/copilot-meta.env
          test -n "$CYCLE_ID"; test -n "$SOURCE_SHA"; test -n "$EVIDENCE_SHA"
          [[ "$CYCLE_ID" == "${{ steps.pr.outputs.cycle_hint }}" ]]
          md="${report%.json}.md"
          test -f "$md"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m learnerbot.three_agent_strategy_contract validate-agent \
            --input "$report" --provider copilot --cycle-id "$CYCLE_ID" \
            --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA"
          cp "$report" /tmp/copilot-strategy.json
          cp "$md" /tmp/copilot-strategy.md
          echo "cycle_id=$CYCLE_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "evidence_sha=$EVIDENCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch and validate matching GPT and Gemini reports
        if: steps.pr.outputs.found == 'true'
        id: independent
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.report.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.report.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.report.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          get_file() {
            local path="$1" out="$2"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=ai-reviews" --jq '.content' \
              | tr -d '\n' | base64 -d > "$out"
          }
          root="strategy/runs/${CYCLE_ID}"
          get_file "${root}/gpt.json" /tmp/gpt.json
          get_file "${root}/gemini.json" /tmp/gemini.json
          get_file "${root}/context.json" /tmp/context.json

          PYTHONPATH="$GITHUB_WORKSPACE" python -m learnerbot.three_agent_strategy_contract validate-agent \
            --input /tmp/gpt.json --provider gpt --cycle-id "$CYCLE_ID" \
            --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m learnerbot.three_agent_strategy_contract validate-agent \
            --input /tmp/gemini.json --provider gemini --cycle-id "$CYCLE_ID" \
            --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA"

          python - <<'PY'
          import json,sys
          reports=[json.load(open('/tmp/gpt.json')),json.load(open('/tmp/gemini.json')),json.load(open('/tmp/copilot-strategy.json'))]
          bad=[x.get('provider','?') for x in reports if x.get('status')=='INCOMPLETE']
          if bad:
              print('Independent reports still incomplete: '+','.join(bad),file=sys.stderr)
              raise SystemExit(3)
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out exact reviewed source without persisted credentials
        if: steps.independent.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.report.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Prepare master evidence
        if: steps.independent.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .strategy_master
          cp /tmp/gpt.json .strategy_master/gpt.json
          cp /tmp/gemini.json .strategy_master/gemini.json
          cp /tmp/copilot-strategy.json .strategy_master/copilot.json
          cp /tmp/context.json .strategy_master/context.json

      - name: GPT master synthesis without bubblewrap workspace sandbox
        if: steps.independent.outputs.ready == 'true'
        id: synth
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_STRATEGY_SYNTH_MODEL: ${{ vars.OPENAI_STRATEGY_SYNTH_MODEL }}
          CYCLE_ID: ${{ steps.report.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.report.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.report.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CODEX_API_KEY:-}"
          cat > /tmp/master-prompt.txt <<EOF
          You are GPT MASTER adjudicator for three independent trading-strategy reviews.
          Read .strategy_master/gpt.json, gemini.json, copilot.json and context.json, and inspect the exact checked-out source.

          Consolidate equivalent proposals. For every materially distinct proposal record ACCEPT, REJECT or DEFER.
          Measured evidence and code truth outrank majority vote. Reject unsupported profit claims, forced trading, cost-blind
          forecasting, duplicate strategies and recommendations that only increase risk/capital. Defer where evidence is sparse.

          This run is REPORT ONLY. Do not modify tracked code, deploy, trade, change live/risk/capital settings, wallets/signing,
          deployment workflows, smart contracts or live product-universe admission. Do not use external web research.

          Return exactly one JSON object between:
          MASTER_DECISION_JSON_BEGIN
          {
            "schema_version":1,
            "cycle_id":"${CYCLE_ID}",
            "source_commit":"${SOURCE_SHA}",
            "evidence_sha256":"${EVIDENCE_SHA}",
            "status":"NO_ACTION|DRAFT_SHADOW_CHANGE|HUMAN_REVIEW_REQUIRED",
            "summary":"...",
            "decisions":[{
              "finding_id":"stable id",
              "source_proposal_ids":["gpt:id","gemini:id","copilot:id"],
              "action":"KEEP|IMPROVE|REWORK|SHADOW_MORE|REPLACE|DORMANT|NEW_SHADOW|ASSET_REQUEST|RESEARCH_MORE",
              "strategy":"...",
              "disposition":"ACCEPT|REJECT|DEFER",
              "reason":"...",
              "confidence":0.0,
              "supporting_agents":["gpt","gemini","copilot"],
              "risk_class":"LOW|MEDIUM|HIGH|CRITICAL",
              "shadow_only":true,
              "allowed_files":["exact Strategy Lab/SHADOW path"],
              "required_tests":["specific command/test"]
            }],
            "implementation_allowed":false,
            "live_auto_deploy":false,
            "draft_pr_only":true
          }
          MASTER_DECISION_JSON_END
          EOF

          model_args=()
          if [[ -n "${OPENAI_STRATEGY_SYNTH_MODEL:-}" ]]; then model_args=(-m "$OPENAI_STRATEGY_SYNTH_MODEL"); fi

          redact_codex_error() {
            python - <<'PY'
          import os,pathlib,re
          source=pathlib.Path('/tmp/master.stderr')
          raw=source.read_text(errors='replace') if source.exists() else ''
          key=os.environ.get('CODEX_API_KEY','')
          if key:
              raw=raw.replace(key,'<redacted>')
          raw=re.sub(r'(?i)(authorization:\s*bearer\s+)\S+',r'\1<redacted>',raw)
          raw=re.sub(r'(?i)\b(sk|sess)-[A-Za-z0-9_-]{8,}\b',lambda m:m.group(1)+'-<redacted>',raw)
          pathlib.Path('/tmp/master.stderr.sanitized').write_text(raw[-12000:])
          PY
          }

          rc=1
          valid=0
          for attempt in 1 2 3; do
            : > /tmp/master.stdout
            : > /tmp/master.stderr
            : > /tmp/master.events
            set +e
            codex --ask-for-approval never exec --sandbox danger-full-access --ephemeral "${model_args[@]}" \
              --output-last-message /tmp/master.stdout - \
              < /tmp/master-prompt.txt > /tmp/master.events 2> /tmp/master.stderr
            rc=$?
            set -e

            if [[ $rc -eq 0 ]] && python - <<'PY'
          import json,re,pathlib
          raw=pathlib.Path('/tmp/master.stdout').read_text(errors='replace')
          m=re.search(r'MASTER_DECISION_JSON_BEGIN\s*(\{.*?\})\s*MASTER_DECISION_JSON_END',raw,re.S)
          if not m:
              raise SystemExit(1)
          json.loads(m.group(1))
          PY
            then
              valid=1
              break
            fi

            redact_codex_error
            {
              echo "::warning title=GPT Master synthesis attempt ${attempt} failed::Codex exit code ${rc}."
              tail -c 6000 /tmp/master.stderr.sanitized || true
            } >&2

            if grep -qiE 'no credits remaining|insufficient_quota|billing_hard_limit_reached|invalid_api_key|authentication_error|incorrect api key|status code: (401|403)' /tmp/master.stderr.sanitized; then
              echo "::error title=Non-retryable OpenAI API failure::Check API credits, billing and key validity before rerunning." >&2
              break
            fi
            if [[ $attempt -lt 3 ]]; then
              sleep "$((attempt * 15))"
            fi
          done

          if [[ $valid -ne 1 ]]; then
            echo "::error title=GPT Master synthesis failed::No valid Master JSON was produced." >&2
            if [[ $rc -eq 0 ]]; then rc=1; fi
            exit "$rc"
          fi

          python - <<'PY'
          import json,re,pathlib
          raw=pathlib.Path('/tmp/master.stdout').read_text(errors='replace')
          m=re.search(r'MASTER_DECISION_JSON_BEGIN\s*(\{.*?\})\s*MASTER_DECISION_JSON_END',raw,re.S)
          if not m: raise SystemExit('GPT Master JSON markers missing')
          p=json.loads(m.group(1))
          pathlib.Path('.strategy_master/master_decision.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          lines=['# GPT Master strategy decision','',p.get('summary','')]
          for d in p.get('decisions') or []:
              lines += ['',f"## {d.get('disposition')} — {d.get('strategy')}",d.get('reason','')]
          pathlib.Path('.strategy_master/master_decision.md').write_text('\n'.join(lines)+'\n')
          PY

      - name: Apply deterministic strategy policy gate
        if: steps.independent.outputs.ready == 'true'
        id: gate
        env:
          CYCLE_ID: ${{ steps.report.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.report.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.report.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m learnerbot.three_agent_strategy_contract gate-master \
            --input .strategy_master/master_decision.json --output .strategy_master/master_gated.json \
            --cycle-id "$CYCLE_ID" --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA" | tee /tmp/gate.txt
          echo "status=$(grep '^status=' /tmp/gate.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          echo "accepted=$(grep '^accepted=' /tmp/gate.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Publish reconciled three-agent completion and master decision
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.report.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.report.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.report.outputs.evidence_sha }}
          MASTER_STATUS: ${{ steps.gate.outputs.status }}
          ACCEPTED: ${{ steps.gate.outputs.accepted }}
          COPILOT_PR: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/master-reviews
          git worktree add --detach /tmp/master-reviews origin/ai-reviews
          dest="/tmp/master-reviews/strategy/runs/${CYCLE_ID}"
          mkdir -p "$dest"

          cp /tmp/copilot-strategy.json "$dest/copilot.json"
          cp /tmp/copilot-strategy.md "$dest/copilot.md"
          cp .strategy_master/master_decision.json "$dest/master_decision_raw.json"
          cp .strategy_master/master_gated.json "$dest/master_decision.json"
          cp .strategy_master/master_decision.md "$dest/master_decision.md"

          python - <<PY > "$dest/completion.json"
          import json
          print(json.dumps({
            'cycle_id':'${CYCLE_ID}','source_commit':'${SOURCE_SHA}','evidence_sha256':'${EVIDENCE_SHA}',
            'copilot_report_pr':int('${COPILOT_PR}'),'three_agent_reports_complete':True,
            'master_decision_available':True,'live_auto_deploy':False
          },indent=2,sort_keys=True))
          PY

          latest="$(cat /tmp/master-reviews/strategy/latest_cycle_id.txt 2>/dev/null || true)"
          if [[ "$latest" == "$CYCLE_ID" ]]; then
            cp .strategy_master/master_gated.json /tmp/master-reviews/strategy/latest_master_decision.json
            python - <<PY > /tmp/master-reviews/strategy/latest_status.json
          import json
          print(json.dumps({
            'available':True,'cycle_id':'${CYCLE_ID}','source_commit':'${SOURCE_SHA}',
            'evidence_sha256':'${EVIDENCE_SHA}','state':'MASTER_DECIDED',
            'gpt':'DONE','gemini':'DONE','copilot':'DONE','copilot_report_pr':int('${COPILOT_PR}'),
            'three_agent_reports_complete':True,'master_decision_available':True,
            'master_status':'${MASTER_STATUS}','policy_accepted_count':int('${ACCEPTED}'),
            'change_pr_url':'','live_auto_deploy':False,'draft_pr_only':True
          },indent=2,sort_keys=True))
          PY
          fi

          cd /tmp/master-reviews
          git config user.name 'gpt-master-strategy-bot'
          git config user.email 'gpt-master-strategy-bot@users.noreply.github.com'
          git add strategy
          if ! git diff --cached --quiet; then
            git commit -m "Complete three-agent strategy review ${CYCLE_ID}"
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            git push origin HEAD:ai-reviews
          fi

      - name: Comment Copilot report PR with final outcome
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          STATUS: ${{ steps.gate.outputs.status }}
          ACCEPTED: ${{ steps.gate.outputs.accepted }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --body \
            "Three-agent review complete. GPT Master status: **${STATUS}**. Policy-accepted SHADOW findings: **${ACCEPTED}**. This reconciler is report-only: no automatic merge, deployment, capital/risk or live-trading change was authorised."

      - name: Clean workspace
        if: always()
        run: rm -rf .strategy_master /tmp/master-reviews /tmp/master-prompt.txt /tmp/master.stdout /tmp/master.stderr /tmp/master.stderr.sanitized /tmp/master.events /tmp/gpt.json /tmp/gemini.json /tmp/context.json /tmp/copilot-strategy.json /tmp/copilot-strategy.md
