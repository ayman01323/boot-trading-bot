name: Install Grok LIVE Canary Default OFF

on:
  push:
    branches: [main]
    paths:
      - 'testingbots/grok_known_assets_bot/systemd/grok-known-assets-canary.service.example'
      - 'testingbots/grok_known_assets_bot/src/grok_known_assets_bot/live_canary.py'
      - 'testingbots/grok_known_assets_bot/src/grok_known_assets_bot/live_canary_runner.py'
      - 'testingbots/grok_known_assets_bot/src/grok_known_assets_bot/live_execution.py'
      - 'testingbots/grok_known_assets_bot/src/grok_known_assets_bot/live_readiness.py'
      - '.github/workflows/grok-live-canary-safe-install.yml'
  workflow_dispatch:

permissions:
  contents: read

# Share the existing Grok deployment lock so file installation and service-state
# enforcement cannot race the PAPER/Telegram deployment workflow.
concurrency:
  group: deploy-grok-known-assets-testing-bot
  cancel-in-progress: false

jobs:
  install-disabled:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Verify Google runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install canary unit but force it disabled and inactive
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/testingbots/grok_known_assets_bot/systemd/grok-known-assets-canary.service.example"
          test -s "$SRC"
          sudo install -m 0644 "$SRC" /etc/systemd/system/grok-known-assets-canary.service
          sudo systemctl daemon-reload
          sudo systemctl disable --now grok-known-assets-canary.service 2>/dev/null || true
          if sudo systemctl is-active --quiet grok-known-assets-canary.service; then
            echo 'ERROR: Grok LIVE canary service unexpectedly active'
            exit 1
          fi
          enabled_state="$(sudo systemctl is-enabled grok-known-assets-canary.service 2>/dev/null || true)"
          if [[ "$enabled_state" == "enabled" ]]; then
            echo 'ERROR: Grok LIVE canary service unexpectedly enabled'
            exit 1
          fi
          echo "canary_service_active=NO"
          echo "canary_service_enabled=${enabled_state:-disabled}"

      - name: Force deployed control state to LIVE canary OFF
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          path = Path('/home/ayman01323/BOOT/testingbots/grok_known_assets_bot/grok_control.json')
          if not path.exists():
              print('grok_control_file=ABSENT_DEFAULT_OFF')
              raise SystemExit(0)
          try:
              state = json.loads(path.read_text(encoding='utf-8'))
          except Exception as exc:
              raise SystemExit(f'refusing to rewrite unreadable Grok control file: {type(exc).__name__}')
          if not isinstance(state, dict):
              raise SystemExit('refusing to rewrite non-object Grok control state')

          state['live_canary_enabled'] = False
          state['live_money_enabled'] = False
          state['updated_by'] = 'safe-deploy-default-off'
          parent = path.parent
          fd, tmp_name = tempfile.mkstemp(prefix='.grok-control-safe-', dir=str(parent))
          try:
              with os.fdopen(fd, 'w', encoding='utf-8') as fh:
                  json.dump(state, fh, sort_keys=True, separators=(',', ':'))
                  fh.write('\n')
                  fh.flush()
                  os.fsync(fh.fileno())
              os.chmod(tmp_name, 0o600)
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          print('live_canary_enabled=false')
          print('live_money_enabled=false')
          print('paper_armed_preserved=' + str(bool(state.get('armed'))).lower())
          print('live_readiness_preserved=' + str(bool(state.get('live_readiness_enabled'))).lower())
          PY

      - name: Read-only canary prerequisite inventory
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE=/home/ayman01323/.config/grok-known-assets-bot/canary.env
          python3 - "$ENV_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          values = {}
          if path.exists():
              for raw in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  k, v = line.split('=', 1)
                  values[k.strip()] = v.strip().strip('"').strip("'")
          print('canary_env_present=' + str(path.exists()).lower())
          print('signer_id_present=' + str(bool(values.get('GROK_LIVE_CANARY_TELEGRAM_ID'))).lower())
          print('approver_user_ids_present=' + str(bool(values.get('GROK_LIVE_CANARY_APPROVER_USER_IDS'))).lower())
          rpc_keys = (
              'SOLANA_RPC_URLS', 'SOLANA_RPC_FALLBACK_URLS', 'SOLANA_RPC_URL',
              'HELIUS_RPC_URL', 'HELIUS_API_KEY',
          )
          print('dedicated_rpc_config_present=' + str(any(values.get(k) for k in rpc_keys)).lower())
          PY

      - name: Final fail-closed attestation
        shell: bash
        run: |
          set -euo pipefail
          echo 'grok_live_canary_code=INSTALLED_UNIT'
          echo 'grok_live_canary_activation=OFF'
          echo 'transaction_broadcast=NOT_PERFORMED'
          echo "paper_service=$(sudo systemctl is-active grok-known-assets-bot.service 2>/dev/null || true)"
          echo "telegram_service=$(sudo systemctl is-active grok-known-assets-telegram.service 2>/dev/null || true)"
          echo "canary_service=$(sudo systemctl is-active grok-known-assets-canary.service 2>/dev/null || true)"
