name: Grok Sixth Agent Branch Validation

on:
  push:
    branches: [gpt/add-grok-sixth-agent]
    paths:
      - 'learnerbot/grok_provider.py'
      - 'learnerbot/telegram_grok_council_patch.py'
      - 'learnerbot/ai_master_control.py'
      - 'learnerbot/telegram_command_scope_patch.py'
      - 'scripts/ai_agent_bus_provider_compat.py'
      - 'scripts/resilient_selected_master_v2.py'
      - '.github/workflows/grok-sixth-*.yml'
      - '.github/workflows/selected-ai-master.yml'
      - '.github/workflows/ai-agent-bus.yml'
      - '.github/workflows/ai-council-runtime-secrets.yml'
      - '.github/workflows/deploy-current-main-pr-isolated.yml'
      - 'tests/test_grok_sixth_agent.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyyaml
      - name: Compile changed Python
        run: |
          python -m py_compile \
            learnerbot/grok_provider.py \
            learnerbot/telegram_grok_council_patch.py \
            learnerbot/ai_master_control.py \
            scripts/ai_agent_bus_provider_compat.py \
            scripts/resilient_selected_master_v2.py \
            tests/test_grok_sixth_agent.py
      - name: Parse changed workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = [
              '.github/workflows/grok-sixth-strategy-agent.yml',
              '.github/workflows/grok-sixth-engineering-agent.yml',
              '.github/workflows/selected-ai-master.yml',
              '.github/workflows/ai-agent-bus.yml',
              '.github/workflows/ai-council-runtime-secrets.yml',
              '.github/workflows/deploy-current-main-pr-isolated.yml',
          ]
          for path in paths:
              value = yaml.safe_load(Path(path).read_text(encoding='utf-8'))
              assert isinstance(value, dict), path
              assert value.get('jobs'), path
              print('OK', path)
          PY
      - name: Run focused integration tests
        run: |
          pytest -q \
            tests/test_grok_sixth_agent.py \
            tests/test_ai_council_http_patch.py \
            tests/test_selected_ai_master_control.py \
            tests/test_deepseek_fifth_agent.py \
            tests/test_strategy_resilient_agent_workflows.py
