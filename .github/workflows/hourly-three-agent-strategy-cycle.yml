name: Hourly Three-Agent Strategy Cycle

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: hourly-three-agent-strategy-cycle
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact current main without persisted GitHub credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install review tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          npm install -g @openai/codex@latest @google/gemini-cli@latest
          codex --version
          gemini --version
          rg --version | head -1

      - name: Provider credential preflight
        id: creds
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CODEX_API_KEY:-}" ]] && echo 'openai=true' >> "$GITHUB_OUTPUT" || echo 'openai=false' >> "$GITHUB_OUTPUT"
          [[ -n "${GEMINI_API_KEY:-}" ]] && echo 'gemini=true' >> "$GITHUB_OUTPUT" || echo 'gemini=false' >> "$GITHUB_OUTPUT"
          [[ -n "${COPILOT_ASSIGN_TOKEN:-}" ]] && echo 'copilot_token=true' >> "$GITHUB_OUTPUT" || echo 'copilot_token=false' >> "$GITHUB_OUTPUT"

      - name: Resolve source and freshest available evidence
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .strategy_cycle
          SOURCE_SHA="$(git rev-parse HEAD)"
          EVIDENCE_SOURCE="architecture-only"
          EVIDENCE_FRESH="false"

          if gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/latest_loss_forensics.json?ref=audit-status" \
              > /tmp/audit-status-file.json 2>/tmp/audit-status-error.txt; then
            jq -r '.content' /tmp/audit-status-file.json | tr -d '\n' | base64 -d > .strategy_cycle/evidence.json
            EVIDENCE_SOURCE="audit-status:latest_loss_forensics.json"
            age="$(python - <<'PY'
          import json,time
          p=json.load(open('.strategy_cycle/evidence.json'))
          t=int(p.get('generated_epoch') or 0)
          print(max(0,int(time.time())-t) if t else 10**9)
          PY
          )"
            if [[ "$age" -le 7200 ]]; then EVIDENCE_FRESH="true"; fi
          fi

          if [[ ! -s .strategy_cycle/evidence.json ]]; then
            python - "$SOURCE_SHA" <<'PY' > .strategy_cycle/evidence.json
          import json,sys
          print(json.dumps({
            'schema_version':1,
            'generated_epoch':0,
            'generated_utc':'',
            'evidence_status':'MISSING_RUNTIME_FORENSICS',
            'source_commit':sys.argv[1],
            'note':'No current sanitised runtime forensics branch was available. Review code/architecture, identify evidence gaps, and do not claim live profitability or canary readiness.'
          },indent=2,sort_keys=True))
          PY
          fi

          # Bind every agent and the cycle id to the exact bytes they received.
          EVIDENCE_SHA="$(sha256sum .strategy_cycle/evidence.json | awk '{print $1}')"
          HOUR_KEY="$(date -u +'%Y%m%d%H')"
          CYCLE_ID="${SOURCE_SHA:0:12}-${HOUR_KEY}-${EVIDENCE_SHA:0:8}"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "evidence_sha=$EVIDENCE_SHA" >> "$GITHUB_OUTPUT"
          echo "cycle_id=$CYCLE_ID" >> "$GITHUB_OUTPUT"
          echo "evidence_source=$EVIDENCE_SOURCE" >> "$GITHUB_OUTPUT"
          echo "evidence_fresh=$EVIDENCE_FRESH" >> "$GITHUB_OUTPUT"

      - name: Evaluate paid-AI cost gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/strategy/cost_gate_state.json?ref=ai-reviews" --jq '.content' 2>/dev/null \
            | tr -d '\n' | base64 -d > /tmp/cost-gate-state.json 2>/dev/null
          rc=$?
          set -e
          if [[ $rc -ne 0 || ! -s /tmp/cost-gate-state.json ]]; then echo '{}' > /tmp/cost-gate-state.json; fi

          PYTHONPATH="$GITHUB_WORKSPACE" python - "$SOURCE_SHA" "$MANUAL" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          from learnerbot.strategy_ai_cost_gate import evaluate_cost_gate
          source_sha,manual=sys.argv[1],sys.argv[2].lower()=='true'
          evidence=json.load(open('.strategy_cycle/evidence.json'))
          try:
              previous=json.load(open('/tmp/cost-gate-state.json'))
          except Exception:
              previous={}
          result=evaluate_cost_gate(source_commit=source_sha,evidence=evidence,previous_state=previous,manual=manual)
          print(f"run_ai={str(result['run_ai']).lower()}")
          print(f"reason={result['reason']}")
          print(f"material_sha256={result['material_sha256']}")
          PY
          echo "[cost-gate] $(tail -3 "$GITHUB_OUTPUT" | tr '\n' ' ')"

      - name: Skip paid AI review -- no material change
        if: steps.gate.outputs.run_ai != 'true'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        shell: bash
        run: |
          echo "Skipping paid GPT/Gemini/Copilot review this cycle: ${REASON}"

      - name: Prepare common strategy prompt
        if: steps.gate.outputs.run_ai == 'true'
        env:
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          EVIDENCE_SOURCE: ${{ steps.meta.outputs.evidence_source }}
          EVIDENCE_FRESH: ${{ steps.meta.outputs.evidence_fresh }}
        shell: bash
        run: |
          cat > .strategy_cycle/prompt.txt <<EOF
          You are one of three INDEPENDENT strategy reviewers for a multi-chain automated trading bot.
          Inspect the checked-out repository and .strategy_cycle/evidence.json.

          Objective: durable money-weighted NET P&L after fees, slippage, price impact, gas/priority fees and execution failures.
          Never optimise raw win count and never force a trade without positive executable edge. Review Solana and EVM using
          chain-specific economics. Explicitly distinguish STRATEGY/MARKET loss from EXECUTION/INFRASTRUCTURE failure.

          Runtime evidence source: ${EVIDENCE_SOURCE}; fresh-within-2h=${EVIDENCE_FRESH}.
          If fresh runtime evidence is unavailable, you MAY suggest code/SHADOW hypotheses but MUST NOT claim a strategy is
          profitable, canary-ready or live-ready. Explicitly list evidence needed before promotion.

          REVIEW STATUS SEMANTICS ARE STRICT:
          - Missing or stale runtime forensics ALONE does NOT make this review INCOMPLETE.
          - If you successfully inspect the repository/evidence and produce a complete architecture-only review, use HEALTHY
            or CHANGES_PROPOSED, list the runtime evidence gaps, and keep profitability/CANARY/LIVE claims prohibited.
          - Use INCOMPLETE only when the review itself could not be completed, parsed or validated.
          - evidence_sha256 is the SHA-256 of the exact bytes of .strategy_cycle/evidence.json; do not canonicalise/re-hash JSON.

          REPORT ONLY. Do not edit tracked code, trade, deploy, change capital/risk/live settings, touch secrets/wallets/signing,
          auto-add assets, weaken execution/sellability/liquidity/simulation protection, or use external web research.

          Required JSON:
          {
            "schema_version":1,
            "provider":"PROVIDER",
            "cycle_id":"${CYCLE_ID}",
            "source_commit":"${SOURCE_SHA}",
            "evidence_sha256":"${EVIDENCE_SHA}",
            "scope":"THREE_AGENT_STRATEGY_REVIEW",
            "status":"HEALTHY|CHANGES_PROPOSED|INCOMPLETE",
            "summary":"...",
            "proposals":[{
              "id":"stable-id",
              "action":"KEEP|IMPROVE|REWORK|SHADOW_MORE|REPLACE|DORMANT|NEW_SHADOW|ASSET_REQUEST|RESEARCH_MORE",
              "strategy":"...",
              "chain_scope":["SOLANA","EVM"],
              "evidence":[{"path":"repository or JSON path","detail":"specific support"}],
              "rationale":"...",
              "expected_effect":"...",
              "downside_risk":"...",
              "shadow_test":"falsifiable test including costs and stop/failure condition",
              "minimum_observation":"...",
              "confidence":0.0,
              "suggested_files":["Strategy Lab/SHADOW files only"]
            }],
            "rejected_ideas":[{"idea":"...","reason":"..."}],
            "evidence_gaps":["..."],
            "review_only":true,
            "no_live_changes":true
          }
          Prefer no change over unsupported confidence.
          EOF

      - name: GPT independent strategy report
        id: gpt
        if: steps.gate.outputs.run_ai == 'true'
        continue-on-error: true
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_STRATEGY_AUDIT_MODEL: ${{ vars.OPENAI_STRATEGY_AUDIT_MODEL }}
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CODEX_API_KEY:-}"
          sed 's/"provider":"PROVIDER"/"provider":"gpt"/' .strategy_cycle/prompt.txt > /tmp/gpt-prompt.txt
          cat >> /tmp/gpt-prompt.txt <<'EOF'
          Your FINAL answer must contain exactly one report between these markers:
          STRATEGY_REVIEW_JSON_BEGIN
          {required JSON object}
          STRATEGY_REVIEW_JSON_END
          Do not write repository files; return the report through stdout only.
          EOF
          model_args=()
          if [[ -n "${OPENAI_STRATEGY_AUDIT_MODEL:-}" ]]; then model_args=(-m "$OPENAI_STRATEGY_AUDIT_MODEL"); fi

          set +e
          codex --ask-for-approval never exec --sandbox danger-full-access --ephemeral "${model_args[@]}" - \
            < /tmp/gpt-prompt.txt > .strategy_cycle/gpt_stdout.txt 2> .strategy_cycle/gpt_error.txt
          rc=$?
          set -e
          [[ $rc -eq 0 ]] || exit "$rc"

          python - <<'PY'
          import json,re,pathlib
          raw=pathlib.Path('.strategy_cycle/gpt_stdout.txt').read_text(errors='replace')
          m=re.search(r'STRATEGY_REVIEW_JSON_BEGIN\s*(\{.*?\})\s*STRATEGY_REVIEW_JSON_END',raw,re.S)
          if not m: raise SystemExit('GPT strategy JSON markers missing')
          p=json.loads(m.group(1))
          pathlib.Path('.strategy_cycle/gpt.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          lines=['# GPT strategy review','',p.get('summary','')]
          for x in p.get('proposals') or []:
              lines += ['',f"## {x.get('action')} — {x.get('strategy')}",x.get('rationale','')]
          pathlib.Path('.strategy_cycle/gpt.md').write_text('\n'.join(lines)+'\n')
          PY
          PYTHONPATH="$GITHUB_WORKSPACE" python -m learnerbot.three_agent_strategy_contract validate-agent \
            --input .strategy_cycle/gpt.json --provider gpt --cycle-id "$CYCLE_ID" \
            --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA"

      - name: Recover GPT incomplete report
        if: steps.gate.outputs.run_ai == 'true' && steps.gpt.outcome != 'success'
        env:
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          OPENAI_PRESENT: ${{ steps.creds.outputs.openai }}
        shell: bash
        run: |
          mkdir -p .strategy_cycle
          python - <<'PY'
          import json,os,re,pathlib
          parts=[]
          for name in ('gpt_error.txt','gpt_stdout.txt'):
              p=pathlib.Path('.strategy_cycle')/name
              if p.exists(): parts.append(p.read_text(errors='replace')[-1400:])
          raw='\n'.join(parts)
          raw=re.sub(r'(sk|sess)-[A-Za-z0-9_-]{8,}', '<redacted>', raw)
          reason='OpenAI/Codex API credential missing' if os.environ.get('OPENAI_PRESENT')!='true' else (raw.strip() or 'GPT execution/report extraction failed without diagnostic output')
          p={'schema_version':1,'provider':'gpt','cycle_id':os.environ['CYCLE_ID'],'source_commit':os.environ['SOURCE_SHA'],'evidence_sha256':os.environ['EVIDENCE_SHA'],'scope':'THREE_AGENT_STRATEGY_REVIEW','status':'INCOMPLETE','summary':'GPT report failed.','proposals':[],'rejected_ideas':[],'evidence_gaps':[reason[:1800]],'review_only':True,'no_live_changes':True}
          pathlib.Path('.strategy_cycle/gpt.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          pathlib.Path('.strategy_cycle/gpt.md').write_text('# GPT strategy review\n\nINCOMPLETE\n\n'+reason[:1800]+'\n')
          PY

      - name: Gemini independent strategy report
        id: gemini
        if: steps.gate.outputs.run_ai == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_STRATEGY_MODEL: ${{ vars.GEMINI_STRATEGY_MODEL || 'gemini-3.1-pro-preview' }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          sed 's/"provider":"PROVIDER"/"provider":"gemini"/' .strategy_cycle/prompt.txt > /tmp/gemini-prompt.txt
          cat >> /tmp/gemini-prompt.txt <<'EOF'
          Inspect read-only. End with exactly:
          STRATEGY_REVIEW_JSON_BEGIN
          {required JSON object}
          STRATEGY_REVIEW_JSON_END
          EOF

          set +e
          gemini --approval-mode=plan --skip-trust --model "$GEMINI_STRATEGY_MODEL" --output-format text \
            -p "$(cat /tmp/gemini-prompt.txt)" > .strategy_cycle/gemini_stdout.txt 2> .strategy_cycle/gemini_cli_error.txt
          cli_rc=$?
          set -e
          [[ $cli_rc -eq 0 ]] || exit "$cli_rc"

          set +e
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/extract_strategy_report.py \
            --input .strategy_cycle/gemini_stdout.txt --output .strategy_cycle/gemini.json \
            --provider gemini --cycle-id "$CYCLE_ID" --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA" \
            > .strategy_cycle/gemini_extract_stdout.txt 2> .strategy_cycle/gemini_extract_error.txt
          extract_rc=$?
          set -e
          [[ $extract_rc -eq 0 ]] || exit "$extract_rc"

          PYTHONPATH="$GITHUB_WORKSPACE" python -m learnerbot.three_agent_strategy_contract validate-agent \
            --input .strategy_cycle/gemini.json --provider gemini --cycle-id "$CYCLE_ID" \
            --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA" \
            > .strategy_cycle/gemini_validate_stdout.txt 2> .strategy_cycle/gemini_validate_error.txt

          python - <<'PY'
          import json
          p=json.load(open('.strategy_cycle/gemini.json'))
          lines=['# Gemini strategy review','',p.get('summary','')]
          for x in p.get('proposals') or []:
              lines += ['',f"## {x.get('action')} — {x.get('strategy')}",x.get('rationale','')]
          open('.strategy_cycle/gemini.md','w').write('\n'.join(lines)+'\n')
          PY

      - name: Recover Gemini incomplete report
        if: steps.gate.outputs.run_ai == 'true' && steps.gemini.outcome != 'success'
        env:
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          GEMINI_PRESENT: ${{ steps.creds.outputs.gemini }}
        shell: bash
        run: |
          mkdir -p .strategy_cycle
          python - <<'PY'
          import json,os,re,pathlib
          parts=[]
          for name in ('gemini_cli_error.txt','gemini_extract_error.txt','gemini_validate_error.txt','gemini_extract_stdout.txt','gemini_validate_stdout.txt','gemini_stdout.txt'):
              p=pathlib.Path('.strategy_cycle')/name
              if p.exists() and p.stat().st_size:
                  parts.append(f'[{name}]\n'+p.read_text(errors='replace')[-900:])
          raw='\n'.join(parts)
          raw=re.sub(r'AIza[A-Za-z0-9_-]{20,}', '<redacted>', raw)
          reason='GEMINI_API_KEY missing' if os.environ.get('GEMINI_PRESENT')!='true' else (raw.strip() or 'Gemini execution/extraction/validation failed without diagnostic output')
          p={'schema_version':1,'provider':'gemini','cycle_id':os.environ['CYCLE_ID'],'source_commit':os.environ['SOURCE_SHA'],'evidence_sha256':os.environ['EVIDENCE_SHA'],'scope':'THREE_AGENT_STRATEGY_REVIEW','status':'INCOMPLETE','summary':'Gemini report failed.','proposals':[],'rejected_ideas':[],'evidence_gaps':[reason[:1800]],'review_only':True,'no_live_changes':True}
          pathlib.Path('.strategy_cycle/gemini.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          pathlib.Path('.strategy_cycle/gemini.md').write_text('# Gemini strategy review\n\nINCOMPLETE\n\n'+reason[:1800]+'\n')
          PY

      - name: Create and attempt to assign Copilot the same strategy cycle
        id: copilot
        if: steps.gate.outputs.run_ai == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          EVIDENCE_FRESH: ${{ steps.meta.outputs.evidence_fresh }}
        shell: bash
        run: |
          set -euo pipefail
          title="Copilot hourly strategy review ${CYCLE_ID}"
          existing="$(gh issue list --state all --search "${title} in:title" --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            issue="$existing"
          else
            cat > /tmp/copilot.md <<EOF
          # Independent hourly Strategy Lab review
          Cycle: \`${CYCLE_ID}\`
          Source commit: \`${SOURCE_SHA}\`
          Evidence SHA-256: \`${EVIDENCE_SHA}\`
          Fresh runtime evidence within 2h: \`${EVIDENCE_FRESH}\`

          REPORT ONLY. Inspect the source independently and optimise durable NET P&L after all costs, not win count.
          If runtime evidence is not fresh, do not claim profitability/canary/live readiness. Missing/stale runtime evidence
          alone is NOT a reason to set status=INCOMPLETE: if the architecture review is complete use HEALTHY or CHANGES_PROPOSED
          and list the runtime evidence gaps. Use INCOMPLETE only if the review itself cannot be completed or validated.
          The evidence SHA-256 above hashes the exact evidence file bytes; do not canonicalise/re-hash the JSON.
          Do not trade, deploy, change live/risk/capital settings, touch secrets/wallets/signing, or implement code.

          Create a draft PR containing exactly:
          - \`.ai/strategy/copilot/${CYCLE_ID}.json\`
          - \`.ai/strategy/copilot/${CYCLE_ID}.md\`

          JSON must satisfy THREE_AGENT_STRATEGY_REVIEW with provider=copilot, exact cycle/source/evidence,
          review_only=true and no_live_changes=true.
          EOF
            url="$(gh issue create --title "$title" --body-file /tmp/copilot.md)"
            issue="${url##*/}"
          fi

          is_assigned() {
            gh issue view "$issue" --json assignees --jq '[.assignees[].login] | any(. | test("copilot"; "i"))' | grep -q true
          }

          state='AWAITING_ASSIGNMENT'
          if is_assigned; then
            state='ASSIGNED'
          elif [[ -n "${COPILOT_ASSIGN_TOKEN:-}" ]]; then
            payload="$(python - "$GITHUB_REPOSITORY" <<'PY'
          import json,sys
          repo=sys.argv[1]
          print(json.dumps({
            'assignees':['copilot-swe-agent[bot]'],
            'agent_assignment':{
              'target_repo':repo,
              'base_branch':'main',
              'custom_instructions':'Produce only the two report files specified in the issue. Do not change trading code or live settings.',
              'custom_agent':'',
              'model':''
            }
          }))
          PY
          )"
            set +e
            GH_TOKEN="$COPILOT_ASSIGN_TOKEN" gh api --method POST \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/issues/${issue}/assignees" --input - <<< "$payload"
            rc=$?
            set -e
            if [[ $rc -eq 0 ]] && is_assigned; then state='ASSIGNED'; else state='BLOCKED_AUTH'; fi
          fi

          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Copilot issue #${issue} assignment state: ${state}"

      - name: Publish independent reports and reconciliable state
        if: steps.gate.outputs.run_ai == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          EVIDENCE_SOURCE: ${{ steps.meta.outputs.evidence_source }}
          EVIDENCE_FRESH: ${{ steps.meta.outputs.evidence_fresh }}
          MATERIAL_SHA: ${{ steps.gate.outputs.material_sha256 }}
          OPENAI_PRESENT: ${{ steps.creds.outputs.openai }}
          GEMINI_PRESENT: ${{ steps.creds.outputs.gemini }}
          COPILOT_TOKEN_PRESENT: ${{ steps.creds.outputs.copilot_token }}
          COPILOT_ISSUE: ${{ steps.copilot.outputs.issue }}
          COPILOT_STATE: ${{ steps.copilot.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/hourly-ai-reviews
          git worktree add --detach /tmp/hourly-ai-reviews origin/ai-reviews
          dest="/tmp/hourly-ai-reviews/strategy/runs/${CYCLE_ID}"
          mkdir -p "$dest" /tmp/hourly-ai-reviews/strategy

          cp .strategy_cycle/gpt.json "$dest/gpt.json"
          cp .strategy_cycle/gpt.md "$dest/gpt.md"
          cp .strategy_cycle/gemini.json "$dest/gemini.json"
          cp .strategy_cycle/gemini.md "$dest/gemini.md"

          python - <<PY > "$dest/context.json"
          import json
          print(json.dumps({
            'cycle_id':'${CYCLE_ID}','source_commit':'${SOURCE_SHA}','evidence_sha256':'${EVIDENCE_SHA}',
            'evidence_source':'${EVIDENCE_SOURCE}','evidence_fresh':'${EVIDENCE_FRESH}','base_kind':'HOURLY_CURRENT_MAIN',
            'openai_credential_present':'${OPENAI_PRESENT}','gemini_credential_present':'${GEMINI_PRESENT}',
            'copilot_assignment_token_present':'${COPILOT_TOKEN_PRESENT}','copilot_issue':'${COPILOT_ISSUE}',
            'copilot_assignment_state':'${COPILOT_STATE}'
          },indent=2,sort_keys=True))
          PY

          python - <<PY > /tmp/hourly-ai-reviews/strategy/latest_status.json
          import json
          g=json.load(open('.strategy_cycle/gpt.json')); m=json.load(open('.strategy_cycle/gemini.json'))
          def done(x): return 'INCOMPLETE' if x.get('status')=='INCOMPLETE' else 'DONE'
          cs='${COPILOT_STATE}'
          cop='WAITING' if cs=='ASSIGNED' else ('WAITING_ASSIGNMENT' if cs=='AWAITING_ASSIGNMENT' else 'BLOCKED_AUTH')
          state='WAITING_FOR_COPILOT' if cs=='ASSIGNED' else ('WAITING_FOR_COPILOT_ASSIGNMENT' if cs=='AWAITING_ASSIGNMENT' else 'BLOCKED_COPILOT_AUTH')
          print(json.dumps({
            'available':True,'cycle_id':'${CYCLE_ID}','source_commit':'${SOURCE_SHA}',
            'evidence_sha256':'${EVIDENCE_SHA}','evidence_fresh':'${EVIDENCE_FRESH}','state':state,
            'gpt':done(g),'gemini':done(m),'copilot':cop,'copilot_issue':int('${COPILOT_ISSUE}'),
            'three_agent_reports_complete':False,'master_decision_available':False,
            'change_pr_url':'','live_auto_deploy':False
          },indent=2,sort_keys=True))
          PY

          printf '%s\n' "$CYCLE_ID" > /tmp/hourly-ai-reviews/strategy/latest_cycle_id.txt

          python - <<PY > /tmp/hourly-ai-reviews/strategy/cost_gate_state.json
          import json,time
          print(json.dumps({
            'last_ai_attempt_epoch':int(time.time()),
            'last_ai_attempt_source_commit':'${SOURCE_SHA}',
            'last_ai_attempt_material_sha256':'${MATERIAL_SHA}',
          },indent=2,sort_keys=True))
          PY

          cd /tmp/hourly-ai-reviews
          git config user.name 'hourly-three-agent-strategy-bot'
          git config user.email 'hourly-three-agent-strategy-bot@users.noreply.github.com'
          git add strategy
          if ! git diff --cached --quiet; then
            git commit -m "Start hourly three-agent strategy cycle ${CYCLE_ID}"
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            git push origin HEAD:ai-reviews
          fi

      - name: Clean workspace
        if: always()
        run: rm -rf .strategy_cycle /tmp/hourly-ai-reviews /tmp/gpt-prompt.txt /tmp/gemini-prompt.txt /tmp/copilot.md
