name: Import Learn Solana Wallet Secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-learn-solana-wallet-secret
  cancel-in-progress: false

jobs:
  import-wallet:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    env:
      LEARN_SOLANA_PRIVATE_KEY: ${{ secrets.LEARN_SOLANA_PRIVATE_KEY }}
    steps:
      - name: Verify isolated Google learner target
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"
          target=/home/ayman01323/BOOT/testingbots/learn
          test -d "$target"
          test -f "$target/learnerbot/solana_wallet_store.py"
          test -f "$target/CSVbot/users.csv"
          test -f "$target/data/.solana_wallet_store.key"
          echo "target=$target"
          echo "production_service_touched=NO"
          echo "live_execution_started=NO"

      - name: Import private key into encrypted learner wallet store
        shell: bash
        run: |
          set -euo pipefail
          target=/home/ayman01323/BOOT/testingbots/learn
          if [[ -z "${LEARN_SOLANA_PRIVATE_KEY:-}" ]]; then
            echo "ERROR: GitHub Actions secret LEARN_SOLANA_PRIVATE_KEY is not configured."
            exit 2
          fi

          py=python3
          if [[ -x "$target/.wallet-venv/bin/python" ]]; then
            py="$target/.wallet-venv/bin/python"
          fi

          cd "$target"
          PYTHONPATH="$target" "$py" - <<'PY'
          import os
          from pathlib import Path
          from learnerbot.solana_wallet_store import SolanaWalletStore

          root = Path('/home/ayman01323/BOOT/testingbots/learn')
          private_key = os.environ.get('LEARN_SOLANA_PRIVATE_KEY', '')
          if not private_key:
              raise SystemExit('private key secret missing')

          store = SolanaWalletStore(root/'CSVbot', root/'data')
          row = store.save_private_key(
              '900001',
              private_key,
              label='Learn Imported Wallet',
              source='github-actions-secret',
          )
          row = store.set_active('900001', row['wallet_id'])

          print('wallet_imported=YES')
          print('wallet_id=' + str(row['wallet_id']))
          print('public_address=' + str(row['address']))
          print('active=' + str(row.get('active')))
          print('signing=' + str(row.get('signing')))
          print('private_key_printed=NO')
          print('private_key_stored_encrypted=YES')
          print('production_service_touched=NO')
          print('live_execution_started=NO')
          PY

      - name: Verify encrypted file and active wallet metadata
        shell: bash
        run: |
          set -euo pipefail
          target=/home/ayman01323/BOOT/testingbots/learn
          py=python3
          if [[ -x "$target/.wallet-venv/bin/python" ]]; then
            py="$target/.wallet-venv/bin/python"
          fi
          cd "$target"
          PYTHONPATH="$target" "$py" - <<'PY'
          from pathlib import Path
          from learnerbot.solana_wallet_store import SolanaWalletStore

          root = Path('/home/ayman01323/BOOT/testingbots/learn')
          store = SolanaWalletStore(root/'CSVbot', root/'data')
          meta = store.get_meta('900001')
          assert str(meta.get('active')).lower() == 'true'
          assert str(meta.get('signing')).lower() == 'true'
          assert store.has_private_key('900001', meta['wallet_id'])
          enc = root/'data'/'user_solana_wallets'/'900001'/(meta['wallet_id'] + '.enc.json')
          assert enc.is_file()
          print('verification=PASS')
          print('public_address=' + str(meta['address']))
          print('encrypted_wallet_file=' + str(enc))
          print('private_key_printed=NO')
          print('production_service_touched=NO')
          print('live_execution_started=NO')
          PY
