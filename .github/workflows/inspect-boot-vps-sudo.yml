name: Inspect BOOT VPS sudo capabilities

on:
  push:
    branches: [fix/solana-aug17-canary-restore]
    paths:
      - '.github/workflows/inspect-boot-vps-sudo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 3
    steps:
      - name: Inspect old VPS production state without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== identity ==='
          id
          echo '=== cutover wrappers ==='
          for p in \
            /usr/local/sbin/quiesce-namecheap-for-google-cutover \
            /usr/local/sbin/final-sync-namecheap-to-google \
            /usr/local/sbin/verify-namecheap-cutover-stopped \
            /usr/local/sbin/resume-namecheap-after-cutover-failure \
            /usr/local/sbin/status-boot-trading-bot; do
            if [[ -x "$p" ]]; then echo "READY $p"; else echo "MISSING $p"; fi
          done
          echo '=== current old VPS bot status ==='
          sudo -n /usr/local/sbin/status-boot-trading-bot || true
          echo '=== stopped-state verification ==='
          set +e
          sudo -n /usr/local/sbin/verify-namecheap-cutover-stopped
          rc=$?
          set -e
          echo "verify_namecheap_stopped_rc=$rc"
