name: Trace Learner pre-1240 Runtime 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-learner-180-snapshot-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Read-only trace of runtime and config before 12:40 BST
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"
          TARGET=/home/ayman01323/BOOT/testingbots/learn
          test -d "$TARGET"
          export TARGET

          echo 'target_time_bst=2026-08-28T12:40:00+01:00'
          echo 'target_time_utc=2026-08-28T11:40:00Z'
          echo 'mutation=NO'

          echo '--- SERVICE_EVENTS_1030_1150_UTC ---'
          sudo -n journalctl -u learnerbot-learn.service \
            --since '2026-08-28 10:30:00 UTC' --until '2026-08-28 11:50:00 UTC' --no-pager 2>/dev/null \
            | grep -Ei 'Starting|Started|Stopping|Stopped|Main process exited|Failed|solana-min-settings|solana-profit-first-live|solana-first-day-strategy|solana-leader-quality|sibot-leader-quality-floor|solana-entry-exit-liquidity|solana-preflight-cache|solana-pool-risk|solana-emergency-liquidity|telegram-account|sibot-settings-source|live_trade_sol|signal_age|take_profit|stop=|roundtrip|entry_deterioration' \
            | sed -E 's#https?://[^[:space:]]+#<URL_REDACTED>#g' \
            | tail -500 || true

          echo '--- CONFIG_FILES_NEAR_TARGET ---'
          python3 - <<'PY'
          import os, datetime
          from pathlib import Path
          root=Path(os.environ['TARGET'])
          target=datetime.datetime(2026,8,28,11,40,0,tzinfo=datetime.timezone.utc).timestamp()
          deny=('wallet','secret','token','private','credential','key','telegram','.env')
          exts={'.csv','.json','.txt','.bak','.old'}
          hits=[]
          for base in [root/'CSVbot', root/'data', root]:
              if not base.exists(): continue
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in exts: continue
                  rel=str(p.relative_to(root)).lower()
                  if any(x in rel for x in deny): continue
                  try: m=p.stat().st_mtime
                  except Exception: continue
                  if abs(m-target)<=4*3600:
                      hits.append((m,p))
          seen=set()
          for m,p in sorted(hits):
              s=str(p)
              if s in seen: continue
              seen.add(s)
              dt=datetime.datetime.fromtimestamp(m,datetime.timezone.utc)
              print(f'FILE mtime_utc={dt.isoformat()} delta_seconds={int(m-target)} path={p}')
          PY

          echo '--- CURRENT_RELEVANT_SETTINGS_SAFE ---'
          python3 - <<'PY'
          import csv, os
          from pathlib import Path
          root=Path(os.environ['TARGET'])
          for p in [root/'CSVbot'/'solana_settings.csv', root/'CSVbot'/'user_trading_settings.csv', root/'data'/'user_trading_settings.csv']:
              if not p.exists(): continue
              print('### '+str(p))
              try:
                  rows=list(csv.DictReader(p.open(encoding='utf-8-sig',newline='')))
              except Exception as e:
                  print('READ_ERROR '+type(e).__name__); continue
              for r in rows:
                  k=str(r.get('setting') or '').strip()
                  if not k: continue
                  if any(x in k.lower() for x in ('wallet','secret','token','private','credential','key','telegram')): continue
                  if any(x in k.lower() for x in ('solana','signal','profit','loss','slippage','position','leader','sibot','entry','exit','reserve','trade')):
                      print('ROW '+' | '.join(f'{a}={b}' for a,b in r.items() if a and not any(x in a.lower() for x in ('wallet','secret','token','private','credential','key','telegram'))))
          PY

          echo inspection_complete=true
          echo settings_mutated=NO
          echo service_restarted=NO
