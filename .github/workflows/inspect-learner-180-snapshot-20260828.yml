name: Inspect Learner 180s Snapshot 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-learner-180-snapshot-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Broad read-only search for exact 180s Learner settings snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"
          TARGET=/home/ayman01323/BOOT/testingbots/learn
          test -d "$TARGET"
          export TARGET

          python3 - <<'PY'
          import csv, os, re
          from pathlib import Path

          root=Path(os.environ['TARGET'])
          print('target='+str(root))
          print('mutation=NO')
          deny=('wallet','secret','token','private_key','apikey','api_key','.env','telegram','credential')
          allowed_ext={'.csv','.txt','.bak','.old','.json','.ndjson','.log','.py'}
          hits=[]
          pat_csv=re.compile(r'(?im)^\s*["\']?max_signal_age_seconds["\']?\s*[,=:]\s*["\']?180(?:\.0+)?["\']?(?:\s*[,#]|\s*$)')
          pat_code=re.compile(r'(?i)max_signal_age_seconds.{0,80}(?:["\']180["\']|\b180\b)')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in allowed_ext:
                  continue
              rel=str(p.relative_to(root)).lower()
              if any(x in rel for x in deny):
                  continue
              try:
                  if p.stat().st_size>3_000_000: continue
                  text=p.read_text(encoding='utf-8-sig',errors='replace')
              except Exception:
                  continue
              if 'max_signal_age_seconds' not in text or '180' not in text:
                  continue
              if pat_csv.search(text) or pat_code.search(text):
                  hits.append((p,text))
          print('broad_exact_180_hits='+str(len(hits)))
          for i,(p,text) in enumerate(sorted(hits,key=lambda z:z[0].stat().st_mtime),1):
              print(f'--- HIT {i} ---')
              print('path='+str(p))
              print('mtime_epoch='+str(int(p.stat().st_mtime)))
              if p.suffix.lower()=='.csv':
                  try:
                      rows=list(csv.DictReader(text.splitlines()))
                      if rows and 'setting' in rows[0] and 'value' in rows[0]:
                          print('format=settings_csv')
                          for r in rows:
                              k=str(r.get('setting') or '').strip()
                              v=str(r.get('value') or '').strip()
                              d=str(r.get('description') or '').strip()
                              if k: print(f'SETTING {k}={v} | {d}')
                          continue
                  except Exception: pass
              # For source/log-like matches, print only safe context around the exact setting.
              lines=text.splitlines()
              for n,line in enumerate(lines):
                  if 'max_signal_age_seconds' in line and '180' in line:
                      a=max(0,n-8); b=min(len(lines),n+9)
                      print('context_start')
                      for x in lines[a:b]: print(x[:500])
                      print('context_end')
          PY

          echo '--- JOURNAL_EXACT_SIGNAL_HINTS ---'
          sudo -n journalctl -u learnerbot-learn.service \
            --since '2026-08-28 09:00:00' --until '2026-08-28 15:00:00' --no-pager 2>/dev/null \
            | grep -Ei 'max_signal_age_seconds.{0,40}180|signal_age.{0,20}180|signal age.{0,20}180|cold.zone.{0,80}180' \
            | grep -Evi 'alchemy|drainer|retry|resume|cooldown' \
            | sed -E 's#https?://[^[:space:]]+#<URL_REDACTED>#g' \
            | tail -200 || true

          echo 'inspection_complete=true'
          echo 'settings_mutated=NO'
          echo 'service_restarted=NO'
