# one-shot inspection trigger 2026-08-28 learner restore switches
name: Inspect Testing Learner Settings

on:
  push:
    branches:
      - main
      - fix/learner-original-poolcheck-009-sol-20260828
    paths:
      - '.github/workflows/inspect-testing-learn-settings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Inspect isolated learner switches safely
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          root=/home/ayman01323/BOOT/testingbots/learn
          test -d "$root"
          echo "service_load=$(systemctl show learnerbot-learn.service -p LoadState --value 2>/dev/null || true)"
          echo "service_active=$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)"
          echo "service_enabled=$(systemctl is-enabled learnerbot-learn.service 2>/dev/null || true)"
          echo '--- unit ---'
          systemctl cat learnerbot-learn.service 2>/dev/null | sed -E 's/(Environment=.*(TOKEN|KEY|SECRET|PASSWORD)=).*/\1[redacted]/Ig' || true
          echo '--- active settings ---'
          ROOT="$root" python3 - <<'PY'
          import csv, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])/'CSVbot'
          p=root/'solana_settings.csv'
          if p.exists():
              with p.open(encoding='utf-8-sig',newline='') as f:
                  for r in csv.DictReader(f):
                      if r.get('setting') in {'live_trade_sol','live_min_sol_reserve','live_max_positions','live_require_simulation','max_signal_age_seconds','max_roundtrip_loss_pct'}:
                          print(f"platform {r.get('setting')}={r.get('value','')}")
          up=root/'user_trading_settings.csv'
          rows=[]
          if up.exists():
              with up.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          wanted={'learner_new_entries_enabled','solana_live_enabled','sibot_enabled','sibot_auto_trade_enabled','solana_live_trade_sol','solana_live_min_reserve_sol'}
          for r in rows:
              if str(r.get('setting') or '') in wanted:
                  print(f"user=[redacted] chain={r.get('chain_id','')} {r.get('setting')}={r.get('value','')}")
          users=root/'users.csv'
          if users.exists():
              with users.open(encoding='utf-8-sig',newline='') as f: us=list(csv.DictReader(f))
              for r in us:
                  print('account=[redacted] status='+str(r.get('status') or '')+' can_auto_trade='+str(r.get('can_auto_trade') or '')+' allowed_chains='+str(r.get('allowed_chains') or ''))
          PY
          echo '--- live positions ---'
          ROOT="$root" python3 - <<'PY'
          import os, sqlite3
          from pathlib import Path
          db=Path(os.environ['ROOT'])/'data/solana_sibot.sqlite3'
          if not db.exists(): raise SystemExit
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True); c.row_factory=sqlite3.Row
          for r in c.execute("select position_id,mode,status,entry_cost_sol,realised_net_sol,updated_at,strategy_version,git_sha from positions where mode='LIVE' order by updated_at desc limit 20"):
              print(dict(r))
          c.close()
          PY
