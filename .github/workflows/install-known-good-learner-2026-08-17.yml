name: Initialise Known-Good Learner Test Wallet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-known-good-learner-2026-08-17.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: initialise-known-good-learner-test-wallet
  cancel-in-progress: false

jobs:
  initialise:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Stabilise exact morning Solana Learner source
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          target=/home/ayman01323/BOOT/testingbots/learn
          service=learnerbot-learn.service
          expected=894c5597c5cf0c695f1f75df39f26ebe64c2dce9
          test "$(cat "$target/RESTORED_SOURCE_SHA.txt" 2>/dev/null)" = "$expected"
          test -f "$target/learnerbot/__main__.py"

          sudo -n /usr/bin/bash -lc '
            set -euo pipefail
            target=/home/ayman01323/BOOT/testingbots/learn
            service=learnerbot-learn.service
            main="$target/learnerbot/__main__.py"
            backup="$target/backups/__main__.py.before-isolated-polygon-skip"
            [[ -f "$backup" ]] || cp -a "$main" "$backup"
            systemctl stop "$service" || true
            if grep -q "^from \. import polygon_live_enable_migration  # noqa: F401$" "$main"; then
              sed -i "s|^from \. import polygon_live_enable_migration  # noqa: F401$|# Isolated Solana Learner: skip production-only Polygon LIVE one-shot migration.|" "$main"
            fi
            grep -q "^# Isolated Solana Learner: skip production-only Polygon LIVE one-shot migration\.$" "$main"
            chown ayman01323:ayman01323 "$main"
            python3 -m py_compile "$main"
            systemctl start "$service"
          '

          sleep 12
          state1="$(systemctl is-active "$service" 2>/dev/null || true)"
          n1="$(systemctl show "$service" -p NRestarts --value 2>/dev/null || echo unknown)"
          sleep 6
          state2="$(systemctl is-active "$service" 2>/dev/null || true)"
          n2="$(systemctl show "$service" -p NRestarts --value 2>/dev/null || echo unknown)"

          echo "source_sha=$expected"
          echo "compatibility_change=skip_production_polygon_migration_only"
          echo "service_state_1=$state1"
          echo "service_state_2=$state2"
          echo "restart_count_1=$n1"
          echo "restart_count_2=$n2"
          echo "wallet_data_modified=NO"
          echo "csv_settings_modified=NO"
          echo "database_replaced=NO"

          echo '--- active Learner controls ---'
          TARGET="$target" python3 - <<'PY'
          import csv, os
          from pathlib import Path
          root=Path(os.environ['TARGET'])/'CSVbot'
          for filename in ('solana_settings.csv','user_trading_settings.csv'):
              p=root/filename
              if not p.exists():
                  continue
              with p.open(encoding='utf-8-sig',newline='') as f:
                  for row in csv.DictReader(f):
                      key=str(row.get('setting') or '')
                      if key in {'live_trade_sol','live_min_sol_reserve','live_max_positions','live_require_simulation','learner_new_entries_enabled','solana_live_enabled','sibot_enabled','sibot_auto_trade_enabled','solana_live_trade_sol','solana_live_min_reserve_sol'}:
                          prefix='user=[redacted] ' if filename.startswith('user_') else 'platform '
                          print(prefix+f"chain={row.get('chain_id','')} {key}={row.get('value','')}")
          PY

          echo '--- current LIVE state ---'
          TARGET="$target" python3 - <<'PY'
          import os, sqlite3, time
          from pathlib import Path
          db=Path(os.environ['TARGET'])/'data/solana_sibot.sqlite3'
          conn=sqlite3.connect(f'file:{db}?mode=ro',uri=True)
          conn.row_factory=sqlite3.Row
          for row in conn.execute("select status,count(*) n from positions where mode='LIVE' group by status order by status"):
              print(dict(row))
          cutoff=int(time.time())-300
          rows=conn.execute("select action,status,error,created_at from live_execution_attempts where created_at>=? order by created_at desc limit 20",(cutoff,)).fetchall()
          print('attempts_last_5m='+str(len(rows)))
          for row in rows:
              d=dict(row); d['error']=str(d.get('error') or '')[:180]
              print(d)
          conn.close()
          PY

          echo '--- stable service tail ---'
          journalctl -u "$service" -n 120 --no-pager 2>/dev/null \
            | grep -Ei 'final-runtime-integrity|poolcheck-rug-hardening|Polygon|BUY|SELL|LIVE|entry|ERROR|REJECT' \
            | tail -n 120 || true

          test "$state1" = active
          test "$state2" = active
          test "$n1" = "$n2"
