name: Install Learner All Scan CSV Audit

on:
  workflow_dispatch:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/install-learner-all-scan-csv-audit.yml'

permissions:
  contents: read

concurrency:
  group: install-learner-all-scan-csv-audit
  cancel-in-progress: true

jobs:
  install:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Install schema-adaptive permanent CSV audit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          WORK="$HOME/.cache/learner-csv-audit-${GITHUB_RUN_ID}"
          mkdir -p "$WORK"
          SCRIPT="$WORK/install.sh"
          RESULT="$WORK/result.txt"
          UNIT="$WORK/learner-csv-audit-${GITHUB_RUN_ID}.service"

          cat > "$SCRIPT" <<'ROOTSCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          LEARN=/home/ayman01323/BOOT/testingbots/learn
          DAEMON=/home/ayman01323/.local/libexec/google_learner_all_scan_csv_audit.py
          SERVICE=/etc/systemd/system/google-learner-all-scan-csv-audit.service
          RESULT=__RESULT__
          exec > >(tee "$RESULT") 2>&1

          test -d "$LEARN"
          install -d -m 0755 -o ayman01323 -g ayman01323 /home/ayman01323/.local/libexec
          install -d -m 0755 -o ayman01323 -g ayman01323 "$LEARN/CSVbot/auto"

          cat > "$DAEMON" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import csv, json, os, sqlite3, time
          from datetime import datetime, timezone
          from pathlib import Path

          LEARN=Path('/home/ayman01323/BOOT/testingbots/learn')
          DB=LEARN/'data'/'solana_sibot.sqlite3'
          OUT=LEARN/'CSVbot'/'auto'/'solana_all_scan_records.csv'
          STATE=LEARN/'data'/'.solana_all_scan_csv_audit.state'
          BASELINE_DONE=LEARN/'data'/'.solana_all_scan_csv_baseline.done'
          POLL=1.0
          TARGETS=('candidates','history_status','trades','rankings','leaders','leader_events','positions','live_execution_attempts')
          HEAD=['audit_id','recorded_utc','source_table','event_type','wallet','primary_key','full_data_json']

          def utc_epoch_iso(epoch):
              return datetime.fromtimestamp(int(epoch),timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')

          def utc_now():
              return datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')

          def qi(name):
              return '"'+str(name).replace('"','""')+'"'

          def connect():
              c=sqlite3.connect(DB,timeout=30.0)
              c.row_factory=sqlite3.Row
              c.execute('PRAGMA busy_timeout=30000')
              c.execute('PRAGMA journal_mode=WAL')
              c.execute('PRAGMA synchronous=NORMAL')
              return c

          def tables(c):
              return {r[0] for r in c.execute("select name from sqlite_master where type='table'")}

          def cols(c, table):
              return [str(r[1]) for r in c.execute(f'PRAGMA table_info({qi(table)})')]

          def pk_cols(c, table):
              rows=list(c.execute(f'PRAGMA table_info({qi(table)})'))
              out=[(int(r[5]),str(r[1])) for r in rows if int(r[5] or 0)>0]
              return [name for _,name in sorted(out)]

          def wallet_col(columns):
              for name in ('wallet','leader_wallet','from_addr','owner_wallet'):
                  if name in columns: return name
              return None

          def json_expr(columns):
              pieces=[]
              for col in columns:
                  pieces.append("'"+col.replace("'","''")+"'")
                  pieces.append('NEW.'+qi(col))
              return 'json_object('+','.join(pieces)+')'

          def pk_expr(primary):
              if not primary: return "cast(NEW.rowid as text)"
              terms=["coalesce(cast(NEW.%s as text),'')"%qi(c) for c in primary]
              return " || '|' || ".join(terms)

          def wallet_expr(wcol):
              return "''" if not wcol else "coalesce(cast(NEW.%s as text),'')"%qi(wcol)

          def ensure_audit(c):
              c.execute('''CREATE TABLE IF NOT EXISTS csv_scan_audit(
                audit_id INTEGER PRIMARY KEY AUTOINCREMENT,
                source_table TEXT NOT NULL,
                event_type TEXT NOT NULL,
                event_epoch INTEGER NOT NULL,
                wallet TEXT,
                primary_key TEXT,
                row_json TEXT NOT NULL
              )''')
              present=tables(c)
              installed=0
              for table in TARGETS:
                  if table not in present: continue
                  columns=cols(c,table)
                  if not columns: continue
                  primary=pk_cols(c,table)
                  wcol=wallet_col(columns)
                  for event in ('INSERT','UPDATE'):
                      trg=f'csv_audit_{table}_{event.lower()}'
                      c.execute(f'DROP TRIGGER IF EXISTS {qi(trg)}')
                      sql=f'''CREATE TRIGGER {qi(trg)} AFTER {event} ON {qi(table)}
                      BEGIN
                        INSERT INTO csv_scan_audit(source_table,event_type,event_epoch,wallet,primary_key,row_json)
                        VALUES('{table}','{event}',CAST(strftime('%s','now') AS INTEGER),
                               {wallet_expr(wcol)},{pk_expr(primary)},{json_expr(columns)});
                      END'''
                      c.execute(sql)
                      installed+=1
              c.commit()
              return installed

          def ensure_csv():
              OUT.parent.mkdir(parents=True,exist_ok=True)
              if not OUT.exists() or OUT.stat().st_size==0:
                  with OUT.open('w',encoding='utf-8',newline='') as f:
                      csv.writer(f).writerow(HEAD)
                      f.flush(); os.fsync(f.fileno())

          def baseline(c):
              if BASELINE_DONE.exists(): return 0
              ensure_csv()
              present=tables(c)
              count=0
              with OUT.open('a',encoding='utf-8',newline='') as f:
                  w=csv.writer(f)
                  for table in TARGETS:
                      if table not in present: continue
                      columns=cols(c,table)
                      primary=pk_cols(c,table)
                      wcol=wallet_col(columns)
                      for r in c.execute(f'SELECT * FROM {qi(table)}'):
                          d={k:r[k] for k in r.keys()}
                          wallet=str(d.get(wcol) or '') if wcol else ''
                          pkey='|'.join(str(d.get(k) or '') for k in primary) if primary else ''
                          w.writerow(['',utc_now(),table,'BASELINE',wallet,pkey,json.dumps(d,separators=(',',':'),ensure_ascii=False,default=str)])
                          count+=1
                  f.flush(); os.fsync(f.fileno())
              tmp=BASELINE_DONE.with_suffix('.tmp')
              tmp.write_text(str(count)+'\n',encoding='utf-8')
              os.replace(tmp,BASELINE_DONE)
              return count

          def load_last():
              try: return int(STATE.read_text().strip() or '0')
              except Exception: return 0

          def save_last(v):
              tmp=STATE.with_suffix('.tmp')
              tmp.write_text(str(int(v))+'\n',encoding='utf-8')
              os.replace(tmp,STATE)

          def drain(c,last):
              rows=c.execute('SELECT audit_id,source_table,event_type,event_epoch,wallet,primary_key,row_json FROM csv_scan_audit WHERE audit_id>? ORDER BY audit_id LIMIT 5000',(last,)).fetchall()
              if not rows: return last,0
              ensure_csv()
              with OUT.open('a',encoding='utf-8',newline='') as f:
                  w=csv.writer(f)
                  for r in rows:
                      w.writerow([r['audit_id'],utc_epoch_iso(r['event_epoch']),r['source_table'],r['event_type'],r['wallet'] or '',r['primary_key'] or '',r['row_json']])
                  f.flush(); os.fsync(f.fileno())
              last=int(rows[-1]['audit_id']); save_last(last)
              return last,len(rows)

          print(f'[learner-csv-audit] output={OUT} poll={POLL}s append_only=true private_keys=false schema_adaptive=true',flush=True)
          last=load_last()
          while True:
              try:
                  if not DB.exists():
                      time.sleep(POLL); continue
                  with connect() as c:
                      ntrg=ensure_audit(c)
                      nbase=baseline(c)
                      last,ndrained=drain(c,last)
                      if nbase or ndrained:
                          print(f'[learner-csv-audit] baseline={nbase} appended={ndrained} triggers={ntrg} last={last}',flush=True)
                  time.sleep(POLL)
              except Exception as e:
                  print('[learner-csv-audit] warning='+type(e).__name__+':'+str(e)[:400],flush=True)
                  time.sleep(3)
          PY

          chmod 0755 "$DAEMON"
          chown ayman01323:ayman01323 "$DAEMON"
          python3 -m py_compile "$DAEMON"

          cat > "$SERVICE" <<EOF
          [Unit]
          Description=Google isolated learner permanent all-scan CSV audit
          After=network-online.target learnerbot-learn.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=ayman01323
          Group=ayman01323
          ExecStart=/usr/bin/python3 $DAEMON
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          EOF
          chmod 0644 "$SERVICE"
          systemctl daemon-reload
          systemctl enable google-learner-all-scan-csv-audit.service
          systemctl restart google-learner-all-scan-csv-audit.service
          sleep 5

          echo "csv_audit_service=$(systemctl is-active google-learner-all-scan-csv-audit.service 2>/dev/null || true)"
          echo "csv_audit_restarts=$(systemctl show google-learner-all-scan-csv-audit.service -p NRestarts --value 2>/dev/null || true)"
          journalctl -u google-learner-all-scan-csv-audit.service --since '1 minute ago' --no-pager -n 30 || true
          test "$(systemctl is-active google-learner-all-scan-csv-audit.service)" = active
          test -s "$LEARN/CSVbot/auto/solana_all_scan_records.csv"

          echo "learner_runtime=$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)"
          echo "telegram_relay=$(systemctl is-active google-learner-telegram-relay.service 2>/dev/null || true)"
          echo "csv_path=$LEARN/CSVbot/auto/solana_all_scan_records.csv"
          echo "csv_lines=$(wc -l < "$LEARN/CSVbot/auto/solana_all_scan_records.csv")"
          python3 - "$LEARN/data/solana_sibot.sqlite3" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1])
          tabs={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          trgs={r[0] for r in c.execute("select name from sqlite_master where type='trigger' and name like 'csv_audit_%'")}
          print('audit_table=' + ('YES' if 'csv_scan_audit' in tabs else 'NO'))
          print('audit_triggers='+str(len(trgs)))
          print('audit_events='+str(c.execute('select count(*) from csv_scan_audit').fetchone()[0] if 'csv_scan_audit' in tabs else 0))
          c.close()
          PY
          echo 'records=all discovered/history/trades/rankings/leaders/events/positions/execution-attempts'
          echo 'private_keys_recorded=NO'
          ROOTSCRIPT

          sed -i "s#__RESULT__#$RESULT#g" "$SCRIPT"
          chmod 0755 "$SCRIPT"
          cat > "$UNIT" <<EOF
          [Unit]
          Description=Install learner all-scan CSV audit
          After=network.target
          [Service]
          Type=oneshot
          ExecStart=/bin/bash $SCRIPT
          EOF
          chmod 0644 "$UNIT"
          NAME="$(basename "$UNIT")"
          sudo -n /usr/bin/systemctl link "$UNIT" >/dev/null
          sudo -n /usr/bin/systemctl daemon-reload
          RC=0
          sudo -n /usr/bin/systemctl start "$NAME" || RC=$?
          cat "$RESULT" 2>/dev/null || true
          exit "$RC"
