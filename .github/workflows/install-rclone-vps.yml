name: Install rclone on BOOT VPS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-rclone-vps.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: boot-vps-rclone-install
  cancel-in-progress: false

jobs:
  install:
    name: Install and verify rclone
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - name: Install rclone if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner user: $(id -un)"
          echo "Kernel: $(uname -srmo)"

          if command -v rclone >/dev/null 2>&1; then
            echo "rclone is already installed"
            rclone version
            exit 0
          fi

          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl -fsSL https://rclone.org/install.sh -o "$installer"

          if [ "$(id -u)" -eq 0 ]; then
            bash "$installer"
          else
            sudo -n bash "$installer"
          fi

          command -v rclone
          rclone version

      - name: Show config location
        shell: bash
        run: |
          set -euo pipefail
          rclone config file

      - name: Report rclone install status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            api_state="success"
          else
            api_state="failure"
          fi

          if command -v rclone >/dev/null 2>&1; then
            version="$(rclone version | head -n 1 | tr -d '\r')"
          else
            version="rclone unavailable"
          fi

          export API_STATE="$api_state"
          export DESCRIPTION="$version; job=$JOB_STATUS"
          python3 - <<'PY' > /tmp/rclone-status.json
import json
import os
print(json.dumps({
    "state": os.environ["API_STATE"],
    "context": "server/rclone-install",
    "description": os.environ["DESCRIPTION"][:140],
}))
PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            --data-binary @/tmp/rclone-status.json
