name: Kimi Read-Only Full Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/kimi-full-audit-pr.yml'

permissions:
  contents: read

concurrency:
  group: kimi-full-audit-trading-stop
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Temporary Kimi audit retired; repair moved to PR 531.'
