name: Kimi Hosted Full Code Audit V2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/kimi-hosted-code-audit-v2.yml'
      - 'scripts/kimi_hosted_code_audit_once.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main target
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 50
          persist-credentials: false

      - name: Checkout PR audit helper separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: helper
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install target test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -q -r target/requirements.txt 'pytest>=8,<9'

      - name: Compile and run target tests
        shell: bash
        working-directory: target
        run: |
          set +e
          mkdir -p .kimi_hosted
          python -m compileall -q learnerbot scripts > .kimi_hosted/compile.txt 2>&1
          compile_rc=$?
          python -m pytest -q -p no:cacheprovider > .kimi_hosted/pytest.txt 2>&1
          pytest_rc=$?
          set -e
          printf 'compile_rc=%s\npytest_rc=%s\n' "$compile_rc" "$pytest_rc" > .kimi_hosted/test_status.txt
          tail -n 120 .kimi_hosted/pytest.txt > .kimi_hosted/pytest_tail.txt
          cat .kimi_hosted/test_status.txt

      - name: Kimi audits current main code
        shell: bash
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          AUDIT_TARGET: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          test -n "${KIMI_API_KEY:-}"
          python helper/scripts/kimi_hosted_code_audit_once.py