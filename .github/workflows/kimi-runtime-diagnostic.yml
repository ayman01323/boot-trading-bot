name: Kimi Runtime Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/kimi-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Inspect embedded Kimi runtime and queue
        shell: bash
        run: |
          set -euo pipefail
          echo '=== EMBEDDED STATUS ==='
          cat /var/tmp/boot/ai_agent_ws_status.json 2>/dev/null || true
          pid="$(python3 - <<'PY'
          import json
          try:
              print(int(json.load(open('/var/tmp/boot/ai_agent_ws_status.json')).get('pid') or 0))
          except Exception:
              print(0)
          PY
          )"
          if [[ "$pid" != 0 ]]; then
            echo '=== EMBEDDED PROCESS ==='
            ps -p "$pid" -o pid=,etime=,stat=,cmd= || true
            echo "exe=$(readlink /proc/$pid/exe 2>/dev/null || true)"
            echo "cwd=$(readlink /proc/$pid/cwd 2>/dev/null || true)"
          fi
          echo '=== RUNTIME BRIDGE METADATA ONLY ==='
          for p in /var/tmp/ai_council_runtime.env /var/tmp/boot/ai_council_runtime.env; do
            if [[ -e "$p" ]]; then ls -l "$p"; else echo "$p missing"; fi
          done
          echo '=== LATEST KIMI QUEUE ==='
          python3 - <<'PY'
          import sqlite3, json
          p='/var/tmp/boot/ai_agent_bus.sqlite3'
          try:
              con=sqlite3.connect(f'file:{p}?mode=ro', uri=True)
              con.row_factory=sqlite3.Row
              rows=con.execute("""select message_id,sender,target,status,created_at,delivered_at,acknowledged_at,replied_at,substr(error,1,180) error from messages where target='kimi' order by created_at desc limit 30""").fetchall()
              for r in rows: print(json.dumps(dict(r), sort_keys=True))
          except Exception as exc:
              print('queue_read_error', type(exc).__name__, str(exc)[:200])
          PY
