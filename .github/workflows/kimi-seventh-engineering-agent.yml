name: Kimi Seventh Engineering Agent

on:
  # Kimi is intentionally the final low-frequency engineering reviewer. This
  # gives the earlier weekly reviewers time to publish and provides one clean
  # completion signal for the selected MASTER without continuous polling.
  workflow_run:
    workflows: ["Grok Sixth Engineering Agent"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Optional immutable engineering source commit; defaults to latest weekly source'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: kimi-seventh-engineering-agent
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out orchestration main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install review dependencies
        run: pip install -r requirements.txt

      - name: Resolve immutable engineering source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${INPUT_SOURCE:-}"
          if [[ -z "$source_sha" ]]; then
            source_sha="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/weekly/latest_source_commit.txt?ref=ai-reviews" \
              --jq '.content' | tr -d '\n' | base64 -d | tr -d '\r\n')"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid engineering source commit.' >&2; exit 2; }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Skip duplicate paid review unless manually requested
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MANUAL" == true ]]; then echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/weekly/runs/${SOURCE_SHA}/kimi.json?ref=ai-reviews" >/dev/null 2>&1; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact engineering source
        if: steps.needed.outputs.run == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "$SOURCE_SHA" || true
          git checkout --detach "$SOURCE_SHA"
          git clean -fdx

      - name: Build bounded deterministic engineering context
        if: steps.needed.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kimi_engineering
          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/weekly/runs/${SOURCE_SHA}/baseline.json?ref=ai-reviews" \
            --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > .kimi_engineering/baseline.json
          rc=$?
          set -e
          [[ $rc -eq 0 && -s .kimi_engineering/baseline.json ]] || echo '{}' > .kimi_engineering/baseline.json
          {
            echo '=== FROZEN SOURCE ==='
            echo "$SOURCE_SHA"
            echo '=== COMMIT SUMMARY ==='
            git show --stat --oneline --no-renames -1 "$SOURCE_SHA" | head -120
            echo '=== TRACKED FILE MANIFEST ==='
            git ls-files | head -800
            echo '=== DETERMINISTIC WEEKLY BASELINE ==='
            head -c 30000 .kimi_engineering/baseline.json
          } > .kimi_engineering/context.txt

      - name: Kimi independent engineering report
        id: kimi
        if: steps.needed.outputs.run == 'true'
        continue-on-error: true
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_COUNCIL_MODEL: ${{ vars.KIMI_ENGINEERING_MODEL || vars.KIMI_COUNCIL_MODEL || 'kimi-k2.6' }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re
          from learnerbot.kimi_provider import call_kimi

          source=os.environ['SOURCE_SHA']
          context=pathlib.Path('.kimi_engineering/context.txt').read_text(encoding='utf-8',errors='replace')
          prompt=f'''You are KIMI, the seventh independent Engineering reviewer for a multi-chain automated trading bot.
          Frozen source commit: {source}

          You are intentionally given bounded deterministic context to control API cost. Never pretend you inspected code that is not in the supplied context. If the context is insufficient for a finding, put that limitation in refusals_or_limits rather than guessing. Prefer CLEAN or fewer findings over speculation.

          Focus on correctness, safety, execution, accounting, concurrency, data, network, configuration, security, tests, performance and maintainability. Also identify obvious duplicated polling or paid-AI orchestration that can be made event-driven without weakening urgent trading safety.

          REPORT ONLY. Do not edit files, trade, deploy, change LIVE/ARMED/capital/risk settings, touch secrets/wallets/signing, or weaken simulation/liquidity/sellability/slippage/reserve/nonce/reconciliation controls.

          Return exactly one report between markers:
          KIMI_ENGINEERING_JSON_BEGIN
          {{
            "schema_version":1,"provider":"kimi","source_commit":"{source}",
            "scope":"FULL_REPOSITORY_BUG_AUDIT","status":"CLEAN|ISSUES_FOUND|INCOMPLETE",
            "summary":"...","findings":[{{
              "id":"stable-short-id","severity":"P0|P1|P2|P3",
              "category":"CORRECTNESS|SAFETY|EXECUTION|ACCOUNTING|CONCURRENCY|DATA|NETWORK|CONFIG|SECURITY|TESTS|PERFORMANCE|MAINTAINABILITY",
              "title":"...","evidence":[{{"file":"exact/path-or-baseline","line":0,"detail":"specific supplied evidence"}}],
              "impact":"...","root_cause":"...","corrective_action":"bounded corrective action",
              "tests_required":["specific test"],"confidence":0.0,"deterministic_evidence":false
            }}],
            "refusals_or_limits":[],"report_only":true,"no_live_changes":true
          }}
          KIMI_ENGINEERING_JSON_END

          BOUNDED DETERMINISTIC CONTEXT:
          {context[:42000]}
          '''
          rc,out,err=call_kimi(prompt, dict(os.environ))
          if rc != 0:
              pathlib.Path('.kimi_engineering/kimi_error.txt').write_text((err or f'Kimi rc={rc}')[:1800]+'\n')
              raise SystemExit(rc or 1)
          m=re.search(r'KIMI_ENGINEERING_JSON_BEGIN\s*(\{.*?\})\s*KIMI_ENGINEERING_JSON_END',out,re.S)
          if not m: raise SystemExit('Kimi engineering JSON markers missing')
          p=json.loads(m.group(1))
          if p.get('provider')!='kimi' or p.get('source_commit')!=source: raise SystemExit('Kimi engineering identity mismatch')
          if p.get('scope')!='FULL_REPOSITORY_BUG_AUDIT' or p.get('status') not in {'CLEAN','ISSUES_FOUND','INCOMPLETE'}: raise SystemExit('Kimi engineering contract mismatch')
          if p.get('report_only') is not True or p.get('no_live_changes') is not True or not isinstance(p.get('findings'),list): raise SystemExit('Kimi engineering safety contract mismatch')
          for row in p['findings']:
              if row.get('severity') not in {'P0','P1','P2','P3'}: raise SystemExit('invalid severity')
              c=float(row.get('confidence',-1))
              if c < 0 or c > 1: raise SystemExit('invalid confidence')
              if not isinstance(row.get('evidence'),list) or not row['evidence']: raise SystemExit('evidence required')
              if not isinstance(row.get('tests_required'),list): raise SystemExit('tests_required required')
          pathlib.Path('.kimi_engineering/kimi.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          md=['# Kimi engineering review','',str(p.get('summary') or ''),'',f"Status: {p.get('status')}"]
          for row in p.get('findings') or []: md += ['',f"## {row.get('severity')} — {row.get('title')}",str(row.get('impact') or '')]
          pathlib.Path('.kimi_engineering/kimi.md').write_text('\n'.join(md)+'\n')
          PY

      - name: Recover explicit Kimi incomplete engineering report
        if: steps.needed.outputs.run == 'true' && steps.kimi.outcome != 'success'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          KIMI_PRESENT: ${{ secrets.KIMI_API_KEY != '' || secrets.MOONSHOT_API_KEY != '' }}
        shell: bash
        run: |
          mkdir -p .kimi_engineering
          python - <<'PY'
          import json,os,pathlib,re
          if os.environ.get('KIMI_PRESENT')!='true': reason='KIMI_API_KEY or MOONSHOT_API_KEY is missing.'
          else:
              p=pathlib.Path('.kimi_engineering/kimi_error.txt')
              reason=p.read_text(errors='replace')[-1600:] if p.exists() else 'Kimi engineering execution/report extraction failed.'
              reason=re.sub(r'(?i)(api[_ -]?key|authorization|bearer|token)[^\n]*','[REDACTED]',reason).strip()
          report={'schema_version':1,'provider':'kimi','source_commit':os.environ['SOURCE_SHA'],'scope':'FULL_REPOSITORY_BUG_AUDIT','status':'INCOMPLETE','summary':'Kimi engineering review did not complete.','findings':[],'refusals_or_limits':[reason[:1800]],'report_only':True,'no_live_changes':True}
          pathlib.Path('.kimi_engineering/kimi.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          pathlib.Path('.kimi_engineering/kimi.md').write_text('# Kimi engineering review\n\nINCOMPLETE\n\n'+reason[:1800]+'\n')
          PY

      - name: Publish Kimi engineering report only
        if: steps.needed.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/kimi-engineering-reviews
          git worktree add --detach /tmp/kimi-engineering-reviews origin/ai-reviews
          dest="/tmp/kimi-engineering-reviews/weekly/runs/${SOURCE_SHA}"
          mkdir -p "$dest"
          cp .kimi_engineering/kimi.json "$dest/kimi.json"
          cp .kimi_engineering/kimi.md "$dest/kimi.md"
          cd /tmp/kimi-engineering-reviews
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "weekly/runs/${SOURCE_SHA}/kimi.json" "weekly/runs/${SOURCE_SHA}/kimi.md"
          git diff --cached --quiet && exit 0
          git commit -m "Add Kimi engineering review ${SOURCE_SHA:0:12}"
          for attempt in 1 2 3 4 5; do
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            if git push origin HEAD:ai-reviews; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Kimi engineering review after retries.' >&2
          exit 1

      - name: Clean workspace
        if: always()
        run: rm -rf .kimi_engineering /tmp/kimi-engineering-reviews
