name: Kimi Seventh Strategy Agent

on:
  workflow_run:
    workflows: ["Hourly Three-Agent Strategy Cycle"]
    types: [completed]
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'Optional immutable strategy cycle; defaults to latest published cycle'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: kimi-seventh-strategy-agent
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out orchestration source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install review dependencies
        run: pip install -r requirements.txt

      - name: Resolve immutable strategy cycle and exact evidence
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CYCLE: ${{ inputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .strategy_kimi
          cycle="${INPUT_CYCLE:-}"
          if [[ -z "$cycle" ]]; then
            cycle="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/strategy/latest_cycle_id.txt?ref=ai-reviews" \
              --jq '.content' | tr -d '\n' | base64 -d | tr -d '\r\n')"
          fi
          [[ "$cycle" =~ ^[0-9a-f]{12}-[0-9]{10}-[0-9a-f]{8}$ ]] || { echo 'Invalid strategy cycle id.' >&2; exit 2; }
          root="strategy/runs/${cycle}"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${root}/context.json?ref=ai-reviews" \
            --jq '.content' | tr -d '\n' | base64 -d > .strategy_kimi/context.json

          python - <<'PY' > /tmp/kimi-meta.env
          import json
          p=json.load(open('.strategy_kimi/context.json'))
          print('SOURCE_SHA='+str(p.get('source_commit') or ''))
          print('EVIDENCE_SHA='+str(p.get('evidence_sha256') or ''))
          print('EVIDENCE_SOURCE='+str(p.get('evidence_source') or ''))
          PY
          source /tmp/kimi-meta.env
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid source SHA.' >&2; exit 2; }
          [[ "$EVIDENCE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid evidence SHA.' >&2; exit 2; }

          exact=false
          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/latest_loss_forensics.json?ref=audit-status" --jq '.content' 2>/dev/null \
            | tr -d '\n' | base64 -d > .strategy_kimi/evidence.json 2>/dev/null
          rc=$?
          set -e
          if [[ $rc -eq 0 && -s .strategy_kimi/evidence.json ]]; then
            got="$(sha256sum .strategy_kimi/evidence.json | awk '{print $1}')"
            [[ "$got" == "$EVIDENCE_SHA" ]] && exact=true
          fi
          if [[ "$exact" != true && "$EVIDENCE_SOURCE" == architecture-only ]]; then
            python - "$SOURCE_SHA" <<'PY' > .strategy_kimi/evidence.json
          import json,sys
          print(json.dumps({
            'schema_version':1,'generated_epoch':0,'generated_utc':'',
            'evidence_status':'MISSING_RUNTIME_FORENSICS','source_commit':sys.argv[1],
            'note':'No current sanitised runtime forensics branch was available. Review code/architecture only; do not claim measured profitability or LIVE readiness.'
          },indent=2,sort_keys=True))
          PY
            got="$(sha256sum .strategy_kimi/evidence.json | awk '{print $1}')"
            [[ "$got" == "$EVIDENCE_SHA" ]] && exact=true
          fi
          echo "cycle_id=$cycle" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "evidence_sha=$EVIDENCE_SHA" >> "$GITHUB_OUTPUT"
          echo "evidence_source=$EVIDENCE_SOURCE" >> "$GITHUB_OUTPUT"
          echo "evidence_exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Check out exact source reviewed by the other agents
        env:
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          git clean -fdx -e .strategy_kimi/

      - name: Kimi independent strategy report
        id: kimi
        if: steps.meta.outputs.evidence_exact == 'true'
        continue-on-error: true
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_COUNCIL_MODEL: ${{ vars.KIMI_STRATEGY_MODEL || vars.KIMI_COUNCIL_MODEL || 'kimi-k2.6' }}
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          EVIDENCE_SOURCE: ${{ steps.meta.outputs.evidence_source }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re, sys
          from learnerbot.kimi_provider import call_kimi

          cycle=os.environ['CYCLE_ID']
          source=os.environ['SOURCE_SHA']
          evidence_sha=os.environ['EVIDENCE_SHA']
          evidence_source=os.environ['EVIDENCE_SOURCE']
          evidence=pathlib.Path('.strategy_kimi/evidence.json').read_text(encoding='utf-8',errors='replace')
          prompt=f'''You are KIMI, the seventh INDEPENDENT strategy reviewer for a multi-chain automated trading bot.
          Review the checked-out repository at source commit {source} and the exact immutable evidence below.
          Cycle: {cycle}
          Evidence SHA-256: {evidence_sha}
          Evidence source: {evidence_source}

          Optimise only for durable money-weighted NET P&L after all recorded costs. Distinguish strategy/market loss from execution/infrastructure failure. Compare Solana and EVM with chain-specific costs and executability.
          REPORT ONLY. Do not edit code, trade, deploy, change LIVE/risk/capital settings, touch secrets/wallets/signing, add assets, weaken simulation/liquidity/sellability controls, or use external web research.

          Return exactly one JSON report between these markers:
          STRATEGY_REVIEW_JSON_BEGIN
          {{
            "schema_version":1,"provider":"kimi","cycle_id":"{cycle}",
            "source_commit":"{source}","evidence_sha256":"{evidence_sha}",
            "scope":"MULTI_AGENT_STRATEGY_REVIEW","status":"HEALTHY|CHANGES_PROPOSED|INCOMPLETE",
            "summary":"...","proposals":[{{
              "id":"stable-id","action":"KEEP|IMPROVE|REWORK|SHADOW_MORE|REPLACE|DORMANT|NEW_SHADOW|ASSET_REQUEST|RESEARCH_MORE",
              "strategy":"...","chain_scope":["SOLANA","EVM"],
              "evidence":[{{"path":"repository or JSON path","detail":"specific support"}}],
              "rationale":"...","expected_effect":"...","downside_risk":"...",
              "shadow_test":"falsifiable test including costs and stop/failure condition",
              "minimum_observation":"...","confidence":0.0,
              "suggested_files":["Strategy Lab/SHADOW files only"]
            }}],"rejected_ideas":[],"evidence_gaps":[],"review_only":true,"no_live_changes":true
          }}
          STRATEGY_REVIEW_JSON_END
          Prefer no change over unsupported confidence.

          IMMUTABLE EVIDENCE JSON:
          {evidence[:28000]}
          '''
          rc,out,err=call_kimi(prompt, dict(os.environ))
          if rc != 0:
              pathlib.Path('.strategy_kimi/kimi_error.txt').write_text((err or f'Kimi rc={rc}')[:1800]+'\n',encoding='utf-8')
              raise SystemExit(rc or 1)
          m=re.search(r'STRATEGY_REVIEW_JSON_BEGIN\s*(\{.*?\})\s*STRATEGY_REVIEW_JSON_END',out,re.S)
          if not m:
              pathlib.Path('.strategy_kimi/kimi_error.txt').write_text('Kimi strategy JSON markers missing\n',encoding='utf-8')
              raise SystemExit(3)
          p=json.loads(m.group(1))
          if p.get('provider')!='kimi' or p.get('cycle_id')!=cycle or p.get('source_commit')!=source or p.get('evidence_sha256')!=evidence_sha:
              raise SystemExit('Kimi report identity mismatch')
          if p.get('scope')!='MULTI_AGENT_STRATEGY_REVIEW' or p.get('status') not in {'HEALTHY','CHANGES_PROPOSED','INCOMPLETE'}:
              raise SystemExit('Kimi report contract mismatch')
          if p.get('review_only') is not True or p.get('no_live_changes') is not True or not isinstance(p.get('proposals'),list):
              raise SystemExit('Kimi report safety contract mismatch')
          pathlib.Path('.strategy_kimi/kimi.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          lines=['# Kimi strategy review','',str(p.get('summary') or '')]
          for x in p.get('proposals') or []:
              lines += ['',f"## {x.get('action')} — {x.get('strategy')}",str(x.get('rationale') or '')]
          pathlib.Path('.strategy_kimi/kimi.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Recover explicit Kimi incomplete report
        if: steps.meta.outputs.evidence_exact != 'true' || steps.kimi.outcome != 'success'
        env:
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.meta.outputs.evidence_sha }}
          EVIDENCE_EXACT: ${{ steps.meta.outputs.evidence_exact }}
          KIMI_PRESENT: ${{ secrets.KIMI_API_KEY != '' || secrets.MOONSHOT_API_KEY != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,re
          if os.environ.get('EVIDENCE_EXACT')!='true':
              reason='Exact immutable evidence bytes could not be recovered; Kimi was not allowed to review different evidence.'
          elif os.environ.get('KIMI_PRESENT')!='true':
              reason='KIMI_API_KEY or MOONSHOT_API_KEY is missing.'
          else:
              p=pathlib.Path('.strategy_kimi/kimi_error.txt')
              reason=p.read_text(errors='replace')[-1600:] if p.exists() else 'Kimi execution/report extraction failed.'
              reason=re.sub(r'(?i)(api[_ -]?key|authorization|bearer|token)[^\n]*','[REDACTED]',reason).strip()
          report={'schema_version':1,'provider':'kimi','cycle_id':os.environ['CYCLE_ID'],'source_commit':os.environ['SOURCE_SHA'],'evidence_sha256':os.environ['EVIDENCE_SHA'],'scope':'MULTI_AGENT_STRATEGY_REVIEW','status':'INCOMPLETE','summary':'Kimi report did not complete.','proposals':[],'rejected_ideas':[],'evidence_gaps':[reason[:1800]],'review_only':True,'no_live_changes':True}
          pathlib.Path('.strategy_kimi/kimi.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          pathlib.Path('.strategy_kimi/kimi.md').write_text('# Kimi strategy review\n\nINCOMPLETE\n\n'+reason[:1800]+'\n')
          PY

      - name: Publish Kimi report only
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.meta.outputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/kimi-strategy-reviews
          git worktree add --detach /tmp/kimi-strategy-reviews origin/ai-reviews
          dest="/tmp/kimi-strategy-reviews/strategy/runs/${CYCLE_ID}"
          mkdir -p "$dest"
          cp .strategy_kimi/kimi.json "$dest/kimi.json"
          cp .strategy_kimi/kimi.md "$dest/kimi.md"
          cd /tmp/kimi-strategy-reviews
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "strategy/runs/${CYCLE_ID}/kimi.json" "strategy/runs/${CYCLE_ID}/kimi.md"
          git diff --cached --quiet && exit 0
          git commit -m "Add Kimi strategy review ${CYCLE_ID}"
          for attempt in 1 2 3 4 5; do
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            if git push origin HEAD:ai-reviews; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Kimi review after retries.' >&2
          exit 1
