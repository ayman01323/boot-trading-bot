name: Learner Telegram Menu Hotfix 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/learner-telegram-menu-hotfix-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 6
    steps:
      - name: Verify direct Min SOL Trade button in isolated Learner menu
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          file="$target/learnerbot/telegram_user_menu_compact_patch.py"
          test -f "$file"
          grep -q '📏 Min SOL Trade' "$file"
          grep -q 'sibot:solana:mintrade' "$file"
          python3 -m py_compile "$file" "$target/learnerbot/telegram_solana_live_patch.py"
          test "$(systemctl is-active learnerbot-learn.service)" = active
          echo learner_only=true
          echo direct_min_sol_menu=installed
          echo service=active

      - name: Prove isolated bot identity differs from main Learner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          TARGET="$target" sudo -n -E python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path

          target=Path(os.environ['TARGET'])
          def env_file_token(path):
              try:
                  for line in Path(path).read_text(encoding='utf-8',errors='ignore').splitlines():
                      if '=' not in line or line.lstrip().startswith('#'): continue
                      k,v=line.split('=',1)
                      if k.strip()=='TELEGRAM_BOT_TOKEN' and v.strip(): return v.strip().strip('"').strip("'")
              except Exception: pass
              return ''
          def pid(service):
              try: return int(subprocess.check_output(['systemctl','show',service,'-p','MainPID','--value'],text=True).strip() or 0)
              except Exception: return 0
          def proc_env(p,key):
              try:
                  for item in Path(f'/proc/{p}/environ').read_bytes().split(b'\0'):
                      prefix=(key+'=').encode()
                      if item.startswith(prefix): return item[len(prefix):].decode(errors='ignore')
              except Exception: pass
              return ''
          def cwd(p):
              try: return Path(os.readlink(f'/proc/{p}/cwd'))
              except Exception: return None
          def token(service,fallback=None):
              p=pid(service); t=proc_env(p,'TELEGRAM_BOT_TOKEN') if p else ''; c=cwd(p) if p else None
              if not t and c: t=env_file_token(c/'.env')
              if not t and fallback: t=env_file_token(Path(fallback)/'.env')
              return t
          iso=token('learnerbot-learn.service',target)
          main=token('learnerbot.service')
          if not iso: raise SystemExit('isolated Telegram token unavailable')
          print('same_bot_token='+str(bool(main and iso==main)).lower())
          with urllib.request.urlopen(f'https://api.telegram.org/bot{iso}/getMe',timeout=8) as r:
              data=json.loads(r.read().decode())
          username=str((data.get('result') or {}).get('username') or '')
          print('isolated_is_silearn='+str(bool(data.get('ok')) and username.lower()=='silearn_bot').lower())
          if main and iso==main: raise SystemExit('refusing duplicate Telegram polling: bot token shared with main Learner')
          if username.lower()!='silearn_bot': raise SystemExit('isolated token is not SiLearn_bot')
          PY

      - name: Enable SiLearn inbound polling with automatic conflict rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          service=learnerbot-learn.service
          envfile="$target/.env"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$target/private/.env.before-silearn-inbound-$stamp"
          sudo -n cp -a "$envfile" "$backup"
          start="$(date -u '+%Y-%m-%d %H:%M:%S')"
          ENVFILE="$envfile" sudo -n -E python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['ENVFILE'])
          lines=p.read_text(encoding='utf-8',errors='ignore').splitlines()
          out=[]; found=False
          for line in lines:
              if '=' in line and line.split('=',1)[0].strip()=='LEARNER_TELEGRAM_OUTBOUND_ONLY':
                  if not found: out.append('LEARNER_TELEGRAM_OUTBOUND_ONLY=false'); found=True
              else: out.append(line)
          if not found: out.append('LEARNER_TELEGRAM_OUTBOUND_ONLY=false')
          p.write_text('\n'.join(out).rstrip()+'\n',encoding='utf-8')
          os.chmod(p,0o600)
          PY
          sudo -n chown ayman01323:ayman01323 "$envfile"
          sudo -n systemctl restart "$service"
          sleep 30
          state="$(systemctl is-active "$service" 2>/dev/null || true)"
          conflicts="$(sudo -n journalctl -u "$service" --since "$start" --no-pager -o cat 2>/dev/null | grep -Eic 'getUpdates.*409|HTTP 409|Conflict: terminated by other getUpdates request' || true)"
          if [ "$state" != active ] || [ "$conflicts" -gt 0 ]; then
            echo telegram_inbound_conflict=true
            sudo -n cp -a "$backup" "$envfile"
            sudo -n chown ayman01323:ayman01323 "$envfile"
            sudo -n systemctl restart "$service"
            sleep 8
            test "$(systemctl is-active "$service")" = active
            echo rollback_outbound_only=true
            exit 1
          fi
          grep -q '^LEARNER_TELEGRAM_OUTBOUND_ONLY=false$' "$envfile"
          echo telegram_inbound_enabled=true
          echo telegram_409_conflicts=0
          echo service=active
          echo '--- recent safe telegram menu status ---'
          sudo -n journalctl -u "$service" --since "$start" --no-pager -o cat 2>/dev/null \
            | grep -Ei 'telegram-menu|poll error|outbound-only' \
            | tail -40 \
            | sed -E 's/[0-9]{7,}/<id>/g' || true
