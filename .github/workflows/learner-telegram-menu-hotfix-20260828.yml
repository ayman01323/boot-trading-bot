name: Learner Telegram Menu Hotfix 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/learner-telegram-menu-hotfix-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Verify direct Min SOL Trade button in isolated Learner menu
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          file="$target/learnerbot/telegram_user_menu_compact_patch.py"
          test -f "$file"
          grep -q '📏 Min SOL Trade' "$file"
          grep -q 'sibot:solana:mintrade' "$file"
          python3 -m py_compile "$file" "$target/learnerbot/telegram_solana_live_patch.py"
          test "$(systemctl is-active learnerbot-learn.service)" = active
          echo learner_only=true
          echo direct_min_sol_menu=installed
          echo service=active

      - name: Compare Telegram polling ownership safely
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          TARGET="$target" sudo -n -E python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path

          target=Path(os.environ['TARGET'])

          def env_file_token(path):
              try:
                  for line in Path(path).read_text(encoding='utf-8',errors='ignore').splitlines():
                      if '=' not in line or line.lstrip().startswith('#'):
                          continue
                      k,v=line.split('=',1)
                      if k.strip()=='TELEGRAM_BOT_TOKEN' and v.strip():
                          return v.strip().strip('"').strip("'")
              except Exception:
                  pass
              return ''

          def proc_env(pid, key):
              try:
                  raw=Path(f'/proc/{pid}/environ').read_bytes().split(b'\0')
                  prefix=(key+'=').encode()
                  for item in raw:
                      if item.startswith(prefix):
                          return item[len(prefix):].decode(errors='ignore')
              except Exception:
                  pass
              return ''

          def mainpid(service):
              try:
                  return int(subprocess.check_output(['systemctl','show',service,'-p','MainPID','--value'],text=True).strip() or 0)
              except Exception:
                  return 0

          def cwd(pid):
              try: return Path(os.readlink(f'/proc/{pid}/cwd'))
              except Exception: return None

          def token_for(service, fallback_dir=None):
              pid=mainpid(service)
              tok=proc_env(pid,'TELEGRAM_BOT_TOKEN') if pid else ''
              base=cwd(pid) if pid else None
              if not tok and base:
                  tok=env_file_token(base/'.env')
              if not tok and fallback_dir:
                  tok=env_file_token(Path(fallback_dir)/'.env')
              return tok,pid,base

          iso,ip,icwd=token_for('learnerbot-learn.service',target)
          main,mp,mcwd=token_for('learnerbot.service')
          print('isolated_service_active='+str(bool(ip)).lower())
          print('main_service_active='+str(bool(mp)).lower())
          print('isolated_token_present='+str(bool(iso)).lower())
          print('main_token_present='+str(bool(main)).lower())
          print('same_bot_token='+str(bool(iso and main and iso==main)).lower())
          print('isolated_outbound_only='+str((env_file_token(target/'.env')!='' and any(line.strip().lower()=='learner_telegram_outbound_only=true' for line in (target/'.env').read_text(encoding='utf-8',errors='ignore').splitlines()))).lower())

          for label,tok in [('isolated',iso),('main',main)]:
              if not tok:
                  continue
              try:
                  with urllib.request.urlopen(f'https://api.telegram.org/bot{tok}/getMe',timeout=8) as r:
                      data=json.loads(r.read().decode())
                  username=str((data.get('result') or {}).get('username') or '')
                  print(label+'_getme_ok='+str(bool(data.get('ok'))).lower())
                  print(label+'_is_silearn='+str(username.lower()=='silearn_bot').lower())
              except Exception as exc:
                  print(label+'_getme_error='+type(exc).__name__)
          PY
          echo '--- main learner telegram journal ---'
          sudo -n journalctl -u learnerbot.service --since '12 hours ago' --no-pager -o cat 2>/dev/null \
            | grep -Ei 'telegram-menu|outbound-only|getupdates|409|conflict|webhook' \
            | tail -80 \
            | sed -E 's/[0-9]{7,}/<id>/g' || true
          echo '--- isolated learner telegram journal ---'
          sudo -n journalctl -u learnerbot-learn.service --since '12 hours ago' --no-pager -o cat 2>/dev/null \
            | grep -Ei 'telegram-menu|outbound-only|getupdates|409|conflict|webhook' \
            | tail -80 \
            | sed -E 's/[0-9]{7,}/<id>/g' || true
