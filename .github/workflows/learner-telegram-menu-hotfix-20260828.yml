name: Learner Telegram Menu Hotfix 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/learner-telegram-menu-hotfix-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 8
    steps:
      - name: Verify live SiLearn receiver and launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          service=learnerbot-learn.service
          test "$(systemctl is-active "$service")" = active
          test -f "$target/learnerbot/telegram_google_learner_launcher_patch.py"
          grep -q 'telegram_google_learner_launcher_patch' "$target/learnerbot/__main__.py"
          test "$(grep -c '^LEARNER_TELEGRAM_OUTBOUND_ONLY=false$' "$target/.env")" -eq 1
          conflicts="$(sudo -n journalctl -u "$service" --since '3 minutes ago' --no-pager -o cat 2>/dev/null | grep -Eic 'getUpdates.*409|HTTP 409|Conflict: terminated by other getUpdates request' || true)"
          test "$conflicts" -eq 0
          echo receiver_active=true
          echo launcher_installed=true
          echo inbound_enabled=true
          echo telegram_409_conflicts=0

      - name: Isolate Telegram sendMessage rejection without exposing credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          target=/home/ayman01323/BOOT/testingbots/learn
          py="$target/.venv/bin/python"
          test -x "$py" || py=/root/multichain-learning-bot-v2.2-fast-direct-market/.venv/bin/python
          cd "$target"
          TARGET="$target" PYTHONPATH="$target" sudo -n -E "$py" - <<'PY'
          import csv, html, importlib, json, os, re, urllib.error, urllib.request
          from pathlib import Path
          from learnerbot.config import AppSettings

          root=Path(os.environ['TARGET'])
          vals={}
          for raw in (root/'.env').read_text(encoding='utf-8',errors='ignore').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          token=vals.get('TELEGRAM_BOT_TOKEN','').strip()
          if not token: raise SystemExit('telegram_token_present=false')

          masters=[]
          with (root/'CSVbot'/'users.csv').open(encoding='utf-8-sig',newline='') as f:
              for row in csv.DictReader(f):
                  tid=str(row.get('telegram_id') or '').strip()
                  if (str(row.get('status') or '').upper()=='ACTIVE' and
                      str(row.get('role') or '').upper()=='MASTER' and
                      tid.lstrip('-').isdigit() and tid not in masters):
                      masters.append(tid)
          env_ids=[]
          raw_ids=(vals.get('TELEGRAM_CHAT_IDS','').strip() or vals.get('TELEGRAM_CHAT_ID','').strip())
          for x in raw_ids.split(','):
              x=x.strip()
              if x and x.lstrip('-').isdigit() and x not in env_ids: env_ids.append(x)
          print('telegram_token_present=true')
          print('env_recipient_present='+str(bool(env_ids)).lower())
          print('active_master_present='+str(bool(masters)).lower())
          print('env_recipient_matches_master='+str(bool(env_ids and masters and env_ids[0] in masters)).lower())

          def api(method,payload,label):
              url=f'https://api.telegram.org/bot{token}/{method}'
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=json.loads(r.read().decode())
                  ok=bool(body.get('ok'))
                  print(label+'_ok='+str(ok).lower())
                  if not ok: print(label+'_description='+str(body.get('description') or '<none>')[:300])
                  return ok,body
              except urllib.error.HTTPError as exc:
                  try: body=json.loads(exc.read().decode(errors='ignore'))
                  except Exception: body={}
                  print(label+'_ok=false')
                  print(label+'_http_status='+str(exc.code))
                  print(label+'_description='+str(body.get('description') or '<unavailable>')[:300])
                  return False,body
              except Exception as exc:
                  print(label+'_ok=false')
                  print(label+'_transport_error='+type(exc).__name__)
                  return False,{}

          ok,me=api('getMe',{},'getme')
          if not ok: raise SystemExit('getMe failed')
          username=str((me.get('result') or {}).get('username') or '')
          print('bot_is_silearn='+str(username.lower()=='silearn_bot').lower())

          candidates=[]
          if env_ids: candidates.append(('env',env_ids[0]))
          if masters and masters[0] not in [c[1] for c in candidates]: candidates.append(('master',masters[0]))
          if not candidates: raise SystemExit('no safe configured Telegram recipient')

          plain_ok=[]
          for label,tid in candidates:
              ok,_=api('sendMessage',{'chat_id':tid,'text':'SiLearn reply-path test: plain message OK.'},label+'_plain')
              if ok: plain_ok.append((label,tid))

          if not plain_ok:
              print('diagnosis=no_configured_recipient_accepts_plain_message')
              raise SystemExit(2)

          label,tid=plain_ok[0]
          p=importlib.import_module('learnerbot.telegram_google_learner_launcher_patch')
          app=AppSettings.load()
          page=p.learner_page(str(tid))
          keyboard=p.learner_keyboard(str(tid))

          # Test the generated page without keyboard first.
          html_ok,_=api('sendMessage',{'chat_id':tid,'text':page,'parse_mode':'HTML'},'learner_page_html')
          if not html_ok:
              plain_page=html.unescape(re.sub(r'<[^>]*>','',page))
              text_ok,_=api('sendMessage',{'chat_id':tid,'text':plain_page},'learner_page_plain')
              print('diagnosis='+('generated_html_invalid' if text_ok else 'generated_page_rejected_even_plain'))
              raise SystemExit(3)

          # Then isolate the full inline keyboard on a short safe message.
          kb_ok,_=api('sendMessage',{'chat_id':tid,'text':'SiLearn menu keyboard test','reply_markup':keyboard},'learner_keyboard')
          if not kb_ok:
              print('diagnosis=learner_keyboard_invalid')
              raise SystemExit(4)

          # Finally prove exactly what /learnerbot sends.
          full_ok,_=api('sendMessage',{'chat_id':tid,'text':page,'parse_mode':'HTML','reply_markup':keyboard},'learner_full_payload')
          print('diagnosis='+('full_learner_payload_valid' if full_ok else 'full_combination_rejected'))
          if not full_ok: raise SystemExit(5)
          print('reply_path_proven=true')
          PY

      - name: Final receiver stability
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          service=learnerbot-learn.service
          target=/home/ayman01323/BOOT/testingbots/learn
          test "$(systemctl is-active "$service")" = active
          test "$(grep -c '^LEARNER_TELEGRAM_OUTBOUND_ONLY=false$' "$target/.env")" -eq 1
          conflicts="$(sudo -n journalctl -u "$service" --since '3 minutes ago' --no-pager -o cat 2>/dev/null | grep -Eic 'getUpdates.*409|HTTP 409|Conflict: terminated by other getUpdates request' || true)"
          test "$conflicts" -eq 0
          echo final_service_active=true
          echo final_inbound_enabled=true
          echo final_telegram_409_conflicts=0
