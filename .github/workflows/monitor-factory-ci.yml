name: Monitor Factory CI

on:
  pull_request:
    paths:
      - 'learnerbot/monitor_factory_pipeline.py'
      - 'scripts/monitor_factory_operations.py'
      - 'scripts/urgent_strategy_factory_review.py'
      - 'tests/test_monitor_factory_pipeline.py'
      - 'tests/test_monitor_factory_operations_contract.py'
      - 'tests/test_urgent_strategy_factory_review.py'
      - '.github/workflows/monitor-factory-operations.yml'
      - '.github/workflows/urgent-strategy-factory-review.yml'
      - '.github/workflows/monitor-factory-ci.yml'
      - 'docs/MONITOR_FACTORY_*.md'
  push:
    branches: [main]
    paths:
      - 'learnerbot/monitor_factory_pipeline.py'
      - 'scripts/monitor_factory_operations.py'
      - 'scripts/urgent_strategy_factory_review.py'
      - 'tests/test_monitor_factory_pipeline.py'
      - 'tests/test_monitor_factory_operations_contract.py'
      - 'tests/test_urgent_strategy_factory_review.py'
      - '.github/workflows/monitor-factory-operations.yml'
      - '.github/workflows/urgent-strategy-factory-review.yml'
      - '.github/workflows/monitor-factory-ci.yml'
      - 'docs/MONITOR_FACTORY_*.md'

permissions:
  contents: read

concurrency:
  group: monitor-factory-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 15
    env:
      PROD_PYTHON: /root/multichain-learning-bot-v2.2-fast-direct-market/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify production-compatible Python environment
        shell: bash
        run: |
          set -euo pipefail
          test -x "$PROD_PYTHON"
          "$PROD_PYTHON" - <<'PY'
          import sys
          assert sys.version_info >= (3, 10), sys.version
          import pytest, solders
          print('python='+sys.version.split()[0])
          print('pytest='+pytest.__version__)
          print('solders='+str(getattr(solders,'__version__','installed')))
          PY

      - name: Compile control-plane modules
        run: >-
          "$PROD_PYTHON" -m py_compile
          learnerbot/monitor_factory_pipeline.py
          scripts/monitor_factory_operations.py
          scripts/urgent_strategy_factory_review.py

      - name: Run focused safety and contract tests
        run: >-
          "$PROD_PYTHON" -m pytest -q
          tests/test_monitor_factory_pipeline.py
          tests/test_monitor_factory_operations_contract.py
          tests/test_urgent_strategy_factory_review.py

      - name: Ensure tests did not mutate tracked files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
