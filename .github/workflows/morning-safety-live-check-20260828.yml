name: Morning Solana Safety Live Check 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/morning-safety-live-check-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Checkout current main for one-time Learner min-trade deploy
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Deploy only Telegram minimum-trade files to isolated Learner
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          test -d "$target/learnerbot"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$target/private/pre-telegram-min-trade-$stamp"
          sudo -n mkdir -p "$backup"
          sudo -n cp -a "$target/learnerbot/telegram_solana_live_patch.py" "$backup/"
          sudo -n cp -a "$target/learnerbot/solana_overhead_gate_correction_patch.py" "$backup/"
          sudo -n cp -a learnerbot/telegram_solana_live_patch.py "$target/learnerbot/telegram_solana_live_patch.py"
          sudo -n cp -a learnerbot/solana_overhead_gate_correction_patch.py "$target/learnerbot/solana_overhead_gate_correction_patch.py"
          python3 -m py_compile "$target/learnerbot/telegram_solana_live_patch.py" "$target/learnerbot/solana_overhead_gate_correction_patch.py"
          grep -q 'sibot:solana:mintrade' "$target/learnerbot/telegram_solana_live_patch.py"
          grep -q 'solana_live_min_economic_trade_sol' "$target/learnerbot/solana_overhead_gate_correction_patch.py"
          sudo -n systemctl restart learnerbot-learn.service
          sleep 8
          test "$(systemctl is-active learnerbot-learn.service)" = active
          echo learner_only=true
          echo target="$target"
          echo telegram_min_trade_control=installed
          echo service=active

      - name: Classify morning Solana exit evidence before rearm
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          service=learnerbot-learn.service
          echo "service=$(systemctl is-active "$service" 2>/dev/null || true)"
          echo "source_sha=$(cat "$target/RESTORED_SOURCE_SHA.txt" 2>/dev/null || echo unknown)"
          TARGET="$target" python3 - <<'PY'
          import csv, json, os, sqlite3, urllib.request
          from pathlib import Path
          root=Path(os.environ['TARGET']); db=root/'data'/'solana_sibot.sqlite3'
          con=sqlite3.connect(db); con.row_factory=sqlite3.Row
          tables={r[0] for r in con.execute("select name from sqlite_master where type='table'")}
          positions=[dict(r) for r in con.execute("select * from positions where mode='LIVE' and status='RECONCILE_REQUIRED' order by entry_ts")]
          wallets={r['position_id']:dict(r) for r in con.execute('select * from live_position_wallets')} if 'live_position_wallets' in tables else {}
          print('reconcile_positions='+str(len(positions)))
          for table in ('live_execution_receipts','live_execution_attempts','live_decisions','live_execution_guard_events'):
              if table not in tables: continue
              cols=[r[1] for r in con.execute(f'pragma table_info("{table}")')]
              print(f'{table}_columns='+','.join(cols))
              rows=con.execute(f'SELECT * FROM "{table}" ORDER BY rowid DESC LIMIT 30').fetchall()
              for i,row in enumerate(rows):
                  d={k:row[k] for k in row.keys() if not any(x in k.lower() for x in ('secret','private','keypair','seed','signed_tx','raw_tx'))}
                  print(f'{table}_row_{i}='+repr(d)[:1800])
          con.close()

          endpoints=[]
          def add(v):
              v=(v or '').strip().strip('"').strip("'")
              if v.startswith(('http://','https://')) and v not in endpoints: endpoints.append(v)
          if (root/'.env').exists():
              for line in (root/'.env').read_text(encoding='utf-8',errors='ignore').splitlines():
                  if '=' not in line or line.lstrip().startswith('#'): continue
                  k,v=line.split('=',1)
                  if 'RPC' in k.upper() and ('SOL' in k.upper() or 'HELIUS' in k.upper()): add(v)
          for p in (root/'CSVbot').glob('*rpc*.csv'):
              try:
                  for row in csv.reader(p.open(encoding='utf-8',errors='ignore')):
                      for cell in row: add(cell)
              except Exception: pass
          print('rpc_endpoint_count='+str(len(endpoints)))
          def rpc(method,params):
              last='no endpoints'
              for idx,url in enumerate(endpoints):
                  try:
                      body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
                      req=urllib.request.Request(url,data=body,headers={'content-type':'application/json'})
                      with urllib.request.urlopen(req,timeout=12) as r: data=json.loads(r.read().decode())
                      if 'error' in data:
                          last=f'endpoint{idx}:{data["error"].get("code","rpc_error")}'; continue
                      return data.get('result'),idx,None
                  except Exception as e: last=f'endpoint{idx}:{type(e).__name__}'
              return None,None,last
          def owned_amount(meta, owner, mint, field):
              total=0
              for row in (meta or {}).get(field) or []:
                  if str(row.get('owner') or '') != owner or str(row.get('mint') or '') != mint: continue
                  try: total += int((row.get('uiTokenAmount') or {}).get('amount') or 0)
                  except Exception: pass
              return total
          safe_to_reconcile=True
          for p in positions:
              pid=str(p.get('position_id') or ''); mint=str(p.get('mint') or ''); sig=str(p.get('exit_signature') or '')
              owner=str((wallets.get(pid) or {}).get('wallet_address') or '')
              print('position_id='+pid); print('mint='+mint); print('wallet_bound='+str(bool(owner)).lower())
              tx,idx,err=rpc('getTransaction',[sig,{'encoding':'jsonParsed','maxSupportedTransactionVersion':0,'commitment':'confirmed'}]) if sig else (None,None,'missing sig')
              meta=tx.get('meta') if isinstance(tx,dict) else None
              pre=owned_amount(meta,owner,mint,'preTokenBalances') if owner else 0
              post=owned_amount(meta,owner,mint,'postTokenBalances') if owner else 0
              delta=post-pre
              print('stored_exit_signature_rpc='+str(err or ''))
              print('stored_exit_pre_token_raw='+str(pre)); print('stored_exit_post_token_raw='+str(post)); print('stored_exit_token_delta_raw='+str(delta))
              print('stored_exit_is_sell='+str(bool(meta is not None and meta.get('err') is None and delta < 0)).lower())
              bal,bi,berr=rpc('getTokenAccountsByOwner',[owner,{'mint':mint},{'encoding':'jsonParsed','commitment':'confirmed'}]) if owner else (None,None,'missing owner')
              current=0
              if isinstance(bal,dict):
                  for a in bal.get('value') or []:
                      try: current += int(a['account']['data']['parsed']['info']['tokenAmount']['amount'])
                      except Exception: pass
              print('current_balance_rpc_error='+str(berr or '')); print('current_token_balance_raw='+str(current))
              if current != 0: safe_to_reconcile=False
              if not (meta is not None and meta.get('err') is None and delta < 0):
                  print('stored_exit_signature_not_proven_sell=true')
          print('all_reconcile_wallet_balances_zero='+str(safe_to_reconcile and bool(positions)).lower())
          PY
