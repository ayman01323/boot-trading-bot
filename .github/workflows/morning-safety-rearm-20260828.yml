name: Morning Safety Solana Rearm 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/morning-safety-rearm-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify effective 0.009 SOL profile read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          export TARGET=/home/ayman01323/BOOT/testingbots/learn
          export EXPECTED_SHA=894c5597c5cf0c695f1f75df39f26ebe64c2dce9
          service=learnerbot-learn.service

          test "$(cat "$TARGET/RESTORED_SOURCE_SHA.txt" 2>/dev/null)" = "$EXPECTED_SHA"
          test "$(systemctl is-active "$service")" = active

          patch_src="$GITHUB_WORKSPACE/learnerbot/telegram_sibot_settings_source_patch.py"
          patch_dst="$TARGET/learnerbot/telegram_sibot_settings_source_patch.py"
          test -f "$patch_src" -a -f "$patch_dst"
          cmp -s "$patch_src" "$patch_dst"
          grep -F 'MAX_FEE_EFFICIENT_SOLANA_LIVE_TRADE_SOL = Decimal("0.009")' "$patch_dst"
          echo 'runtime_wrapper_matches_repo=true'

          TARGET="$TARGET" python3 - <<'PY'
          import csv, os, sqlite3
          from decimal import Decimal
          from pathlib import Path

          root=Path(os.environ['TARGET'])
          tid=(root/'private'/'.verified_morning_rearm_tid').read_text().strip()
          settings_path=root/'CSVbot'/'user_trading_settings.csv'
          users_path=root/'CSVbot'/'users.csv'
          sol_settings_path=root/'CSVbot'/'solana_settings.csv'

          def rows(path):
              with path.open('r',encoding='utf-8-sig',newline='') as f:
                  return list(csv.DictReader(f))

          settings=rows(settings_path)
          users=rows(users_path)
          sol_settings={str(r.get('setting') or '').strip():str(r.get('value') or '').strip() for r in rows(sol_settings_path)}

          def user_setting(who, chain_id, name, default=None):
              value=default
              target=str(chain_id).strip()
              for r in settings:
                  if str(r.get('telegram_id') or '').strip()!=str(who): continue
                  scope=str(r.get('chain_id','*')).strip()
                  if scope in ('','0') and str(r.get('setting') or '').strip()==name:
                      value=r.get('value',default)
              for r in settings:
                  if str(r.get('telegram_id') or '').strip()!=str(who): continue
                  if str(r.get('chain_id','*')).strip()=='*' and str(r.get('setting') or '').strip()==name:
                      value=r.get('value',default)
              if target not in ('','*','0'):
                  for r in settings:
                      if str(r.get('telegram_id') or '').strip()!=str(who): continue
                      if str(r.get('chain_id','')).strip()==target and str(r.get('setting') or '').strip()==name:
                          value=r.get('value',default)
              return value

          source=str(user_setting(tid,0,'sibot_settings_source','SELF') or 'SELF').strip().upper()
          source_tid=tid
          if source=='PRIMARY_MASTER':
              original=next((r for r in users if str(r.get('telegram_id') or '').strip()=='5923828381' and str(r.get('role') or '').strip().upper()=='MASTER'),None)
              if original:
                  source_tid='5923828381'
              else:
                  first=next((r for r in users if str(r.get('role') or '').strip().upper()=='MASTER' and str(r.get('telegram_id') or '').strip()),None)
                  if first: source_tid=str(first.get('telegram_id') or '').strip()

          base_trade=Decimal(sol_settings.get('live_trade_sol') or '0.005')
          raw_trade=user_setting(source_tid,-101,'solana_live_trade_sol',None)
          requested=Decimal(str(raw_trade)) if raw_trade is not None else base_trade
          effective_trade=min(Decimal('0.009'),max(Decimal('0.0005'),requested))

          base_reserve=Decimal(sol_settings.get('live_min_sol_reserve') or '0.02')
          raw_reserve=user_setting(source_tid,-101,'solana_live_min_reserve_sol',None)
          effective_reserve=max(Decimal('0.005'),Decimal(str(raw_reserve))) if raw_reserve is not None else max(Decimal('0.01'),base_reserve)

          live=str(user_setting(tid,-101,'solana_live_enabled','false')).strip().lower() in ('1','true','yes','on','y')
          entries=str(user_setting(tid,-101,'learner_new_entries_enabled','false')).strip().lower() in ('1','true','yes','on','y')
          sibot=str(user_setting(tid,0,'sibot_enabled','false')).strip().lower() in ('1','true','yes','on','y')
          auto=str(user_setting(tid,0,'sibot_auto_trade_enabled','false')).strip().lower() in ('1','true','yes','on','y')

          con=sqlite3.connect(root/'data'/'solana_sibot.sqlite3'); con.row_factory=sqlite3.Row
          open_live=int(con.execute("select count(*) n from positions where mode='LIVE' and status='OPEN'").fetchone()['n'])
          reconcile=int(con.execute("select count(*) n from positions where mode='LIVE' and status='RECONCILE_REQUIRED'").fetchone()['n'])
          con.close()

          print('settings_source='+source)
          print('effective_trade_sol='+str(effective_trade))
          print('effective_reserve_sol='+str(effective_reserve))
          print('effective_live_enabled='+str(live).lower())
          print('effective_new_entries='+str(entries).lower())
          print('effective_sibot_enabled='+str(sibot).lower())
          print('effective_sibot_auto='+str(auto).lower())
          print('open_live_positions='+str(open_live))
          print('reconcile_required_positions='+str(reconcile))
          print('live_max_positions='+str(sol_settings.get('live_max_positions','')))
          print('live_require_simulation='+str(sol_settings.get('live_require_simulation','')).lower())

          assert effective_trade==Decimal('0.009')
          assert effective_reserve>=Decimal('0.005')
          assert live and entries and sibot and auto
          assert str(sol_settings.get('live_max_positions','')).strip()=='1'
          assert str(sol_settings.get('live_require_simulation','')).strip().lower()=='true'
          PY

          echo '=== STARTUP WRAPPER EVIDENCE ==='
          journalctl -u "$service" --since '2026-08-28 21:20:00' --no-pager -o cat 2>/dev/null \
            | grep -F 'max_live_trade_sol=0.009' | tail -3

          echo 'fee_efficient_profile=VERIFIED'
          echo 'trade_size_sol=0.009'
          echo 'manual_forced_trade=NO'
          echo 'next_trade=ONLY_WHEN_EXISTING_SAFETY_GATES_PASS'
