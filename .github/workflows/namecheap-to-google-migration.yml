name: Staged Namecheap to Google Bot Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/namecheap-to-google-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-to-google-bot-migration
  cancel-in-progress: false

env:
  SOURCE: /root/multichain-learning-bot-v2.2-fast-direct-market
  STAGING_ROOT: /home/ayman01323/NamecheapMigration
  STAGING_DIR: /home/ayman01323/NamecheapMigration/multichain-learning-bot-v2.2-fast-direct-market

jobs:
  prepare-source:
    name: Prepare old Namecheap source
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - name: Verify source is readable without stopping production
        shell: bash
        run: |
          set -euo pipefail
          test -d "$SOURCE"
          test -x /root || { echo 'SOURCE_ROOT_NOT_TRAVERSABLE_BY_RUNNER'; exit 20; }
          test -r "$SOURCE" || { echo 'SOURCE_NOT_READABLE_BY_RUNNER'; exit 21; }
          echo "source=$SOURCE"
          echo "source_size=$(du -sh "$SOURCE" | awk '{print $1}')"
          echo "source_files=$(find "$SOURCE" -xdev -type f 2>/dev/null | wc -l)"
          systemctl is-active --quiet learnerbot.service || { echo 'learnerbot_not_active'; exit 22; }
          echo 'learnerbot_kept_running=true'

      - name: Generate one-time migration SSH key
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="/tmp/namecheap-google-migration-${GITHUB_RUN_ID}"
          rm -rf "$KEY_DIR"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          ssh-keygen -q -t ed25519 -N '' \
            -C "namecheap-google-migration-${GITHUB_RUN_ID}" \
            -f "$KEY_DIR/id_ed25519"
          chmod 600 "$KEY_DIR/id_ed25519"
          SOURCE_IP="$(curl -4fsS --max-time 10 https://api.ipify.org || true)"
          test -n "$SOURCE_IP" || { echo 'Could not determine Namecheap public IP'; exit 23; }
          printf '%s\n' "$SOURCE_IP" > "$KEY_DIR/source-ip.txt"
          chmod 600 "$KEY_DIR/source-ip.txt"

      - name: Upload public key and source IP only
        uses: actions/upload-artifact@v4
        with:
          name: migration-source-public-${{ github.run_id }}
          path: |
            /tmp/namecheap-google-migration-${{ github.run_id }}/id_ed25519.pub
            /tmp/namecheap-google-migration-${{ github.run_id }}/source-ip.txt
          retention-days: 1
          if-no-files-found: error

  prepare-google:
    name: Prepare Google staging destination
    needs: prepare-source
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Verify Google destination
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          mkdir -p "$STAGING_DIR"
          chmod 700 "$STAGING_ROOT" "$STAGING_DIR"
          echo "staging=$STAGING_DIR"
          df -h "$STAGING_ROOT"

      - name: Download one-time public key
        uses: actions/download-artifact@v4
        with:
          name: migration-source-public-${{ github.run_id }}
          path: /tmp/namecheap-google-authorise-${{ github.run_id }}

      - name: Authorise only the one-time Namecheap key
        shell: bash
        run: |
          set -euo pipefail
          WORK="/tmp/namecheap-google-authorise-${GITHUB_RUN_ID}"
          PUB="$WORK/id_ed25519.pub"
          SOURCE_IP="$(cat "$WORK/source-ip.txt")"
          test -s "$PUB"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          grep -v "namecheap-google-migration-${GITHUB_RUN_ID}$" "$HOME/.ssh/authorized_keys" > "$HOME/.ssh/authorized_keys.tmp" || true
          mv "$HOME/.ssh/authorized_keys.tmp" "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          printf 'from="%s",no-agent-forwarding,no-port-forwarding,no-X11-forwarding,no-pty %s\n' \
            "$SOURCE_IP" "$(cat "$PUB")" >> "$HOME/.ssh/authorized_keys"

          GOOGLE_IP="$(curl -fsS -H 'Metadata-Flavor: Google' --max-time 5 \
            http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/access-configs/0/external-ip 2>/dev/null || true)"
          if [[ -z "$GOOGLE_IP" ]]; then
            GOOGLE_IP="$(curl -4fsS --max-time 10 https://api.ipify.org || true)"
          fi
          test -n "$GOOGLE_IP" || { echo 'Could not determine Google public IP'; exit 30; }
          printf '%s\n' "$GOOGLE_IP" > "$WORK/google-ip.txt"
          echo 'one_time_google_ssh_authorisation=ready'

      - name: Upload Google endpoint only
        uses: actions/upload-artifact@v4
        with:
          name: migration-google-endpoint-${{ github.run_id }}
          path: /tmp/namecheap-google-authorise-${{ github.run_id }}/google-ip.txt
          retention-days: 1
          if-no-files-found: error

  first-pass-transfer:
    name: First-pass live rsync to Google staging
    needs: prepare-google
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 180
    steps:
      - name: Download Google endpoint
        uses: actions/download-artifact@v4
        with:
          name: migration-google-endpoint-${{ github.run_id }}
          path: /tmp/namecheap-google-migration-${{ github.run_id }}

      - name: Verify direct SSH and rsync the complete folder
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="/tmp/namecheap-google-migration-${GITHUB_RUN_ID}"
          KEY="$KEY_DIR/id_ed25519"
          GOOGLE_IP="$(cat "$KEY_DIR/google-ip.txt")"
          test -s "$KEY"
          command -v rsync >/dev/null

          SSH="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          $SSH ayman01323@"$GOOGLE_IP" 'echo GOOGLE_SSH_READY'

          # First pass is intentionally live: do not stop learnerbot. Mutable DB/state
          # will be reconciled in a short final delta pass at cutover.
          rsync -aH --partial --human-readable \
            --no-owner --no-group \
            --info=stats2,progress2 \
            -e "$SSH" \
            "$SOURCE/" \
            "ayman01323@$GOOGLE_IP:$STAGING_DIR/"

          systemctl is-active --quiet learnerbot.service
          echo 'FIRST_PASS_RSYNC_COMPLETE=true'
          echo 'learnerbot_remained_active=true'

      - name: Remove Namecheap one-time private key
        if: always()
        shell: bash
        run: rm -rf "/tmp/namecheap-google-migration-${GITHUB_RUN_ID}"

  verify-google:
    name: Verify staged folder on Google
    needs: first-pass-transfer
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Verify staged copy without running it
        shell: bash
        run: |
          set -euo pipefail
          test -d "$STAGING_DIR"
          test -d "$STAGING_DIR/learnerbot"
          test -f "$STAGING_DIR/systemd/learnerbot.service"
          echo "staged_size=$(du -sh "$STAGING_DIR" | awk '{print $1}')"
          echo "staged_files=$(find "$STAGING_DIR" -xdev -type f 2>/dev/null | wc -l)"
          echo "git_present=$([[ -d "$STAGING_DIR/.git" ]] && echo true || echo false)"
          echo "venv_present=$([[ -d "$STAGING_DIR/.venv" ]] && echo true || echo false)"
          echo 'staged_bot_started=false'
          echo 'GOOGLE_FIRST_PASS_STAGED=true'
          df -h "$STAGING_ROOT"

  cleanup-google-key:
    name: Remove one-time Google SSH authorisation
    if: always()
    needs: [prepare-google, first-pass-transfer, verify-google]
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Remove migration key and temporary endpoint material
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$HOME/.ssh/authorized_keys" ]]; then
            grep -v "namecheap-google-migration-${GITHUB_RUN_ID}$" "$HOME/.ssh/authorized_keys" > "$HOME/.ssh/authorized_keys.tmp" || true
            mv "$HOME/.ssh/authorized_keys.tmp" "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"
          fi
          rm -rf "/tmp/namecheap-google-authorise-${GITHUB_RUN_ID}"
          echo 'one_time_migration_key_removed=true'
