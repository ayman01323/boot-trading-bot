name: Backup Namecheap VPS to Google Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/namecheap-vps-to-google-backup.yml'

permissions:
  contents: read

concurrency:
  group: namecheap-vps-to-google-backup
  cancel-in-progress: false

jobs:
  prepare-google:
    name: Prepare protected Google backup destination
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    env:
      DEST_DIR: /home/ayman01323/NamcheapBuckup
      KEY_DIR: /home/ayman01323/.namecheap-backup-transfer-${{ github.run_id }}
    steps:
      - name: Verify Google runner and destination
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"
          mkdir -p "$DEST_DIR"
          chmod 700 "$DEST_DIR"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          echo "destination=$DEST_DIR"
          df -h "$DEST_DIR"
          stat -c 'mode=%a owner=%U:%G path=%n' "$DEST_DIR"

      - name: Generate one-time transfer key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$KEY_DIR/private.pem" >/dev/null 2>&1
          chmod 600 "$KEY_DIR/private.pem"
          openssl pkey -in "$KEY_DIR/private.pem" -pubout \
            -out "$KEY_DIR/public.pem" >/dev/null 2>&1
          echo 'GOOGLE_BACKUP_TRANSFER_KEY_READY' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public key only
        uses: actions/upload-artifact@v4
        with:
          name: namecheap-backup-public-${{ github.run_id }}
          path: /home/ayman01323/.namecheap-backup-transfer-${{ github.run_id }}/public.pem
          retention-days: 1
          if-no-files-found: error

  export-namecheap:
    name: Create encrypted backup on old Namecheap VPS
    needs: prepare-google
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 90
    env:
      WORK: /tmp/namecheap-backup-${{ github.run_id }}
      PUBLIC_KEY: /var/tmp/namecheap-google-backup-public.pem
      HANDOFF: /var/tmp/namecheap-google-backup-export
      WRAPPER: /usr/local/sbin/export-namecheap-google-backup
    steps:
      - name: Download Google public key
        uses: actions/download-artifact@v4
        with:
          name: namecheap-backup-public-${{ github.run_id }}
          path: /tmp/namecheap-backup-${{ github.run_id }}

      - name: Stage public key and verify restricted backup permission
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$WORK"
          install -m 0600 "$WORK/public.pem" "$PUBLIC_KEY"
          openssl pkey -pubin -in "$PUBLIC_KEY" -noout >/dev/null
          test -x "$WRAPPER" || {
            echo 'Restricted backup wrapper is not installed on the old VPS.' >&2
            echo 'Install scripts/install_namecheap_google_backup_wrapper.sh once as root.' >&2
            exit 20
          }
          sudo -n -l "$WRAPPER" >/dev/null 2>&1 || {
            echo 'github-runner is not yet authorised for the restricted backup wrapper.' >&2
            exit 21
          }

      - name: Create consistent encrypted old-server backup through restricted wrapper
        shell: bash
        run: |
          set -euo pipefail
          sudo -n "$WRAPPER"
          test -s "$HANDOFF/backup-metadata.env"
          test -s "$HANDOFF/aes.pass.enc"
          shopt -s nullglob
          archives=("$HANDOFF"/*.tar.gz.enc)
          test "${#archives[@]}" -eq 1
          cp -a "$HANDOFF"/. "$WORK"/
          source "$WORK/backup-metadata.env"
          echo "backup_name=$BACKUP_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "plaintext_bytes=$BACKUP_SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo 'old_server_archive_encrypted_before_runner_handoff=true' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted backup bundle
        uses: actions/upload-artifact@v4
        with:
          name: namecheap-backup-encrypted-${{ github.run_id }}
          path: |
            /tmp/namecheap-backup-${{ github.run_id }}/*.tar.gz.enc
            /tmp/namecheap-backup-${{ github.run_id }}/aes.pass.enc
            /tmp/namecheap-backup-${{ github.run_id }}/backup-metadata.env
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Remove runner-owned temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$WORK"
          rm -f "$PUBLIC_KEY"

  import-google:
    name: Store and verify backup on Google server
    needs: export-namecheap
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 90
    env:
      DEST_DIR: /home/ayman01323/NamcheapBuckup
      KEY_DIR: /home/ayman01323/.namecheap-backup-transfer-${{ github.run_id }}
      WORK: /tmp/namecheap-backup-import-${{ github.run_id }}
    steps:
      - name: Verify Google runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "botgoogle"
          test "$(id -un)" = "ayman01323"
          test -s "$KEY_DIR/private.pem"
          mkdir -p "$DEST_DIR" "$WORK"
          chmod 700 "$DEST_DIR" "$WORK"

      - name: Download encrypted old-server backup
        uses: actions/download-artifact@v4
        with:
          name: namecheap-backup-encrypted-${{ github.run_id }}
          path: /tmp/namecheap-backup-import-${{ github.run_id }}

      - name: Decrypt, verify and install backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source "$WORK/backup-metadata.env"
          ENC="$WORK/${BACKUP_NAME}.enc"
          PASS="$WORK/aes.pass"
          FINAL="$DEST_DIR/$BACKUP_NAME"
          PART="$DEST_DIR/.${BACKUP_NAME}.part"

          test -s "$ENC"
          ENC_SIZE="$(stat -c%s "$ENC")"
          AVAIL="$(df -PB1 "$DEST_DIR" | awk 'NR==2 {print $4}')"
          NEED=$(( ENC_SIZE * 2 + 1073741824 ))
          if [ "$AVAIL" -lt "$NEED" ]; then
            echo "Insufficient Google-server disk space. available=$AVAIL required=$NEED" >&2
            exit 30
          fi

          openssl pkeyutl -decrypt -inkey "$KEY_DIR/private.pem" \
            -in "$WORK/aes.pass.enc" -out "$PASS" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 "$PASS"

          rm -f "$PART"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$ENC" -out "$PART" -pass file:"$PASS"
          chmod 600 "$PART"

          ACTUAL_SIZE="$(stat -c%s "$PART")"
          ACTUAL_HASH="$(sha256sum "$PART" | awk '{print $1}')"
          test "$ACTUAL_SIZE" = "$BACKUP_SIZE"
          test "$ACTUAL_HASH" = "$BACKUP_SHA256"
          tar -tzf "$PART" >/dev/null

          mv -f "$PART" "$FINAL"
          chmod 600 "$FINAL"
          printf '%s  %s\n' "$BACKUP_SHA256" "$BACKUP_NAME" > "$FINAL.sha256"
          chmod 600 "$FINAL.sha256"

          cat > "$DEST_DIR/latest-backup.txt" <<EOF
          backup_name=$BACKUP_NAME
          source_host=$SOURCE_HOST
          created_utc=$CREATED_UTC
          size_bytes=$BACKUP_SIZE
          sha256=$BACKUP_SHA256
          verified_on_google_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          destination=$FINAL
          EOF
          chmod 600 "$DEST_DIR/latest-backup.txt"

          echo "BACKUP_VERIFIED_ON_GOOGLE=true"
          echo "destination=$FINAL"
          echo "size_bytes=$BACKUP_SIZE"
          echo "sha256=$BACKUP_SHA256"
          df -h "$DEST_DIR"
          ls -lh "$FINAL" "$FINAL.sha256" "$DEST_DIR/latest-backup.txt"

      - name: Clean encrypted transfer material
        if: always()
        shell: bash
        run: rm -rf "$WORK" "$KEY_DIR"

  cleanup-google-key:
    name: Remove one-time Google transfer key
    if: always()
    needs: [prepare-google, export-namecheap, import-google]
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    env:
      KEY_DIR: /home/ayman01323/.namecheap-backup-transfer-${{ github.run_id }}
    steps:
      - name: Remove ephemeral transfer key
        shell: bash
        run: rm -rf "$KEY_DIR"
