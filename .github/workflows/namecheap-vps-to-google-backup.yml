name: Backup Namecheap VPS to Google Server — DISABLED

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/namecheap-vps-to-google-backup.yml'

permissions:
  contents: read

# Keep the original concurrency group so this disabling commit cancels any
# in-progress instance of the old backup workflow.
concurrency:
  group: namecheap-vps-to-google-backup
  cancel-in-progress: true

jobs:
  disabled:
    if: ${{ false }}
    name: Old Namecheap backup disabled
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Old Namecheap VPS backup is disabled.'
