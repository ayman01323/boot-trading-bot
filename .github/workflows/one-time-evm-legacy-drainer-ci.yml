name: One-time EVM Legacy Backlog Drainer CI

on:
  pull_request:
    paths:
      - 'learnerbot/sibot_legacy_backlog_drainer_patch.py'
      - 'learnerbot/final_runtime_integrity_patch.py'
      - 'tests/test_sibot_legacy_backlog_drainer_patch.py'
      - '.github/workflows/one-time-evm-legacy-drainer-ci.yml'

permissions:
  contents: read

concurrency:
  group: one-time-evm-legacy-drainer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 30
    env:
      CI_VENV: /tmp/evm-legacy-drainer-ci-${{ github.run_id }}
    steps:
      - name: Check out PR merge ref without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare isolated Python 3.11 environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CI_VENV"
          python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), sys.version'
          python3 -m venv "$CI_VENV"
          "$CI_VENV/bin/python" -m pip install --disable-pip-version-check -q --upgrade pip
          "$CI_VENV/bin/python" -m pip install --disable-pip-version-check -q -r requirements.txt pytest

      - name: Compile entire Python tree
        run: "$CI_VENV/bin/python" -m compileall -q learnerbot scripts tests

      - name: Focused EVM history recovery regression suite
        shell: bash
        run: |
          "$CI_VENV/bin/python" -m pytest -x -vv \
            tests/test_sibot_legacy_backlog_drainer_patch.py \
            tests/test_sibot_legacy_error_sweep_patch.py \
            tests/test_legacy_sweep_repopulates_broader_leader_pool.py \
            tests/test_sibot_alchemy_retry_queue.py \
            tests/test_sibot_alchemy_trace_progress.py \
            tests/test_sibot_alchemy_context_progress.py \
            tests/test_sibot_history_worker_isolation.py \
            tests/test_sibot_evm_worker_reliability.py

      - name: Production import order and runtime integrity
        shell: bash
        run: |
          "$CI_VENV/bin/python" -m pytest -x -vv \
            tests/test_imports.py \
            tests/test_main_import_order.py \
            tests/test_solana_runtime_composition.py

      - name: Core SiBot regressions
        shell: bash
        run: |
          "$CI_VENV/bin/python" -m pytest -x -vv \
            tests/test_sibot.py \
            tests/test_sibot_profit_guard.py \
            tests/test_sibot_reasonable_top20.py

      - name: Clean isolated environment
        if: always()
        shell: bash
        run: rm -rf "$CI_VENV"
