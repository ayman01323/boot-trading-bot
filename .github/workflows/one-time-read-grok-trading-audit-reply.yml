name: One-time Read Grok Trading Audit Reply

on:
  pull_request:
    paths:
      - '.github/workflows/one-time-read-grok-trading-audit-reply.yml'

permissions:
  contents: read

concurrency:
  group: one-time-read-grok-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  read-reply:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Search Strategy Factory snapshot and journal for Grok audit reply
        shell: bash
        run: |
          set -euo pipefail
          src=/var/tmp/boot/ai_agent_bus.sqlite3
          snap="$RUNNER_TEMP/grok-audit.sqlite3"
          test -s "$src"
          cp "$src" "$snap"
          [[ -r "${src}-wal" ]] && cp "${src}-wal" "${snap}-wal" || true
          [[ -r "${src}-shm" ]] && cp "${src}-shm" "${snap}-shm" || true
          SNAP="$snap" python3 - <<'PY'
          import os, sqlite3
          exact='2026-08-23T18-10-grok-full-trading-stop-audit'
          conn=sqlite3.connect(os.environ['SNAP'])
          conn.row_factory=sqlite3.Row
          cols={r['name'] for r in conn.execute('PRAGMA table_info(messages)')}
          wanted=['message_id','thread_id','subject','sender','target','status','body','reply','error','created_at','delivered_at','acknowledged_at','replied_at']
          selected=[c for c in wanted if c in cols]
          select='SELECT '+','.join(selected)+' FROM messages '
          rows=[]
          if 'message_id' in cols:
              rows.extend(conn.execute(select+'WHERE message_id=?',(exact,)).fetchall())
              if not rows:
                  rows.extend(conn.execute(select+"WHERE message_id LIKE ? ORDER BY rowid DESC LIMIT 20",('%grok-full-trading-stop-audit%',)).fetchall())
          if not rows and {'sender','target'} <= cols:
              rows.extend(conn.execute(select+"WHERE sender='grok' OR target='grok' ORDER BY rowid DESC LIMIT 40").fetchall())
          conn.close()
          print('CANDIDATE_ROWS='+str(len(rows)))
          for i,row in enumerate(rows,1):
              v=dict(row)
              print(f'--- CANDIDATE {i} ---')
              for key in ['message_id','sender','target','status','subject','thread_id','created_at','delivered_at','acknowledged_at','replied_at']:
                  if key in v: print(key.upper()+'='+str(v.get(key) or ''))
              text=str(v.get('reply') or v.get('body') or '')
              print('TEXT_BEGIN')
              print(text)
              print('TEXT_END')
              if str(v.get('error') or ''): print('ERROR='+str(v.get('error')))
          PY

          echo '=== JOURNAL EXACT-ID SEARCH ==='
          journalctl -u learnerbot --since '2026-08-23 18:00:00 UTC' --until '2026-08-23 18:30:00 UTC' --no-pager 2>/dev/null \
            | grep -F -C 8 '2026-08-23T18-10-grok-full-trading-stop-audit' || true
          echo '=== JOURNAL GROK/TRADING-AUDIT SEARCH ==='
          journalctl -u learnerbot --since '2026-08-23 18:00:00 UTC' --until '2026-08-23 18:30:00 UTC' --no-pager 2>/dev/null \
            | grep -Eai -C 4 'grok|trading.?stop|full.?trading' | tail -n 300 || true
