name: One-time Strategy Factory Six-Agent Full Mesh

on:
  pull_request:
    paths:
      - '.github/workflows/one-time-six-agent-full-mesh.yml'

permissions:
  contents: read

concurrency:
  group: one-time-six-agent-full-mesh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-mesh:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 25
    steps:
      - name: Check out test branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify live six-agent runtime
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet learnerbot
          test -s /var/tmp/boot/ai_agent_ws_status.json
          python3 - <<'PY'
          import json, time
          p='/var/tmp/boot/ai_agent_ws_status.json'
          d=json.load(open(p,encoding='utf-8'))
          expected={'gpt','claude','gemini','deepseek','grok','copilot'}
          assert d.get('state') in {'ACTIVE','EXTERNAL'}, d
          assert d.get('host') == '127.0.0.1', d
          assert int(d.get('port') or 0) == 8765, d
          assert set(d.get('workers') or []) == expected, d.get('workers')
          age=int(time.time())-int(d.get('updated_epoch') or 0)
          assert age < 86400, age
          print('RUNTIME=PASS')
          print('WORKERS='+','.join(d.get('workers') or []))
          print('STATUS_AGE_SECONDS='+str(age))
          PY

      - name: Build isolated sender environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/sf-six-agent-full-mesh"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Run all 30 directed agent-to-agent exchanges
        shell: bash
        run: |
          set -euo pipefail
          agents=(gpt claude gemini deepseek grok copilot)
          total=0
          passed=0
          failed=0
          subject="Full mesh live test ${GITHUB_RUN_ID}"

          for sender in "${agents[@]}"; do
            for target in "${agents[@]}"; do
              [[ "$sender" == "$target" ]] && continue
              total=$((total+1))
              marker="MESH_OK_${sender^^}_TO_${target^^}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
              mid="sfmesh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${sender}-${target}"
              echo "=== PAIR ${sender}->${target} ==="
              set +e
              output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
                --from "$sender" \
                --to "$target" \
                --message-id "$mid" \
                --subject "$subject" \
                --timeout 120 \
                --message "Communication-only Strategy Factory full-mesh test. Reply exactly: ${marker}. Do not edit files, run commands, deploy, trade, access wallets, or change LIVE/risk/capital settings." 2>&1)"
              rc=$?
              set -e
              printf '%s\n' "$output"
              if [[ $rc -ne 0 ]]; then
                echo "PAIR_RESULT ${sender}->${target} FAIL sender_rc=${rc}"
                failed=$((failed+1))
                continue
              fi
              final="$(printf '%s\n' "$output" | tail -n 1)"
              if SENDER="$sender" TARGET="$target" MARKER="$marker" FINAL="$final" python3 - <<'PY'
          import json, os
          sender=os.environ['SENDER']
          target=os.environ['TARGET']
          marker=os.environ['MARKER']
          value=json.loads(os.environ['FINAL'])
          assert value.get('from') == sender, value
          assert value.get('to') == target, value
          assert value.get('status') == 'REPLIED', value
          assert value.get('delivered') is True, value
          assert value.get('acknowledged') is True, value
          assert not str(value.get('error') or ''), value
          assert str(value.get('body') or '').strip() == marker, value
          assert str(value.get('thread_id') or '').startswith('thr-full-mesh-live-test-'), value
          print(f'PAIR_VALIDATED {sender}->{target}')
          PY
              then
                echo "PAIR_RESULT ${sender}->${target} PASS"
                passed=$((passed+1))
              else
                echo "PAIR_RESULT ${sender}->${target} FAIL validation"
                failed=$((failed+1))
              fi
            done
          done

          echo "MESH_TOTAL=$total"
          echo "MESH_PASS=$passed"
          echo "MESH_FAIL=$failed"
          test "$total" -eq 30
          test "$passed" -eq 30
          test "$failed" -eq 0

      - name: Verify durable SQLite evidence for all 30 exchanges
        shell: bash
        run: |
          set -euo pipefail
          DB='/var/tmp/boot/ai_agent_bus.sqlite3'
          SNAP="$RUNNER_TEMP/sfmesh-audit.sqlite3"
          test -s "$DB"
          DB="$DB" SNAP="$SNAP" RUN_ID="$GITHUB_RUN_ID" ATTEMPT="$GITHUB_RUN_ATTEMPT" python3 - <<'PY'
          import os, sqlite3
          source=os.environ['DB']
          snap=os.environ['SNAP']
          run=os.environ['RUN_ID']
          attempt=os.environ['ATTEMPT']
          src=sqlite3.connect(f'file:{source}?mode=ro', uri=True, timeout=5)
          dst=sqlite3.connect(snap)
          try:
              src.backup(dst)
          finally:
              dst.close(); src.close()
          conn=sqlite3.connect(snap)
          conn.row_factory=sqlite3.Row
          rows=list(conn.execute(
              "SELECT message_id,sender,target,status,reply,delivered_at,acknowledged_at,replied_at FROM messages WHERE message_id LIKE ? ORDER BY message_id",
              (f'sfmesh-{run}-{attempt}-%',),
          ))
          conn.close()
          assert len(rows) == 30, len(rows)
          failures=[]
          for row in rows:
              marker=f"MESH_OK_{row['sender'].upper()}_TO_{row['target'].upper()}_{run}_{attempt}"
              ok=(
                  row['status']=='REPLIED'
                  and str(row['reply'] or '').strip()==marker
                  and row['delivered_at'] is not None
                  and row['acknowledged_at'] is not None
                  and row['replied_at'] is not None
              )
              print(f"AUDIT {row['sender']}->{row['target']} {'PASS' if ok else 'FAIL'} {row['message_id']}")
              if not ok:
                  failures.append(row['message_id'])
          print(f'DURABLE_ROWS={len(rows)}')
          print(f'DURABLE_FAILURES={len(failures)}')
          assert not failures, failures
          print('FULL_MESH_DURABLE_EVIDENCE=PASS')
          PY

      - name: Remove isolated test environment
        if: always()
        shell: bash
        run: rm -rf "${VENV:-$RUNNER_TEMP/sf-six-agent-full-mesh}" "$RUNNER_TEMP/sfmesh-audit.sqlite3"
