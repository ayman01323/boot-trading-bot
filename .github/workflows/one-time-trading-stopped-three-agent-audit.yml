name: One-time Trading Stopped Three-Agent Audit

on:
  pull_request:
    paths:
      - '.github/workflows/one-time-trading-stopped-three-agent-audit.yml'

permissions:
  contents: read

concurrency:
  group: one-time-trading-stopped-three-agent-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    steps:
      - name: Check out test branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 80

      - name: Collect read-only live and repository evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trading-stop-audit"
          OUT="$RUNNER_TEMP/trading-stop-audit"
          {
            echo "=== SOURCE ==="
            echo "checkout_sha=$(git rev-parse HEAD)"
            echo "base_main_sha=${{ github.event.pull_request.base.sha }}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "=== SERVICE / RESTRICTED STATUS ==="
            systemctl is-active learnerbot || true
            systemctl show learnerbot -p ActiveState -p SubState -p MainPID -p ExecMainStartTimestamp --no-pager || true
            sudo /usr/local/sbin/status-boot-trading-bot || true
          } > "$OUT/live_status.txt" 2>&1
          {
            echo "=== STRATEGY FACTORY RUNTIME ==="
            cat /var/tmp/boot/ai_agent_ws_status.json 2>/dev/null || true
            echo
            echo "=== READABLE RUNTIME DIAGNOSTICS ==="
            find /var/tmp/boot -maxdepth 1 -type f -printf '%f %s bytes %TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null | sort || true
            for f in /var/tmp/boot/*trade* /var/tmp/boot/*health* /var/tmp/boot/*status*; do
              [[ -f "$f" && -r "$f" ]] || continue
              echo "--- $f ---"
              head -c 10000 "$f" 2>/dev/null || true
              echo
            done
          } > "$OUT/runtime_files.txt" 2>&1
          {
            echo "=== RECENT TRADING/ERROR LOG SIGNALS ==="
            journalctl -u learnerbot --since '12 hours ago' --no-pager -n 1800 2>/dev/null \
              | grep -Eai 'trade|trading|auto|live|solana|evm|quote|swap|simulation|eligible|reject|skip|block|gate|error|exception|failed|timeout|liquidity|balance|jupiter|alchemy|etherscan|rpc|leader|circuit|quarantine' \
              | tail -n 700 || true
          } > "$OUT/journal_signals.txt" 2>&1
          {
            echo "=== RECENT TRADING-RELATED COMMITS ==="
            git log --date=iso --pretty=format:'%h %ad %s' -70 -- learnerbot/auto_trader.py learnerbot/live_executor.py learnerbot/solana* learnerbot/*trade* learnerbot/*execution* learnerbot/*market* scripts/sibot_leader_gate_report.py || true
            echo
            echo "=== CURRENT GATE / BLOCKER CODE SIGNALS ==="
            grep -RInE --exclude-dir='.git' 'auto_trading_enabled|trading_enabled|platform_auto|platform_live|eligible|simulation|REJECT|SKIP|quote|liquidity|loss_quarantine|circuit|leader|Jupiter|Alchemy|Etherscan|RPC' learnerbot scripts 2>/dev/null | head -n 500 || true
            echo
            python3 -m compileall -q learnerbot scripts && echo COMPILE_PASS || echo COMPILE_FAIL
          } > "$OUT/repo_signals.txt" 2>&1
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          chunks=[]
          for name,limit in [('live_status.txt',5000),('runtime_files.txt',2500),('journal_signals.txt',3500),('repo_signals.txt',2500)]:
              p=root/name
              t=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
              chunks.append(f'\n===== {name} =====\n'+t[-limit:])
          context=''.join(chunks)[-11000:]
          (root/'context.txt').write_text(context,encoding='utf-8')
          print('audit_context_chars='+str(len(context)))
          print(context)
          PY

      - name: Probe and ask Gemini, DeepSeek and Copilot independently
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/trading-stop-audit"
          context="$(cat "$OUT/context.txt")"
          agents=(gemini deepseek copilot)
          failures=0
          for agent in "${agents[@]}"; do
            echo "===== HEALTH ${agent} ====="
            set +e
            health="$(python3 scripts/ai_agent_ws_send.py --from gpt --to "$agent" --message "Trading-stop audit health probe. Reply exactly HEALTH_OK." --timeout 35 2>&1)"
            hrc=$?
            set -e
            printf '%s\n' "$health"
            if [[ $hrc -ne 0 ]]; then
              echo "${agent^^}_AUDIT=UNAVAILABLE health_rc=$hrc" | tee "$OUT/${agent}_reply.txt"
              failures=$((failures+1))
              continue
            fi
            prompt="You are an independent engineering auditor. The live multi-chain trading bot traded before and has now stopped. REPORT ONLY. From the evidence below, return: VERDICT; PROVEN BLOCKERS; BUGS/REGRESSIONS ranked P0-P3; WHY IT WORKED BEFORE; FIX PLAN preserving all safety/profit/liquidity gates; VERIFICATION without forcing a trade; UNKNOWNS. Label claims PROVEN/HIGH-CONFIDENCE/MEDIUM-CONFIDENCE/HYPOTHESIS and cite evidence. Do not edit, deploy, restart, trade, access wallets/secrets or alter LIVE/risk/capital settings.\n\nEVIDENCE:\n${context}"
            echo "===== AUDIT ${agent} ====="
            set +e
            output="$(python3 scripts/ai_agent_ws_send.py --from gpt --to "$agent" --subject "Trading stopped audit - ${agent} - ${GITHUB_RUN_ID}" --message "$prompt" --timeout 150 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            final="$(printf '%s\n' "$output" | tail -n 1)"
            AGENT="$agent" FINAL="$final" python3 - "$OUT" <<'PY'
          import json,os,pathlib,sys
          out=pathlib.Path(sys.argv[1]); agent=os.environ['AGENT']
          try: v=json.loads(os.environ['FINAL'])
          except Exception as exc:
              (out/f'{agent}_reply.txt').write_text(f'PARSE_FAILED: {exc}\n',encoding='utf-8'); raise SystemExit(2)
          body=str(v.get('body') or '').strip()
          if v.get('status')!='REPLIED' or not v.get('acknowledged') or not body:
              (out/f'{agent}_reply.txt').write_text(json.dumps(v,indent=2)+'\n',encoding='utf-8'); raise SystemExit(3)
          (out/f'{agent}_reply.txt').write_text(body+'\n',encoding='utf-8')
          print(f'{agent.upper()}_AUDIT=PASS chars={len(body)}')
          PY
            prc=$?
            if [[ $rc -ne 0 || $prc -ne 0 ]]; then failures=$((failures+1)); fi
          done
          echo "AGENT_AUDIT_FAILURES=$failures"
          exit 0

      - name: Print consolidated replies
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/trading-stop-audit"
          for agent in gemini deepseek copilot; do
            echo
            echo "================ ${agent^^} AUDIT ================"
            cat "$OUT/${agent}_reply.txt" 2>/dev/null || echo "NO_REPLY_FILE"
          done
