name: Polygon Readiness Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Read-only configured EVM wallet balances
        run: sudo /usr/local/sbin/check-boot-wallet "0xC9271cB571233987b7c447d8588596B978fB293D"
      - name: Current service status
        run: sudo /usr/local/sbin/status-boot-trading-bot
