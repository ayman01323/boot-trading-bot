name: Post-deploy Solana Moderate Verify

on:
  push:
    branches:
      - ops/verify-solana-moderate-d363
    paths:
      - '.github/workflows/post-deploy-solana-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Read-only runtime verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=/tmp/post-deploy-solana-verify.txt
          {
            echo 'expected_deployed_sha=d363baf1281001a92e60aa21ced1b67a5d099248'
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '=== SERVER STATUS ==='
            sudo /usr/local/sbin/status-boot-trading-bot
            echo
            echo '=== SOLANA LEADER SELECTOR BRIDGE ==='
            cat /var/tmp/boot/solana_leader_selector.json 2>&1 || true
            echo
            echo '=== STARTUP MARKERS (read-only, if journal ACL permits) ==='
            journalctl -u learnerbot.service --since '2026-08-24 02:35:20' --no-pager 2>&1 | grep -E 'final-runtime-integrity|solana-leader-quality|solana-leader-edge-alignment|solana-operator-writeoff' || true
          } > "$out" 2>&1
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-post-deploy-solana-verify.txt"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 "$out")"
          if [[ -n "$existing_sha" ]]; then
            payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({'message':'Update post-deploy Solana verification','content':sys.argv[1],'sha':sys.argv[2],'branch':'server-diagnostics'}))
          PY
          )"
          else
            payload="$(python3 - "$encoded" <<'PY'
          import json,sys
          print(json.dumps({'message':'Create post-deploy Solana verification','content':sys.argv[1],'branch':'server-diagnostics'}))
          PY
          )"
          fi
          curl -fsS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$payload" >/dev/null
