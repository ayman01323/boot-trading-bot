name: PR703 Refused Telegram Focused Test

on:
  push:
    branches:
      - fix/rejected-telegram-pool-value-20260828
    paths:
      - 'learnerbot/rejected_opportunity_publisher.py'
      - 'sibot1_engines/_shared/rejected_poolcheck_patch.py'
      - 'tests/test_rejected_opportunity_telegram_reporting.py'
      - '.github/workflows/pr703-refused-telegram-focused-test.yml'

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests
      - name: Compile changed runtime modules
        run: python -m py_compile learnerbot/rejected_opportunity_publisher.py sibot1_engines/_shared/rejected_poolcheck_patch.py tests/test_rejected_opportunity_telegram_reporting.py
      - name: Run focused tests
        run: pytest -q tests/test_rejected_opportunity_telegram_reporting.py
