name: Publish Telegram AI Master Control

on:
  schedule:
    # Keep the operator-facing control bridge responsive without cloning/fetching the
    # repository every five minutes. The job below transfers only a tiny JSON object
    # and does nothing when the semantic control state has not changed.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-ai-master-control
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Validate sanitised Telegram AI control bridge
        id: control
        shell: bash
        run: |
          set -euo pipefail
          src=/var/tmp/boot/ai_master_control.json
          if [[ ! -s "$src" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No Telegram AI control bridge exists yet.'
            exit 0
          fi
          python3 - "$src" /tmp/ai-master-control.json <<'PY'
          import json,sys
          src,out=sys.argv[1:3]
          p=json.load(open(src,encoding='utf-8'))
          providers={'auto','gpt','gemini','copilot','claude','deepseek'}
          cycles={'scheduled','manual'}
          vps_actions={'none','inspect','test','deploy'}
          ds_github_actions={'none','inspect','test','draft_fix'}
          clean={'schema_version':1}
          for lane in ('strategy','engineering'):
              master=str(p.get(lane+'_master') or 'auto').lower()
              cycle=str(p.get(lane+'_cycle') or 'scheduled').lower()
              if master not in providers: raise SystemExit('invalid master provider')
              if cycle not in cycles: raise SystemExit('invalid cycle mode')
              clean[lane+'_master']=master
              clean[lane+'_cycle']=cycle
              clean[lane+'_enabled']=bool(p.get(lane+'_enabled',True))
              clean[lane+'_run_nonce']=max(0,int(p.get(lane+'_run_nonce') or 0))
          action=str(p.get('claude_vps_action') or 'none').lower()
          if action not in vps_actions: raise SystemExit('invalid Claude VPS action')
          clean['claude_vps_action']=action
          clean['claude_vps_action_nonce']=max(0,int(p.get('claude_vps_action_nonce') or 0))
          clean['claude_vps_last_request_epoch']=max(0,int(p.get('claude_vps_last_request_epoch') or 0))
          ds_gh=str(p.get('deepseek_github_action') or 'none').lower()
          if ds_gh not in ds_github_actions: raise SystemExit('invalid DeepSeek GitHub action')
          clean['deepseek_github_action']=ds_gh
          clean['deepseek_github_action_nonce']=max(0,int(p.get('deepseek_github_action_nonce') or 0))
          clean['deepseek_github_task']=str(p.get('deepseek_github_task') or '').replace('\x00','').strip()[:800]
          clean['deepseek_github_last_request_epoch']=max(0,int(p.get('deepseek_github_last_request_epoch') or 0))
          ds_vps=str(p.get('deepseek_vps_action') or 'none').lower()
          if ds_vps not in vps_actions: raise SystemExit('invalid DeepSeek VPS action')
          clean['deepseek_vps_action']=ds_vps
          clean['deepseek_vps_action_nonce']=max(0,int(p.get('deepseek_vps_action_nonce') or 0))
          clean['deepseek_vps_last_request_epoch']=max(0,int(p.get('deepseek_vps_last_request_epoch') or 0))
          clean['updated_epoch']=max(0,int(p.get('updated_epoch') or 0))
          clean['updated_by']=str(p.get('updated_by') or '')[:80]
          json.dump(clean,open(out,'w',encoding='utf-8'),indent=2,sort_keys=True);open(out,'a').write('\n')
          PY
          echo 'available=true' >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('/tmp/ai-master-control.json'))
          for key in ('claude_vps_action','deepseek_github_action','deepseek_vps_action'):
              print(f'{key}={p.get(key,"none")}')
          for key in ('claude_vps_action_nonce','deepseek_github_action_nonce','deepseek_vps_action_nonce'):
              print(f'{key}={int(p.get(key) or 0)}')
          PY

      - name: Publish only changed control through GitHub Contents API
        if: steps.control.outputs.available == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/contents/control/latest.json"
          existing_sha=''
          set +e
          gh api -H 'Accept: application/vnd.github+json' "$api?ref=ai-reviews" > /tmp/ai-master-existing-api.json 2>/dev/null
          rc=$?
          set -e
          if [[ $rc -eq 0 && -s /tmp/ai-master-existing-api.json ]]; then
            existing_sha="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/ai-master-existing-api.json')).get('sha') or '')
          PY
            )"
            python3 - <<'PY'
          import base64,json
          d=json.load(open('/tmp/ai-master-existing-api.json'))
          raw=base64.b64decode((d.get('content') or '').replace('\n',''))
          open('/tmp/ai-master-existing.json','wb').write(raw)
          PY
          else
            echo '{}' > /tmp/ai-master-existing.json
          fi
          python3 - <<'PY' > /tmp/ai-master-comparison.env
          import json
          new=json.load(open('/tmp/ai-master-control.json'))
          try: old=json.load(open('/tmp/ai-master-existing.json'))
          except Exception: old={}
          old_no_time=dict(old); old_no_time.pop('published_epoch',None)
          print('CHANGED=' + ('true' if old_no_time != new else 'false'))
          for name in ('deepseek_github','deepseek_vps'):
              key=name+'_action_nonce'
              requested=int(new.get(key) or 0) > int(old.get(key) or 0)
              print(name.upper()+'_REQUEST=' + ('true' if requested else 'false'))
          PY
          source /tmp/ai-master-comparison.env
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "deepseek_github_request=$DEEPSEEK_GITHUB_REQUEST" >> "$GITHUB_OUTPUT"
          echo "deepseek_vps_request=$DEEPSEEK_VPS_REQUEST" >> "$GITHUB_OUTPUT"
          if [[ "$CHANGED" != true ]]; then
            echo 'Control is semantically unchanged; no ai-reviews commit/write required.'
            exit 0
          fi
          python3 - <<'PY'
          import json,time
          p=json.load(open('/tmp/ai-master-control.json'))
          p['published_epoch']=int(time.time())
          open('/tmp/ai-master-published.json','w',encoding='utf-8').write(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          python3 - "$existing_sha" <<'PY' > /tmp/ai-master-put.json
          import base64,json,sys
          raw=open('/tmp/ai-master-published.json','rb').read()
          out={'message':'Publish changed Telegram AI master control','content':base64.b64encode(raw).decode(),'branch':'ai-reviews'}
          if sys.argv[1]: out['sha']=sys.argv[1]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/ai-master-put.json >/dev/null

      - name: Wake bounded Claude processor only for a changed VPS request
        if: steps.publish.outputs.changed == 'true' && steps.control.outputs.claude_vps_action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run claude-vps-controlled-ops.yml --repo "$GITHUB_REPOSITORY" --ref main -f action=none

      - name: Dispatch new bounded DeepSeek GitHub request
        if: steps.publish.outputs.deepseek_github_request == 'true' && steps.control.outputs.deepseek_github_action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.control.outputs.deepseek_github_action }}
        shell: bash
        run: |
          task="$(python3 -c "import json;print(json.load(open('/tmp/ai-master-control.json')).get('deepseek_github_task',''))")"
          gh workflow run deepseek-github-controlled-ops.yml --repo "$GITHUB_REPOSITORY" --ref main -f action="$ACTION" -f task="$task"

      - name: Dispatch new bounded DeepSeek VPS request
        if: steps.publish.outputs.deepseek_vps_request == 'true' && steps.control.outputs.deepseek_vps_action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.control.outputs.deepseek_vps_action }}
        run: gh workflow run deepseek-vps-controlled-ops.yml --repo "$GITHUB_REPOSITORY" --ref main -f action="$ACTION"
