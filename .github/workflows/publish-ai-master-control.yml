name: Publish Telegram AI Master Control

on:
  schedule:
    # Keep the operator-facing control bridge responsive without cloning/fetching the
    # repository every five minutes. The job below transfers only tiny JSON objects
    # and does nothing when semantic control/change state has not changed.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-ai-master-control
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Validate sanitised Telegram AI control bridge
        id: control
        shell: bash
        run: |
          set -euo pipefail
          src=/var/tmp/boot/ai_master_control.json
          if [[ ! -s "$src" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No Telegram AI control bridge exists yet.'
            exit 0
          fi
          python3 - "$src" /tmp/ai-master-control.json <<'PY'
          import json,sys
          src,out=sys.argv[1:3]
          p=json.load(open(src,encoding='utf-8'))
          providers={'auto','gpt','gemini','copilot','claude','deepseek'}
          cycles={'scheduled','manual'}
          vps_actions={'none','inspect','test','deploy'}
          ds_github_actions={'none','inspect','test','draft_fix'}
          clean={'schema_version':1}
          for lane in ('strategy','engineering'):
              master=str(p.get(lane+'_master') or 'auto').lower()
              cycle=str(p.get(lane+'_cycle') or 'scheduled').lower()
              if master not in providers: raise SystemExit('invalid master provider')
              if cycle not in cycles: raise SystemExit('invalid cycle mode')
              clean[lane+'_master']=master
              clean[lane+'_cycle']=cycle
              clean[lane+'_enabled']=bool(p.get(lane+'_enabled',True))
              clean[lane+'_run_nonce']=max(0,int(p.get(lane+'_run_nonce') or 0))
          action=str(p.get('claude_vps_action') or 'none').lower()
          if action not in vps_actions: raise SystemExit('invalid Claude VPS action')
          clean['claude_vps_action']=action
          clean['claude_vps_action_nonce']=max(0,int(p.get('claude_vps_action_nonce') or 0))
          clean['claude_vps_last_request_epoch']=max(0,int(p.get('claude_vps_last_request_epoch') or 0))

          ds_gh=str(p.get('deepseek_github_action') or 'none').lower()
          if ds_gh not in ds_github_actions: raise SystemExit('invalid DeepSeek GitHub action')
          clean['deepseek_github_action']=ds_gh
          clean['deepseek_github_action_nonce']=max(0,int(p.get('deepseek_github_action_nonce') or 0))
          clean['deepseek_github_task']=str(p.get('deepseek_github_task') or '').replace('\x00','').strip()[:800]
          clean['deepseek_github_last_request_epoch']=max(0,int(p.get('deepseek_github_last_request_epoch') or 0))

          ds_vps=str(p.get('deepseek_vps_action') or 'none').lower()
          if ds_vps not in vps_actions: raise SystemExit('invalid DeepSeek VPS action')
          clean['deepseek_vps_action']=ds_vps
          clean['deepseek_vps_action_nonce']=max(0,int(p.get('deepseek_vps_action_nonce') or 0))
          clean['deepseek_vps_last_request_epoch']=max(0,int(p.get('deepseek_vps_last_request_epoch') or 0))

          clean['updated_epoch']=max(0,int(p.get('updated_epoch') or 0))
          clean['updated_by']=str(p.get('updated_by') or '')[:80]
          json.dump(clean,open(out,'w',encoding='utf-8'),indent=2,sort_keys=True);open(out,'a').write('\n')
          PY
          echo 'available=true' >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('/tmp/ai-master-control.json'))
          for key in ('claude_vps_action','deepseek_github_action','deepseek_vps_action'):
              print(f'{key}={p.get(key,"none")}')
          for key in ('claude_vps_action_nonce','deepseek_github_action_nonce','deepseek_vps_action_nonce'):
              print(f'{key}={int(p.get(key) or 0)}')
          PY

      - name: Publish only changed control through GitHub Contents API
        if: steps.control.outputs.available == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/contents/control/latest.json"
          existing_sha=''
          set +e
          gh api -H 'Accept: application/vnd.github+json' "$api?ref=ai-reviews" > /tmp/ai-master-existing-api.json 2>/dev/null
          rc=$?
          set -e
          if [[ $rc -eq 0 && -s /tmp/ai-master-existing-api.json ]]; then
            existing_sha="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/ai-master-existing-api.json')).get('sha') or '')
          PY
            )"
            python3 - <<'PY'
          import base64,json
          d=json.load(open('/tmp/ai-master-existing-api.json'))
          raw=base64.b64decode((d.get('content') or '').replace('\n',''))
          open('/tmp/ai-master-existing.json','wb').write(raw)
          PY
          else
            echo '{}' > /tmp/ai-master-existing.json
          fi

          python3 - <<'PY' > /tmp/ai-master-comparison.env
          import json
          new=json.load(open('/tmp/ai-master-control.json'))
          try: old=json.load(open('/tmp/ai-master-existing.json'))
          except Exception: old={}
          old_no_time=dict(old); old_no_time.pop('published_epoch',None)
          print('CHANGED=' + ('true' if old_no_time != new else 'false'))
          for name in ('deepseek_github','deepseek_vps'):
              key=name+'_action_nonce'
              requested=int(new.get(key) or 0) > int(old.get(key) or 0)
              print(name.upper()+'_REQUEST=' + ('true' if requested else 'false'))
          PY
          source /tmp/ai-master-comparison.env
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "deepseek_github_request=$DEEPSEEK_GITHUB_REQUEST" >> "$GITHUB_OUTPUT"
          echo "deepseek_vps_request=$DEEPSEEK_VPS_REQUEST" >> "$GITHUB_OUTPUT"
          if [[ "$CHANGED" != true ]]; then
            echo 'Control is semantically unchanged; no ai-reviews commit/write required.'
            exit 0
          fi

          python3 - <<'PY'
          import json,time
          p=json.load(open('/tmp/ai-master-control.json'))
          p['published_epoch']=int(time.time())
          open('/tmp/ai-master-published.json','w',encoding='utf-8').write(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          python3 - "$existing_sha" <<'PY' > /tmp/ai-master-put.json
          import base64,json,sys
          raw=open('/tmp/ai-master-published.json','rb').read()
          out={
            'message':'Publish changed Telegram AI master control',
            'content':base64.b64encode(raw).decode(),
            'branch':'ai-reviews',
          }
          if sys.argv[1]: out['sha']=sys.argv[1]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/ai-master-put.json >/dev/null
          echo 'Published changed sanitised AI control without repository checkout.'

      - name: Wake bounded Claude processor only for a changed VPS request
        if: >-
          steps.publish.outputs.changed == 'true' &&
          steps.control.outputs.claude_vps_action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # action=none cannot select or escalate a VPS operation. It only asks the
          # existing bounded processor to consume the already-sanitised action+nonce.
          gh workflow run claude-vps-controlled-ops.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f action=none

      - name: Dispatch new bounded DeepSeek GitHub request
        if: >-
          steps.publish.outputs.deepseek_github_request == 'true' &&
          steps.control.outputs.deepseek_github_action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.control.outputs.deepseek_github_action }}
        shell: bash
        run: |
          set -euo pipefail
          task="$(python3 -c "import json;print(json.load(open('/tmp/ai-master-control.json')).get('deepseek_github_task',''))")"
          gh workflow run deepseek-github-controlled-ops.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f action="$ACTION" \
            -f task="$task"
          echo "Dispatched DeepSeek GitHub action=$ACTION from Telegram bridge."

      - name: Dispatch new bounded DeepSeek VPS request
        if: >-
          steps.publish.outputs.deepseek_vps_request == 'true' &&
          steps.control.outputs.deepseek_vps_action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.control.outputs.deepseek_vps_action }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deepseek-vps-controlled-ops.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f action="$ACTION"
          echo "Dispatched DeepSeek VPS action=$ACTION from Telegram bridge."

      - name: Publish changed MASTER change council decision without extra polling
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          src=/var/tmp/boot/master_change_council_latest.json
          local_state=/var/tmp/boot/master_change_publisher_state.json
          if [[ ! -s "$src" ]]; then
            echo 'No MASTER change council decision exists yet.'
            exit 0
          fi

          # Cheapest common path: compare two tiny local values first. No extra
          # GitHub API request is made when the council revision is unchanged.
          key="$(python3 - "$src" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          print(str(p.get('request_id') or '')+':'+str(int(p.get('bridge_revision') or 0)))
          PY
          )"
          seen="$(python3 - "$local_state" <<'PY'
          import json,sys
          try: print(str(json.load(open(sys.argv[1],encoding='utf-8')).get('key') or ''))
          except Exception: print('')
          PY
          )"
          if [[ -n "$key" && "$key" == "$seen" ]]; then
            echo "MASTER change council unchanged ($key); zero extra GitHub calls."
            exit 0
          fi

          python3 - "$src" /tmp/master-change.json <<'PY'
          import json,re,sys
          src,out=sys.argv[1:3]
          p=json.load(open(src,encoding='utf-8'))
          rid=str(p.get('request_id') or '')
          if not re.fullmatch(r'mc-[A-Za-z0-9T-]{10,80}',rid): raise SystemExit('invalid request_id')
          request=str(p.get('request') or '').replace('\x00','').strip()[:3500]
          if not request: raise SystemExit('empty request')
          def scrub(v,limit):
              s=str(v or '').replace('\x00','')[:limit]
              s=re.sub(r'\bsk-[A-Za-z0-9_-]{12,}\b','[REDACTED]',s)
              s=re.sub(r'(?i)(authorization\s*:\s*bearer\s+)\S+',r'\1[REDACTED]',s)
              s=re.sub(r'(?i)((?:private[_ -]?key|mnemonic|seed phrase)\s*[:=]\s*)\S.{8,}',r'\1[REDACTED]',s)
              return s
          advisers={}
          for name in ('claude','gemini','deepseek','copilot'):
              row=(p.get('advisers') or {}).get(name) or {}
              advisers[name]={
                  'acknowledged':bool(row.get('acknowledged')),
                  'provider_rc':int(row.get('provider_rc')) if row.get('provider_rc') is not None else None,
                  'reply':scrub(row.get('reply'),12000),
                  'error':scrub(row.get('error'),1200),
                  'message_id':scrub(row.get('message_id'),140),
              }
          d=p.get('gpt_decision') or {}
          action=str(d.get('action') or '').upper()
          if action and action not in {'IMPLEMENT','REJECT','HUMAN_REVIEW'}: raise SystemExit('invalid GPT action')
          risk=str(d.get('risk_class') or '').upper()
          if risk and risk not in {'LOW','MEDIUM','HIGH','CRITICAL'}: raise SystemExit('invalid risk class')
          files=[]
          for x in d.get('allowed_files') or []:
              path=str(x or '').replace('\\','/').strip().lstrip('/')
              if not path or '*' in path or '..' in path.split('/') or len(path)>300: continue
              if path not in files: files.append(path)
              if len(files)>=20: break
          clean={
              'schema_version':1,
              'request_id':rid,
              'request':scrub(request,3500),
              'source_sha':str(p.get('source_sha') or '')[:40],
              'created_epoch':max(0,int(p.get('created_epoch') or 0)),
              'updated_epoch':max(0,int(p.get('updated_epoch') or 0)),
              'status':str(p.get('status') or '')[:80],
              'attempt':max(0,int(p.get('attempt') or 0)),
              'hard_protected_reasons':[scrub(x,120) for x in (p.get('hard_protected_reasons') or [])[:20]],
              'protected_reasons':[scrub(x,120) for x in (p.get('protected_reasons') or [])[:20]],
              'advisers':advisers,
              'all_advisers_replied':bool(p.get('all_advisers_replied')),
              'gpt_decision':{
                  'action':action,
                  'risk_class':risk,
                  'summary':scrub(d.get('summary'),900),
                  'reasoning':scrub(d.get('reasoning'),3000),
                  'allowed_files':files,
                  'required_tests':[scrub(x,300) for x in (d.get('required_tests') or [])[:12]],
                  'auto_merge_recommended':bool(d.get('auto_merge_recommended')),
              },
              'implementation_allowed':bool(p.get('implementation_allowed')),
              'auto_merge_allowed':bool(p.get('auto_merge_allowed')),
              'implementation_nonce':max(0,int(p.get('implementation_nonce') or 0)),
              'bridge_revision':max(0,int(p.get('bridge_revision') or 0)),
          }
          json.dump(clean,open(out,'w',encoding='utf-8'),indent=2,sort_keys=True);open(out,'a').write('\n')
          PY

          get_content() {
            local path="$1" out="$2"
            set +e
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=ai-reviews" > /tmp/master-change-api.json 2>/dev/null
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then echo '{}' > "$out"; return 1; fi
            python3 - /tmp/master-change-api.json "$out" <<'PY'
          import base64,json,sys
          p=json.load(open(sys.argv[1])); raw=base64.b64decode((p.get('content') or '').replace('\n',''))
          open(sys.argv[2],'wb').write(raw)
          PY
          }
          put_file() {
            local path="$1" file="$2" message="$3" api current sha rc
            api="repos/${GITHUB_REPOSITORY}/contents/${path}"
            set +e
            current="$(gh api -H 'Accept: application/vnd.github+json' "$api?ref=ai-reviews" 2>/dev/null)"
            rc=$?
            set -e
            sha=''
            if [[ $rc -eq 0 && -n "$current" ]]; then sha="$(printf '%s' "$current" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("sha") or "")')"; fi
            python3 - "$file" "$sha" "$message" <<'PY' > /tmp/master-change-put.json
          import base64,json,sys
          file,sha,msg=sys.argv[1:4]
          out={'message':msg,'content':base64.b64encode(open(file,'rb').read()).decode(),'branch':'ai-reviews'}
          if sha: out['sha']=sha
          print(json.dumps(out))
          PY
            gh api -X PUT "$api" --input /tmp/master-change-put.json >/dev/null
          }

          request_id="$(python3 -c "import json;print(json.load(open('/tmp/master-change.json'))['request_id'])")"
          revision="$(python3 -c "import json;print(int(json.load(open('/tmp/master-change.json')).get('bridge_revision') or 0))")"
          implementation_nonce="$(python3 -c "import json;print(int(json.load(open('/tmp/master-change.json')).get('implementation_nonce') or 0))")"
          implementation_allowed="$(python3 -c "import json;print('true' if json.load(open('/tmp/master-change.json')).get('implementation_allowed') else 'false')")"

          put_file "master-change/requests/${request_id}.json" /tmp/master-change.json "Publish MASTER change ${request_id}"
          put_file "master-change/latest_request.json" /tmp/master-change.json "Update latest MASTER change ${request_id}"

          get_content "master-change/dispatch_state.json" /tmp/master-change-dispatch-state.json || echo '{}' > /tmp/master-change-dispatch-state.json
          dispatch_key="${request_id}:${implementation_nonce}"
          dispatch_seen="$(python3 - /tmp/master-change-dispatch-state.json <<'PY'
          import json,sys
          try: print(str(json.load(open(sys.argv[1])).get('last_dispatch_key') or ''))
          except Exception: print('')
          PY
          )"
          if [[ "$implementation_allowed" == true && "$implementation_nonce" -gt 0 && "$dispatch_key" != "$dispatch_seen" ]]; then
            gh workflow run gpt-master-change-implement.yml \
              --repo "$GITHUB_REPOSITORY" --ref main \
              -f request_id="$request_id" \
              -f implementation_nonce="$implementation_nonce"
            python3 - "$dispatch_key" <<'PY' > /tmp/master-change-new-dispatch-state.json
          import json,sys,time
          print(json.dumps({'schema_version':1,'last_dispatch_key':sys.argv[1],'updated_epoch':int(time.time())},indent=2,sort_keys=True))
          PY
            put_file "master-change/dispatch_state.json" /tmp/master-change-new-dispatch-state.json "Record MASTER change dispatch ${request_id}"
          fi

          python3 - "$key" "$request_id" "$revision" <<'PY'
          import json,os,sys,time
          path='/var/tmp/boot/master_change_publisher_state.json'
          tmp=path+'.tmp'
          value={'schema_version':1,'key':sys.argv[1],'request_id':sys.argv[2],'bridge_revision':int(sys.argv[3]),'updated_epoch':int(time.time())}
          with open(tmp,'w',encoding='utf-8') as fh: json.dump(value,fh,indent=2,sort_keys=True); fh.write('\n'); fh.flush(); os.fsync(fh.fileno())
          os.chmod(tmp,0o644); os.replace(tmp,path)
          PY
          echo "Published MASTER change council revision ${key}."
