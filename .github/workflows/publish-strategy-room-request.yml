name: Publish Strategy Room Draft Request

on:
  schedule:
    # Zero-model-cost bridge: checks one tiny local JSON object and exits when the
    # Strategy Room request nonce has not changed. Provider/GPT calls are never polled.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-strategy-room-request
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Validate pending Strategy Room bridge
        id: request
        shell: bash
        run: |
          set -euo pipefail
          src=/var/tmp/boot/strategy_room_request.json
          if [[ ! -s "$src" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$src" /tmp/strategy-room-request.json <<'PY'
          import json,sys
          src,out=sys.argv[1:3]
          raw=json.load(open(src,encoding='utf-8'))
          clean={
              'schema_version':1,
              'action':str(raw.get('action') or ''),
              'nonce':max(0,int(raw.get('nonce') or 0)),
              'task':str(raw.get('task') or '').replace('\x00',' ').strip()[:1200],
              'question':str(raw.get('question') or '').replace('\x00',' ').strip()[:800],
              'session_id':str(raw.get('session_id') or '')[:64],
              'support_count':max(0,int(raw.get('support_count') or 0)),
              'requested_by':str(raw.get('requested_by') or '')[:80],
              'requested_epoch':max(0,int(raw.get('requested_epoch') or 0)),
              'draft_pr_only':raw.get('draft_pr_only') is True,
              'no_live_changes':raw.get('no_live_changes') is True,
          }
          if clean['action'] != 'draft_shadow_fix': raise SystemExit('unsupported Strategy Room action')
          if clean['nonce'] <= 0: raise SystemExit('invalid Strategy Room nonce')
          if not clean['task']: raise SystemExit('empty Strategy Room task')
          if clean['support_count'] < 3: raise SystemExit('fewer than three completed agent reviews')
          if not clean['draft_pr_only'] or not clean['no_live_changes']:
              raise SystemExit('Strategy Room request is not draft-only/no-live')
          json.dump(clean,open(out,'w',encoding='utf-8'),indent=2,sort_keys=True);open(out,'a').write('\n')
          PY
          echo 'available=true' >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('/tmp/strategy-room-request.json'))
          print('nonce=' + str(p['nonce']))
          PY

      - name: Check whether request nonce is new
        if: steps.request.outputs.available == 'true'
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/contents/control/strategy_room_latest.json"
          old_nonce=0
          existing_sha=''
          if gh api "$api?ref=ai-reviews" > /tmp/strategy-room-existing-api.json 2>/dev/null; then
            existing_sha="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/strategy-room-existing-api.json')).get('sha') or '')
          PY
            )"
            python3 - <<'PY'
          import base64,json
          d=json.load(open('/tmp/strategy-room-existing-api.json'))
          raw=base64.b64decode((d.get('content') or '').replace('\n',''))
          open('/tmp/strategy-room-existing.json','wb').write(raw)
          PY
            old_nonce="$(python3 - <<'PY'
          import json
          try: p=json.load(open('/tmp/strategy-room-existing.json'))
          except Exception: p={}
          print(max(0,int(p.get('nonce') or 0)))
          PY
            )"
          fi
          new_nonce='${{ steps.request.outputs.nonce }}'
          echo "existing_sha=$existing_sha" >> "$GITHUB_OUTPUT"
          if (( new_nonce <= old_nonce )); then
            echo 'new=false' >> "$GITHUB_OUTPUT"
            echo "Strategy Room request $new_nonce already processed; zero provider calls."
          else
            echo 'new=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch bounded GPT draft worker once
        if: steps.fresh.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          task="$(python3 -c "import json;print(json.load(open('/tmp/strategy-room-request.json'))['task'])")"
          nonce="$(python3 -c "import json;print(json.load(open('/tmp/strategy-room-request.json'))['nonce'])")"
          gh workflow run gpt-strategy-room-controlled-ops.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f action=draft_shadow_fix \
            -f task="$task" \
            -f request_nonce="$nonce"

      - name: Record dispatched nonce on ai-reviews
        if: steps.fresh.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_SHA: ${{ steps.fresh.outputs.existing_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          p=json.load(open('/tmp/strategy-room-request.json'))
          p['dispatched_epoch']=int(time.time())
          p['status']='DISPATCHED_DRAFT_ONLY'
          open('/tmp/strategy-room-published.json','w',encoding='utf-8').write(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          python3 - <<'PY' > /tmp/strategy-room-put.json
          import base64,json,os
          out={
              'message':'Record dispatched Strategy Room draft request',
              'content':base64.b64encode(open('/tmp/strategy-room-published.json','rb').read()).decode(),
              'branch':'ai-reviews',
          }
          sha=os.environ.get('EXISTING_SHA','').strip()
          if sha: out['sha']=sha
          print(json.dumps(out))
          PY
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/control/strategy_room_latest.json" \
            --input /tmp/strategy-room-put.json >/dev/null
