name: Read-only VPS disk diagnostic

on:
  push:
    branches:
      - agent/read-only-disk-diagnostic

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - name: Collect read-only disk diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "host=$(hostname)"
            echo
            echo '=== FILESYSTEM BLOCK USAGE ==='
            df -hT /
            echo
            echo '=== FILESYSTEM INODE USAGE ==='
            df -ih /
            echo
            echo '=== ALL MOUNTS ==='
            df -hT
            echo
            echo '=== JOURNAL SIZE ==='
            journalctl --disk-usage 2>&1 || true
            sudo -n journalctl --disk-usage 2>&1 || true
            echo
            echo '=== IMPORTANT DIRECTORY SIZES ==='
            for p in \
              /root/BotBuc \
              /root/multichain-learning-bot-v2.2-fast-direct-market \
              /root/.cache \
              /opt/actions-runner \
              /opt/actions-runner/_work \
              /home/github-runner \
              /tmp \
              /var/tmp \
              /var/log; do
              echo "--- $p ---"
              du -xsh "$p" 2>/dev/null || sudo -n du -xsh "$p" 2>/dev/null || true
              du -xhd1 "$p" 2>/dev/null | sort -h | tail -n 30 || sudo -n du -xhd1 "$p" 2>/dev/null | sort -h | tail -n 30 || true
            done
            echo
            echo '=== BACKUP ARCHIVE CANDIDATES ==='
            sudo -n find /root/BotBuc /tmp -xdev -type f \
              \( -name '*.zip' -o -name '*.zip.tmp' -o -name '.*.zip.tmp' -o -name 'boot-trading-bot-*.tar.gz' -o -name 'boot-trading-bot-*.tar.gz.sha256' \) \
              -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | sort -nr | head -n 100 || \
            find /tmp -xdev -type f \
              \( -name 'boot-trading-bot-*.tar.gz' -o -name 'boot-trading-bot-*.tar.gz.sha256' \) \
              -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | sort -nr | head -n 100 || true
            echo
            echo '=== LARGE FILES >=100M IN KNOWN STORAGE AREAS ==='
            sudo -n find /root/BotBuc /root/multichain-learning-bot-v2.2-fast-direct-market /opt/actions-runner /home/github-runner /tmp /var/tmp /var/log \
              -xdev -type f -size +100M \
              ! -path '*/.env' ! -path '*/wallet*' ! -path '*/keys/*' ! -path '*/secrets/*' \
              -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | sort -nr | head -n 120 || true
            echo
            echo '=== DELETED BUT STILL OPEN FILES ==='
            sudo -n lsof +L1 2>/dev/null | head -n 120 || lsof +L1 2>/dev/null | head -n 120 || true
            echo
            echo '=== PACKAGE / CONTAINER CACHE SUMMARY ==='
            sudo -n du -xsh /var/cache 2>/dev/null || du -xsh /var/cache 2>/dev/null || true
            command -v docker >/dev/null 2>&1 && sudo -n docker system df 2>/dev/null || true
            echo
            echo '=== BOT STATUS VIA RESTRICTED WRAPPER ==='
            sudo /usr/local/sbin/status-boot-trading-bot 2>&1 || true
            echo
            echo '=== LEARNERBOT PROCESS ==='
            systemctl show learnerbot --property=MainPID,MemoryCurrent,TasksCurrent,ActiveState,SubState 2>&1 || true
            ps -eo pid,user,%cpu,%mem,rss,etimes,args --sort=-rss | head -n 30 || true
          } > /tmp/read-only-disk-diagnostic.txt
          cat /tmp/read-only-disk-diagnostic.txt

      - name: Publish diagnostic snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-disk-diagnostic.txt"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/read-only-disk-diagnostic.txt)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/disk-put.json
          import json,sys
          payload={
            'message':'Update read-only VPS disk diagnostic',
            'content':sys.argv[1],
            'branch':'server-diagnostics',
          }
          if sys.argv[2]:
            payload['sha']=sys.argv[2]
          print(json.dumps(payload))
          PY
          gh api -X PUT "$api" --input /tmp/disk-put.json >/dev/null
