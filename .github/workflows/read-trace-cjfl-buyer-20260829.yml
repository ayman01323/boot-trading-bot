name: Read Trace CjFL Buyer 20260829

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-trace-cjfl-buyer-20260829.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Trace mint buyer read-only
        shell: bash
        run: |
          set -u
          MINT='CjFLUpDhQ4TZp7azvKo3FDAJv1cxeDR2nNv3rGs1pump'
          export MINT
          echo "HOST=$(hostname)"
          echo "REPORT_BST=$(TZ=Europe/London date +%Y-%m-%dT%H:%M:%S%z)"
          echo '=== SQLITE_MATCHES ==='
          python3 - <<'PY'
          import os, sqlite3, json
          from pathlib import Path
          mint=os.environ['MINT']
          roots=[Path('/home/ayman01323/BOOT/testingbots'),Path('/home/ayman01323/BOOT')]
          seen=set(); total=0
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.db','.sqlite','.sqlite3'}: continue
                  try: rp=str(p.resolve())
                  except: rp=str(p)
                  if rp in seen: continue
                  seen.add(rp)
                  try:
                      con=sqlite3.connect(f'file:{p}?mode=ro',uri=True); con.row_factory=sqlite3.Row; cur=con.cursor()
                      tables=[r[0] for r in cur.execute("select name from sqlite_master where type='table'")]
                  except Exception: continue
                  for t in tables:
                      try: cols=[r[1] for r in cur.execute(f'pragma table_info("{t}")')]
                      except Exception: continue
                      search=[c for c in cols if any(k in c.lower() for k in ('mint','token','asset','address'))]
                      if not search: continue
                      ors=[]; params=[]
                      for c in search:
                          ors.append(f'CAST("{c}" AS TEXT)=?'); params.append(mint)
                      try: rows=list(cur.execute(f'SELECT * FROM "{t}" WHERE '+ ' OR '.join(ors)+' ORDER BY rowid DESC LIMIT 50',params))
                      except Exception: continue
                      if rows:
                          print(f'DB={p} TABLE={t} ROWS={len(rows)}')
                          for r in rows:
                              d=dict(r)
                              for k in list(d):
                                  if any(s in k.lower() for s in ('secret','private','credential','api_key','mnemonic','seed')): d.pop(k,None)
                              print('ROW='+json.dumps(d,default=str,sort_keys=True)[:12000])
                              total+=1
                  con.close()
          print('SQLITE_MATCH_TOTAL='+str(total))
          PY

          echo '=== JOURNAL_MATCHES ==='
          sudo -n journalctl --since '2026-08-28 00:00:00 UTC' --no-pager 2>/dev/null \
            | grep -F "$MINT" \
            | sed -E 's#https?://[^[:space:]]+#<URL_REDACTED>#g; s#([A-Za-z0-9_]*(SECRET|PRIVATE|API_KEY|CREDENTIAL|MNEMONIC|SEED)[A-Za-z0-9_]*)=[^[:space:]]+#\1=<REDACTED>#Ig' \
            | tail -400 || true

          echo '=== TEXT_MATCHES ==='
          grep -RFn --binary-files=without-match --exclude='.env' --exclude='*.key' --exclude='*secret*' --exclude='*credential*' \
            "$MINT" /home/ayman01323/BOOT/testingbots 2>/dev/null | tail -200 || true
          echo 'TRACE_COMPLETE=true'
