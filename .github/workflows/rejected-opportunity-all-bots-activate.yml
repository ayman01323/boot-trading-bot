name: Rejected Opportunity All Bots Activate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rejected-opportunity-all-bots-activate.yml'
      - 'sibot1_engines/_shared/rejected_reporting.py'
      - 'sibot1_engines/_shared/rejected_poolcheck_patch.py'
      - 'sibot1_engines/_shared/worker.py'
      - 'scripts/sibot1_shadow_runtime.py'
      - 'boot_platform/rejected_opportunity_bridge.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rejected-opportunity-all-bots-activate
  cancel-in-progress: false

jobs:
  activate:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    env:
      MAIN_ROOT: /root/multichain-learning-bot-v2.2-fast-direct-market
      BOOT_ROOT: /home/ayman01323/BOOT
      QUEUE_ROOT: /home/ayman01323/BOOT/data/candidates/REJECTED OPPORTUNITY
      ROOT_CODE_ROOT: /opt/boot-rejected-opportunity
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Preflight restricted deployment route
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          test "$(sudo -n /usr/bin/systemctl show learnerbot.service -p LoadState --value)" = loaded
          test "$(sudo -n /usr/bin/systemctl show boot-rejected-opportunity-bridge.service -p LoadState --value)" = loaded
          python3 -m py_compile \
            sibot1_engines/_shared/rejected_reporting.py \
            sibot1_engines/_shared/rejected_poolcheck_patch.py \
            sibot1_engines/_shared/worker.py \
            scripts/sibot1_shadow_runtime.py \
            boot_platform/rejected_opportunity_bridge.py
          echo preflight=PASS

      - name: Prepare one-shot root activation
        shell: bash
        run: |
          set -euo pipefail
          ACT="$BOOT_ROOT/runtime/rejected-opportunity-all-bots-activate.sh"
          UNIT="$BOOT_ROOT/runtime/rejected-opportunity-all-bots-activate.service"
          mkdir -p "$BOOT_ROOT/runtime" "$BOOT_ROOT/backups"
          cat >"$ACT" <<'ROOTSH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec > >(tee -a "$BOOT_ROOT/runtime/rejected-opportunity-all-bots-activate.log") 2>&1
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          test -d "$MAIN_ROOT/sibot1_engines/_shared"
          test -f "$MAIN_ROOT/scripts/sibot1_shadow_runtime.py"

          python3 -m py_compile \
            "$REPO/sibot1_engines/_shared/rejected_reporting.py" \
            "$REPO/sibot1_engines/_shared/rejected_poolcheck_patch.py" \
            "$REPO/sibot1_engines/_shared/worker.py" \
            "$REPO/scripts/sibot1_shadow_runtime.py" \
            "$REPO/boot_platform/rejected_opportunity_bridge.py"

          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$BOOT_ROOT/backups/rejected-opportunity-all-bots-$TS"
          mkdir -p "$BACKUP/shared" "$BACKUP/scripts" "$BACKUP/bridge"
          cp -a "$MAIN_ROOT/sibot1_engines/_shared/worker.py" "$BACKUP/shared/"
          cp -a "$MAIN_ROOT/scripts/sibot1_shadow_runtime.py" "$BACKUP/scripts/"
          [[ -f "$MAIN_ROOT/sibot1_engines/_shared/rejected_reporting.py" ]] && cp -a "$MAIN_ROOT/sibot1_engines/_shared/rejected_reporting.py" "$BACKUP/shared/" || true
          [[ -f "$MAIN_ROOT/sibot1_engines/_shared/rejected_poolcheck_patch.py" ]] && cp -a "$MAIN_ROOT/sibot1_engines/_shared/rejected_poolcheck_patch.py" "$BACKUP/shared/" || true
          [[ -f "$ROOT_CODE_ROOT/boot_platform/rejected_opportunity_bridge.py" ]] && cp -a "$ROOT_CODE_ROOT/boot_platform/rejected_opportunity_bridge.py" "$BACKUP/bridge/" || true
          echo "backup=$BACKUP"

          install -o root -g root -m 0644 "$REPO/sibot1_engines/_shared/rejected_reporting.py" "$MAIN_ROOT/sibot1_engines/_shared/rejected_reporting.py"
          install -o root -g root -m 0644 "$REPO/sibot1_engines/_shared/rejected_poolcheck_patch.py" "$MAIN_ROOT/sibot1_engines/_shared/rejected_poolcheck_patch.py"
          install -o root -g root -m 0644 "$REPO/sibot1_engines/_shared/worker.py" "$MAIN_ROOT/sibot1_engines/_shared/worker.py"
          install -o root -g root -m 0755 "$REPO/scripts/sibot1_shadow_runtime.py" "$MAIN_ROOT/scripts/sibot1_shadow_runtime.py"

          rm -rf "$ROOT_CODE_ROOT/boot_platform"
          cp -a "$REPO/boot_platform" "$ROOT_CODE_ROOT/boot_platform"
          chown -R root:root "$ROOT_CODE_ROOT/boot_platform"
          find "$ROOT_CODE_ROOT/boot_platform" -type d -exec chmod 0755 {} +
          find "$ROOT_CODE_ROOT/boot_platform" -type f -exec chmod 0644 {} +

          PYTHONPATH="$MAIN_ROOT:$ROOT_CODE_ROOT" BOOT_REJECTED_OPPORTUNITY_ENABLED=1 \
            BOOT_REJECTED_OPPORTUNITY_DIR="$QUEUE_ROOT" \
            BOOT_REJECTED_OPPORTUNITY_CODE_ROOT="$ROOT_CODE_ROOT" \
            python3 - <<'PY'
          from sibot1_engines._shared import rejected_reporting
          from boot_platform.rejected_opportunity_bridge import RejectedOpportunityBridge
          assert callable(rejected_reporting.publish_market_rejection)
          assert hasattr(RejectedOpportunityBridge, 'ingest_rejection_csv')
          print('reporting_imports=PASS')
          PY

          systemctl restart boot-rejected-opportunity-bridge.service
          systemctl restart learnerbot.service
          sleep 22
          test "$(systemctl is-active boot-rejected-opportunity-bridge.service)" = active
          test "$(systemctl is-active learnerbot.service)" = active
          echo "services=ACTIVE"

          grep -q 'derive_market_rejection' "$MAIN_ROOT/sibot1_engines/_shared/worker.py"
          grep -q 'rejected_poolcheck_patch' "$MAIN_ROOT/scripts/sibot1_shadow_runtime.py"
          grep -q 'ingest_rejection_csv' "$ROOT_CODE_ROOT/boot_platform/rejected_opportunity_bridge.py"
          echo "production_hooks=PASS"

          QUEUE_ROOT="$QUEUE_ROOT" python3 - <<'PY'
          import json, os, sqlite3, time
          from pathlib import Path
          db=Path(os.environ['QUEUE_ROOT'])/'high_risk_queue.sqlite3'
          conn=sqlite3.connect(db); conn.row_factory=sqlite3.Row
          print('=== LIVE SOURCE COUNTS ===')
          for r in conn.execute("SELECT source_bot,COUNT(*) n,MAX(observed_at) latest FROM refusal_observations GROUP BY source_bot ORDER BY source_bot"):
              print(f"source_bot={r['source_bot']} observations={r['n']} latest={r['latest']}")
          print('=== RECENT REJECTION CLASSES ===')
          for r in conn.execute("SELECT source_bot,rejection_class,COUNT(*) n,MAX(observed_at) latest FROM refusal_observations GROUP BY source_bot,rejection_class ORDER BY latest DESC LIMIT 30"):
              print(json.dumps(dict(r),sort_keys=True))
          print('=== SIRISKY DECISIONS ===')
          for r in conn.execute("SELECT decision,COUNT(*) n,MAX(examined_at) latest FROM sirisky_decisions GROUP BY decision ORDER BY decision"):
              print(json.dumps(dict(r),sort_keys=True))
          conn.close()
          PY
          echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ROOTSH
          chmod 0755 "$ACT"

          cat >"$UNIT" <<EOF
          [Unit]
          Description=One-shot all-bot rejected opportunity reporting activation
          After=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          User=root
          Environment="REPO=$GITHUB_WORKSPACE"
          Environment="MAIN_ROOT=$MAIN_ROOT"
          Environment="BOOT_ROOT=$BOOT_ROOT"
          Environment="QUEUE_ROOT=$QUEUE_ROOT"
          Environment="ROOT_CODE_ROOT=$ROOT_CODE_ROOT"
          ExecStart=$ACT
          EOF
          chmod 0644 "$UNIT"
          echo "ACT=$ACT" >> "$GITHUB_ENV"
          echo "UNIT=$UNIT" >> "$GITHUB_ENV"

      - name: Activate through authorised systemctl
        shell: bash
        run: |
          set -euo pipefail
          name=rejected-opportunity-all-bots-activate.service
          sudo -n /usr/bin/systemctl stop "$name" 2>/dev/null || true
          sudo -n /usr/bin/systemctl disable "$name" 2>/dev/null || true
          sudo -n /usr/bin/systemctl link "$UNIT"
          sudo -n /usr/bin/systemctl daemon-reload
          sudo -n /usr/bin/systemctl start "$name"
          sudo -n /usr/bin/systemctl is-active --quiet "$name"
          sudo -n /usr/bin/systemctl status "$name" --no-pager -l

      - name: Show activation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tail -n 220 "$BOOT_ROOT/runtime/rejected-opportunity-all-bots-activate.log" 2>/dev/null || true
          echo '=== current service state ==='
          sudo -n /usr/bin/systemctl is-active learnerbot.service || true
          sudo -n /usr/bin/systemctl is-active boot-rejected-opportunity-bridge.service || true

      - name: Remove temporary privileged unit
        if: always()
        shell: bash
        run: |
          set +e
          name=rejected-opportunity-all-bots-activate.service
          sudo -n /usr/bin/systemctl stop "$name"
          sudo -n /usr/bin/systemctl disable "$name"
          sudo -n /usr/bin/systemctl daemon-reload
          rm -f "$UNIT" "$ACT"
