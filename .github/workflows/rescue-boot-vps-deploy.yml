name: Rescue BOOT VPS Deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/rescue-boot-vps-deploy.trigger'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel non-trading recovery occupancy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for state in queued in_progress; do
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/selfhosted-five-agent-recovery.yml/runs?status=${state}&per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null | while read -r run_id; do
                [[ -n "$run_id" ]] || continue
                echo "Cancelling AI recovery occupancy ${run_id} (${state})"
                gh api --method POST -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
              done
          done

      - name: Cancel proved-stale old deploy-vps run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Run 32673081630 has a completed/cancelled deploy job and only a stale
          # queued post-deploy Claude proof job. Cancelling it cannot interrupt a
          # live deployment or the learnerbot service.
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/32673081630/cancel" >/dev/null 2>&1 || true

      - name: Cancel stale queued VPS jobs before current-main deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Queued only: never cancel a deployment or diagnostic that has started.
          # sibot-history-depth-ci is compile/read-only test work and can be safely
          # rescheduled after the production write-off deploy is complete.
          for workflow in \
            deploy-vps.yml \
            final-deploy-v2.yml \
            deploy-current-main-direct.yml \
            deploy-current-main-pr-isolated.yml \
            deploy-current-main-trigger.yml \
            server-ops.yml \
            deepseek-vps-controlled-ops.yml \
            claude-vps-controlled-ops.yml \
            learnerbot-recovery-restart.yml \
            sibot-history-depth-ci.yml; do
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=queued&per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null | while read -r run_id; do
                [[ -n "$run_id" ]] || continue
                echo "Cancelling stale queued ${workflow} run ${run_id}"
                gh api --method POST -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
              done
          done
          sleep 5

      - name: Dispatch one restricted current-main deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          echo "Dispatching restricted server-ops deploy_main for current main ${latest}"
          gh workflow run server-ops.yml --ref main -f operation=deploy_main
