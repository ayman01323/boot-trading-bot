name: Rescue BOOT VPS Deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/rescue-boot-vps-deploy.trigger'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cancel stale workflows occupying or queueing the BOOT VPS runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflows=(
            selfhosted-five-agent-recovery.yml
            deploy-vps.yml
            deploy-current-main-direct.yml
            deploy-current-main-pr-isolated.yml
            deploy-current-main-trigger.yml
            server-ops.yml
            deepseek-vps-controlled-ops.yml
            claude-vps-controlled-ops.yml
            learnerbot-recovery-restart.yml
          )
          for workflow in "${workflows[@]}"; do
            for state in queued in_progress; do
              gh api -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=${state}&per_page=100" \
                --jq '.workflow_runs[].id' 2>/dev/null | while read -r run_id; do
                  [[ -n "$run_id" ]] || continue
                  echo "Cancelling stale ${workflow} run ${run_id} (${state})"
                  gh api --method POST -H 'Accept: application/vnd.github+json' \
                    "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
                done
            done
          done
          # Give GitHub a moment to release the single self-hosted runner after
          # cancellation. No VPS process is killed by this step.
          sleep 5

      - name: Dispatch exact current-main deployment
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]]
          echo "target_sha=$latest" >> "$GITHUB_OUTPUT"
          echo "Dispatching restricted deploy_main for exact current main ${latest}"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/server-ops.yml/dispatches" \
            -f ref=main -f 'inputs[operation]=deploy_main'

      - name: Wait for dispatched deploy and record conclusion
        id: waitdeploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.dispatch.outputs.target_sha }}
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 45); do
            run_id="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/server-ops.yml/runs?event=workflow_dispatch&branch=main&per_page=50" \
              --jq ".workflow_runs[] | select(.head_sha == \"${TARGET_SHA}\") | .id" 2>/dev/null | head -n1 || true)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo 'Unable to resolve dispatched server-ops run.' >&2
            echo 'run_id=' >> "$GITHUB_OUTPUT"
            echo 'conclusion=missing' >> "$GITHUB_OUTPUT"
            exit 3
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          conclusion=''
          status='queued'
          for _ in $(seq 1 110); do
            data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(printf '%s' "$data" | jq -r '.status')"
            conclusion="$(printf '%s' "$data" | jq -r '.conclusion // ""')"
            echo "server-ops run ${run_id}: status=${status} conclusion=${conclusion:-pending}"
            [[ "$status" == 'completed' ]] && break
            sleep 8
          done
          echo "conclusion=${conclusion:-timeout}" >> "$GITHUB_OUTPUT"
          [[ "$status" == 'completed' && "$conclusion" == 'success' ]]

      - name: Publish rescue deployment attestation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.dispatch.outputs.target_sha }}
          DEPLOY_RUN_ID: ${{ steps.waitdeploy.outputs.run_id }}
          DEPLOY_CONCLUSION: ${{ steps.waitdeploy.outputs.conclusion }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/rescue-deploy-attestation.json
          import json, os, time
          print(json.dumps({
              'schema_version': 2,
              'generated_epoch': int(time.time()),
              'target_sha': os.environ.get('TARGET_SHA',''),
              'server_ops_run_id': int(os.environ.get('DEPLOY_RUN_ID') or 0),
              'conclusion': os.environ.get('DEPLOY_CONCLUSION') or 'unknown',
              'deployment_scope': 'ALL_CURRENT_MAIN',
              'deployment_path': 'server-ops deploy_main -> restricted /usr/local/sbin/deploy-boot-trading-bot',
              'full_test_gate': True,
              'stale_runner_workflows_cleared': True,
              'safety': {
                  'arbitrary_sha': False,
                  'wallet_or_private_key_access': False,
                  'live_or_risk_bypass': False,
                  'restricted_wrapper_only': True,
              },
          }, indent=2, sort_keys=True))
          PY
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-rescue-deploy.json"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/rescue-deploy-attestation.json)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/rescue-put.json
          import json, sys
          out={
              'message':'Update rescue VPS deployment attestation',
              'content':sys.argv[1],
              'branch':'server-diagnostics',
          }
          if sys.argv[2]: out['sha']=sys.argv[2]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/rescue-put.json >/dev/null

      - name: Fail rescue if deploy did not succeed
        if: always()
        shell: bash
        env:
          DEPLOY_CONCLUSION: ${{ steps.waitdeploy.outputs.conclusion }}
        run: |
          [[ "${DEPLOY_CONCLUSION:-}" == 'success' ]]
