name: Rescue BOOT VPS Deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/rescue-boot-vps-deploy.trigger'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish rescue start marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/probe.txt <<EOF
          target_sha=${GITHUB_SHA}
          state=rescue_started
          run_id=${GITHUB_RUN_ID}
          utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-vps-rescue-probe.txt"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/probe.txt)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/put.json
          import json,sys
          d={'message':'Update VPS rescue probe','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: d['sha']=sys.argv[2]
          print(json.dumps(d))
          PY
          gh api -X PUT "$api" --input /tmp/put.json >/dev/null

  rescue:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Drain queued boot-vps work, dispatch current main, publish result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=/tmp/vps-rescue.txt
          : > "$out"
          echo "generated_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$out"
          echo "rescue_run_id=${GITHUB_RUN_ID}" >> "$out"
          echo "trigger_sha=${GITHUB_SHA}" >> "$out"

          cancel_run() {
            run_id="$1"; kind="$2"; state="$3"
            [[ -n "$run_id" ]] || return 0
            echo "cancel ${kind} state=${state} run_id=${run_id}" | tee -a "$out"
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>>"$out"
            echo "cancel_rc=$? run_id=${run_id}" >> "$out"
          }

          # The long AI recovery workflow is report-only and may be released even
          # if it is currently running so production deployment can use boot-vps.
          for state in requested waiting pending queued in_progress; do
            ids="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/selfhosted-five-agent-recovery.yml/runs?status=${state}&per_page=100" \
              --jq '.workflow_runs[].id' 2>>"$out")"
            while read -r run_id; do
              [[ -n "$run_id" ]] || continue
              cancel_run "$run_id" recovery "$state"
            done <<< "$ids"
          done

          # Generic queued-only drain: inspect every non-running workflow run and
          # cancel it only when one of its queued jobs is explicitly labelled boot-vps.
          # This avoids brittle workflow-name lists while never cancelling an
          # in-progress deployment or other active VPS operation.
          for state in requested waiting pending queued; do
            ids="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs?status=${state}&per_page=100" \
              --jq '.workflow_runs[].id' 2>>"$out")"
            while read -r run_id; do
              [[ -n "$run_id" ]] || continue
              [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue
              boot_jobs="$(gh api -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
                --jq '[.jobs[] | select(.status=="queued" and (.labels | index("boot-vps")))] | length' \
                2>>"$out")"
              jobs_rc=$?
              if [[ $jobs_rc -ne 0 ]]; then
                echo "job_query_failed run_id=${run_id} state=${state} rc=${jobs_rc}" >> "$out"
                continue
              fi
              if [[ "${boot_jobs:-0}" =~ ^[0-9]+$ && "$boot_jobs" -gt 0 ]]; then
                cancel_run "$run_id" queued_boot_vps "$state"
              fi
            done <<< "$ids"
          done

          # Record the runner state directly from GitHub so a persistent queue can
          # be distinguished from an offline/busy self-hosted runner.
          echo "runner_snapshot_begin" >> "$out"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            --jq '.runners[] | select([.labels[].name] | index("boot-vps")) | "runner name=\(.name) status=\(.status) busy=\(.busy)"' \
            >>"$out" 2>>"$out"
          runner_rc=$?
          echo "runner_snapshot_rc=${runner_rc}" >> "$out"
          echo "runner_snapshot_end" >> "$out"

          sleep 3
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha' 2>>"$out")"
          latest_rc=$?
          echo "dispatch_target_sha=${latest}" | tee -a "$out"
          echo "latest_lookup_rc=${latest_rc}" >> "$out"
          dispatch_rc=99
          if [[ $latest_rc -eq 0 && "$latest" =~ ^[0-9a-f]{40}$ ]]; then
            gh workflow run server-ops.yml --repo "$GITHUB_REPOSITORY" --ref main -f operation=deploy_main >>"$out" 2>&1
            dispatch_rc=$?
          fi
          echo "dispatch_rc=${dispatch_rc}" >> "$out"
          echo "dispatch_requested=$([[ $dispatch_rc -eq 0 ]] && echo true || echo false)" >> "$out"

          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-vps-rescue.txt"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 "$out")"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/rescue-put.json
          import json,sys
          d={'message':'Update VPS rescue attestation','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: d['sha']=sys.argv[2]
          print(json.dumps(d))
          PY
          gh api -X PUT "$api" --input /tmp/rescue-put.json >/dev/null 2>&1
          publish_rc=$?
          cat "$out"
          echo "publish_rc=${publish_rc}"
          [[ $dispatch_rc -eq 0 && $publish_rc -eq 0 ]]
