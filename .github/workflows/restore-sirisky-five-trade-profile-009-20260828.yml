name: Restore SiRisky Five-Trade Profile 0.009 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-sirisky-five-trade-profile-009-20260828.yml'
      - 'scripts/restore_sirisky_five_trade_profile_009.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-sirisky-five-trade-profile-009
  cancel-in-progress: false

jobs:
  restore:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restore SiRisky five-trade profile at 0.009 SOL
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n bash scripts/restore_sirisky_five_trade_profile_009.sh
