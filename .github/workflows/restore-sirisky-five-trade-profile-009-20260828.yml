name: Restore SiRisky 1240 Shadow 15pct 0090 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-sirisky-five-trade-profile-009-20260828.yml'
      - 'scripts/restore_sirisky_1240_shadow_15pct_0090.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-sirisky-1240-shadow-15pct-0090
  cancel-in-progress: false

jobs:
  restore:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore SiRisky 12:40 profile in SHADOW
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n bash scripts/restore_sirisky_1240_shadow_15pct_0090.sh
