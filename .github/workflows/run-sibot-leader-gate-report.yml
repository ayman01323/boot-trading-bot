name: SiBot Leader Gate Read-Only Report
# Fresh post-cleanup proof after broader qualified Solana leader search: 2026-08-23T14:20Z

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-sibot-leader-gate-report.yml'
      - 'scripts/sibot_leader_gate_report.py'
      - 'scripts/install_sibot_leader_gate_wrapper.sh'
  schedule:
    # Keep the production leader funnel fresh for Strategy Lab. The main
    # three-agent strategy cycle runs at minute 17 every four hours.
    - cron: '7 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    env:
      REPORT_WRAPPER: /usr/local/sbin/run-sibot-leader-gate-report

    steps:
      - name: Check out exact current main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Capture current-main source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/sibot-leader-main-sha.txt
          echo "Current main: $(cat /tmp/sibot-leader-main-sha.txt)"

      - name: Verify restricted root report wrapper
        id: wrapper
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -x "$REPORT_WRAPPER"
          sudo -n -l "$REPORT_WRAPPER" >/dev/null

      - name: Record wrapper bootstrap requirement
        if: steps.wrapper.outcome != 'success'
        shell: bash
        run: |
          cat > /tmp/sibot-leader-gate-report.txt <<'EOF'
          Restricted SiBot leader-gate wrapper is not installed/authorised on the VPS.
          Install it once as root from the deployed main checkout with:
            sudo -E bash scripts/install_sibot_leader_gate_wrapper.sh
          The GitHub runner has not been granted direct /root access or arbitrary sudo.
          EOF

      - name: Run SiBot leader gate report read-only
        if: steps.wrapper.outcome == 'success'
        id: gate_report
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo -n "$REPORT_WRAPPER" 2>&1 \
            | sed -E 's/(account )[0-9]+/\1<redacted>/g' \
            | tee /tmp/sibot-leader-gate-report.txt

      - name: Publish report to GitHub job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## SiBot Leader Gate Read-Only Report'
            echo
            echo '```text'
            if [[ -f /tmp/sibot-leader-gate-report.txt ]]; then
              cat /tmp/sibot-leader-gate-report.txt
            else
              echo 'Report output was not produced.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitised result to ai-reviews
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          WRAPPER_OUTCOME: ${{ steps.wrapper.outcome }}
          REPORT_OUTCOME: ${{ steps.gate_report.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/sibot-leader-gate-result.json
          import json, os, pathlib, re, time

          def read(path, limit=12000):
              p = pathlib.Path(path)
              return p.read_text(encoding='utf-8', errors='replace')[-limit:].strip() if p.exists() else ''

          report = read('/tmp/sibot-leader-gate-report.txt')
          main_sha = read('/tmp/sibot-leader-main-sha.txt', 80)
          wrapper_outcome = os.environ.get('WRAPPER_OUTCOME') or 'not-run'
          report_outcome = os.environ.get('REPORT_OUTCOME') or 'not-run'
          m = re.search(r'(?m)^deployed_sha:\s*([0-9a-f]{40})\s*$', report)
          deployed_sha = m.group(1) if m else ''
          status = (
              'SUCCESS'
              if wrapper_outcome == 'success' and report_outcome == 'success' and bool(report)
              else 'FAILED'
          )
          if not report:
              report = 'Report output was not produced. Check the GitHub Actions job.'

          print(json.dumps({
              'schema_version': 2,
              'status': status,
              'generated_epoch': int(time.time()),
              'workflow_run_id': int(os.environ.get('RUN_ID') or 0),
              'current_main_sha': main_sha,
              'deployed_sha': deployed_sha,
              'deployed_matches_current_main': bool(deployed_sha and deployed_sha == main_sha),
              'data_source': 'production DATA_DIR/CSV_DIR via fixed read-only root wrapper',
              'account_ids_redacted': True,
              'wrapper_outcome': wrapper_outcome,
              'report_outcome': report_outcome,
              'report': report,
          }, indent=2, sort_keys=True))
          PY

          api="repos/${GITHUB_REPOSITORY}/contents/github/leader-gate/latest.json"
          existing_sha=''
          set +e
          gh api -H 'Accept: application/vnd.github+json' "$api?ref=ai-reviews" \
            > /tmp/sibot-leader-existing.json 2>/dev/null
          rc=$?
          set -e
          if [[ $rc -eq 0 && -s /tmp/sibot-leader-existing.json ]]; then
            existing_sha="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/sibot-leader-existing.json')).get('sha') or '')
          PY
            )"
          fi

          python3 - "$existing_sha" <<'PY' > /tmp/sibot-leader-put.json
          import base64, json, sys
          raw = open('/tmp/sibot-leader-gate-result.json', 'rb').read()
          payload = {
              'message': 'Record read-only SiBot leader gate report',
              'content': base64.b64encode(raw).decode(),
              'branch': 'ai-reviews',
          }
          if sys.argv[1]:
              payload['sha'] = sys.argv[1]
          print(json.dumps(payload))
          PY

          gh api -X PUT "$api" --input /tmp/sibot-leader-put.json >/dev/null

      - name: Fail workflow if wrapper/report failed
        if: always() && (steps.wrapper.outcome != 'success' || steps.gate_report.outcome != 'success')
        shell: bash
        run: exit 1
