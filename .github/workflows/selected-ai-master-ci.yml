name: Selected AI Master Control Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'learnerbot/ai_council.py'
      - 'learnerbot/ai_master_control.py'
      - 'learnerbot/ai_four_agent_health_patch.py'
      - 'learnerbot/telegram_ai_reports_menu_patch.py'
      - 'learnerbot/telegram_five_agent_patch.py'
      - 'learnerbot/telegram_command_scope_patch.py'
      - 'scripts/resilient_selected_master.py'
      - 'scripts/resilient_selected_master_v2.py'
      - 'scripts/weekly_bug_audit_baseline.py'
      - '.github/workflows/selected-ai-master.yml'
      - '.github/workflows/selected-ai-master-ci.yml'
      - '.github/workflows/publish-ai-master-control.yml'
      - '.github/workflows/deepseek-fifth-strategy-agent.yml'
      - '.github/workflows/deepseek-fifth-engineering-agent.yml'
      - '.github/workflows/selfhosted-five-agent-recovery.yml'
      - '.github/workflows/telegram-ai-cycle-dispatcher.yml'
      - '.github/workflows/claude-vps-controlled-ops.yml'
      - '.github/workflows/claude-vps-control-kick.yml'
      - '.github/workflows/claude-vps-analysis-retry.yml'
      - '.github/workflows/engineering-vps-resource-snapshot.yml'
      - '.github/workflows/claude-fourth-engineering-agent.yml'
      - '.github/copilot-instructions.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'CLAUDE.md'
      - 'tests/test_selected_ai_master_control.py'
      - 'tests/test_deepseek_fifth_agent.py'
      - 'tests/test_deepseek_claude_context.py'
      - 'tests/test_claude_vps_controlled_access.py'
      - 'tests/test_claude_vps_control_kick.py'
      - 'tests/test_claude_vps_analysis_retry.py'
      - 'tests/test_engineering_cost_bandwidth_audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selected-ai-master-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 25
    steps:
      - name: Check out tested ref without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run selected-master regressions in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/selected-ai-master-ci-${GITHUB_RUN_ID}"
          trap 'rm -rf "$venv"' EXIT
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q pytest
          "$venv/bin/python" -m py_compile \
            learnerbot/ai_council.py \
            learnerbot/ai_master_control.py \
            learnerbot/ai_four_agent_health_patch.py \
            learnerbot/telegram_five_agent_patch.py \
            scripts/resilient_selected_master.py \
            scripts/resilient_selected_master_v2.py \
            scripts/weekly_bug_audit_baseline.py
          "$venv/bin/python" -m pytest -q \
            tests/test_selected_ai_master_control.py \
            tests/test_deepseek_fifth_agent.py \
            tests/test_deepseek_claude_context.py \
            tests/test_claude_vps_controlled_access.py \
            tests/test_claude_vps_control_kick.py \
            tests/test_claude_vps_analysis_retry.py \
            tests/test_engineering_cost_bandwidth_audit.py
          grep -Fq 'selected-ai-master.yml' .github/workflows/strategy-resilient-master.yml
          grep -Fq 'selected-ai-master.yml' .github/workflows/weekly-resilient-master.yml
          grep -Fq 'selected-ai-master.yml' .github/workflows/gpt-master-strategy-action.yml
          grep -Fq 'selected-ai-master.yml' .github/workflows/four-agent-strategy-master.yml
