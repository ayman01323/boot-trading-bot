name: Self-Hosted Five-Agent Recovery (Deprecated Compatibility)

on:
  push:
    paths:
      - '.github/selfhosted-five-agent-recovery.trigger'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: selfhosted-five-agent-recovery-compat
  cancel-in-progress: true

jobs:
  delegate:
    # Do not occupy the trading VPS for non-urgent AI recovery.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delegate explicit recovery to seven-agent recovery watch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ai-agent-recovery.yml --ref main -f repair=true
          echo 'Deprecated five-agent self-hosted recovery no longer polls or consumes the BOOT VPS runner.'
