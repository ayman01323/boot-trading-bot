name: BOOT Server Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe server operation
        required: true
        type: choice
        default: status
        options:
          - status
          - deploy_main
          - restart_learnerbot
          - wallet_balance
      wallet:
        description: 0x wallet address (wallet_balance only)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: boot-vps-operations
  cancel-in-progress: false

jobs:
  operate:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    steps:
      - name: Status
        if: inputs.operation == 'status'
        run: sudo /usr/local/sbin/status-boot-trading-bot

      - name: Deploy current main
        id: deploy
        if: inputs.operation == 'deploy_main'
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/deploy-boot-trading-bot "${GITHUB_SHA}" 2>&1 | tee /tmp/server-ops-deploy-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Status after deploy attempt
        id: deploy_status
        if: always() && inputs.operation == 'deploy_main'
        shell: bash
        run: |
          set +e
          sudo /usr/local/sbin/status-boot-trading-bot 2>&1 | tee /tmp/server-ops-status.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish deploy-main attestation
        if: always() && inputs.operation == 'deploy_main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
          STATUS_EXIT: ${{ steps.deploy_status.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "requested_sha=${GITHUB_SHA}"
            echo "deploy_outcome=${DEPLOY_OUTCOME:-unknown}"
            echo "deploy_exit=${DEPLOY_EXIT:-unknown}"
            echo "status_exit=${STATUS_EXIT:-unknown}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "=== SERVER STATUS ==="
            cat /tmp/server-ops-status.txt 2>/dev/null || true
            echo
            echo "=== DEPLOY OUTPUT (tail) ==="
            tail -n 140 /tmp/server-ops-deploy-output.txt 2>/dev/null || true
          } > /tmp/server-ops-attestation.txt
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-server-ops-deploy.txt"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/server-ops-attestation.txt)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/server-ops-put.json
          import json,sys
          out={
              'message':'Update BOOT server-ops deployment attestation',
              'content':sys.argv[1],
              'branch':'server-diagnostics',
          }
          if sys.argv[2]: out['sha']=sys.argv[2]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/server-ops-put.json >/dev/null

      - name: Restart learnerbot
        if: inputs.operation == 'restart_learnerbot'
        run: sudo /usr/local/sbin/restart-boot-trading-bot

      - name: Validate wallet input
        if: inputs.operation == 'wallet_balance'
        shell: bash
        env:
          WALLET: ${{ inputs.wallet }}
        run: |
          set -euo pipefail
          if [[ ! "$WALLET" =~ ^0x[0-9A-Fa-f]{40}$ ]]; then
            echo 'wallet_balance requires a valid 0x EVM address' >&2
            exit 2
          fi
          sudo /usr/local/sbin/check-boot-wallet "$WALLET"
