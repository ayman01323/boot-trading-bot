name: SiBot History Depth Diagnostic CI

on:
  pull_request:
    paths:
      - '.github/workflows/sibot-history-depth-ci.yml'
      - 'docs/.server-diagnostics-evm-drainer-20260823'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-drainer-diagnostic:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 8
    steps:
      - name: Assert exact deployed SHA and active service
        shell: bash
        run: |
          set -euo pipefail
          status="$(sudo /usr/local/sbin/status-boot-trading-bot)"
          printf '%s\n' "$status"
          printf '%s\n' "$status" | grep -q '^sha:    cabc5bff54b4ca52649ba38dcaca7800be494d57$'
          printf '%s\n' "$status" | grep -q 'Active: active (running)'

      - name: Run restricted read-only SiBot leader/history report
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/run-sibot-leader-gate-report
