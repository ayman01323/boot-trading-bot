name: SiBot Final Read-Only Trading Blocker Check

on:
  pull_request:
    paths:
      - '.github/workflows/sibot-history-depth-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 8
    steps:
      - name: Verify exact deployed SHA and active service
        shell: bash
        run: |
          set -euo pipefail
          status="$(sudo /usr/local/sbin/status-boot-trading-bot)"
          printf '%s\n' "$status" | grep -q '^sha:    cabc5bff54b4ca52649ba38dcaca7800be494d57$'
          printf '%s\n' "$status" | grep -q 'Active: active (running)'
          printf '%s\n' "$status" | grep -E '^sha:|Active:|\[trade-blocker-health\]|\[sibot-broader-qualified:|\[solana-leader-edge-alignment\]|\[fast-market-scan\]' | tail -n 40 || true

      - name: Run restricted low-memory read-only leader/history report
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/run-sibot-leader-gate-report > /tmp/final-trading-blocker-report.txt
          awk '
            /^deployed_sha:/ || /^report_mode:/ || /^read_only:/ || /^provider_calls:/ {print; next}
            /^\[BNB Smart Chain/ || /^\[Arbitrum One/ || /^=== Solana/ {section=1; print; next}
            /^\[/ && $0 !~ /^\[BNB Smart Chain/ && $0 !~ /^\[Arbitrum One/ {if (section && $0 !~ /Solana/) section=0}
            section && /eligible_candidates=|history_store:|dominant_history_error:|candidate #|BOUNDED_PROOF_RESULT=|history worker marker:/ {print}
            /^Threshold decision:/ {print}
          ' /tmp/final-trading-blocker-report.txt

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f /tmp/final-trading-blocker-report.txt
