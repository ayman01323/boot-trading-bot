name: Selector Failure Reason Read-Only Check

on:
  pull_request:
    paths:
      - '.github/workflows/sibot-history-depth-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 4
    steps:
      - name: Verify exact deployed SHA and active service
        shell: bash
        run: |
          set -euo pipefail
          status="$(sudo /usr/local/sbin/status-boot-trading-bot)"
          printf '%s\n' "$status" | grep -q '^sha:    cabc5bff54b4ca52649ba38dcaca7800be494d57$'
          printf '%s\n' "$status" | grep -q 'Active: active (running)'

      - name: Read sanitised EVM and Solana leader selector bridges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, time
          for name in ('evm_leader_selector.json','solana_leader_selector.json'):
              p=pathlib.Path('/var/tmp/boot')/name
              print('===== '+name+' =====')
              if not p.is_file():
                  print('MISSING')
                  continue
              d=json.loads(p.read_text(encoding='utf-8'))
              print(json.dumps(d, indent=2, sort_keys=True))
              generated=int(d.get('generated_epoch') or 0)
              print('age_seconds='+str(max(0,int(time.time())-generated)) if generated else 'age_seconds=unknown')
          PY
