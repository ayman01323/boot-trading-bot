name: SiBot 1 Runtime Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sibot1-runtime-diagnostics
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - name: Wait for requested main to reach VPS
        shell: bash
        run: |
          set -euo pipefail
          root=/root/multichain-learning-bot-v2.2-fast-direct-market
          for i in $(seq 1 120); do
            current="$(git -C "$root" rev-parse HEAD 2>/dev/null || true)"
            if [[ "$current" == "$GITHUB_SHA" ]]; then
              echo "server_sha=$current"
              exit 0
            fi
            sleep 3
          done
          echo "VPS did not reach $GITHUB_SHA within timeout" >&2
          exit 1

      - name: Allow runtime to produce fresh evidence
        run: sleep 25

      - name: Build redacted runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, re, sqlite3, subprocess, time
          from collections import Counter
          from pathlib import Path

          root = Path('/root/multichain-learning-bot-v2.2-fast-direct-market')
          data = root / 'data'
          out = {
              'utc_epoch': int(time.time()),
              'server_sha': subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'], text=True).strip(),
              'service_active': subprocess.run(['systemctl','is-active','--quiet','learnerbot.service']).returncode == 0,
          }

          status_path = data / 'sibot1' / 'status.json'
          if status_path.exists():
              try:
                  status = json.loads(status_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  out['status_error'] = f'{type(exc).__name__}: {exc}'
              else:
                  keep_top = ('controller_state','mode','live_enabled','signer_attached','broadcast_enabled','wallet_private_key_access')
                  out['sibot1_status'] = {k: status.get(k) for k in keep_top if k in status}
                  workers = []
                  for row in status.get('workers') or []:
                      if not isinstance(row, dict):
                          continue
                      workers.append({k: row.get(k) for k in ('engine_id','chain','state','health','alive','pid','last_heartbeat_epoch') if k in row})
                  out['workers'] = workers
                  scores = []
                  for row in status.get('scoreboard') or []:
                      if not isinstance(row, dict):
                          continue
                      scores.append({k: row.get(k) for k in (
                          'engine_id','chain','signals','poolcheck_shadow','poolcheck_blocks','paper_entries','paper_exits',
                          'paper_wins','paper_losses','realised_pnl_quote','errors','last_event_epoch'
                      ) if k in row})
                  out['scoreboard'] = scores

          candidate_path = data / 'sibot1' / 'live_candidates.jsonl'
          candidates = []
          if candidate_path.exists():
              for line in candidate_path.read_text(encoding='utf-8', errors='replace').splitlines()[-500:]:
                  try:
                      row = json.loads(line)
                  except Exception:
                      continue
                  if not isinstance(row, dict):
                      continue
                  candidates.append(row)
          out['live_candidates_total_tail'] = len(candidates)
          out['live_candidate_kinds'] = dict(Counter(str(r.get('kind') or '') for r in candidates))
          out['live_candidate_engines'] = dict(Counter(str(r.get('engine_id') or '') for r in candidates))
          out['last_live_candidates'] = [
              {k: r.get(k) for k in (
                  'candidate_id','kind','engine_id','engine_version','strategy_id','chain','poolcheck_verdict',
                  'route_id','route_kind','execution_mode','intent_created_at_ms','net_edge_bps'
              ) if k in r}
              for r in candidates[-10:]
          ]

          db_path = data / 'sibot1_live_bridge.sqlite3'
          if db_path.exists():
              try:
                  conn = sqlite3.connect(db_path)
                  conn.row_factory = sqlite3.Row
                  rows = conn.execute('SELECT candidate_id,kind,chain,status,tx_hash,error,created_at,updated_at FROM attempts ORDER BY updated_at DESC LIMIT 50').fetchall()
                  out['attempt_status_counts_tail'] = dict(Counter(str(r['status']) for r in rows))
                  out['last_attempts'] = [dict(r) for r in rows[:15]]
                  pos = conn.execute("SELECT chain,status,COUNT(*) n FROM positions GROUP BY chain,status").fetchall()
                  out['live_position_counts'] = [dict(r) for r in pos]
                  conn.close()
              except Exception as exc:
                  out['attempts_error'] = f'{type(exc).__name__}: {exc}'

          control_path = root / 'CSVbot' / 'sibot1' / 'live_control.csv'
          if control_path.exists():
              try:
                  with control_path.open('r', encoding='utf-8-sig', newline='') as f:
                      rows = list(csv.DictReader(f))
                  def on(v): return str(v or '').strip().lower() in {'1','true','yes','on','y'}
                  out['live_control'] = {
                      'configured_accounts': len(rows),
                      'any_armed': any(on(r.get('armed')) for r in rows),
                      'any_live': any(on(r.get('live_enabled')) for r in rows),
                      'any_auto': any(on(r.get('auto_enabled')) for r in rows),
                  }
              except Exception as exc:
                  out['live_control_error'] = f'{type(exc).__name__}: {exc}'

          try:
              raw = subprocess.check_output(
                  ['journalctl','-u','learnerbot.service','--since','10 minutes ago','--no-pager','-o','cat'],
                  text=True, errors='replace', stderr=subprocess.STDOUT,
              )
              lines = [ln for ln in raw.splitlines() if re.search(r'sibot1|gpt worker|gemini worker|grok worker|claude worker|deepseek worker|kimi worker|copilot worker|traceback|error|exception', ln, re.I)]
              # Defensive redaction for any accidental hex secret-like values.
              lines = [re.sub(r'0x[0-9a-fA-F]{64}', '0x[REDACTED_SECRET]', ln) for ln in lines]
              out['relevant_logs_tail'] = lines[-120:]
          except Exception as exc:
              out['journal_error'] = f'{type(exc).__name__}: {exc}'

          Path('/tmp/sibot1-runtime-diag.json').write_text(json.dumps(out, indent=2, sort_keys=True), encoding='utf-8')
          PY
          cat /tmp/sibot1-runtime-diag.json

      - name: Publish redacted snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-sibot1-runtime.json"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/sibot1-runtime-diag.json)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/sibot1-runtime-put.json
          import json,sys
          out={'message':'Update redacted SiBot 1 runtime diagnostics','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: out['sha']=sys.argv[2]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/sibot1-runtime-put.json >/dev/null
