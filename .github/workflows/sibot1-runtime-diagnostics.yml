name: SiBot 1 Runtime Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sibot1-runtime-diagnostics
  cancel-in-progress: true

jobs:
  historical_wallet:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 8
    steps:
      - name: Find Aug 17 Solana trading wallet safely
        shell: bash
        run: |
          set -euo pipefail
          TOKEN='HUPMJ4Zsi9tLVoJS5SgHhKGxLosxFDejZAU9evy3pump'
          python3 - <<'PY'
          import csv,json,os,sqlite3,time
          from pathlib import Path
          TOKEN='HUPMJ4Zsi9tLVoJS5SgHhKGxLosxFDejZAU9evy3pump'
          roots=[Path('/root'),Path('/home/ayman01323')]
          skip={'.git','node_modules','.venv','venv','__pycache__','.cache'}
          files=[]
          for root in roots:
              if not root.exists(): continue
              for dp,dns,fns in os.walk(root):
                  dns[:]=[d for d in dns if d not in skip]
                  for fn in fns:
                      low=fn.lower()
                      if ('solana' in low and any(x in low for x in ('wallet','sibot','position','trade'))) or low in ('users.csv','user_trading_settings.csv'):
                          files.append(Path(dp)/fn)
          print('candidate_files='+str(len(files)))
          for p in sorted(files):
              try:
                  st=p.stat(); print(f'FILE path={p} mtime={time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime(st.st_mtime))} size={st.st_size}')
              except Exception: pass
          for p in files:
              if p.suffix.lower()=='.csv':
                  try:
                      with p.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
                  except Exception: continue
                  for i,r in enumerate(rows,2):
                      a=str(r.get('address') or r.get('wallet') or r.get('wallet_address') or '').strip()
                      if 32<=len(a)<=64 and a.isalnum():
                          print(f'CSV_WALLET path={p} line={i} address={a} telegram_id={r.get("telegram_id","")} wallet_id={r.get("wallet_id","")} label={r.get("label","")} signing={r.get("signing","")} enabled={r.get("enabled","")} active={r.get("active","")}')
              elif p.name.endswith('.enc.json'):
                  try: j=json.loads(p.read_text(encoding='utf-8'))
                  except Exception: continue
                  a=str(j.get('address') or '').strip()
                  if a: print(f'ENC_WALLET path={p} address={a} telegram_id={j.get("telegram_id","")} wallet_id={j.get("wallet_id","")} source={j.get("source","")}')
              elif p.suffix.lower() in ('.sqlite','.sqlite3','.db'):
                  try:
                      con=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=3); con.row_factory=sqlite3.Row
                      tabs={x[0] for x in con.execute("select name from sqlite_master where type='table'")}
                      if 'positions' in tabs:
                          cols={x[1] for x in con.execute('pragma table_info(positions)')}
                          if 'mint' in cols:
                              for rr in con.execute('select * from positions where mint=? order by entry_ts desc limit 20',(TOKEN,)):
                                  d=dict(rr); print('MATCH_POSITION db={} telegram_id={} leader_wallet={} mint={} mode={} status={} entry_ts={} entry_cost_sol={} leader_buy_signature={} exit_signature={} exit_reason={}'.format(p,d.get('telegram_id',''),d.get('leader_wallet',''),d.get('mint',''),d.get('mode',''),d.get('status',''),d.get('entry_ts',''),d.get('entry_cost_sol',''),d.get('leader_buy_signature',''),d.get('exit_signature',''),d.get('exit_reason','')))
                      if 'leader_events' in tabs:
                          cols={x[1] for x in con.execute('pragma table_info(leader_events)')}
                          if 'mint' in cols:
                              for rr in con.execute('select * from leader_events where mint=? order by event_ts desc limit 20',(TOKEN,)):
                                  d=dict(rr); print('MATCH_EVENT db={} leader_wallet={} action={} mint={} sol_amount={} sell_pct={} signature={} event_ts={}'.format(p,d.get('leader_wallet',''),d.get('action',''),d.get('mint',''),d.get('sol_amount',''),d.get('sell_pct',''),d.get('signature',''),d.get('event_ts','')))
                      con.close()
                  except Exception as e: print(f'DB_SKIP path={p} error={type(e).__name__}')
          print('secret_values_printed=NO')
          PY
          for root in /root /home/ayman01323; do
            [[ -d "$root" ]] || continue
            grep -RIl --exclude='*.enc.json' --exclude='*backup*' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv "$TOKEN" "$root" 2>/dev/null | head -50 | while read -r f; do
              echo "TOKEN_FILE path=$f"
              grep -nF "$TOKEN" "$f" 2>/dev/null | head -10 | sed -E 's/(encrypted_keypair|private_key|secret|keypair)[^,}]*/[REDACTED]/Ig'
            done
          done
          echo live_execution_started=NO
          echo production_service_restart=NO

  snapshot:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Read redacted runtime export
        shell: bash
        run: |
          set -euo pipefail
          src=/var/tmp/sibot1-runtime-diag.json
          for i in $(seq 1 60); do
            if [[ -s "$src" ]]; then
              cp "$src" /tmp/sibot1-runtime-diag.json
              python3 -m json.tool /tmp/sibot1-runtime-diag.json >/dev/null
              cat /tmp/sibot1-runtime-diag.json
              exit 0
            fi
            sleep 3
          done
          echo 'Redacted SiBot 1 runtime export is not available yet.' >&2
          exit 1

      - name: Publish redacted snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-sibot1-runtime.json"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/sibot1-runtime-diag.json)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/sibot1-runtime-put.json
          import json,sys
          out={'message':'Update redacted SiBot 1 runtime diagnostics','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: out['sha']=sys.argv[2]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/sibot1-runtime-put.json >/dev/null
