name: Deploy SiBot 1 Shadow Engines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sibot1-shadow-protected-deploy.yml'
      - 'sibot1_engines/**'
      - 'CSVbot/sibot1/**'
      - 'tests/sibot1/**'
      - 'docs/sibot1/**'
      - 'scripts/sibot1_shadow_runtime.py'
      - 'learnerbot/sibot1_shadow_runtime_patch.py'
      - 'learnerbot/__init__.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sibot1-shadow-protected-deploy
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 25
    steps:
      - name: Deploy exact current main through restricted wrapper
        shell: bash
        run: |
          set -euo pipefail
          target="${GITHUB_SHA}"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          sudo /usr/local/sbin/deploy-boot-trading-bot "$target"

      - name: Verify service and SiBot 1 sanitized runtime health
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/status-boot-trading-bot
          status=/var/tmp/boot/sibot1_shadow_status.json
          ok=0
          for _ in $(seq 1 60); do
            if test -r "$status" && STATUS="$status" python3 - <<'PY'
          import json
          import os
          import time

          path = os.environ["STATUS"]
          try:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
          except Exception:
              raise SystemExit(1)

          if str(data.get("supervisor_state") or "") != "ACTIVE":
              raise SystemExit(1)
          if str(data.get("mode") or "").upper() != "SHADOW":
              raise SystemExit(1)
          for key in ("live_enabled", "signer_attached", "broadcast_enabled", "wallet_private_key_access"):
              if data.get(key) is not False:
                  raise SystemExit(1)
          if data.get("runtime_fresh") is not True:
              raise SystemExit(1)
          if int(time.time()) - int(data.get("runtime_updated_epoch") or 0) > 20:
              raise SystemExit(1)

          workers = data.get("workers") or {}
          for engine in ("gpt", "gemini", "grok"):
              row = workers.get(engine) or {}
              if row.get("alive") is not True:
                  raise SystemExit(1)
              if str(row.get("state") or "").upper() not in {"READY", "HEALTH"}:
                  raise SystemExit(1)
              if int(row.get("pid") or 0) <= 0:
                  raise SystemExit(1)

          print("SIBOT1_SHADOW_RUNTIME_OK")
          PY
            then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" -eq 1
          cat "$status"

      - name: Confirm deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'SiBot 1 GPT/Gemini/Grok runtime is deployed in SHADOW mode.'
          echo 'LIVE=false signer=false broadcast=false private-key-access=false.'
