name: SiLearn 676 Telegram delivery check

on:
  push:
    branches:
      - 'ops/SiLearn-2026-08-29T1644BST-google-lp-final-deploy'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Diagnose MASTER 676 Telegram delivery
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n true
          ROOT=/home/ayman01323/BOOT/testingbots/learn
          TID=6760898817
          echo 'SiLearn — 2026-08-29 17:22 BST — Subject: Test MASTER 676 direct Telegram delivery from runtime env file'
          echo "service=$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)"
          PID="$(systemctl show learnerbot-learn.service -p MainPID --value)"
          test "$PID" != 0
          echo "pid=$PID"

          ROOT="$ROOT" TID="$TID" python3 - <<'PY'
          import csv, os
          from pathlib import Path
          root=Path(os.environ['ROOT']); tid=os.environ['TID']
          users=root/'CSVbot'/'users.csv'
          settings=root/'CSVbot'/'user_trading_settings.csv'
          found=False
          if users.exists():
              with users.open('r',encoding='utf-8-sig',newline='') as f:
                  for row in csv.DictReader(f):
                      if str(row.get('telegram_id') or '').strip()!=tid:
                          continue
                      found=True
                      keys=('role','status','fee_plan_id','label','allowed_chains','can_manual_trade','can_auto_trade')
                      print('user_row '+' '.join('%s=%s'%(k,row.get(k,'')) for k in keys))
          print('user_registered='+str(found).lower())
          wanted={'sibot_enabled','sibot_auto_trade_enabled','solana_live_enabled','learner_new_entries_enabled','auto_trading_enabled','live_trading_enabled','recommendation_mode'}
          if settings.exists():
              with settings.open('r',encoding='utf-8-sig',newline='') as f:
                  for row in csv.DictReader(f):
                      if str(row.get('telegram_id') or '').strip()!=tid:
                          continue
                      setting=str(row.get('setting') or '').strip()
                      if setting in wanted:
                          print('setting chain=%s %s=%s' % (row.get('chain_id',''),setting,row.get('value','')))
          PY

          # Read token + legacy broadcast IDs from the learner .env without ever printing the token.
          TOKEN="$(sudo -n env ROOT="$ROOT" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['ROOT'])/'.env'
          value=''
          if p.exists():
              for raw in p.read_text(encoding='utf-8',errors='ignore').splitlines():
                  s=raw.strip()
                  if not s or s.startswith('#') or '=' not in s: continue
                  k,v=s.split('=',1)
                  if k.strip()=='TELEGRAM_BOT_TOKEN':
                      value=v.strip().strip('"').strip("'")
                      break
          print(value)
          PY
          )"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          sudo -n env ROOT="$ROOT" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['ROOT'])/'.env'
          vals={}
          if p.exists():
              for raw in p.read_text(encoding='utf-8',errors='ignore').splitlines():
                  s=raw.strip()
                  if not s or s.startswith('#') or '=' not in s: continue
                  k,v=s.split('=',1); k=k.strip()
                  if k in {'TELEGRAM_CHAT_IDS','TELEGRAM_CHAT_ID'}:
                      vals[k]=v.strip().strip('"').strip("'")
          print('env_TELEGRAM_CHAT_IDS='+vals.get('TELEGRAM_CHAT_IDS',''))
          print('env_TELEGRAM_CHAT_ID='+vals.get('TELEGRAM_CHAT_ID',''))
          PY

          TOKEN="$TOKEN" TID="$TID" python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          token=os.environ['TOKEN']; tid=os.environ['TID']
          base='https://api.telegram.org/bot'+token+'/'
          def call(method, payload):
              data=urllib.parse.urlencode(payload).encode()
              req=urllib.request.Request(base+method,data=data,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try: return json.loads(body)
                  except Exception: return {'ok':False,'error_code':e.code,'description':body[:180]}
          me=call('getMe',{})
          result=me.get('result') or {}
          print('telegram_getme_ok='+str(bool(me.get('ok'))).lower())
          print('telegram_bot_username='+str(result.get('username') or ''))
          test=call('sendMessage',{
              'chat_id':tid,
              'text':'SiLearn — 2026-08-29 17:22 BST — Subject: Telegram delivery test for MASTER 6760898817\n\nDirect delivery test only. No trading action.',
              'disable_notification':'false'
          })
          print('direct_send_ok='+str(bool(test.get('ok'))).lower())
          if test.get('ok'):
              msg=test.get('result') or {}
              print('direct_send_message_id='+str(msg.get('message_id') or ''))
          else:
              print('direct_send_error_code='+str(test.get('error_code') or ''))
              print('direct_send_description='+str(test.get('description') or '')[:240])
          PY

          echo 'recent_target_logs:'
          journalctl -u learnerbot-learn.service --since '20 min ago' --no-pager 2>/dev/null | grep -E 'learner-reject-once.*targets=|telegram-account.*6760898817|telegram_error=' | tail -n 30 || true
