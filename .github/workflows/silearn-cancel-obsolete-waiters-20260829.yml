name: SiLearn cancel obsolete waiter jobs

on:
  push:
    branches:
      - 'ops/SiLearn-2026-08-29T1800BST-force-restart-report'

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel obsolete SiLearn self-hosted wait and diagnostic runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo 'SiLearn — 2026-08-29 18:12 BST — Subject: Cancel obsolete SiLearn waiter jobs before operator restart'
          for id in \
            33263293839 \
            33264375494 \
            33264375480 \
            33264375539 \
            33264375586
          do
            code="$(curl -sS -o /tmp/cancel-$id.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/ayman01323/boot-trading-bot/actions/runs/$id/cancel")"
            echo "cancel_run=$id http=$code"
            # 202 = cancellation accepted; 409 means already completed/not cancellable and is harmless.
            test "$code" = 202 -o "$code" = 409
          done
          echo 'obsolete_silearn_runs_cancel_requested=true'
