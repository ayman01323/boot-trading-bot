name: SiLearn cancel obsolete waiter jobs

on:
  push:
    branches:
      - 'ops/SiLearn-2026-08-29T1800BST-force-restart-report'

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel obsolete SiLearn runs and duplicate restarts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo 'SiLearn — 2026-08-29 18:13 BST — Subject: Keep exactly one operator restart run'
          cancel_one() {
            id="$1"
            code="$(curl -sS -o /tmp/cancel-$id.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/ayman01323/boot-trading-bot/actions/runs/$id/cancel")"
            echo "cancel_run=$id http=$code"
            test "$code" = 202 -o "$code" = 409
          }

          # Obsolete old-branch waiter/diagnostic jobs.
          for id in 33263293839 33264375494 33264375480 33264375539 33264375586; do
            cancel_one "$id"
          done

          # Preserve only the first operator-approved restart/report run.
          KEEP=33264597454
          JSON="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/ayman01323/boot-trading-bot/actions/runs?branch=ops%2FSiLearn-2026-08-29T1800BST-force-restart-report&per_page=100')"
          IDS="$(JSON="$JSON" KEEP="$KEEP" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['JSON']); keep=int(os.environ['KEEP'])
          for r in data.get('workflow_runs',[]):
              if r.get('name') != 'SiLearn force restart and position report':
                  continue
              rid=int(r.get('id') or 0)
              if rid and rid != keep and r.get('status') in {'queued','in_progress','waiting','pending','requested'}:
                  print(rid)
          PY
          )"
          for id in $IDS; do cancel_one "$id"; done
          echo "preserved_restart_run=$KEEP"
          echo 'duplicate_restart_cleanup=true'
