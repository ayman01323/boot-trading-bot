name: SiLearn force restart and position report

on:
  push:
    branches:
      - 'ops/SiLearn-2026-08-29T1800BST-force-restart-report'

permissions:
  contents: read

jobs:
  restart-report:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Force operator-approved restart and read-only position report
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n true
          ROOT=/home/ayman01323/BOOT/testingbots/learn
          TID=6760898817
          SOURCE_SHA=0a98de1b02012393e4044817b4356fb32442016f
          STAMP=20260829T1800BST
          BACKUP="$ROOT/private/change-control/${STAMP}-force-restart-master-676"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          echo 'SiLearn — 2026-08-29 18:00 BST — Subject: Restart with open LIVE position to activate MASTER 676 alerts and report position'
          echo 'operator_override_restart_with_open_live=true'
          test "$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)" = active

          # Record open LIVE state before the explicitly requested restart.
          ROOT="$ROOT" python3 - <<'PY'
          import os, sqlite3
          from pathlib import Path
          root=Path(os.environ['ROOT']); total=0
          for p in (root/'data'/'sibot.sqlite3', root/'data'/'solana_sibot.sqlite3'):
              if not p.exists(): continue
              c=sqlite3.connect(f'file:{p}?mode=ro', uri=True, timeout=3)
              try:
                  tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
                  if 'positions' not in tables: continue
                  cols={r[1] for r in c.execute('pragma table_info(positions)')}
                  if {'status','mode'} <= cols:
                      n=int(c.execute("select count(*) from positions where upper(coalesce(status,''))='OPEN' and upper(coalesce(mode,''))='LIVE'").fetchone()[0])
                      print(f'prerestart_open_live {p.name}={n}'); total += n
              finally: c.close()
          print(f'prerestart_open_live_total={total}')
          PY

          sudo -n mkdir -p "$BACKUP"
          sudo -n cp -a "$ROOT/learnerbot/__main__.py" "$BACKUP/__main__.py.pre"
          sudo -n cp -a "$ROOT/CSVbot/users.csv" "$BACKUP/users.csv.pre"
          if test -f "$ROOT/learnerbot/telegram_master_676_alerts_patch.py"; then
            sudo -n cp -a "$ROOT/learnerbot/telegram_master_676_alerts_patch.py" "$BACKUP/telegram_master_676_alerts_patch.py.pre"
          else
            sudo -n touch "$BACKUP/telegram_master_676_alerts_patch.py.was_absent"
          fi
          printf '%s\n' "$SOURCE_SHA" | sudo -n tee "$BACKUP/source_sha.txt" >/dev/null
          printf '%s\n' 'SiLearn — 2026-08-29 18:00 BST — Subject: Restart with open LIVE position to activate MASTER 676 alerts and report position' | sudo -n tee "$BACKUP/subject.txt" >/dev/null

          curl -fsSL "https://raw.githubusercontent.com/ayman01323/boot-trading-bot/$SOURCE_SHA/learnerbot/telegram_master_676_alerts_patch.py" -o "$TMP/patch.py"
          grep -Fq 'TARGET_TELEGRAM_ID = "6760898817"' "$TMP/patch.py"
          grep -Fq '_reject_targets_with_masters' "$TMP/patch.py"
          TMP="$TMP" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['TMP'])/'patch.py'
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          print('patch_compile_ok=true')
          PY

          rollback() {
            echo 'ROLLBACK_START'
            sudo -n cp -a "$BACKUP/__main__.py.pre" "$ROOT/learnerbot/__main__.py"
            sudo -n cp -a "$BACKUP/users.csv.pre" "$ROOT/CSVbot/users.csv"
            if test -f "$BACKUP/telegram_master_676_alerts_patch.py.pre"; then
              sudo -n cp -a "$BACKUP/telegram_master_676_alerts_patch.py.pre" "$ROOT/learnerbot/telegram_master_676_alerts_patch.py"
            else
              sudo -n rm -f "$ROOT/learnerbot/telegram_master_676_alerts_patch.py"
            fi
            sudo -n systemctl restart learnerbot-learn.service || true
            sleep 5
            echo "rollback_service=$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)"
          }
          trap 'rc=$?; if test $rc -ne 0; then rollback; fi; rm -rf "$TMP"; exit $rc' EXIT

          MODE="$(stat -c %a "$ROOT/learnerbot/__main__.py")"
          sudo -n install -m "$MODE" "$TMP/patch.py" "$ROOT/learnerbot/telegram_master_676_alerts_patch.py"
          sudo -n chown --reference="$ROOT/learnerbot/__main__.py" "$ROOT/learnerbot/telegram_master_676_alerts_patch.py"

          # Preserve the Google-specific __main__.py; insert only the late reporting import.
          sudo -n env ROOT="$ROOT" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['ROOT'])/'learnerbot'/'__main__.py'
          text=p.read_text(encoding='utf-8')
          marker='from .cli import main\n'
          line='from . import telegram_master_676_alerts_patch  # noqa: F401'
          if marker not in text: raise SystemExit('custom __main__.py CLI marker not found')
          if line not in text:
              stamp='# SiLearn — 2026-08-29 18:00 BST — Subject: MASTER 676 alert routing operator restart.\n'+line+'\n'
              text=text.replace(marker, stamp+marker, 1)
              tmp=p.with_name('__main__.py.master-676-force-new')
              tmp.write_text(text, encoding='utf-8')
              os.chmod(tmp, p.stat().st_mode)
              os.replace(tmp,p)
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          print('custom_main_compile_ok=true')
          PY
          sudo -n chown --reference="$BACKUP/__main__.py.pre" "$ROOT/learnerbot/__main__.py"

          SINCE="$(date '+%Y-%m-%d %H:%M:%S')"
          sudo -n systemctl restart learnerbot-learn.service
          sleep 8
          test "$(systemctl is-active learnerbot-learn.service)" = active
          PID1="$(systemctl show learnerbot-learn.service -p MainPID --value)"
          R1="$(systemctl show learnerbot-learn.service -p NRestarts --value)"
          test "$PID1" != 0
          sleep 10
          test "$(systemctl is-active learnerbot-learn.service)" = active
          PID2="$(systemctl show learnerbot-learn.service -p MainPID --value)"
          R2="$(systemctl show learnerbot-learn.service -p NRestarts --value)"
          test "$PID1" = "$PID2"
          test "$R1" = "$R2"
          echo "service=active pid=$PID2 restarts=$R2"

          LOG="$TMP/postrestart.log"
          journalctl -u learnerbot-learn.service --since "$SINCE" --no-pager > "$LOG" 2>/dev/null || true
          grep -F '[silearn-master-alerts]' "$LOG"

          # Verify target MASTER row survived the restart and no trading settings were created.
          ROOT="$ROOT" TID="$TID" python3 - <<'PY'
          import csv, os
          from pathlib import Path
          root=Path(os.environ['ROOT']); tid=os.environ['TID']
          row=None
          with (root/'CSVbot'/'users.csv').open('r',encoding='utf-8-sig',newline='') as f:
              for x in csv.DictReader(f):
                  if str(x.get('telegram_id') or '').strip()==tid: row=x; break
          if not row: raise SystemExit('target master missing after restart')
          print('target_role='+str(row.get('role')))
          print('target_status='+str(row.get('status')))
          assert str(row.get('role') or '').upper()=='MASTER'
          assert str(row.get('status') or '').upper()=='ACTIVE'
          settings=root/'CSVbot'/'user_trading_settings.csv'; count=0
          if settings.exists():
              with settings.open('r',encoding='utf-8-sig',newline='') as f:
                  count=sum(1 for r in csv.DictReader(f) if str(r.get('telegram_id') or '').strip()==tid)
          print('target_trading_setting_rows='+str(count))
          PY

          # Direct harmless delivery verification after restart.
          TOKEN="$(sudo -n env ROOT="$ROOT" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['ROOT'])/'.env'; val=''
          for raw in p.read_text(encoding='utf-8',errors='ignore').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              k,v=s.split('=',1)
              if k.strip()=='TELEGRAM_BOT_TOKEN': val=v.strip().strip('"').strip("'"); break
          print(val)
          PY
          )"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          TOKEN="$TOKEN" TID="$TID" python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ['TOKEN']; tid=os.environ['TID']
          payload=urllib.parse.urlencode({'chat_id':tid,'text':'SiLearn restart complete. MASTER 6760898817 alert routing is active. No trading settings were changed and no trade was placed by this restart.'}).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage',data=payload,method='POST')
          with urllib.request.urlopen(req,timeout=20) as r: data=json.loads(r.read().decode())
          assert data.get('ok') is True
          print('master_delivery_ok=true message_id='+str((data.get('result') or {}).get('message_id') or ''))
          PY

          # Read-only position report and current Jupiter sell quote. No signing/broadcast.
          ROOT="$ROOT" python3 - <<'PY'
          import datetime as dt, json, os, sqlite3, urllib.error, urllib.parse, urllib.request
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          db=root/'data'/'solana_sibot.sqlite3'
          if not db.exists(): raise SystemExit('solana_sibot.sqlite3 missing')
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=5); c.row_factory=sqlite3.Row
          rows=c.execute("select * from positions where upper(coalesce(status,''))='OPEN' and upper(coalesce(mode,''))='LIVE' order by entry_ts asc").fetchall(); c.close()
          print('OPEN_POSITION_COUNT='+str(len(rows)))
          env={}
          for raw in (root/'.env').read_text(encoding='utf-8',errors='ignore').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              k,v=s.split('=',1); env[k.strip()]=v.strip().strip('"').strip("'")
          primary=env.get('JUPITER_API_KEY',''); backup=env.get('JUPITER_BACKUP_API_KEY','')
          base=(env.get('JUPITER_API_URL') or 'https://api.jup.ag').rstrip('/')
          wsol='So11111111111111111111111111111111111111112'
          usdc='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'
          def q(input_mint, output_mint, amount):
              params=urllib.parse.urlencode({'inputMint':input_mint,'outputMint':output_mint,'amount':str(int(amount))})
              url=base+'/swap/v2/order?'+params
              errors=[]
              for label,key in [('primary',primary),('backup',backup)]:
                  if not key: continue
                  req=urllib.request.Request(url,headers={'x-api-key':key,'User-Agent':'SiLearn-readonly-position-report/1.0'})
                  try:
                      with urllib.request.urlopen(req,timeout=25) as r:
                          data=json.loads(r.read().decode())
                          return label,data
                  except urllib.error.HTTPError as e:
                      body=e.read().decode(errors='ignore')[:250]
                      errors.append(f'{label}:HTTP{e.code}:{body}')
                      if e.code not in (429,500,502,503,504): break
                  except Exception as e:
                      errors.append(f'{label}:{type(e).__name__}:{e}')
              raise RuntimeError(' | '.join(errors) or 'no Jupiter key')
          sol_usd=None
          try:
              provider,priceq=q(wsol,usdc,1_000_000_000)
              out=int(priceq.get('outAmount') or priceq.get('outputAmount') or priceq.get('estimatedOutputAmount') or 0)
              if out>0: sol_usd=Decimal(out)/Decimal(1_000_000)
              print('SOL_USD_PROVIDER='+provider)
              print('SOL_USD='+('NA' if sol_usd is None else str(sol_usd)))
          except Exception as e:
              print('SOL_USD_ERROR='+str(e).replace('\n',' ')[:500])
          now=dt.datetime.now(dt.timezone.utc)
          bst=dt.timezone(dt.timedelta(hours=1))
          for i,r in enumerate(rows,1):
              d=dict(r); mint=str(d.get('mint') or ''); raw=int(d.get('token_amount_raw') or 0); entry=Decimal(str(d.get('entry_cost_sol') or '0'))
              ets=int(d.get('entry_ts') or 0); buy=dt.datetime.fromtimestamp(ets,dt.timezone.utc) if ets else None
              print(f'POSITION_{i}_ID='+str(d.get('position_id') or ''))
              print(f'POSITION_{i}_TELEGRAM_ID='+str(d.get('telegram_id') or ''))
              print(f'POSITION_{i}_LEADER='+str(d.get('leader_wallet') or ''))
              print(f'POSITION_{i}_MINT='+mint)
              print(f'POSITION_{i}_TOKEN_RAW='+str(raw))
              print(f'POSITION_{i}_ENTRY_COST_SOL='+str(entry))
              print(f'POSITION_{i}_BUY_TIME_UTC='+(buy.isoformat() if buy else 'NA'))
              print(f'POSITION_{i}_BUY_TIME_BST='+(buy.astimezone(bst).isoformat() if buy else 'NA'))
              print(f'POSITION_{i}_AGE_SECONDS='+(str(int((now-buy).total_seconds())) if buy else 'NA'))
              print(f'POSITION_{i}_ENTRY_TX='+str(d.get('exit_signature') or d.get('leader_buy_signature') or ''))
              try:
                  provider,quote=q(mint,wsol,raw)
                  out=int(quote.get('outAmount') or quote.get('outputAmount') or quote.get('estimatedOutputAmount') or 0)
                  if out<=0: raise RuntimeError('Jupiter quote returned no positive output amount')
                  cur=Decimal(out)/Decimal(1_000_000_000)
                  pnl=cur-entry; pct=(pnl/entry*Decimal(100)) if entry>0 else Decimal(0)
                  print(f'POSITION_{i}_QUOTE_PROVIDER='+provider)
                  print(f'POSITION_{i}_CURRENT_EXIT_SOL='+str(cur))
                  print(f'POSITION_{i}_PNL_SOL='+str(pnl))
                  print(f'POSITION_{i}_PNL_PCT='+str(pct))
                  if sol_usd is not None:
                      print(f'POSITION_{i}_ENTRY_VALUE_USD_CURRENT_SOL_PRICE='+str(entry*sol_usd))
                      print(f'POSITION_{i}_CURRENT_VALUE_USD='+str(cur*sol_usd))
                  print(f'POSITION_{i}_PEAK_UNREALISED_PCT='+str(d.get('peak_unrealised_pct') or 0))
                  print(f'POSITION_{i}_DB_CURRENT_EXIT_SOL='+str(d.get('current_exit_sol') or ''))
                  print(f'POSITION_{i}_DB_UNREALISED_PCT='+str(d.get('unrealised_pct') or ''))
              except Exception as e:
                  print(f'POSITION_{i}_QUOTE_ERROR='+str(e).replace('\n',' ')[:700])
          PY

          echo "backup=$BACKUP"
          echo 'RESTART_AND_REPORT_VERIFIED=true'
          trap - EXIT
          rm -rf "$TMP"
