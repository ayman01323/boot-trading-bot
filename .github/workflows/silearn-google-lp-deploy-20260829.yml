name: SiLearn Google LP warning-only deploy

on:
  push:
    branches:
      - 'ops/SiLearn-2026-08-29T1632BST-google-lp-deploy'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 8
    steps:
      - name: Guarded targeted deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          ROOT=/home/ayman01323/BOOT/testingbots/learn
          TARGET_SHA=cd55e1f470e36c6966ff9a71e51cab5e985952dc
          STAMP=20260829T1632BST
          BACKUP="$ROOT/private/change-control/${STAMP}-lp-warning-only"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          echo 'SiLearn — 2026-08-29 16:32 BST — Subject: Deploy 13:28 LP warning-only policy to Google Learner'
          test -d "$ROOT/learnerbot"
          test "$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)" = active

          # Re-check LIVE exposure immediately before any file mutation.
          ROOT="$ROOT" python3 - <<'PY'
          import os, sqlite3, sys
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          total=0
          for p in (root/'data'/'sibot.sqlite3', root/'data'/'solana_sibot.sqlite3'):
              if not p.exists():
                  continue
              conn=sqlite3.connect(f'file:{p}?mode=ro', uri=True, timeout=2)
              tables={r[0] for r in conn.execute("select name from sqlite_master where type='table'")}
              if 'positions' in tables:
                  cols={r[1] for r in conn.execute('pragma table_info(positions)')}
                  if {'status','mode'} <= cols:
                      n=int(conn.execute("select count(*) from positions where upper(coalesce(status,''))='OPEN' and upper(coalesce(mode,''))='LIVE'").fetchone()[0])
                      print(f'predeploy_open_live {p.name}={n}')
                      total += n
              conn.close()
          print(f'predeploy_open_live_total={total}')
          if total:
              sys.exit(42)
          PY

          mkdir -p "$BACKUP"
          cp -a "$ROOT/learnerbot/__main__.py" "$BACKUP/__main__.py.pre"
          for f in solana_reject_once_reporting_patch.py solana_lp_warning_only_patch.py; do
            if test -f "$ROOT/learnerbot/$f"; then
              cp -a "$ROOT/learnerbot/$f" "$BACKUP/$f.pre"
            else
              : > "$BACKUP/$f.was_absent"
            fi
          done
          printf '%s\n' "$TARGET_SHA" > "$BACKUP/source_sha.txt"
          printf '%s\n' 'SiLearn — 2026-08-29 16:32 BST — Subject: Deploy LP warning-only and once-only reporting to Google Learner' > "$BACKUP/subject.txt"

          BASE="https://raw.githubusercontent.com/ayman01323/boot-trading-bot/$TARGET_SHA/learnerbot"
          curl -fsSL "$BASE/solana_reject_once_reporting_patch.py" -o "$TMP/solana_reject_once_reporting_patch.py"
          curl -fsSL "$BASE/solana_lp_warning_only_patch.py" -o "$TMP/solana_lp_warning_only_patch.py"
          grep -q 'once_per_account_mint_leader_reason' "$TMP/solana_reject_once_reporting_patch.py"
          grep -q 'lp_lock=WARNING_ONLY' "$TMP/solana_lp_warning_only_patch.py"

          # Compile downloaded source in memory: no __pycache__ writes.
          TMP="$TMP" python3 - <<'PY'
          import os
          from pathlib import Path
          t=Path(os.environ['TMP'])
          for p in t.glob('*.py'):
              compile(p.read_text(encoding='utf-8'), str(p), 'exec')
              print('compile_ok='+p.name)
          PY

          rollback() {
            echo 'ROLLBACK_START'
            cp -a "$BACKUP/__main__.py.pre" "$ROOT/learnerbot/__main__.py"
            for f in solana_reject_once_reporting_patch.py solana_lp_warning_only_patch.py; do
              if test -f "$BACKUP/$f.pre"; then
                cp -a "$BACKUP/$f.pre" "$ROOT/learnerbot/$f"
              else
                rm -f "$ROOT/learnerbot/$f"
              fi
            done
            systemctl restart learnerbot-learn.service || true
            sleep 5
            echo "rollback_service=$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)"
          }
          trap 'rc=$?; if test $rc -ne 0; then rollback; fi; rm -rf "$TMP"; exit $rc' EXIT

          # Install only the two approved late-layer modules.
          for f in solana_reject_once_reporting_patch.py solana_lp_warning_only_patch.py; do
            install -m "$(stat -c %a "$ROOT/learnerbot/__main__.py")" "$TMP/$f" "$ROOT/learnerbot/$f"
            chown --reference="$ROOT/learnerbot/__main__.py" "$ROOT/learnerbot/$f"
          done

          # Preserve the customised Google __main__.py; insert only two imports
          # immediately before its existing CLI entry point.
          ROOT="$ROOT" python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          p=root/'learnerbot'/'__main__.py'
          text=p.read_text(encoding='utf-8')
          marker='from .cli import main\n'
          if marker not in text:
              raise SystemExit('custom __main__.py CLI marker not found')
          lines=[]
          if 'from . import solana_reject_once_reporting_patch' not in text:
              lines += [
                  '# SiLearn — 2026-08-29 12:23:54 BST — Subject: One-time rejection alerts.',
                  'from . import solana_reject_once_reporting_patch  # noqa: F401',
              ]
          if 'from . import solana_lp_warning_only_patch' not in text:
              lines += [
                  '# SiLearn — 2026-08-29 13:28 BST — Subject: Downgrade LP lock/provider warnings to Telegram reference only.',
                  'from . import solana_lp_warning_only_patch  # noqa: F401',
              ]
          if lines:
              text=text.replace(marker, '\n'.join(lines)+'\n'+marker, 1)
              tmp=p.with_name('__main__.py.silearn-new')
              tmp.write_text(text, encoding='utf-8')
              os.chmod(tmp, p.stat().st_mode)
              os.replace(tmp, p)
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          print('custom_main_compile_ok=true')
          PY
          chown --reference="$BACKUP/__main__.py.pre" "$ROOT/learnerbot/__main__.py"

          SINCE="$(date '+%Y-%m-%d %H:%M:%S')"
          BEFORE_RESTARTS="$(systemctl show learnerbot-learn.service -p NRestarts --value 2>/dev/null || echo 0)"
          systemctl restart learnerbot-learn.service
          sleep 6
          test "$(systemctl is-active learnerbot-learn.service)" = active
          PID1="$(systemctl show learnerbot-learn.service -p MainPID --value)"
          R1="$(systemctl show learnerbot-learn.service -p NRestarts --value)"
          test "$PID1" != 0
          sleep 18
          test "$(systemctl is-active learnerbot-learn.service)" = active
          PID2="$(systemctl show learnerbot-learn.service -p MainPID --value)"
          R2="$(systemctl show learnerbot-learn.service -p NRestarts --value)"
          test "$PID1" = "$PID2"
          test "$R1" = "$R2"

          LOG="$TMP/postrestart.log"
          journalctl -u learnerbot-learn.service --since "$SINCE" --no-pager > "$LOG" 2>/dev/null || true
          grep -F '[learner-reject-once]' "$LOG"
          grep -F '[silearn-lp-warning-only]' "$LOG"

          # Pure evaluator regression checks only; no quote, signing or broadcast.
          cd "$ROOT"
          PYTHONPATH="$ROOT" python3 - <<'PY'
          from learnerbot import solana_lp_warning_only_patch as w
          cfg={'live_pool_rugcheck_hard_score':'70','live_pool_min_lp_locked_pct':'50'}
          lp={
              'score_normalised':0,
              'lpLockedPct':0,
              'risks':[{'name':'Large Amount of LP Unlocked','level':'danger','value':'100.00%','description':'LP tokens are unlocked'}],
          }
          r=w.evaluate_rugcheck_lp_warning_only(lp,cfg)
          print('synthetic_lp_decision='+str(r.get('decision'))+' code='+str(r.get('reason_code')))
          assert r.get('decision') == 'PASS'
          assert r.get('reason_code') == 'LP_WARNING_ONLY'
          structural={
              'score_normalised':0,
              'lpLockedPct':100,
              'risks':[{'name':'Freeze Authority','level':'danger','description':'freeze authority enabled'}],
          }
          s=w.evaluate_rugcheck_lp_warning_only(structural,cfg)
          print('synthetic_structural_decision='+str(s.get('decision'))+' code='+str(s.get('reason_code')))
          assert s.get('decision') == 'HARD_BLOCK'
          PY

          echo "deploy_source_sha=$TARGET_SHA"
          echo "service=active pid=$PID2 restarts=$R2 prior_restarts=$BEFORE_RESTARTS"
          echo "backup=$BACKUP"
          echo 'DEPLOY_VERIFIED=true'
          trap - EXIT
          rm -rf "$TMP"
