name: SiLearn LP warning-only CI

on:
  push:
    branches:
      - 'ops/SiLearn-2026-08-29T1328BST-lp-warning-only'
    paths:
      - 'learnerbot/solana_lp_warning_only_patch.py'
      - 'learnerbot/solana_owner_changeset_4_integrity_patch.py'
      - 'tests/test_solana_lp_warning_only_patch.py'
      - '.github/workflows/silearn-lp-warning-only-ci.yml'
  pull_request:
    paths:
      - 'learnerbot/solana_lp_warning_only_patch.py'
      - 'learnerbot/solana_owner_changeset_4_integrity_patch.py'
      - 'tests/test_solana_lp_warning_only_patch.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests python-dotenv
      - name: Compile changed policy modules
        run: |
          python -m py_compile \
            learnerbot/solana_lp_warning_only_patch.py \
            learnerbot/solana_owner_changeset_4_integrity_patch.py
      - name: Run focused LP warning-only regressions
        run: python -m pytest -q tests/test_solana_lp_warning_only_patch.py
