name: SiLearn position alert route deploy

on:
  push:
    branches:
      - 'ops/SiLearn-2026-08-29T1816BST-position-alert-route'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 8
    steps:
      - name: Deploy clickable Leader wallet link
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n true
          ROOT=/home/ayman01323/BOOT/testingbots/learn
          SOURCE_SHA=7d4765c3c6ec6a3cc4d72ca3b0025032a85d947e
          STAMP=20260829T1826BST
          BACKUP="$ROOT/private/change-control/${STAMP}-silearn-clickable-leader"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          echo 'SiLearn — 2026-08-29 18:26 BST — Subject: Make position Leader wallet clickable'
          test "$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)" = active

          sudo -n mkdir -p "$BACKUP"
          sudo -n cp -a "$ROOT/learnerbot/__main__.py" "$BACKUP/__main__.py.pre"
          sudo -n cp -a "$ROOT/learnerbot/telegram_silearn_position_updates_patch.py" "$BACKUP/telegram_silearn_position_updates_patch.py.pre"
          printf '%s\n' "$SOURCE_SHA" | sudo -n tee "$BACKUP/source_sha.txt" >/dev/null
          printf '%s\n' 'SiLearn — 2026-08-29 18:26 BST — Subject: Make position Leader wallet clickable' | sudo -n tee "$BACKUP/subject.txt" >/dev/null

          curl -fsSL "https://raw.githubusercontent.com/ayman01323/boot-trading-bot/$SOURCE_SHA/learnerbot/telegram_silearn_position_updates_patch.py" -o "$TMP/patch.py"
          grep -Fq 'https://solscan.io/account/' "$TMP/patch.py"
          grep -Fq 'leader_link=true' "$TMP/patch.py"
          grep -Fq 'www.dexview.com/solana/' "$TMP/patch.py"
          TMP="$TMP" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['TMP'])/'patch.py'
          compile(p.read_text(encoding='utf-8'),str(p),'exec')
          print('patch_compile_ok=true')
          PY

          rollback() {
            echo 'ROLLBACK_START'
            sudo -n cp -a "$BACKUP/__main__.py.pre" "$ROOT/learnerbot/__main__.py"
            sudo -n cp -a "$BACKUP/telegram_silearn_position_updates_patch.py.pre" "$ROOT/learnerbot/telegram_silearn_position_updates_patch.py"
            sudo -n systemctl restart learnerbot-learn.service || true
            sleep 5
            echo "rollback_service=$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)"
          }
          trap 'rc=$?; if test $rc -ne 0; then rollback; fi; rm -rf "$TMP"; exit $rc' EXIT

          MODE="$(stat -c %a "$ROOT/learnerbot/telegram_silearn_position_updates_patch.py")"
          sudo -n install -m "$MODE" "$TMP/patch.py" "$ROOT/learnerbot/telegram_silearn_position_updates_patch.py"
          sudo -n chown --reference="$BACKUP/telegram_silearn_position_updates_patch.py.pre" "$ROOT/learnerbot/telegram_silearn_position_updates_patch.py"

          SINCE="$(date '+%Y-%m-%d %H:%M:%S')"
          sudo -n systemctl restart learnerbot-learn.service
          sleep 8
          test "$(systemctl is-active learnerbot-learn.service)" = active
          PID1="$(systemctl show learnerbot-learn.service -p MainPID --value)"
          R1="$(systemctl show learnerbot-learn.service -p NRestarts --value)"
          test "$PID1" != 0
          sleep 18
          test "$(systemctl is-active learnerbot-learn.service)" = active
          PID2="$(systemctl show learnerbot-learn.service -p MainPID --value)"
          R2="$(systemctl show learnerbot-learn.service -p NRestarts --value)"
          test "$PID1" = "$PID2"
          test "$R1" = "$R2"

          LOG="$TMP/postrestart.log"
          journalctl -u learnerbot-learn.service --since "$SINCE" --no-pager > "$LOG" 2>/dev/null || true
          grep -F '[silearn-position-update] bot=SiLearn' "$LOG"
          grep -F 'leader_link=true' "$LOG"
          grep -F 'dexview=true' "$LOG"

          echo "service=active pid=$PID2 restarts=$R2"
          echo "backup=$BACKUP"
          echo 'CLICKABLE_LEADER_DEPLOY_VERIFIED=true'
          trap - EXIT
          rm -rf "$TMP"
