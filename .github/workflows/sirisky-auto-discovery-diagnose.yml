name: SiRisky Auto Discovery Diagnose

on:
  push:
    paths:
      - '.github/workflows/sirisky-auto-discovery-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Host and target
        shell: bash
        run: |
          echo '=== HOST ==='
          hostname
          echo '=== SUDO ==='
          sudo -n true
          echo '=== TARGET ==='
          sudo -n ls -ld /root/SiRisky
          sudo -n ls -l /root/SiRisky/run.py
      - name: Current auto-discovery files
        shell: bash
        continue-on-error: true
        run: |
          echo '=== STAGE1 MARKERS ==='
          sudo -n grep -nE 'GECKO_NEW_POOLS|def discover|stage1_candidates' /root/SiRisky/sirisky/stage1_data.py || true
          echo '=== ENGINE MARKERS ==='
          sudo -n grep -nE 'discover_if_due|AUTO_CANDIDATES_READY' /root/SiRisky/sirisky/engine.py || true
          echo '=== RUNTIME ==='
          sudo -n cat /root/SiRisky/CSV/runtime.csv
          echo '=== CANDIDATES ==='
          sudo -n ls -l /root/SiRisky/CSV/stage1_candidates.csv || true
          sudo -n head -n 8 /root/SiRisky/CSV/stage1_candidates.csv || true
      - name: Compile and discovery
        shell: bash
        continue-on-error: true
        run: |
          cd /root/SiRisky
          echo '=== COMPILE ==='
          sudo -n .venv/bin/python -m py_compile sirisky/stage1_data.py sirisky/engine.py
          echo 'compile_ok=true'
          echo '=== IMPORT ==='
          sudo -n env PYTHONPATH=. .venv/bin/python -c 'from sirisky.config import Settings; from sirisky.stage1_data import Stage1Data; s=Settings.load(); print("candidate_path="+str(Stage1Data(s).candidate_path))'
          echo '=== FORCED DISCOVERY ==='
          sudo -n env PYTHONPATH=. .venv/bin/python -c 'from sirisky.config import Settings; from sirisky.stage1_data import Stage1Data; print(Stage1Data(Settings.load()).discover(force=True))'
          echo '=== CANDIDATES AFTER ==='
          sudo -n head -n 8 CSV/stage1_candidates.csv || true
      - name: Service and safety
        shell: bash
        run: |
          echo '=== SERVICE ==='
          systemctl show sirisky.service -p ActiveState -p SubState -p Result -p WorkingDirectory --no-pager
          echo '=== SAFETY GATES ==='
          sudo -n awk -F, 'NR==1 || $1 ~ /^(live_enabled|broadcast_enabled|telegram_manual_run_enabled|auto_discovery_enabled|auto_promote_to_selected)$/' /root/SiRisky/CSV/runtime.csv
          echo 'real_transaction_broadcast=NO'
