name: SiRisky Issue 726 Jupiter AST Inspect

on:
  push:
    paths:
      - '.github/workflows/sirisky-auto-discovery-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Read-only Jupiter source AST
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          sudo -n python3 - <<'PY'
          import ast, hashlib
          from pathlib import Path
          p=Path('/root/SiRisky/sirisky/jupiter.py')
          raw=p.read_bytes(); text=raw.decode('utf-8'); tree=ast.parse(text)
          print('file_sha256='+hashlib.sha256(raw).hexdigest())
          print('===JUPITER_AST_SOURCE===')
          print(ast.unparse(tree))
          print('===END_JUPITER_AST_SOURCE===')
          print('runtime_changed=false')
          print('service_restarted=false')
          print('transaction_broadcast=false')
          PY
