name: SiRisky Auto Discovery Inspect

on:
  push:
    paths:
      - '.github/workflows/sirisky-auto-discovery-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Inspect current SiRisky Stage 1 integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          sudo -n true
          for f in stage1_data.py stage2_strategy.py stage3_risk.py stage5_trade.py engine.py models.py config.py jupiter.py; do
            echo "=== $f ==="
            sudo -n sed -n '1,380p' "/root/SiRisky/sirisky/$f"
          done
          echo '=== run.py ==='
          sudo -n sed -n '1,420p' /root/SiRisky/run.py
          echo '=== runtime.csv ==='
          sudo -n cat /root/SiRisky/CSV/runtime.csv
          echo '=== stage1_selected_pools.csv ==='
          sudo -n cat /root/SiRisky/CSV/stage1_selected_pools.csv
