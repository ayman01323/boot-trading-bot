name: SiRisky Automatic Shadow Engine

on:
  push:
    paths:
      - 'SiRisky/overrides/run.py'
      - 'SiRisky/overrides/sirisky/engine.py'
      - 'SiRisky/overrides/sirisky/stage1_data.py'
      - 'SiRisky/overrides/sirisky/stage3_risk.py'
      - 'SiRisky/overrides/sirisky/stage5_trade.py'
      - '.github/workflows/sirisky-auto-shadow-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy through restricted SiRisky root wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          if [[ ! -x /usr/local/sbin/sirisky-shadow-deploy ]]; then
            echo 'ERROR: restricted SiRisky sudo wrapper is not installed.' >&2
            echo 'Run the one-time scripts/install_sirisky_github_ops.sh bootstrap as root on botgoogle.' >&2
            exit 2
          fi
          sudo -n /usr/local/sbin/sirisky-shadow-deploy "$GITHUB_SHA"
