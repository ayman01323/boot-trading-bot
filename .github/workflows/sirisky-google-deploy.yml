name: SiRisky Google Deploy

on:
  push:
    branches: [main]
    paths:
      - 'SiRisky/bundle_parts/**'
      - 'SiRisky/source_manifest.json'
      - '.github/workflows/sirisky-google-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirisky-google-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 30
    env:
      TARGET: /root/SiRisky
      SOURCE_ROOT: /root/multichain-learning-bot-v2.2-fast-direct-market
      SAFE_REPORT: /tmp/sirisky-deploy-safe.txt
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify new Google server root boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'
          sudo -n true
          test "$TARGET" = '/root/SiRisky'
          test "$SOURCE_ROOT" = '/root/multichain-learning-bot-v2.2-fast-direct-market'
          : > "$SAFE_REPORT"
          echo 'runner_boundary=PASS' >> "$SAFE_REPORT"
          echo 'root_target=/root/SiRisky' >> "$SAFE_REPORT"

      - name: Reconstruct and install self-contained SiRisky
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="$GITHUB_WORKSPACE/SiRisky/bundle_parts"
          STAGE_ROOT="/tmp/SiRisky.deploy.${GITHUB_RUN_ID}"
          rm -rf "$STAGE_ROOT"
          mkdir -p "$STAGE_ROOT"
          cat "$BUNDLE_DIR"/part*.b64 | base64 -d > "$STAGE_ROOT/SiRisky.zip"
          python3 - "$STAGE_ROOT/SiRisky.zip" "$STAGE_ROOT" <<'PY'
          import sys, zipfile
          from pathlib import Path
          z=Path(sys.argv[1]); dest=Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(z) as f:
              for info in f.infolist():
                  target=(dest/info.filename).resolve()
                  if not str(target).startswith(str(dest) + '/'):
                      raise SystemExit('Unsafe archive path')
              f.extractall(dest)
          PY
          STAGE="$STAGE_ROOT/SiRisky"
          test -f "$STAGE/run.py"

          # Preserve only SiRisky's own state on upgrades.
          if sudo test -d "$TARGET"; then
            sudo test -f "$TARGET/.env" && sudo cp -a "$TARGET/.env" "$STAGE/.env" || true
            sudo test -d "$TARGET/data" && { rm -rf "$STAGE/data"; sudo cp -a "$TARGET/data" "$STAGE/data"; sudo chown -R "$(id -u):$(id -g)" "$STAGE/data"; } || true
            sudo test -d "$TARGET/logs" && { rm -rf "$STAGE/logs"; sudo cp -a "$TARGET/logs" "$STAGE/logs"; sudo chown -R "$(id -u):$(id -g)" "$STAGE/logs"; } || true
            if sudo test -d "$TARGET/CSV"; then
              sudo cp -a "$TARGET/CSV/." "$STAGE/CSV/"
              sudo chown -R "$(id -u):$(id -g)" "$STAGE/CSV"
            fi
          fi
          mkdir -p "$STAGE/data" "$STAGE/logs" "$STAGE/CSV"

          # Correct the packaged service/docs to the authoritative new-server path.
          cat > "$STAGE/systemd/sirisky.service" <<'EOF'
          [Unit]
          Description=SiRisky standalone staged trading bot
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/root/SiRisky
          ExecStart=/root/SiRisky/.venv/bin/python /root/SiRisky/run.py start
          Restart=on-failure
          RestartSec=5
          Environment=PYTHONUNBUFFERED=1
          UMask=0077

          [Install]
          WantedBy=multi-user.target
          EOF
          sed -i 's#/home/ayman01323/ClaudeServer/SiRisky#/root/SiRisky#g' "$STAGE/README.md" "$STAGE/DEPLOYMENT.md" 2>/dev/null || true

          sudo rm -rf "${TARGET}.previous"
          if sudo test -d "$TARGET"; then sudo mv "$TARGET" "${TARGET}.previous"; fi
          sudo mv "$STAGE" "$TARGET"
          sudo chown -R root:root "$TARGET"
          sudo chmod 700 "$TARGET" "$TARGET/data" "$TARGET/logs"
          rm -rf "$STAGE_ROOT"
          echo 'files_staged=PASS' >> "$SAFE_REPORT"

      - name: Bootstrap standalone env from existing production format
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - "$TARGET" "$SOURCE_ROOT" <<'PY'
          import os, sys
          from pathlib import Path
          root=Path(sys.argv[1]); source=Path(sys.argv[2]); dst=root/'.env'
          if dst.exists():
              os.chmod(dst,0o600); raise SystemExit(0)
          candidates=[source/'.env', Path('/var/tmp/ai_council_runtime.env'), Path('/var/tmp/boot/ai_council_runtime.env')]
          wanted={
              'TELEGRAM_BOT_TOKEN':'TELEGRAM_BOT_TOKEN',
              'TELEGRAM_CHAT_IDS':'TELEGRAM_CHAT_IDS',
              'TELEGRAM_CHAT_ID':'TELEGRAM_CHAT_IDS',
              'AUTHORISED_CHAINS':'AUTHORISED_CHAINS',
              'SOLANA_RPC_URL':'SOLANA_RPC_URL',
              'SOLANA_WS_URL':'SOLANA_WS_URL',
              'JUPITER_API_KEY':'JUPITER_API_KEY',
              'MAX_CAPITAL_USD':'MAX_CAPITAL_USD',
              'MAX_POSITION_USD':'MAX_POSITION_USD',
              'MAX_TOTAL_EXPOSURE_USD':'MAX_TOTAL_EXPOSURE_USD',
              'MAX_OPEN_POSITIONS':'MAX_OPEN_POSITIONS',
              'MAX_DAILY_LOSS_USD':'MAX_DAILY_LOSS_USD',
              'MAX_DRAWDOWN_PCT':'MAX_DRAWDOWN_PCT',
              'SIRISKY_WALLET_OWNER_ID':'SIRISKY_WALLET_OWNER_ID',
              'CLAUDE_BOT_WALLET_OWNER_ID':'SIRISKY_WALLET_OWNER_ID',
          }
          vals={}
          for src in candidates:
              if not src.is_file(): continue
              for raw in src.read_text(encoding='utf-8',errors='replace').splitlines():
                  line=raw.strip()
                  if not line or line.startswith('#') or '=' not in line: continue
                  k,v=line.split('=',1); k=k.strip()
                  target=wanted.get(k)
                  if target and v.strip() and target not in vals: vals[target]=v.strip()
          if not vals.get('SIRISKY_WALLET_OWNER_ID') and vals.get('TELEGRAM_CHAT_IDS'):
              vals['SIRISKY_WALLET_OWNER_ID']=vals['TELEGRAM_CHAT_IDS'].split(',')[0].strip()
          vals['CSV_DIR']=str(root/'CSV')
          vals['DATA_DIR']=str(root/'data')
          vals['LOG_DIR']=str(root/'logs')
          vals.setdefault('AUTHORISED_CHAINS','solana')
          dst.write_text('\n'.join(f'{k}={v}' for k,v in vals.items())+'\n',encoding='utf-8')
          os.chmod(dst,0o600)
          PY
          echo 'env_bootstrap=PASS' >> "$SAFE_REPORT"

      - name: Bootstrap one encrypted Solana wallet without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - "$TARGET" "$SOURCE_ROOT" <<'PY'
          import csv, os, shutil, sys
          from pathlib import Path
          root=Path(sys.argv[1]); source=Path(sys.argv[2])
          env={}
          for raw in (root/'.env').read_text(encoding='utf-8',errors='replace').splitlines():
              if '=' in raw and not raw.lstrip().startswith('#'):
                  k,v=raw.split('=',1); env[k.strip()]=v.strip()
          owner=env.get('SIRISKY_WALLET_OWNER_ID','')
          if not owner: raise SystemExit(0)
          target_csv=root/'CSV'/'wallets.csv'
          if target_csv.exists():
              with target_csv.open(encoding='utf-8-sig',newline='') as f: current=list(csv.DictReader(f))
              if any(str(r.get('telegram_id','')).strip()==owner and str(r.get('signing','')).lower()=='true' for r in current): raise SystemExit(0)
          source_csv=source/'CSVbot'/'auto'/'solana_user_wallets.csv'
          source_key=source/'data'/'.solana_wallet_store.key'
          source_owner=source/'data'/'user_solana_wallets'/owner
          if not (source_csv.exists() and source_key.exists() and source_owner.is_dir()): raise SystemExit(0)
          with source_csv.open(encoding='utf-8-sig',newline='') as f:
              rows=[r for r in csv.DictReader(f) if str(r.get('telegram_id','')).strip()==owner and str(r.get('enabled','true')).lower() in {'1','true','yes','on'}]
          active=next((r for r in rows if str(r.get('active','')).lower()=='true' and str(r.get('signing','')).lower()=='true'),None)
          if active is None: active=next((r for r in rows if str(r.get('signing','')).lower()=='true'),None)
          if active is None: raise SystemExit(0)
          headers=['telegram_id','wallet_id','label','address','signing','enabled','active','created_epoch','notes']
          target_csv.parent.mkdir(parents=True,exist_ok=True)
          with target_csv.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=headers); w.writeheader(); w.writerow({h:active.get(h,'') for h in headers})
          shutil.copy2(source_key,root/'data'/'.solana_wallet_store.key')
          dest=root/'data'/'user_solana_wallets'/owner
          dest.parent.mkdir(parents=True,exist_ok=True); shutil.copytree(source_owner,dest,dirs_exist_ok=True)
          os.chmod(root/'data'/'.solana_wallet_store.key',0o600)
          for p in dest.glob('*.enc.json'): os.chmod(p,0o600)
          PY
          echo 'wallet_bootstrap_attempted=PASS' >> "$SAFE_REPORT"

      - name: Install dependencies and test on new Google server
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "$TARGET/.venv"
          sudo python3 -m venv "$TARGET/.venv"
          sudo "$TARGET/.venv/bin/python" -m pip install --quiet --disable-pip-version-check -r "$TARGET/requirements.txt"
          sudo "$TARGET/.venv/bin/python" -m compileall -q "$TARGET"
          sudo env PYTHONPATH="$TARGET" "$TARGET/.venv/bin/python" "$TARGET/run.py" selftest
          echo 'selftest=PASS' >> "$SAFE_REPORT"

      - name: Force safe CSV state before any service start
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - "$TARGET/CSV/runtime.csv" <<'PY'
          import csv, sys
          from pathlib import Path
          p=Path(sys.argv[1]); rows=list(csv.DictReader(p.open(encoding='utf-8-sig',newline='')))
          for r in rows:
              if r.get('setting') in {'live_enabled','broadcast_enabled','telegram_manual_run_enabled'}: r['value']='0'
          headers=['setting','value','notes']
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=headers); w.writeheader(); w.writerows(rows)
          PY
          echo 'live_enabled=false' >> "$SAFE_REPORT"
          echo 'broadcast_enabled=false' >> "$SAFE_REPORT"

      - name: Run safe RPC Jupiter Telegram wallet preflight
        shell: bash
        run: |
          set -euo pipefail
          set +e
          sudo env PYTHONPATH="$TARGET" "$TARGET/.venv/bin/python" "$TARGET/run.py" check > /tmp/sirisky-check-safe.txt 2>&1
          rc=$?
          set -e
          echo "preflight_exit_code=$rc" >> "$SAFE_REPORT"
          cat /tmp/sirisky-check-safe.txt >> "$SAFE_REPORT"

      - name: Install and start SiRisky system service SAFE-OFF
        shell: bash
        run: |
          set -euo pipefail
          sudo cp "$TARGET/systemd/sirisky.service" /etc/systemd/system/sirisky.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now sirisky.service
          sleep 3
          if sudo systemctl is-active --quiet sirisky.service; then
            echo 'service_active=PASS' >> "$SAFE_REPORT"
          else
            echo 'service_active=FAIL' >> "$SAFE_REPORT"
            sudo systemctl --no-pager --full status sirisky.service || true
            exit 1
          fi

      - name: Publish safe deployment summary
        if: always()
        shell: bash
        run: |
          echo '--- SiRisky safe deployment report ---'
          cat "$SAFE_REPORT" 2>/dev/null || true
          echo 'target=/root/SiRisky'
          echo 'LIVE=OFF; BROADCAST=OFF; no real transaction authorised.'
          rm -f /tmp/sirisky-check-safe.txt "$SAFE_REPORT"
