name: SiRisky Google Live Activity Read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-google-live-activity-read-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Read SiRisky runtime and recent decisions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          sudo -n bash -lc '
            set -Eeuo pipefail
            cd /root/SiRisky
            echo "=== STATE ==="
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
            echo "service=$(systemctl is-active sirisky.service || true)"
            PYTHONPATH=. .venv/bin/python - <<"PY"
from sirisky.config import Settings
from sirisky.safety_v2 import entry_sol
s=Settings.load(); rt=s.runtime()
for k in ["trading_mode","live_enabled","broadcast_enabled","manual_approval_enabled","auto_probe_sol","auto_entry_min_sol","auto_entry_max_sol","auto_evaluate_candidate_limit","jupiter_min_interval_seconds"]:
    print(f"{k}={rt.get(k)}")
print(f"entry_sol={entry_sol(s):.9f}")
PY
            echo "=== OPEN LIVE ==="
            PYTHONPATH=. .venv/bin/python - <<"PY"
import csv
from pathlib import Path
p=Path("CSV/open_positions.csv"); rows=[]
if p.exists():
    with p.open(encoding="utf-8-sig",newline="") as f: rows=list(csv.DictReader(f))
live=[r for r in rows if str(r.get("status") or "").upper()=="OPEN" and str(r.get("mode") or "").upper()=="LIVE"]
print("open_live="+str(len(live)))
PY
            echo "=== RECENT DECISIONS ==="
            journalctl -u sirisky.service --since "10 minutes ago" --no-pager -o cat 2>/dev/null \
              | grep -Ei "candidate|NO_TRIGGER|QUOTE_REJECT|HTTPError|stage[0-9]|OPENED|CLOSED|BUY|SELL|JUPITER|fee|risk|reject|discover|opportun" \
              | tail -n 500 || true
            echo "=== TAIL ==="
            journalctl -u sirisky.service -n 100 --no-pager -o cat 2>/dev/null || true
          '
