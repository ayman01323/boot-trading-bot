name: SiRisky Google Live Activity Read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-google-live-activity-read-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe SiRisky shadow restore once
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n bash scripts/restore_sirisky_1240_shadow_15pct_0090.sh
