name: SiRisky Google Live Activity Read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-google-live-activity-read-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Read SiRisky state and trade evidence only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          sudo -n bash -lc '
            set -Eeuo pipefail
            cd /root/SiRisky
            echo "=== STATE ==="
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
            echo "service=$(systemctl is-active sirisky.service || true)"
            echo "=== RUNTIME ==="
            grep -E "^(trading_mode|live_enabled|broadcast_enabled|paper_auto_trade_enabled|poll_seconds|auto_probe_sol|auto_entry_min_sol|auto_entry_max_sol|auto_evaluate_candidate_limit|manual_approval_enabled)," CSV/runtime.csv || true
            echo "=== ACTIVE STRATEGY ==="
            grep -E "^HR_NEW_01," CSV/stage2_strategy.csv || true
            echo "=== RISK ==="
            grep -E "^(max_open_positions|min_exit_health_pct|min_forecast_net_pct|max_round_trip_cost_pct|untouched_sol_reserve|fast_take_profit_floor_pct|fast_take_profit_cap_pct|fast_stop_net_pct|warm_reversal_pct|hot_reversal_pct|fast_max_hold_cap_seconds)," CSV/stage3_risk.csv || true
            echo "=== TRADE EVIDENCE ==="
            PYTHONPATH=. .venv/bin/python - <<"PY"
import csv
from pathlib import Path
root=Path("CSV")
interesting=[]
for p in sorted(root.glob("*.csv")):
    try:
        with p.open(encoding="utf-8-sig", newline="") as f:
            rows=list(csv.DictReader(f))
    except Exception:
        continue
    if not rows:
        continue
    cols=set(rows[0].keys())
    sigcols=[c for c in cols if c and "signature" in c.lower()]
    modecol="mode" if "mode" in cols else None
    if not sigcols and not modecol:
        continue
    for i,r in enumerate(rows, start=2):
        mode=str(r.get("mode") or "").upper()
        sigs={c:str(r.get(c) or "") for c in sigcols if str(r.get(c) or "").strip()}
        if mode=="LIVE" or sigs:
            interesting.append({
                "file":p.name,"line":i,"mode":mode,"status":str(r.get("status") or ""),
                "position_id":str(r.get("position_id") or ""),"action":str(r.get("action") or ""),
                "opened_epoch":str(r.get("opened_epoch") or ""),"closed_epoch":str(r.get("closed_epoch") or ""),
                "signatures":sigs,
            })
print(f"trade_evidence_rows={len(interesting)}")
for item in interesting[-20:]:
    print(item)
# Direct current open-position summary
p=root/"open_positions.csv"
rows=[]
if p.exists():
    with p.open(encoding="utf-8-sig", newline="") as f: rows=list(csv.DictReader(f))
print(f"open_position_rows={len(rows)}")
print(f"open_live_rows={sum(1 for r in rows if str(r.get('mode') or '').upper()=='LIVE')}")
PY
            echo "=== RECENT TRADE EVENTS ==="
            journalctl -u sirisky.service --since "24 hours ago" --no-pager -o cat 2>/dev/null \
              | grep -Ei "OPENED|CLOSED|BUY|SELL|broadcast|signature|JUPITER|EXECUTION_REJECT|WAITING_FOR_MANUAL_APPROVAL" \
              | tail -n 300 || true
          '
