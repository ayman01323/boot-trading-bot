name: SiRisky HR-CWH Governed LIVE Armed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-hrcwh-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirisky-hrcwh-governed-live-armed
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Check out approved main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify restricted governed-LIVE operation
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          WRAPPER=/root/SiRisky/ops/sirisky-governed-live-arm
          if [[ ! -x "$WRAPPER" ]]; then
            echo 'ERROR: restricted SiRisky governed-LIVE wrapper is not installed under the bot folder.' >&2
            echo 'Install it once as root with scripts/install_sirisky_governed_live_ops.sh.' >&2
            exit 2
          fi
          sudo -n -l "$WRAPPER" >/dev/null

      - name: Arm governed LIVE through bot-local restricted root wrapper
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /root/SiRisky/ops/sirisky-governed-live-arm "$GITHUB_SHA"

      - name: Successful deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## SiRisky governed LIVE state applied'
            echo
            echo '- Bot-local wrapper: /root/SiRisky/ops/sirisky-governed-live-arm'
            echo '- trading_mode: LIVE'
            echo '- live_enabled: 1'
            echo '- broadcast_enabled: 1'
            echo '- Automatic discovery/evaluation: ON'
            echo '- Manual approval gate: ON'
            echo '- External signature: REQUIRED'
            echo '- Telegram direct real-money execution: OFF'
            echo '- Service restart and active-state assertion: PASSED'
            echo
            echo '> This is approval-gated LIVE readiness. It does not bypass the external-signature requirement.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failed deployment summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## SiRisky governed LIVE state NOT applied'
            echo
            echo '- Do not treat this workflow run as proof that LIVE/broadcast is enabled.'
            echo '- Inspect the failed step before changing trading state.'
          } >> "$GITHUB_STEP_SUMMARY"
