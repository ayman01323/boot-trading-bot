name: SiRisky HR-CWH Governed LIVE Armed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-hrcwh-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirisky-hrcwh-governed-live-armed
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Verify Google runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          sudo -n true

      - name: Check out approved main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Arm governed LIVE mode with rollback
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/root/SiRisky
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$ROOT/data/live-armed-runtime-backup-$TS.csv"
          sudo -n cp -a "$ROOT/CSV/runtime.csv" "$BACKUP"

          rollback() {
            rc=$?
            if [[ $rc -ne 0 ]]; then
              echo "LIVE arm failed; restoring runtime" >&2
              sudo -n cp -a "$BACKUP" "$ROOT/CSV/runtime.csv"
              sudo -n systemctl restart sirisky.service || true
            fi
            exit $rc
          }
          trap rollback EXIT

          sudo -n env ROOT="$ROOT" python3 - <<'PY'
          import csv, os
          from pathlib import Path

          root=Path(os.environ['ROOT'])
          p=root/'CSV'/'runtime.csv'
          with p.open(newline='',encoding='utf-8') as fh:
              rows=list(csv.DictReader(fh))
          by={str(r.get('setting') or ''):r for r in rows}
          wanted={
              'live_enabled':'1',
              'broadcast_enabled':'1',
              'auto_discovery_enabled':'1',
              'auto_promote_to_selected':'1',
              'manual_approval_enabled':'1',
              'armed_manual_approval':'1',
              'manual_approval_require_external_signature':'1',
              'poll_seconds':'5',
          }
          for key,value in wanted.items():
              if key in by:
                  by[key]['value']=value
              else:
                  row={'setting':key,'value':value,'notes':'HR-CWH governed LIVE armed'}
                  rows.append(row); by[key]=row
          tmp=p.with_suffix('.csv.tmp')
          with tmp.open('w',newline='',encoding='utf-8') as fh:
              w=csv.DictWriter(fh,fieldnames=['setting','value','notes'])
              w.writeheader(); w.writerows(rows)
          tmp.replace(p)
          PY

          sudo -n bash -lc "cd '$ROOT' && PYTHONPATH=. .venv/bin/python -m compileall -q sirisky"
          sudo -n bash -lc "cd '$ROOT' && PYTHONPATH=. .venv/bin/python run.py selftest"

          sudo -n grep -q '^live_enabled,1,' "$ROOT/CSV/runtime.csv"
          sudo -n grep -q '^broadcast_enabled,1,' "$ROOT/CSV/runtime.csv"
          sudo -n grep -q '^manual_approval_enabled,1,' "$ROOT/CSV/runtime.csv"
          sudo -n grep -q '^armed_manual_approval,1,' "$ROOT/CSV/runtime.csv"
          sudo -n grep -q '^manual_approval_require_external_signature,1,' "$ROOT/CSV/runtime.csv"

          sudo -n systemctl restart sirisky.service
          sleep 3
          sudo -n systemctl is-active --quiet sirisky.service

          echo '=== GOVERNED LIVE ARMED FLAGS ==='
          sudo -n awk -F, 'NR==1 || $1 ~ /^(live_enabled|broadcast_enabled|manual_approval_enabled|armed_manual_approval|manual_approval_require_external_signature|auto_discovery_enabled|auto_promote_to_selected|poll_seconds)$/' "$ROOT/CSV/runtime.csv"
          echo "rollback_snapshot=$BACKUP"
          echo 'governed_live_armed=YES'
          echo 'manual_external_signature=REQUIRED'

          trap - EXIT

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## SiRisky HR-CWH governed LIVE armed'
            echo
            echo '- LIVE mode: ON'
            echo '- Broadcast path: ARMED'
            echo '- Automatic discovery/evaluation: ON'
            echo '- Manual approval gate: ON'
            echo '- External signature: REQUIRED'
            echo '- HR-CWH hard risk controls remain unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
