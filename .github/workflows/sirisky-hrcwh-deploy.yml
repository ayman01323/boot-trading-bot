name: SiRisky Governed LIVE Auto Execution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-hrcwh-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirisky-governed-live-auto
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    steps:
      - name: Check out approved main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify restricted governed-LIVE operation
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          WRAPPER=/root/SiRisky/ops/sirisky-governed-live-arm
          # The runner cannot stat paths below /root directly. Verify the exact
          # sudo grant instead of using a non-root test -x visibility check.
          sudo -n -l "$WRAPPER" >/dev/null

      - name: Arm governed LIVE automatic execution and verify state
        shell: bash
        run: |
          set -euo pipefail
          output="$(sudo -n /root/SiRisky/ops/sirisky-governed-live-arm "$GITHUB_SHA")"
          printf '%s\n' "$output"
          grep -qx 'trading_mode=LIVE' <<<"$output"
          grep -qx 'live_enabled=1' <<<"$output"
          grep -qx 'broadcast_enabled=1' <<<"$output"
          grep -qx 'manual_approval_enabled=0' <<<"$output"
          grep -qx 'manual_approval_require_external_signature=0' <<<"$output"
          grep -qx 'telegram_manual_run_enabled=0' <<<"$output"

      - name: Successful deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## SiRisky governed LIVE automatic state applied'
            echo
            echo '- Bot-local wrapper: /root/SiRisky/ops/sirisky-governed-live-arm'
            echo '- trading_mode: LIVE'
            echo '- live_enabled: 1'
            echo '- broadcast_enabled: 1'
            echo '- Automatic discovery/evaluation: ON'
            echo '- Manual approval gate: OFF'
            echo '- External signature requirement: OFF'
            echo '- Stage-3-approved orders: flow directly to Stage 5'
            echo '- Telegram direct real-money execution: OFF'
            echo '- Existing strategy/risk gates: RETAINED'
            echo '- Service restart and active-state assertion: PASSED'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failed deployment summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## SiRisky governed LIVE automatic state NOT applied'
            echo
            echo '- The server wrapper may still be an older manual-approval version.'
            echo '- Reinstall scripts/install_sirisky_governed_live_ops.sh once as root, then rerun this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

