name: SiRisky Live Activity Diagnostic Google Only

on:
  push:
    branches: [ops/google-master-menu-cutover-20260827]
    paths:
      - '.github/workflows/sirisky-live-diagnostic-20260828-1716.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Inspect current SiRisky activity on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          sudo -n bash -lc '
            set -Eeuo pipefail
            cd /root/SiRisky
            echo "=== NOW ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "host=$(hostname)"
            echo "service=$(systemctl is-active sirisky.service || true)"
            echo "=== RUNTIME KEYS ==="
            PYTHONPATH=. .venv/bin/python - <<"PY"
import csv
from pathlib import Path
p=Path("CSV/runtime.csv")
keys={
"trading_mode","live_enabled","broadcast_enabled","manual_approval_enabled",
"auto_probe_sol","auto_entry_min_sol","auto_entry_max_sol","auto_evaluate_candidate_limit",
"single_position_only","single_cycle_only","jupiter_min_interval_seconds",
"min_forecast_net_pct","max_round_trip_cost_pct","min_exit_health_pct"
}
if p.exists():
    with p.open(encoding="utf-8-sig",newline="") as f:
        rd=csv.DictReader(f); fields=rd.fieldnames or []
        k="key" if "key" in fields else fields[0]; v="value" if "value" in fields else fields[1]
        vals={str(r.get(k) or ""):str(r.get(v) or "") for r in rd}
    for key in sorted(keys):
        if key in vals: print(f"{key}={vals[key]}")
PY
            echo "=== OPEN POSITIONS ==="
            PYTHONPATH=. .venv/bin/python - <<"PY"
import csv
from pathlib import Path
p=Path("CSV/open_positions.csv")
rows=[]
if p.exists():
    with p.open(encoding="utf-8-sig",newline="") as f:
        rows=list(csv.DictReader(f))
live=[r for r in rows if str(r.get("status") or "").upper()=="OPEN" and str(r.get("mode") or "").upper()=="LIVE"]
print("open_live="+str(len(live)))
for r in live:
    print("position_id="+str(r.get("position_id") or "")+" mint="+str(r.get("mint") or r.get("token_mint") or ""))
PY
            echo "=== RECENT ACTIVITY (20 MIN) ==="
            journalctl -u sirisky.service --since "20 minutes ago" --no-pager -o cat 2>/dev/null \
              | grep -Ei "discover|candidate|NO_TRIGGER|QUOTE_REJECT|HTTPError|stage[0-9]|OPENED|CLOSED|BUY|SELL|JUPITER|fee|risk|reject|pool|opportun|armed|LIVE" \
              | tail -n 400 || true
            echo "=== JOURNAL TAIL ==="
            journalctl -u sirisky.service -n 80 --no-pager -o cat 2>/dev/null || true
          '
