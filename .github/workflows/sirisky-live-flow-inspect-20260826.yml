name: SiRisky Live Flow Inspect 20260826

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-live-flow-inspect-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Locate prior Learner Telegram credential safely
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          echo "service=$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)"
          echo "source_sha=$(cat "$target/RESTORED_SOURCE_SHA.txt" 2>/dev/null || echo unknown)"
          sudo -n bash -lc '
            set -Eeuo pipefail
            target=/home/ayman01323/BOOT/testingbots/learn
            marker="$target/private/.telegram_source_path"
            rm -f "$marker"
            mkdir -p "$target/private"
            count=0
            in_backups=false
            in_tree=false
            in_sirisky=false
            in_vartmp=false
            chosen=""
            while IFS= read -r f; do
              if grep -q "^TELEGRAM_BOT_TOKEN=." "$f" 2>/dev/null; then
                count=$((count+1))
                case "$f" in
                  "$target"/backups/*) in_backups=true; [[ -n "$chosen" ]] || chosen="$f" ;;
                  "$target"/*) in_tree=true; [[ -n "$chosen" ]] || chosen="$f" ;;
                  /root/SiRisky/*) in_sirisky=true; [[ -n "$chosen" ]] || chosen="$f" ;;
                  /var/tmp/*) in_vartmp=true; [[ -n "$chosen" ]] || chosen="$f" ;;
                esac
              fi
            done < <(find "$target" /root/SiRisky /var/tmp -maxdepth 5 -type f -size -2M \( -name ".env*" -o -iname "*env*" -o -iname "*config*" -o -path "*/backups/*" \) 2>/dev/null | sort -u)
            echo "telegram_token_sources=$count"
            echo "source_in_learner_backups=$in_backups"
            echo "source_in_learner_tree=$in_tree"
            echo "source_in_sirisky=$in_sirisky"
            echo "source_in_vartmp=$in_vartmp"
            if [[ -n "$chosen" ]]; then
              printf "%s" "$chosen" > "$marker"
              chmod 600 "$marker"
              chown ayman01323:ayman01323 "$marker"
              echo "usable_prior_token_source=true"
            else
              echo "usable_prior_token_source=false"
            fi
          '
