name: SiRisky Live Flow Inspect 20260826

on:
  push:
    paths:
      - '.github/workflows/sirisky-live-flow-inspect-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Locate prior Learner Telegram credential safely
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          echo "service=$(systemctl is-active learnerbot-learn.service 2>/dev/null || true)"
          echo "source_sha=$(cat "$target/RESTORED_SOURCE_SHA.txt" 2>/dev/null || echo unknown)"
          sudo -n TARGET="$target" python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['TARGET'])
          candidates=[]
          for base in [root, root/'backups', Path('/root/SiRisky'), Path('/var/tmp')]:
              if not base.exists(): continue
              try:
                  it=base.rglob('*') if base.is_dir() else [base]
                  for p in it:
                      try:
                          if not p.is_file() or p.stat().st_size>2_000_000: continue
                          name=p.name.lower()
                          if not (name.startswith('.env') or 'env' in name or 'config' in name or 'backup' in str(p).lower()): continue
                          text=p.read_text(encoding='utf-8',errors='ignore')
                          for line in text.splitlines():
                              if line.startswith('TELEGRAM_BOT_TOKEN=') and line.split('=',1)[1].strip():
                                  candidates.append(str(p)); break
                      except Exception:
                          pass
              except Exception:
                  pass
          # Never print token values or full private paths; only coarse source classification.
          print('telegram_token_sources='+str(len(set(candidates))))
          print('source_in_learner_tree='+str(any(str(root) in p for p in candidates)).lower())
          print('source_in_learner_backups='+str(any(str(root/'backups') in p for p in candidates)).lower())
          print('source_in_sirisky='+str(any('/root/SiRisky/' in p for p in candidates)).lower())
          print('source_in_vartmp='+str(any('/var/tmp/' in p for p in candidates)).lower())
          # Store the best matching path only in a root-only marker for the next step; no secret copied yet.
          priority=[]
          for p in candidates:
              score=0
              if str(root/'backups') in p: score=40
              elif str(root) in p: score=30
              elif '/root/SiRisky/' in p: score=20
              elif '/var/tmp/' in p: score=10
              priority.append((score,p))
          if priority:
              chosen=max(priority)[1]
              marker=root/'private'/'.telegram_source_path'
              marker.parent.mkdir(parents=True,exist_ok=True)
              marker.write_text(chosen,encoding='utf-8')
              os.chmod(marker,0o600)
              print('usable_prior_token_source=true')
          else:
              print('usable_prior_token_source=false')
          PY
