name: SiRisky Live Flow Inspect 20260826

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-live-flow-inspect-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Restore outbound-only Telegram for isolated Learner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          service=learnerbot-learn.service
          marker="$target/private/.telegram_source_path"
          test -s "$marker"
          test "$(cat "$target/RESTORED_SOURCE_SHA.txt" 2>/dev/null)" = "894c5597c5cf0c695f1f75df39f26ebe64c2dce9"
          source_file="$(cat "$marker")"
          test -f "$source_file"
          token="$(sudo -n grep -m1 '^TELEGRAM_BOT_TOKEN=.' "$source_file" | cut -d= -f2-)"
          token="${token%\"}"
          token="${token#\"}"
          token="${token%\'}"
          token="${token#\'}"
          test -n "$token"
          curl -fsS --max-time 15 "https://api.telegram.org/bot${token}/getMe" | grep -q '"ok":true'
          echo "telegram_token_valid=true"

          ui="$target/learnerbot/telegram_ui.py"
          if ! grep -q 'outbound-only mode: polling disabled' "$ui"; then
            sudo -n cp -a "$ui" "$target/backups/telegram_ui.py.before-outbound-only"
            sudo -n sed -i '/^def start_menu_thread(app):$/a\    if os.getenv("LEARNER_TELEGRAM_OUTBOUND_ONLY","").strip().lower() in {"1","true","yes","on"}:\n        print("[telegram-menu] outbound-only mode: polling disabled")\n        return None' "$ui"
          fi
          grep -q 'outbound-only mode: polling disabled' "$ui"
          sudo -n /root/multichain-learning-bot-v2.2-fast-direct-market/.venv/bin/python -m py_compile "$ui"
          echo "telegram_polling_guard=true"

          master="$(awk -F, 'NR>1 && toupper($2)=="MASTER" && toupper($3)=="ACTIVE" && $1 ~ /^[0-9-]+$/ {print $1; exit}' "$target/CSVbot/users.csv")"
          test -n "$master"
          envp="$target/.env"
          tmp="$(mktemp)"
          grep -v -E '^(TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|TELEGRAM_CHAT_IDS|LEARNER_TELEGRAM_OUTBOUND_ONLY)=' "$envp" > "$tmp" || true
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$token" >> "$tmp"
          printf 'TELEGRAM_CHAT_ID=%s\n' "$master" >> "$tmp"
          printf 'LEARNER_TELEGRAM_OUTBOUND_ONLY=true\n' >> "$tmp"
          sudo -n cp -a "$envp" "$target/backups/.env.before-telegram-outbound-fix"
          sudo -n cp "$tmp" "$envp"
          rm -f "$tmp"
          sudo -n chown ayman01323:ayman01323 "$envp" "$ui"
          sudo -n chmod 600 "$envp"
          echo "telegram_outbound_configured=true"

          sudo -n systemctl restart "$service"
          sleep 10
          state1="$(systemctl is-active "$service" 2>/dev/null || true)"
          n1="$(systemctl show "$service" -p NRestarts --value 2>/dev/null || echo unknown)"
          sleep 6
          state2="$(systemctl is-active "$service" 2>/dev/null || true)"
          n2="$(systemctl show "$service" -p NRestarts --value 2>/dev/null || echo unknown)"
          echo "service_state_1=$state1"
          echo "service_state_2=$state2"
          echo "restart_count_1=$n1"
          echo "restart_count_2=$n2"

          payload="$(printf '{\"chat_id\":\"%s\",\"text\":\"🧠 Learner Bot Telegram connection restored. Outbound trade/status alerts are active. Telegram command polling remains on the main bot only. No trade was placed by this test.\",\"protect_content\":true}' "$master")"
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$payload" "https://api.telegram.org/bot${token}/sendMessage" | grep -q '"ok":true'
          echo "smoke_test_ok=true"

          journalctl -u "$service" -n 180 --no-pager -o cat 2>/dev/null | grep -Ei 'outbound-only mode|TELEGRAM_BOT_TOKEN|telegram-menu|Main process exited|Failed with result' | tail -n 120 || true
          test "$state1" = active
          test "$state2" = active
          test "$n1" = "$n2"
