name: SiRisky Live Flow Inspect 20260826

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-live-flow-inspect-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Locate exact cold-zone refusal formatter
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          echo '=== exact phrase ==='
          sudo -n grep -Rsn --binary-files=without-match -F 'COLD ZONE BUY REFUSED' /root/SiRisky /home/ayman01323/BOOT 2>/dev/null | head -20 || true
          echo '=== deterioration phrase ==='
          sudo -n grep -Rsn --binary-files=without-match -F 'entry deterioration' /root/SiRisky /home/ayman01323/BOOT 2>/dev/null | head -30 || true
          echo '=== warning code ==='
          sudo -n grep -Rsn --binary-files=without-match -F 'POOL_NEW_COOLING' /root/SiRisky /home/ayman01323/BOOT 2>/dev/null | head -30 || true
          echo '=== service ==='
          systemctl is-active learnerbot-learn.service || true
