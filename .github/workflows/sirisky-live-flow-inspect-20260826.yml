name: SiRisky Live Flow Inspect 20260826

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-live-flow-inspect-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Activate and verify SiLearn cold-zone refusal alerts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          root=/home/ayman01323/BOOT/testingbots/learn
          service=learnerbot-learn.service
          test -s "$root/learnerbot/telegram_cold_zone_refusal_patch.py"

          sudo -n python3 - "$root" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1])
          p=root/'learnerbot'/'__main__.py'
          text=p.read_text(encoding='utf-8')
          marker='from . import telegram_cold_zone_refusal_patch  # noqa: F401'
          if marker not in text:
              anchor='from . import solana_trade_diagnostics_patch  # noqa: F401\n'
              if anchor not in text:
                  raise SystemExit('missing diagnostics import anchor')
              text=text.replace(anchor, anchor+'# Rich SiLearn Telegram evidence for Solana BUY refusals; notification only.\n'+marker+'\n', 1)
              p.write_text(text, encoding='utf-8')
          print('import_installed='+str(marker in p.read_text(encoding='utf-8')).lower())
          PY

          sudo -n python3 -m py_compile "$root/learnerbot/telegram_cold_zone_refusal_patch.py" "$root/learnerbot/__main__.py"
          sudo -n systemctl restart "$service"
          sleep 4
          echo "service_check_1=$(systemctl is-active "$service" || true)"
          echo "restart_count_1=$(systemctl show "$service" -p NRestarts --value || true)"
          sleep 4
          echo "service_check_2=$(systemctl is-active "$service" || true)"
          echo "restart_count_2=$(systemctl show "$service" -p NRestarts --value || true)"
          sudo -n journalctl -u "$service" -n 80 --no-pager | grep -E 'silearn-refusal-alert|Traceback|ERROR|error' | tail -40 || true

          sudo -n python3 - "$root" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1])
          env={}
          for line in (root/'.env').read_text(encoding='utf-8',errors='ignore').splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k,v=line.split('=',1); env[k.strip()]=v.strip().strip('"').strip("'")
          token=env.get('TELEGRAM_BOT_TOKEN','').strip()
          tid=env.get('TELEGRAM_CHAT_ID','').strip()
          if not token or not tid:
              raise SystemExit('telegram credentials missing')
          sys.path.insert(0,str(root))
          from learnerbot.telegram import send_message
          from learnerbot.telegram_cold_zone_refusal_patch import format_cold_zone_refusal
          mint='3K2eCRAZbv8WDhSSepRoz3YvpPyr8t3BN28MnoraoRns'
          text=format_cold_zone_refusal(
              mint,
              'entry deterioration 69.580% > 10.000%',
              {
                  'age_seconds': 71,
                  'warnings': ['LP_CONCENTRATION_RISK','POOL_NEW_COOLING'],
                  'direct_sol': '147.624445',
                  'total_usd': '31382.79',
              },
              test_note='Historical replay test only — no new trade was attempted.',
          )
          send_message(token,tid,text,parse_mode='HTML',protect_content=True)
          print('historical_format_test_completed=true')
          PY
