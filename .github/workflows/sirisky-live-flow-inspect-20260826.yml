name: SiRisky Capital Gate Inspect

on:
  push:
    paths:
      - '.github/workflows/sirisky-live-flow-inspect-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Measure current wallet versus protected reserve
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          sudo -n bash -lc '
            set -Eeuo pipefail
            cd /root/SiRisky
            echo "=== CAPITAL ==="
            PYTHONPATH=. .venv/bin/python - <<"PY"
from sirisky.config import Settings
from sirisky.wallet import WalletStore
from sirisky.jupiter import wallet_balance_lamports
s=Settings.load(); a=WalletStore(s).address(); b=wallet_balance_lamports(s,a)
r=s.risk(); reserve=float(r.get("untouched_sol_reserve") or 0.005)
probe=float(s.runtime().get("auto_probe_sol") or 0.0005)
sol=b/1_000_000_000
print(f"wallet_balance_sol={sol:.9f}")
print(f"untouched_sol_reserve={reserve:.9f}")
print(f"auto_probe_sol={probe:.9f}")
print(f"required_for_next_canary={reserve+probe:.9f}")
print(f"available_above_reserve={max(0,sol-reserve):.9f}")
print(f"capital_gate_pass={str(sol >= reserve+probe).lower()}")
PY
            echo "=== RUNTIME ==="
            awk -F, '\''$1 ~ /^(trading_mode|live_enabled|broadcast_enabled|manual_approval_enabled|manual_approval_require_external_signature|auto_evaluate_candidate_limit|jupiter_min_interval_seconds|jupiter_max_retries)$/ {gsub(/\r/,"",$2); print $1"="$2}'\'' CSV/runtime.csv
            echo "=== LATEST RISK ==="
            tail -n 8 CSV/risk_checks.csv 2>/dev/null || true
            echo "service=$(systemctl is-active sirisky.service)"
          '
