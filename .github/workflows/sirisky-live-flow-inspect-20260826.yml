name: SiRisky Live Flow Inspect 20260826

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Verify SiLearn refusal alert status
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          target=/home/ayman01323/BOOT/testingbots/learn
          service=learnerbot-learn.service
          echo "service=$(systemctl is-active "$service" 2>/dev/null || true)"
          echo "source_sha=$(cat "$target/RESTORED_SOURCE_SHA.txt" 2>/dev/null || echo unknown)"
          test -s "$target/learnerbot/telegram_cold_zone_refusal_patch.py"
          grep -q 'from . import telegram_cold_zone_refusal_patch' "$target/learnerbot/__main__.py"
          echo 'cold_zone_refusal_alert_installed=true'
          echo "restart_count=$(systemctl show "$service" -p NRestarts --value 2>/dev/null || true)"
