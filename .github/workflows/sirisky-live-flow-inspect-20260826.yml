name: SiRisky Current Live Activity Inspect

on:
  push:
    paths:
      - '.github/workflows/sirisky-live-flow-inspect-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Inspect current SiRisky loop on botgoogle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          sudo -n bash -lc '
            set -Eeuo pipefail
            cd /root/SiRisky
            echo "=== CURRENT STATE ==="
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
            echo "host=$(hostname)"
            echo "service=$(systemctl is-active sirisky.service || true)"
            PYTHONPATH=. .venv/bin/python - <<"PY"
import csv
from pathlib import Path
p=Path("CSV/runtime.csv")
want=["trading_mode","live_enabled","broadcast_enabled","manual_approval_enabled","auto_probe_sol","auto_entry_min_sol","auto_entry_max_sol","auto_evaluate_candidate_limit","jupiter_min_interval_seconds"]
with p.open(encoding="utf-8-sig",newline="") as f:
    rd=csv.DictReader(f); fs=rd.fieldnames or []; k="key" if "key" in fs else fs[0]; v="value" if "value" in fs else fs[1]; vals={r.get(k):r.get(v) for r in rd}
for x in want: print(f"{x}={vals.get(x,'')}")
p=Path("CSV/open_positions.csv")
rows=[]
if p.exists():
    with p.open(encoding="utf-8-sig",newline="") as f: rows=list(csv.DictReader(f))
live=[r for r in rows if str(r.get("status") or "").upper()=="OPEN" and str(r.get("mode") or "").upper()=="LIVE"]
print("open_live="+str(len(live)))
PY
            echo "=== RECENT FILTERED JOURNAL ==="
            journalctl -u sirisky.service --since "15 minutes ago" --no-pager -o cat 2>/dev/null | grep -Ei "discover|candidate|NO_TRIGGER|QUOTE_REJECT|HTTPError|stage[0-9]|OPENED|CLOSED|BUY|SELL|JUPITER|fee|risk|reject|opportun|armed|LIVE" | tail -n 500 || true
            echo "=== LAST 120 LINES ==="
            journalctl -u sirisky.service -n 120 --no-pager -o cat 2>/dev/null || true
          '
