name: SiRisky Live Flow Inspect 20260826

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sirisky-live-flow-inspect-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Inspect exact Learner Telegram REJECT sender
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          root=/home/ayman01323/BOOT/testingbots/learn
          echo '=== telegram_solana_send_patch ==='
          sudo -n sed -n '1,260p' "$root/learnerbot/telegram_solana_send_patch.py"
          echo '=== cli action loop ==='
          sudo -n sed -n '175,220p' "$root/learnerbot/cli.py"
          echo '=== solana_live notification region ==='
          sudo -n sed -n '1,115p' "$root/learnerbot/solana_live_patch.py"
          echo '=== positive edge reject region ==='
          sudo -n sed -n '360,450p' "$root/learnerbot/solana_positive_edge_entry_gate_patch.py"
          echo '=== main composition ==='
          sudo -n sed -n '1,100p' "$root/learnerbot/__main__.py"
          echo '=== service ==='
          systemctl is-active learnerbot-learn.service || true
