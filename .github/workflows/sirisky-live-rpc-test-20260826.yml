name: SiRisky LIVE Activation and Verification

on:
  push:
    paths:
      - '.github/workflows/sirisky-live-rpc-test-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirisky-live-activation
  cancel-in-progress: false

jobs:
  activate-live:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 12
    steps:
      - name: Repair runner checkout without actions checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          cd "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then
            find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            git init
            git remote add origin https://github.com/ayman01323/boot-trading-bot.git
          else
            git remote set-url origin https://github.com/ayman01323/boot-trading-bot.git
          fi
          git fetch --force --no-tags --depth=50 origin main
          git cat-file -e "$GITHUB_SHA^{commit}"
          git reset --hard "$GITHUB_SHA"
          git clean -ffd
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Arm governed LIVE automatic execution
        shell: bash
        run: |
          set -Eeuo pipefail
          WRAPPER=/root/SiRisky/ops/sirisky-governed-live-arm
          sudo -n -l "$WRAPPER" >/dev/null
          output="$(sudo -n "$WRAPPER" "$GITHUB_SHA")"
          printf '%s\n' "$output"
          grep -qx 'service=active' <<<"$output"
          grep -qx 'trading_mode=LIVE' <<<"$output"
          grep -qx 'live_enabled=1' <<<"$output"
          grep -qx 'broadcast_enabled=1' <<<"$output"
          grep -qx 'manual_approval_enabled=0' <<<"$output"
          grep -qx 'manual_approval_require_external_signature=0' <<<"$output"
          grep -qx 'telegram_manual_run_enabled=0' <<<"$output"

      - name: Verify effective server state
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(systemctl is-active sirisky.service)" = active
          echo '=== SIRISKY EFFECTIVE LIVE STATE ==='
          sudo -n awk -F, 'NR==1 || $1 ~ /^(trading_mode|live_enabled|broadcast_enabled|auto_discovery_enabled|auto_promote_to_selected|manual_approval_enabled|manual_approval_require_external_signature|telegram_manual_run_enabled)$/' /root/SiRisky/CSV/runtime.csv
          test "$(sudo -n awk -F, '$1=="trading_mode"{print $2}' /root/SiRisky/CSV/runtime.csv | tr -d '\r')" = LIVE
          test "$(sudo -n awk -F, '$1=="live_enabled"{print $2}' /root/SiRisky/CSV/runtime.csv | tr -d '\r')" = 1
          test "$(sudo -n awk -F, '$1=="broadcast_enabled"{print $2}' /root/SiRisky/CSV/runtime.csv | tr -d '\r')" = 1
          test "$(sudo -n awk -F, '$1=="manual_approval_enabled"{print $2}' /root/SiRisky/CSV/runtime.csv | tr -d '\r')" = 0
          echo 'sirisky_live_activation=PASS'
          echo 'real_transaction_broadcast=ENABLED_AFTER_EXISTING_STRATEGY_AND_RISK_GATES'

