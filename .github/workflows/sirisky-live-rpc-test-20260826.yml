name: SiRisky LIVE Activation and Verification

on:
  push:
    paths:
      - '.github/workflows/sirisky-live-rpc-test-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate-live:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 12
    steps:
      - name: Repair runner checkout in place
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          cd "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; git remote add origin https://github.com/ayman01323/boot-trading-bot.git; fi
          git fetch --force --no-tags --depth=50 origin main
          git reset --hard "$GITHUB_SHA"

      - name: Trace prior SiRisky trade
        shell: bash
        run: |
          set -Eeuo pipefail
          SINCE='2026-08-29 17:22:00 UTC'
          echo '=== SIRISKY PRIOR TRADE TRACE ==='
          echo "service=$(systemctl is-active sirisky.service || true)"
          echo '--- unique position/status lines since activation ---'
          sudo -n journalctl -u sirisky.service --since "$SINCE" --no-pager -o short-iso 2>/dev/null \
            | grep -Eai 'position_id|ENTRY|BUY|SELL|EXIT|EXECUT|BROADCAST|signature|txid|filled|pnl|profit|loss' \
            | grep -Ev 'pos-e39b933a174b.*EXIT_EXECUTION_RETRY' \
            | tail -1200 || true
          echo '--- unique position ids ---'
          sudo -n journalctl -u sirisky.service --since "$SINCE" --no-pager -o cat 2>/dev/null \
            | grep -Eo 'pos-[a-zA-Z0-9]+' | sort | uniq -c || true
          echo '--- context around current position first appearance ---'
          sudo -n journalctl -u sirisky.service --since "$SINCE" --no-pager -o short-iso 2>/dev/null \
            | grep -B80 -A20 'pos-e39b933a174b' | head -220 || true
          echo '=== END PRIOR TRADE TRACE ==='

# Owner-requested activation: 2026-08-29T17:14:56Z
# Prior-trade trace requested: 2026-08-30T09:27:38Z
