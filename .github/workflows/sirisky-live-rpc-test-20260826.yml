name: SiRisky LIVE Activation and Verification

on:
  push:
    paths:
      - '.github/workflows/sirisky-live-rpc-test-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate-live:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 12
    steps:
      - name: Repair runner checkout in place
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          cd "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; git remote add origin https://github.com/ayman01323/boot-trading-bot.git; fi
          git fetch --force --no-tags --depth=50 origin main
          git reset --hard "$GITHUB_SHA"

      - name: Inspect SiRisky trades since LIVE activation
        shell: bash
        run: |
          set -Eeuo pipefail
          SINCE='2026-08-29 17:22:00 UTC'
          echo '=== SIRISKY TRADE AUDIT ==='
          echo "since=$SINCE"
          echo "service=$(systemctl is-active sirisky.service || true)"
          echo '--- candidate trade files ---'
          sudo -n find /root/SiRisky -type f \( -iname '*.csv' -o -iname '*.json' -o -iname '*.jsonl' -o -iname '*.log' \) -newermt "$SINCE" -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %p\n' 2>/dev/null | sort | tail -100 || true
          echo '--- transaction/trade evidence in changed files ---'
          while IFS= read -r f; do
            echo "### $f"
            sudo -n grep -Eai 'signature|txid|transaction|broadcast|executed|filled|BUY|SELL|position|entry|exit' "$f" 2>/dev/null | tail -80 || true
          done < <(sudo -n find /root/SiRisky -type f \( -iname '*.csv' -o -iname '*.json' -o -iname '*.jsonl' -o -iname '*.log' \) -newermt "$SINCE" 2>/dev/null | head -200)
          echo '--- service journal since activation ---'
          sudo -n journalctl -u sirisky.service --since "$SINCE" --no-pager -o short-iso 2>/dev/null | grep -Eai 'signature|txid|transaction|broadcast|executed|filled|BUY|SELL|position|entry|exit|reject|error' | tail -300 || true
          echo '=== END SIRISKY TRADE AUDIT ==='

# Owner-requested activation: 2026-08-29T17:14:56Z
# Trade audit requested: 2026-08-30T09:25:56Z
