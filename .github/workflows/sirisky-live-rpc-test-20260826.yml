name: SiRisky Current Blocker Diagnostic

on:
  push:
    paths:
      - '.github/workflows/sirisky-live-rpc-test-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Inspect current SiRisky blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://raw.githubusercontent.com/ayman01323/boot-trading-bot/e0a2a57e9c25cd1447e509747f8a7111fd9fea93/scripts/sirisky_google_why_nothing_diagnostic.sh \
            -o "$tmp"
          bash "$tmp"
