name: SiRisky LIVE Activation and Verification

on:
  push:
    paths:
      - '.github/workflows/sirisky-live-rpc-test-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate-live:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 12
    steps:
      - name: Repair runner checkout in place
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          cd "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; git remote add origin https://github.com/ayman01323/boot-trading-bot.git; fi
          git fetch --force --no-tags --depth=50 origin main
          git reset --hard "$GITHUB_SHA"

      - name: Summarise previous SiRisky position
        shell: bash
        run: |
          set -Eeuo pipefail
          SINCE='2026-08-29 17:22:00 UTC'
          CUR='pos-e39b933a174b'
          TMP=$(mktemp)
          sudo -n journalctl -u sirisky.service --since "$SINCE" --no-pager -o short-iso > "$TMP"
          echo '=== PRIOR_POSITION_SUMMARY ==='
          echo "SERVICE=$(systemctl is-active sirisky.service || true)"
          echo 'POSITIONS_BY_FIRST_APPEARANCE:'
          awk 'match($0,/pos-[A-Za-z0-9]+/){p=substr($0,RSTART,RLENGTH); if(!seen[p]++){print NR,p,$1}}' "$TMP"
          PRIOR=$(awk -v cur="$CUR" 'match($0,/pos-[A-Za-z0-9]+/){p=substr($0,RSTART,RLENGTH); if(!seen[p]++){order[++n]=p}} END{for(i=1;i<=n;i++) if(order[i]==cur && i>1){print order[i-1]; exit}}' "$TMP")
          echo "CURRENT_POSITION=$CUR"
          echo "PRIOR_POSITION=${PRIOR:-NONE}"
          if [[ -n "${PRIOR:-}" ]]; then
            echo 'PRIOR_RELEVANT_LINES:'
            grep "$PRIOR" "$TMP" | grep -Eai 'ENTRY|BUY|SELL|EXIT|EXECUT|BROADCAST|signature|txid|filled|pnl|profit|loss|status|order_id|mint|token|amount' | head -40 || true
            echo 'PRIOR_LAST_LINES:'
            grep "$PRIOR" "$TMP" | tail -20 || true
          fi
          echo 'CURRENT_FIRST_LINES:'
          grep "$CUR" "$TMP" | head -8 || true
          echo '=== END_PRIOR_POSITION_SUMMARY ==='

# Compact prior-position audit requested 2026-08-30T09:27:38Z
