name: SiRisky Local Credential Recovery

on:
  push:
    paths:
      - '.github/workflows/sirisky-local-credential-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Find working local RPC and Jupiter credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          sudo -n true

          sudo -n /root/SiRisky/.venv/bin/python - <<'PY'
          import csv, os, requests
          from pathlib import Path
          from urllib.parse import urlparse

          TARGET=Path('/root/SiRisky')
          ROOT_ENV=TARGET/'.env'
          RUNTIME=TARGET/'CSV/runtime.csv'

          # Keep all execution gates disabled during credential recovery.
          rows=list(csv.DictReader(RUNTIME.open(encoding='utf-8-sig',newline='')))
          for r in rows:
              if r.get('setting') in {'live_enabled','broadcast_enabled','telegram_manual_run_enabled'}:
                  r['value']='0'
          with RUNTIME.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['setting','value','notes']); w.writeheader(); w.writerows(rows)

          candidates=[
              ROOT_ENV,
              Path('/home/ayman01323/ClaudeServer/SiRisky/.env'),
              Path('/root/multichain-learning-bot-v2.2-fast-direct-market/.env'),
              Path('/root/multichain-learning-bot-v2.2-fast-direct-market/.env.local'),
              Path('/var/tmp/ai_council_runtime.env'),
              Path('/var/tmp/boot/ai_council_runtime.env'),
          ]
          prod=Path('/root/multichain-learning-bot-v2.2-fast-direct-market')
          if prod.exists():
              candidates += list(prod.glob('*.env')) + list(prod.glob('config/*.env'))

          def read_values(path):
              out={}
              if not path.is_file(): return out
              try:
                  lines=path.read_text(encoding='utf-8',errors='replace').splitlines()
              except Exception:
                  return out
              for raw in lines:
                  s=raw.strip()
                  if not s or s.startswith('#') or '=' not in raw: continue
                  k,v=raw.split('=',1); k=k.strip(); v=v.strip().strip('"').strip("'")
                  if v:
                      out.setdefault(k,[]).append(v)
              return out

          rpc_names=('SOLANA_RPC_URL','HELIUS_RPC_URL','HELIUS_HTTP_URL','SOLANA_HTTP_RPC_URL')
          ws_names=('SOLANA_WS_URL','HELIUS_WS_URL','SOLANA_WSS_URL')
          j_names=('JUPITER_API_KEY','JUP_API_KEY')
          rpcs=[]; wss=[]; jkeys=[]
          for p in candidates:
              vals=read_values(p)
              for n in rpc_names: rpcs += vals.get(n,[])
              for n in ws_names: wss += vals.get(n,[])
              for n in j_names: jkeys += vals.get(n,[])

          def uniq(xs):
              seen=set(); out=[]
              for x in xs:
                  if x and x not in seen:
                      seen.add(x); out.append(x)
              return out
          rpcs=uniq(rpcs); wss=uniq(wss); jkeys=uniq(jkeys)

          def rpc_ok(url):
              try:
                  r=requests.post(url,json={'jsonrpc':'2.0','id':1,'method':'getLatestBlockhash','params':[]},timeout=12,headers={'User-Agent':'SiRisky-recovery'})
                  if r.status_code != 200: return False
                  j=r.json()
                  return isinstance(j,dict) and 'result' in j and not j.get('error')
              except Exception:
                  return False

          wsol='So11111111111111111111111111111111111111112'
          usdc='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'
          def jup_ok(key):
              try:
                  r=requests.get('https://api.jup.ag/swap/v1/quote',params={'inputMint':wsol,'outputMint':usdc,'amount':'100000','slippageBps':'100'},headers={'x-api-key':key,'User-Agent':'SiRisky-recovery'},timeout=15)
                  if r.status_code != 200: return False
                  j=r.json()
                  return isinstance(j,dict) and bool(j.get('outAmount'))
              except Exception:
                  return False

          good_rpc=next((u for u in rpcs if rpc_ok(u)), '')
          good_j=next((k for k in jkeys if jup_ok(k)), '')

          # Prefer matching WS for the selected RPC host; derive Helius WS when possible.
          good_ws=''
          if good_rpc:
              rh=urlparse(good_rpc).hostname or ''
              for w in wss:
                  if (urlparse(w).hostname or '') == rh:
                      good_ws=w; break
              if not good_ws and good_rpc.startswith('https://') and 'helius-rpc.com' in good_rpc:
                  good_ws='wss://' + good_rpc[len('https://'):]

          # Rewrite only the target keys, preserving all other standalone settings.
          managed={'SOLANA_RPC_URL','SOLANA_WS_URL','JUPITER_API_KEY','CSV_DIR','DATA_DIR','LOG_DIR','AUTHORISED_CHAINS'}
          lines=ROOT_ENV.read_text(encoding='utf-8',errors='replace').splitlines() if ROOT_ENV.exists() else []
          kept=[]
          for raw in lines:
              if '=' in raw and not raw.lstrip().startswith('#'):
                  if raw.split('=',1)[0].strip() in managed:
                      continue
              kept.append(raw)
          fixed={
              'CSV_DIR':'/root/SiRisky/CSV',
              'DATA_DIR':'/root/SiRisky/data',
              'LOG_DIR':'/root/SiRisky/logs',
              'AUTHORISED_CHAINS':'solana',
          }
          if good_rpc: fixed['SOLANA_RPC_URL']=good_rpc
          if good_ws: fixed['SOLANA_WS_URL']=good_ws
          if good_j: fixed['JUPITER_API_KEY']=good_j
          kept += [f'{k}={v}' for k,v in fixed.items()]
          ROOT_ENV.write_text('\n'.join(kept).rstrip()+'\n',encoding='utf-8'); ROOT_ENV.chmod(0o600)

          print('rpc_candidates='+str(len(rpcs)))
          print('rpc_working_found='+str(bool(good_rpc)).lower())
          print('rpc_working_provider='+(urlparse(good_rpc).hostname if good_rpc else 'NONE'))
          print('ws_working_present='+str(bool(good_ws)).lower())
          print('jupiter_candidates='+str(len(jkeys)))
          print('jupiter_working_found='+str(bool(good_j)).lower())
          PY

          sudo -n systemctl restart sirisky.service
          sleep 4
          echo '=== SERVICE ==='
          systemctl show sirisky.service -p ActiveState -p SubState -p Result -p WorkingDirectory --no-pager
          echo '=== SAFE CHECK ==='
          sudo -n bash -lc 'cd /root/SiRisky && PYTHONPATH=. .venv/bin/python run.py check || true'
          echo '=== LIVE GATES ==='
          sudo -n awk -F, 'NR==1 || $1 ~ /^(live_enabled|broadcast_enabled|telegram_manual_run_enabled)$/' /root/SiRisky/CSV/runtime.csv
          echo 'real_transaction_broadcast=NO'
