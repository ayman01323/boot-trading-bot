name: SiRisky public transaction fee diagnostic 2026-08-29

on:
  push:
    branches:
      - diag/sirisky-20260829-2042-tx-fees

permissions:
  contents: read

jobs:
  inspect-public-solana-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public Solana transaction fees and account movements only
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          MINT="6DNiANPmV14rGRqDYLcoM9s9sHmNo8uFCDv9m6wR6R18"
          SIGS=[
          "616fKDGipKNgBAb8KXPMBaF1frCQEPQ81vEcuPkqwH43TBxtqLaNyZFTvsteDErPoyHdHwcR1TDL4ypPcRhA4keJ",
          "2yvCmzTGMe9hZoppFiSCjxcuwTu8qT5gFRAyKZvtGPVTNDwwaaLaYV3xwwjfof7X4pT7S4xVn5MpZxzM9YixXY1r",
          "fnsoigD18eQEfbR5xJXQQQby3TRv6nTZXs2jSGL5YXiTvznTB6roMzVNo2fh1oAmCLZBraHgK6KcqjLBFiy4KQk",
          "3tekSRc6y9nYw5z3wixb8QEbWLcAVSWG86mHNbsJCQH5dg3NDDuGXKqPb19aENGuJeG4XyQRPUrR4W7jV7nYL9ZU",
          "4kubdTzJwEw7dns3cqgo4yLxGPxUCHx8L1k9uzEMVZuXuCwP4ivSfRz9ZzfXFoL7QJKuij4v7buWweeV7ti737Eo",
          "4N4L4xgT8MTBPrJ6jpLeGFhenDnnhAVdCYj72JbL9vMU2C28hxHDgqLJWeLDNXmDLkXiPiPYzoVrnSdUFfkYhmQF"]
          RPCS=["https://api.mainnet-beta.solana.com","https://solana-rpc.publicnode.com","https://1rpc.io/solana"]
          def rpc(method,params):
              data=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              last=None
              for u in RPCS:
                  try:
                      req=urllib.request.Request(u,data=data,headers={"Content-Type":"application/json","User-Agent":"SiRisky-public-readonly-diagnostic"})
                      with urllib.request.urlopen(req,timeout=20) as r: obj=json.loads(r.read().decode())
                      if not obj.get("error"): return obj.get("result")
                  except Exception as e: last=e
              raise RuntimeError(type(last).__name__)
          def tx(sig): return rpc("getTransaction",[sig,{"encoding":"jsonParsed","commitment":"confirmed","maxSupportedTransactionVersion":0}])
          first=tx(SIGS[0]); keys=first["transaction"]["message"]["accountKeys"]
          signer=next(k["pubkey"] for k in keys if isinstance(k,dict) and k.get("signer"))
          total_fee=0
          for n,sig in enumerate(SIGS,1):
              t=tx(sig); m=t["meta"]; keys=t["transaction"]["message"]["accountKeys"]
              pubs=[k.get("pubkey") if isinstance(k,dict) else k for k in keys]
              si=pubs.index(signer); pre=m["preBalances"]; post=m["postBalances"]
              fee=int(m.get("fee") or 0); total_fee+=fee
              # signer-owned token accounts visible in pre/post token balance metadata
              owned={}
              for phase,rows in (("pre",m.get("preTokenBalances") or []),("post",m.get("postTokenBalances") or [])):
                  for row in rows:
                      if str(row.get("owner") or "")!=signer: continue
                      i=int(row["accountIndex"]); rec=owned.setdefault(i,{"account":pubs[i],"mint":row.get("mint"),"pre_lamports":pre[i],"post_lamports":post[i]})
                      rec[phase+"_raw"]=int((row.get("uiTokenAmount") or {}).get("amount") or 0)
              relevant=[]
              for rec in owned.values():
                  if rec.get("mint")==MINT or rec.get("mint")=="So11111111111111111111111111111111111111112":
                      rec["lamport_delta"]=rec["post_lamports"]-rec["pre_lamports"]
                      relevant.append(rec)
              # Parsed instructions mentioning signer, limited to system/associated-token/token programs.
              mentions=[]
              groups=[t["transaction"]["message"].get("instructions") or []]
              groups += [g.get("instructions") or [] for g in (m.get("innerInstructions") or [])]
              for insns in groups:
                  for ins in insns:
                      p=ins.get("parsed") if isinstance(ins,dict) else None
                      if not isinstance(p,dict): continue
                      program=str(ins.get("program") or "")
                      if program not in {"system","spl-associated-token-account","spl-token","spl-token-2022"}: continue
                      info=(p.get("info") or {})
                      if signer not in json.dumps(info,sort_keys=True): continue
                      mentions.append({"program":program,"type":p.get("type"),"info":info})
              print(f"TX{n}="+json.dumps({"blockTime":t.get("blockTime"),"signature":sig,"fee_lamports":fee,"fee_sol":fee/1e9,"signer_native_delta_sol":(post[si]-pre[si])/1e9,"owned_token_accounts":relevant,"parsed_signer_instructions":mentions},sort_keys=True))
          print("TOTAL_NETWORK_FEE_SOL="+f"{total_fee/1e9:.9f}")
          PY
