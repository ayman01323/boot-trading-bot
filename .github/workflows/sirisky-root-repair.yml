name: SiRisky Root Repair

on:
  push:
    paths:
      - '.github/workflows/sirisky-root-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Read-only Solana lifecycle PnL diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          test "$(systemctl is-active learnerbot-learn.service || true)" != active
          cd /home/ayman01323/BOOT/testingbots/learn
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          from decimal import Decimal

          WALLET='8zTnKUPW648NZZ285mz7ijFBpsbGu8AziRoZsH9JBfA3'
          MINTS={
            'E30':'6Mfj9t4WMN1c6CMpYZm8GvJsW3TiE7SrbrBqpBRnmUgd',
            'BVKG':'BvKgVjsUQ8KV22RNKhk3btZHKSDdrRfziGad4ugTCcJS',
          }
          FIXED_USD=Decimal('106.48')
          LAM=Decimal(1_000_000_000)

          def envvals(path):
              out={}
              for raw in Path(path).read_text(encoding='utf-8',errors='replace').splitlines():
                  s=raw.strip()
                  if not s or s.startswith('#') or '=' not in raw: continue
                  k,v=raw.split('=',1); k=k.strip(); v=v.strip().strip('"').strip("'")
                  out.setdefault(k,[]).append(v)
              return out
          e=envvals('.env')
          urls=[]
          for k in ('SOLANA_RPC_URLS','SOLANA_RPC_FALLBACK_URLS','SOLANA_RPC_URL','HELIUS_RPC_URL'):
              for v in e.get(k,[]):
                  for u in v.split(','):
                      u=u.strip()
                      if u and u not in urls: urls.append(u)
          if e.get('HELIUS_API_KEY'):
              u='https://mainnet.helius-rpc.com/?api-key='+e['HELIUS_API_KEY'][-1]
              if u not in urls: urls.append(u)
          urls.append('https://api.mainnet-beta.solana.com')

          def call(method, params):
              body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              last=None
              for u in urls:
                  try:
                      req=urllib.request.Request(u,data=body,headers={'Content-Type':'application/json'})
                      with urllib.request.urlopen(req,timeout=12) as r:
                          j=json.loads(r.read())
                      if 'error' in j: raise RuntimeError(str(j['error']))
                      return j['result']
                  except Exception as ex: last=ex
              raise RuntimeError('all RPCs failed: '+type(last).__name__)

          sigs=call('getSignaturesForAddress',[WALLET,{'limit':80}])
          rows=[]
          for s in sigs:
              if s.get('err') is not None: continue
              tx=call('getTransaction',[s['signature'],{'encoding':'jsonParsed','maxSupportedTransactionVersion':0,'commitment':'confirmed'}])
              if not tx: continue
              meta=tx.get('meta') or {}; msg=((tx.get('transaction') or {}).get('message') or {})
              keys=[]
              for a in msg.get('accountKeys') or []:
                  keys.append(a.get('pubkey') if isinstance(a,dict) else a)
              if WALLET not in keys: continue
              wi=keys.index(WALLET)
              preB=meta.get('preBalances') or []; postB=meta.get('postBalances') or []
              if wi>=len(preB) or wi>=len(postB): continue
              wallet_delta=int(postB[wi])-int(preB[wi]); fee=int(meta.get('fee') or 0)
              preTB=meta.get('preTokenBalances') or []; postTB=meta.get('postTokenBalances') or []
              def owner_amount(tb,mint):
                  total=0
                  for b in tb:
                      if b.get('mint')==mint and b.get('owner')==WALLET:
                          total += int(((b.get('uiTokenAmount') or {}).get('amount')) or 0)
                  return total
              for label,mint in MINTS.items():
                  pre=owner_amount(preTB,mint); post=owner_amount(postTB,mint); delta=post-pre
                  if delta==0: continue
                  rent_reclaimed=0; rent_paid=0
                  for b in preTB:
                      if b.get('mint')==mint and b.get('owner')==WALLET:
                          i=b.get('accountIndex')
                          if isinstance(i,int) and i<len(preB) and i<len(postB) and int(preB[i])>0 and int(postB[i])==0:
                              rent_reclaimed += int(preB[i])
                  for b in postTB:
                      if b.get('mint')==mint and b.get('owner')==WALLET:
                          i=b.get('accountIndex')
                          if isinstance(i,int) and i<len(preB) and i<len(postB) and int(preB[i])==0 and int(postB[i])>0:
                              rent_paid += int(postB[i])
                  if delta>0:
                      action='BUY'; trade_value=max(0,-wallet_delta-fee-rent_paid+rent_reclaimed)
                  else:
                      action='SELL'; trade_value=max(0,wallet_delta+fee-rent_reclaimed+rent_paid)
                  rows.append(dict(label=label,mint=mint,signature=s['signature'],blockTime=tx.get('blockTime') or 0,
                                   action=action,token_delta=delta,trade_value=trade_value,fee=fee,
                                   wallet_delta=wallet_delta,rent_paid=rent_paid,rent_reclaimed=rent_reclaimed))
          rows.sort(key=lambda x:x['blockTime'])
          print('fixed_sol_usd='+str(FIXED_USD))
          for r in rows:
              tv=Decimal(r['trade_value'])/LAM; ff=Decimal(r['fee'])/LAM
              print('tx|position=%s|action=%s|sig=%s|trade_sol=%s|fee_sol=%s|wallet_delta_sol=%s|rent_paid_sol=%s|rent_reclaimed_sol=%s' % (
                  r['label'],r['action'],r['signature'],f'{tv:.9f}',f'{ff:.9f}',f'{Decimal(r["wallet_delta"])/LAM:.9f}',
                  f'{Decimal(r["rent_paid"])/LAM:.9f}',f'{Decimal(r["rent_reclaimed"])/LAM:.9f}'))
          total_cap=Decimal(0); total_proc=Decimal(0); total_fee=Decimal(0)
          for label in MINTS:
              rr=[r for r in rows if r['label']==label]
              cap=sum(Decimal(r['trade_value']) for r in rr if r['action']=='BUY')/LAM
              proc=sum(Decimal(r['trade_value']) for r in rr if r['action']=='SELL')/LAM
              fee=sum(Decimal(r['fee']) for r in rr)/LAM
              gross=proc-cap; net=gross-fee
              print('position_summary|position=%s|capital_sol=%.9f|proceeds_sol=%.9f|gross_pnl_sol=%.9f|network_fee_sol=%.9f|net_pnl_sol=%.9f|net_pnl_pct=%.4f|network_fee_pct_capital=%.4f|capital_usd=%.6f|proceeds_usd=%.6f|net_pnl_usd=%.6f|network_fee_usd=%.6f' % (
                  label,cap,proc,gross,fee,net,(net/cap*100 if cap else 0),(fee/cap*100 if cap else 0),cap*FIXED_USD,proc*FIXED_USD,net*FIXED_USD,fee*FIXED_USD))
              total_cap+=cap; total_proc+=proc; total_fee+=fee
          tg=total_proc-total_cap; tn=tg-total_fee
          print('portfolio_summary|capital_sol=%.9f|proceeds_sol=%.9f|gross_pnl_sol=%.9f|network_fee_sol=%.9f|net_pnl_sol=%.9f|net_pnl_pct=%.4f|network_fee_pct_capital=%.4f|capital_usd=%.6f|proceeds_usd=%.6f|net_pnl_usd=%.6f|network_fee_usd=%.6f' % (
              total_cap,total_proc,tg,total_fee,tn,(tn/total_cap*100 if total_cap else 0),(total_fee/total_cap*100 if total_cap else 0),
              total_cap*FIXED_USD,total_proc*FIXED_USD,tn*FIXED_USD,total_fee*FIXED_USD))
          print('learner_service='+str(__import__('subprocess').run(['systemctl','is-active','learnerbot-learn.service'],capture_output=True,text=True).stdout.strip()))
          print('trade_submitted=NO')
          PY
