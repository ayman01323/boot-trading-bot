name: SiRisky Root Repair

on:
  push:
    paths:
      - '.github/workflows/sirisky-root-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 8
    steps:
      - name: Prepare exact source and stop learner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          sudo -n systemctl stop learnerbot-learn.service
          sleep 2
          test "$(systemctl is-active learnerbot-learn.service || true)" != active
          test "$(systemctl show -p MainPID --value learnerbot-learn.service)" = 0
          sudo -n rm -rf learnerbot/__pycache__ tests/__pycache__ || true
          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach --force "$GITHUB_SHA"
          echo learner_stop_verified=YES
          echo source_sha="$(git rev-parse HEAD)"
      - name: Compile protection source
        shell: bash
        run: |
          set -euo pipefail
          PY=/root/multichain-learning-bot-v2.2-fast-direct-market/.venv/bin/python
          sudo -n env PYTHONDONTWRITEBYTECODE=1 PYTHONPYCACHEPREFIX=/tmp/learner-protection-pycache "$PY" -m py_compile learnerbot/solana_loss_containment_patch.py learnerbot/solana_entry_exit_liquidity_preflight_patch.py learnerbot/solana_rpc_exit_priority_patch.py learnerbot/solana_stuck_liquidity_safe_slice_patch.py
          sudo -n rm -rf /tmp/learner-protection-pycache
          echo compile=PASS
      - name: Validate protection invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'solana_entry_exit_liquidity_preflight_patch' learnerbot/solana_stuck_liquidity_safe_slice_patch.py
          grep -q 'solana_rpc_exit_priority_patch' learnerbot/solana_stuck_liquidity_safe_slice_patch.py
          grep -q 'solana_loss_containment_patch' learnerbot/solana_stuck_liquidity_safe_slice_patch.py
          grep -q 'SOLANA_HARD_EXIT_REQUIRED' learnerbot/solana_loss_containment_patch.py
          grep -q 'loss_containment_stop_pct' learnerbot/solana_loss_containment_patch.py
          grep -q 'loss_containment_winner_take_profit_pct' learnerbot/solana_loss_containment_patch.py
          grep -q 'loss_containment_break_even_trigger_pct' learnerbot/solana_loss_containment_patch.py
          grep -q 'loss_containment_trailing_trigger_pct' learnerbot/solana_loss_containment_patch.py
          grep -q 'Decimal(1), _HARD_EXIT_REASON' learnerbot/solana_loss_containment_patch.py
          grep -q '_emergency._LOSS_EXIT_REASONS.add(_HARD_EXIT_REASON)' learnerbot/solana_loss_containment_patch.py
          grep -q 'live_enable_unchanged=true' learnerbot/solana_loss_containment_patch.py
          grep -q 'position_size_unchanged=true' learnerbot/solana_loss_containment_patch.py
          grep -q '500' learnerbot/solana_entry_exit_liquidity_preflight_patch.py
          echo invariant_validation=PASS
      - name: Stage source only on Google learner
        shell: bash
        run: |
          set -euo pipefail
          target=/home/ayman01323/BOOT/testingbots/learn/learnerbot
          test -d "$target"
          install -m 0644 learnerbot/solana_loss_containment_patch.py "$target/solana_loss_containment_patch.py"
          install -m 0644 learnerbot/solana_entry_exit_liquidity_preflight_patch.py "$target/solana_entry_exit_liquidity_preflight_patch.py"
          install -m 0644 learnerbot/solana_rpc_exit_priority_patch.py "$target/solana_rpc_exit_priority_patch.py"
          install -m 0644 learnerbot/solana_stuck_liquidity_safe_slice_patch.py "$target/solana_stuck_liquidity_safe_slice_patch.py"
          test "$(systemctl is-active learnerbot-learn.service || true)" != active
          test "$(systemctl show -p MainPID --value learnerbot-learn.service)" = 0
          echo loss_containment_source=WIRED_VALIDATED_AND_STAGED
          echo learner_service=STOPPED
          echo live_enabled_by_workflow=NO
          echo position_size_changed=NO
          echo trade_submitted=NO
