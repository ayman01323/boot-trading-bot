name: SiRisky Root Repair

on:
  push:
    paths:
      - '.github/workflows/sirisky-root-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Compare E30 and BvKg entry evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          test "$(systemctl is-active learnerbot-learn.service || true)" != active
          target=/home/ayman01323/BOOT/testingbots/learn
          db="$target/data/solana_sibot.sqlite3"
          DB="$db" python3 - <<'PY'
          import os, sqlite3, json, re
          db=os.environ['DB']
          mints={
            'E30':'6Mfj9t4WMN1c6CMpYZm8GvJsW3TiE7SrbrBqpBRnmUgd',
            'BVKG':'BvKgVjsUQ8KV22RNKhk3btZHKSDdrRfziGad4ugTCcJS',
          }
          c=sqlite3.connect(db); c.row_factory=sqlite3.Row
          tables=[r[0] for r in c.execute("select name from sqlite_master where type='table' order by name")]
          print('tables='+','.join(tables))
          interesting_re=re.compile(r'(time|ts|date|age|mint|pool|liq|risk|score|decision|reason|status|entry|exit|price|impact|slip|leader|wallet|amount|cost|pnl|profit|loss|rug|holder|volume|route|source|signature|fee)',re.I)
          for t in tables:
              cols=[r[1] for r in c.execute('pragma table_info("%s")'%t)]
              mintcols=[x for x in cols if x.lower() in {'mint','token_mint','base_mint','output_mint','input_mint'} or x.lower().endswith('_mint')]
              if not mintcols: continue
              selected=[x for x in cols if interesting_re.search(x)]
              if not selected: selected=cols[:20]
              for label,mint in mints.items():
                  wh=[]; args=[]
                  for mc in mintcols:
                      wh.append('"%s"=?'%mc); args.append(mint)
                  q='select * from "%s" where %s order by rowid desc limit 30'%(t,' or '.join(wh))
                  try: rows=c.execute(q,args).fetchall()
                  except Exception as ex:
                      print('query_error|table=%s|err=%s'%(t,type(ex).__name__)); continue
                  if not rows: continue
                  print('=== %s TABLE %s rows=%d ==='%(label,t,len(rows)))
                  for row in reversed(rows):
                      d=dict(row); out={}
                      for k in selected:
                          v=d.get(k)
                          if v is None: continue
                          s=str(v).replace('\n',' ')
                          if len(s)>500: s=s[:500]+'...'
                          out[k]=s
                      print(json.dumps(out,sort_keys=True))
          # Full position rows, excluding no columns because this DB has no secret keys.
          if 'positions' in tables:
              cols=[r[1] for r in c.execute('pragma table_info(positions)')]
              for label,mint in mints.items():
                  row=c.execute('select * from positions where mint=? order by rowid desc limit 1',(mint,)).fetchone()
                  if row:
                      d=dict(row)
                      print('=== %s POSITION_FULL ==='%label)
                      print(json.dumps({k:(str(v)[:1000] if v is not None else None) for k,v in d.items()},sort_keys=True))
          c.close()
          PY
          echo '=== JOURNAL E30/BVKG ==='
          sudo -n journalctl -u learnerbot-learn.service --since '2026-08-27 00:00:00 UTC' --until '2026-08-28 16:17:00 UTC' --no-pager -o cat \
            | grep -E '6Mfj9t4W|BvKgVjsU|e30ca86e|714f2607' \
            | tail -400 || true
          echo '=== CSV/TEXT MATCHES ==='
          grep -RInE '6Mfj9t4WMN1c6CMpYZm8GvJsW3TiE7SrbrBqpBRnmUgd|BvKgVjsUQ8KV22RNKhk3btZHKSDdrRfziGad4ugTCcJS' \
            "$target" --include='*.csv' --include='*.json' --include='*.jsonl' --include='*.log' --include='*.txt' 2>/dev/null \
            | head -300 || true
          echo "learner_service=$(systemctl is-active learnerbot-learn.service || true)"
          echo 'trade_submitted=NO'
