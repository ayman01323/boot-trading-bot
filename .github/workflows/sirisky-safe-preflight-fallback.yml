name: SiRisky Live Monitoring

on:
  push:
    paths:
      - '.github/workflows/sirisky-safe-preflight-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable-monitoring:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Enable live monitoring only
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          sudo -n true
          sudo -n python3 -c "import csv; p='/root/SiRisky/CSV/runtime.csv'; rows=list(csv.DictReader(open(p,encoding='utf-8-sig',newline=''))); [(r.update({'value':'1'}) if r.get('setting')=='live_enabled' else r.update({'value':'0'}) if r.get('setting') in {'broadcast_enabled','telegram_manual_run_enabled'} else None) for r in rows]; f=open(p,'w',encoding='utf-8',newline=''); w=csv.DictWriter(f,fieldnames=['setting','value','notes']); w.writeheader(); w.writerows(rows); f.close()"
          sudo -n systemctl restart sirisky.service
          sleep 3
          echo '=== SERVICE ==='
          systemctl show sirisky.service -p ActiveState -p SubState -p Result -p WorkingDirectory --no-pager
          echo '=== GATES ==='
          sudo -n awk -F, 'NR==1 || $1 ~ /^(live_enabled|broadcast_enabled|telegram_manual_run_enabled)$/' /root/SiRisky/CSV/runtime.csv
          echo 'real_transaction_broadcast=NO'
