name: SiRisky Show Auto Candidates

on:
  push:
    paths:
      - '.github/workflows/sirisky-show-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Test current SiRisky live connectivity safely
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          sudo -n true
          echo '=== SERVICE ==='
          systemctl show sirisky.service -p ActiveState -p SubState -p Result -p WorkingDirectory --no-pager
          test "$(systemctl is-active sirisky.service)" = 'active'
          echo '=== RPC HOSTS ONLY ==='
          sudo -n bash -lc 'cd /root/SiRisky && PYTHONPATH=. .venv/bin/python - <<"PY"
from urllib.parse import urlparse
from sirisky.config import Settings
s=Settings.load()
for label in ("http","ws"):
    u=s.resolve_rpc(label)
    p=urlparse(u)
    print(label+"_scheme="+str(p.scheme))
    print(label+"_host="+str(p.hostname or "MISSING"))
    print(label+"_configured="+str(bool(u)).lower())
PY'
          echo '=== SAFE LIVE CHECK ==='
          sudo -n bash -lc 'cd /root/SiRisky && PYTHONPATH=. .venv/bin/python run.py check'
          echo '=== AUTO SETTINGS ==='
          sudo -n awk -F, 'NR==1 || $1 ~ /^(live_enabled|broadcast_enabled|manual_approval_enabled|manual_approval_require_external_signature|auto_discovery_enabled|auto_discovery_interval_seconds)$/' /root/SiRisky/CSV/runtime.csv
          echo '=== CANDIDATE COUNT ==='
          sudo -n awk 'END{print NR-1}' /root/SiRisky/CSV/stage1_candidates.csv
          echo '=== SAFETY ==='
          test "$(sudo -n awk -F, '$1=="live_enabled"{print $2}' /root/SiRisky/CSV/runtime.csv | tr -d '\r')" = '1'
          test "$(sudo -n awk -F, '$1=="broadcast_enabled"{print $2}' /root/SiRisky/CSV/runtime.csv | tr -d '\r')" = '0'
          echo 'live_monitoring_test=PASS'
          echo 'real_transaction_broadcast=NO'
