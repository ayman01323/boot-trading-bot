name: SiRisky Show Auto Candidates

on:
  push:
    paths:
      - '.github/workflows/sirisky-show-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Show current SiRisky automatic candidates and approval integration points
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          sudo -n true
          echo '=== SERVICE ==='
          systemctl show sirisky.service -p ActiveState -p SubState -p Result -p WorkingDirectory --no-pager
          echo '=== AUTO SETTINGS ==='
          sudo -n awk -F, 'NR==1 || $1 ~ /^(live_enabled|broadcast_enabled|telegram_manual_run_enabled|auto_discovery_enabled|auto_discovery_interval_seconds|auto_candidate_limit|auto_min_liquidity_usd|auto_max_age_seconds|auto_promote_to_selected)$/' /root/SiRisky/CSV/runtime.csv
          echo '=== STAGE 1 CANDIDATES ==='
          sudo -n head -n 8 /root/SiRisky/CSV/stage1_candidates.csv
          echo '=== FILE LIST ==='
          sudo -n find /root/SiRisky/sirisky -maxdepth 1 -type f -printf '%f\n' | sort
          echo '=== ENGINE ==='
          sudo -n sed -n '1,260p' /root/SiRisky/sirisky/engine.py
          echo '=== STAGE4 ==='
          sudo -n sed -n '1,260p' /root/SiRisky/sirisky/stage4_dispatch.py
          echo '=== STAGE5 ==='
          sudo -n sed -n '1,340p' /root/SiRisky/sirisky/stage5_trade.py
          echo '=== TELEGRAM ==='
          sudo -n sed -n '1,300p' /root/SiRisky/sirisky/telegram.py || true
          echo '=== MODELS ==='
          sudo -n sed -n '1,300p' /root/SiRisky/sirisky/models.py
          echo '=== CONFIG ==='
          sudo -n sed -n '1,320p' /root/SiRisky/sirisky/config.py
          echo '=== RUN ==='
          sudo -n sed -n '1,360p' /root/SiRisky/run.py
          echo '=== SAFETY ==='
          test "$(sudo -n awk -F, '$1=="broadcast_enabled"{print $2}' /root/SiRisky/CSV/runtime.csv | tr -d '\r')" = '0'
          echo 'real_transaction_broadcast=NO'
