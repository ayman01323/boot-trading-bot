name: Six-Agent Health Recovery CI

on:
  pull_request:
    paths:
      - '.github/workflows/deepseek-fifth-engineering-agent.yml'
      - '.github/workflows/deepseek-fifth-strategy-agent.yml'
      - '.github/workflows/six-agent-health-retry.yml'
      - '.github/workflows/six-agent-health-retry-ci.yml'
      - 'tests/test_six_agent_health_retry.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate health workflow YAML and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest pyyaml
          python - <<'PY'
          import pathlib, yaml
          for path in (
              '.github/workflows/deepseek-fifth-engineering-agent.yml',
              '.github/workflows/deepseek-fifth-strategy-agent.yml',
              '.github/workflows/six-agent-health-retry.yml',
          ):
              data=yaml.safe_load(pathlib.Path(path).read_text(encoding='utf-8'))
              assert isinstance(data, dict), path
          PY
          pytest -q tests/test_six_agent_health_retry.py