name: Six-Agent Health Retry (Deprecated Compatibility)

on:
  push:
    branches: [main]
    paths:
      - '.github/six-agent-health-retry.trigger'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: six-agent-health-retry-compat
  cancel-in-progress: true

jobs:
  delegate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delegate explicit legacy request to seven-agent recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ai-agent-recovery.yml --ref main -f repair=true
          echo 'Six-agent scheduled retry is retired; the seven-agent recovery watch is authoritative.'
