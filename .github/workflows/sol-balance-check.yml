name: VPS Solana Balance Check

on:
  push:
    branches: [agent/sol-balance-check]

permissions:
  contents: read

jobs:
  balance:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Read bot runtime Solana balance probe
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BOT RUNTIME SOLANA BALANCE ==='
          test -f /tmp/learnerbot_solana_balance_probe.txt
          cat /tmp/learnerbot_solana_balance_probe.txt
