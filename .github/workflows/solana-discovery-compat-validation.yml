name: Solana Discovery Compatibility Validation

on:
  push:
    branches:
      - agent/solana-discovery-compat-ci
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/solana-discovery-compat-ci'
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    env:
      CI_VENV: /tmp/solana-discovery-compat-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CI_VENV"
          python3 -m venv "$CI_VENV"
          "$CI_VENV/bin/python" -m pip install --disable-pip-version-check -q --upgrade pip
          "$CI_VENV/bin/python" -m pip install --disable-pip-version-check -q -r requirements.txt pytest

      - name: Compile changed runtime modules
        run: "$CI_VENV/bin/python" -m compileall -q learnerbot tests

      - name: Import order and compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" -m pytest -q \
            tests/test_imports.py \
            tests/test_main_import_order.py \
            tests/test_telegram_trade_blocker_health.py \
            tests/test_solana_leader_discovery_coverage.py

      - name: Solana safety regression subset
        shell: bash
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" -m pytest -q \
            tests/test_solana_profit_guard.py \
            tests/test_solana_live_canary.py \
            tests/test_solana_execution_safety.py \
            tests/test_solana_execution_validation.py \
            tests/test_solana_worker_reliability.py \
            tests/test_solana_runtime_composition.py \
            tests/test_solana_positive_edge_entry_gate.py \
            tests/test_solana_liquidity_fail_closed.py \
            tests/test_solana_profit_first_live_correction.py

      - name: Clean isolated environment
        if: always()
        shell: bash
        run: rm -rf "$CI_VENV"
