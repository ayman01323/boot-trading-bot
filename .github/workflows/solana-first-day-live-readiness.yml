name: Solana First-Day LIVE Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solana-first-day-live-readiness.yml'
      - '.github/solana-first-day-live-readiness.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solana-first-day-live-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 8
    steps:
      - name: Capture read-only production readiness evidence
        shell: bash
        run: |
          set +e
          {
            echo '=== PRODUCTION STATUS ==='
            sudo -n /usr/local/sbin/status-boot-trading-bot
            status_rc=$?
            echo "status_rc=$status_rc"
            echo
            echo '=== SIBOT LEADER GATE ==='
            sudo -n /usr/local/sbin/run-sibot-leader-gate-report
            gate_rc=$?
            echo "leader_gate_rc=$gate_rc"
          } 2>&1 | tee /tmp/solana-first-day-readiness.txt
          exit 0

      - name: Publish sanitised readiness evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/solana-first-day-readiness.txt')
          text=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          text=re.sub(r'(?i)(api[_-]?key\s*[:=]\s*)\S+',r'\1<redacted>',text)
          text=re.sub(r'(?i)(authorization\s*[:=]\s*bearer\s+)\S+',r'\1<redacted>',text)
          Path('/tmp/solana-first-day-readiness-sanitised.txt').write_text(text[-40000:]+'\n',encoding='utf-8')
          PY
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-solana-first-day-readiness.txt"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/solana-first-day-readiness-sanitised.txt)"
          python3 - "$encoded" "$existing_sha" <<'PY' > /tmp/readiness-put.json
          import json,sys
          out={'message':'Update Solana first-day LIVE readiness evidence','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: out['sha']=sys.argv[2]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/readiness-put.json >/dev/null
