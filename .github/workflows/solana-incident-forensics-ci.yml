name: Solana Incident Forensics CI

on:
  pull_request:
    paths:
      - 'learnerbot/solana_incident_forensics_patch.py'
      - 'learnerbot/__main__.py'
      - 'tests/test_solana_incident_forensics.py'
      - '.github/workflows/solana-incident-forensics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 8
    env:
      VENV: /tmp/solana-incident-forensics-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test sanitised read-only incident report
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q pytest requests
          "$VENV/bin/python" -m py_compile learnerbot/solana_incident_forensics_patch.py tests/test_solana_incident_forensics.py
          "$VENV/bin/python" -m pytest -q tests/test_solana_incident_forensics.py
      - name: Verify reporting-only safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mode=ro' learnerbot/solana_incident_forensics_patch.py
          grep -q 'PRAGMA query_only=ON' learnerbot/solana_incident_forensics_patch.py
          grep -q 'leader_id.*_anon' learnerbot/solana_incident_forensics_patch.py
          grep -q 'git_sha' learnerbot/solana_incident_forensics_patch.py
          grep -q 'interpretation_guard' learnerbot/solana_incident_forensics_patch.py
          ! grep -Eq 'set_user_setting|live_enabled\s*=|stop_loss_pct.*=|take_profit_pct.*=' learnerbot/solana_incident_forensics_patch.py
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$VENV"
