name: Solana Moderate Leader Quality Test

on:
  push:
    branches:
      - gpt/solana-moderate-bar-20260824
    paths:
      - 'learnerbot/solana_leader_quality_restore_patch.py'
      - 'tests/test_solana_moderate_leader_quality.py'
      - '.github/workflows/solana-moderate-leader-quality-test.yml'

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
      - name: Compile changed policy
        run: python -m py_compile learnerbot/solana_leader_quality_restore_patch.py
      - name: Run focused policy and runtime composition tests
        run: >-
          python -m pytest -q
          tests/test_solana_moderate_leader_quality.py
          tests/test_solana_runtime_composition.py
