name: Solana Moderate Leader Quality Test

on:
  push:
    branches:
      - gpt/solana-moderate-bar-20260824
    paths:
      - 'learnerbot/solana_leader_quality_restore_patch.py'
      - 'tests/test_solana_moderate_leader_quality.py'
      - '.github/workflows/solana-moderate-leader-quality-test.yml'

permissions:
  contents: write

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
      - name: Compile and test
        id: focused
        shell: bash
        run: |
          set +e
          python -m py_compile learnerbot/solana_leader_quality_restore_patch.py
          compile_rc=$?
          python -m pytest -q \
            tests/test_solana_moderate_leader_quality.py \
            tests/test_solana_runtime_composition.py \
            2>&1 | tee /tmp/solana-moderate-test.txt
          pytest_rc=${PIPESTATUS[0]}
          echo "compile_rc=$compile_rc" >> "$GITHUB_OUTPUT"
          echo "pytest_rc=$pytest_rc" >> "$GITHUB_OUTPUT"
          [[ $compile_rc -eq 0 && $pytest_rc -eq 0 ]]
      - name: Publish focused-test attestation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_RC: ${{ steps.focused.outputs.compile_rc }}
          PYTEST_RC: ${{ steps.focused.outputs.pytest_rc }}
          TEST_OUTCOME: ${{ steps.focused.outcome }}
        run: |
          set -euo pipefail
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "test_outcome=${TEST_OUTCOME:-unknown}"
            echo "compile_rc=${COMPILE_RC:-unknown}"
            echo "pytest_rc=${PYTEST_RC:-unknown}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "=== PYTEST ==="
            cat /tmp/solana-moderate-test.txt 2>/dev/null || true
          } > /tmp/attestation.txt
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-solana-moderate-leader-quality-test.txt"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/attestation.txt)"
          python - "$encoded" "$existing_sha" <<'PY' > /tmp/put.json
          import json,sys
          out={'message':'Update Solana moderate leader quality test attestation','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: out['sha']=sys.argv[2]
          print(json.dumps(out))
          PY
          gh api -X PUT "$api" --input /tmp/put.json >/dev/null
