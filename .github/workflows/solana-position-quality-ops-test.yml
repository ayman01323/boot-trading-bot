name: Solana Position Quality Ops Test

on:
  push:
    branches:
      - ops/test-solana-position-quality-20260824
    paths:
      - '.github/solana-position-quality-test.trigger'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
      - name: Compile and run focused tests
        id: focused
        shell: bash
        run: |
          set +e
          python -m py_compile learnerbot/solana_position_history_patch.py learnerbot/solana_profit_guard_patch.py
          compile_rc=$?
          python -m pytest -q tests/test_solana_position_quality_metrics.py 2>&1 | tee /tmp/position-quality-pytest.txt
          pytest_rc=${PIPESTATUS[0]}
          echo "compile_rc=$compile_rc" >> "$GITHUB_OUTPUT"
          echo "pytest_rc=$pytest_rc" >> "$GITHUB_OUTPUT"
          [[ $compile_rc -eq 0 && $pytest_rc -eq 0 ]]
      - name: Publish focused test attestation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_RC: ${{ steps.focused.outputs.compile_rc }}
          PYTEST_RC: ${{ steps.focused.outputs.pytest_rc }}
          TEST_OUTCOME: ${{ steps.focused.outcome }}
        run: |
          set -euo pipefail
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "test_outcome=${TEST_OUTCOME:-unknown}"
            echo "compile_rc=${COMPILE_RC:-unknown}"
            echo "pytest_rc=${PYTEST_RC:-unknown}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "=== PYTEST ==="
            cat /tmp/position-quality-pytest.txt 2>/dev/null || true
          } > /tmp/position-quality-attestation.txt
          api="repos/${GITHUB_REPOSITORY}/contents/diagnostics/latest-solana-position-quality-test.txt"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/position-quality-attestation.txt)"
          python - "$encoded" "$existing_sha" <<'PY' > /tmp/put.json
          import json,sys
          d={'message':'Update Solana position quality test attestation','content':sys.argv[1],'branch':'server-diagnostics'}
          if sys.argv[2]: d['sha']=sys.argv[2]
          print(json.dumps(d))
          PY
          gh api -X PUT "$api" --input /tmp/put.json >/dev/null
