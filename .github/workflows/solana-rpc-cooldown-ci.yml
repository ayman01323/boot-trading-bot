name: Solana RPC Cooldown CI

on:
  push:
    branches:
      - fix/solana-rpc-429-cooldown
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 15
    env:
      CI_VENV: /tmp/solana-rpc-cooldown-ci-${{ github.run_id }}
    steps:
      - name: Verify isolated Google runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323

      - name: Checkout tested branch without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CI_VENV"
          python3 -m venv "$CI_VENV"
          "$CI_VENV/bin/python" -m pip install --disable-pip-version-check -q --upgrade pip
          "$CI_VENV/bin/python" -m pip install --disable-pip-version-check -q -r requirements.txt pytest

      - name: Compile changed RPC code and tests
        shell: bash
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" -m py_compile \
            learnerbot/solana_rpc_failover_patch.py \
            tests/test_solana_rpc_failover.py

      - name: Run focused RPC and composition regression tests
        shell: bash
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" -m pytest -q \
            tests/test_solana_rpc_failover.py \
            tests/test_solana_worker_reliability.py \
            tests/test_solana_runtime_composition.py

      - name: Prove no production state mutation
        if: always()
        shell: bash
        run: |
          echo 'production_service_changed=false'
          echo 'runtime_env_read=false'
          echo 'rpc_urls_logged=false'

      - name: Clean isolated environment
        if: always()
        shell: bash
        run: rm -rf "$CI_VENV"
