name: Stage Google Root Backup Helper

on:
  push:
    paths:
      - '.github/workflows/stage-google-root-backup-helper.yml'
      - 'scripts/google-root-backup'
      - 'scripts/install-google-root-backup-helper'
      - 'config/google-root-backup.sudoers'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-google-root-backup-helper
  cancel-in-progress: true

jobs:
  stage:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 180
    steps:
      - name: Stage reviewed helper files under BOOT
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'botgoogle'
          test "$(id -un)" = 'ayman01323'

          rm -rf /home/ayman01323/.google-backup-helper

          STAGE=/home/ayman01323/BOOT/.backup-helper
          rm -rf "$STAGE"
          mkdir -p "$STAGE/scripts" "$STAGE/config"
          chmod 700 "$STAGE" "$STAGE/scripts" "$STAGE/config"

          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl -fsSL "$BASE/scripts/google-root-backup" -o "$STAGE/scripts/google-root-backup"
          curl -fsSL "$BASE/config/google-root-backup.sudoers" -o "$STAGE/config/google-root-backup.sudoers"
          curl -fsSL "$BASE/scripts/install-google-root-backup-helper" -o "$STAGE/scripts/install-google-root-backup-helper"
          chmod 700 "$STAGE/scripts/google-root-backup" "$STAGE/scripts/install-google-root-backup-helper"
          chmod 600 "$STAGE/config/google-root-backup.sudoers"

          bash -n "$STAGE/scripts/google-root-backup"
          bash -n "$STAGE/scripts/install-google-root-backup-helper"
          grep -Fx 'ayman01323 ALL=(root) NOPASSWD: /usr/local/sbin/google-root-backup' "$STAGE/config/google-root-backup.sudoers"

          echo "staged=$STAGE"
          find "$STAGE" -maxdepth 2 -type f -printf '%m %u:%g %p\n'

      - name: Backup BOOT now
        shell: bash
        env:
          TZ: Europe/London
        run: |
          set -euo pipefail
          umask 077
          SOURCE=/home/ayman01323/BOOT
          DEST_ROOT=/home/ayman01323/GoogleServerBuckup
          DAY_DIR="$DEST_ROOT/$(date +%Y-%m-%d)"
          WORK="$(mktemp -d /tmp/google-boot-now.XXXXXX)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$DAY_DIR"
          chmod 700 "$DEST_ROOT" "$DAY_DIR"

          tar --warning=no-file-changed -C "$SOURCE" -czf "$WORK/boot.tar.gz" . || rc=$?
          rc="${rc:-0}"
          if [ "$rc" -gt 1 ]; then
            echo "BOOT tar failed with rc=$rc" >&2
            exit "$rc"
          fi
          tar -tzf "$WORK/boot.tar.gz" >/dev/null
          entries="$(tar -tzf "$WORK/boot.tar.gz" | wc -l)"
          bytes="$(stat -c '%s' "$WORK/boot.tar.gz")"
          test "$entries" -ge 5
          test "$bytes" -ge 4096
          (cd "$WORK" && sha256sum boot.tar.gz > boot.tar.gz.sha256)
          printf 'source=%s\nentries=%s\nbytes=%s\ncreated_london=%s\n' \
            "$SOURCE" "$entries" "$bytes" "$(date '+%Y-%m-%d %H:%M:%S %Z')" > "$WORK/boot.stats"
          install -m 600 "$WORK/boot.tar.gz" "$DAY_DIR/boot.tar.gz"
          install -m 600 "$WORK/boot.tar.gz.sha256" "$DAY_DIR/boot.tar.gz.sha256"
          install -m 600 "$WORK/boot.stats" "$DAY_DIR/boot.stats"
          cd "$DAY_DIR"
          sha256sum -c boot.tar.gz.sha256
          echo "BOOT backup completed: $DAY_DIR"
          cat boot.stats
          ls -lh boot.tar.gz boot.tar.gz.sha256 boot.stats

      - name: Verify installed restricted helper
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/google-root-backup
          cmp -s /home/ayman01323/BOOT/.backup-helper/scripts/google-root-backup /usr/local/sbin/google-root-backup || {
            echo 'ERROR: installed helper needs the reviewed BOOT update.' >&2
            echo 'Run once:' >&2
            echo 'sudo bash /home/ayman01323/BOOT/.backup-helper/scripts/install-google-root-backup-helper /home/ayman01323/BOOT/.backup-helper' >&2
            exit 1
          }
          sudo -n -l /usr/local/sbin/google-root-backup >/dev/null
          echo 'Installed helper and restricted sudo rule verified.'

      - name: Run protected backup now
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/google-root-backup

      - name: Verify today protected backup
        shell: bash
        env:
          TZ: Europe/London
        run: |
          set -euo pipefail
          DAY_DIR="/home/ayman01323/GoogleServerBuckup/$(date +%Y-%m-%d)"
          cd "$DAY_DIR"
          for label in claude-server production-bot sirisky; do
            test -s "$label.tar.gz"
            test -s "$label.tar.gz.sha256"
            test -s "$label.stats"
            sha256sum -c "$label.tar.gz.sha256"
            entries="$(awk -F= '$1=="entries"{print $2}' "$label.stats")"
            bytes="$(awk -F= '$1=="bytes"{print $2}' "$label.stats")"
            test "${entries:-0}" -ge 5
            test "${bytes:-0}" -ge 4096
          done
          test -s google-protected-folders-manifest.txt
          echo "verified_day_dir=$DAY_DIR"
          cat claude-server.stats production-bot.stats sirisky.stats
          ls -lh claude-server.tar.gz production-bot.tar.gz sirisky.tar.gz google-protected-folders-manifest.txt
