name: Strategy Factory MCP Bridge CI

on:
  pull_request:
    paths:
      - '.github/workflows/strategy-factory-mcp-bridge-ci.yml'
      - 'requirements-mcp-bridge.txt'
      - 'scripts/strategy_factory_mcp_core.py'
      - 'scripts/strategy_factory_mcp_bridge.py'
      - 'scripts/strategy_factory_transport.py'
      - 'scripts/master_change_policy.py'
      - 'tests/test_strategy_factory_mcp_bridge.py'
      - 'docs/GEMINI_SPARK_MCP_BRIDGE.md'

permissions:
  contents: read

jobs:
  mcp-bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run dependency-light bridge safety tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'pytest>=8,<9' 'websockets>=15,<16'
          python -m py_compile scripts/strategy_factory_mcp_core.py scripts/strategy_factory_mcp_bridge.py
          pytest -q tests/test_strategy_factory_mcp_bridge.py

      - name: Verify real MCP v2 server imports in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/mcp-bridge-venv"
          "$RUNNER_TEMP/mcp-bridge-venv/bin/python" -m pip install --disable-pip-version-check -q -r requirements-mcp-bridge.txt
          "$RUNNER_TEMP/mcp-bridge-venv/bin/python" - <<'PY'
          import os
          from scripts import strategy_factory_mcp_bridge as bridge

          assert bridge._listen_settings() == ('127.0.0.1', 8790, '/mcp')
          os.environ['STRATEGY_MCP_HOST'] = '0.0.0.0'
          try:
              bridge._listen_settings()
          except RuntimeError as exc:
              assert 'non-loopback' in str(exc)
          else:
              raise AssertionError('public bind was not refused')
          print('mcp_bridge_import=PASS')
          print('public_bind_guard=PASS')
          PY
