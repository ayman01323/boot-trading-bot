name: Strategy Factory MCP Bridge CI

on:
  pull_request:
    paths:
      - '.github/workflows/strategy-factory-mcp-bridge-ci.yml'
      - 'requirements-mcp-bridge.txt'
      - 'scripts/strategy_factory_mcp_core.py'
      - 'scripts/strategy_factory_mcp_bridge.py'
      - 'scripts/strategy_factory_transport.py'
      - 'scripts/master_change_policy.py'
      - 'tests/test_strategy_factory_mcp_bridge.py'
      - 'docs/GEMINI_SPARK_MCP_BRIDGE.md'

permissions:
  contents: read

jobs:
  mcp-bridge-tests:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run dependency-light bridge safety tests
        shell: bash
        run: |
          set -euo pipefail
          unit="$RUNNER_TEMP/mcp-bridge-unit-venv"
          rm -rf "$unit"
          python3 -m venv "$unit"
          "$unit/bin/python" -m pip install --disable-pip-version-check -q 'pytest>=8,<9' 'websockets>=15,<16'
          "$unit/bin/python" -m py_compile scripts/strategy_factory_mcp_core.py scripts/strategy_factory_mcp_bridge.py
          "$unit/bin/python" -m pytest -q tests/test_strategy_factory_mcp_bridge.py

      - name: Verify real MCP v2 server imports in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.11 >/dev/null 2>&1
          python3.11 --version
          bridge="$RUNNER_TEMP/mcp-bridge-real-venv"
          rm -rf "$bridge"
          python3.11 -m venv "$bridge"
          "$bridge/bin/python" -m pip install --disable-pip-version-check -q -r requirements-mcp-bridge.txt
          "$bridge/bin/python" - <<'PY'
          import os
          from scripts import strategy_factory_mcp_bridge as bridge

          assert bridge._listen_settings() == ('127.0.0.1', 8790, '/mcp')
          os.environ['STRATEGY_MCP_HOST'] = '0.0.0.0'
          try:
              bridge._listen_settings()
          except RuntimeError as exc:
              assert 'non-loopback' in str(exc)
          else:
              raise AssertionError('public bind was not refused')
          print('mcp_bridge_import=PASS')
          print('public_bind_guard=PASS')
          PY

      - name: Remove isolated MCP test environments
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mcp-bridge-unit-venv" "$RUNNER_TEMP/mcp-bridge-real-venv"
