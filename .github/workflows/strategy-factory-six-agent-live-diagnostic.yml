name: RPC WebSocket Production Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/strategy-factory-six-agent-live-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: rpc-ws-production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build sender environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/rpc-ws-audit"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Read compact per-endpoint RPC matrix
        shell: bash
        run: |
          set -euo pipefail
          output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
            --from gpt \
            --to kimi \
            --message-id "rpc-compact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --timeout 90 \
            --task-action READ_FILE \
            --task-args-json '{"path":"data/rpc_health_rpc_compact.json"}' \
            --task-instruction 'Return the sanitized compact RPC health matrix only. Do not expose URLs, API keys, wallets or secrets.')"
          printf '%s\n' "$output"
          final="$(printf '%s\n' "$output" | tail -n 1)"
          FINAL="$final" python3 - <<'PY'
          import json,os
          outer=json.loads(os.environ['FINAL'])
          result=json.loads(str(outer.get('body') or '{}'))
          content=str((result.get('evidence') or {}).get('content') or '')
          print('RPC_COMPACT_BEGIN')
          print(content)
          print('RPC_COMPACT_END')
          PY

      - name: Search Polygon WSS records in latest sanitized report
        shell: bash
        run: |
          set -euo pipefail
          for q in '"chain": "polygon"' '"provider": "Infura"' '"provider": "Alchemy"'; do
            args="$(python3 -c 'import json,sys; print(json.dumps({"path":"data","query":sys.argv[1]}))' "$q")"
            output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
              --from gpt \
              --to kimi \
              --message-id "rpc-search-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(echo "$q" | tr -cd '[:alnum:]' | head -c 16)" \
              --timeout 90 \
              --task-action SEARCH_CODE \
              --task-args-json "$args" \
              --task-instruction 'Search sanitized health telemetry only. Do not read or expose endpoint configuration or secrets.')"
            printf '%s\n' "$output"
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "${VENV:-$RUNNER_TEMP/rpc-ws-audit}"
