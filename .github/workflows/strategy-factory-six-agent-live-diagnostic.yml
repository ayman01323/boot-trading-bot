name: Strategy Factory Six-Agent Live Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/strategy-factory-six-agent-live-diagnostic.yml'
      - 'learnerbot/ai_agent_ws_runtime_patch.py'
      - 'scripts/ai_agent_ws_worker.py'
      - 'scripts/ai_agent_ws_send.py'
      - 'learnerbot/grok_provider.py'
      - 'learnerbot/strategy_room.py'
      - 'learnerbot/ai_health_compact_report_patch.py'

permissions:
  contents: read

concurrency:
  group: strategy-factory-six-agent-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-diagnostic:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 15
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify six-agent Strategy Factory runtime
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet learnerbot
          test -s /var/tmp/boot/ai_agent_ws_status.json
          python3 - <<'PY'
          import json, time
          p='/var/tmp/boot/ai_agent_ws_status.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('state') in {'ACTIVE','EXTERNAL'}, d.get('state')
          assert d.get('host') == '127.0.0.1'
          assert int(d.get('port') or 0) == 8765
          expected={'gpt','claude','gemini','deepseek','grok','copilot'}
          assert set(d.get('workers') or []) == expected, d.get('workers')
          age=int(time.time())-int(d.get('updated_epoch') or 0)
          assert age < 86400, age
          print('runtime_state='+str(d.get('state')))
          print('workers='+','.join(d.get('workers') or []))
          print('status_age_seconds='+str(age))
          PY

      - name: Build isolated diagnostic environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/strategy-factory-six-agent-live-diagnostic"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Probe all six providers strictly
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            sender="$1"
            target="$2"
            mid="sf6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${target}"
            set +e
            output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
              --from "$sender" \
              --to "$target" \
              --message-id "$mid" \
              --timeout 90 \
              --message 'Strategy Factory six-agent live health probe. Reply HEALTH_OK only. Do not modify files, services, trading, wallets, risk, capital, or secrets.' 2>&1)"
            sender_rc=$?
            set -e
            printf '%s\n' "$output"
            if [[ $sender_rc -ne 0 ]]; then
              echo "${target}_provider_health=FAILED sender_rc=${sender_rc}"
              return 1
            fi
            final="$(printf '%s\n' "$output" | tail -n 1)"
            TARGET="$target" FINAL="$final" python3 - <<'PY'
          import json, os
          target=os.environ['TARGET']
          value=json.loads(os.environ['FINAL'])
          assert value.get('type') == 'reply', (target,value)
          assert value.get('status') == 'REPLIED', (target,value.get('status'))
          assert int(value.get('provider_rc') or 0) == 0, (target,value.get('provider_rc'),value.get('error'))
          assert str(value.get('body') or '').strip() == 'HEALTH_OK', (target,value.get('body'))
          print(f'{target}_provider_health=HEALTH_OK')
          PY
          }
          failures=0
          probe gemini gpt || failures=$((failures+1))
          probe gpt claude || failures=$((failures+1))
          probe gpt gemini || failures=$((failures+1))
          probe gpt deepseek || failures=$((failures+1))
          probe gpt grok || failures=$((failures+1))
          probe gpt copilot || failures=$((failures+1))
          echo "provider_failures=$failures"
          test "$failures" -eq 0

      - name: Verify Grok bounded deterministic task executor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
            --from gpt \
            --to grok \
            --message-id "sf6-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --timeout 90 \
            --task-action GIT_STATUS \
            --task-args-json '{}' \
            --task-instruction 'Return bounded read-only git status evidence.')"
          printf '%s\n' "$output"
          final="$(printf '%s\n' "$output" | tail -n 1)"
          FINAL="$final" python3 - <<'PY'
          import json,os
          outer=json.loads(os.environ['FINAL'])
          assert outer.get('type') == 'reply', outer
          assert outer.get('status') == 'COMPLETED', outer
          result=json.loads(str(outer.get('body') or '{}'))
          assert result.get('status') == 'COMPLETED', result
          assert result.get('action') == 'GIT_STATUS', result
          assert int((result.get('evidence') or {}).get('returncode') or 0) == 0, result
          print('grok_bounded_task_health=COMPLETED')
          PY

      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf "${VENV:-$RUNNER_TEMP/strategy-factory-six-agent-live-diagnostic}"
