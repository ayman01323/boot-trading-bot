name: RPC WebSocket Production Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/strategy-factory-six-agent-live-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: rpc-ws-production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build sender environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/rpc-ws-audit"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Execute live RPC and WebSocket probe inside learnerbot
        id: probe
        shell: bash
        run: |
          set +e
          mid="rpc-health-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
            --from gpt \
            --to kimi \
            --message-id "$mid" \
            --timeout 240 \
            --task-action RUN_TESTS \
            --task-args-json '{"targets":["tests/test_runtime_rpc_health_probe.py::test_runtime_rpc_health_probe"],"timeout_seconds":180}' \
            --task-instruction 'Run the explicit read-only RPC/WSS health probe against production configuration. Do not modify trading, endpoints, services, wallets, risk or capital.' 2>&1)"
          rc=$?
          printf '%s\n' "$output"
          echo "sender_rc=$rc"
          final="$(printf '%s\n' "$output" | tail -n 1)"
          if [[ -n "$final" ]]; then
            FINAL="$final" python3 - <<'PY'
          import json,os
          try:
              outer=json.loads(os.environ['FINAL'])
              print('probe_terminal_status='+str(outer.get('status')))
              print('probe_delivered='+str(bool(outer.get('delivered'))).lower())
              print('probe_acknowledged='+str(bool(outer.get('acknowledged'))).lower())
              body=str(outer.get('body') or '')
              if body:
                  try:
                      result=json.loads(body)
                      print('probe_task_status='+str(result.get('status')))
                      print('probe_task_error='+str(result.get('error') or '')[:500])
                      evidence=result.get('evidence') or {}
                      print('probe_stdout='+str(evidence.get('stdout') or '')[-3000:].replace('\n',' | '))
                      print('probe_stderr='+str(evidence.get('stderr') or '')[-1600:].replace('\n',' | '))
                  except Exception:
                      print('probe_body_non_json='+body[:1000])
          except Exception as exc:
              print('probe_terminal_parse_error='+type(exc).__name__)
          PY
          fi
          exit 0

      - name: Read sanitised health report through bounded task
        if: always()
        shell: bash
        run: |
          set +e
          mid="rpc-health-read-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
            --from gpt \
            --to kimi \
            --message-id "$mid" \
            --timeout 90 \
            --task-action READ_FILE \
            --task-args-json '{"path":"data/rpc_health_latest.json"}' \
            --task-instruction 'Return the sanitised RPC/WSS health report only. Do not expose raw configuration, URLs, API keys, wallets or secrets.' 2>&1)"
          rc=$?
          printf '%s\n' "$output"
          echo "read_sender_rc=$rc"
          final="$(printf '%s\n' "$output" | tail -n 1)"
          if [[ -n "$final" ]]; then
            FINAL="$final" python3 - <<'PY'
          import json,os
          try:
              outer=json.loads(os.environ['FINAL'])
              result=json.loads(str(outer.get('body') or '{}'))
              evidence=result.get('evidence') or {}
              content=str(evidence.get('content') or '')
              print('RPC_HEALTH_REPORT_BEGIN')
              print(content)
              print('RPC_HEALTH_REPORT_END')
          except Exception as exc:
              print('report_parse_error='+type(exc).__name__)
          PY
          fi
          exit 0

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "${VENV:-$RUNNER_TEMP/rpc-ws-audit}"
