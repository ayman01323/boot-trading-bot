name: RPC WebSocket Production Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/strategy-factory-six-agent-live-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: rpc-ws-production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build sender environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/rpc-ws-audit"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Extract sanitized endpoint fields from latest report
        shell: bash
        run: |
          set -euo pipefail
          i=0
          for q in '"chain":' '"endpoint_index":' '"kind":' '"provider":' '"priority":' '"status":' '"error":' '"latency_ms":' '"reported_chain_id":'; do
            i=$((i+1))
            args="$(python3 -c 'import json,sys; print(json.dumps({"path":"data","query":sys.argv[1]}))' "$q")"
            output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
              --from gpt \
              --to kimi \
              --message-id "rpc-fields-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}" \
              --timeout 90 \
              --task-action SEARCH_CODE \
              --task-args-json "$args" \
              --task-instruction 'Search sanitized RPC health telemetry only. Do not expose endpoint URLs, API keys, wallets or secrets.')"
            final="$(printf '%s\n' "$output" | tail -n 1)"
            FIELD="$q" FINAL="$final" python3 - <<'PY'
          import json,os
          outer=json.loads(os.environ['FINAL'])
          result=json.loads(str(outer.get('body') or '{}'))
          matches=(result.get('evidence') or {}).get('matches') or []
          for m in matches:
              if m.get('path') == 'data/rpc_health_latest.json':
                  print('FIELD', os.environ['FIELD'], m.get('line'), m.get('text'))
          PY
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "${VENV:-$RUNNER_TEMP/rpc-ws-audit}"
