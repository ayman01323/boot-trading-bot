name: RPC WebSocket Production Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/strategy-factory-six-agent-live-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: rpc-ws-production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build sender environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/rpc-ws-audit"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Execute live RPC and WebSocket probe inside learnerbot
        shell: bash
        run: |
          set -euo pipefail
          mid="rpc-health-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
            --from gpt \
            --to kimi \
            --message-id "$mid" \
            --timeout 240 \
            --task-action RUN_TESTS \
            --task-args-json '{"targets":["tests/test_runtime_rpc_health_probe.py::test_runtime_rpc_health_probe"],"timeout_seconds":180}' \
            --task-instruction 'Run the explicit read-only RPC/WSS health probe against production configuration. Do not modify trading, endpoints, services, wallets, risk or capital.')"
          printf '%s\n' "$output"
          final="$(printf '%s\n' "$output" | tail -n 1)"
          FINAL="$final" python3 - <<'PY'
          import json,os
          outer=json.loads(os.environ['FINAL'])
          assert outer.get('status') == 'COMPLETED', outer
          assert outer.get('delivered') is True, outer
          assert outer.get('acknowledged') is True, outer
          assert not str(outer.get('error') or ''), outer
          result=json.loads(str(outer.get('body') or '{}'))
          assert result.get('status') == 'COMPLETED', result
          assert result.get('action') == 'RUN_TESTS', result
          print('RPC_HEALTH_TEST=COMPLETED')
          PY

      - name: Read sanitised health report through bounded task
        shell: bash
        run: |
          set -euo pipefail
          mid="rpc-health-read-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="$($VENV/bin/python scripts/ai_agent_ws_send.py \
            --from gpt \
            --to kimi \
            --message-id "$mid" \
            --timeout 90 \
            --task-action READ_FILE \
            --task-args-json '{"path":"data/rpc_health_latest.json"}' \
            --task-instruction 'Return the sanitised RPC/WSS health report only. Do not expose raw configuration, URLs, API keys, wallets or secrets.')"
          printf '%s\n' "$output"
          final="$(printf '%s\n' "$output" | tail -n 1)"
          FINAL="$final" python3 - <<'PY'
          import json,os
          outer=json.loads(os.environ['FINAL'])
          assert outer.get('status') == 'COMPLETED', outer
          result=json.loads(str(outer.get('body') or '{}'))
          assert result.get('status') == 'COMPLETED', result
          evidence=result.get('evidence') or {}
          content=str(evidence.get('content') or '')
          assert content, result
          print('RPC_HEALTH_REPORT_BEGIN')
          print(content)
          print('RPC_HEALTH_REPORT_END')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "${VENV:-$RUNNER_TEMP/rpc-ws-audit}"
