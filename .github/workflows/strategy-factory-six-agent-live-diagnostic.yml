name: Strategy Factory Seven-Agent Live Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/strategy-factory-six-agent-live-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: strategy-factory-seven-agent-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-diagnostic:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 25
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify seven-agent Strategy Factory runtime
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet learnerbot
          test -s /var/tmp/boot/ai_agent_ws_status.json
          python3 - <<'PY'
          import json,time
          d=json.load(open('/var/tmp/boot/ai_agent_ws_status.json',encoding='utf-8'))
          expected={'gpt','claude','gemini','deepseek','grok','kimi','copilot'}
          assert d.get('state') in {'ACTIVE','EXTERNAL'}, d
          assert d.get('host') == '127.0.0.1' and int(d.get('port') or 0) == 8765, d
          assert set(d.get('workers') or []) == expected, d.get('workers')
          assert int(time.time())-int(d.get('updated_epoch') or 0) < 86400, d
          print('workers='+','.join(sorted(expected)))
          PY

      - name: Build small isolated WebSocket client environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/six-basic-engine-design-${GITHUB_RUN_ID}"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q 'websockets>=15,<16'
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Ask six independent Basic Engine designers
        shell: bash
        run: |
          set -u
          read -r -d '' prompt <<'EOF' || true
          Design ONE independent, deliberately simple trading engine and ONE primary strategy to compete as a separate challenger beside the existing BOOT/main Basic Engine v0. Reason independently; do not copy BOOT merely for consistency.

          MONEY-FIRST CHAIN: choose the first blockchain/DEX by expected executable NET profit after gas, fees, slippage, latency and realistic trade frequency. Consider BSC, Base, Arbitrum, Polygon, Ethereum and Solana. State the chosen chain and why it is best for a small canary bot now; if evidence is insufficient, state the minimum measurement needed.

          Requirements: separate engine ID/module; one simple testable strategy; SHADOW first/no signing; log timestamp, chain, venue, route/pair, signal reason, input, gross, gas/fees, slippage reserve, expected net, simulation result and hypothetical outcome. Never weaken rug/sellability, liquidity, price-impact, simulation, reserve, signing, stop-loss, loss-quarantine, nonce or reconciliation controls. If promoted, use the existing hardened shared execution gateway. A future arbiter must allow only one engine to own a duplicate live opportunity. Prefer WebSocket/free RPC/cache/shared data and estimate incremental monthly API/RPC cost.

          Competition: Claude/Gemini/DeepSeek/Grok/Kimi/Copilot challengers all run SHADOW simultaneously while BOOT is unchanged. Common scorecard: net P&L after costs; profit/capital; win rate and counts; opportunity frequency; max drawdown/worst loss; quote-to-simulation survival; stale/invalid/revert rate; p50/p95 decision latency; RPC/API cost per qualified opportunity and simulated trade; safety-rejection rate/reason quality. Recommend minimum sample/time, tie-breaks, SHADOW->CANARY->LIVE criteria and automatic demotion. Goal is eventually ONE challenger beside BOOT, not six live spenders.

          Return exactly these headings:
          ENGINE_NAME
          FIRST_BLOCKCHAIN_AND_DEX
          STRATEGY
          WHY_MONEY_FIRST
          DATA_INPUTS_AND_ESTIMATED_COST
          SIGNAL_AND_ENTRY_RULES
          EXIT_OR_ATOMIC_COMPLETION
          RISK_AND_SAFETY
          SEPARATE_ENGINE_ARCHITECTURE
          COMMON_SCORECARD_FIELDS
          COMPETITION_AND_PROMOTION_RULES
          MINIMUM_BUILD_PLAN
          TOP_3_FAILURE_MODES
          ONE_SENTENCE_RECOMMENDATION

          Design/communication only. Do not edit files, deploy, restart, change LIVE/ARMED/risk/capital, access wallets/signing/secrets, or submit trades.
          EOF

          failures=0
          for agent in claude gemini deepseek grok kimi copilot; do
            echo "===== BEGIN ${agent^^} DESIGN ====="
            set +e
            "$VENV/bin/python" scripts/ai_agent_ws_send.py \
              --from gpt --to "$agent" \
              --subject 'Basic Engine Competition' \
              --message-id "basic-engine-${GITHUB_RUN_ID}-${agent}" \
              --timeout 180 --message "$prompt" \
              > "/tmp/${agent}-engine-design.log" 2>&1
            rc=$?
            set -e
            cat "/tmp/${agent}-engine-design.log"
            echo "RESULT_RC=$rc"
            echo "===== END ${agent^^} DESIGN ====="
            if [[ $rc -ne 0 ]]; then failures=$((failures+1)); fi
          done
          echo "DESIGN_FAILURES=$failures"
          test "$failures" -eq 0

      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf "${VENV:-$RUNNER_TEMP/six-basic-engine-design-${GITHUB_RUN_ID}}"
