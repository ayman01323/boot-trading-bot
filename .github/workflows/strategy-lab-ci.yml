name: Strategy Laboratory Tests

on:
  pull_request:
    paths:
      - 'learnerbot/strategy_lab.py'
      - 'learnerbot/strategy_lab_research.py'
      - 'learnerbot/strategy_lab_audit_patch.py'
      - 'learnerbot/strategy_ai_proposals.py'
      - 'learnerbot/cross_chain_strategy_signals.py'
      - 'learnerbot/market_feature_adapter.py'
      - 'learnerbot/shadow_strategy_executor.py'
      - 'learnerbot/profit_control_audit_export_patch.py'
      - 'tests/test_strategy_lab.py'
      - 'tests/test_strategy_ai_proposals.py'
      - 'tests/test_strategy_lab_cross_chain_research.py'
      - 'tests/test_cross_chain_strategy_signals.py'
      - 'tests/test_market_feature_shadow_executor.py'
      - 'docs/STRATEGY_LAB.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/hourly-gemini-strategy-review.yml'
      - '.github/workflows/strategy-lab-ci.yml'
  push:
    branches:
      - 'agent/strategy-laboratory'
      - 'release/strategy-lab-current'
      - 'release/cross-chain-shadow-strategies'
      - 'release/market-feature-shadow-executor'
    paths:
      - 'learnerbot/strategy_lab.py'
      - 'learnerbot/strategy_lab_research.py'
      - 'learnerbot/strategy_lab_audit_patch.py'
      - 'learnerbot/strategy_ai_proposals.py'
      - 'learnerbot/cross_chain_strategy_signals.py'
      - 'learnerbot/market_feature_adapter.py'
      - 'learnerbot/shadow_strategy_executor.py'
      - 'learnerbot/profit_control_audit_export_patch.py'
      - 'tests/test_strategy_lab.py'
      - 'tests/test_strategy_ai_proposals.py'
      - 'tests/test_strategy_lab_cross_chain_research.py'
      - 'tests/test_cross_chain_strategy_signals.py'
      - 'tests/test_market_feature_shadow_executor.py'
      - '.github/copilot-instructions.md'
      - '.github/workflows/hourly-gemini-strategy-review.yml'
      - '.github/workflows/strategy-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Compile strategy laboratory
        run: |
          python -m py_compile \
            learnerbot/strategy_lab.py \
            learnerbot/strategy_lab_research.py \
            learnerbot/strategy_lab_audit_patch.py \
            learnerbot/strategy_ai_proposals.py \
            learnerbot/cross_chain_strategy_signals.py \
            learnerbot/market_feature_adapter.py \
            learnerbot/shadow_strategy_executor.py \
            learnerbot/profit_control_audit_export_patch.py
      - name: Run strategy laboratory lifecycle, cross-chain and shadow-executor tests
        run: |
          pytest -x -vv \
            tests/test_strategy_lab.py \
            tests/test_strategy_ai_proposals.py \
            tests/test_strategy_lab_cross_chain_research.py \
            tests/test_cross_chain_strategy_signals.py \
            tests/test_market_feature_shadow_executor.py
