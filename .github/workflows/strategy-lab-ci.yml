name: Strategy Laboratory Tests

on:
  pull_request:
    paths:
      - 'learnerbot/strategy_lab.py'
      - 'learnerbot/strategy_lab_research.py'
      - 'learnerbot/strategy_lab_audit_patch.py'
      - 'learnerbot/strategy_external_research.py'
      - 'learnerbot/strategy_source_catalog.py'
      - 'learnerbot/strategy_source_extension.py'
      - 'learnerbot/strategy_ai_proposals.py'
      - 'learnerbot/cross_chain_strategy_signals.py'
      - 'learnerbot/market_feature_adapter.py'
      - 'learnerbot/shadow_strategy_executor.py'
      - 'learnerbot/strategy_canary.py'
      - 'learnerbot/profit_control_audit_export_patch.py'
      - 'learnerbot/three_agent_strategy_contract.py'
      - 'scripts/extract_strategy_report.py'
      - 'scripts/vps_deploy_attestation.py'
      - 'tests/test_strategy_lab.py'
      - 'tests/test_strategy_ai_proposals.py'
      - 'tests/test_strategy_lab_cross_chain_research.py'
      - 'tests/test_strategy_external_research.py'
      - 'tests/test_cross_chain_strategy_signals.py'
      - 'tests/test_market_feature_shadow_executor.py'
      - 'tests/test_three_agent_strategy_contract.py'
      - 'tests/test_strategy_canary.py'
      - 'tests/test_vps_deploy_attestation.py'
      - 'docs/STRATEGY_LAB.md'
      - 'docs/STRATEGY_SOURCE_RESEARCH.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/hourly-gemini-strategy-review.yml'
      - '.github/workflows/three-agent-strategy-review.yml'
      - '.github/workflows/gpt-master-strategy-action.yml'
      - '.github/workflows/deploy-vps.yml'
      - '.github/workflows/strategy-lab-ci.yml'
  push:
    branches:
      - 'agent/strategy-laboratory'
      - 'release/strategy-lab-current'
      - 'release/cross-chain-shadow-strategies'
      - 'release/market-feature-shadow-executor'
      - 'release/three-agent-strategy-cycle'
      - 'release/fast-canary-and-vps-attestation'
      - 'strategy-source-evidence'
    paths:
      - 'learnerbot/strategy_lab.py'
      - 'learnerbot/strategy_lab_research.py'
      - 'learnerbot/strategy_lab_audit_patch.py'
      - 'learnerbot/strategy_external_research.py'
      - 'learnerbot/strategy_source_catalog.py'
      - 'learnerbot/strategy_source_extension.py'
      - 'learnerbot/strategy_ai_proposals.py'
      - 'learnerbot/cross_chain_strategy_signals.py'
      - 'learnerbot/market_feature_adapter.py'
      - 'learnerbot/shadow_strategy_executor.py'
      - 'learnerbot/strategy_canary.py'
      - 'learnerbot/profit_control_audit_export_patch.py'
      - 'learnerbot/three_agent_strategy_contract.py'
      - 'scripts/extract_strategy_report.py'
      - 'scripts/vps_deploy_attestation.py'
      - 'tests/test_strategy_lab.py'
      - 'tests/test_strategy_ai_proposals.py'
      - 'tests/test_strategy_lab_cross_chain_research.py'
      - 'tests/test_strategy_external_research.py'
      - 'tests/test_cross_chain_strategy_signals.py'
      - 'tests/test_market_feature_shadow_executor.py'
      - 'tests/test_three_agent_strategy_contract.py'
      - 'tests/test_strategy_canary.py'
      - 'tests/test_vps_deploy_attestation.py'
      - 'docs/STRATEGY_SOURCE_RESEARCH.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/hourly-gemini-strategy-review.yml'
      - '.github/workflows/three-agent-strategy-review.yml'
      - '.github/workflows/gpt-master-strategy-action.yml'
      - '.github/workflows/deploy-vps.yml'
      - '.github/workflows/strategy-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Compile strategy laboratory, source research, canary and deployment attestation
        run: |
          python -m py_compile \
            learnerbot/strategy_lab.py \
            learnerbot/strategy_lab_research.py \
            learnerbot/strategy_lab_audit_patch.py \
            learnerbot/strategy_external_research.py \
            learnerbot/strategy_source_catalog.py \
            learnerbot/strategy_source_extension.py \
            learnerbot/strategy_ai_proposals.py \
            learnerbot/cross_chain_strategy_signals.py \
            learnerbot/market_feature_adapter.py \
            learnerbot/shadow_strategy_executor.py \
            learnerbot/strategy_canary.py \
            learnerbot/profit_control_audit_export_patch.py \
            learnerbot/three_agent_strategy_contract.py \
            scripts/extract_strategy_report.py \
            scripts/vps_deploy_attestation.py \
            tests/test_strategy_external_research.py \
            tests/test_three_agent_strategy_contract.py \
            tests/test_strategy_canary.py \
            tests/test_vps_deploy_attestation.py
      - name: Run Strategy Lab, source research, canary and guarded three-agent strategy tests
        run: |
          pytest -x -vv \
            tests/test_strategy_lab.py \
            tests/test_strategy_ai_proposals.py \
            tests/test_strategy_lab_cross_chain_research.py \
            tests/test_strategy_external_research.py \
            tests/test_cross_chain_strategy_signals.py \
            tests/test_market_feature_shadow_executor.py \
            tests/test_three_agent_strategy_contract.py \
            tests/test_strategy_canary.py \
            tests/test_vps_deploy_attestation.py
