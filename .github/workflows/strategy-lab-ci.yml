name: Strategy Laboratory Tests

on:
  pull_request:
    paths:
      - 'learnerbot/strategy_lab.py'
      - 'learnerbot/strategy_lab_audit_patch.py'
      - 'tests/test_strategy_lab.py'
      - 'docs/STRATEGY_LAB.md'
      - '.github/workflows/strategy-lab-ci.yml'
  push:
    branches:
      - 'agent/strategy-laboratory'
    paths:
      - 'learnerbot/strategy_lab.py'
      - 'learnerbot/strategy_lab_audit_patch.py'
      - 'tests/test_strategy_lab.py'
      - '.github/workflows/strategy-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Compile strategy laboratory
        run: python -m py_compile learnerbot/strategy_lab.py learnerbot/strategy_lab_audit_patch.py
      - name: Run strategy laboratory lifecycle tests
        run: pytest -x -vv tests/test_strategy_lab.py
