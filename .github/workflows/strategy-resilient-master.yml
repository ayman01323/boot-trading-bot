name: Resilient Strategy Master

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'Optional strategy cycle id; defaults to latest cycle'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: resilient-strategy-master
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install reconciliation tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          npm install -g @openai/codex@latest
          codex --version

      - name: Resolve immutable strategy cycle
        id: cycle
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CYCLE: ${{ inputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          cycle="${INPUT_CYCLE:-}"
          if [[ -z "$cycle" ]]; then
            set +e
            cycle="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/strategy/latest_cycle_id.txt?ref=ai-reviews" \
              --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null | tr -d '\r\n')"
            rc=$?
            set -e
            if [[ $rc -ne 0 || -z "$cycle" ]]; then
              echo 'No strategy cycle is available yet.'
              echo 'found=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [[ "$cycle" =~ ^[0-9a-f]{12}-[0-9]{10}-[0-9a-f]{8}$ ]] || { echo 'Invalid cycle id.' >&2; exit 2; }
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "id=$cycle" >> "$GITHUB_OUTPUT"

      - name: Collect whichever valid strategy reports exist
        if: steps.cycle.outputs.found == 'true'
        id: agents
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.cycle.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .strategy_resilient/agents
          root="strategy/runs/${CYCLE_ID}"

          get_ai_file() {
            local path="$1" out="$2"
            set +e
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=ai-reviews" --jq '.content' 2>/dev/null \
              | tr -d '\n' | base64 -d > "$out" 2>/dev/null
            rc=$?
            set -e
            [[ $rc -eq 0 && -s "$out" ]]
          }

          get_ai_file "${root}/context.json" .strategy_resilient/context.json || { echo 'Cycle context is missing.' >&2; exit 2; }
          python - .strategy_resilient/context.json <<'PY' > /tmp/strategy-meta.env
          import json,sys
          p=json.load(open(sys.argv[1]))
          print('SOURCE_SHA='+str(p.get('source_commit') or ''))
          print('EVIDENCE_SHA='+str(p.get('evidence_sha256') or ''))
          PY
          source /tmp/strategy-meta.env
          test -n "$SOURCE_SHA"; test -n "$EVIDENCE_SHA"

          valid=()
          missing=()
          : > .strategy_resilient/reasons.tsv
          for provider in gpt gemini; do
            out=".strategy_resilient/agents/${provider}.json"
            if get_ai_file "${root}/${provider}.json" "$out"; then
              set +e
              python -m learnerbot.three_agent_strategy_contract validate-agent \
                --input "$out" --provider "$provider" --cycle-id "$CYCLE_ID" \
                --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA" >/tmp/${provider}-strategy-validate.txt 2>&1
              rc=$?
              set -e
              status="$(python - "$out" <<'PY'
          import json,sys
          try: print(str(json.load(open(sys.argv[1])).get('status') or ''))
          except Exception: print('')
          PY
              )"
              if [[ $rc -eq 0 && "$status" != 'INCOMPLETE' ]]; then
                valid+=("$provider")
                printf '%s\t%s\n' "$provider" 'valid report' >> .strategy_resilient/reasons.tsv
              else
                missing+=("$provider")
                printf '%s\t%s\n' "$provider" 'report incomplete or invalid' >> .strategy_resilient/reasons.tsv
                rm -f "$out"
              fi
            else
              missing+=("$provider")
              printf '%s\t%s\n' "$provider" 'report file not available' >> .strategy_resilient/reasons.tsv
              rm -f "$out"
            fi
          done

          # Prefer a Copilot report already reconciled to ai-reviews; otherwise read
          # the exact two-file draft PR produced by Copilot for this immutable cycle.
          copilot_pr=''
          out=.strategy_resilient/agents/copilot.json
          if get_ai_file "${root}/copilot.json" "$out"; then
            copilot_pr="$(python - <<'PY'
          import json
          try:
              p=json.load(open('.strategy_resilient/context.json')); print(p.get('copilot_report_pr') or '')
          except Exception: print('')
          PY
            )"
          else
            while IFS=$'\t' read -r number head; do
              [[ -n "$number" ]] || continue
              files="$(gh pr diff "$number" --name-only 2>/dev/null || true)"
              count="$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')"
              if [[ "$count" == '2' ]] && \
                 grep -Fxq ".ai/strategy/copilot/${CYCLE_ID}.json" <<< "$files" && \
                 grep -Fxq ".ai/strategy/copilot/${CYCLE_ID}.md" <<< "$files"; then
                set +e
                gh api -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/contents/.ai/strategy/copilot/${CYCLE_ID}.json?ref=${head}" \
                  --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > "$out" 2>/dev/null
                rc=$?
                set -e
                if [[ $rc -eq 0 && -s "$out" ]]; then copilot_pr="$number"; break; fi
              fi
            done < <(gh pr list --state open --limit 100 --json number,headRefOid --jq '.[] | [.number,.headRefOid] | @tsv')
          fi

          if [[ -s "$out" ]]; then
            set +e
            python -m learnerbot.three_agent_strategy_contract validate-agent \
              --input "$out" --provider copilot --cycle-id "$CYCLE_ID" \
              --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA" >/tmp/copilot-strategy-validate.txt 2>&1
            rc=$?
            set -e
            status="$(python - "$out" <<'PY'
          import json,sys
          try: print(str(json.load(open(sys.argv[1])).get('status') or ''))
          except Exception: print('')
          PY
            )"
            if [[ $rc -eq 0 && "$status" != 'INCOMPLETE' ]]; then
              valid+=(copilot)
              printf '%s\t%s\n' copilot "valid report${copilot_pr:+ in PR #$copilot_pr}" >> .strategy_resilient/reasons.tsv
            else
              missing+=(copilot)
              printf '%s\t%s\n' copilot 'Copilot report incomplete or invalid' >> .strategy_resilient/reasons.tsv
              rm -f "$out"
            fi
          else
            missing+=(copilot)
            reason='Copilot report not delivered yet'
            assignment=.strategy_resilient/copilot-assignment.json
            if get_ai_file "${root}/copilot_assignment_reconciled.json" "$assignment"; then
              reason="$(python - "$assignment" <<'PY'
          import json,sys
          try:
              p=json.load(open(sys.argv[1])); print(str(p.get('reason') or p.get('assignment_state') or 'Copilot report not delivered yet')[:1000])
          except Exception as exc: print(type(exc).__name__+': '+str(exc))
          PY
              )"
            fi
            printf '%s\t%s\n' copilot "$reason" >> .strategy_resilient/reasons.tsv
          fi

          VALID_CSV="$(IFS=,; echo "${valid[*]}")"
          MISSING_CSV="$(IFS=,; echo "${missing[*]}")"
          echo "count=${#valid[@]}" >> "$GITHUB_OUTPUT"
          echo "valid_csv=$VALID_CSV" >> "$GITHUB_OUTPUT"
          echo "missing_csv=$MISSING_CSV" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "evidence_sha=$EVIDENCE_SHA" >> "$GITHUB_OUTPUT"
          echo "copilot_pr=$copilot_pr" >> "$GITHUB_OUTPUT"

          python - "$CYCLE_ID" "$SOURCE_SHA" "$EVIDENCE_SHA" "$VALID_CSV" "$MISSING_CSV" <<'PY' > .strategy_resilient/availability.json
          import json,sys
          cycle,source,evidence,valid,missing=sys.argv[1:6]
          reasons={}
          for line in open('.strategy_resilient/reasons.tsv',encoding='utf-8',errors='replace'):
              name,_,reason=line.rstrip('\n').partition('\t'); reasons[name]=reason
          print(json.dumps({
            'cycle_id':cycle,'source_commit':source,'evidence_sha256':evidence,
            'valid_agents':[x for x in valid.split(',') if x],
            'missing_agents':[x for x in missing.split(',') if x],
            'reasons':reasons
          },indent=2,sort_keys=True))
          PY

      - name: Skip repeat adjudication when this exact agent set was already processed
        if: steps.cycle.outputs.found == 'true' && steps.agents.outputs.count != '0'
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.cycle.outputs.id }}
          VALID_AGENTS: ${{ steps.agents.outputs.valid_csv }}
        shell: bash
        run: |
          set -euo pipefail
          existing=/tmp/strategy-completion.json
          set +e
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/strategy/runs/${CYCLE_ID}/completion.json?ref=ai-reviews" \
            --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > "$existing" 2>/dev/null
          rc=$?
          set -e
          needed=true
          if [[ $rc -eq 0 && -s "$existing" ]]; then
            needed="$(python - "$existing" "$VALID_AGENTS" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); current=sorted(x for x in sys.argv[2].split(',') if x)
          previous=sorted(str(x) for x in (p.get('agents_used') or []))
          print('false' if p.get('master_decision_available') and previous==current else 'true')
          PY
            )"
          fi
          echo "value=$needed" >> "$GITHUB_OUTPUT"

      - name: Stop cleanly only when no valid agent exists yet
        if: steps.cycle.outputs.found == 'true' && steps.agents.outputs.count == '0'
        run: |
          echo 'No valid strategy report exists yet. Scheduled reconciliation will retry.'
          cat .strategy_resilient/availability.json

      - name: Prepare partial or full master evidence
        if: steps.cycle.outputs.found == 'true' && steps.agents.outputs.count != '0' && steps.needed.outputs.value == 'true'
        run: |
          set -euo pipefail
          mkdir -p .strategy_master
          cp .strategy_resilient/context.json .strategy_master/context.json
          cp .strategy_resilient/availability.json .strategy_master/availability.json
          cp .strategy_resilient/agents/*.json .strategy_master/ 2>/dev/null || true

      - name: GPT Master synthesis from all currently valid agents
        if: steps.cycle.outputs.found == 'true' && steps.agents.outputs.count != '0' && steps.needed.outputs.value == 'true'
        id: synth
        continue-on-error: true
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_STRATEGY_SYNTH_MODEL: ${{ vars.OPENAI_STRATEGY_SYNTH_MODEL }}
          CYCLE_ID: ${{ steps.cycle.outputs.id }}
          SOURCE_SHA: ${{ steps.agents.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.agents.outputs.evidence_sha }}
          VALID_AGENTS: ${{ steps.agents.outputs.valid_csv }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CODEX_API_KEY:-}"
          cat > /tmp/resilient-strategy-master-prompt.txt <<EOF
          You are GPT MASTER for a resilient trading-strategy review cycle.
          Exact cycle: ${CYCLE_ID}
          Exact source: ${SOURCE_SHA}
          Valid independent agents available now: ${VALID_AGENTS}

          Read .strategy_master/availability.json, context.json and every provider JSON that exists in .strategy_master/.
          One or two agents may be missing. Never invent their opinions. Continue using all valid reports. Code truth and
          measured evidence outrank vote count. With only one valid agent, be conservative and DEFER unsupported changes.
          Any accepted auto-code proposal still requires at least two independent supporting agents under the deterministic gate.
          No LIVE, capital, signing, wallet or safety change is authorised by this workflow.

          Return exactly one JSON object between MASTER_DECISION_JSON_BEGIN and MASTER_DECISION_JSON_END:
          {
            "schema_version":1,
            "cycle_id":"${CYCLE_ID}",
            "source_commit":"${SOURCE_SHA}",
            "evidence_sha256":"${EVIDENCE_SHA}",
            "status":"NO_ACTION|DRAFT_SHADOW_CHANGE|HUMAN_REVIEW_REQUIRED",
            "summary":"...",
            "decisions":[{
              "finding_id":"stable id",
              "source_proposal_ids":["provider:id"],
              "action":"KEEP|IMPROVE|REWORK|SHADOW_MORE|REPLACE|DORMANT|NEW_SHADOW|ASSET_REQUEST|RESEARCH_MORE",
              "strategy":"...",
              "disposition":"ACCEPT|REJECT|DEFER",
              "reason":"...",
              "confidence":0.0,
              "supporting_agents":["gpt|gemini|copilot"],
              "risk_class":"LOW|MEDIUM|HIGH|CRITICAL",
              "shadow_only":true,
              "allowed_files":["exact Strategy Lab/SHADOW path"],
              "required_tests":["specific test"]
            }],
            "implementation_allowed":false,
            "live_auto_deploy":false,
            "draft_pr_only":true
          }
          EOF
          model_args=()
          if [[ -n "${OPENAI_STRATEGY_SYNTH_MODEL:-}" ]]; then model_args=(-m "$OPENAI_STRATEGY_SYNTH_MODEL"); fi
          codex --ask-for-approval never exec --sandbox danger-full-access --ephemeral "${model_args[@]}" - \
            < /tmp/resilient-strategy-master-prompt.txt > /tmp/resilient-master.stdout 2> /tmp/resilient-master.stderr
          python - <<'PY'
          import json,re,pathlib
          raw=pathlib.Path('/tmp/resilient-master.stdout').read_text(errors='replace')
          m=re.search(r'MASTER_DECISION_JSON_BEGIN\s*(\{.*?\})\s*MASTER_DECISION_JSON_END',raw,re.S)
          if not m: raise SystemExit('GPT Master JSON markers missing')
          p=json.loads(m.group(1))
          pathlib.Path('.strategy_master/master_decision.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          lines=['# Resilient GPT Master strategy decision','',p.get('summary','')]
          for d in p.get('decisions') or []:
              lines += ['',f"## {d.get('disposition')} — {d.get('strategy')}",d.get('reason','')]
          pathlib.Path('.strategy_master/master_decision.md').write_text('\n'.join(lines)+'\n')
          PY
          python -m learnerbot.three_agent_strategy_contract gate-master \
            --input .strategy_master/master_decision.json --output .strategy_master/master_gated.json \
            --cycle-id "$CYCLE_ID" --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA" \
            | tee /tmp/resilient-strategy-gate.txt

      - name: Deterministic fallback when GPT Master is unavailable
        if: steps.cycle.outputs.found == 'true' && steps.agents.outputs.count != '0' && steps.needed.outputs.value == 'true' && steps.synth.outcome != 'success'
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.id }}
          SOURCE_SHA: ${{ steps.agents.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.agents.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$CYCLE_ID" "$SOURCE_SHA" "$EVIDENCE_SHA" <<'PY'
          import glob,json,os,sys
          cycle,source,evidence=sys.argv[1:4]
          decisions=[]
          for path in sorted(glob.glob('.strategy_master/*.json')):
              provider=os.path.basename(path).split('.')[0]
              if provider not in {'gpt','gemini','copilot'}: continue
              p=json.load(open(path,encoding='utf-8'))
              for f in p.get('proposals') or []:
                  fid=str(f.get('id') or 'proposal')
                  decisions.append({
                    'finding_id':f'{provider}-{fid}','source_proposal_ids':[f'{provider}:{fid}'],
                    'action':str(f.get('action') or 'RESEARCH_MORE'),'strategy':str(f.get('strategy') or fid),
                    'disposition':'DEFER','reason':'GPT Master unavailable; resilient cycle preserved the valid agent report but deferred implementation.',
                    'confidence':float(f.get('confidence') or 0),'supporting_agents':[provider],
                    'risk_class':'HIGH','shadow_only':True,'allowed_files':[],'required_tests':[]
                  })
          out={
            'schema_version':1,'cycle_id':cycle,'source_commit':source,'evidence_sha256':evidence,
            'status':'HUMAN_REVIEW_REQUIRED','summary':'Resilient fallback: at least one independent strategy report is valid, but GPT Master synthesis was unavailable. Findings are preserved and deferred safely.',
            'decisions':decisions,'implementation_allowed':False,'live_auto_deploy':False,'draft_pr_only':True
          }
          open('.strategy_master/master_decision.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          open('.strategy_master/master_decision.md','w').write('# Resilient Strategy Master fallback\n\nAll available findings were deferred because GPT Master was unavailable.\n')
          PY
          python -m learnerbot.three_agent_strategy_contract gate-master \
            --input .strategy_master/master_decision.json --output .strategy_master/master_gated.json \
            --cycle-id "$CYCLE_ID" --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA" \
            | tee /tmp/resilient-strategy-gate.txt

      - name: Publish resilient master decision
        if: steps.cycle.outputs.found == 'true' && steps.agents.outputs.count != '0' && steps.needed.outputs.value == 'true' && (steps.synth.outcome == 'success' || steps.synth.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.cycle.outputs.id }}
          SOURCE_SHA: ${{ steps.agents.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.agents.outputs.evidence_sha }}
          VALID_AGENTS: ${{ steps.agents.outputs.valid_csv }}
          MISSING_AGENTS: ${{ steps.agents.outputs.missing_csv }}
          VALID_COUNT: ${{ steps.agents.outputs.count }}
          COPILOT_PR: ${{ steps.agents.outputs.copilot_pr }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/resilient-strategy-reviews
          git worktree add --detach /tmp/resilient-strategy-reviews origin/ai-reviews
          dest="/tmp/resilient-strategy-reviews/strategy/runs/${CYCLE_ID}"
          mkdir -p "$dest"

          cp .strategy_master/master_decision.json "$dest/master_decision_raw.json"
          cp .strategy_master/master_gated.json "$dest/master_decision.json"
          cp .strategy_master/master_decision.md "$dest/master_decision.md"
          if [[ -f .strategy_resilient/agents/copilot.json ]]; then
            cp .strategy_resilient/agents/copilot.json "$dest/copilot.json"
          fi

          python - "$VALID_AGENTS" "$MISSING_AGENTS" "$VALID_COUNT" "$COPILOT_PR" <<'PY' > "$dest/completion.json"
          import json,sys
          valid=[x for x in sys.argv[1].split(',') if x]; missing=[x for x in sys.argv[2].split(',') if x]
          pr=sys.argv[4]
          out={
            'cycle_id':'${CYCLE_ID}','source_commit':'${SOURCE_SHA}','evidence_sha256':'${EVIDENCE_SHA}',
            'agents_used':valid,'missing_agents':missing,'valid_agent_count':int(sys.argv[3]),
            'three_agent_reports_complete':len(valid)==3,'master_decision_available':True,
            'cycle_continued':True,'live_auto_deploy':False
          }
          if pr: out['copilot_report_pr']=int(pr)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

          latest="$(cat /tmp/resilient-strategy-reviews/strategy/latest_cycle_id.txt 2>/dev/null || true)"
          if [[ "$latest" == "$CYCLE_ID" ]]; then
            cp .strategy_master/master_gated.json /tmp/resilient-strategy-reviews/strategy/latest_master_decision.json
            python - "$VALID_AGENTS" "$MISSING_AGENTS" "$VALID_COUNT" "$COPILOT_PR" <<'PY' > /tmp/resilient-strategy-reviews/strategy/latest_status.json
          import json,sys
          valid=[x for x in sys.argv[1].split(',') if x]; missing=[x for x in sys.argv[2].split(',') if x]
          status=json.load(open('.strategy_master/master_gated.json'))
          states={p:('DONE' if p in valid else 'MISSING') for p in ('gpt','gemini','copilot')}
          out={
            'available':True,'cycle_id':'${CYCLE_ID}','source_commit':'${SOURCE_SHA}','evidence_sha256':'${EVIDENCE_SHA}',
            'state':'MASTER_DECIDED' if len(valid)==3 else 'MASTER_DECIDED_PARTIAL',
            'gpt':states['gpt'],'gemini':states['gemini'],'copilot':states['copilot'],
            'valid_agents':valid,'missing_agents':missing,'valid_agent_count':int(sys.argv[3]),
            'three_agent_reports_complete':len(valid)==3,'master_decision_available':True,
            'master_status':status.get('status'),'policy_accepted_count':int(status.get('policy_accepted_count') or 0),
            'cycle_continued':True,'change_pr_url':'','live_auto_deploy':False,'draft_pr_only':True
          }
          if sys.argv[4]: out['copilot_report_pr']=int(sys.argv[4])
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          fi

          cd /tmp/resilient-strategy-reviews
          git config user.name 'resilient-strategy-master-bot'
          git config user.email 'resilient-strategy-master-bot@users.noreply.github.com'
          git add strategy
          if ! git diff --cached --quiet; then
            git commit -m "Resilient strategy master ${CYCLE_ID} using ${VALID_COUNT}/3 agents"
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            git push origin HEAD:ai-reviews
          fi

      - name: Clean workspace
        if: always()
        run: rm -rf .strategy_resilient .strategy_master /tmp/resilient-strategy-reviews /tmp/resilient-strategy-master-prompt.txt /tmp/resilient-master.stdout /tmp/resilient-master.stderr
