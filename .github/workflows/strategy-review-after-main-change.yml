name: Fresh Strategy Review After Main Change

on:
  push:
    branches:
      - main
      - 'agent/force-strategy-review*'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  # Keep unrelated main/force/PR review runs from cancelling each other. Runs for
  # the same event/ref still collapse to the newest one so rapid duplicate pushes
  # do not multiply paid reviewer calls.
  group: fresh-strategy-review-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'agent/force-strategy-review-now' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dispatch and await exact-main base strategy cycle
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          echo "Current main: ${sha}"
          run_url="$(gh workflow run hourly-three-agent-strategy-cycle.yml --repo "$GITHUB_REPOSITORY" --ref main)"
          echo "${run_url}"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'Unable to resolve dispatched base strategy run id.' >&2; exit 2; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

          cycle="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/strategy/latest_cycle_id.txt?ref=ai-reviews" \
            --jq '.content' | tr -d '\n' | base64 -d | tr -d '\r\n')"
          [[ "$cycle" =~ ^[0-9a-f]{12}-[0-9]{10}-[0-9a-f]{8}$ ]] || { echo 'Invalid published strategy cycle id.' >&2; exit 2; }
          source_sha="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/strategy/runs/${cycle}/context.json?ref=ai-reviews" \
            --jq '.content' | tr -d '\n' | base64 -d | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("source_commit") or ""))')"
          [[ "$source_sha" == "$sha" ]] || { echo "Published cycle source mismatch: ${source_sha} != ${sha}" >&2; exit 3; }
          echo "cycle_id=$cycle" >> "$GITHUB_OUTPUT"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Fresh base strategy cycle published: ${cycle}"

      - name: Ensure all downstream reviewers are active for the same cycle
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.base.outputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_reviewer() {
            local provider="$1" workflow="$2"
            local path="strategy/runs/${CYCLE_ID}/${provider}.json"
            if gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=ai-reviews" >/dev/null 2>&1; then
              echo "${provider}: report already published for ${CYCLE_ID}"
              return 0
            fi
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 10 \
              --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
            if [[ "${active:-0}" -gt 0 ]]; then
              echo "${provider}: reviewer already active; not duplicating paid work"
              return 0
            fi
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main -f cycle_id="$CYCLE_ID"
            echo "${provider}: explicitly dispatched for ${CYCLE_ID}"
          }

          ensure_reviewer claude claude-fourth-strategy-agent.yml
          ensure_reviewer deepseek deepseek-fifth-strategy-agent.yml
          ensure_reviewer grok grok-sixth-strategy-agent.yml
          ensure_reviewer kimi kimi-seventh-strategy-agent.yml

          echo "Seven-agent activation checked for cycle ${CYCLE_ID}."
