name: Fresh Strategy Review After Main Change

on:
  push:
    branches:
      - main
      - 'agent/force-strategy-review*'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: fresh-strategy-review-after-main-change
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'agent/force-strategy-review-now' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-main three-agent strategy cycle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Every main change and explicit force-review trigger launches a fresh exact-main strategy cycle.
          sha="$(gh api --repo "$GITHUB_REPOSITORY" "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          echo "Current main: ${sha}"
          gh workflow run hourly-three-agent-strategy-cycle.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched hourly-three-agent-strategy-cycle.yml for current main."
