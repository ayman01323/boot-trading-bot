name: Temporary Central Report Model CI

on:
  push:
    branches: [gpt/cost-effective-seven-agent-monitoring]
    paths:
      - 'learnerbot/report_schedule_control.py'
      - 'learnerbot/telegram_report_schedule_patch.py'
      - 'learnerbot/telegram_account_roles_patch.py'
      - 'learnerbot/telegram_ai_ops_verification_patch.py'
      - 'scripts/monitor_factory_operations.py'
      - 'tests/test_report_schedule_control.py'
      - '.github/workflows/temp-central-report-model-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/cost-effective-seven-agent-monitoring
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile central report model
        run: python -m compileall -q learnerbot scripts
      - name: Run central report model contracts
        run: |
          pytest -q \
            tests/test_report_schedule_control.py \
            tests/test_monitor_factory_pipeline.py \
            tests/test_monitor_factory_operations_script.py
