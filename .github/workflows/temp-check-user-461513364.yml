name: TEMP Check Telegram User 461513364

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Read-only readiness check
        run: |
          sudo bash -lc 'cd /root/multichain-learning-bot-v2.2-fast-direct-market && .venv/bin/python - <<"PY"
          from pathlib import Path
          from learnerbot.cli import _app
          from learnerbot.user_registry import get_user, user_bool, user_setting
          from learnerbot.multi_wallet_store import MultiWalletStore
          from learnerbot.solana_wallet_store import SolanaWalletStore
          from learnerbot.config import load_chains, load_kv_scoped
          from learnerbot import solana_sibot as sol

          tid="461513364"
          app=_app()
          u=get_user(app.csv_dir, tid)
          if not u:
              print(f"[user-ready] tid={tid} registered=false ready=false reason=not_registered")
              raise SystemExit(0)
          print(f"[user-ready] tid={tid} registered=true role={u.get('role')} status={u.get('status')} can_auto={u.get('can_auto_trade')} can_manual={u.get('can_manual_trade')}")
          evm=MultiWalletStore(app.data_dir, app.csv_dir)
          try:
              m=evm.get_meta(tid)
              signing=evm._wallet_file(tid,m.get("wallet_id")).exists()
              print(f"[user-ready-evm] wallet=true address={m.get('address')} signing_file={str(signing).lower()}")
              for c in load_chains(app, enabled_only=True):
                  pl=str(load_kv_scoped(Path(app.csv_dir)/"live_trading_settings.csv",c.chain_id).get("trading_enabled") or "false").lower()
                  pa=str(load_kv_scoped(Path(app.csv_dir)/"auto_trading_settings.csv",c.chain_id).get("auto_trading_enabled") or "false").lower()
                  ul=user_bool(app.csv_dir,tid,c.chain_id,"live_trading_enabled",False)
                  ua=user_bool(app.csv_dir,tid,c.chain_id,"auto_trading_enabled",False)
                  mode=str(user_setting(app.csv_dir,tid,c.chain_id,"recommendation_mode","SHADOW")).upper()
                  effective=(str(u.get("status") or "").upper()=="ACTIVE" and str(u.get("can_auto_trade") or "").lower() in {"1","true","yes","on"} and signing and pl in {"1","true","yes","on"} and pa in {"1","true","yes","on"} and ul and ua and mode=="ARMED")
                  print(f"[user-ready-chain] chain={c.slug} effective={str(effective).lower()} user_live={str(ul).lower()} user_auto={str(ua).lower()} mode={mode}")
          except Exception as exc:
              print(f"[user-ready-evm] wallet=false signing_file=false error={type(exc).__name__}")
          sw=SolanaWalletStore(app.csv_dir, app.data_dir)
          try:
              sm=sw.get_meta(tid)
              ss=sw.has_private_key(tid,sm.get("wallet_id"))
              sl=user_bool(app.csv_dir,tid,sol.SOLANA_CHAIN_ID,"solana_live_enabled",False)
              se=str(sol.settings(app).get("enabled") or "true").lower() in {"1","true","yes","on"}
              effective=(str(u.get("status") or "").upper()=="ACTIVE" and str(u.get("can_auto_trade") or "").lower() in {"1","true","yes","on"} and ss and sl and se)
              print(f"[user-ready-solana] wallet=true address={sm.get('address')} signing={str(ss).lower()} live={str(sl).lower()} engine={str(se).lower()} effective={str(effective).lower()}")
          except Exception as exc:
              print(f"[user-ready-solana] wallet=false signing=false live=false effective=false error={type(exc).__name__}")
          PY'
