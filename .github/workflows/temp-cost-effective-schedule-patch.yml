name: Temporary Cost-Effective Schedule Patch

on:
  push:
    branches: [gpt/cost-effective-seven-agent-monitoring]
    paths:
      - '.github/workflows/temp-cost-effective-schedule-patch.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-cost-effective-schedule-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    # This temporary helper is branch-local and exists only to apply precise
    # schedule-only edits without rewriting large workflow files by hand.
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'gpt/cost-effective-seven-agent-monitoring'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/cost-effective-seven-agent-monitoring
          fetch-depth: 0

      - name: Remove duplicate non-urgent polling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '.github/workflows/claude-fourth-strategy-agent.yml': [
                  ("# Runs concurrently with \"Hourly Three-Agent Strategy Cycle\" (same schedule)",
                   "# Runs concurrently with the daily paid base Strategy Cycle"),
                  ("    - cron: '17 */4 * * *'", "    - cron: '17 2 * * *'"),
              ],
              '.github/workflows/deepseek-fifth-strategy-agent.yml': [
                  ("  schedule:\n    - cron: '37 */4 * * *'\n", ""),
              ],
              '.github/workflows/grok-sixth-strategy-agent.yml': [
                  ("  schedule:\n    - cron: '47 */4 * * *'\n", ""),
              ],
              '.github/workflows/strategy-copilot-assignment-reconciler.yml': [
                  ("    - cron: '*/10 * * * *'", "    - cron: '29 * * * *'"),
              ],
              '.github/workflows/engineering-copilot-assignment-reconciler.yml': [
                  ("    - cron: '*/10 * * * *'", "    - cron: '39 * * * *'"),
              ],
              'tests/test_strategy_resilient_agent_workflows.py': [
                  ("assert \"cron: '*/10 * * * *'\" in text", "assert \"cron: '29 * * * *'\" in text"),
              ],
          }

          for name, pairs in replacements.items():
              path=Path(name)
              text=path.read_text(encoding='utf-8')
              for old,new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected text missing from {name}: {old!r}')
                  text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')

          test=Path('tests/test_seven_agent_cost_effective_monitoring.py')
          text=test.read_text(encoding='utf-8')
          addition='''\n\ndef test_nonurgent_extension_agents_and_copilot_reconcilers_do_not_overpoll():\n    claude = _text(".github/workflows/claude-fourth-strategy-agent.yml")\n    deepseek = _text(".github/workflows/deepseek-fifth-strategy-agent.yml")\n    grok = _text(".github/workflows/grok-sixth-strategy-agent.yml")\n    strategy_copilot = _text(".github/workflows/strategy-copilot-assignment-reconciler.yml")\n    engineering_copilot = _text(".github/workflows/engineering-copilot-assignment-reconciler.yml")\n    assert "cron: '17 2 * * *'" in claude\n    assert "schedule:" not in deepseek\n    assert "schedule:" not in grok\n    assert "cron: '29 * * * *'" in strategy_copilot\n    assert "cron: '39 * * * *'" in engineering_copilot\n'''
          if 'test_nonurgent_extension_agents_and_copilot_reconcilers_do_not_overpoll' not in text:
              test.write_text(text+addition,encoding='utf-8')
          PY

          git config user.name 'cost-effective-schedule-patch'
          git config user.email 'cost-effective-schedule-patch@users.noreply.github.com'
          git add .github/workflows/claude-fourth-strategy-agent.yml \
                  .github/workflows/deepseek-fifth-strategy-agent.yml \
                  .github/workflows/grok-sixth-strategy-agent.yml \
                  .github/workflows/strategy-copilot-assignment-reconciler.yml \
                  .github/workflows/engineering-copilot-assignment-reconciler.yml \
                  tests/test_strategy_resilient_agent_workflows.py \
                  tests/test_seven_agent_cost_effective_monitoring.py
          git diff --cached --check
          git commit -m 'Reduce remaining non-urgent agent polling'
          git push origin HEAD:gpt/cost-effective-seven-agent-monitoring
