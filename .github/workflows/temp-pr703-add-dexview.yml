name: Temporary PR703 DexView Test

on:
  push:
    branches:
      - fix/rejected-telegram-pool-value-20260828
    paths:
      - '.github/workflows/temp-pr703-add-dexview.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-telegram-pool-value-20260828
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests
      - name: Compile changed modules
        run: python -m py_compile learnerbot/rejected_opportunity_publisher.py sibot1_engines/_shared/rejected_poolcheck_patch.py tests/test_rejected_opportunity_telegram_reporting.py
      - name: Run refused-opportunity regression tests
        run: pytest -q tests/test_rejected_opportunity_telegram_reporting.py
