name: Temporary PR703 Add DexView

on:
  push:
    branches:
      - fix/rejected-telegram-pool-value-20260828
    paths:
      - '.github/workflows/temp-pr703-add-dexview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-telegram-pool-value-20260828
          fetch-depth: 1
      - name: Add DexView alert link and regression assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          publisher = Path('learnerbot/rejected_opportunity_publisher.py')
          text = publisher.read_text()
          if 'def _dexview_url(' not in text:
              needle = '''def _sol(value: Decimal | None) -> str:\n    return "unavailable" if value is None else f"{value:,.2f} SOL"\n\n\n'''
              replacement = needle + '''_DEXVIEW_CHAIN_SLUGS = {\n    "solana": "solana",\n    "ethereum": "eth",\n    "eth": "eth",\n    "bsc": "bsc",\n    "bnb": "bsc",\n    "bnbchain": "bsc",\n    "base": "base",\n    "arbitrum": "arbitrum",\n    "arbitrum_one": "arbitrum",\n    "polygon": "polygon",\n}\n\n\ndef _dexview_url(chain: str, token_address: str) -> str:\n    token = str(token_address or "").strip()\n    slug = _DEXVIEW_CHAIN_SLUGS.get(str(chain or "").strip().lower())\n    if not token or not slug:\n        return ""\n    return f"https://www.dexview.com/{slug}/{token}"\n\n\n'''
              if needle not in text:
                  raise SystemExit('publisher insertion point not found')
              text = text.replace(needle, replacement, 1)

          old = '''    if pool_address:\n        lines.append(f"Pool: {pool_address}")\n    lines.extend(\n'''
          new = '''    if pool_address:\n        lines.append(f"Pool: {pool_address}")\n    dexview_url = _dexview_url(chain, token_address)\n    if dexview_url:\n        lines.append(f"DexView: {dexview_url}")\n    lines.extend(\n'''
          if 'lines.append(f"DexView: {dexview_url}")' not in text:
              if old not in text:
                  raise SystemExit('DexView formatting insertion point not found')
              text = text.replace(old, new, 1)
          publisher.write_text(text)

          tests = Path('tests/test_rejected_opportunity_telegram_reporting.py')
          test_text = tests.read_text()
          assertion = '    assert "DexView: https://www.dexview.com/solana/Mint111" in text\n'
          if assertion not in test_text:
              needle = '    assert "Pool: Pool111" in text\n'
              if needle not in test_text:
                  raise SystemExit('test insertion point not found')
              test_text = test_text.replace(needle, needle + assertion, 1)
          tests.write_text(test_text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learnerbot/rejected_opportunity_publisher.py tests/test_rejected_opportunity_telegram_reporting.py
          git diff --cached --quiet && exit 0
          git commit -m 'Add DexView links to refused Telegram alerts'
          git push origin HEAD:fix/rejected-telegram-pool-value-20260828
