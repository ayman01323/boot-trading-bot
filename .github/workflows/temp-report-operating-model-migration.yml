name: Temporary Report Operating Model Migration

on:
  push:
    branches: [gpt/cost-effective-seven-agent-monitoring]
    paths:
      - '.github/workflows/temp-report-operating-model-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/cost-effective-seven-agent-monitoring
          fetch-depth: 0
      - name: Build central cost-effective report model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Persistent runtime schedule control. Automatic report intervals can
          # never be configured below four hours; manual MASTER runs are separate.
