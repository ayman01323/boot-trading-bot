name: Temporary SiRisky Five Trade Profile Read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sirisky-five-trade-profile-read.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Read preserved SiRisky post-five-trade backup
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          root=/root/SiRisky
          backup="$root/data/one-usd-safety-backup-20260828T152708Z"
          test -f "$backup/runtime.csv"
          test -f "$backup/stage3_risk.csv"
          echo '=== CURRENT SERVICE / EXPOSURE ==='
          sudo -n systemctl is-active sirisky.service || true
          sudo -n bash -lc "cd /root/SiRisky; echo -n open_position_rows=; if test -f CSV/open_positions.csv; then tail -n +2 CSV/open_positions.csv | sed '/^[[:space:]]*$/d' | wc -l; else echo 0; fi"
          echo '=== PRESERVED RUNTIME MTIME ==='
          sudo -n stat -c '%y %n' "$backup/runtime.csv" "$backup/stage3_risk.csv"
          echo '=== PRESERVED RUNTIME ==='
          sudo -n grep -E '^(trading_mode|paper_auto_trade_enabled|live_enabled|broadcast_enabled|auto_discovery_enabled|auto_promote_to_selected|auto_evaluate_candidate_limit|manual_approval_enabled|armed_manual_approval|manual_approval_ttl_seconds|manual_approval_require_external_signature|telegram_manual_run_enabled|poll_seconds|auto_probe_sol|auto_entry_usd|auto_entry_min_sol|auto_entry_max_sol|max_buy_network_fee_pct|max_sell_network_fee_pct|max_emergency_sell_network_fee_pct|max_priority_fee_lamports),' "$backup/runtime.csv" || true
          echo '=== PRESERVED STAGE3 RISK ==='
          sudo -n grep -E '^(max_open_positions|max_round_trip_cost_pct|fast_take_profit_floor_pct|fast_take_profit_cap_pct|fast_target_net_pct|fast_target_net_cap_pct|fast_stop_net_pct|warm_reversal_pct|hot_reversal_pct|fast_max_hold_cap_seconds|min_pool_position_depth_multiple|min_exit_health_pct|lp_recent_sell_sim_max_age_sec),' "$backup/stage3_risk.csv" || true
          echo '=== PRESERVED STRATEGY FILES ==='
          sudo -n find "$backup" -maxdepth 1 -type f -printf '%f\n' | sort
          echo '=== CURRENT EFFECTIVE SIZE ==='
          sudo -n bash -lc "cd /root/SiRisky && PYTHONPATH=. .venv/bin/python -c 'from sirisky.config import Settings; from sirisky.safety_v2 import entry_sol; s=Settings.load(); print(\"effective_entry_sol=%.9f\" % entry_sol(s))'"
