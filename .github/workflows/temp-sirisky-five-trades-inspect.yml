name: Temporary SiRisky Five-Trade Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sirisky-five-trades-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 8
    steps:
      - name: Inspect SiRisky only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n bash -lc '
            set -Eeuo pipefail
            cd /root/SiRisky
            echo "=== SIRISKY SERVICE ==="
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
            echo "service=$(systemctl is-active sirisky.service || true)"
            echo "=== CURRENT SETTINGS ==="
            PYTHONPATH=. .venv/bin/python - <<"PY"
from sirisky.config import Settings
from sirisky.safety_v2 import entry_sol
s=Settings.load(); rt=s.runtime(); rk=s.risk()
for k in sorted(rt):
    if any(x in k.lower() for x in ("secret","key","token","wallet","rpc_url")): continue
    print(f"runtime.{k}={rt.get(k)}")
for k in sorted(rk):
    if any(x in k.lower() for x in ("secret","key","token","wallet")): continue
    print(f"risk.{k}={rk.get(k)}")
print(f"effective.entry_sol={entry_sol(s):.9f}")
PY
            echo "=== TRADE CSV FILES ==="
            find CSV -maxdepth 2 -type f -name "*.csv" -printf "%TY-%Tm-%TdT%TH:%TM:%TSZ %p\n" | sort
            echo "=== POSITION / TRADE SUMMARY ==="
            PYTHONPATH=. .venv/bin/python - <<"PY"
import csv, json
from pathlib import Path
for p in sorted(Path("CSV").glob("*.csv")):
    try:
        with p.open(encoding="utf-8-sig",newline="") as f:
            rows=list(csv.DictReader(f))
    except Exception:
        continue
    if not rows: continue
    fields=set(rows[0])
    interesting=fields & {"status","mode","position_id","candidate_id","opened_at","closed_at","entry_time","exit_time","buy_signature","sell_signature","tx_signature","entry_sol","amount_sol","pnl_sol","net_pnl_sol","profit_sol","realized_pnl_sol","token","mint","symbol"}
    if interesting:
        print(f"FILE {p} rows={len(rows)} fields={','.join(sorted(interesting))}")
        for r in rows[-20:]:
            safe={k:r.get(k) for k in sorted(interesting)}
            print(json.dumps(safe,sort_keys=True))
PY
            echo "=== RECENT TRADE JOURNAL ==="
            journalctl -u sirisky.service --since "2026-08-28 00:00:00" --no-pager -o short-iso 2>/dev/null \
              | grep -Ei "OPENED|CLOSED|BUY|SELL|EXECUT|broadcast|signature|position" \
              | tail -n 800 || true
            echo "=== SETTINGS BACKUPS ==="
            find CSV -maxdepth 1 -type f \( -name "runtime.csv*" -o -name "risk.csv*" \) -printf "%TY-%Tm-%TdT%TH:%TM:%TSZ %p\n" | sort | tail -n 100
            echo "=== BACKUP RELEVANT VALUES ==="
            PYTHONPATH=. .venv/bin/python - <<"PY"
import csv
from pathlib import Path
keys={
 "auto_probe_sol","auto_entry_min_sol","auto_entry_max_sol","auto_evaluate_candidate_limit",
 "max_buy_network_fee_pct","max_sell_network_fee_pct","max_emergency_sell_network_fee_pct",
 "max_priority_fee_lamports","max_open_positions","max_round_trip_cost_pct",
 "fast_take_profit_floor_pct","fast_take_profit_cap_pct","fast_target_net_pct","fast_target_net_cap_pct",
 "min_pool_position_depth_multiple","trading_mode","live_enabled","broadcast_enabled","manual_approval_enabled"
}
for p in sorted(list(Path("CSV").glob("runtime.csv*"))+list(Path("CSV").glob("risk.csv*")), key=lambda x:x.stat().st_mtime):
    try:
        with p.open(encoding="utf-8-sig",newline="") as f:
            rd=csv.DictReader(f); rows=list(rd); fields=list(rd.fieldnames or [])
        if len(fields)<2: continue
        k="key" if "key" in fields else fields[0]; v="value" if "value" in fields else fields[1]
        vals={str(r.get(k) or ""):str(r.get(v) or "") for r in rows if str(r.get(k) or "") in keys}
        print("PROFILE",p.name,"mtime",int(p.stat().st_mtime)," ".join(f"{a}={vals[a]}" for a in sorted(vals)))
    except Exception as e:
        print("PROFILE_READ_ERROR",p.name,type(e).__name__)
PY
          '
# Manual read-only trigger: verify whether SiRisky executed any LIVE trade on 2026-08-29.
