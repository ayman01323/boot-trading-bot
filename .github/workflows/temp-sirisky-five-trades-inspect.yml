name: Temporary SiRisky Five-Trade Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sirisky-five-trades-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Inspect deployed SiRisky Ultra request
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 3
    outputs:
      state: ${{ steps.classify.outputs.state }}
      urls: ${{ steps.classify.outputs.urls }}
      orderparams: ${{ steps.classify.outputs.orderparams }}
      signshape: ${{ steps.classify.outputs.signshape }}
      execbody: ${{ steps.classify.outputs.execbody }}
      responseguard: ${{ steps.classify.outputs.responseguard }}
    steps:
      - id: classify
        name: Classify deployed request schema without exposing addresses or keys
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n true
          out="$(sudo -n python3 - <<'PY'
          import ast,csv,re
          from pathlib import Path

          target='pos-e39b933a174b'
          op=Path('/root/SiRisky/CSV/open_positions.csv')
          jp=Path('/root/SiRisky/sirisky/jupiter.py')
          state='UNKNOWN'
          if op.exists():
              with op.open(newline='') as f: rows=list(csv.DictReader(f))
              state='OPEN' if any((r.get('position_id') or '')==target and (r.get('status') or '').upper()=='OPEN' for r in rows) else 'NOT_OPEN'

          src=jp.read_text(errors='replace')
          tree=ast.parse(src)
          funcs={n.name:ast.get_source_segment(src,n) or '' for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          order=funcs.get('order','')
          execute=funcs.get('execute_order','')

          # Classify endpoint literals/constants, but never output the literal URLs.
          lo=src.lower()
          bits=[]
          if 'ultra/v1/order' in lo: bits.append('UO')
          if 'ultra/v1/execute' in lo: bits.append('UE')
          if 'swap/v1/quote' in lo: bits.append('SQ')
          if 'swap/v1/swap' in lo: bits.append('SS')
          if '/swap/v2/' in lo or 'swap/v2' in lo: bits.append('V2')
          urls='URL_' + ''.join(bits) if bits else 'URL_OTHER'

          params=[]
          for key,label in [('inputMint','I'),('outputMint','O'),('amount','A'),('taker','T'),('receiver','R'),('payer','P'),('closeAuthority','C'),('referralAccount','F'),('referralFee','E'),('excludeRouters','X'),('excludeDexes','D'),('slippageBps','S'),('swapMode','M'),('platformFeeBps','B')]:
              if key in order: params.append(label)
          orderparams='OP_' + ''.join(params) if params else 'OP_NONE'

          # Signing implementation shape only.
          if 'VersionedTransaction' in execute and re.search(r'\.sign\(',execute): signshape='VERSIONED_SIGN'
          elif 'VersionedTransaction' in execute: signshape='VERSIONED_OTHER'
          elif re.search(r'Keypair|keypair|sign',execute): signshape='SIGN_OTHER'
          else: signshape='SIGN_UNKNOWN'

          eb=[]
          for key,label in [('signedTransaction','S'),('requestId','R'),('transaction','T'),('signature','G')]:
              if key in execute: eb.append(label)
          execbody='EB_' + ''.join(eb) if eb else 'EB_NONE'

          # Does order validate Jupiter's returned transaction/requestId/error fields before Stage 5 proceeds?
          guards=[]
          if 'transaction' in order: guards.append('T')
          if 'requestId' in order: guards.append('R')
          if 'errorCode' in order or 'errorMessage' in order: guards.append('E')
          if re.search(r'raise\s+JupiterError',order): guards.append('J')
          responseguard='RG_' + ''.join(guards) if guards else 'RG_NONE'

          print('state='+state)
          print('urls='+urls)
          print('orderparams='+orderparams)
          print('signshape='+signshape)
          print('execbody='+execbody)
          print('responseguard='+responseguard)
          PY
          )"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"

  report:
    needs: detect
    name: SiRisky ${{ needs.detect.outputs.state }} - ${{ needs.detect.outputs.urls }} - ${{ needs.detect.outputs.orderparams }} - ${{ needs.detect.outputs.signshape }} - ${{ needs.detect.outputs.execbody }} - ${{ needs.detect.outputs.responseguard }}
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 2
    steps:
      - name: Confirm service remains active
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(systemctl is-active sirisky.service)" = active
