name: Temporary SiRisky Five-Trade Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sirisky-five-trades-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect SiRisky exit state
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 3
    outputs:
      state: ${{ steps.classify.outputs.state }}
      category: ${{ steps.classify.outputs.category }}
    steps:
      - id: classify
        name: Classify target position and latest FAST_STOP sell
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n true
          out="$(sudo -n python3 - <<'PY'
          import csv,re
          from pathlib import Path

          target='pos-e39b933a174b'
          open_path=Path('/root/SiRisky/CSV/open_positions.csv')
          exec_path=Path('/root/SiRisky/CSV/executions.csv')

          state='UNKNOWN'
          if open_path.exists():
              with open_path.open(newline='') as f:
                  open_rows=list(csv.DictReader(f))
              state='OPEN' if any((r.get('position_id') or '')==target and (r.get('status') or '').upper()=='OPEN' for r in open_rows) else 'NOT_OPEN'

          relevant=[]
          if exec_path.exists():
              with exec_path.open(newline='') as f:
                  rows=list(csv.DictReader(f))
              relevant=[r for r in rows if (r.get('action') or '').upper()=='SELL' and (r.get('reason') or '').upper()=='FAST_STOP']

          category='NO_FAST_STOP_SELL_RECORD'
          if relevant:
              r=relevant[-1]
              status=(r.get('status') or '').upper()
              err=(r.get('error') or '').strip()
              if status in {'SUCCESS','CONFIRMED','EXECUTED'}:
                  category='SELL_SUCCESS'
              elif err=='JupiterError':
                  category='OPAQUE_JUPITER_ERROR'
              elif re.search(r'HTTP\s+(401|403)\b|unauthori[sz]ed|forbidden|api.?key',err,re.I):
                  category='AUTH_401_403'
              elif re.search(r'HTTP\s+429\b|rate.?limit|too many requests',err,re.I):
                  category='RATE_LIMIT_429'
              elif re.search(r'HTTP\s+5\d\d\b|server error|service unavailable|bad gateway|gateway timeout',err,re.I):
                  category='JUPITER_SERVER_5XX'
              elif re.search(r'no.?route|NO_EXECUTABLE_OUTPUT|route.*not.*found|could not find.*route|not tradable',err,re.I):
                  category='NO_ROUTE'
              elif re.search(r'slippage|simulation|simulate|price.?impact',err,re.I):
                  category='SLIPPAGE_OR_SIMULATION'
              elif re.search(r'insufficient|not enough|balance|funds',err,re.I):
                  category='INSUFFICIENT_BALANCE_OR_FUNDS'
              elif re.search(r'blockhash|expired|account.*not found|token account|associated token|invalid account',err,re.I):
                  category='ACCOUNT_OR_BLOCKHASH'
              elif re.search(r'TIMEOUT|CONNECTION|URL_ERROR|network|temporar',err,re.I):
                  category='TRANSPORT'
              elif re.search(r'signer|signature|private key',err,re.I):
                  category='SIGNER_OR_SIGNATURE'
              elif re.search(r'HTTP\s+400\b|bad request|invalid request|invalid.*amount',err,re.I):
                  category='HTTP_400_BAD_REQUEST'
              elif err.startswith('JupiterError |'):
                  category='JUPITER_OTHER_DETAIL'
              elif err:
                  category='OTHER_DETAILED_ERROR'
              else:
                  category='FAILED_WITHOUT_ERROR_TEXT'

          print('state='+state)
          print('category='+category)
          PY
          )"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"

  report:
    needs: detect
    name: SiRisky ${{ needs.detect.outputs.state }} - ${{ needs.detect.outputs.category }}
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 2
    steps:
      - name: Confirm service remains active
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(systemctl is-active sirisky.service)" = active
