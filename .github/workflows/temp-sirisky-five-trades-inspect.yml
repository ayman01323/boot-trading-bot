name: Temporary SiRisky Five-Trade Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sirisky-five-trades-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage5_jupiter_fix:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 8
    steps:
      - name: Guard bot and save runtime state
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n true
          sudo -n test -f /root/SiRisky/sirisky/stage5_trade.py
          sudo -n test -f /root/SiRisky/CSV/runtime.csv
          sudo -n sha256sum /root/SiRisky/CSV/runtime.csv | awk '{print $1}' > "$RUNNER_TEMP/runtime_before.sha"
          sudo -n python3 - <<'PY' > "$RUNNER_TEMP/execution_rows_before.txt"
          import csv
          from pathlib import Path
          p=Path('/root/SiRisky/CSV/executions.csv')
          if not p.exists(): print(0)
          else:
              with p.open(newline='') as f: print(sum(1 for _ in csv.DictReader(f)))
          PY

      - name: Fetch exact reviewed Stage 5 patch
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://raw.githubusercontent.com/ayman01323/boot-trading-bot/13e37cd289ef2879e88d7103fb686e32a5da14f7/SiRisky/overrides/sirisky/stage5_trade.py'
          curl --fail --silent --show-error --location "$url" -o "$RUNNER_TEMP/stage5_trade.py"
          grep -q 'def _exception_detail' "$RUNNER_TEMP/stage5_trade.py"
          grep -q 'Preserve the sanitised payload from custom exceptions' "$RUNNER_TEMP/stage5_trade.py"

      - name: Back up and deploy Stage 5 error fix
        shell: bash
        run: |
          set -Eeuo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          sudo -n cp -a /root/SiRisky/sirisky/stage5_trade.py "/root/SiRisky/sirisky/stage5_trade.py.${stamp}.bak"
          sudo -n install -m 0644 "$RUNNER_TEMP/stage5_trade.py" /root/SiRisky/sirisky/stage5_trade.py
          sudo -n grep -q 'def _exception_detail' /root/SiRisky/sirisky/stage5_trade.py
          sudo -n bash -lc 'cd /root/SiRisky && PYTHONPATH=. .venv/bin/python -m py_compile sirisky/stage5_trade.py'

      - name: Prove trading configuration is untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(cat "$RUNNER_TEMP/runtime_before.sha")"
          after="$(sudo -n sha256sum /root/SiRisky/CSV/runtime.csv | awk '{print $1}')"
          test "$before" = "$after"

      - name: Restart service with unchanged runtime state
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n systemctl restart sirisky.service
          sleep 4
          test "$(systemctl is-active sirisky.service)" = active
          before="$(cat "$RUNNER_TEMP/runtime_before.sha")"
          after="$(sudo -n sha256sum /root/SiRisky/CSV/runtime.csv | awk '{print $1}')"
          test "$before" = "$after"

      - name: Current Jupiter quote endpoint is configured
        continue-on-error: true
        shell: bash
        run: sudo -n grep -q 'https://api.jup.ag/swap/v1/quote' /root/SiRisky/sirisky/jupiter.py

      - name: Deprecated Jupiter lite quote endpoint is absent
        continue-on-error: true
        shell: bash
        run: '! sudo -n grep -q "https://lite-api.jup.ag/swap/v1/quote" /root/SiRisky/sirisky/jupiter.py'

      - name: Jupiter API authentication support is configured
        continue-on-error: true
        shell: bash
        run: sudo -n grep -Eqi 'x-api-key|_headers\(settings\)' /root/SiRisky/sirisky/jupiter.py

      - name: Wait for normal automatic exit retry
        shell: bash
        run: sleep 45

      - name: A new execution attempt occurred after restart
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat "$RUNNER_TEMP/execution_rows_before.txt")"
          sudo -n python3 - "$base" <<'PY'
          import csv,sys
          from pathlib import Path
          base=int(sys.argv[1]); p=Path('/root/SiRisky/CSV/executions.csv')
          rows=[]
          if p.exists():
              with p.open(newline='') as f: rows=list(csv.DictReader(f))
          raise SystemExit(0 if len(rows)>base else 1)
          PY

      - name: New retry no longer reports bare JupiterError
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat "$RUNNER_TEMP/execution_rows_before.txt")"
          sudo -n python3 - "$base" <<'PY'
          import csv,sys
          from pathlib import Path
          base=int(sys.argv[1]); p=Path('/root/SiRisky/CSV/executions.csv')
          with p.open(newline='') as f: rows=list(csv.DictReader(f))
          new=rows[base:]
          if not new: raise SystemExit(1)
          raise SystemExit(1 if any((r.get('error') or '').strip()=='JupiterError' for r in new) else 0)
          PY

      - name: Root cause category - Jupiter authentication
        continue-on-error: true
        shell: bash
        run: |
          base="$(cat "$RUNNER_TEMP/execution_rows_before.txt")"
          sudo -n python3 - "$base" <<'PY'
          import csv,re,sys
          from pathlib import Path
          base=int(sys.argv[1]); p=Path('/root/SiRisky/CSV/executions.csv')
          with p.open(newline='') as f: rows=list(csv.DictReader(f))
          e=' '.join((r.get('error') or '') for r in rows[base:])
          raise SystemExit(0 if re.search(r'HTTP\s+(401|403)\b|unauthori[sz]ed|forbidden|api.?key',e,re.I) else 1)
          PY

      - name: Root cause category - no route or executable output
        continue-on-error: true
        shell: bash
        run: |
          base="$(cat "$RUNNER_TEMP/execution_rows_before.txt")"
          sudo -n python3 - "$base" <<'PY'
          import csv,re,sys
          from pathlib import Path
          base=int(sys.argv[1]); p=Path('/root/SiRisky/CSV/executions.csv')
          with p.open(newline='') as f: rows=list(csv.DictReader(f))
          e=' '.join((r.get('error') or '') for r in rows[base:])
          raise SystemExit(0 if re.search(r'no.?route|NO_EXECUTABLE_OUTPUT|route.*not.*found|could not find.*route',e,re.I) else 1)
          PY

      - name: Root cause category - slippage or simulation
        continue-on-error: true
        shell: bash
        run: |
          base="$(cat "$RUNNER_TEMP/execution_rows_before.txt")"
          sudo -n python3 - "$base" <<'PY'
          import csv,re,sys
          from pathlib import Path
          base=int(sys.argv[1]); p=Path('/root/SiRisky/CSV/executions.csv')
          with p.open(newline='') as f: rows=list(csv.DictReader(f))
          e=' '.join((r.get('error') or '') for r in rows[base:])
          raise SystemExit(0 if re.search(r'slippage|simulation|simulate|price.?impact',e,re.I) else 1)
          PY

      - name: Root cause category - transport or rate limit
        continue-on-error: true
        shell: bash
        run: |
          base="$(cat "$RUNNER_TEMP/execution_rows_before.txt")"
          sudo -n python3 - "$base" <<'PY'
          import csv,re,sys
          from pathlib import Path
          base=int(sys.argv[1]); p=Path('/root/SiRisky/CSV/executions.csv')
          with p.open(newline='') as f: rows=list(csv.DictReader(f))
          e=' '.join((r.get('error') or '') for r in rows[base:])
          raise SystemExit(0 if re.search(r'TIMEOUT|CONNECTION|URL_ERROR|HTTP\s+429|rate.?limit',e,re.I) else 1)
          PY

      - name: Final invariant - service active and settings unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(systemctl is-active sirisky.service)" = active
          before="$(cat "$RUNNER_TEMP/runtime_before.sha")"
          after="$(sudo -n sha256sum /root/SiRisky/CSV/runtime.csv | awk '{print $1}')"
          test "$before" = "$after"
          echo 'stage5_error_fix=DEPLOYED'
          echo 'runtime_settings_changed=NO'
