name: Temporary SiRisky Post-Live Verify 20260828

on:
  workflow_run:
    workflows: ["Deploy BOOT to VPS"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 10
    steps:
      - name: Repair Learner reject reporting
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          ROOT=/home/ayman01323/BOOT/testingbots/learn
          SERVICE=learnerbot-learn.service
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/scripts" "$TMP/learnerbot"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/ayman01323/boot-trading-bot/main/scripts/repair_isolated_learner_reject_reporting.py -o "$TMP/scripts/repair_isolated_learner_reject_reporting.py"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/ayman01323/boot-trading-bot/main/scripts/add_dexview_to_learner_reject_report.py -o "$TMP/scripts/add_dexview_to_learner_reject_report.py"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/ayman01323/boot-trading-bot/main/learnerbot/rejected_opportunity_publisher.py -o "$TMP/learnerbot/rejected_opportunity_publisher.py"
          python3 -m py_compile "$TMP/scripts/repair_isolated_learner_reject_reporting.py" "$TMP/scripts/add_dexview_to_learner_reject_report.py" "$TMP/learnerbot/rejected_opportunity_publisher.py"
          SOL_BEFORE="$(sha256sum "$ROOT/CSVbot/solana_settings.csv" | awk '{print $1}')"
          USER_BEFORE="$(sha256sum "$ROOT/CSVbot/user_trading_settings.csv" | awk '{print $1}')"
          SOURCE_BEFORE="$(cat "$ROOT/RESTORED_SOURCE_SHA.txt" 2>/dev/null || true)"
          TOKEN="$(sed -n 's/^TELEGRAM_BOT_TOKEN=//p' "$ROOT/.env" | tail -1 | tr -d '\r\"' || true)"
          if [[ -z "$TOKEN" ]]; then TOKEN="$(sudo -n sh -c "sed -n 's/^TELEGRAM_BOT_TOKEN=//p' /root/multichain-learning-bot-v2.2-fast-direct-market/.env 2>/dev/null | tail -1 | tr -d '\\r\\\"'" || true)"; fi
          test -n "$TOKEN"
          MASTER="$(python3 -c "import csv; rows=list(csv.DictReader(open('$ROOT/CSVbot/users.csv',encoding='utf-8-sig'))); print(next((str(r.get('telegram_id') or '').strip() for r in rows if str(r.get('status') or '').upper()=='ACTIVE' and str(r.get('role') or '').upper()=='MASTER' and str(r.get('telegram_id') or '').strip().lstrip('-').isdigit()),''))")"
          test -n "$MASTER"
          sudo -n mkdir -p "$ROOT/private"
          sudo -n cp -a "$ROOT/.env" "$ROOT/private/learner-env-before-reject-report-repair-$(date -u +%Y%m%dT%H%M%SZ).bak"
          set_env() { local k="$1" v="$2"; sudo -n sed -i "/^${k}=/d" "$ROOT/.env"; printf '%s=%s\n' "$k" "$v" | sudo -n tee -a "$ROOT/.env" >/dev/null; }
          set_env TELEGRAM_BOT_TOKEN "$TOKEN"
          set_env TELEGRAM_CHAT_ID "$MASTER"
          set_env LEARNER_TELEGRAM_OUTBOUND_ONLY true
          set_env BOOT_REJECTED_OPPORTUNITY_ENABLED 1
          set_env BOOT_REJECTED_OPPORTUNITY_DIR '/home/ayman01323/BOOT/data/candidates/REJECTED OPPORTUNITY'
          set_env BOOT_REJECTED_OPPORTUNITY_CODE_ROOT /home/ayman01323/BOOT/datacentre/rejected_router
          set_env BOOT_REJECTED_SOURCE_BOT learnerbot
          sudo -n python3 "$TMP/scripts/repair_isolated_learner_reject_reporting.py" --repo "$TMP" --root "$ROOT"
          sudo -n python3 "$TMP/scripts/add_dexview_to_learner_reject_report.py" --root "$ROOT"
          sudo -n chown ayman01323:ayman01323 "$ROOT/.env" "$ROOT/learnerbot/telegram_ui.py" "$ROOT/learnerbot/solana_leader_cursor_reliability_patch.py" "$ROOT/learnerbot/rejected_opportunity_publisher.py"
          sudo -n chmod 600 "$ROOT/.env"
          PYBIN="$ROOT/.venv/bin/python"; [[ -x "$PYBIN" ]] || PYBIN=/usr/bin/python3
          PYTHONPATH="$ROOT" "$PYBIN" -m py_compile "$ROOT/learnerbot/telegram_ui.py" "$ROOT/learnerbot/solana_leader_cursor_reliability_patch.py" "$ROOT/learnerbot/rejected_opportunity_publisher.py"
          grep -q 'outbound-only mode: polling disabled' "$ROOT/learnerbot/telegram_ui.py"
          grep -q '_report_reject_actions(app, payload, actions)' "$ROOT/learnerbot/solana_leader_cursor_reliability_patch.py"
          grep -q 'https://www.dexview.com/solana/' "$ROOT/learnerbot/solana_leader_cursor_reliability_patch.py"
          sudo -n systemctl restart "$SERVICE"
          sleep 8
          test "$(systemctl is-active "$SERVICE")" = active
          test "$SOL_BEFORE" = "$(sha256sum "$ROOT/CSVbot/solana_settings.csv" | awk '{print $1}')"
          test "$USER_BEFORE" = "$(sha256sum "$ROOT/CSVbot/user_trading_settings.csv" | awk '{print $1}')"
          test "$SOURCE_BEFORE" = "$(cat "$ROOT/RESTORED_SOURCE_SHA.txt" 2>/dev/null || true)"
          cd "$ROOT"
          PYTHONPATH=. "$PYBIN" -c "from learnerbot.config import AppSettings; from learnerbot.solana_leader_cursor_reliability_patch import _send_reject_report; app=AppSettings.load(); ok=_send_reject_report(app,'$MASTER',{'mint':'Ay4WoENShiwYg4m4TSThVgiTknom4acE3XhJouQkagWx','signature':'reject-report-smoke'},{'action':'REJECT','reason':'REJECT_REPORT_SMOKE_TEST'},test_only=True); print('reject_report_telegram_smoke=PASS' if ok else 'reject_report_telegram_smoke=FAIL'); raise SystemExit(0 if ok else 1)"
          echo learner_service=active
          echo trading_settings_unchanged=PASS
          echo learner_reject_reporting=PASS
          echo dexview_link=PASS
