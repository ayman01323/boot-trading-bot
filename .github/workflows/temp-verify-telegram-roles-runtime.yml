name: TEMP Verify Telegram Roles Runtime

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 5
    steps:
      - name: Read-only BOOT status
        run: sudo /usr/local/sbin/status-boot-trading-bot
      - name: Read Telegram account startup audit
        shell: bash
        run: |
          journalctl -u learnerbot.service --since '10 minutes ago' --no-pager 2>/dev/null | grep -E '\[telegram-account\]|\[telegram-roles\]|\[telegram-command-scope\]' || true
