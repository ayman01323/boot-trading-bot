name: Temporary SiBot max-open patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-sibot-max-open-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact SiBot bridge change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('learnerbot/sibot1_solana_live_bridge_patch.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'MAX_OPEN_POSITIONS = 1\n': 'MAX_OPEN_POSITIONS = 10\n',
              'installed=true default=OFF max_open=1 ': 'installed=true default=OFF max_open=10 ',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile learnerbot/sibot1_solana_live_bridge_patch.py
          grep -n 'MAX_OPEN_POSITIONS = 10' learnerbot/sibot1_solana_live_bridge_patch.py
          grep -n 'max_open=10' learnerbot/sibot1_solana_live_bridge_patch.py
          if grep -q 'MAX_OPEN_POSITIONS = 1$' learnerbot/sibot1_solana_live_bridge_patch.py; then
            echo 'stale hard cap remains' >&2
            exit 1
          fi

      - name: Commit exact bridge change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learnerbot/sibot1_solana_live_bridge_patch.py
          git diff --cached --check
          git commit -m 'Allow up to 10 SiBot Solana LIVE positions'
          git push origin HEAD:main
