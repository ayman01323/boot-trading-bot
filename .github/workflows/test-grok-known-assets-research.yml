name: Test Grok Known Assets Research Layer
# one-shot audit trigger v2

on:
  push:
    branches:
      - integrate-grok-known-assets-research
      - main
    paths:
      - 'testingbots/grok_known_assets_bot/**'
      - '.github/workflows/test-grok-known-assets-research.yml'
  pull_request:
    paths:
      - 'testingbots/grok_known_assets_bot/**'
      - '.github/workflows/test-grok-known-assets-research.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated bot
        working-directory: testingbots/grok_known_assets_bot
        run: python -m pip install -e '.[test]'
      - name: Run isolated tests
        working-directory: testingbots/grok_known_assets_bot
        run: pytest -q
      - name: Verify PAPER-only CLI boundary
        working-directory: testingbots/grok_known_assets_bot
        run: |
          cp config.example.json config.json
          grok-known-assets-bot --config config.json --db /tmp/grok-known-assets-test.sqlite3 check
          if grok-known-assets-bot --config config.json --db /tmp/grok-known-assets-test.sqlite3 run --snapshots sample_snapshots/sol_entry.json; then
            echo 'ERROR: run without --paper unexpectedly succeeded'
            exit 1
          fi

  grok_audit_once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Trigger one-shot Grok audit')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      RELAY_VENV: /tmp/grok-known-assets-audit-venv-${{ github.run_id }}
      AI_COST_DB_PATH: /tmp/grok-known-assets-audit-cost-${{ github.run_id }}.sqlite3
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_COUNCIL_MODEL: ${{ vars.XAI_COUNCIL_MODEL || 'grok-4.20-non-reasoning' }}
    steps:
      - name: Confirm communication-only scope
        run: |
          echo 'server_access=NO'
          echo 'wallet_access=NO'
          echo 'deployment=NO'
          echo 'trading_execution=NO'
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Select pending Grok audit request
        id: mailbox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/provider_git_mailbox_bridge.py select-live \
            --repo "$GITHUB_REPOSITORY" \
            --provider grok \
            --message-output /tmp/grok-known-assets-audit-request.md \
            > /tmp/grok-known-assets-audit-meta.env
          cat /tmp/grok-known-assets-audit-meta.env
          cat /tmp/grok-known-assets-audit-meta.env >> "$GITHUB_OUTPUT"
      - name: Require pending Grok request
        if: steps.mailbox.outputs.pending != 'true'
        run: exit 1
      - name: Build isolated provider environment
        if: steps.mailbox.outputs.pending == 'true'
        run: |
          python3 -m venv "$RELAY_VENV"
          "$RELAY_VENV/bin/python" -m pip install --disable-pip-version-check -q python-dotenv
      - name: Ask Grok review-only audit
        if: steps.mailbox.outputs.pending == 'true'
        id: provider
        env:
          MESSAGE_ID: ${{ steps.mailbox.outputs.message_id }}
        run: |
          set +e
          source_sha="$(git rev-parse HEAD)"
          "$RELAY_VENV/bin/python" scripts/ai_mailbox_provider_relay.py \
            --provider grok \
            --message-id "$MESSAGE_ID" \
            --source-sha "$source_sha" \
            --input /tmp/grok-known-assets-audit-request.md \
            --output /tmp/grok-known-assets-audit-reply.md \
            2>/tmp/grok-known-assets-audit-error.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ $rc -ne 0 || ! -s /tmp/grok-known-assets-audit-reply.md ]]; then
            cat /tmp/grok-known-assets-audit-error.txt >&2 || true
            exit "$rc"
          fi
      - name: Publish Grok audit reply
        if: steps.mailbox.outputs.pending == 'true' && steps.provider.outputs.rc == '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MESSAGE_ID: ${{ steps.mailbox.outputs.message_id }}
        run: |
          python3 scripts/provider_git_mailbox_bridge.py publish-live \
            --repo "$GITHUB_REPOSITORY" \
            --provider grok \
            --request-id "$MESSAGE_ID" \
            --reply-file /tmp/grok-known-assets-audit-reply.md
      - name: Clean isolated provider environment
        if: always()
        run: rm -rf "$RELAY_VENV" /tmp/grok-known-assets-audit-*.md /tmp/grok-known-assets-audit-*.txt /tmp/grok-known-assets-audit-*.env
