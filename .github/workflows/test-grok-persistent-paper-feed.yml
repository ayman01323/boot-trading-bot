name: Test Grok Persistent Real-Feed PAPER

on:
  push:
    branches:
      - agent/grok-persistent-paper-feed
    paths:
      - 'testingbots/grok_known_assets_bot/**'
      - '.github/workflows/test-grok-persistent-paper-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-paper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated bot
        working-directory: testingbots/grok_known_assets_bot
        run: python -m pip install -e '.[test]'
      - name: Run isolated tests
        working-directory: testingbots/grok_known_assets_bot
        run: pytest -q
      - name: Compile persistent runner
        working-directory: testingbots/grok_known_assets_bot
        run: python -m compileall -q src tests
      - name: Verify PAPER boundary
        working-directory: testingbots/grok_known_assets_bot
        run: |
          cp config.example.json config.json
          grok-known-assets-bot --config config.json --db /tmp/grok-known-assets-test.sqlite3 check
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('config.json')
          cfg = json.loads(p.read_text())
          cfg['live']['enabled'] = True
          Path('/tmp/grok-live-refusal.json').write_text(json.dumps(cfg))
          PY
          if python -m grok_known_assets_bot.live_runner --config /tmp/grok-live-refusal.json --db /tmp/grok-refusal.sqlite3 --once; then
            echo 'ERROR: persistent real-feed runner accepted live.enabled=true'
            exit 1
          fi
