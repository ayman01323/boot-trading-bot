name: Test and push BotBuc now

on:
  pull_request:
    paths:
      - .github/workflows/test-push-botbuc-now.yml

jobs:
  push:
    name: Inspect rclone availability for BotBuc
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - name: Inspect runner rclone without exposing credentials
        shell: bash
        run: |
          set +e
          echo "user=$(id -un)"
          id
          echo "home=$HOME"
          command -v rclone || true
          echo "runner_config=$HOME/.config/rclone/rclone.conf"
          if [ -f "$HOME/.config/rclone/rclone.conf" ]; then
            echo "runner_rclone_config=present"
            rclone listremotes || true
          else
            echo "runner_rclone_config=missing"
          fi
          echo "root_rclone_config_readable=$([ -r /root/.config/rclone/rclone.conf ] && echo yes || echo no)"
          echo "root_backup_readable=$([ -r /root/BotBuc/$(date +%F).zip ] && echo yes || echo no)"
          exit 0
