name: Three-Agent Strategy Review

on:
  workflow_run:
    workflows: ["Weekly GPT Master Corrective Action"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: three-agent-strategy-review
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current main for orchestration
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install reviewer tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          npm install -g @openai/codex@latest @google/gemini-cli@latest
          codex --version
          gemini --version

      - name: Resolve engineering-complete strategy review base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          engineering_source="$(git show origin/ai-reviews:weekly/latest_completed_source_commit.txt | tr -d '\r\n')"
          if [[ -z "$engineering_source" ]]; then
            echo "No completed three-agent engineering audit is available; refusing to start strategy phase." >&2
            exit 2
          fi
          short="${engineering_source:0:12}"
          fix_pr="$(gh pr list --state open --base main --search "Weekly audited bot fixes ${short} in:title" --limit 1 --json number,url,headRefName,headRefOid,isDraft --jq '.[0] // empty')"
          if [[ -n "$fix_pr" ]]; then
            review_ref="$(printf '%s' "$fix_pr" | python -c 'import json,sys; print(json.load(sys.stdin)["headRefName"])')"
            source_sha="$(printf '%s' "$fix_pr" | python -c 'import json,sys; print(json.load(sys.stdin)["headRefOid"])')"
            fix_url="$(printf '%s' "$fix_pr" | python -c 'import json,sys; print(json.load(sys.stdin)["url"])')"
            base_kind="ENGINEERING_CORRECTIVE_DRAFT"
          else
            git fetch --force origin main:refs/remotes/origin/main
            review_ref="main"
            source_sha="$(git rev-parse origin/main)"
            fix_url=""
            base_kind="CURRENT_MAIN_NO_CORRECTIVE_DRAFT"
          fi
          echo "engineering_source=${engineering_source}" >> "$GITHUB_OUTPUT"
          echo "review_ref=${review_ref}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "fix_url=${fix_url}" >> "$GITHUB_OUTPUT"
          echo "base_kind=${base_kind}" >> "$GITHUB_OUTPUT"

      - name: Check out exact strategy review source
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.base.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "$SOURCE_SHA" || true
          git checkout --detach "$SOURCE_SHA"
          git clean -fdx

      - name: Fetch latest sanitised Strategy Lab evidence
        id: evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.base.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin audit-status:refs/remotes/origin/audit-status
          mkdir -p .strategy_cycle
          git show origin/audit-status:latest_loss_forensics.json > .strategy_cycle/evidence.json
          python - <<'PY' > /tmp/strategy-meta.env
          import hashlib,json,os,time
          raw=open('.strategy_cycle/evidence.json','rb').read()
          report=json.loads(raw)
          canonical=json.dumps(report,sort_keys=True,separators=(',',':'),default=str).encode()
          evidence=hashlib.sha256(canonical).hexdigest()
          source=os.environ['SOURCE_SHA']
          cycle=source[:12]+'-'+evidence[:12]
          print('EVIDENCE_SHA='+evidence)
          print('CYCLE_ID='+cycle)
          generated=int(report.get('generated_epoch') or 0)
          print('EVIDENCE_AGE='+str(max(0,int(time.time())-generated) if generated else 10**9))
          PY
          source /tmp/strategy-meta.env
          if [[ "$EVIDENCE_AGE" -gt 21600 ]]; then
            echo "Strategy evidence is older than 6 hours; refusing stale optimisation." >&2
            exit 3
          fi
          echo "evidence_sha=${EVIDENCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "cycle_id=${CYCLE_ID}" >> "$GITHUB_OUTPUT"
          echo "age=${EVIDENCE_AGE}" >> "$GITHUB_OUTPUT"

      - name: Prepare common strategy reviewer prompt
        shell: bash
        env:
          CYCLE_ID: ${{ steps.evidence.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.base.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.evidence.outputs.evidence_sha }}
          BASE_KIND: ${{ steps.base.outputs.base_kind }}
        run: |
          cat > .strategy_cycle/common_prompt.txt <<'PROMPT'
          You are one of three INDEPENDENT strategy-engineering reviewers for a multi-chain automated trading bot.
          Review the ENTIRE checked-out source and the sanitised operational evidence in .strategy_cycle/evidence.json.
          Pay special attention to strategy_lab, shadow_execution, realised net P&L, profit factor, loss magnitude,
          eligible-opportunity participation, fees/slippage/latency, execution/exit failures, sample size, market regime,
          learned profitable-wallet patterns and chain-specific Solana/EVM economics.

          The objective is durable money-weighted NET P&L after costs, NOT raw win count or forced trading. Every active
          strategy should seek eligible positive-edge opportunities, but never manufacture a trade when no edge exists.
          Review the current common strategy families and propose evidence-supported improvements/new hypotheses where useful.
          You may recommend research using Dune, DEX Screener, Etherscan V2, DefiLlama, Jupiter and public GitHub code search,
          but public code is read-only idea research and must never be executed automatically. Asset discoveries are requests
          only and must never be auto-enabled for LIVE trading.

          Forecast strategies must target positive NET edge after costs and include uncertainty/abstention, time-ordered
          validation and no look-ahead. The same strategy family may be tested on Solana and EVM only with chain-specific
          quotes, liquidity, sellability, gas/priority fees, slippage, price impact and latency assumptions.

          This phase is REPORT ONLY. Do not edit tracked code, trade, deploy, change capital/live settings, touch secrets,
          wallets/signing, or weaken any risk/executability control. Every proposed code change must begin/continue in SHADOW.

          Return a report with exactly:
          {
            "schema_version":1,
            "provider":"PROVIDER_NAME",
            "cycle_id":"CYCLE_ID_VALUE",
            "source_commit":"SOURCE_SHA_VALUE",
            "evidence_sha256":"EVIDENCE_SHA_VALUE",
            "scope":"THREE_AGENT_STRATEGY_REVIEW",
            "status":"HEALTHY|CHANGES_PROPOSED|INCOMPLETE",
            "summary":"...",
            "proposals":[{
              "id":"stable short id",
              "action":"KEEP|IMPROVE|REWORK|SHADOW_MORE|REPLACE|DORMANT|NEW_SHADOW|ASSET_REQUEST|RESEARCH_MORE",
              "strategy":"strategy/family name",
              "chain_scope":["SOLANA","EVM"],
              "evidence":[{"path":"JSON path or repository path","detail":"measured/code support"}],
              "rationale":"...",
              "expected_effect":"...",
              "downside_risk":"...",
              "shadow_test":"falsifiable test including costs and failure condition",
              "minimum_observation":"...",
              "confidence":0.0,
              "suggested_files":["only Strategy Lab/SHADOW files if code is suggested"]
            }],
            "rejected_ideas":[{"idea":"...","reason":"..."}],
            "evidence_gaps":["..."],
            "review_only":true,
            "no_live_changes":true
          }

          Prefer no change when evidence is weak. Separate existing strategy defects from new research hypotheses.
          PROMPT
          sed -i \
            -e "s/PROVIDER_NAME/PROVIDER_NAME/g" \
            -e "s/CYCLE_ID_VALUE/${CYCLE_ID}/g" \
            -e "s/SOURCE_SHA_VALUE/${SOURCE_SHA}/g" \
            -e "s/EVIDENCE_SHA_VALUE/${EVIDENCE_SHA}/g" \
            .strategy_cycle/common_prompt.txt
          printf '\nReview base kind: %s\n' "$BASE_KIND" >> .strategy_cycle/common_prompt.txt

      - name: GPT independent strategy review
        id: gpt
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_STRATEGY_AUDIT_MODEL: ${{ vars.OPENAI_STRATEGY_AUDIT_MODEL }}
          CYCLE_ID: ${{ steps.evidence.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.base.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.evidence.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          cp .strategy_cycle/common_prompt.txt /tmp/gpt-strategy-prompt.txt
          sed -i 's/PROVIDER_NAME/gpt/g' /tmp/gpt-strategy-prompt.txt
          cat >> /tmp/gpt-strategy-prompt.txt <<'PROMPT'
          Inspect the repository deeply. Write exactly .strategy_cycle/gpt.json and .strategy_cycle/gpt.md.
          Change no tracked file and do not implement recommendations in this independent-review phase.
          PROMPT
          model_args=()
          if [[ -n "${OPENAI_STRATEGY_AUDIT_MODEL:-}" ]]; then model_args=(-m "$OPENAI_STRATEGY_AUDIT_MODEL"); fi
          codex exec --sandbox workspace-write --ask-for-approval never --ephemeral "${model_args[@]}" - < /tmp/gpt-strategy-prompt.txt
          python -m learnerbot.three_agent_strategy_contract validate-agent \
            --input .strategy_cycle/gpt.json --provider gpt --cycle-id "$CYCLE_ID" \
            --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA"
          python - <<'PY'
          import subprocess,sys
          bad=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              if line[:2]=='??' and line[3:].replace('\\','/').startswith('.strategy_cycle/'):
                  continue
              bad.append(line)
          if bad:
              print('GPT strategy reviewer changed tracked/out-of-scope files:',*bad,sep='\n',file=sys.stderr); raise SystemExit(3)
          PY

      - name: Recover GPT incomplete report
        if: steps.gpt.outcome != 'success'
        env:
          CYCLE_ID: ${{ steps.evidence.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.base.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.evidence.outputs.evidence_sha }}
        run: |
          git restore --source=HEAD --staged --worktree . || true
          git clean -fd -e .strategy_cycle/ || true
          python - <<'PY'
          import json,os
          p={"schema_version":1,"provider":"gpt","cycle_id":os.environ['CYCLE_ID'],"source_commit":os.environ['SOURCE_SHA'],
             "evidence_sha256":os.environ['EVIDENCE_SHA'],"scope":"THREE_AGENT_STRATEGY_REVIEW","status":"INCOMPLETE",
             "summary":"GPT strategy review did not complete.","proposals":[],"rejected_ideas":[],
             "evidence_gaps":["Inspect workflow logs."],"review_only":True,"no_live_changes":True}
          open('.strategy_cycle/gpt.json','w').write(json.dumps(p,indent=2,sort_keys=True)+'\n')
          open('.strategy_cycle/gpt.md','w').write('# GPT strategy review\n\nINCOMPLETE\n')
          PY

      - name: Gemini independent strategy review
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_STRATEGY_MODEL: ${{ vars.GEMINI_STRATEGY_MODEL || 'pro' }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          CYCLE_ID: ${{ steps.evidence.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.base.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.evidence.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          cp .strategy_cycle/common_prompt.txt /tmp/gemini-strategy-prompt.txt
          sed -i 's/PROVIDER_NAME/gemini/g' /tmp/gemini-strategy-prompt.txt
          cat >> /tmp/gemini-strategy-prompt.txt <<'PROMPT'
          Inspect the full repository using read-only/plan tools. Do not edit files. End with exactly:
          STRATEGY_REVIEW_JSON_BEGIN
          {the required JSON object}
          STRATEGY_REVIEW_JSON_END
          PROMPT
          gemini --approval-mode plan --skip-trust --model "$GEMINI_STRATEGY_MODEL" --output-format text \
            -p "$(cat /tmp/gemini-strategy-prompt.txt)" > .strategy_cycle/gemini_stdout.txt
          python scripts/extract_strategy_report.py \
            --input .strategy_cycle/gemini_stdout.txt --output .strategy_cycle/gemini.json \
            --provider gemini --cycle-id "$CYCLE_ID" --source-commit "$SOURCE_SHA" --evidence-sha256 "$EVIDENCE_SHA"
          python - <<'PY'
          import json,subprocess,sys
          r=json.load(open('.strategy_cycle/gemini.json'))
          lines=['# Gemini strategy review','',r.get('summary','')]
          for p in r.get('proposals') or []:
              lines += ['',f"## {p.get('action')} — {p.get('strategy')}",p.get('rationale','')]
          open('.strategy_cycle/gemini.md','w').write('\n'.join(lines)+'\n')
          bad=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              if line[:2]=='??' and line[3:].replace('\\','/').startswith('.strategy_cycle/'):
                  continue
              bad.append(line)
          if bad:
              print('Gemini strategy reviewer changed tracked/out-of-scope files:',*bad,sep='\n',file=sys.stderr); raise SystemExit(3)
          PY

      - name: Recover Gemini incomplete report
        if: steps.gemini.outcome != 'success'
        env:
          CYCLE_ID: ${{ steps.evidence.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.base.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.evidence.outputs.evidence_sha }}
        run: |
          git restore --source=HEAD --staged --worktree . || true
          git clean -fd -e .strategy_cycle/ || true
          python - <<'PY'
          import json,os
          p={"schema_version":1,"provider":"gemini","cycle_id":os.environ['CYCLE_ID'],"source_commit":os.environ['SOURCE_SHA'],
             "evidence_sha256":os.environ['EVIDENCE_SHA'],"scope":"THREE_AGENT_STRATEGY_REVIEW","status":"INCOMPLETE",
             "summary":"Gemini strategy review did not complete.","proposals":[],"rejected_ideas":[],
             "evidence_gaps":["Inspect workflow logs."],"review_only":True,"no_live_changes":True}
          open('.strategy_cycle/gemini.json','w').write(json.dumps(p,indent=2,sort_keys=True)+'\n')
          open('.strategy_cycle/gemini.md','w').write('# Gemini strategy review\n\nINCOMPLETE\n')
          PY

      - name: Create or reuse Copilot strategy review issue
        id: copilot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.evidence.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.base.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.evidence.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          title="Copilot strategy review ${CYCLE_ID}"
          existing="$(gh issue list --state all --search "${title} in:title" --limit 1 --json number,state --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            issue="$existing"
            state="$(gh issue view "$issue" --json state --jq '.state')"
            if [[ "$state" == "CLOSED" ]]; then gh issue reopen "$issue"; fi
            gh issue edit "$issue" --add-assignee "@copilot"
          else
            cat > /tmp/copilot-strategy.md <<EOF
          # Third independent Strategy Lab review

          Cycle: \`${CYCLE_ID}\`  
          Exact source commit to inspect: \`${SOURCE_SHA}\`  
          Sanitised evidence SHA-256: \`${EVIDENCE_SHA}\`

          This is REPORT ONLY. Inspect the repository and the Strategy Lab architecture independently. Do not implement fixes,
          trade, deploy, alter live settings/capital, edit secrets/wallet/signing material, weaken safety gates, or auto-add assets.
          Use the same objectives as .github/copilot-instructions.md: durable net P&L after costs, money-weighted losses, execution
          quality, eligible participation without forced trading, cross-chain Solana/EVM evidence, forecasting positive net edge,
          profitable-wallet cohort research and falsifiable SHADOW tests.

          Create a PR containing exactly these two files and no other changes:
          - \`.ai/strategy/copilot/${CYCLE_ID}.json\`
          - \`.ai/strategy/copilot/${CYCLE_ID}.md\`

          JSON schema: provider=copilot, cycle_id=${CYCLE_ID}, source_commit=${SOURCE_SHA}, evidence_sha256=${EVIDENCE_SHA},
          scope=THREE_AGENT_STRATEGY_REVIEW, status=HEALTHY|CHANGES_PROPOSED|INCOMPLETE, review_only=true, no_live_changes=true,
          plus proposals using action KEEP|IMPROVE|REWORK|SHADOW_MORE|REPLACE|DORMANT|NEW_SHADOW|ASSET_REQUEST|RESEARCH_MORE.
          Every proposal must include strategy, chain_scope, concrete evidence paths/details, rationale, expected effect, downside risk,
          falsifiable shadow_test, minimum_observation, confidence 0..1 and suggested_files. Prefer no change over speculation.
          EOF
            url="$(gh issue create --title "$title" --body-file /tmp/copilot-strategy.md --assignee "@copilot")"
            issue="${url##*/}"
          fi
          echo "issue=${issue}" >> "$GITHUB_OUTPUT"

      - name: Publish GPT/Gemini strategy reports and waiting status
        env:
          CYCLE_ID: ${{ steps.evidence.outputs.cycle_id }}
          SOURCE_SHA: ${{ steps.base.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.evidence.outputs.evidence_sha }}
          ENGINEERING_SOURCE: ${{ steps.base.outputs.engineering_source }}
          REVIEW_REF: ${{ steps.base.outputs.review_ref }}
          BASE_KIND: ${{ steps.base.outputs.base_kind }}
          FIX_URL: ${{ steps.base.outputs.fix_url }}
          COPILOT_ISSUE: ${{ steps.copilot.outputs.issue }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/strategy-ai-reviews
          git worktree add --detach /tmp/strategy-ai-reviews origin/ai-reviews
          dest="/tmp/strategy-ai-reviews/strategy/runs/${CYCLE_ID}"
          mkdir -p "$dest" /tmp/strategy-ai-reviews/strategy
          cp .strategy_cycle/gpt.json "$dest/gpt.json"
          cp .strategy_cycle/gpt.md "$dest/gpt.md"
          cp .strategy_cycle/gemini.json "$dest/gemini.json"
          cp .strategy_cycle/gemini.md "$dest/gemini.md"
          python - <<PY > "$dest/context.json"
          import json
          print(json.dumps({
            "cycle_id":"${CYCLE_ID}","source_commit":"${SOURCE_SHA}","evidence_sha256":"${EVIDENCE_SHA}",
            "engineering_source_commit":"${ENGINEERING_SOURCE}","review_ref":"${REVIEW_REF}",
            "base_kind":"${BASE_KIND}","engineering_corrective_pr":"${FIX_URL}",
            "copilot_issue":"${COPILOT_ISSUE}","evidence_source":"audit-status:latest_loss_forensics.json"
          },indent=2,sort_keys=True))
          PY
          python - <<PY > /tmp/strategy-ai-reviews/strategy/latest_status.json
          import json
          g=json.load(open('.strategy_cycle/gpt.json')); m=json.load(open('.strategy_cycle/gemini.json'))
          def s(x): return 'INCOMPLETE' if x.get('status')=='INCOMPLETE' else 'DONE'
          print(json.dumps({
            "available":True,"cycle_id":"${CYCLE_ID}","source_commit":"${SOURCE_SHA}",
            "evidence_sha256":"${EVIDENCE_SHA}","state":"WAITING_FOR_COPILOT",
            "gpt":s(g),"gemini":s(m),"copilot":"WAITING","three_agent_reports_complete":False,
            "master_decision_available":False,"change_pr_url":"","live_auto_deploy":False
          },indent=2,sort_keys=True))
          PY
          printf '%s\n' "$CYCLE_ID" > /tmp/strategy-ai-reviews/strategy/latest_cycle_id.txt
          cd /tmp/strategy-ai-reviews
          git config user.name "three-agent-strategy-review-bot"
          git config user.email "three-agent-strategy-review-bot@users.noreply.github.com"
          git add strategy
          if ! git diff --cached --quiet; then
            git commit -m "Start three-agent strategy review ${CYCLE_ID}"
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            git push origin HEAD:ai-reviews
          fi

      - name: Clean review workspace
        if: always()
        run: rm -rf .strategy_cycle /tmp/strategy-ai-reviews /tmp/gpt-strategy-prompt.txt /tmp/gemini-strategy-prompt.txt
