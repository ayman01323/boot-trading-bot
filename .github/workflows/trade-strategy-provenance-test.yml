name: Trade Strategy Provenance Test

on:
  pull_request:
    paths:
      - 'learnerbot/trade_strategy_provenance_patch.py'
      - 'learnerbot/__main__.py'
      - 'tests/test_trade_strategy_provenance.py'
      - '.github/workflows/trade-strategy-provenance-test.yml'
  push:
    branches: [main]
    paths:
      - 'learnerbot/trade_strategy_provenance_patch.py'
      - 'learnerbot/__main__.py'
      - 'tests/test_trade_strategy_provenance.py'
      - '.github/workflows/trade-strategy-provenance-test.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Compile provenance code
        run: python -m py_compile learnerbot/trade_strategy_provenance_patch.py tests/test_trade_strategy_provenance.py
      - name: Run provenance regression tests
        run: pytest -x -vv tests/test_trade_strategy_provenance.py
