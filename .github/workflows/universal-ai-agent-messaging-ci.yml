name: Universal AI Agent Messaging CI

on:
  pull_request:
    paths:
      - 'AI_AGENT_MESSAGING.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'DEEPSEEK.md'
      - 'scripts/universal_agent_git_mailbox_bridge.py'
      - 'scripts/ai_agent_bus.py'
      - 'scripts/ai_agent_bus_provider_compat.py'
      - 'scripts/run_ai_agent_bus.py'
      - 'scripts/ai_agent_ws_bus.py'
      - 'scripts/ai_agent_ws_worker.py'
      - 'scripts/ai_agent_ws_send.py'
      - 'scripts/ai_agent_task_executor.py'
      - 'tests/test_universal_agent_git_mailbox_bridge.py'
      - 'tests/test_ai_agent_bus.py'
      - 'tests/test_ai_agent_task_executor.py'
      - '.github/workflows/universal-ai-bus-mailbox-signal.yml'
      - '.github/workflows/universal-ai-bus-mailbox-relay.yml'
      - '.github/workflows/universal-ai-agent-messaging-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/universal-ai-agent-messaging-ci"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -q pytest python-dotenv 'websockets>=15,<16'
          echo "VENV=$venv" >> "$GITHUB_ENV"
      - name: Compile messaging bridge and WebSocket v2 task layer
        shell: bash
        run: |
          set -euo pipefail
          "$VENV/bin/python" -m py_compile \
            scripts/universal_agent_git_mailbox_bridge.py \
            scripts/ai_agent_bus.py \
            scripts/run_ai_agent_bus.py \
            scripts/ai_agent_ws_bus.py \
            scripts/ai_agent_ws_worker.py \
            scripts/ai_agent_ws_send.py \
            scripts/ai_agent_task_executor.py \
            tests/test_universal_agent_git_mailbox_bridge.py \
            tests/test_ai_agent_task_executor.py
      - name: Run focused universal messaging tests
        shell: bash
        run: |
          set -euo pipefail
          "$VENV/bin/python" -m pytest -q \
            tests/test_universal_agent_git_mailbox_bridge.py \
            tests/test_ai_agent_bus.py \
            tests/test_ai_agent_task_executor.py
      - name: Live GPT to DeepSeek alert and reply probe
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/deepseek-alert.jsonl"
          "$VENV/bin/python" scripts/ai_agent_ws_send.py \
            --from gpt \
            --to deepseek \
            --message 'Reply exactly: DEEPSEEK_WS_ALERT_OK' \
            --message-id "gpt-to-deepseek-alert-${GITHUB_RUN_ID}" \
            --timeout 120 | tee "$out"
          grep -q 'ACKNOWLEDGED' "$out"
          grep -q 'DEEPSEEK_WS_ALERT_OK' "$out"
      - name: Live DeepSeek ws-bus-v2 bounded execution probe
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/deepseek-task.jsonl"
          "$VENV/bin/python" scripts/ai_agent_ws_send.py \
            --from gpt \
            --to deepseek \
            --task-action READ_FILE \
            --task-args-json '{"path":"AI_AGENT_MESSAGING.md"}' \
            --task-instruction 'Read this safe repository file and return execution evidence.' \
            --message-id "gpt-to-deepseek-task-${GITHUB_RUN_ID}" \
            --timeout 120 | tee "$out"
          grep -q 'ACKNOWLEDGED' "$out"
          grep -q 'ACCEPTED' "$out"
          grep -q 'EXECUTING' "$out"
          grep -q 'COMPLETED' "$out"
          grep -q 'AI_AGENT_MESSAGING.md' "$out"
      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf "$VENV"
