name: Universal AI Bus Mailbox Signal

on:
  push:
    branches: [ai-mailbox]
    paths:
      - '.github/ai-mailbox/bus-from-gpt.md'
      - '.github/ai-mailbox/bus-from-claude.md'
      - '.github/ai-mailbox/bus-from-gemini.md'
      - '.github/ai-mailbox/bus-from-deepseek.md'
      - '.github/ai-mailbox/bus-from-copilot.md'

permissions:
  contents: read

jobs:
  signal:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 2
    steps:
      - name: Signal trusted universal AI bus relay
        shell: bash
        run: |
          echo 'Universal AI bus mailbox update detected.'
          echo 'No checkout, provider call, secret read, deploy, trade, wallet action, or sudo action occurs in this signal job.'
