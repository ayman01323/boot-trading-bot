name: Universal Copilot Auth Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/universal-ai-bus-mailbox-relay.yml'
      - '.github/workflows/universal-copilot-auth-smoke.yml'
      - 'scripts/ai_agent_bus.py'
      - 'learnerbot/ai_council.py'
      - 'learnerbot/ai_council_http_patch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-smoke:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 10
    env:
      BUS_VENV: /tmp/copilot-auth-smoke-${{ github.run_id }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare bounded Copilot runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUS_VENV"
          python3 -m venv "$BUS_VENV"
          "$BUS_VENV/bin/python" -m pip install --disable-pip-version-check -q python-dotenv
          if ! command -v copilot >/dev/null 2>&1; then
            free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
            if [[ ! "$free_kb" =~ ^[0-9]+$ ]] || (( free_kb < 350000 )); then
              echo "Insufficient free runner disk for bounded Copilot CLI install." >&2
              exit 2
            fi
            prefix="$RUNNER_TEMP/copilot-auth-smoke-cli"
            rm -rf "$prefix"
            curl -fsSL https://gh.io/copilot-install | PREFIX="$prefix" bash
            echo "$prefix/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify Copilot secret presence without printing values
        id: secret
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${COPILOT_GITHUB_TOKEN:-}" ]] && echo 'github_token_present=true' >> "$GITHUB_OUTPUT" || echo 'github_token_present=false' >> "$GITHUB_OUTPUT"
          [[ -n "${COPILOT_ASSIGN_TOKEN:-}" ]] && echo 'assign_token_present=true' >> "$GITHUB_OUTPUT" || echo 'assign_token_present=false' >> "$GITHUB_OUTPUT"
          if [[ -z "${COPILOT_GITHUB_TOKEN:-}" && -z "${COPILOT_ASSIGN_TOKEN:-}" ]]; then
            echo 'No Copilot credential is configured.' >&2
            exit 1
          fi

      - name: Make one communication-only Copilot call
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          AI_COUNCIL_RUNTIME_ENV: /tmp/no-runtime-env
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/copilot-smoke.md <<'EOF'
          AI_BUS
          message_id: copilot-auth-smoke-pr381
          from: GPT
          to: COPILOT
          mode: DIRECT
          max_hops: 1

          Reply with exactly: COPILOT_AUTH_SMOKE_OK
          EOF
          "$BUS_VENV/bin/python" scripts/run_ai_agent_bus.py --input /tmp/copilot-smoke.md --output /tmp/copilot-smoke-reply.md
          grep -q '^status: COMPLETED$' /tmp/copilot-smoke-reply.md
          grep -Eq '^### COPILOT .* COMPLETED .* rc 0$' /tmp/copilot-smoke-reply.md
          grep -q 'COPILOT_AUTH_SMOKE_OK' /tmp/copilot-smoke-reply.md

      - name: Publish non-secret result
        if: always()
        shell: bash
        run: |
          {
            echo '## Copilot auth smoke'
            echo "COPILOT_GITHUB_TOKEN present: **${{ steps.secret.outputs.github_token_present || 'unknown' }}**"
            echo "COPILOT_ASSIGN_TOKEN present: **${{ steps.secret.outputs.assign_token_present || 'unknown' }}**"
            echo 'No credential values were printed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf "$BUS_VENV"
