name: USD Deploy Status Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  deploy-and-status:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    steps:
      - name: Deploy exact tested main commit
        run: sudo /usr/local/sbin/deploy-boot-trading-bot "4ffeca9a534829c908535b5e8a67c11e689c8127"
      - name: Server status
        run: sudo /usr/local/sbin/status-boot-trading-bot
