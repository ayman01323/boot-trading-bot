name: USD Deploy Status Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  deploy-and-status:
    runs-on: [self-hosted, linux, x64, boot-vps]
    timeout-minutes: 20
    steps:
      - name: Deploy exact tested main commit
        run: sudo /usr/local/sbin/deploy-boot-trading-bot "3fdb62052318eab79a7c7f8ab6bb2d783af167cd"
      - name: Server status
        run: sudo /usr/local/sbin/status-boot-trading-bot
