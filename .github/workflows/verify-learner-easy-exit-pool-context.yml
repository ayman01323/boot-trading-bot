name: Verify Learner Easy Exit and Pool Context

on:
  push:
    branches: [fix/solana-aug17-canary-restore]
    paths:
      - '.github/workflows/verify-learner-easy-exit-pool-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Read-only runtime and position verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = botgoogle
          test "$(id -un)" = ayman01323
          target=/home/ayman01323/BOOT/testingbots/learn
          service=learnerbot-learn.service

          test "$(systemctl is-active "$service")" = active
          pid1="$(systemctl show "$service" -p MainPID --value)"
          test -n "$pid1"; test "$pid1" != 0
          sleep 3
          pid2="$(systemctl show "$service" -p MainPID --value)"
          test "$pid2" = "$pid1"

          log="$(sudo -n journalctl -u "$service" --since '-10 min' --no-pager)"
          printf '%s\n' "$log" | grep -F '[solana-easy-exit] active=true' | tail -1
          printf '%s\n' "$log" | grep -F '[trading-runtime-invariant] OK' | tail -1
          printf '%s\n' "$log" | grep -F '[final-runtime-integrity] OK' | tail -1
          printf '%s\n' "$log" | grep -F '[learner-newpoll45] reporting=45s' | tail -1
          printf '%s\n' "$log" | grep -F '[learner-pool-context] active=true' | tail -1

          # Source-level policy proof without importing the root-owned runtime venv.
          TARGET="$target" python3 - <<'PY'
          import ast,os
          from pathlib import Path
          root=Path(os.environ['TARGET'])
          path=root/'learnerbot'/'solana_easy_exit_policy_patch.py'
          tree=ast.parse(path.read_text(encoding='utf-8'))
          limits=None
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  for target in node.targets:
                      if isinstance(target,ast.Name) and target.id=='EASY_EXIT_LIMITS':
                          limits=ast.literal_eval(node.value)
          assert limits
          expected={
              'stop_loss_pct':'5','take_profit_pct':'10','leader_exit_loss_cap_pct':'0',
              'break_even_trigger_pct':'3','break_even_floor_pct':'0.25',
              'trailing_trigger_pct':'5','trailing_gap_pct':'2','position_poll_seconds':'10',
          }
          for key,value in expected.items():
              actual=str(limits.get(key))
              print(f'policy_{key}={actual}')
              assert actual==value,(key,actual,value)
          invariant=(root/'learnerbot'/'trading_runtime_invariant_patch.py').read_text(encoding='utf-8')
          assert 'easy_exit_settings_active' in invariant
          assert 'leader_full_sell_immediate_inner' in invariant
          assert 'leader_partial_sell_profit_guard_inner' in invariant
          final=(root/'learnerbot'/'final_runtime_integrity_patch.py').read_text(encoding='utf-8')
          assert 'telegram_learner_pool_context_patch' in final
          print('source_policy_and_composition=PASS')
          PY

          TARGET="$target" python3 - <<'PY'
          import os,sqlite3
          from pathlib import Path
          db=Path(os.environ['TARGET'])/'data'/'solana_sibot.sqlite3'
          con=sqlite3.connect(db,timeout=2)
          rows=con.execute(
              "SELECT position_id,mint,status,unrealised_pct,leader_exit_pending,exit_reason,realised_net_sol "
              "FROM positions WHERE mode='LIVE' ORDER BY updated_at DESC LIMIT 10"
          ).fetchall()
          state_count=con.execute(
              "SELECT COUNT(*) FROM state WHERE key LIKE 'learner_pool_open:%'"
          ).fetchone()[0]
          con.close()
          print('recent_live_rows='+str(len(rows)))
          for i,row in enumerate(rows,1):
              print(
                  f'live_{i} position={row[0]} mint={row[1]} status={row[2]} '
                  f'pnl_pct={row[3]} leader_exit_pending={row[4]} exit_reason={row[5]} realised_net_sol={row[6]}'
              )
          print('persisted_pool_open_baselines='+str(state_count))
          PY

          # Relevant recent exit/liquidity markers only; no secrets or full env.
          printf '%s\n' "$log" \
            | grep -E 'Solana LIVE SELL confirmed|SOLANA_STOP_LOSS|SOLANA_TAKE_PROFIT|SOLANA_LEADER_EXIT|SOLANA_TRAILING|SOLANA_BREAK_EVEN|SOLANA_EMERGENCY|LIQUIDITY_STUCK|learner-pool-context' \
            | tail -60 || true

          echo "stable_main_pid=$pid2"
          echo 'verification_mutation=NO'
          echo 'production_service_touched=NO'
