name: Verify Learner Telegram Thread 20260829

on:
  push:
    branches:
      - diagnostics/telegram-routing-20260829
    paths:
      - '.github/workflows/verify-learner-telegram-thread-20260829.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Verify live Learner Telegram polling thread
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = botgoogle
          sudo -n bash <<'ROOT'
          set -Eeuo pipefail
          LROOT=/home/ayman01323/BOOT/testingbots/learn
          SERVICE=learnerbot-learn.service
          state=$(systemctl is-active "$SERVICE" 2>/dev/null || true)
          pid=$(systemctl show "$SERVICE" -p MainPID --value 2>/dev/null || echo 0)
          restarts=$(systemctl show "$SERVICE" -p NRestarts --value 2>/dev/null || echo unknown)
          echo "service_state=$state"
          echo "service_pid=$pid"
          echo "service_restarts=$restarts"
          test "$state" = active
          test "$pid" != 0

          echo 'THREAD_NAMES_BEGIN'
          found=0
          for f in /proc/$pid/task/*/comm; do
            [[ -r "$f" ]] || continue
            n=$(cat "$f")
            case "$n" in
              *telegram*|*Telegram*) echo "thread=$n"; found=1 ;;
            esac
          done
          echo 'THREAD_NAMES_END'
          echo "telegram_thread_found=$found"

          echo 'TELEGRAM_LOGS_BEGIN'
          journalctl -u "$SERVICE" --since '10 minutes ago' --no-pager -o cat 2>/dev/null \
            | grep -Ei 'telegram|409|Conflict|getUpdates|webhook' \
            | tail -n 100 || true
          echo 'TELEGRAM_LOGS_END'
          conflicts=$(journalctl -u "$SERVICE" --since '5 minutes ago' --no-pager -o cat 2>/dev/null \
            | grep -Eic '409 Conflict|terminated by other getUpdates|another getUpdates request' || true)
          echo "telegram_conflict_errors_last_5m=$conflicts"

          LROOT="$LROOT" python3 - <<'PY'
          import csv,json,os,pathlib,urllib.request
          root=pathlib.Path(os.environ['LROOT'])
          env={}
          for raw in (root/'.env').read_text(encoding='utf-8',errors='ignore').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              k,v=s.split('=',1); env[k.strip()]=v.strip().strip('"').strip("'")
          assert 'LEARNER_TELEGRAM_OUTBOUND_ONLY' not in env
          token=env.get('TELEGRAM_BOT_TOKEN',''); assert token
          def api(method):
              req=urllib.request.Request(f'https://api.telegram.org/bot{token}/{method}',headers={'User-Agent':'learner-thread-verify/1'})
              with urllib.request.urlopen(req,timeout=10) as r:return json.load(r)
          me=api('getMe'); wh=api('getWebhookInfo'); cmds=api('getMyCommands')
          assert me.get('ok') and (me.get('result') or {}).get('username')=='SiLearn_bot'
          assert not str((wh.get('result') or {}).get('url') or '')
          print('bot_identity=@SiLearn_bot')
          print('webhook_configured=false')
          print('commands_registered='+str(len(cmds.get('result') or [])))
          with (root/'CSVbot/solana_settings.csv').open(encoding='utf-8-sig',newline='') as f:
              d={r.get('setting'):r.get('value') for r in csv.DictReader(f)}
          assert d.get('live_trade_sol')=='0.009' and d.get('live_min_economic_trade_sol')=='0.009'
          print('trade_minimum=0.009_SOL')
          PY

          # A named Python thread is preferred evidence, but the restored CPython build
          # may not expose Python thread names in /proc. In that case rely on absence of
          # conflict plus the exact 12:40 source/config and an active stable service.
          test "$conflicts" -eq 0
          echo 'verification_complete=true'
          ROOT
