name: WebSocket Secret Connectivity Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evm-websocket:
    name: EVM WSS - ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, boot-vps]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Polygon
            host: polygon-mainnet.g.alchemy.com
          - name: Arbitrum
            host: arb-mainnet.g.alchemy.com
          - name: BNB Chain
            host: bnb-mainnet.g.alchemy.com
          - name: Base
            host: base-mainnet.g.alchemy.com
    env:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
    steps:
      - name: Prepare temporary Python environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ws-connectivity-venv"
          python3 -m venv "$RUNNER_TEMP/ws-connectivity-venv"
          "$RUNNER_TEMP/ws-connectivity-venv/bin/python" -m pip install --quiet 'websockets>=15,<16'
      - name: Test ${{ matrix.name }} newHeads subscription
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ws-connectivity-venv/bin/python" - <<'PY'
          import asyncio, json, os
          import websockets

          async def main():
              key = os.getenv("ALCHEMY_API_KEY", "").strip()
              if not key:
                  print("MISSING_SECRET: ALCHEMY_API_KEY")
                  return 2
              host = "${{ matrix.host }}"
              url = "wss://" + host + "/v2/" + key
              try:
                  async with websockets.connect(url, open_timeout=10, close_timeout=5, ping_interval=20, ping_timeout=20) as ws:
                      await ws.send(json.dumps({"jsonrpc":"2.0","id":1,"method":"eth_subscribe","params":["newHeads"]}))
                      raw = await asyncio.wait_for(ws.recv(), timeout=10)
                      msg = json.loads(raw)
                      if msg.get("error"):
                          print("SUBSCRIPTION_ERROR:", msg["error"])
                          return 3
                      if not msg.get("result"):
                          print("NO_SUBSCRIPTION_ID")
                          return 4
                      print("PASS: WSS connected and newHeads subscription accepted")
                      return 0
              except Exception as exc:
                  print("CONNECTIVITY_ERROR:", type(exc).__name__, str(exc)[:240])
                  return 5

          raise SystemExit(asyncio.run(main()))
          PY

  solana-websocket:
    name: Solana WSS - Helius logsSubscribe
    runs-on: [self-hosted, linux, x64, boot-vps]
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - name: Prepare temporary Python environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ws-connectivity-venv"
          python3 -m venv "$RUNNER_TEMP/ws-connectivity-venv"
          "$RUNNER_TEMP/ws-connectivity-venv/bin/python" -m pip install --quiet 'websockets>=15,<16'
      - name: Test Helius logsSubscribe
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ws-connectivity-venv/bin/python" - <<'PY'
          import asyncio, json, os
          import websockets

          async def main():
              key = os.getenv("HELIUS_API_KEY", "").strip()
              if not key:
                  print("MISSING_SECRET: HELIUS_API_KEY")
                  return 2
              url = "wss://mainnet.helius-rpc.com/?api-key=" + key
              try:
                  async with websockets.connect(url, open_timeout=10, close_timeout=5, ping_interval=20, ping_timeout=20) as ws:
                      await ws.send(json.dumps({"jsonrpc":"2.0","id":1,"method":"logsSubscribe","params":["all",{"commitment":"confirmed"}]}))
                      raw = await asyncio.wait_for(ws.recv(), timeout=10)
                      msg = json.loads(raw)
                      if msg.get("error"):
                          print("SUBSCRIPTION_ERROR:", msg["error"])
                          return 3
                      if not msg.get("result"):
                          print("NO_SUBSCRIPTION_ID")
                          return 4
                      print("PASS: WSS connected and logsSubscribe accepted")
                      return 0
              except Exception as exc:
                  print("CONNECTIVITY_ERROR:", type(exc).__name__, str(exc)[:240])
                  return 5

          raise SystemExit(asyncio.run(main()))
          PY
