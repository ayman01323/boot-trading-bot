name: WebSocket Secret Connectivity Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deployed-status:
    name: Deployed WebSocket status
    runs-on: [self-hosted, linux, x64, boot-vps]
    steps:
      - name: Read bounded BOOT status
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/status-boot-trading-bot
