name: WebSocket Secret Connectivity Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-websockets:
    name: Production bot WebSocket connectivity
    runs-on: [self-hosted, linux, x64, boot-vps]
    steps:
      - name: Test production .env WebSocket endpoints
        shell: bash
        run: |
          set -euo pipefail
          sudo /root/multichain-learning-bot-v2.2-fast-direct-market/.venv/bin/python - <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path

          from dotenv import load_dotenv
          import websockets

          ROOT = Path('/root/multichain-learning-bot-v2.2-fast-direct-market')
          ENV = ROOT / '.env'
          if not ENV.exists():
              print('FAIL: production .env not found')
              raise SystemExit(2)
          load_dotenv(ENV, override=True)

          def first(names):
              for name in names:
                  value = os.getenv(name, '').strip()
                  if value:
                      return value
              return ''

          def evm_url(host, url_names, key_names):
              explicit = first(url_names)
              if explicit:
                  return explicit
              key = first(key_names)
              return ('wss://' + host + '/v2/' + key) if key else ''

          async def test_evm(label, host, url_names, key_names):
              url = evm_url(host, url_names, key_names)
              if not url:
                  print(f'{label}: FAIL missing production WSS/API-key configuration')
                  return False
              try:
                  async with websockets.connect(url, open_timeout=10, close_timeout=5, ping_interval=20, ping_timeout=20) as ws:
                      await ws.send(json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_subscribe','params':['newHeads']}))
                      msg = json.loads(await asyncio.wait_for(ws.recv(), timeout=10))
                      if msg.get('error') or not msg.get('result'):
                          print(f'{label}: FAIL subscription rejected')
                          return False
                      print(f'{label}: PASS WebSocket connected + newHeads accepted')
                      return True
              except Exception as exc:
                  print(f'{label}: FAIL {type(exc).__name__}: {str(exc)[:160]}')
                  return False

          def solana_url():
              explicit = first(('SOLANA_WS_URL', 'HELIUS_WS_URL'))
              if explicit:
                  return explicit
              key = first(('HELIUS_API_KEY',))
              if key:
                  return 'wss://mainnet.helius-rpc.com/?api-key=' + key
              rpc = first(('SOLANA_RPC_URL',))
              if rpc.startswith('https://'):
                  return 'wss://' + rpc[len('https://'):]
              if rpc.startswith('http://'):
                  return 'ws://' + rpc[len('http://'):]
              if rpc.startswith(('wss://', 'ws://')):
                  return rpc
              return ''

          async def test_solana():
              url = solana_url()
              if not url:
                  print('Solana: FAIL missing production WSS/Helius/RPC configuration')
                  return False
              try:
                  async with websockets.connect(url, open_timeout=10, close_timeout=5, ping_interval=20, ping_timeout=20) as ws:
                      await ws.send(json.dumps({'jsonrpc':'2.0','id':1,'method':'logsSubscribe','params':['all',{'commitment':'confirmed'}]}))
                      msg = json.loads(await asyncio.wait_for(ws.recv(), timeout=10))
                      if msg.get('error') or not msg.get('result'):
                          print('Solana: FAIL logsSubscribe rejected')
                          return False
                      print('Solana: PASS WebSocket connected + logsSubscribe accepted')
                      return True
              except Exception as exc:
                  print(f'Solana: FAIL {type(exc).__name__}: {str(exc)[:160]}')
                  return False

          async def main():
              checks = []
              checks.append(await test_evm('Polygon', 'polygon-mainnet.g.alchemy.com', ('POLYGON_WS_URL',), ('POLYGON_ALCHEMY_API_KEY','ALCHEMY_API_KEY')))
              checks.append(await test_evm('Arbitrum', 'arb-mainnet.g.alchemy.com', ('ARBITRUM_WS_URL',), ('ARBITRUM_ALCHEMY_API_KEY','ALCHEMY_API_KEY')))
              checks.append(await test_evm('BNB Chain', 'bnb-mainnet.g.alchemy.com', ('BNB_WS_URL','BSC_WS_URL'), ('BNB_ALCHEMY_API_KEY','BSC_ALCHEMY_API_KEY','ALCHEMY_API_KEY')))
              checks.append(await test_evm('Base', 'base-mainnet.g.alchemy.com', ('BASE_WS_URL',), ('BASE_ALCHEMY_API_KEY','ALCHEMY_API_KEY')))
              checks.append(await test_solana())
              passed = sum(bool(x) for x in checks)
              print(f'RESULT: {passed}/5 WebSocket provider checks passed')
              return 0 if passed == 5 else 1

          raise SystemExit(asyncio.run(main()))
          PY
