name: Weekly Resilient Engineering Master

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: weekly-resilient-engineering-master-compat
  cancel-in-progress: false

jobs:
  delegate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delegate to Telegram-selected resilient MASTER
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run selected-ai-master.yml --ref main -f lane=engineering
          echo 'Legacy GPT-only engineering master is disabled; selected/fallback MASTER is authoritative.'
