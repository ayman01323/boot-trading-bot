name: Weekly Resilient Engineering Master

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Optional engineering source commit; defaults to latest weekly cycle'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read
  issues: read
  actions: write

concurrency:
  group: weekly-resilient-engineering-master
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install reconciliation tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          npm install -g @openai/codex@latest
          codex --version

      - name: Resolve immutable engineering cycle
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${INPUT_SOURCE:-}"
          if [[ -z "$source_sha" ]]; then
            set +e
            source_sha="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/weekly/latest_source_commit.txt?ref=ai-reviews" \
              --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null | tr -d '\r\n')"
            rc=$?
            set -e
            if [[ $rc -ne 0 || -z "$source_sha" ]]; then
              echo 'No weekly engineering cycle is available yet.'
              echo 'found=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid weekly source commit.' >&2; exit 2; }
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Collect and validate whichever agent reports are available
        if: steps.source.outputs.found == 'true'
        id: agents
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .weekly_resilient/agents
          root="weekly/runs/${SOURCE_SHA}"

          get_ai_file() {
            local path="$1" out="$2"
            set +e
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=ai-reviews" --jq '.content' 2>/dev/null \
              | tr -d '\n' | base64 -d > "$out" 2>/dev/null
            rc=$?
            set -e
            [[ $rc -eq 0 && -s "$out" ]]
          }

          get_ai_file "${root}/baseline.json" .weekly_resilient/baseline.json || echo '{}' > .weekly_resilient/baseline.json
          valid=()
          missing=()
          reasons_file=.weekly_resilient/reasons.tsv
          : > "$reasons_file"

          for provider in gpt gemini; do
            out=".weekly_resilient/agents/${provider}.json"
            if get_ai_file "${root}/${provider}.json" "$out"; then
              set +e
              python -m learnerbot.weekly_bug_audit_contract validate-agent \
                --input "$out" --provider "$provider" --source-commit "$SOURCE_SHA" >/tmp/${provider}-validate.txt 2>&1
              rc=$?
              set -e
              status="$(python - "$out" <<'PY'
          import json,sys
          try: print(str(json.load(open(sys.argv[1])).get('status') or ''))
          except Exception: print('')
          PY
              )"
              if [[ $rc -eq 0 && "$status" != 'INCOMPLETE' ]]; then
                valid+=("$provider")
                printf '%s\t%s\n' "$provider" 'valid report' >> "$reasons_file"
              else
                reason="$(python - "$out" <<'PY'
          import json,sys
          try:
              p=json.load(open(sys.argv[1])); r=p.get('refusals_or_limits') or []
              print(str((r[0] if r else p.get('summary')) or 'report incomplete/invalid')[:1000])
          except Exception as exc: print(type(exc).__name__+': '+str(exc))
          PY
                )"
                missing+=("$provider")
                printf '%s\t%s\n' "$provider" "$reason" >> "$reasons_file"
                rm -f "$out"
              fi
            else
              missing+=("$provider")
              printf '%s\t%s\n' "$provider" 'report file not available on ai-reviews' >> "$reasons_file"
              rm -f "$out"
            fi
          done

          copilot_pr=''
          copilot_head=''
          while IFS=$'\t' read -r number head; do
            [[ -n "$number" ]] || continue
            files="$(gh pr diff "$number" --name-only 2>/dev/null || true)"
            if grep -Fxq ".ai/weekly/copilot/${SOURCE_SHA}.json" <<< "$files" && \
               grep -Fxq ".ai/weekly/copilot/${SOURCE_SHA}.md" <<< "$files"; then
              count="$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')"
              if [[ "$count" == '2' ]]; then
                copilot_pr="$number"; copilot_head="$head"; break
              fi
            fi
          done < <(gh pr list --state open --limit 100 --json number,headRefOid --jq '.[] | [.number,.headRefOid] | @tsv')

          if [[ -n "$copilot_pr" ]]; then
            out=.weekly_resilient/agents/copilot.json
            set +e
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/.ai/weekly/copilot/${SOURCE_SHA}.json?ref=${copilot_head}" \
              --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > "$out" 2>/dev/null
            fetch_rc=$?
            set -e
            if [[ $fetch_rc -eq 0 && -s "$out" ]]; then
              set +e
              python -m learnerbot.weekly_bug_audit_contract validate-agent \
                --input "$out" --provider copilot --source-commit "$SOURCE_SHA" >/tmp/copilot-validate.txt 2>&1
              rc=$?
              set -e
              status="$(python - "$out" <<'PY'
          import json,sys
          try: print(str(json.load(open(sys.argv[1])).get('status') or ''))
          except Exception: print('')
          PY
              )"
              if [[ $rc -eq 0 && "$status" != 'INCOMPLETE' ]]; then
                valid+=(copilot)
                printf '%s\t%s\n' copilot "valid report in PR #${copilot_pr}" >> "$reasons_file"
              else
                missing+=(copilot)
                printf '%s\t%s\n' copilot 'Copilot PR report is incomplete or invalid' >> "$reasons_file"
                rm -f "$out"
              fi
            else
              missing+=(copilot)
              printf '%s\t%s\n' copilot 'Copilot report PR exists but report content could not be fetched' >> "$reasons_file"
              rm -f "$out"
            fi
          else
            missing+=(copilot)
            assignment=.weekly_resilient/copilot_assignment.json
            if get_ai_file "${root}/copilot_assignment_reconciled.json" "$assignment" || \
               get_ai_file "${root}/copilot_assignment.json" "$assignment"; then
              reason="$(python - "$assignment" <<'PY'
          import json,sys
          try:
              p=json.load(open(sys.argv[1])); print(str(p.get('reason') or p.get('stage') or p.get('assignment_state') or 'Copilot report not delivered')[:1000])
          except Exception as exc: print(type(exc).__name__+': '+str(exc))
          PY
              )"
            else
              reason='Copilot report PR not available yet'
            fi
            printf '%s\t%s\n' copilot "$reason" >> "$reasons_file"
          fi

          VALID_CSV="$(IFS=,; echo "${valid[*]}")"
          MISSING_CSV="$(IFS=,; echo "${missing[*]}")"
          echo "valid_csv=$VALID_CSV" >> "$GITHUB_OUTPUT"
          echo "missing_csv=$MISSING_CSV" >> "$GITHUB_OUTPUT"
          echo "count=${#valid[@]}" >> "$GITHUB_OUTPUT"
          echo "copilot_pr=$copilot_pr" >> "$GITHUB_OUTPUT"

          python - "$SOURCE_SHA" "$VALID_CSV" "$MISSING_CSV" "$reasons_file" <<'PY' > .weekly_resilient/availability.json
          import json,sys
          source,valid,missing,reasons_path=sys.argv[1:5]
          reasons={}
          for line in open(reasons_path,encoding='utf-8',errors='replace'):
              name,_,reason=line.rstrip('\n').partition('\t'); reasons[name]=reason
          print(json.dumps({
            'source_commit':source,
            'valid_agents':[x for x in valid.split(',') if x],
            'missing_agents':[x for x in missing.split(',') if x],
            'reasons':reasons,
          },indent=2,sort_keys=True))
          PY

      - name: Stop cleanly only when no valid agent exists yet
        if: steps.source.outputs.found == 'true' && steps.agents.outputs.count == '0'
        shell: bash
        run: |
          echo 'No valid engineering agent report is available yet. Scheduled reconciliation will retry.'
          cat .weekly_resilient/availability.json

      - name: Prepare partial/full master evidence
        if: steps.source.outputs.found == 'true' && steps.agents.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .weekly_master
          cp .weekly_resilient/baseline.json .weekly_master/baseline.json
          cp .weekly_resilient/availability.json .weekly_master/availability.json
          cp .weekly_resilient/agents/*.json .weekly_master/ 2>/dev/null || true

      - name: GPT master synthesis from all currently valid agents
        if: steps.source.outputs.found == 'true' && steps.agents.outputs.count != '0'
        id: synth
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_WEEKLY_SYNTH_MODEL: ${{ vars.OPENAI_WEEKLY_SYNTH_MODEL }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VALID_AGENTS: ${{ steps.agents.outputs.valid_csv }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          cat > /tmp/resilient-master-prompt.txt <<EOF
          You are the MASTER engineering adjudicator for a resilient multi-agent audit cycle.
          Source commit: ${SOURCE_SHA}
          Valid independent agents available now: ${VALID_AGENTS}

          Read .weekly_master/availability.json, .weekly_master/baseline.json and every provider JSON that exists in
          .weekly_master/. One or two agents may be unavailable. Do NOT invent their opinions. Continue the cycle using
          the valid reports. Consolidate equivalent findings and record ACCEPT, REJECT or DEFER for every material finding.
          Code truth and deterministic evidence outrank model agreement. With only one valid agent, be conservative and
          normally DEFER non-deterministic claims. Never infer profitability or weaken trading protections.

          Write exactly .weekly_master/master_decision.json and .weekly_master/master_decision.md. Change no tracked file.
          JSON must satisfy this contract:
          {
            "schema_version":1,
            "source_commit":"${SOURCE_SHA}",
            "status":"NO_ACTION|DRAFT_FIX|HUMAN_REVIEW_REQUIRED",
            "summary":"...",
            "decisions":[{
              "finding_id":"stable id",
              "source_finding_ids":["provider:id"],
              "severity":"P0|P1|P2|P3",
              "title":"...",
              "disposition":"ACCEPT|REJECT|DEFER",
              "reason":"...",
              "confidence":0.0,
              "supporting_agents":["gpt|gemini|copilot"],
              "deterministic_evidence":false,
              "risk_class":"LOW|MEDIUM|HIGH|CRITICAL",
              "allowed_files":["exact/path.py"],
              "required_tests":["specific test"]
            }],
            "implementation_allowed":false,
            "live_auto_deploy":false,
            "draft_pr_only":true
          }
          EOF
          model_args=()
          if [[ -n "${OPENAI_WEEKLY_SYNTH_MODEL:-}" ]]; then model_args=(-m "$OPENAI_WEEKLY_SYNTH_MODEL"); fi
          codex exec --sandbox workspace-write --ask-for-approval never --ephemeral "${model_args[@]}" - < /tmp/resilient-master-prompt.txt
          test -s .weekly_master/master_decision.json
          test -s .weekly_master/master_decision.md
          python -m learnerbot.weekly_bug_audit_contract gate-master \
            --input .weekly_master/master_decision.json --output .weekly_master/master_gated.json \
            --source-commit "$SOURCE_SHA" >/tmp/resilient-gate.txt

      - name: Deterministic fallback master when GPT Master is unavailable
        if: steps.source.outputs.found == 'true' && steps.agents.outputs.count != '0' && steps.synth.outcome != 'success'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$SOURCE_SHA" <<'PY'
          import glob,json,os,sys
          source=sys.argv[1]
          decisions=[]
          risk={'P0':'CRITICAL','P1':'HIGH','P2':'MEDIUM','P3':'LOW'}
          for path in sorted(glob.glob('.weekly_master/*.json')):
              name=os.path.basename(path).split('.')[0]
              if name not in {'gpt','gemini','copilot'}: continue
              p=json.load(open(path,encoding='utf-8'))
              for f in p.get('findings') or []:
                  fid=str(f.get('id') or 'finding')
                  decisions.append({
                    'finding_id':f'{name}-{fid}',
                    'source_finding_ids':[f'{name}:{fid}'],
                    'severity':str(f.get('severity') or 'P3'),
                    'title':str(f.get('title') or fid),
                    'disposition':'DEFER',
                    'reason':'GPT Master was unavailable. The cycle continued deterministically, but this finding is deferred until master adjudication can verify it.',
                    'confidence':float(f.get('confidence') or 0),
                    'supporting_agents':[name],
                    'deterministic_evidence':bool(f.get('deterministic_evidence')),
                    'risk_class':risk.get(str(f.get('severity') or 'P3'),'HIGH'),
                    'allowed_files':[],
                    'required_tests':[str(x) for x in (f.get('tests_required') or [])],
                  })
          out={
            'schema_version':1,'source_commit':source,'status':'HUMAN_REVIEW_REQUIRED',
            'summary':'Resilient fallback: at least one engineering report is valid, but GPT Master synthesis was unavailable. The cycle continued and all findings are deferred safely.',
            'decisions':decisions,'implementation_allowed':False,'live_auto_deploy':False,'draft_pr_only':True,
          }
          open('.weekly_master/master_decision.json','w',encoding='utf-8').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          open('.weekly_master/master_decision.md','w',encoding='utf-8').write('# Resilient engineering master\n\n'+out['summary']+'\n')
          PY
          python -m learnerbot.weekly_bug_audit_contract gate-master \
            --input .weekly_master/master_decision.json --output .weekly_master/master_gated.json \
            --source-commit "$SOURCE_SHA" >/tmp/resilient-gate.txt

      - name: Disable auto-fix for a single-agent partial cycle
        if: steps.source.outputs.found == 'true' && steps.agents.outputs.count == '1'
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='.weekly_master/master_gated.json'
          d=json.load(open(p,encoding='utf-8'))
          for row in d.get('decisions') or []:
              if row.get('policy_eligible'):
                  row['policy_eligible']=False
                  reasons=list(row.get('policy_reasons') or [])
                  reasons.append('single-agent resilient cycle cannot auto-implement')
                  row['policy_reasons']=reasons
          d['implementation_allowed']=False
          d['policy_accepted_count']=0
          d['partial_agent_safety_override']=True
          open(p,'w',encoding='utf-8').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY

      - name: Publish resilient master and completion state
        if: steps.source.outputs.found == 'true' && steps.agents.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VALID_AGENTS: ${{ steps.agents.outputs.valid_csv }}
          MISSING_AGENTS: ${{ steps.agents.outputs.missing_csv }}
          AGENT_COUNT: ${{ steps.agents.outputs.count }}
          COPILOT_PR: ${{ steps.agents.outputs.copilot_pr }}
          MASTER_ENGINE: ${{ steps.synth.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin ai-reviews:refs/remotes/origin/ai-reviews
          rm -rf /tmp/weekly-resilient-reviews
          git worktree add --detach /tmp/weekly-resilient-reviews origin/ai-reviews
          dest="/tmp/weekly-resilient-reviews/weekly/runs/${SOURCE_SHA}"
          mkdir -p "$dest" /tmp/weekly-resilient-reviews/weekly
          cp .weekly_master/master_decision.json "$dest/master_decision_raw.json"
          cp .weekly_master/master_gated.json "$dest/master_decision.json"
          cp .weekly_master/master_decision.md "$dest/master_decision.md"
          cp .weekly_resilient/availability.json "$dest/agent_availability.json"
          cp .weekly_master/master_gated.json /tmp/weekly-resilient-reviews/weekly/latest_master_decision.json
          python - "$SOURCE_SHA" "$VALID_AGENTS" "$MISSING_AGENTS" "$AGENT_COUNT" "$COPILOT_PR" "$MASTER_ENGINE" <<'PY' > "$dest/completion.json"
          import json,sys
          source,valid,missing,count,pr,engine=sys.argv[1:7]
          n=int(count)
          print(json.dumps({
            'source_commit':source,
            'valid_agents':[x for x in valid.split(',') if x],
            'missing_agents':[x for x in missing.split(',') if x],
            'valid_agent_count':n,
            'copilot_report_pr':int(pr) if pr.isdigit() else None,
            'three_agent_reports_complete':n==3,
            'master_decision_available':True,
            'partial_cycle':n<3,
            'cycle_continued':True,
            'master_engine':'gpt' if engine=='success' else 'deterministic_fallback',
            'live_auto_deploy':False,
          },indent=2,sort_keys=True))
          PY
          printf '%s\n' "$SOURCE_SHA" > /tmp/weekly-resilient-reviews/weekly/latest_completed_source_commit.txt
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > /tmp/weekly-resilient-reviews/weekly/latest_completed_utc.txt
          cd /tmp/weekly-resilient-reviews
          git config user.name 'resilient-engineering-master-bot'
          git config user.email 'resilient-engineering-master-bot@users.noreply.github.com'
          git add weekly
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile resilient engineering audit ${SOURCE_SHA:0:12}"
            git fetch origin ai-reviews
            git rebase origin/ai-reviews
            git push origin HEAD:ai-reviews
          fi

      - name: Dispatch canonical full corrective workflow once all three are valid
        if: steps.source.outputs.found == 'true' && steps.agents.outputs.count == '3' && steps.agents.outputs.copilot_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_PR: ${{ steps.agents.outputs.copilot_pr }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run weekly-gpt-corrective-action.yml --ref main -f copilot_pr_number="$COPILOT_PR" || true

      - name: Clean temporary files
        if: always()
        run: rm -rf .weekly_resilient .weekly_master /tmp/weekly-resilient-reviews /tmp/resilient-master-prompt.txt /tmp/resilient-gate.txt
