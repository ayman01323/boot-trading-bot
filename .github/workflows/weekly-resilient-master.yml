name: Weekly Resilient Engineering Master (Compatibility)

on:
  # Legacy compatibility entrypoint only. Automatic reconciliation is now
  # event-driven by Selected Resilient AI Master.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: weekly-resilient-engineering-master-compat
  cancel-in-progress: false

jobs:
  delegate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delegate manual compatibility request to selected MASTER
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run selected-ai-master.yml --ref main -f lane=engineering
          echo 'Legacy scheduled polling is disabled; selected/fallback MASTER is event-driven.'
