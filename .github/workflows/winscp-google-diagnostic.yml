name: WinSCP Google VM SSH Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/winscp-google-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, boot-google]
    timeout-minutes: 5
    steps:
      - name: Collect SSH and network diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=/tmp/winscp-google-ssh.txt
          user="$(whoami)"
          host="$(hostname)"
          internal_ip="$(hostname -I 2>/dev/null | awk '{print $1}')"
          external_ip="$(curl -fsS -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/access-configs/0/external-ip' 2>/dev/null || true)"
          oslogin_instance="$(curl -fsS -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/attributes/enable-oslogin' 2>/dev/null || true)"
          oslogin_project="$(curl -fsS -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/project/attributes/enable-oslogin' 2>/dev/null || true)"
          ssh_service="$(systemctl is-active ssh 2>/dev/null || systemctl is-active sshd 2>/dev/null || true)"
          ssh_listen="$(ss -lnt 2>/dev/null | awk '$4 ~ /:22$/ {print $4}' | paste -sd, -)"
          password_auth="unknown"
          pubkey_auth="unknown"
          authorized_keys_file="unknown"
          sshd_bin="$(command -v sshd || true)"
          if [[ -n "$sshd_bin" ]]; then
            cfg="$($sshd_bin -T 2>/dev/null || true)"
            password_auth="$(printf '%s\n' "$cfg" | awk '$1=="passwordauthentication"{print $2; exit}')"
            pubkey_auth="$(printf '%s\n' "$cfg" | awk '$1=="pubkeyauthentication"{print $2; exit}')"
            authorized_keys_file="$(printf '%s\n' "$cfg" | awk '$1=="authorizedkeysfile"{$1=""; sub(/^ /,""); print; exit}')"
          fi
          ak="$HOME/.ssh/authorized_keys"
          if [[ -f "$ak" ]]; then
            ak_exists=true
            ak_lines="$(grep -cve '^\s*$' "$ak" || true)"
            ak_mode="$(stat -c '%a' "$ak" 2>/dev/null || true)"
            ak_owner="$(stat -c '%U:%G' "$ak" 2>/dev/null || true)"
          else
            ak_exists=false
            ak_lines=0
            ak_mode=""
            ak_owner=""
          fi
          ssh_dir_mode="$(stat -c '%a' "$HOME/.ssh" 2>/dev/null || true)"
          ssh_dir_owner="$(stat -c '%U:%G' "$HOME/.ssh" 2>/dev/null || true)"
          {
            echo "hostname=$host"
            echo "username=$user"
            echo "home=$HOME"
            echo "internal_ip=$internal_ip"
            echo "external_ip=$external_ip"
            echo "ssh_service=$ssh_service"
            echo "ssh_listen=$ssh_listen"
            echo "password_auth=$password_auth"
            echo "pubkey_auth=$pubkey_auth"
            echo "authorized_keys_file=$authorized_keys_file"
            echo "authorized_keys_exists=$ak_exists"
            echo "authorized_keys_lines=$ak_lines"
            echo "authorized_keys_mode=$ak_mode"
            echo "authorized_keys_owner=$ak_owner"
            echo "ssh_dir_mode=$ssh_dir_mode"
            echo "ssh_dir_owner=$ssh_dir_owner"
            echo "oslogin_instance=$oslogin_instance"
            echo "oslogin_project=$oslogin_project"
            echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$out"
          cat "$out"

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/winscp-google-ssh.txt"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=server-diagnostics" || true)"
          existing_sha="$(printf '%s' "$current" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print((json.loads(s).get("sha") if s else "") or "")' 2>/dev/null || true)"
          encoded="$(base64 -w0 "$out")"
          if [[ -n "$existing_sha" ]]; then
            payload="$(python3 - "$encoded" "$existing_sha" <<'PY'
          import json,sys
          print(json.dumps({"message":"Update WinSCP Google SSH diagnostic","content":sys.argv[1],"sha":sys.argv[2],"branch":"server-diagnostics"}))
          PY
          )"
          else
            payload="$(python3 - "$encoded" <<'PY'
          import json,sys
          print(json.dumps({"message":"Create WinSCP Google SSH diagnostic","content":sys.argv[1],"branch":"server-diagnostics"}))
          PY
          )"
          fi
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$payload" >/dev/null
