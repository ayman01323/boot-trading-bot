[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multichain-learning-bot"
version = "2.2.0"
description = "Multi-user five-chain EVM learning bot with independent fast graph-first V2 market discovery and guarded automatic execution"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "web3>=7.0,<8",
  "cryptography>=42,<46"
]

[tool.setuptools.packages.find]
include = ["learnerbot*"]
