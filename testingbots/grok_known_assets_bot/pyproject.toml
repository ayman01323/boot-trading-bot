[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-known-assets-bot"
version = "0.1.0"
description = "Isolated PAPER bot for explicit allow-listed native and established meme assets"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# Only needed to run the opt-in LIVE canary orchestrator. The PAPER runner never
# imports these. The canary also needs the parent repo's `learnerbot` package on
# PYTHONPATH (GROK_BOOT_REPO_ROOT) for the audited Solana executor.
live = ["requests>=2.31", "solders>=0.21", "cryptography>=42", "base58>=2.1"]

[project.scripts]
grok-known-assets-bot = "grok_known_assets_bot.cli:main"
grok-live-canary = "grok_known_assets_bot.live_canary_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
